# SecuraCV — Canary Vision Presence Automations
#
# For Canary Vision devices (ESP32 host + Grove Vision AI V2) running
# firmware/projects/canary-vision.
#
# Included:
#   A) Dwell / interaction alert — someone lingered (dwell_started) or the
#      leave-after-dwell heuristic fired (interaction_likely)
#   B) Device offline alert — the witness stopped reporting
#
# Setup:
#   1. Copy this file to /config/automations/
#   2. Replace DEVICE_ID with your device id (default: canary_vision_001)
#   3. Replace notify.mobile_app_your_phone with your notify service
#   4. Reload automations (Developer Tools → YAML → Automations)
#
# These trigger on the firmware's raw MQTT event stream
# (securacv/<device_id>/events), so they carry the event's reason field —
# richer than watching the last_event sensor flip.

# ---------------------------------------------------------------------------
# A) Dwell / interaction alert
# ---------------------------------------------------------------------------
- id: securacv_vision_dwell_alert
  alias: "SecuraCV Vision — Lingering / Interaction"
  description: >
    Someone stayed in view past the dwell threshold, or left right after a
    qualified dwell/zone interaction (interaction_likely).
  mode: queued
  max_exceeded: silent

  trigger:
    - platform: mqtt
      topic: "securacv/DEVICE_ID/events"

  condition:
    # Guard against non-JSON / malformed payloads on the topic: anything
    # without a parsed JSON body and an event field is silently skipped.
    # The profile check keeps a litter_box-profile witness from paging you
    # about a "lingering" cat — its visits belong to the litter automations
    # (securacv_litterbox.yaml); firmware without the profile key passes as
    # room presence.
    - condition: template
      value_template: >
        {{ trigger.payload_json is defined
           and trigger.payload_json is mapping
           and 'event' in trigger.payload_json
           and trigger.payload_json.event in ['dwell_started', 'interaction_likely']
           and trigger.payload_json.get('profile', 'room_presence') != 'litter_box' }}

  action:
    - service: notify.mobile_app_your_phone
      data:
        title: >-
          {{ '👀 Lingering detected' if trigger.payload_json.event == 'dwell_started'
             else '⚠️ Interaction likely' }}
        message: >-
          {{ trigger.payload_json.device_id | default('canary-vision') }}:
          {{ trigger.payload_json.event }}
          {%- if trigger.payload_json.reason is defined %}
          ({{ trigger.payload_json.reason }})
          {%- endif %}
          — confidence {{ trigger.payload_json.confidence | default(0) }}%,
          dwell {{ ((trigger.payload_json.dwell_ms | default(0)) / 1000) | round(0) }}s
        data:
          tag: "securacv-vision-DEVICE_ID"
          group: "SecuraCV"

# ---------------------------------------------------------------------------
# B) Device offline alert — two distinct failure shapes:
#    B1: clean disconnect — the broker fires the LWT, HA marks the entity
#        unavailable.
#    B2: silent stall — the retained status still says "online" but the
#        5-second heartbeat stopped (device loop hung, WiFi jammed without
#        a TCP close). The uptime sensor changes on every heartbeat, so its
#        last_updated age is the liveness signal.
# ---------------------------------------------------------------------------
- id: securacv_vision_offline_alert
  alias: "SecuraCV Vision — Witness Offline"
  description: >
    The Canary Vision stopped reporting (LWT fired, or the heartbeat went
    stale while the retained status still reads online). A silent witness is
    itself a signal — power cut, WiFi jammed, or tampering.
  mode: single
  max_exceeded: silent

  trigger:
    # B1: LWT / availability path
    - platform: state
      entity_id: binary_sensor.securacv_canary_vision_DEVICE_ID_presence
      to: "unavailable"
      for:
        minutes: 5
      id: lwt
    # B2: stale-heartbeat path — evaluated every 5 minutes
    - platform: time_pattern
      minutes: "/5"
      id: stale_check

  condition:
    - condition: or
      conditions:
        - condition: trigger
          id: lwt
        # Heartbeat stale: the uptime sensor (refreshed every heartbeat)
        # hasn't updated in 5+ minutes, yet HA still considers it available
        # (the unavailable case is B1's job — avoids double alerts).
        - condition: template
          value_template: >
            {{ trigger.id == 'stale_check'
               and states('sensor.securacv_canary_vision_DEVICE_ID_uptime')
                   not in ['unavailable', 'unknown']
               and (now() - states.sensor.securacv_canary_vision_DEVICE_ID_uptime.last_updated).total_seconds() > 300 }}

  action:
    - service: notify.mobile_app_your_phone
      data:
        title: "🔴 SecuraCV witness offline"
        message: >-
          Canary Vision DEVICE_ID has been
          {{ 'unreachable (broker reported it offline)' if trigger.id == 'lwt'
             else 'silent — status still reads online but the heartbeat stopped' }}
          for 5+ minutes. Check power, WiFi, and the device's physical state.
        data:
          tag: "securacv-vision-offline-DEVICE_ID"
          group: "SecuraCV"
          push:
            interruption-level: time-sensitive
