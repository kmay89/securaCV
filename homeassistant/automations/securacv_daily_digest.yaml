# SecuraCV — Daily Digest Automation
#
# DEPRECATED for the Frigate/add-on pipeline: import the blueprint at
# docs/blueprints/securacv_daily_digest.yaml instead — it reads the
# kernel-computed digest sensor (sensor.pwk_daily_digest) and needs no
# entity-ID substitution. This template targets the HACS/Canary entity
# universe and remains for those devices.
#
# Sends a daily summary notification via HA Companion App.
# Covers: event counts per zone, integrity status.
#
# Setup:
#   1. Copy this file to /config/automations/ (the install script does this automatically)
#   2. Add to configuration.yaml:
#        automation: !include_dir_merge_list automations/
#   3. Restart Home Assistant
#   4. In the automation editor, update:
#      - `notify.mobile_app_YOUR_PHONE` → your actual notify service
#      - Entity IDs (replace DEVICE_ID with your device ID)
#      - The trigger time (default: 08:00)
#
# To find your notify service:
#   Developer Tools → Services → search "notify"
#
# To find entity IDs:
#   Settings → Devices & Services → SecuraCV → your device

- id: securacv_daily_digest
  alias: "SecuraCV — Daily Digest"
  description: >
    Sends a daily security summary: event counts, integrity status,
    any tamper events in the last 24 hours.
  mode: single

  trigger:
    - platform: time
      at: "08:00:00"    # Change this to your preferred time

  condition: []         # Add conditions here if needed (e.g., only on weekdays)

  action:
    - variables:
        # How many events were witnessed today?
        event_count: >
          {{ states('sensor.securacv_DEVICE_ID_witness_count') | int(0) }}

        # Is the chain valid?
        chain_ok: >
          {{ is_state('binary_sensor.securacv_DEVICE_ID_chain_valid', 'on') }}

        # Any tamper in last 24h?
        tamper_active: >
          {{ is_state('binary_sensor.securacv_DEVICE_ID_tamper', 'on') }}

        # Last event details
        last_event: >
          {{ state_attr('sensor.securacv_DEVICE_ID_last_event', 'zone') | default('—') }}

        # Integrity badge
        integrity_badge: >
          {% if is_state('binary_sensor.securacv_DEVICE_ID_chain_valid', 'on') %}
          ✅ Verified
          {% else %}
          🔴 INTEGRITY FAILURE
          {% endif %}

    - service: notify.mobile_app_YOUR_PHONE
      data:
        title: "SecuraCV Daily Summary"
        message: >
          {{ now().strftime('%A, %B %-d') }} Security Report

          Events witnessed: {{ event_count }}
          Last event zone: {{ last_event }}
          Log integrity: {{ integrity_badge }}
          {% if tamper_active %}⚠ Tamper event detected in last 24h{% endif %}
        data:
          # HA Companion App notification options
          push:
            sound: "default"
            badge: "{{ event_count }}"
          tag: "securacv-daily-digest"
          group: "securacv"
          # Tap to open SecuraCV dashboard
          url: "/lovelace/securacv"
          action_data:
            entity_id: "sensor.securacv_DEVICE_ID_last_event"

    # Also log to HA persistent notifications for reference
    - service: persistent_notification.create
      data:
        notification_id: "securacv_daily_digest"
        title: "SecuraCV Daily Digest"
        message: >
          **{{ now().strftime('%A, %B %-d') }}** —
          {{ event_count }} events witnessed.
          Integrity: {{ integrity_badge }}.
          {% if tamper_active %}⚠ Tamper event active.{% endif %}
