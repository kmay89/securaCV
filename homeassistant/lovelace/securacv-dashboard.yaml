# SecuraCV dashboard — generated by the SecuraCV dashboard strategy
#
# This is the one dashboard SecuraCV ships. It holds no entity ids: the
# strategy (custom_components/securacv/www/securacv-strategy.js, served and
# auto-loaded by the integration beside its cards) builds the dashboard from
# the entities that exist when the page opens — the chain-state header with
# Verify now and Export evidence, Today's verified timeline, one tile per
# camera (with Frigate's own picture when the Frigate integration owns
# camera.<name>), the last-24-hours digest, Health, and your Canaries. Add a
# camera to Frigate and it appears on the next load; nothing here to edit.
#
# Three ways to use it:
#
#   1. The picker (Home Assistant 2026.5 and later): Settings → Dashboards →
#      Add dashboard → Community dashboards → SecuraCV. No file needed.
#
#   2. A UI dashboard from this file: Settings → Dashboards → Add dashboard →
#      New dashboard from scratch, then open it → ⋮ → Raw configuration editor
#      and paste the `strategy:` block below.
#
#   3. A YAML-mode dashboard (what scripts/install.sh registers): copy this
#      file to /config/securacv/dashboards/ and add to configuration.yaml
#
#        lovelace:
#          dashboards:
#            securacv-witness:
#              mode: yaml
#              title: SecuraCV
#              icon: mdi:shield-check
#              filename: securacv/dashboards/securacv-dashboard.yaml
#
# Options (all optional):
#   frigate_url  Where "Open Frigate" goes. Default: the Frigate app's ingress
#                path on Home Assistant OS (/hassio/ingress/ccab4aaf_frigate);
#                for Frigate elsewhere, its full URL. Without the Supervisor
#                and without this option there is no link — never a dead one.
#   hours        How far back the Today timeline reads (default 24).
#
# Entity ids, for reference (the strategy finds them by what the integration
# says they are, not by name):
#   binary_sensor.securacv_chain_valid      on = Home Assistant verified the chain against its pinned key
#   sensor.securacv_chain_length            entries in the sealed log
#   sensor.securacv_daily_digest            rolling 24 h counts per camera and period
#   sensor.securacv_last_event              the most recent sealed event
#   event.securacv_<camera>                 one witness event entity per camera
#   button.securacv_verify_now / button.securacv_export_evidence
#   binary_sensor.securacv_frigate_link / binary_sensor.securacv_kernel_online
#   sensor.securacv_kernel_fingerprint      the pinned witness key's fingerprint, to read out by phone
# Before the integration claims the kernel, the add-on's MQTT-discovery ids
# (sensor.pwk_last_event, binary_sensor.pwk_chain_problem, …) are shown
# instead, labeled "kernel-reported" — never "verified".
#
# No custom cards available (or you prefer built-in cards only)?
# securacv-dashboard-plain.yaml is the same dashboard with built-in cards.

strategy:
  type: custom:securacv
  # frigate_url: https://frigate.local:8971/
  # hours: 24
