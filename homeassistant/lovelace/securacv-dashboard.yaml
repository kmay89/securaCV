# SecuraCV Lovelace Dashboard — Frigate / Privacy Witness Kernel pipeline
#
# Targets the entities the add-on creates automatically via MQTT Discovery
# (no manual entity-ID substitution needed):
#   binary_sensor.pwk_chain_problem   sealed-log integrity (problem class)
#   button.pwk_verify_now             one-click verification
#   sensor.pwk_daily_digest           rolling 24h summary
#   sensor.pwk_last_event             most recent witnessed event
#   sensor.pwk_<zone>_events          per-zone counters (appear per zone)
#   binary_sensor.pwk_<zone>_motion   per-zone recent activity
#
# Tip: the add-on panel (open the SecuraCV add-on Web UI) can generate this
# dashboard from your live zone list — use "Generate dashboard" there for a
# version with your per-zone cards already filled in.
#
# For ESP32 Canary devices (HACS integration), use
# securacv-canary-dashboard.yaml instead.
#
# How to add: Settings → Dashboards → Add Dashboard → From YAML,
# or paste into an existing dashboard's raw YAML editor.

title: "SecuraCV"
views:

  - title: "Witness"
    icon: "mdi:shield-check"
    path: securacv
    badges: []
    cards:

      # Banner: sealed-log integrity status
      - type: markdown
        content: >
          {% if is_state('binary_sensor.pwk_chain_problem', 'off') %}
          ### ✅ SecuraCV — Sealed log verified

          Every witnessed event is hash-chained and signed; the chain checks out.
          {% elif is_state('binary_sensor.pwk_chain_problem', 'on') %}
          ### 🔴 SecuraCV — Integrity alert

          Sealed-log verification FAILED. The log may have been altered.
          Press "Verify now" to re-check, and inspect the add-on logs.
          {% else %}
          ### ⚪ SecuraCV — Awaiting first verification

          Press "Verify now" below, or wait for the scheduled daily check.
          {% endif %}

      # Sealed log: integrity, verification, digest
      - type: entities
        title: "Sealed log"
        icon: "mdi:file-lock"
        show_header_toggle: false
        entities:
          - entity: binary_sensor.pwk_chain_problem
            name: "Log integrity"
          - entity: button.pwk_verify_now
            name: "Verify now"
          - entity: sensor.pwk_daily_digest
            name: "Events (last 24h)"
          - entity: sensor.pwk_last_event
            name: "Last event"

      # 24h digest breakdown (attributes of the digest sensor)
      - type: markdown
        title: "Last 24 hours"
        content: >
          {% set d = states.sensor.pwk_daily_digest %}
          {% if d is none or d.state in ('unknown', 'unavailable') %}
          Digest not published yet — it refreshes every 30 seconds once the
          add-on is running.
          {% else %}
          **{{ d.state }}** witnessed event(s)

          {% for zone, count in (d.attributes.per_zone | default({})).items() %}
          - {{ zone }}: {{ count }}
          {% endfor %}

          {% set p = d.attributes.per_period | default({}) %}
          {% if p %}
          _{{ p.items() | map('join', ': ') | join(' · ') }}_
          {% endif %}
          {% endif %}

      # Per-zone cards: copy this block per zone, or use the add-on panel's
      # "Generate dashboard" button to fill them in from your live zones.
      # - type: entities
      #   title: "front_door"
      #   entities:
      #     - entity: sensor.pwk_front_door_events
      #       name: "Events"
      #     - entity: binary_sensor.pwk_front_door_motion
      #       name: "Recent activity"
