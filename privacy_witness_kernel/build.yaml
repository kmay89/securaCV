# Home Assistant add-on build descriptor.
#
# The Dockerfile builds from a single multi-arch base (ghcr.io/hassio-addons/base —
# Alpine + s6-overlay + bashio) via its BUILD_FROM ARG, and the image is published
# per-arch by .github/workflows/addon-image.yml to match config.yaml's `image:` so
# the Supervisor pulls a pre-built image instead of compiling the Rust kernel
# on-device. (The same multi-arch base is listed per arch below for tooling that
# reads this file; the actual cross-arch selection is handled by buildx.)
build_from:
  amd64: ghcr.io/hassio-addons/base:14.1.3
  aarch64: ghcr.io/hassio-addons/base:14.1.3
labels:
  org.opencontainers.image.title: "Privacy Witness Kernel"
  org.opencontainers.image.description: "Privacy-preserving video surveillance that produces claims, not recordings"
  org.opencontainers.image.source: "https://github.com/kmay89/securaCV"
  org.opencontainers.image.documentation: "https://github.com/kmay89/securaCV/blob/main/privacy_witness_kernel/README.md"
  org.opencontainers.image.licenses: "See repository LICENSE"
