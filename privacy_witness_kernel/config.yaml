# Privacy Witness Kernel - Home Assistant Add-on Configuration
# https://github.com/kmay89/securaCV

name: "Privacy Witness Kernel"
description: "Privacy-preserving video surveillance that produces claims, not recordings"
version: "0.7.0"
slug: "privacy_witness_kernel"
url: "https://github.com/kmay89/securaCV"
# Pre-built multi-arch image published by .github/workflows/addon-image.yml.
# With `image:` set, the Supervisor PULLS this instead of compiling the Rust
# kernel on-device (a slow/heavy build on a Pi). {arch} is substituted by HA.
image: "ghcr.io/kmay89/{arch}-addon-privacy_witness_kernel"
arch:
  - amd64
  - aarch64
init: false
homeassistant_api: true
hassio_api: true

# Ask the Supervisor for the shared MQTT service (Mosquitto add-on) so the
# broker host/credentials can be auto-discovered at startup. `want` (not
# `need`): users with an external broker can still start the add-on.
services:
  - "mqtt:want"

# Announce the Event API to the Supervisor after startup so the SecuraCV
# integration can offer a zero-click discovered card (run.sh POSTs
# /discovery once the kernel answers /health).
discovery:
  - securacv

# Network configuration. The Event API binds inside the container so the HA
# integration reaches it over the internal add-on network at
# http://d0491a67-privacy-witness-kernel:8799 (every request needs the
# capability token from /config/api_token). The host port mapping is
# DISABLED by default — enable it in the add-on's Network settings only if
# something outside Home Assistant needs the API on your LAN.
ports:
  8799/tcp: null
ports_description:
  8799/tcp: >-
    Event API (token-required) for privacy-preserving event claims. Leave
    disabled unless a client outside Home Assistant needs it; the SecuraCV
    integration already reaches the API over the internal add-on network.

# Persistent storage
map:
  - config:rw      # For witness.db and configuration
  - share:rw       # For vault storage
  - ssl:ro         # For camera certificates if needed
  # For the wizard-generated Frigate config: the modern Frigate add-on reads
  # /addon_configs/ccab4aaf_frigate/config.yml, not /config/frigate.yml.
  - all_addon_configs:rw

# Add-on options (configurable via HA UI)
options:
  # Mode: "standalone" (process RTSP directly) or "frigate" (subscribe to Frigate events)
  mode: "standalone"

  # Frigate integration settings (used when mode=frigate).
  # Broker settings left empty are auto-discovered from the Supervisor MQTT
  # service (Mosquitto add-on); set them only for an external broker.
  # topic_prefix matches Frigate's mqtt.topic_prefix (default "frigate");
  # mqtt_topic is a legacy full-topic override that wins when set.
  frigate:
    mqtt_host: ""
    mqtt_port: 1883
    mqtt_topic: ""
    topic_prefix: "frigate"
    enable_reviews: false
    mqtt_username: ""
    mqtt_password: ""
    min_confidence: 0.5
    cameras: []
    labels: ["person", "car", "dog", "cat"]

  # Direct camera settings (used when mode=standalone)
  cameras: []
  go2rtc_discovery: true
  go2rtc_url: "http://homeassistant.local:1984"

  # MQTT event publishing with Home Assistant Discovery
  # When enabled, PWK automatically creates sensors in Home Assistant.
  # Enabled by default so events are visible in HA out of the box; broker
  # settings left empty are auto-discovered like the frigate ones above.
  mqtt_publish:
    enabled: true
    host: ""
    port: 1883
    username: ""
    password: ""
    topic_prefix: "witness"
    discovery_prefix: "homeassistant"

  # Common settings
  device_key_seed: ""
  retention_days: 7
  time_bucket_minutes: 10
  log_level: "info"
  # Hours between automatic sealed-log verifications (0 disables).
  # Keeps the chain-integrity sensor fresh without pressing "Verify Now".
  verify_interval_hours: 24

schema:
  mode: list(standalone|frigate)
  frigate:
    mqtt_host: str?
    mqtt_port: int(1,65535)?
    mqtt_topic: str?
    topic_prefix: str?
    enable_reviews: bool?
    mqtt_username: str?
    mqtt_password: password?
    min_confidence: float(0,1)?
    cameras: list(str)?
    labels: list(str)?
  cameras:
    - name: str
      url: str
      zone_id: str?
      fps: int(1,30)?
      width: int(320,3840)?
      height: int(240,2160)?
      enabled: bool?
  go2rtc_discovery: bool
  go2rtc_url: url?
  mqtt_publish:
    enabled: bool?
    host: str?
    port: int(1,65535)?
    username: str?
    password: password?
    topic_prefix: str?
    discovery_prefix: str?
  device_key_seed: str
  retention_days: int(1,365)
  time_bucket_minutes: int(5,60)
  log_level: list(debug|info|warn|error)
  verify_interval_hours: int(0,168)?

# Environment variables passed to the add-on
environment:
  RUST_LOG: "info"

# Ingress: setup wizard on first run, status panel thereafter
ingress: true
ingress_port: 8788
ingress_stream: false
panel_icon: "mdi:shield-check"
panel_title: "SecuraCV"

# Startup configuration
startup: services
boot: auto

# Security options
apparmor: true
