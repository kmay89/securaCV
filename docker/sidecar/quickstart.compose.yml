# SecuraCV sidecar quickstart — for Frigate users who ALREADY run an MQTT
# broker (most do: Frigate needs one for its own MQTT features).
# No broker yet? Use quickstart-with-broker.compose.yml instead.
#
# Three steps, nothing else:
#
#   Step 1 — Point it at your broker.
#     Edit FRIGATE_MQTT_HOST below to the broker host Frigate publishes to
#     (the `mqtt: host:` value in your frigate config). It must be the name
#     or IP as seen FROM THIS CONTAINER: if the broker runs in another
#     compose project, join its network or use the docker host's LAN IP.
#
#   Step 2 — Start it.
#     docker compose -f quickstart.compose.yml up -d
#
#   Step 3 — Check it.
#     docker compose -f quickstart.compose.yml run --rm securacv doctor
#     (The doctor also listens for a real event — walk past a camera.)
#
# That's it. A device signing key is generated on first start and persisted
# in the securacv_data volume — back it up: it is what makes the sealed log
# verifiable. Sanitized witness events appear as Home Assistant MQTT
# Discovery sensors if HA shares the same broker; without HA the sealed
# log works exactly the same and `log_verify` proves it offline.

services:
  securacv:
    image: ghcr.io/kmay89/securacv-sidecar:latest
    # Building from source instead:
    # build:
    #   context: ../..
    #   dockerfile: docker/sidecar/Dockerfile
    container_name: securacv
    restart: unless-stopped
    environment:
      FRIGATE_MQTT_HOST: "mosquitto"   # ← your broker's hostname or IP
      # FRIGATE_MQTT_PORT: "1883"
      # MQTT_USERNAME: ""
      # MQTT_PASSWORD: ""
      # FRIGATE_TOPIC_PREFIX: "frigate"   # match Frigate's mqtt.topic_prefix
      # FRIGATE_LABELS: "person,car,dog,cat"
      # FRIGATE_MIN_CONFIDENCE: "0.5"
      # RETENTION_DAYS: "7"
    volumes:
      - securacv_data:/data

volumes:
  securacv_data:
