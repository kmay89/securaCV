# SecuraCV MQTT Broker Configuration
# -----------------------------------
# Authentication is REQUIRED. Anonymous access is disabled.
#
# To set up credentials:
#   docker compose exec mosquitto mosquitto_passwd -c /mosquitto/config/passwd securacv
#
# For TLS (recommended for production):
#   1. Generate or obtain certificates
#   2. Uncomment the TLS section below
#   3. Mount certs into the container via docker-compose volumes

# Binds to 0.0.0.0 inside the container so other Compose services
# (securacv, frigate, homeassistant) can reach it via Docker networking.
# Host-side exposure is restricted to 127.0.0.1 in docker-compose.yml.
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/passwd
persistence false

# --- TLS (uncomment for production) ---
# listener 8883 0.0.0.0
# certfile /mosquitto/certs/server.crt
# keyfile /mosquitto/certs/server.key
# cafile /mosquitto/certs/ca.crt
# require_certificate false
