services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: ha-mosquitto
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_config:/mosquitto/config
    ports:
      - "127.0.0.1:1883:1883"

  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable
    container_name: ha-frigate
    depends_on:
      - mosquitto
    shm_size: "256mb"
    environment:
      # Substituted into frigate.yml's mqtt user/password placeholders.
      FRIGATE_MQTT_USER: ${MQTT_USERNAME:-securacv}
      FRIGATE_MQTT_PASSWORD: ${MQTT_PASSWORD:?set MQTT_PASSWORD in .env (see .env.example)}
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./frigate.yml:/config/config.yml:ro
      - frigate_media:/media/frigate

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: ha-core
    depends_on:
      - mosquitto
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - homeassistant_config:/config

  securacv:
    build:
      context: ../..
      dockerfile: integrations/ha_frigate_mqtt/Dockerfile
    image: securacv-ha-frigate:local
    container_name: ha-securacv
    depends_on:
      - mosquitto
      - frigate
    working_dir: /data
    environment:
      WITNESS_API_TOKEN_PATH: /data/api_token
      MQTT_BROKER_ADDR: mosquitto:1883
      MQTT_USERNAME: ${MQTT_USERNAME:-securacv}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?set MQTT_PASSWORD in .env (see .env.example)}
      FRIGATE_MQTT_TOPIC: frigate/events
      HA_DISCOVERY_PREFIX: homeassistant
      MQTT_TOPIC_PREFIX: witness
      ALLOW_REMOTE_MQTT: "true"
      DAEMON_MODE: "true"
    secrets:
      - device_key_seed
    volumes:
      - securacv_data:/data
    entrypoint: ["/bin/sh", "-c"]
    # NOTE: the script must be a single list element so it reaches `sh -c` as
    # one argument, and $$ escapes compose-level interpolation so the container
    # shell (not docker compose) expands these variables.
    command:
      - |
        set -eu
        DEVICE_KEY_SEED="$$(cat /run/secrets/device_key_seed)"
        export DEVICE_KEY_SEED
        witness_api &
        API_PID=$$!
        until [ -f "$$WITNESS_API_TOKEN_PATH" ]; do
          if ! kill -0 "$$API_PID" 2>/dev/null; then
            echo "witness_api exited before writing the token file" >&2
            exit 1
          fi
          sleep 1
        done
        frigate_bridge --db-path /data/witness.db &
        event_mqtt_bridge --daemon --api-token-path "$$WITNESS_API_TOKEN_PATH" &
        wait

secrets:
  device_key_seed:
    # Generate with: openssl rand -hex 32 > .device_key_seed
    file: .device_key_seed

volumes:
  mosquitto_data:
  mosquitto_config:
  frigate_media:
  homeassistant_config:
  securacv_data:
