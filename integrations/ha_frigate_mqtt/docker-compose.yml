services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: ha-mosquitto
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_config:/mosquitto/config
    ports:
      - "127.0.0.1:1883:1883"

  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable
    container_name: ha-frigate
    depends_on:
      - mosquitto
    shm_size: "256mb"
    environment:
      # Substituted into frigate.yml's mqtt user/password placeholders —
      # this stack's mosquitto.conf requires authentication, so Frigate
      # needs the same credentials as the securacv service below.
      FRIGATE_MQTT_USER: securacv
      FRIGATE_MQTT_PASSWORD: ${SECURACV_MQTT_PASSWORD:?set in .env or the shell}
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./frigate.yml:/config/config.yml:ro
      - frigate_media:/media/frigate

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: ha-core
    depends_on:
      - mosquitto
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - homeassistant_config:/config

  securacv:
    build:
      context: ../..
      dockerfile: docker/sidecar/Dockerfile
    image: securacv-sidecar:local
    container_name: ha-securacv
    depends_on:
      - mosquitto
      - frigate
    environment:
      FRIGATE_MQTT_HOST: mosquitto
      HA_DISCOVERY_PREFIX: homeassistant
      MQTT_TOPIC_PREFIX: witness
      # This stack's mosquitto.conf requires authentication — set the
      # credentials created in the README's quickstart step 1:
      MQTT_USERNAME: securacv
      MQTT_PASSWORD: ${SECURACV_MQTT_PASSWORD:?set in .env or the shell}
      # DEVICE_KEY_SEED is optional: when unset, the sidecar generates a key
      # on first start and persists it in the securacv_data volume. To pin
      # one instead: openssl rand -hex 32 > .device_key_seed, then uncomment
      # the secrets blocks below.
    # secrets:
    #   - device_key_seed
    volumes:
      - securacv_data:/data

# secrets:
#   device_key_seed:
#     file: .device_key_seed

volumes:
  mosquitto_data:
  mosquitto_config:
  frigate_media:
  homeassistant_config:
  securacv_data:
