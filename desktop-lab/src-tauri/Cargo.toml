[package]
name = "securacv-lab"
version = "0.2.4"
description = "SecuraCV Lab — the local-first Canary workshop"
authors = ["Errer Labs"]
license = "Apache-2.0"
repository = "https://github.com/kmay89/securaCV"
edition = "2021"
# Same Tauri 2.11 dependency graph as desktop/src-tauri, same floor (see there).
rust-version = "1.88"

# The Tauri app links the local Lab frontend (../../canary-local) into a
# native shell. See ../README.md for the architecture and roadmap.

[lib]
name = "securacv_lab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon`: the menubar fleet companion (src/companion.rs). Desktop-only
# inside tauri itself. On Linux it adds libappindicator-sys, which links
# NOTHING at build time — it dlopens libayatana-appindicator3 at runtime —
# so the release apt block is unchanged and the .deb depends on the runtime
# library instead (tauri.conf.json); without it the tray is simply absent.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# LAN fleet discovery (witness_discover): same pinned shape as the Flasher's
# (desktop/src-tauri/Cargo.toml) — rustls, JSON only, no default features.
# Local-first still means local-first: this client only ever GETs /api/fleet
# on LAN addresses the frontend hands it, never anything on the internet.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# Self-update, the same shape as the Flasher (desktop/): the updater plugin
# polls the rolling `lab-latest` release pointer, the dialog plugin asks the
# user (with the release's own notes) before anything installs, and the
# process plugin relaunches into the new version. Desktop only — an iOS /
# iPadOS build of this shell (desktop-lab/MOBILE.md) would update through the
# App Store, and the updater plugin doesn't exist there.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
# Only for the recheck timer (tauri's async runtime is tokio already).
tokio = { version = "1", features = ["time"] }
# Native USB flashing (src/flash.rs): the Flasher's ESP32 flash engine,
# shared rather than copied — desktop/flash-engine holds the catalog chip
# guard, release verification, NVS provisioning, the espflash invocation, the
# pipeline and the boot-receipt monitor, and brings `serialport` (the OS's own
# port list; libudev-sys on Linux, already in the release apt block) with it.
# Every crate it adds to this lock is pure Rust (sha2 / ed25519-dalek and
# their curve25519 tree; hub-core is std-only). Desktop only — MOBILE.md's
# contract is that generic USB serial does not exist on iOS/iPadOS, and
# Android's available_ports() reports enumeration unsupported, so mobile
# builds carry neither the engine nor the commands.
flash-engine = { path = "../../desktop/flash-engine" }
# The bundled espflash sidecar (tauri.conf.json externalBin), spawned from
# RUST only (src/flash.rs) — the same plugin the Flasher carries. The webview
# holds no shell grant (capabilities/default.json): Rust-side
# `shell().sidecar()` resolves by externalBin alone.
tauri-plugin-shell = "2"
# LAN discovery by mDNS (fleet_scan, src/fleet.rs): a real browse of
# `_securacv._tcp` — the same crate and minor as the Flasher's
# (desktop/src-tauri/Cargo.toml), pure Rust on std sockets, no -sys crate.
# The OS resolver alone can find `.local` HOSTNAMES but cannot enumerate a
# service, and vision/sense announce mDNS-only. Desktop only: an iOS browse
# needs the multicast entitlement + NSBonjourServices (MOBILE.md).
mdns-sd = "0.21"
# The menubar fleet companion's notifications (src/companion.rs), posted from
# RUST — no notification grant in the webview's capabilities. The same plugin
# the Flasher carries (desktop/src-tauri/Cargo.toml): notify-rust over zbus on
# Linux (pure Rust, no -sys crate), the OS notification center on macOS.
tauri-plugin-notification = "2"

# The tray's Linux library is loaded at RUNTIME by libappindicator-sys, which
# PANICS when it is missing — with this crate's `panic = "abort"`, a crash at
# launch on any desktop without libayatana-appindicator3. companion.rs probes
# the same names first and skips the tray instead. The same libloading the
# tray crate already links (0.7.4 in the lock): no new crate in the graph.
[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.7"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
