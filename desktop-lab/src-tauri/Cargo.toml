[package]
name = "securacv-lab"
version = "0.2.1"
description = "SecuraCV Lab — the local-first Canary workshop"
authors = ["Errer Labs"]
license = "Apache-2.0"
repository = "https://github.com/kmay89/securaCV"
edition = "2021"
rust-version = "1.77.2"

# The Tauri app links the local Lab frontend (../../canary-local) into a
# native shell. See ../README.md for the architecture and roadmap
# (native USB flashing + a menubar fleet companion come next).

[lib]
name = "securacv_lab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# LAN fleet discovery (witness_discover): same pinned shape as the Flasher's
# (desktop/src-tauri/Cargo.toml) — rustls, JSON only, no default features.
# Local-first still means local-first: this client only ever GETs /api/fleet
# on LAN addresses the frontend hands it, never anything on the internet.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Self-update, the same shape as the Flasher (desktop/): the updater plugin
# polls the rolling `lab-latest` release pointer, the dialog plugin asks the
# user (with the release's own notes) before anything installs, and the
# process plugin relaunches into the new version. Desktop only — the iOS /
# iPadOS builds (desktop-mobile-release.yml) update through the App Store,
# and the updater plugin doesn't exist there.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
# Only for the recheck timer (tauri's async runtime is tokio already).
tokio = { version = "1", features = ["time"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
