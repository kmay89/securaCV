[package]
name = "securacv-lab"
version = "0.1.2"
description = "SecuraCV Lab — the local-first Canary workshop"
authors = ["Errer Labs"]
license = "Apache-2.0"
repository = "https://github.com/kmay89/securaCV"
edition = "2021"
rust-version = "1.77.2"

# The Tauri app links the local Lab frontend (../../canary-local) into a
# native shell. See ../README.md for the architecture and roadmap
# (native USB flashing + a menubar fleet companion come next).

[lib]
name = "securacv_lab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
