<!DOCTYPE html>
<html lang="en">
<!-- canary-local/emulator/web/harness.html — bare bench for the wasm
     firmware: boots the watch flavor, stages the demo fleet, and exposes
     window.__emu for the Playwright boot test. Not the product page —
     just the oscilloscope. Serve the repo root over http and open
     /canary-local/emulator/web/harness.html?flavor=watch -->
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' ipc: http://ipc.localhost; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>canary.local — emulator harness</title>
  <link rel="stylesheet" href="harness.css" />
</head>
<body>
  <h3>canary.local emulator harness</h3>
  <div id="row">
    <div>
      <canvas id="glass" width="240" height="240"></canvas>
      <div id="controls">
        <!-- data-emu names the emulator call, data-arg its argument; harness.js
             delegates the clicks. No onclick= — the page carries the same
             no-inline-script CSP as the product pages. -->
        <button data-emu="wifi" data-arg="0">wifi down</button>
        <button data-emu="wifi" data-arg="1">wifi up</button>
        <button data-emu="broker" data-arg="0">broker down</button>
        <button data-emu="broker" data-arg="1">broker up</button>
        <button data-emu="time" data-arg="60">time ×60</button>
        <button data-emu="time" data-arg="1">time ×1</button>
      </div>
      <div id="status"></div>
    </div>
    <div id="serial"></div>
  </div>

  <script type="module" src="harness.js"></script>
</body>
</html>
