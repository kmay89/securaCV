<!DOCTYPE html>
<html lang="en">
<!-- canary-local/emulator/web/harness.html — bare bench for the wasm
     firmware: boots the watch flavor, stages the demo fleet, and exposes
     window.__emu for the Playwright boot test. Not the product page —
     just the oscilloscope. Serve the repo root over http and open
     /canary-local/emulator/web/harness.html?flavor=watch -->
<head>
  <meta charset="utf-8" />
  <title>canary.local — emulator harness</title>
  <style>
    body { background: #101014; color: #ddd; font: 14px/1.4 monospace; margin: 20px; }
    #glass { image-rendering: pixelated; background: #000; }
    .round { border-radius: 50%; }
    #row { display: flex; gap: 24px; align-items: flex-start; }
    #serial { width: 640px; height: 480px; overflow-y: scroll; white-space: pre-wrap;
              background: #05050a; border: 1px solid #333; padding: 8px; font-size: 11px; }
    button { margin: 2px; }
  </style>
</head>
<body>
  <h3>canary.local emulator harness</h3>
  <div id="row">
    <div>
      <canvas id="glass" width="240" height="240"></canvas>
      <div id="controls">
        <button onclick="__emu.setWifi(false)">wifi down</button>
        <button onclick="__emu.setWifi(true)">wifi up</button>
        <button onclick="__emu.setBroker(false)">broker down</button>
        <button onclick="__emu.setBroker(true)">broker up</button>
        <button onclick="__emu.setTimeScale(60)">time ×60</button>
        <button onclick="__emu.setTimeScale(1)">time ×1</button>
      </div>
      <div id="status"></div>
    </div>
    <div id="serial"></div>
  </div>

  <script src="../dist/canary-display-watch.js"></script>
  <script type="module">
    import { CanaryEmulator, demoFleet } from "./emu-shell.js";

    const serial = document.getElementById("serial");
    const state = { booted: false, flushes: 0, serialText: "", mqtt: [] };
    window.__state = state;

    const emu = new CanaryEmulator(window.createCanaryEmuWatch, {
      canvas: document.getElementById("glass"),
      onSerial: (t) => {
        state.serialText += t;
        serial.textContent = state.serialText.slice(-20000);
        serial.scrollTop = serial.scrollHeight;
      },
      onDisplayReady: (w, h, round) => {
        if (round) document.getElementById("glass").classList.add("round");
      },
      onFrame: () => { state.flushes++; },
      onMqtt: (m) => { state.mqtt.push(m); },
      onBacklight: (glow) => {
        document.getElementById("glass").style.filter = `brightness(${Math.max(0.05, glow)})`;
      },
      onNetEvent: (k, d) => { state.mqtt.push({ dir: "net", topic: k, payload: d }); },
      onReboot: () => location.reload(),
    });
    window.__emu = emu;

    const q = new URLSearchParams(location.search);
    await emu.start({
      provisioned: q.get("provisioned") !== "0",
      firstMeeting: q.get("meet") === "1",
      seed: 1234,
    });
    if (q.get("hour") !== null) emu.setLocalHour(Number(q.get("hour")));
    state.booted = true;

    const fleet = demoFleet();
    window.__fleet = fleet;
    for (const w of fleet) await emu.addWitness(w);
    emu.startFleetHeartbeat(15000);

    document.getElementById("status").textContent = "booted; fleet staged";
    window.__ready = true;
  </script>
</body>
</html>
