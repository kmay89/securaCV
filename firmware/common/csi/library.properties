name=SecuraCV CSI
version=0.4.0
author=SecuraCV Contributors
maintainer=SecuraCV
sentence=Privacy-preserving WiFi Channel State Information sensing for ESP32-S3.
paragraph=Captures WiFi CSI on ESP32 / ESP32-S3 / ESP32-C3 and, through one ESP-IDF config shim, the ESP32-C6 / C5 Wi-Fi 6 parts (compile-verified against every IDF struct shape, bench-unverified on C6); canonicalizes every frame to the 52 L-LTF tones; keeps a solo device supplied with frames by pinging the gateway; scrubs identifiers at the interrupt boundary, and exports a 32-dimension int8 feature vector once per second covering motion, breathing, RSSI statistics, and frame-rate health. Designed to be consumed by either the SecuraCV Canary firmware or any third-party Arduino sketch as a clean drop-in library. Includes a modular sensing pipeline (csi_module_t), a privacy-class-tagged event chokepoint, and a 10-minute sliding-window event bundler.
category=Sensors
url=https://github.com/kmay89/securacv
architectures=esp32
includes=csi_hal.h,csi_features.h,csi_types.h,csi_subcarriers.h,csi_idf_compat.h,csi_traffic.h,csi_module.h,csi_event.h,csi_bundler.h,csi_witness_payload.h,core_presence.h,core_breathing.h,core_activity_ribbon.h,meta_daily_summary.h,meta_quiet_hours.h,anomaly_baseline.h,ble_events_module.h,csi_probe.h
