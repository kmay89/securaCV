; ============================================================================
; SecuraCV Canary Display Project
; ============================================================================
;
; The fleet's face: two glanceable status displays that subscribe to the
; Canaries' MQTT topics and render fleet state without a phone in the loop.
;
;   canary-display-watch   1.28" round glance puck (bedside/desk)
;   canary-display-dash    4.3" 800x480 dashboard (front door/kitchen)
;
; Build:
;   pio run -e canary-display-watch    # glance puck
;   pio run -e canary-display-dash     # 4.3" dashboard
;   pio run -e canary-display-watch-debug
;
; Monitor:
;   pio device monitor -b 115200
;

[platformio]
; Include shared environment definitions
extra_configs =
    ../../envs/platformio/platforms.ini
    ../../envs/platformio/common.ini
    ../../envs/platformio/canary-display.ini

; Default environment
default_envs = canary-display-watch

; Source directory
src_dir = src

; Include directory
include_dir = include

[env]
; Common settings for this project. NOTE: build_flags set here would be
; OVERRIDDEN (not merged) by the named envs in envs/platformio/, so include
; paths live there; include/ itself is added automatically via include_dir.
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
