# Arduino sketch build profiles for the SecuraCV Canary Display.
#
# One sketch, two flavors — exactly like the PlatformIO tree (one app,
# two envs). Each profile carries the board FQBN, platform pin, and library
# set, so a build is reproducible independent of what's installed globally.
#
#   arduino-cli : arduino-cli compile --profile watch-core3
#                 arduino-cli upload  --profile watch-core3 -p /dev/ttyACM0
#                 (auto-installs the pinned core + libraries, isolated)
#
#   Arduino IDE : profiles are NOT read by the IDE (arduino-ide#2573 —
#                 a CLI-only feature). IDE users install the core +
#                 libraries below via Boards/Library Manager and set the
#                 board options in Tools — the README's step-by-step
#                 mirrors this file's pins exactly.
#
# ── Core version matrix ─────────────────────────────────────────────────────
# The sketch builds on BOTH arduino-esp32 major lines; the source carries the
# compatibility shims (hal/core_compat.h + the NimBLE gate in chirp_scan.cpp).
# What changes per line is the LIBRARY SET, because two dependencies split
# their majors along the core boundary:
#
#   core 2.0.17 (matches PlatformIO / espressif32 @ 6.9.0 — the bench-
#   validated release path):
#     GFX Library for Arduino 1.4.9   (1.5+ needs core 3)
#     NimBLE-Arduino 1.4.3            (2.x needs core 3 / IDF 5)
#
#   core 3.x (the Boards Manager default — pick this if you just installed
#   the esp32 platform and don't want to downgrade):
#     GFX Library for Arduino 1.6.6   (does NOT build on core 2)
#     NimBLE-Arduino 2.5.0            (does NOT build on core 2)
#
# Mixing lines (core 3 + GFX 1.4.9, or core 2 + NimBLE 2.x) fails the build —
# always switch profiles, never edit a single library pin.
#
# No `default_profile:` on purpose — that pushes plain `arduino-cli compile`
# into profile mode and makes it reject the explicit --fqbn / --libraries the
# CI build passes. Opt in via --profile (or the IDE dropdown).
#
# ── Zero setup ──────────────────────────────────────────────────────────────
# A raw GitHub zip compiles as-is: the committed flavor dispatchers infer
# the flavor from the selected BOARD (XIAO -> watch, ESP32S3 Dev Module ->
# dash), so these profiles — and the IDE's Tools->Board menu — always build
# the firmware that matches the hardware. Missing WiFi credentials hand off
# to the on-glass onboarding wizard. Explicit override: flavor_local.h
# (written by `./setup.sh arduino <flavor>`).

profiles:
  # ── Canary Watch: XIAO ESP32-S3 + Seeed Round Display (GC9A01 240x240) ──
  watch:
    notes: XIAO ESP32-S3 + Round Display — arduino-esp32 2.0.17 (PlatformIO-matched)
    fqbn: esp32:esp32:XIAO_ESP32S3:PSRAM=opi,CDCOnBoot=default,USBMode=hwcdc
    platforms:
      - platform: esp32:esp32 (2.0.17)
        platform_index_url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
    libraries:
      - GFX Library for Arduino (1.4.9)
      - lvgl (8.4.0)
      - PubSubClient (2.8.0)
      - Crypto (0.4.0)
      - ArduinoJson (7.4.3)
      - NimBLE-Arduino (1.4.3)

  watch-core3:
    notes: XIAO ESP32-S3 + Round Display — arduino-esp32 3.x (Boards Manager default)
    fqbn: esp32:esp32:XIAO_ESP32S3:PSRAM=opi,CDCOnBoot=default,USBMode=hwcdc
    platforms:
      - platform: esp32:esp32 (3.3.10)
        platform_index_url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
    libraries:
      - GFX Library for Arduino (1.6.6)
      - lvgl (8.4.0)
      - PubSubClient (2.8.0)
      - Crypto (0.4.0)
      - ArduinoJson (7.4.3)
      - NimBLE-Arduino (2.5.0)

  # ── Canary Dash: ESP32-S3 (devkit profile) + Waveshare 4.3" 800x480 RGB ──
  dash:
    notes: Waveshare 4.3B (generic ESP32-S3 board) — arduino-esp32 2.0.17 (PlatformIO-matched)
    # huge_app (3 MB app) is a built-in scheme valid on the generic esp32s3
    # board; production uses the custom 16 MB A/B table in the PlatformIO tree.
    fqbn: esp32:esp32:esp32s3:PSRAM=opi,FlashSize=16M,PartitionScheme=huge_app,CDCOnBoot=default,USBMode=hwcdc
    platforms:
      - platform: esp32:esp32 (2.0.17)
        platform_index_url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
    libraries:
      - GFX Library for Arduino (1.4.9)
      - lvgl (8.4.0)
      - PubSubClient (2.8.0)
      - Crypto (0.4.0)
      - ArduinoJson (7.4.3)
      - NimBLE-Arduino (1.4.3)

  dash-core3:
    notes: Waveshare 4.3B (generic ESP32-S3 board) — arduino-esp32 3.x (Boards Manager default)
    fqbn: esp32:esp32:esp32s3:PSRAM=opi,FlashSize=16M,PartitionScheme=huge_app,CDCOnBoot=default,USBMode=hwcdc
    platforms:
      - platform: esp32:esp32 (3.3.10)
        platform_index_url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
    libraries:
      - GFX Library for Arduino (1.6.6)
      - lvgl (8.4.0)
      - PubSubClient (2.8.0)
      - Crypto (0.4.0)
      - ArduinoJson (7.4.3)
      - NimBLE-Arduino (2.5.0)
