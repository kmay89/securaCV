# Arduino sketch build profiles for the SecuraCV Canary Display.
#
# One sketch, two flavors — exactly like the PlatformIO tree (one app,
# two envs). Pick the profile that matches your hardware; it carries the
# board FQBN, the flavor #define, and the library set so the essential
# settings travel with the sketch instead of living in per-IDE preferences.
#
#   Arduino IDE 2.3+ : open canary_display.ino, pick "watch" or "dash" from
#                      the profile dropdown in the toolbar.
#   arduino-cli      : arduino-cli compile --profile watch
#                      arduino-cli upload  --profile watch -p /dev/ttyACM0
#
# ── CRITICAL: arduino-esp32 core 2.0.x, NOT 3.x ────────────────────────────
# The display renderer pins `moononournation/GFX Library for Arduino @ 1.4.9`
# and LVGL v8. GFX 1.5+ and the current LVGL line need arduino-esp32 core 3.x
# (esp32-hal-periman.h et al.), and conversely GFX 1.4.9 does NOT build on
# core 3.x. So these profiles pin the esp32 platform to the 2.0.x line — the
# same core the PlatformIO env resolves (espressif32 @ 6.9.0). Installing core
# 3.x (the Boards Manager default) will fail the build; this pin prevents that.
#
# No `default_profile:` on purpose — that pushes plain `arduino-cli compile`
# into profile mode and makes it reject the explicit --fqbn / --libraries the
# CI build passes. Opt in via --profile (or the IDE dropdown).
#
# Before the first build, generate + stage the flat sketch for your flavor:
#   cd firmware/projects/canary-display && ./setup.sh arduino watch   # or dash

profiles:
  # ── Canary Watch: XIAO ESP32-S3 + Seeed Round Display (GC9A01 240x240) ──
  watch:
    notes: XIAO ESP32-S3 on the Round Display for XIAO — 8 MB flash, OPI PSRAM
    fqbn: esp32:esp32:XIAO_ESP32S3:PSRAM=opi,FlashSize=8M,PartitionScheme=default_8MB,CDCOnBoot=default,USBMode=hwcdc
    platforms:
      - platform: esp32:esp32 (2.0.17)
        platform_index_url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
    # GFX pinned to 1.4.9 EXACT (see the core-version note above). LVGL v8.
    libraries:
      - GFX Library for Arduino (1.4.9)
      - lvgl (8.4.0)
      - PubSubClient
      - Crypto
      - ArduinoJson
      - NimBLE-Arduino (1.4.3)

  # ── Canary Dash: ESP32-S3 (devkit profile) + Waveshare 4.3" 800x480 RGB ──
  dash:
    notes: ESP32-S3-DevKitC-1 profile for the Waveshare 4.3B — 16 MB flash, OPI PSRAM
    fqbn: esp32:esp32:esp32s3:PSRAM=opi,FlashSize=16M,PartitionScheme=default_16MB,CDCOnBoot=default,USBMode=hwcdc
    platforms:
      - platform: esp32:esp32 (2.0.17)
        platform_index_url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
    libraries:
      - GFX Library for Arduino (1.4.9)
      - lvgl (8.4.0)
      - PubSubClient
      - Crypto
      - ArduinoJson
      - NimBLE-Arduino (1.4.3)
