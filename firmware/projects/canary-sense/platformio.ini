; ============================================================================
; SecuraCV Canary Sense Project
; ============================================================================
;
; 60GHz mmWave radar presence (and optional wellbeing vitals) witness on the
; Seeed MR60BHA2 kit (XIAO ESP32-C6 host). Phase 2 complete: the full
; net/witness/OTA stack — supervised WiFi STA, MQTT + HA discovery, Ed25519
; signed witness chain, signed pull-OTA, and the _securacv._tcp mDNS fleet
; advert. Hardware bench validation is still pending (see README checklist).
;
; Build:
;   pio run                          # Build default environment
;   pio run -e canary-sense-wellbeing # Build with vitals (-DCANARY_SENSE_VITALS)
;   pio run -e canary-sense-debug    # Build with verbose logging
;   pio run -t upload                # Build and upload
;
; Monitor:
;   pio device monitor -b 115200
;

[platformio]
; Include shared environment definitions
extra_configs =
    ../../envs/platformio/platforms.ini
    ../../envs/platformio/common.ini
    ../../envs/platformio/canary-sense.ini

; Default environment
default_envs = canary-sense-default

; Source directory
src_dir = src

; Include directory
include_dir = include

[env]
; Common settings for this project. NOTE: build_flags set here would be
; OVERRIDDEN (not merged) by the named envs in envs/platformio/, so include
; paths live there; include/ itself is added automatically via include_dir.
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
