; ============================================================================
; SecuraCV Canary Sentinel Project — multi-sensor fusion guardian
; ============================================================================
;
; Thin composition wrapper (firmware/ARCHITECTURE.md): selects the build
; environments defined in envs/platformio/canary-sentinel.ini. One host-tested
; fusion brain (firmware/common/fusion), three tiers, five presets.
;
; Build:
;   pio run -e canary-sentinel-door        # Standard, front-door preset
;   pio run -e canary-sentinel-window      # Standard, window preset
;   pio run -e canary-sentinel-hallway     # Standard, hallway/occupancy preset
;   pio run -e canary-sentinel-lite        # Lite tier (C3, no radar)
;   pio run -e canary-sentinel-demo-head   # Heavy sensor head (perimeter demo)
;   pio run -e canary-sentinel-door -t upload
;   pio device monitor -b 115200
;
; The novel core is verified without hardware: `make -C firmware/tests_host`
; builds + runs the fusion + preset host suites. The on-device net/witness/OTA
; path is Phase 1 (see README.md checklist).

[platformio]
extra_configs =
    ../../envs/platformio/platforms.ini
    ../../envs/platformio/common.ini
    ../../envs/platformio/canary-sentinel.ini

default_envs = canary-sentinel-door

src_dir = src
include_dir = include

[env]
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
