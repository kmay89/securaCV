; ═══════════════════════════════════════════════════════════════
; SecuraCV Canary — PlatformIO Build Configuration
; ═══════════════════════════════════════════════════════════════
;
; Build Optimization for Fast Iteration:
; - Modular library components for incremental builds
; - ESP-IDF component trimming (no Bluetooth compile)
; - Debug/Release profiles with appropriate optimization levels
; - OTA-compatible partition layout
;
; Usage:
;   pio run                       # Default dev build
;   pio run -e dev                # Dev build with verbose logging
;   pio run -e release            # Production build
;   pio run -e dev_ha             # Dev + Home Assistant MQTT
;   pio run -e release_ha         # Production + Home Assistant
;   pio run -e minimal            # Crypto/GPS only (fastest build)
;   pio run -e dev -t upload      # Build and flash via USB
;
; ═══════════════════════════════════════════════════════════════

[platformio]
default_envs = dev
; The espressif32 / pioarduino platform pins live in ONE file; every env's
; `platform =` interpolates a section from it (firmware/PLATFORMS.md).
extra_configs = ../envs/platformio/platforms.ini
extra_scripts = pre:../../scripts/pre_build.py

; ─── Shared settings ──────────────────────────────────────────
[env]
platform = ${platform_canary.platform}
board = seeed_xiao_esp32s3
framework = arduino
board_build.partitions = partitions_ota.csv
board_build.arduino.memory_type = qio_opi

; Core libraries (always included)
lib_deps =
    rweather/Crypto @ ^0.4.0
    bblanchon/ArduinoJson @ ^7.0.0

; Board-specific build flags (always applied)
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Project include/ dir must be visible to lib/ components (canary_config.h, log_level.h)
    -I${PROJECT_DIR}/include
    ; Common CSI module pipeline + chokepoint + bundler headers (Tier 4 #9).
    ; The canary HAL keeps capturing CSI via lib/securacv_csi/; the headers
    ; below add the cross-product module registry, privacy chokepoint, and
    ; 10-min sliding-window bundler that already ship in canary-wap.
    -I${PROJECT_DIR}/../common/csi/src
    ; Shared firmware/common headers (gnss/gps_privacy.h, identity/device_pseudonym.h)
    -I${PROJECT_DIR}/../common
    ; Canonical fleet-link presence beacon wire format (firmware/common/fleet_link).
    ; Makes <fleet_beacon.h> resolvable for securacv_ble_status's direct BLE
    ; presence beacon — byte-identical to the canary-wap copy (drift-guarded by
    ; firmware/scripts/check_fleet_beacon_sync.sh). Header-only, so a plain -I is
    ; all that's needed; harmless in envs where FEATURE_BLE_STATUS is off (the
    ; only include site is #if FEATURE_BLE_STATUS in securacv_ble_status.cpp).
    -I${PROJECT_DIR}/../common/fleet_link
    ; Signed pull-OTA engine (manifest pull, Ed25519 verify, A/B rollback).
    ; The .cpp is pulled in via build_src_filter below; FEATURE_OTA_PULL
    ; gates all call sites so envs that exclude it still compile.
    -I${PROJECT_DIR}/../common/ota/src
    ; XIAO ESP32S3 Sense SD card pins
    -DSD_CS_PIN=21
    -DSD_SCK_PIN=7
    -DSD_MISO_PIN=8
    -DSD_MOSI_PIN=9
    ; GPS UART pins
    -DGPS_RX_PIN=44
    -DGPS_TX_PIN=43
    ; BLE GATT status service requires NimBLE — default OFF, enabled in [env:full]
    -DFEATURE_BLE_STATUS=0

; Pull only the module-pipeline .cpp files from firmware/common/csi/src/
; into the canary build. csi_hal.cpp and csi_features.cpp are intentionally
; omitted because canary's lib/securacv_csi/ already provides those — building
; both would double-register esp_wifi_set_csi_rx_cb and crash at boot.
build_src_filter =
    +<*>
    +<../../common/csi/src/csi_event.cpp>
    +<../../common/csi/src/csi_module.cpp>
    +<../../common/csi/src/csi_bundler.cpp>
    +<../../common/csi/src/core_presence.cpp>
    +<../../common/csi/src/core_breathing.cpp>
    +<../../common/csi/src/core_activity_ribbon.cpp>
    +<../../common/csi/src/meta_daily_summary.cpp>
    +<../../common/csi/src/anomaly_baseline.cpp>
    ; wifi.channel_activity: ambient, unattributed "airwaves got busy" glow —
    ; identity-free CSI aggregates only, emits CSI_CATEGORY_AMBIENT (never
    ; persisted). See spec/canary_free_signals_v0.md Invariants A/E/F.
    +<../../common/csi/src/wifi_channel_activity.cpp>
    ; meta_empty_room_baseline: scheduled 10-min "empty room" mean
    ; calibration, triggered at pairing-complete and during quiet-hours.
    +<../../common/csi/src/meta_empty_room_baseline.cpp>
    ; core_multilink_fusion: 2-link motion-confirmation gate. Consumes
    ; the local CSI feature stream plus peer features fed via
    ; core_multilink_fusion_ingest_peer_features() (called by the
    ; integration layer when a verified CSI_FEATURES envelope arrives).
    +<../../common/csi/src/core_multilink_fusion.cpp>
    ; tamper_events_module: system.integrity per-kind tamper narration
    ; (watchdog / power_loss / unexpected_reboot) through the chokepoint —
    ; the same module the canary-wap sketch compiles as a staged copy.
    ; Registered unconditionally in csi_modules_integration.cpp; fed from
    ; main.cpp's loop() via the securacv_csi_modules_tamper_watch bridge.
    +<../../common/csi/src/tamper_events_module.cpp>
    ; csi_probe: active ESP-NOW probe transmitter. Stand-alone — does not
    ; depend on canary's lib/securacv_csi/ HAL. Initial peer-list driver
    ; is the caller (PR 2 mesh layer will populate via add_peer()).
    +<../../common/csi/src/csi_probe.cpp>
    ; securacv_ota: signed pull-OTA engine (canonical at firmware/common/ota).
    ; All engine code is inside #if !SECURACV_OTA_HOST_BUILD; call sites in
    ; main.cpp / securacv_network are gated by FEATURE_OTA_PULL.
    +<../../common/ota/src/securacv_ota.cpp>

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; ─── Static analysis ─────────────────────────────────────────
check_tool = cppcheck
; The .pio suppressions silence defects cppcheck reports inside third-party
; dependency code it preprocesses via project includes (e.g. ArduinoJson's
; variadic-macro polyfills trip simplecpp with a preprocessorErrorDirective);
; --skip-packages alone doesn't filter defects *located* in .pio/libdeps.
check_flags =
    cppcheck: --enable=warning,performance,portability --suppress=missingIncludeSystem --suppress=unusedFunction --suppress=*:.pio/* --suppress=*:*/.pio/*
check_skip_packages = yes

; PlatformIO's chain-mode LDF scans `#include` lines without honoring
; `#if` gates. The Scout integration (csi_modules_integration.cpp)
; therefore appears to depend on securacv_ble_scan even when the env
; has -DFEATURE_BLE_SCAN=0. Without this default-ignore, LDF pulls in
; securacv_ble_scan → its securacv_mesh dependency → and the dev
; build attempts to compile mesh_crypto.cpp / mesh_transport.cpp,
; which pull in mesh dependencies not needed for basic dev builds.
; [env:full] overrides this back to an empty list so the Scout role
; can compile there.
;
; securacv_usb_onboard is ignored here for the same reason: main.cpp only
; #includes it under #if FEATURE_USB_ONBOARD, but LDF pulls it in regardless,
; so without this the (USB-OTG-only) glue would compile into every profile.
; [env:usb-onboard] re-lists the BLE ignores without it so the glue links there.
lib_ignore =
    securacv_ble_scan
    securacv_ble_status
    securacv_usb_onboard

; ─── DEV: Fast iteration ──────────────────────────────────────
[env:dev]
build_type = debug
build_flags =
    ${env.build_flags}
    -Og                          ; Debug-friendly optimization (fast compile)
    -DCORE_DEBUG_LEVEL=4         ; ESP32 verbose logging
    -DSECURACV_BUILD_DEV=1
    ; All features enabled for dev
    -DFEATURE_SD_STORAGE=1
    -DFEATURE_WIFI_AP=1
    -DFEATURE_HTTP_SERVER=1
    -DFEATURE_CAMERA_PEEK=1
    -DFEATURE_TAMPER_GPIO=0
    -DFEATURE_WATCHDOG=1
    -DFEATURE_STATE_LOG=1
    -DFEATURE_OTA_UPDATE=1
    -DFEATURE_OTA_PULL=1         ; Signed pull-OTA (manifest + Ed25519 + A/B rollback)
    -DFEATURE_MESH_NETWORK=0
    -DFEATURE_BLUETOOTH=0
    -DFEATURE_BLE_SCAN=0         ; BLE Scout passive scanner — default OFF (see PR 5b)
    -DFEATURE_CSI=1              ; WiFi CSI motion / breathing sensing
    -DFEATURE_ACOUSTIC_EVENTS=1  ; PDM mic + T3 smoke / T4 CO cadence detection
    -DFEATURE_ACOUSTIC_TRANSIENTS=1 ; Phase 2b: knock / doorbell / glass-break
    -DFEATURE_TOUCH=1            ; Capacitive touch (silent panic / tamper)
    -DFEATURE_DEEP_SLEEP=0       ; Lowpower HAL compiled in but never sleeps
    -DFEATURE_IR_RMT=1           ; RMT IR appliance activity detection
    -DFEATURE_TEMP_TAMPER=1      ; Internal die-temp drift tamper detection
    -DFEATURE_SENSING_WITNESS=1  ; Sign emergency/security events to witness chain
    ; Debug output
    -DDEBUG_NMEA=0
    -DDEBUG_CBOR=0
    -DDEBUG_CHAIN=0
    -DDEBUG_VERIFY=0
    -DDEBUG_HTTP=1

; Faster linking for dev
build_unflags = -Os

; ─── RELEASE: Production firmware ─────────────────────────────
[env:release]
build_type = release
build_flags =
    ${env.build_flags}
    -Os                          ; Size optimization
    -DCORE_DEBUG_LEVEL=1         ; Errors only
    -DSECURACV_BUILD_RELEASE=1
    -DFEATURE_SD_STORAGE=1
    -DFEATURE_WIFI_AP=1
    -DFEATURE_HTTP_SERVER=1
    -DFEATURE_CAMERA_PEEK=1
    -DFEATURE_TAMPER_GPIO=0
    -DFEATURE_WATCHDOG=1
    -DFEATURE_STATE_LOG=1
    -DFEATURE_OTA_UPDATE=1
    -DFEATURE_OTA_PULL=1         ; Signed pull-OTA (manifest + Ed25519 + A/B rollback)
    -DFEATURE_MESH_NETWORK=0
    -DFEATURE_BLUETOOTH=0
    -DFEATURE_BLE_SCAN=0         ; BLE Scout passive scanner — default OFF (see PR 5b)
    -DFEATURE_CSI=1
    ; Sensing suite — shipped in release since 2026-07. Release/release_ha
    ; are the published OTA images; before this, the acoustic detector
    ; (and the whole Phase 2 sensing suite) existed only in dev/full, so
    ; production devices silently had NO smoke-alarm listening at all.
    -DFEATURE_ACOUSTIC_EVENTS=1  ; PDM mic + tone-gated T3 smoke / T4 CO detection
    -DFEATURE_ACOUSTIC_TRANSIENTS=0 ; knock/doorbell/glass stay opt-in (dev/full)
    -DFEATURE_TOUCH=1            ; Capacitive touch (silent panic / tamper)
    -DFEATURE_IR_RMT=1           ; RMT IR appliance activity detection
    -DFEATURE_TEMP_TAMPER=1      ; Internal die-temp drift tamper detection
    -DFEATURE_SENSING_WITNESS=1  ; Sign emergency/security events to witness chain
    -DDEBUG_NMEA=0
    -DDEBUG_CBOR=0
    -DDEBUG_CHAIN=0
    -DDEBUG_VERIFY=0
    -DDEBUG_HTTP=0

; ─── DEV + HA: Dev build with Home Assistant MQTT ─────────────
[env:dev_ha]
extends = env:dev
build_flags =
    ${env:dev.build_flags}
    -DFEATURE_HA_MQTT=1
    -DFEATURE_HA_DISCOVERY=1
lib_deps =
    ${env.lib_deps}
    knolleary/PubSubClient @ ^2.8

; ─── RELEASE + HA: Production with Home Assistant ─────────────
[env:release_ha]
extends = env:release
build_flags =
    ${env:release.build_flags}
    -DFEATURE_HA_MQTT=1
    -DFEATURE_HA_DISCOVERY=1
lib_deps =
    ${env.lib_deps}
    knolleary/PubSubClient @ ^2.8

; ─── MINIMAL: Crypto + GPS only (no WiFi/SD/camera) ──────────
[env:minimal]
extends = env:dev
build_flags =
    ${env.build_flags}
    -Og
    -DCORE_DEBUG_LEVEL=4
    -DSECURACV_BUILD_DEV=1
    -DFEATURE_SD_STORAGE=0
    -DFEATURE_WIFI_AP=0
    -DFEATURE_HTTP_SERVER=0
    -DFEATURE_CAMERA_PEEK=0
    -DFEATURE_TAMPER_GPIO=0
    -DFEATURE_WATCHDOG=1
    -DFEATURE_STATE_LOG=1
    -DFEATURE_OTA_UPDATE=0
    -DFEATURE_OTA_PULL=0
    -DFEATURE_MESH_NETWORK=0
    -DFEATURE_BLUETOOTH=0
    -DDEBUG_NMEA=0
    -DDEBUG_CBOR=0
    -DDEBUG_CHAIN=0
    -DDEBUG_VERIFY=0
    -DDEBUG_HTTP=0

; ─── FULL: All features matching WAP snapshot parity ─────────
[env:full]
extends = env:dev

; Override the [env] `espressif32 @ ^7.0.0` default. Even at 7.x the official
; platform's framework=arduino package is still Arduino 2.0.17 / IDF 4.4.7
; (the 7.x bump only added ESP-IDF 6.0 support, not core 3.x). The lib_deps
; below pin NimBLE-Arduino 2.x, which REQUIRES Arduino-ESP32 core 3.x — so
; [env:full] must build on the pioarduino fork that actually packages core
; 3.x (55.03.38-1 = Arduino-ESP32 3.3.8 / IDF 5.5.4), matching the canary-wap
; PlatformIO env and the esp32:esp32 core the arduino-cli CI installs.
; dev/release deliberately stay on the official platform: they keep BLE off
; (FEATURE_BLE_STATUS=0, securacv_ble_* ignored), so the 2.x core builds fine.
; The URL itself is [platform_core3] in ../envs/platformio/platforms.ini, the
; same section every other core-3 env interpolates.
platform = ${platform_core3.platform}

; FULL does not fit partitions_ota.csv's 1.9 MB A/B slots (it crossed 100%
; of 0x1E0000 when the durable witness log landed). firmware/PARTITIONS.md
; is explicit: "do not select [env:full] against it expecting it to fit" —
; the canonical FULL-on-8MB layout is arduino-esp32's default_8MB table
; (2 x 3.2 MB app0/app1, A/B intact), the same table the canary-wap sketch
; ships on. Switching an existing device between tables requires a USB
; reflash (erase) — which is already the only way FULL was ever installed.
board_build.partitions = default_8MB.csv

build_flags =
    ${env:dev.build_flags}
    ; With the 3.2 MB default_8MB slots the historical "FULL exceeds the
    ; A/B slot" rationale for compiling out pull-OTA is gone — the image
    ; (~2 MB) fits with ample headroom, so FULL gets the same signed
    ; pull-OTA self-update path as dev/release (PARTITIONS.md: "FULL with
    ; OTA A/B (production WAP today) -> default_8MB").
    -DFEATURE_MESH_NETWORK=1
    -DFEATURE_BLUETOOTH=1
    -DFEATURE_BLE=1
    -DFEATURE_BLE_SCAN=1         ; BLE Scout — paired-beacon room attribution (PR 5b)
    -DFEATURE_BLE_STATUS=1       ; BLE GATT status service (battery, health, chain)
    -DFEATURE_SYS_MONITOR=1
    -DFEATURE_WIFI_PRESENCE=1
    -DFEATURE_AUDIBLE_CHIRP=1
    -DFEATURE_RF_PRESENCE=1
    -DFEATURE_CHIRP=1
    -DFEATURE_GNSS=1
    -DFEATURE_CSI=1
    -DFEATURE_ACOUSTIC_EVENTS=1
    -DFEATURE_TOUCH=1
    -DFEATURE_DEEP_SLEEP=0
    -DFEATURE_IR_RMT=1
    -DFEATURE_TEMP_TAMPER=1
    -DFEATURE_SENSING_WITNESS=1
lib_deps =
    ${env.lib_deps}
    ; Must be 2.x — code uses NimBLEConnInfo callbacks + setScanCallbacks().
    h2zero/NimBLE-Arduino@^2.3.8
; Override the [env] default that ignores securacv_ble_scan. FEATURE_BLE_SCAN=1
; here means the Scout role compiles in, so the library must be linked.
lib_ignore =

; ─── STANDALONE: WAP mode only, no MQTT ──────────────────────
[env:standalone]
extends = env:release
build_flags =
    ${env:release.build_flags}
    -DFEATURE_HA_MQTT=0
    -DFEATURE_HA_DISCOVERY=0

; ─── USB-ONBOARD: "plug me in" experience (opt-in, USB-OTG) ────
; Composite TinyUSB device — CDC console (unchanged) + HID keyboard + read-only
; SD-over-MSC. On plug-in the keyboard is idle; the console 'u' key announces
; the exact help URL and arms a window, and only a physical BOOT-button press
; then opens https://securacv.com/canary. See docs/design/usb_onboard.md.
;
; This flips ARDUINO_USB_MODE 1→0 (hwcdc → USB-OTG/TinyUSB), which HID + MSC
; require. That changes how the board enumerates for flashing (the native-USB
; DFU path, same as the WAP evidence-drive build), so it stays a separate
; opt-in profile and the shipping dev/release images are untouched.
; PHASE 2 (on-device HID/MSC validation) PENDING before any release profile.
[env:usb-onboard]
extends = env:dev
build_unflags =
    -Os
    -DARDUINO_USB_MODE=1
build_flags =
    ${env:dev.build_flags}
    -DARDUINO_USB_MODE=0         ; USB-OTG/TinyUSB — required for HID + MSC
    -DFEATURE_USB_ONBOARD=1      ; consented HID help-launch + read-only MSC + guided recovery
    ; Branded USB descriptor. ONLY possible in this OTG/TinyUSB mode (the stock
    ; hwcdc profile and every C3/C6 board reuse the S3/C-series USB-Serial-JTAG
    ; descriptor, fixed in mask ROM). Set at the BUILD level because CDC-on-boot
    ; begins USB before setup() runs, so a runtime USB.productName() lands too
    ; late to change the enumerated descriptor. Hyphenated to match the BLE GAP
    ; name (SecuraCV-Canary) — one identity across both radios; the no-space
    ; form keeps the build-flag quoting robust.
    -DUSB_MANUFACTURER=\"SecuraCV\"
    -DUSB_PRODUCT=\"SecuraCV-Canary\"
; Re-list the BLE ignores WITHOUT securacv_usb_onboard so its glue actually
; links in this (and only this) profile.
lib_ignore =
    securacv_ble_scan
    securacv_ble_status

; ─── CLASSIC ESP32 + SECOND-VENDOR CAMERA PORTS ───────────────────────────
; Board-specialized release-level builds (docs/board_market_research.md,
; docs/strategy/30 Phase 0). Each env binds one board's pin overrides to the
; release feature posture minus what the hardware can't carry — the env IS
; the honest feature list, mirrored in firmware/boards/<id>/README.md.
; Every env carries a distinct SECURACV_OTA_PRODUCT so no board can ever
; install another board's image (the same rule the vision envs follow).
; Their release manifests don't exist yet — pull-OTA fails closed (no
; update) until the release pipeline learns these products.

; ─── ESP32CAM: AI-Thinker ESP32-CAM (classic ESP32, OV2640, SD) ───────────
; The most-owned camera dev board in existence. Keeps the two pillars that
; justify the port — camera PEEK + Wi-Fi CSI — plus SPI-mode SD and signed
; pull-OTA (4 MB flash fits partitions_ota.csv exactly). No mic, no free
; pins for GNSS/touch/IR, no classic-ESP32 tsens: those features are off,
; not broken. Flashing is external-UART only (no native USB) — see the
; board README for the GPIO0 dance.
[env:esp32cam]
extends = env:release
board = esp32cam
; Classic ESP32 with quad PSRAM — the S3 base's qio_opi would select
; octal-PSRAM init on a chip that doesn't have it.
board_build.arduino.memory_type = qio_qspi
build_unflags =
    ; No native USB on classic ESP32
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; XIAO pin defaults replaced below (unflag first: both live on the
    ; compiler command line, and conflicting -D pairs warn on every TU)
    -DSD_CS_PIN=21
    -DSD_SCK_PIN=7
    -DSD_MISO_PIN=8
    -DSD_MOSI_PIN=9
    -DGPS_RX_PIN=44
    -DGPS_TX_PIN=43
    ; Feature deltas vs release, re-set below
    -DFEATURE_ACOUSTIC_EVENTS=1
    -DFEATURE_TOUCH=1
    -DFEATURE_IR_RMT=1
    -DFEATURE_TEMP_TAMPER=1
build_flags =
    ${env:release.build_flags}
    ; Classic-ESP32 PSRAM cache errata workaround (rev1 silicon)
    -mfix-esp32-psram-cache-issue
    ; SD in SPI mode on the SDMMC slot pins (boards/esp32cam-ai-thinker)
    -DSD_CS_PIN=13
    -DSD_SCK_PIN=14
    -DSD_MISO_PIN=2
    -DSD_MOSI_PIN=15
    ; OV2640 on the CAMERA_MODEL_AI_THINKER map
    -DCAM_PIN_PWDN=32
    -DCAM_PIN_RESET=-1
    -DCAM_PIN_XCLK=0
    -DCAM_PIN_SIOD=26
    -DCAM_PIN_SIOC=27
    -DCAM_PIN_D7=35
    -DCAM_PIN_D6=34
    -DCAM_PIN_D5=39
    -DCAM_PIN_D4=36
    -DCAM_PIN_D3=21
    -DCAM_PIN_D2=19
    -DCAM_PIN_D1=18
    -DCAM_PIN_D0=5
    -DCAM_PIN_VSYNC=25
    -DCAM_PIN_HREF=23
    -DCAM_PIN_PCLK=22
    ; What the hardware can't carry (board README has the full table)
    -DFEATURE_ACOUSTIC_EVENTS=0     ; no mic, no free pins to add one
    -DFEATURE_ACOUSTIC_TRANSIENTS=0
    -DFEATURE_TOUCH=0               ; touch lib is S2/S3-only
    -DFEATURE_IR_RMT=0              ; IR_RX_PIN default is UART0 RX here
    -DFEATURE_TEMP_TAMPER=0         ; no supported classic-ESP32 tsens path
    -DFEATURE_THERMAL_WATCHDOG=0    ; same tsens gap — the config-header default
                                    ; of 1 would log a bogus sensor fault after
                                    ; 4 failed reads on a chip with no sensor
    -DFEATURE_GNSS=0                ; no free pins with camera + SD in use
    '-DSECURACV_OTA_PRODUCT="securacv-canary-esp32cam"'
    '-DSECURACV_OTA_MANIFEST_URL="https://github.com/kmay89/securaCV/releases/latest/download/manifest-canary-esp32cam.json"'

; ─── ESP32-WROOM: generic ESP32-WROOM-32 DevKit (classic ESP32) ───────────
; The most common "an ESP32" that people own (DevKitC / DOIT V1 /
; NodeMCU-32S / clones). No camera, mic, SD, or PSRAM — this build is the
; Wi-Fi CSI presence witness with the signed chain and pull-OTA. GNSS stays
; available on the free UART2 (external module, optional).
[env:esp32-wroom]
extends = env:release
board = esp32dev
; Classic ESP32, dio flash, no PSRAM
board_build.arduino.memory_type = dio_qspi
build_unflags =
    ; No native USB on classic ESP32 (UART bridge instead)
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; WROOM-32 has no PSRAM (that's the WROVER — a different board)
    -DBOARD_HAS_PSRAM
    ; XIAO GPS pins replaced below
    -DGPS_RX_PIN=44
    -DGPS_TX_PIN=43
    ; Feature deltas vs release, re-set below
    -DFEATURE_SD_STORAGE=1
    -DFEATURE_CAMERA_PEEK=1
    -DFEATURE_ACOUSTIC_EVENTS=1
    -DFEATURE_TOUCH=1
    -DFEATURE_IR_RMT=1
    -DFEATURE_TEMP_TAMPER=1
build_flags =
    ${env:release.build_flags}
    ; GNSS on the free UART2 (boards/esp32-wroom-devkit)
    -DGPS_RX_PIN=16
    -DGPS_TX_PIN=17
    ; What the hardware can't carry (board README has the full table)
    -DFEATURE_SD_STORAGE=0          ; no SD slot — witness log lives in flash
    -DFEATURE_CAMERA_PEEK=0         ; no camera connector
    -DFEATURE_ACOUSTIC_EVENTS=0     ; no mic
    -DFEATURE_ACOUSTIC_TRANSIENTS=0
    -DFEATURE_TOUCH=0               ; touch lib is S2/S3-only
    -DFEATURE_IR_RMT=0              ; IR_RX_PIN default is UART0 RX here
    -DFEATURE_TEMP_TAMPER=0         ; no supported classic-ESP32 tsens path
    -DFEATURE_THERMAL_WATCHDOG=0    ; same tsens gap — the config-header default
                                    ; of 1 would log a bogus sensor fault after
                                    ; 4 failed reads on a chip with no sensor
    '-DSECURACV_OTA_PRODUCT="securacv-canary-wroom"'
    '-DSECURACV_OTA_MANIFEST_URL="https://github.com/kmay89/securaCV/releases/latest/download/manifest-canary-wroom.json"'

; ─── FREENOVE-S3: Freenove ESP32-S3-WROOM CAM (FNK0085) ───────────────────
; The default Amazon "ESP32-S3 camera kit" a US newcomer receives. Same S3
; base as the flagship, entirely different camera pins (Espressif's S3-EYE
; reference map) — which is exactly why the OTA product id is distinct.
; The microSD slot is 1-bit SDMMC only (no DAT3/CS routed), so the
; SPI-mode storage driver can't use it: SD stays off, honestly.
[env:freenove-s3]
extends = env:release
board = esp32-s3-devkitc-1
; The devkitc-1 profile says 8 MB; the FNK0085's WROOM-1 N16R8 is 16 MB.
; partitions_ota.csv only spans 4 MB either way, so the table fits; the
; upload size just stops esptool from refusing large offsets.
board_upload.flash_size = 16MB
build_unflags =
    ; XIAO SD pins dropped — the slot is electrically SPI-incapable, so no
    ; replacement pin set exists to give the driver
    -DSD_CS_PIN=21
    -DSD_SCK_PIN=7
    -DSD_MISO_PIN=8
    -DSD_MOSI_PIN=9
    ; Feature deltas vs release, re-set below
    -DFEATURE_SD_STORAGE=1
    -DFEATURE_ACOUSTIC_EVENTS=1
    -DFEATURE_TOUCH=1
build_flags =
    ${env:release.build_flags}
    ; OV2640 on the ESP32-S3-EYE reference map (boards/freenove-esp32s3-cam)
    -DCAM_PIN_PWDN=-1
    -DCAM_PIN_RESET=-1
    -DCAM_PIN_XCLK=15
    -DCAM_PIN_SIOD=4
    -DCAM_PIN_SIOC=5
    -DCAM_PIN_D7=16
    -DCAM_PIN_D6=17
    -DCAM_PIN_D5=18
    -DCAM_PIN_D4=12
    -DCAM_PIN_D3=10
    -DCAM_PIN_D2=8
    -DCAM_PIN_D1=9
    -DCAM_PIN_D0=11
    -DCAM_PIN_VSYNC=6
    -DCAM_PIN_HREF=7
    -DCAM_PIN_PCLK=13
    ; What the hardware can't carry (board README has the full table)
    -DFEATURE_SD_STORAGE=0          ; slot is 1-bit SDMMC — SPI driver can't reach it
    -DFEATURE_ACOUSTIC_EVENTS=0     ; no mic
    -DFEATURE_ACOUSTIC_TRANSIENTS=0
    -DFEATURE_TOUCH=0               ; no touch pad wired (and TOUCH_PIN 4 is camera SCCB here)
    '-DSECURACV_OTA_PRODUCT="securacv-canary-freenove-s3"'
    '-DSECURACV_OTA_MANIFEST_URL="https://github.com/kmay89/securaCV/releases/latest/download/manifest-canary-freenove-s3.json"'
