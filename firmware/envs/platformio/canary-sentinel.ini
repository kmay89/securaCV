; ============================================================================
; Canary Sentinel Build Environments — multi-sensor fusion guardian
; ============================================================================
;
; One brain (firmware/common/fusion, host-tested), three tiers, five presets.
; The tier is a BOARD + a set of enabled channels; the preset is DATA
; (configs/canary-sentinel/<preset>). No app logic forks by tier or preset.
;
;   canary-sentinel-lite      C3, mailbox-lite preset  (PIR+RF+BLE+light)
;   canary-sentinel-door      C6+MR60, door preset      (Standard, +radar+CSI)
;   canary-sentinel-window    C6+MR60, window preset     (Standard)
;   canary-sentinel-hallway   C6+MR60, hallway preset    (Standard)
;   canary-sentinel-demo-head C6+MR60, perimeter-demo    (Heavy sensor head)
;
; ── CI STATUS ───────────────────────────────────────────────────────────────
; COMPILE-GATED, NOT RELEASED. The host tests (firmware/tests_host) are the
; verified coverage for the novel fusion core and the preset->engine mapping.
; Since F22 Phase 1a the project is in firmware/flavors.json with build_envs
; only — `canary-sentinel-door` (C6, core 3) and `canary-sentinel-lite` (C3,
; core 2) — so firmware.yml's PlatformIO leg compiles the Phase 1a network/
; witness path and runs the OTA-slot size guards on every PR. It has NO
; release_envs and no build_matrix lane: nothing ships until the project
; README's bench checklist is green (the flavors.json entry says why, in its
; `unreleased` field). window / hallway / demo-head differ from door only by
; preset data and their own OTA product, so the door leg compiles their code
; path.
;
; ── ESP32-C6 platform pin ─────────────────────────────────────────────────
; The Standard/Heavy tiers are ESP32-C6 and need the pioarduino core-3.x fork,
; the same [platform_core3] section of platforms.ini canary-sense interpolates
; (so the lockstep is structural). See canary-sense.ini for
; the full rationale (min_spiffs partitions, chain LDF, USB-CDC undef). The
; Lite tier is an ESP32-C3 on the official core-2 line ([platform_s3c3]); the
; two cannot share a PLATFORMIO_CORE_DIR, so flavors.json isolates the lite
; env's core dir (the larger core-3 toolchain keeps the cached default dir).
;
; ── Phase 1a network stack ─────────────────────────────────────────────────
; canary-sense's: src/net (WiFi STA + setup portal, MQTT + HA discovery, mDNS,
; signed pull-OTA glue), src/runtime_config.cpp, src/diagnostics.cpp and the
; witness key/chain plumbing, carried in this project (the way canary-vision
; carries its own src/net) and pinned to canary-sense by
; firmware/scripts/check_sentinel_net_sync.sh. The shared common/ TUs they
; need are compiled explicitly below (the canary-sense.ini pattern), and the
; registry libraries are explicit lib_deps. No NimBLE: the fleet-link BLE
; beacon and the BLE channel are Phase 1b (the radio-coexistence bench item).
; ============================================================================

[common_c6_sentinel]
extends = common
platform = ${platform_core3.platform}
board_build.mcu = esp32c6
board_build.f_cpu = 160000000L
board_build.partitions = min_spiffs.csv
lib_ldf_mode = chain
build_src_filter =
    +<*>
    +<../../../common/fusion/sentinel_fusion.cpp>
    +<../../../common/sensors/mmwave_mr60/mr60_uart.cpp>
    +<../../../common/sensors/mmwave_mr60/mr60_presence.cpp>
    +<../../../common/sensors/bh1750/bh1750.cpp>
    +<../../../common/boot/boot_banner.cpp>
    +<../../../common/ota/src/securacv_ota.cpp>
    +<../../../common/identity/device_signature.cpp>
    +<../../../common/network/setup_portal.cpp>
build_flags =
    ${common.build_flags}
    -UARDUINO_USB_CDC_ON_BOOT
; Phase 1a network stack (canary-sense's dependency set, minus NimBLE):
;   PubSubClient — MQTT publish + HA discovery
;   Crypto       — Ed25519 witness signing + the signed pull-OTA verify
lib_deps =
    ${common.lib_deps}
    knolleary/PubSubClient@^2.8
    rweather/Crypto@^0.4.0

; ── Standard/Heavy shared include + deps (C6 head) ───────────────────────────
[c6_sentinel_common_flags]
build_flags =
    ${common_c6_sentinel.build_flags}
    -I${PROJECT_DIR}/../../common
    -I${PROJECT_DIR}/../../common/fusion
    -I${PROJECT_DIR}/../../common/ota/src
    -I${PROJECT_DIR}/../../boards/xiao-esp32c6-sentinel/pins
    -I${PROJECT_DIR}/secrets

[env:canary-sentinel-door]
extends = common_c6_sentinel
board = seeed_xiao_esp32c6
build_flags =
    ${c6_sentinel_common_flags.build_flags}
    -I${PROJECT_DIR}/../../configs/canary-sentinel/door
    -DCONFIG_CANARY_SENTINEL
    -DSENTINEL_PRESET_DOOR
    ; One OTA product + manifest PER PRESET, not per tier: the preset is
    ; compile-time data, so a shared product would let the first door image
    ; ever published install itself on window / hallway / Heavy units (the
    ; engine only refuses on product mismatch). Each env below names its own;
    ; config.h's default is a fallback no env uses. No release publishes any
    ; of these yet (check_ota_channels.py declares them unpublished).
    '-DSECURACV_OTA_PRODUCT="securacv-canary-sentinel-door"'
    '-DSECURACV_OTA_MANIFEST_URL="https://github.com/kmay89/securaCV/releases/latest/download/manifest-canary-sentinel-door.json"'

[env:canary-sentinel-window]
extends = env:canary-sentinel-door
build_flags =
    ${c6_sentinel_common_flags.build_flags}
    -I${PROJECT_DIR}/../../configs/canary-sentinel/window
    -DCONFIG_CANARY_SENTINEL
    -DSENTINEL_PRESET_WINDOW
    '-DSECURACV_OTA_PRODUCT="securacv-canary-sentinel-window"'
    '-DSECURACV_OTA_MANIFEST_URL="https://github.com/kmay89/securaCV/releases/latest/download/manifest-canary-sentinel-window.json"'

[env:canary-sentinel-hallway]
extends = env:canary-sentinel-door
build_flags =
    ${c6_sentinel_common_flags.build_flags}
    -I${PROJECT_DIR}/../../configs/canary-sentinel/hallway
    -DCONFIG_CANARY_SENTINEL
    -DSENTINEL_PRESET_HALLWAY
    '-DSECURACV_OTA_PRODUCT="securacv-canary-sentinel-hallway"'
    '-DSECURACV_OTA_MANIFEST_URL="https://github.com/kmay89/securaCV/releases/latest/download/manifest-canary-sentinel-hallway.json"'

[env:canary-sentinel-demo-head]
; Heavy tier sensor head. The Heavy vision vote arrives from a second XIAO
; ESP32-S3 hub over ESP-NOW (a separate project build); this env is the head.
extends = env:canary-sentinel-door
build_flags =
    ${c6_sentinel_common_flags.build_flags}
    -I${PROJECT_DIR}/../../configs/canary-sentinel/perimeter-demo
    -DCONFIG_CANARY_SENTINEL
    -DSENTINEL_PRESET_PERIMETER_DEMO
    '-DSECURACV_OTA_PRODUCT="securacv-canary-sentinel-demo-head"'
    '-DSECURACV_OTA_MANIFEST_URL="https://github.com/kmay89/securaCV/releases/latest/download/manifest-canary-sentinel-demo-head.json"'

; ── Lite tier (ESP32-C3, no radar) ───────────────────────────────────────────
[env:canary-sentinel-lite]
; Core 2.0.17 (the official platform, deep+ LDF from common.ini) — the same
; line canary-vision's C3 envs build the same net stack on. default.csv gives
; app0/app1 0x140000 each; flavors.json's size guard holds the image to it.
extends = common_esp32c3
board = seeed_xiao_esp32c3
build_src_filter =
    +<*>
    +<../../../common/fusion/sentinel_fusion.cpp>
    +<../../../common/sensors/bh1750/bh1750.cpp>
    +<../../../common/boot/boot_banner.cpp>
    +<../../../common/ota/src/securacv_ota.cpp>
    +<../../../common/identity/device_signature.cpp>
    +<../../../common/network/setup_portal.cpp>
build_flags =
    ${common_esp32c3.build_flags}
    -I${PROJECT_DIR}/../../common
    -I${PROJECT_DIR}/../../common/fusion
    -I${PROJECT_DIR}/../../common/ota/src
    -I${PROJECT_DIR}/../../boards/xiao-esp32c3-sentinel-lite/pins
    -I${PROJECT_DIR}/../../configs/canary-sentinel/mailbox-lite
    -I${PROJECT_DIR}/secrets
    -DCONFIG_CANARY_SENTINEL
    -DSENTINEL_PRESET_MAILBOX_LITE
    ; Its own OTA product/manifest, like every preset env above: a Lite (C3)
    ; image must never install on a Standard (C6) head or the reverse — the
    ; engine refuses on product mismatch. No release publishes it yet.
    '-DSECURACV_OTA_PRODUCT="securacv-canary-sentinel-lite"'
    '-DSECURACV_OTA_MANIFEST_URL="https://github.com/kmay89/securaCV/releases/latest/download/manifest-canary-sentinel-lite.json"'
lib_deps =
    ${common.lib_deps}
    knolleary/PubSubClient@^2.8
    rweather/Crypto@^0.4.0
