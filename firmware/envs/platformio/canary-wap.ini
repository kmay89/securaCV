; ============================================================================
; Canary WAP Build Environments
; ============================================================================
;
; App sources come from projects/canary-wap/arduino/canary_wap (set via
; src_dir in the project's platformio.ini) — the SAME Arduino sketch that
; `arduino-cli compile` builds. There is one BLE/firmware codebase, built
; identically by both toolchains.
;
; The sketch is self-contained except for one shared module: boot_banner
; (firmware/common/boot). The CSI library is committed in BOTH places — once
; canonically under firmware/common/csi/src and once next to the sketch (see
; the csi-sketch-sync CI guard) — so the sketch's local copies are what build;
; we deliberately do NOT pull firmware/common/csi as a library here, otherwise
; its sources would be compiled twice and the link would fail on duplicate
; symbols. Hence: compile the sketch dir + boot_banner.cpp, and add a single
; include path for <boot_banner.h>. (This mirrors what arduino-cli effectively
; compiles via `--libraries firmware/common`, where the local CSI copies
; shadow the library.)
;
; Build profile + hardware target are chosen here with -D flags and consumed by
; the sketch's build_config.h. Arduino IDE users get the in-file defaults
; (XIAO ESP32-S3 + FULL) without passing anything.

[env:canary-wap-default]
; Full-featured Wireless Access Point witness device (BLE + mesh + camera)
extends = common_esp32s3
board = seeed_xiao_esp32s3

; Pin the arduino-esp32 3.x core (ESP-IDF v5). The inherited common_esp32s3
; default is espressif32@6.9.0 (= core 2.0.17 / IDF 4.4), which CANNOT build
; this sketch: it uses IDF5-only APIs (the struct-based esp_task_wdt_config_t
; with .idle_core_mask) and NimBLE-Arduino 2.x, which both require core 3.x.
; The canonical CI build (Arduino CLI Build (Canary WAP)) installs the latest
; esp32:esp32 core (3.x), so this aligns the PlatformIO build with it and with
; the modular canary/ build, which already pins espressif32 @ ^7.0.0.
platform = espressif32 @ ^7.0.0

; XIAO ESP32S3 Sense ships with 8MB Octal SPI PSRAM. The stock board variant
; only initializes Quad-SPI PSRAM, which causes ESP.getPsramSize() to report 0
; and the dashboard "PSRAM Used/Free" stats to show "n/a"/"--". Selecting the
; qio_opi memory type wires up the OPI PSRAM at boot.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = default_8MB.csv
board_build.filesystem = littlefs

; Decode backtraces from ESP32 exception decoder
monitor_filters = esp32_exception_decoder

; Compile the sketch directory (src_dir = arduino/canary_wap) plus the one
; shared module the sketch needs but doesn't carry a local copy of.
; Both candidate relative paths to firmware/common/boot are listed so the
; filter resolves whether PlatformIO treats build_src_filter paths as
; relative to src_dir (../../../../) or to the project dir (../../). Only the
; correct one points at a real file; the other matches nothing and is ignored.
build_src_filter =
    +<*>
    +<../../../../common/boot/boot_banner.cpp>
    +<../../common/boot/boot_banner.cpp>

build_flags =
    ${common_esp32s3.build_flags}
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM=1
    -DCONFIG_SPIRAM_MODE_OCT=1
    ; <boot_banner.h> lives in firmware/common/boot
    -I${PROJECT_DIR}/../../common/boot
    ; Build profile + hardware target — consumed by build_config.h
    -DHARDWARE_XIAO_ESP32S3
    -DBUILD_PROFILE_FULL

; Library dependencies
lib_deps =
    ${common.lib_deps}
    ; Crypto library for Ed25519
    rweather/Crypto@^0.4.0
    ; NimBLE for Bluetooth — must be 2.x. The bluetooth_channel.cpp callbacks
    ; use the NimBLE 2.x signatures (NimBLEConnInfo&, setScanCallbacks(),
    ; const NimBLEAdvertisedDevice*, injectConfirmPasskey(), int8_t setPower).
    ; Pinning ^1.4.0 silently shipped a build where the bluetooth_channel
    ; translation unit failed to compile against the 1.x callback signatures
    ; and FEATURE_BLUETOOTH ended up effectively disabled at runtime — this
    ; was the actual cause of "BLE unavailable in this build" on flashed
    ; devices. 2.3.8+ also fixes a startup crash on Arduino-ESP32 3.3.7+.
    h2zero/NimBLE-Arduino@^2.3.8

[env:canary-wap-mobile]
; Power-optimized configuration — lighter DEV profile (no camera/mesh)
extends = env:canary-wap-default

build_flags =
    ${common_esp32s3.build_flags}
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM=1
    -DCONFIG_SPIRAM_MODE_OCT=1
    -I${PROJECT_DIR}/../../common/boot
    -DHARDWARE_XIAO_ESP32S3
    -DBUILD_PROFILE_DEV

[env:canary-wap-debug]
; Full build with verbose ESP-IDF logging
extends = env:canary-wap-default

build_flags =
    ${common_esp32s3.build_flags}
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM=1
    -DCONFIG_SPIRAM_MODE_OCT=1
    -I${PROJECT_DIR}/../../common/boot
    -DHARDWARE_XIAO_ESP32S3
    -DBUILD_PROFILE_FULL
    -DCORE_DEBUG_LEVEL=4
