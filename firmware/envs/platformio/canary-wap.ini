; ============================================================================
; Canary WAP Build Environments
; ============================================================================
;
; App sources come from projects/canary-wap/arduino/canary_wap (set via
; src_dir in the project's platformio.ini) — the SAME Arduino sketch that
; `arduino-cli compile` builds. There is one BLE/firmware codebase, built
; identically by both toolchains.
;
; The sketch is self-contained except for one shared module: boot_banner
; (firmware/common/boot). The CSI library is committed in BOTH places — once
; canonically under firmware/common/csi/src and once next to the sketch (see
; the csi-sketch-sync CI guard) — so the sketch's local copies are what build;
; we deliberately do NOT pull firmware/common/csi as a library here, otherwise
; its sources would be compiled twice and the link would fail on duplicate
; symbols. Hence: compile the sketch dir + boot_banner.cpp, and add a single
; include path for <boot_banner.h>. (This mirrors what arduino-cli effectively
; compiles via `--libraries firmware/common`, where the local CSI copies
; shadow the library.)
;
; Build profile + hardware target are chosen here with -D flags and consumed by
; the sketch's build_config.h. Arduino IDE users get the in-file defaults
; (XIAO ESP32-S3 + FULL) without passing anything.

[env:canary-wap-default]
; Full-featured Wireless Access Point witness device (BLE + mesh + camera)
extends = common_esp32s3
board = seeed_xiao_esp32s3

; Pin the pioarduino fork's platform, which packages Arduino-ESP32 3.x
; (ESP-IDF v5). This sketch REQUIRES core 3.x: it calls IDF5-only APIs
; UNconditionally — esp_task_wdt_reconfigure() + the struct-based
; esp_task_wdt_config_t with .idle_core_mask (see the #if FEATURE_WATCHDOG
; block in canary_wap.ino; unlike canary/src/main.cpp it is NOT
; ESP_IDF_VERSION-guarded) — and links NimBLE-Arduino 2.x.
;
; The official platformio/espressif32 platform does NOT provide core 3.x for
; framework=arduino: even 7.0.x (released 2026) still bundles Arduino 2.0.17 /
; IDF 4.4.7 (the 7.x bump only added ESP-IDF 6.0 support). So `espressif32 @
; ^7.0.0` resolves but ships a 2.x core, on which this sketch fails to compile.
; pioarduino is the community fork that actually ships core 3.x.
;
; 55.03.38-1 = Arduino-ESP32 3.3.8 / ESP-IDF 5.5.4 — the same core line the
; canonical CI build (Arduino CLI Build (Canary WAP)) installs via
; `arduino-cli core install esp32:esp32` (latest 3.3.x). The URL lives once,
; as [platform_core3] in platforms.ini (firmware/PLATFORMS.md).
platform = ${platform_core3.platform}

; XIAO ESP32S3 Sense ships with 8MB Octal SPI PSRAM. The stock board variant
; only initializes Quad-SPI PSRAM, which causes ESP.getPsramSize() to report 0
; and the dashboard "PSRAM Used/Free" stats to show "n/a"/"--". Selecting the
; qio_opi memory type wires up the OPI PSRAM at boot.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = default_8MB.csv
board_build.filesystem = littlefs

; Override the lib_ldf_mode = deep+ inherited from common.ini. On the pioarduino
; core-3.x framework, deep+ LDF fails to propagate the bundled Network library's
; include dir into the WiFi library, so WiFiGeneric.h's #include "Network.h"
; isn't found ("fatal error: Network.h: No such file or directory"). The PlatformIO
; default `chain` mode (used by the green modular `full` env and the arduino-cli
; build) resolves the framework include graph correctly. NimBLE/Crypto stay
; explicit lib_deps, so nothing is lost by relaxing discovery here.
lib_ldf_mode = chain

; Decode backtraces from ESP32 exception decoder
monitor_filters = esp32_exception_decoder

; Compile the sketch directory (src_dir = arduino/canary_wap). The shared
; boot_banner module is committed as a sketch-local copy (kept in sync with the
; canonical firmware/common/boot/boot_banner.cpp by the check_boot_sync CI
; guard, same committed-copy pattern as the CSI library), so `+<*>` already
; builds it. Do NOT also pull in ../../common/boot/boot_banner.cpp here — that
; compiled the same TU twice and failed linking with "multiple definition of
; boot_set_output". (arduino-cli avoids the clash because --libraries
; firmware/common lets the sketch-local copy shadow the library one.)
build_src_filter =
    +<*>

build_flags =
    ${common_esp32s3.build_flags}
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM=1
    -DCONFIG_SPIRAM_MODE_OCT=1
    ; <boot_banner.h> lives in firmware/common/boot
    -I${PROJECT_DIR}/../../common/boot
    ; Build profile + hardware target — consumed by build_config.h
    -DHARDWARE_XIAO_ESP32S3
    -DBUILD_PROFILE_FULL

; Library dependencies
lib_deps =
    ${common.lib_deps}
    ; Crypto library for Ed25519
    rweather/Crypto@^0.4.0
    ; NimBLE for Bluetooth — must be 2.x. The bluetooth_channel.cpp callbacks
    ; use the NimBLE 2.x signatures (NimBLEConnInfo&, setScanCallbacks(),
    ; const NimBLEAdvertisedDevice*, injectConfirmPasskey(), int8_t setPower).
    ; Pinning ^1.4.0 silently shipped a build where the bluetooth_channel
    ; translation unit failed to compile against the 1.x callback signatures
    ; and FEATURE_BLUETOOTH ended up effectively disabled at runtime — this
    ; was the actual cause of "BLE unavailable in this build" on flashed
    ; devices. 2.3.8+ also fixes a startup crash on Arduino-ESP32 3.3.7+.
    h2zero/NimBLE-Arduino@^2.3.8

[env:canary-wap-mobile]
; Power-optimized configuration — lighter DEV profile (no camera/mesh)
extends = env:canary-wap-default

build_flags =
    ${common_esp32s3.build_flags}
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM=1
    -DCONFIG_SPIRAM_MODE_OCT=1
    -I${PROJECT_DIR}/../../common/boot
    -DHARDWARE_XIAO_ESP32S3
    -DBUILD_PROFILE_DEV

[env:canary-wap-debug]
; Full build with verbose ESP-IDF logging
extends = env:canary-wap-default

build_flags =
    ${common_esp32s3.build_flags}
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM=1
    -DCONFIG_SPIRAM_MODE_OCT=1
    -I${PROJECT_DIR}/../../common/boot
    -DHARDWARE_XIAO_ESP32S3
    -DBUILD_PROFILE_FULL
    -DCORE_DEBUG_LEVEL=4

[env:canary-wap-usbdrive]
; OPT-IN BENCH BUILD — NOT a shipping profile. Builds the WAP in USB-OTG/TinyUSB
; mode so a flashed Canary presents two things the stock hwcdc image can't:
;   1. a BRANDED USB name — the Web Serial chooser / Windows / USB info read
;      "SecuraCV-Canary" (set by descriptor build flags; runtime USB.productName
;      lands too late under CDC-on-boot).
;   2. a read-only USB "evidence drive" — plug into a computer or an iPhone
;      (USB-C↔USB-C, Files app) and browse the SD's witness files.
; Two hard caveats, both documented in docs/hardware/usb_drive_bench.md:
;   · Flipping ARDUINO_USB_MODE 1->0 CHANGES how the board enumerates for
;     flashing; this is why it's a separate bench env, gated on on-device
;     (Phase-2) validation before any release use.
;   · S3-ONLY. The C3/C6 Canaries (canary-vision, canary-sense) have no USB-OTG
;     peripheral at all, so they can never present a drive or a branded name.
; iOS mounts the SD when it's FAT32/exFAT; the PSRAM update drop-zone stays
; FAT16 (PSRAM is too small for a spec-compliant FAT32), so drop-file updates
; remain a computer-only path — see the runbook.
extends = env:canary-wap-default

build_unflags =
    -DARDUINO_USB_MODE=1

build_flags =
    ${common_esp32s3.build_flags}
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM=1
    -DCONFIG_SPIRAM_MODE_OCT=1
    -I${PROJECT_DIR}/../../common/boot
    -DHARDWARE_XIAO_ESP32S3
    -DBUILD_PROFILE_FULL
    ; USB-OTG/TinyUSB — required for USB mass storage + a programmable descriptor
    -DARDUINO_USB_MODE=0
    ; Present the SD read-only over USB MSC (the "evidence drive")
    -DFEATURE_USB_EVIDENCE_DRIVE=1
    ; Branded USB descriptor, applied at CDC-on-boot enumeration. Hyphenated to
    ; match the BLE GAP name (SecuraCV-Canary) — one identity across both radios.
    -DUSB_MANUFACTURER=\"SecuraCV\"
    -DUSB_PRODUCT=\"SecuraCV-Canary\"
