; ============================================================================
; Canary Sense Build Environments  (Seeed MR60BHA2 kit / XIAO ESP32-C6)
; ============================================================================
;
; Three environments:
;   canary-sense-default    presence/count/lux, vitals compiled OUT
;   canary-sense-wellbeing  adds the P1-gated vitals lock (-DCANARY_SENSE_VITALS)
;   canary-sense-debug      default + verbose ESP-IDF logging
;
; ── ESP32-C6 platform pin (the one real Phase 0 unknown) ───────────────────
; The C6 needs arduino-esp32 3.x (ESP-IDF v5). The OFFICIAL platformio
; espressif32 platform still bundles a 2.0.x core even at 7.x and does NOT
; support the C6 for framework=arduino. We therefore pin the community
; `pioarduino` fork, exactly as canary-wap does for its core-3.x requirement.
;
; 55.03.38-1 = Arduino-ESP32 3.3.8 / ESP-IDF 5.5.4 — the same release line
; canary-wap pins and the same core line arduino-cli installs in CI. The URL
; is typed ONCE, as [platform_core3] in platforms.ini, and interpolated here
; and by canary-wap / canary-sentinel / the canary-display core-3 envs /
; canary's [env:full] — so a bump there moves all of them together. The
; pioarduino release URL pattern is:
;   https://github.com/pioarduino/platform-espressif32/releases/download/<tag>/platform-espressif32.zip
;
; CORE 2.x vs 3.x DRIFT: canary-sense runs core 3.x while the S3/C3 envs stay on
; 2.0.x. Any common/ code linked here must be audited for 2.x/3.x API drift
; (mbedtls_sha256 return type, LEDC/ADC/WiFi event APIs). Phase 2 is complete:
; the build now links the full witness/net/OTA stack (device_signature,
; securacv_ota, the sensor drivers) plus the _securacv._tcp mDNS fleet advert
; — all audited for core-3.x APIs. Hardware bench validation is still pending.
; ============================================================================

[common_esp32c6]
; Settings specific to the XIAO ESP32-C6 (pioarduino core 3.x).
extends = common
platform = ${platform_core3.platform}
board_build.mcu = esp32c6
board_build.f_cpu = 160000000L
; A/B OTA needs two app slots. The stock 4 MB default.csv slots (0x140000)
; overflowed when #869's unified discovery/identify landed (1,341,360 bytes
; built); the built-in min_spiffs.csv grows app0/app1 to 0x1E0000 each and
; shrinks the FS partition to 0x20000 — which costs nothing, because sense
; uses NO filesystem (its chains/config live in NVS, which keeps its place).
; NOTE: a partition-table change cannot ship over OTA — bench units flashed
; on default.csv need one USB reflash. flavors.json's size guard tracks the
; new slot size.
board_build.partitions = min_spiffs.csv

; Override the lib_ldf_mode = deep+ inherited from common.ini. On the
; pioarduino core-3.x framework, deep+ LDF fails to propagate the bundled
; Network library's include dir into the WiFi library, so WiFiGeneric.h's
; #include "Network.h" isn't found — the exact failure canary-wap.ini
; documents. The PlatformIO default `chain` mode resolves the framework
; include graph correctly.
lib_ldf_mode = chain

; With chain LDF, our shared common/ modules (whose headers are reached via
; -I .../common, not library-layout include paths) are not reliably mapped
; to LDF libraries — so compile them directly, the same build_src_filter
; pattern the canary tree uses for firmware/common/ota. Registry libraries
; (ArduinoJson, PubSubClient, Crypto) stay explicit lib_deps.
build_src_filter =
    +<*>
    +<../../../common/boot/boot_banner.cpp>
    +<../../../common/sensors/mmwave_mr60/mr60_uart.cpp>
    +<../../../common/sensors/mmwave_mr60/mr60_presence.cpp>
    +<../../../common/sensors/mmwave_mr60/mr60_vitals.cpp>
    +<../../../common/sensors/bh1750/bh1750.cpp>
    +<../../../common/ota/src/securacv_ota.cpp>
    +<../../../common/identity/device_signature.cpp>
    +<../../../common/network/setup_portal.cpp>

; The ESP32-C6 uses the USB Serial/JTAG peripheral for the console, like the C3
; (not the S3's USB-OTG CDC). The common ARDUINO_USB_CDC_ON_BOOT=1 flag is an
; S3-ism; leaving it defined prevents the core from providing `Serial` on
; USB-Serial/JTAG parts. Undefine it here (mirrors common_esp32c3).
build_flags =
    ${common.build_flags}
    -UARDUINO_USB_CDC_ON_BOOT

[env:canary-sense-default]
; Presence/count/lux witness — vitals compiled out.
extends = common_esp32c6
; board id: seeed_xiao_esp32c6 ships with the pioarduino fork's board set. If a
; future fork release drops it, fall back to esp32-c6-devkitc-1 (same MCU; only
; the LED/USB defaults differ, all of which we override via our pin map).
board = seeed_xiao_esp32c6

build_flags =
    ${common_esp32c6.build_flags}
    -I${PROJECT_DIR}/../../boards/xiao-esp32c6-mr60/pins
    -I${PROJECT_DIR}/../../configs/canary-sense/default
    -I${PROJECT_DIR}/../../common
    -I${PROJECT_DIR}/../../common/ota/src
    ; Canonical fleet-link presence beacon wire format (firmware/common/fleet_link).
    ; Makes <fleet_beacon.h> resolvable for the advertise-only BLE presence
    ; beacon (src/net/fleet_beacon_adv.cpp). Header-only; harmless when
    ; FEATURE_FLEET_BEACON=0 (its only include site is behind that gate).
    -I${PROJECT_DIR}/../../common/fleet_link
    -DCONFIG_CANARY_SENSE
    -I${PROJECT_DIR}/secrets
    -DCONFIG_DEFAULT

; Phase 2 network stack (mirrors canary-vision's dependency set):
;   PubSubClient — MQTT publish + HA discovery
;   Crypto       — Ed25519 verify for the signed pull-OTA engine
; The shared common/ modules are compiled via the build_src_filter in
; [common_esp32c6] (see the lib_ldf_mode note there), not lib_extra_dirs —
; chain-mode LDF cannot map our -I-style include paths onto libraries, and
; keeping both would compile the same TUs twice and fail the link.
lib_deps =
    ${common.lib_deps}
    knolleary/PubSubClient@^2.8
    rweather/Crypto@^0.4.0
    ; NimBLE for the advertise-only fleet-link presence beacon. This project is
    ; on the pioarduino core 3.x fork (like canary-wap), so it takes the
    ; NimBLE-Arduino 2.x line. Linked in but dead-stripped when
    ; FEATURE_FLEET_BEACON=0 (no symbols referenced).
    h2zero/NimBLE-Arduino@^2.3.8

[env:canary-sense-wellbeing]
; Presence + P1-gated vitals. The ONLY functional difference from default is the
; -DCANARY_SENSE_VITALS build flag (which compiles in mr60_vitals) and the
; wellbeing config include path. This is how the vitals switch crosses the
; config -> common boundary without a config.h include in common/.
extends = env:canary-sense-default

build_flags =
    ${common_esp32c6.build_flags}
    -I${PROJECT_DIR}/../../boards/xiao-esp32c6-mr60/pins
    -I${PROJECT_DIR}/../../configs/canary-sense/wellbeing
    -I${PROJECT_DIR}/../../common
    -I${PROJECT_DIR}/../../common/ota/src
    ; Canonical fleet-link presence beacon wire format (firmware/common/fleet_link).
    ; Makes <fleet_beacon.h> resolvable for the advertise-only BLE presence
    ; beacon (src/net/fleet_beacon_adv.cpp). Header-only; harmless when
    ; FEATURE_FLEET_BEACON=0 (its only include site is behind that gate).
    -I${PROJECT_DIR}/../../common/fleet_link
    -DCONFIG_CANARY_SENSE
    -I${PROJECT_DIR}/secrets
    -DCONFIG_WELLBEING
    -DCANARY_SENSE_VITALS=1
    ; Distinct OTA product/manifest: a presence-only unit must never install
    ; the wellbeing image (different privacy surface) or vice versa — the
    ; engine's product check enforces it.
    '-DSECURACV_OTA_PRODUCT="securacv-canary-sense-wellbeing"'
    '-DSECURACV_OTA_MANIFEST_URL="https://github.com/kmay89/securaCV/releases/latest/download/manifest-canary-sense-wellbeing.json"'

[env:canary-sense-debug]
; Default build with verbose ESP-IDF logging.
extends = env:canary-sense-default

build_flags =
    ${common_esp32c6.build_flags}
    -I${PROJECT_DIR}/../../boards/xiao-esp32c6-mr60/pins
    -I${PROJECT_DIR}/../../configs/canary-sense/default
    -I${PROJECT_DIR}/../../common
    -I${PROJECT_DIR}/../../common/ota/src
    ; Canonical fleet-link presence beacon wire format (firmware/common/fleet_link).
    ; Makes <fleet_beacon.h> resolvable for the advertise-only BLE presence
    ; beacon (src/net/fleet_beacon_adv.cpp). Header-only; harmless when
    ; FEATURE_FLEET_BEACON=0 (its only include site is behind that gate).
    -I${PROJECT_DIR}/../../common/fleet_link
    -DCONFIG_CANARY_SENSE
    -I${PROJECT_DIR}/secrets
    -DCONFIG_DEFAULT
    -DCORE_DEBUG_LEVEL=4
