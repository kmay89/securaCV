; ============================================================================
; PlatformIO platform pins — the ONE place an espressif32 / pioarduino
; platform literal may appear in firmware/.
; ============================================================================
;
; Every env under firmware/ takes its `platform =` from one of the sections
; below by interpolation (`platform = ${platform_core3.platform}`), never by a
; literal of its own; firmware/scripts/lint_platform_pins.py fails CI on a
; literal anywhere else, on a reference to a section that is not here, and on
; a section no env uses. Pull this file in through `[platformio]
; extra_configs` (every project's platformio.ini does) — PlatformIO resolves
; interpolation in the merged config, so a section here is visible to every
; env of the project that includes it.
;
; One section per DISTINCT literal, not per consumer: consumers that need the
; same bytes share a section, so a bump moves all of them together (the
; "bump in lockstep" every copy used to ask for is now structural). A
; consumer that needs different bytes gets its own section, with the reason
; written next to it.
;
; The refactor that created this file moved NO value; it inherited a spread
; (6.5.0 exact / ^6.5.0 / 6.9.0 exact / ^7.0.0) that nobody had designed. On
; 2026-09-22 the spread was settled to one exact pin per platform line — the
; official platform is 6.9.0 for every arduino env and 6.5.0 for the one
; espidf env; core 3.x is the pioarduino release — and no env floats on a
; caret any more. The decision record is in firmware/PLATFORMS.md.

[platform_s3c3]
; The official-platform arduino line, pinned EXACT: arduino-esp32 core 2.0.17
; / ESP-IDF 4.4.7, the bench-validated release path that canary-display's
; PARITY.md and core_compat.h name by number. Consumers: common_esp32s3 /
; common_esp32c3 in common.ini, and so every env that extends them —
; canary-vision, canary-display's core-2 SPI panels (watch, nightstand-s3,
; touch169, amoled241) and its C3 nightlight, and canary-sentinel-lite;
; firmware/canary's [env] default (dev / release / minimal / standalone / the
; board envs; [env:full] overrides to platform_core3); and the provisioning
; secure envs (provisioning/platformio_secure.ini). The last two joined on
; 2026-09-22 from the floating `^7.0.0` (the same 2.0.17 core) and `^6.5.0`
; (the newest 6.x, 6.9.0 or later) carets they carried; one exact pin now
; resolves the same on every runner. Which of them CI compiles is in
; PLATFORMS.md.
platform = espressif32@6.9.0

[platform_core3]
; The core-3 line: the community pioarduino fork, the only PlatformIO
; platform that packages arduino-esp32 3.x (55.03.38-1 = Arduino-ESP32 3.3.8 /
; ESP-IDF 5.5.4). Required by every ESP32-C6 env (the official platform does
; not support the C6 for framework=arduino), by canary-wap (IDF5-only APIs +
; NimBLE-Arduino 2.x), by canary's [env:full] (NimBLE 2.x) and by the
; canary-display dash family incl. dash7 / nightstand7 (GFX 1.6.x bounce
; buffers). A core-3 env cannot share a PLATFORMIO_CORE_DIR with a core-2 env
; — both platforms ship a package named framework-arduinoespressif32 at
; incompatible versions — and flavors.json's isolated_core_envs /
; core_dir_groups carry that, not this file.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip

[platform_ota_idf]
; firmware/projects/canary-ota — framework = espidf, not arduino, so this pin
; selects an ESP-IDF release rather than an Arduino core, and a pure-IDF
; sdkconfig is sensitive to IDF minor bumps. Exact pin, left where it was on
; 2026-09-22: bumping it is its own bench pass, not part of that decision.
platform = espressif32@6.5.0
