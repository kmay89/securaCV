; ============================================================================
; Common PlatformIO settings for SecuraCV firmware
; ============================================================================

; NOTE: default_envs is NOT set here. Each project's platformio.ini
; must define its own default_envs to avoid cross-project conflicts.

[common]
; Common build settings shared across all environments
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Library dependency finder — deep+ follows #include chains through
; conditionally compiled code (#if FEATURE_*), which chain mode can miss.
lib_ldf_mode = deep+

; Common build flags
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wall
    -Wextra
    -Wno-unused-parameter

; Common library dependencies
lib_deps =
    bblanchon/ArduinoJson@^7.0.0

; Static analysis
; The .pio suppressions silence defects cppcheck reports inside third-party
; dependency code it preprocesses via project includes (e.g. ArduinoJson's
; variadic-macro polyfills trip simplecpp with a preprocessorErrorDirective);
; --skip-packages alone doesn't filter defects *located* in .pio/libdeps.
check_tool = cppcheck
check_flags =
    cppcheck: --enable=warning,performance --suppress=missingInclude --suppress=*:.pio/* --suppress=*:*/.pio/*

; NOTE: extra_scripts is NOT set here. Each project's platformio.ini
; should reference scripts directly (e.g. pre:../../scripts/pre_build.py).

; NOTE: the espressif32 platform pin is NOT typed here either. It lives in
; platforms.ini ([platform_s3c3] for this S3/C3 line) and is interpolated
; below; firmware/scripts/lint_platform_pins.py rejects a literal anywhere
; but that file. Bump it there — firmware/PLATFORMS.md has the table.

[common_esp32s3]
; Settings specific to ESP32-S3 boards
extends = common
platform = ${platform_s3c3.platform}
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L

build_flags =
    ${common.build_flags}
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

[common_esp32c3]
; Settings specific to ESP32-C3 boards
extends = common
platform = ${platform_s3c3.platform}
board_build.mcu = esp32c3
board_build.f_cpu = 160000000L

; ESP32-C3 uses USB JTAG (not USB OTG/CDC). The common flag
; ARDUINO_USB_CDC_ON_BOOT=1 is for ESP32-S3; on C3 it prevents
; the framework from defining `Serial`, breaking HardwareSerial.cpp.
build_flags =
    ${common.build_flags}
    -UARDUINO_USB_CDC_ON_BOOT
