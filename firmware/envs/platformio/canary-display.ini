; ============================================================================
; Nightstand Line (docs/hardware/display_nightstand_line.md)
; ============================================================================
;
; A new portrait flavor: ST7789 172x320 + one WS2812 ambient state beacon, on
; two boards. Plus the 7" Dash sibling (dash7). All three share the app; only
; the S3 boards build on this core-2.x graphics stack today (see the C6 note).

[env:canary-display-nightstand-s3]
; The Canary Nightstand on the Waveshare ESP32-S3-LCD-1.47 (USB-A stick):
; ST7789 172x320 portrait + WS2812 beacon, 16 MB flash / 8 MB PSRAM. Same S3
; line + core-2.x graphics stack as the watch/dash, so it builds here in CI.
extends = canary_display_base
board = esp32-s3-devkitc-1
; The -lcd147 S3 carries 8 MB QUAD PSRAM (not the dash's octal). The portrait
; UI renders from an internal static buffer regardless (lvgl_port.cpp), so
; PSRAM mode is not load-bearing; qio_qspi matches the quad part. VERIFY on
; the bench.
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; Shared common/ TUs: the LDF cannot discover bare .cpp files behind a -I
; include path, so compile the color + look engine directly — the same
; build_src_filter pattern canary-sense.ini uses for boot_banner.cpp and
; canary-vision.ini uses for the identity signer.
;
; This is the ONLY flavor that needs them: CONFIG_NIGHTSTAND below is what
; compiles the ambient_led / portrait_ui code that calls into them, so the
; watch and dash images stay byte-identical.
;
; Do not try to solve this by making common/color an LDF-discoverable
; library instead. That was tried twice — first with a library.json manifest,
; then by dropping its `headers` key to match common/boot exactly — and
; canary-display-nightstand-s3 still failed to link `wash_stops` both times.
; The sources here include it as "color/look_engine.h", resolved through the
; -I above rather than through the library, which is precisely the case the
; LDF does not follow.
build_src_filter =
    +<*>
    +<../../../common/color/color_engine.cpp>
    +<../../../common/color/look_engine.cpp>
    +<../../../common/color/plumage.cpp>

build_flags =
    ${common_esp32s3.build_flags}
    -I${PROJECT_DIR}/../../boards/waveshare-esp32s3-lcd147/pins
    -I${PROJECT_DIR}/../../configs/canary-display/nightstand
    -I${PROJECT_DIR}/../../common
    -DCONFIG_CANARY_DISPLAY
    -I${PROJECT_DIR}/secrets
    -DCONFIG_NIGHTSTAND
    -DLV_CONF_INCLUDE_SIMPLE
    -I${PROJECT_DIR}/include
    '-DSECURACV_OTA_PRODUCT="securacv-canary-display-nightstand-s3"'
    '-DSECURACV_OTA_MANIFEST_URL="https://github.com/kmay89/securaCV/releases/latest/download/manifest-canary-display-nightstand-s3.json"'

[env:canary-display-touch169]
; The Canary Nightstand Touch on the Waveshare ESP32-S3-Touch-LCD-1.69: the
; SAME nightstand app (CD_FLAVOR_NIGHTSTAND — display_1in47.cpp ST7789 HAL +
; portrait_ui.cpp, both geometry-parametric via pins.h) on a 240x280 glass
; that adds a CST816T touch layer (FEATURE_TOUCH in the touch169 config
; compiles the HAL's double-gated CST816 path) and drops the WS2812 (the
; glass is the beacon). S3R8: 16 MB flash + 8 MB OCTAL PSRAM (qio_opi — the
; dash's memory type, not the quad -lcd147 stick's).
extends = canary_display_base
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; Same shared common/ TUs as nightstand-s3, for the same LDF reason: the
; portrait face + look engine include "color/…" through -I, which the LDF
; does not follow. See the nightstand-s3 comment before "solving" this with
; a library manifest — that was tried twice and failed to link wash_stops.
build_src_filter =
    +<*>
    +<../../../common/color/color_engine.cpp>
    +<../../../common/color/look_engine.cpp>
    +<../../../common/color/plumage.cpp>

build_flags =
    ${common_esp32s3.build_flags}
    -I${PROJECT_DIR}/../../boards/waveshare-esp32s3-touch-lcd169/pins
    -I${PROJECT_DIR}/../../configs/canary-display/touch169
    -I${PROJECT_DIR}/../../common
    -DCONFIG_CANARY_DISPLAY
    -I${PROJECT_DIR}/secrets
    -DCONFIG_NIGHTSTAND
    -DLV_CONF_INCLUDE_SIMPLE
    -I${PROJECT_DIR}/include
    '-DSECURACV_OTA_PRODUCT="securacv-canary-display-touch169"'
    '-DSECURACV_OTA_MANIFEST_URL="https://github.com/kmay89/securaCV/releases/latest/download/manifest-canary-display-touch169.json"'

[env:canary-display-amoled241]
; The Canary Glance AMOLED on the Waveshare ESP32-S3-Touch-AMOLED-2.41: the
; SAME nightstand app (CD_FLAVOR_NIGHTSTAND — portrait face + witness column
; + honest night, geometry-parametric via pins.h) on the flagship glass: an
; RM690B0 450x600 QSPI AMOLED (brightness is a panel command — no backlight
; pin at all), FT6336 touch (INT behind the TCA9554 — polled), QMI8658 IMU,
; PCF85063 RTC, a dedicated SDMMC microSD slot, and a Li-po behind a soft
; power latch. CD_AMOLED_GLASS in its config swaps display_amoled241.cpp in
; for the ST7789 HAL. QSPI has no RGB-scanout-contention mechanism, so this
; env stays on the core-2 base like every SPI-panel env — Arduino_ESP32QSPI
; and Arduino_RM690B0 both ship in the pinned GFX 1.4.9. S3R8: 16 MB flash +
; 8 MB OCTAL PSRAM (qio_opi, same part as the Touch-1.69).
extends = canary_display_base
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; Same shared common/ TUs as nightstand-s3/touch169, for the same LDF
; reason: the portrait face + look engine include "color/…" through -I,
; which the LDF does not follow. See the nightstand-s3 comment before
; "solving" this with a library manifest — tried twice, failed to link
; wash_stops.
build_src_filter =
    +<*>
    +<../../../common/color/color_engine.cpp>
    +<../../../common/color/look_engine.cpp>
    +<../../../common/color/plumage.cpp>

build_flags =
    ${common_esp32s3.build_flags}
    -I${PROJECT_DIR}/../../boards/waveshare-esp32s3-amoled241/pins
    -I${PROJECT_DIR}/../../configs/canary-display/amoled241
    -I${PROJECT_DIR}/../../common
    -DCONFIG_CANARY_DISPLAY
    -I${PROJECT_DIR}/secrets
    -DCONFIG_NIGHTSTAND
    ; The SD deep archive flag must arrive as a -D, not only in config.h:
    ; the core-2 base rides deep+ LDF (common.ini), which evaluates each
    ; TU's conditionals using command-line defines ONLY — a flag defined in
    ; the -I'd config header is invisible to it, so the framework-bundled
    ; SD_MMC library never joins the build and sd_archive.cpp dies on
    ; '#include <SD_MMC.h>'. The flavor config #ifndef-guards its own
    ; default so this -D and the header agree (the dash-sd lesson).
    -DFEATURE_SD_STORAGE=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I${PROJECT_DIR}/include
    '-DSECURACV_OTA_PRODUCT="securacv-canary-display-amoled241"'
    '-DSECURACV_OTA_MANIFEST_URL="https://github.com/kmay89/securaCV/releases/latest/download/manifest-canary-display-amoled241.json"'

[env:canary-display-dash7]
; The Canary Dash 7 on the Waveshare ESP32-S3-Touch-LCD-7: electrically the
; 4.3" Dash at 7" (same 800x480 RGB + GT911 5-point + CH422G), so it reuses
; the dash flavor/HAL/UI wholesale — only the board pins and OTA product
; differ. Inherits the dash's board/flash/PSRAM geometry.
extends = env:canary-display-dash

build_flags =
    ${common_esp32s3.build_flags}
    -I${PROJECT_DIR}/../../boards/waveshare-esp32s3-lcd7/pins
    -I${PROJECT_DIR}/../../configs/canary-display/dash7
    -I${PROJECT_DIR}/../../common
    -DCONFIG_CANARY_DISPLAY
    -I${PROJECT_DIR}/secrets
    -DCONFIG_DASH
    -DLV_CONF_INCLUDE_SIMPLE
    -I${PROJECT_DIR}/include
    '-DSECURACV_OTA_PRODUCT="securacv-canary-display-dash7"'
    '-DSECURACV_OTA_MANIFEST_URL="https://github.com/kmay89/securaCV/releases/latest/download/manifest-canary-display-dash7.json"'

[env:canary-display-nightstand7]
; The Canary Nightstand 7 on the SAME Waveshare ESP32-S3-Touch-LCD-7 glass as
; dash7, wearing the bedside personality instead of the wall one: the config
; keeps CD_FLAVOR_DASH (RGB HAL / GT911 / CH422G / 800x480 modal surfaces are
; the dash's) and adds CD_NIGHTSTAND7, which swaps the standing face for
; nightstand7_ui.cpp (clock hero + weather + comfort + fleet strip; red
; clock-focus night face), compiles dash_ui.cpp out, and turns the bedside
; wave on (night blackout, gentle wake, lantern). Distinct OTA product — a
; wall dash7 must never cross-grade into a bedside image or vice versa.
extends = env:canary-display-dash

; NO build_src_filter here — and that is the opposite of nightstand-s3 and
; touch169 on purpose. Those two ride the core-2 base with deep+ LDF, which
; does NOT map common/color to a library, so they must name its .cpp files
; explicitly or wash_stops goes undefined. This env extends the DASH, which
; carries `lib_ldf_mode = chain` on top of the base's
; `lib_extra_dirs = ../../common` — and that combination DOES resolve
; firmware/common/color as an ordinary LDF library. Naming the sources here
; as well compiled them a second time and the link died on `multiple
; definition of canary::color::gamma8` (and every other symbol in the pair).
;
; So: same rule as everywhere ("a path-prefixed include must actually be
; compiled"), satisfied by a different mechanism in this family. If the dash
; family ever loses lib_extra_dirs or moves off chain LDF, this env needs the
; explicit filter back — the symptom would be undefined references to
; canary::color::*, not a compile error.
build_flags =
    ${common_esp32s3.build_flags}
    -I${PROJECT_DIR}/../../boards/waveshare-esp32s3-lcd7/pins
    -I${PROJECT_DIR}/../../configs/canary-display/nightstand7
    -I${PROJECT_DIR}/../../common
    -DCONFIG_CANARY_DISPLAY
    -I${PROJECT_DIR}/secrets
    -DCONFIG_DASH
    -DLV_CONF_INCLUDE_SIMPLE
    -I${PROJECT_DIR}/include
    '-DSECURACV_OTA_PRODUCT="securacv-canary-display-nightstand7"'
    '-DSECURACV_OTA_MANIFEST_URL="https://github.com/kmay89/securaCV/releases/latest/download/manifest-canary-display-nightstand7.json"'

[canary_display_c6_core3]
; Core-3.x display base for the ESP32-C6 nightstand board — the reconciliation
; display_nightstand_line.md §7 staged. Deliberately NOT an extension of
; canary_display_base: the C6 needs arduino-esp32 3.x (the pioarduino fork,
; pinned to the same 55.03.38-1 release line canary-sense and canary-wap ride —
; bump in lockstep with them), and the core-3 line takes the OTHER half of the
; dual-major library matrix sketch.yaml documents: GFX 1.6.6 / LVGL 9.5.0 /
; NimBLE 2.5.0 — the exact set firmware.yml's build-arduino-cli-display core-3
; row proves on every push. The source is already dual-major (hal/core_compat.h,
; lvgl_port.cpp); only this toolchain binding was missing.
;
; Mixing lines fails the build (core 3 + GFX 1.4.9 → "esp32-hal-periman.h: No
; such file or directory") — never edit a single pin here; move the whole set.
extends = common
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board_build.mcu = esp32c6
board_build.f_cpu = 160000000L

; Override common.ini's deep+ — on the pioarduino core-3.x framework, deep+
; LDF fails to propagate the bundled Network library's include dir into the
; WiFi library (the exact failure canary-wap.ini and canary-sense.ini
; document). The PlatformIO default `chain` mode resolves the framework
; include graph correctly.
lib_ldf_mode = chain

; The ESP32-C6 uses the USB Serial/JTAG peripheral for the console, like the
; C3 (not the S3's USB-OTG CDC). The common ARDUINO_USB_CDC_ON_BOOT=1 flag is
; an S3-ism; leaving it defined prevents the core from providing `Serial` on
; USB-Serial/JTAG parts. Undefine it here (mirrors common_esp32c6 in
; canary-sense.ini).
build_flags =
    ${common.build_flags}
    -UARDUINO_USB_CDC_ON_BOOT

lib_deps =
    ${common.lib_deps}
    knolleary/PubSubClient@^2.8
    rweather/Crypto@^0.4.0
    ; Core-3 library row (see the matrix note above). GFX is an EXACT pin for
    ; the same reason 1.4.9 is on the core-2 base: the majors split along the
    ; core boundary and a caret would let a future release drift across it.
    moononournation/GFX Library for Arduino@1.6.6
    lvgl/lvgl@^9.5.0
    h2zero/NimBLE-Arduino@^2.5.0

[env:canary-display-nightstand-c6]
; The Canary Nightstand on the Waveshare ESP32-C6-LCD-1.47 (pin-header board):
; ST7789 172x320 portrait + WS2812 beacon, 4 MB flash, NO PSRAM — the HAL
; renders from a single internal static buffer (lvgl_port.cpp), so the missing
; PSRAM costs nothing. Same flavor/config as the S3 stick; only the board pins,
; toolchain base, and OTA product differ.
extends = canary_display_c6_core3
; The pioarduino fork ships no Waveshare C6-LCD board def; the devkit profile
; matches the module (C6, USB-Serial/JTAG) with the flash size overridden to
; the board's 4 MB part. NOTE: at least one bench unit reports an 8 MB flash
; ID over espflash (2026-08-07) — a possible board revision. The 4 MB
; geometry stays until the part is confirmed across revisions: an 8 MB chip
; runs a 4 MB table with the upper half unused, while shipping 8 MB geometry
; to a genuine 4 MB unit would brick it.
board = esp32-c6-devkitc-1
board_upload.flash_size = 4MB
; A/B OTA on 4 MB: partitions_display_4mb.csv — min_spiffs with the unused
; 128 KB spiffs region folded into the app slots (this display keeps its
; config/chain state in NVS, no filesystem), growing app0/app1 to 0x1F0000
; (2,031,616 B) each. v2.4.6 proved min_spiffs' 0x1E0000 slot too small the
; hard way: its 1,971,152-byte image sailed through checkprogsize — which
; sums ELF sections, NOT the final .bin (image header + segment padding +
; appended hash make the .bin bigger) — and shipped a factory image neither
; slot could boot (.github/RELEASE_LESSONS.md, 2026-08-07). The byte-accurate
; gate is the flavors.json size_guards entry for THIS bin; make_factory.py
; refuses to merge an app that outgrows its slot as the last line of defense.
board_build.partitions = partitions_display_4mb.csv

; With chain LDF, the shared common/ modules (whose headers are reached via
; -I .../common, not library-layout include paths) are not reliably mapped to
; LDF libraries — so compile them directly, the same build_src_filter pattern
; canary-sense.ini uses. This replaces the S3 base's lib_extra_dirs discovery
; (boot_banner, ota, identity) AND the nightstand-s3 env's color-engine
; entries — keeping both paths would compile the same TUs twice and fail the
; link. device_signature.cpp is already core-3.x-audited (canary-sense links
; it on this exact platform pin).
build_src_filter =
    +<*>
    +<../../../common/boot/boot_banner.cpp>
    +<../../../common/ota/src/securacv_ota.cpp>
    +<../../../common/identity/device_signature.cpp>
    +<../../../common/color/color_engine.cpp>
    +<../../../common/color/look_engine.cpp>
    +<../../../common/color/plumage.cpp>

build_flags =
    ${canary_display_c6_core3.build_flags}
    -I${PROJECT_DIR}/../../boards/waveshare-esp32c6-lcd147/pins
    -I${PROJECT_DIR}/../../configs/canary-display/nightstand
    -I${PROJECT_DIR}/../../common
    ; "securacv_ota.h" / "ota_release_key.h" resolve through the ota library's
    ; include dir on the S3 envs (lib_extra_dirs); with chain LDF they need the
    ; explicit path, exactly as canary-sense.ini adds it.
    -I${PROJECT_DIR}/../../common/ota/src
    -DCONFIG_CANARY_DISPLAY
    -I${PROJECT_DIR}/secrets
    -DCONFIG_NIGHTSTAND
    ; ── The lean budget ────────────────────────────────────────────────────
    ; The full nightstand image is ~2.38 MB; this board's OTA A/B slot is
    ; 0x1F0000 (1.98 MB — partitions_display_4mb.csv above). Two documented
    ; cuts close most of the gap (measured with esp-idf-size on the .map):
    ;   CD_LEAN_BUILD          drops the 36/48 Montserrat faces (~170 KB) —
    ;                          lv_conf.h + character.cpp's lean ladder; the
    ;                          1.47" bedside glass never draws room-scale type
    ;   FEATURE_CHIRP_SCAN=0   compiles the BLE stack out (~300 KB:
    ;   FEATURE_FLEET_LINK=0   libble_app + the NimBLE host) — off-grid BLE
    ;                          on the C6 returns with future size work; the
    ;                          S3 stick keeps it today
    ; History: the cuts landed at 1,955,024 bytes against min_spiffs' 0x1E0000
    ; slot (~11 KB spare); v2.4.6 grew to 1,971,152 and shipped anyway —
    ; checkprogsize measures the ELF, not the .bin, so the ~11 KB were gone
    ; before any gate spoke. The slot is now 0x1F0000 (~60 KB spare at 2.4.6)
    ; and the flavors.json size_guards entry for this bin is the byte-accurate
    ; ceiling. The next cuts are already scoped for when it fills again:
    ; unused LVGL widget classes, then FEATURE_PROOF_QR. Grow this image
    ; knowingly — a board still carrying the old table cannot take an image
    ; past 0x1E0000 over the air (USB re-flash installs the new table).
    -DCD_LEAN_BUILD=1
    -DFEATURE_CHIRP_SCAN=0
    -DFEATURE_FLEET_LINK=0
    -DLV_CONF_INCLUDE_SIMPLE
    -I${PROJECT_DIR}/include
    ; Distinct OTA product per board: a C6 image must never install on the S3
    ; stick (different SoC architecture entirely) — the engine's product check
    ; enforces it, same scheme as the rest of the family.
    '-DSECURACV_OTA_PRODUCT="securacv-canary-display-nightstand-c6"'
    '-DSECURACV_OTA_MANIFEST_URL="https://github.com/kmay89/securaCV/releases/latest/download/manifest-canary-display-nightstand-c6.json"'

[canary_display_c3_base]
; Core-2.x display base for the ESP32-C3 pocket board (the Canary
; Nightlight). Unlike the C6 — which is blocked on the core-3 toolchain —
; the C3 rides the SAME espressif32@6.9.0 / arduino core-2.0.x line as the
; S3 SPI-panel envs, so it takes the core-2 library row unchanged: GFX
; 1.4.9 (EXACT pin — 1.5.0+ needs core 3.x; see canary_display_base) +
; LVGL 8.4. NimBLE is deliberately ABSENT from this base: the 4 MB C3
; shares the 4 MB C6's partition table and slot budget, both BLE
; features are compiled out (FEATURE_CHIRP_SCAN=0 / FEATURE_FLEET_LINK=0
; in the nightlight config), and deep+ LDF follows includes through false
; #if gates — leaving the library out of lib_deps is what guarantees the
; stack stays out of the image.
extends = common_esp32c3

lib_deps =
    ${common.lib_deps}
    ; MQTT subscribe/publish (idles standalone with no broker configured)
    knolleary/PubSubClient@^2.8
    ; Ed25519 — witness chain verify (TOFU) + the signed pull-OTA engine
    rweather/Crypto@^0.4.0
    moononournation/GFX Library for Arduino@1.4.9
    lvgl/lvgl@^8.4.0

; Discover shared PIO libraries in common/ (boot_banner, ota, identity) —
; same deep+ + lib_extra_dirs recipe as canary_display_base.
lib_extra_dirs =
    ../../common

[env:canary-display-nightlight-c3]
; The Canary Nightlight on the Waveshare ESP32-C3-LCD-1.47 (pocket case):
; ST7789T portrait glass whose CS/RST/backlight ride the board's I2C EXIO
; expander (display_1in47.cpp's TFT_USE_EXIO path), a 7-segment clock face
; with the canary companion (nightlight_ui.cpp, CD_NIGHTLIGHT over the
; nightstand flavor), and a HAL-enforced 50% backlight duty ceiling
; (CD_BL_MAX_PCT — closed PETG case, heat budget). 4 MB flash, no PSRAM.
extends = canary_display_c3_base
; The platform ships no Waveshare C3-LCD board def; the DevKitM profile
; matches the module (C3, USB-Serial/JTAG) with the board's 4 MB flash.
board = esp32-c3-devkitm-1
board_upload.flash_size = 4MB
; A/B OTA on 4 MB: partitions_display_4mb.csv — the same 0x1F0000-slot table
; the 4 MB C6 nightstand uses (state is NVS-only on both; the CSV header has
; the derivation). One asymmetry, on purpose: this flavor's flavors.json
; size_guards ceiling stays at the OLD 0x1E0000 slot, because C3 nightlights
; flashed before this table shipped still carry min_spiffs and must remain
; OTA-reachable — an image past their slot would strand them the way v2.4.6
; stranded old-table C6 boards. When the image outgrows 1,966,080 bytes, the
; guard goes red and raising it is a deliberate decision to require a USB
; re-flash of old-table boards, not a side effect.
board_build.partitions = partitions_display_4mb.csv

; Shared common/ color TUs, compiled explicitly: with deep+ LDF the color
; engine's headers are reached via -I .../common, which the LDF does not
; follow (the exact nightstand-s3 finding — and see its long comment before
; trying to "fix" this with a library manifest; that was tried twice).
build_src_filter =
    +<*>
    +<../../../common/color/color_engine.cpp>
    +<../../../common/color/look_engine.cpp>
    +<../../../common/color/plumage.cpp>

build_flags =
    ${common_esp32c3.build_flags}
    -I${PROJECT_DIR}/../../boards/waveshare-esp32c3-lcd147/pins
    -I${PROJECT_DIR}/../../configs/canary-display/nightlight
    -I${PROJECT_DIR}/../../common
    -DCONFIG_CANARY_DISPLAY
    -I${PROJECT_DIR}/secrets
    ; The nightlight IS a nightstand-flavor build (HAL + shared surfaces);
    ; CD_NIGHTLIGHT in its config.h swaps the face. Marker define follows
    ; the family convention (nightstand7 passes CONFIG_DASH the same way).
    -DCONFIG_NIGHTSTAND
    ; ── The lean budget ────────────────────────────────────────────────────
    ; Same slot arithmetic as the C6 nightstand: 0x1E0000 A/B slots on 4 MB.
    ; CD_LEAN_BUILD drops the 36/48 Montserrat faces; BLE is out via the
    ; nightlight config (and NimBLE is absent from the base — see above);
    ; the config also sheds PROOF_QR / comfort / weather, which the C6 keeps.
    -DCD_LEAN_BUILD=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I${PROJECT_DIR}/include
    ; ── First Light: the boxed pair (docs/first_light_demo.md) ────────────
    ; ESP-NOW receive is the ONE radio band this lean build carries beyond
    ; the LAN multicast: it rides the already-linked WiFi driver (no NimBLE,
    ; no new stack — the BLE budget reasoning above is untouched), and it is
    ; what lets a factory-fresh Vision reach this glass with no router. The
    ; pair-demo surface renders it: hold BOOT 5 s, or out of the box the
    ; card walks up to you when an unprovisioned glass hears a camera.
    -DFEATURE_ESPNOW=1
    -DFEATURE_PAIR_DEMO=1
    ; Distinct OTA product per board: a C3 image must never install on the
    ; C6 or S3 1.47" siblings (different SoC / different pin worlds) — the
    ; engine's product check enforces it, same scheme as the whole family.
    '-DSECURACV_OTA_PRODUCT="securacv-canary-display-nightlight-c3"'
    '-DSECURACV_OTA_MANIFEST_URL="https://github.com/kmay89/securaCV/releases/latest/download/manifest-canary-display-nightlight-c3.json"'
