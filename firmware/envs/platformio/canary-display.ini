[env:canary-display-dash-ble5]
; The Canary Dash with BLE 5 long-range scanning compiled in
; (FEATURE_BLE5_SCAN). A compile-verification env: it proves the gated
; extended/Coded-PHY scan path in src/net/chirp_scan.cpp and the raised BLE
; heap gate (ble_gate.h) build against the real toolchain, while the default
; dash / playground / emulator builds stay byte-identical (the flag only
; widens the passive-scan window and the heap margin; the chirp wire format
; is unchanged — BLE 5 buys range on the same 17-byte payload). Bench-gated,
; exactly like FEATURE_CHIME: turning it into *actual* Coded-PHY reception
; also needs the NimBLE library built with extended advertising
; (-DCONFIG_BT_NIMBLE_EXT_ADV=1) and a Canary transmitting on the Coded PHY —
; the coexistence + range soak on real radios is the last gate (spec §6).
extends = env:canary-display-dash

