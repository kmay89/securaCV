[env:canary-display-dash-vault]
; The Canary Dash on the 4.3B with the evidence vault compiled in
; (FEATURE_TIME_MACHINE_PERSIST). A compile-verification env: it proves the
; LittleFS + ArduinoJson persistence body in src/fleet/journal_store.cpp builds
; against the real toolchain, while the default dash / playground / emulator
; builds stay byte-identical (the TU is inert no-op stubs without the flag; the
; emulator additionally excludes it via !defined(__EMSCRIPTEN__), so flipping
; the flag never perturbs the wasm dist). LittleFS ships with the arduino-esp32
; framework and lands on the stock default_16MB.csv spiffs data partition the
; dash already uses; ArduinoJson is already a dash lib_dep (mqtt_mgr). The dash
; never signs, so the vault stores already-signed chain heads, it never mints
; provenance. Bench-pending — a power-cycle reload + flash-wear soak on real
; hardware is the last gate before the default flag flips on (bench runbook §F7).
extends = env:canary-display-dash

build_flags =
