[env:canary-display-dash-mic]
; The MIC-BEARING dash: the Waveshare 4.3C ("AI voice") — the one display in
; the family that physically carries microphones (dual-MIC array behind an
; ES7210, ES8311 codec alongside). A DISTINCT privacy surface with its own
; OTA product (never cross-installed with the mic-free dashes) and a
; contract the firmware enforces (docs/hardware/display_mic_variant.md):
; FEATURE_MIC_ALARM hears the two regulated alarm grammars ONLY (smoke T3 /
; CO T4 -> unsigned local events), computes scalars and zeroes samples, is
; OFF by default (Settings -> microphone, NVS), hard-mutes by uninstalling
; the I2S driver, and lights the amber MIC chip exactly while the driver
; runs. Compile-verification env; the audio pins ship -1 (VERIFY) so the
; mics are provably un-driven until a bench fills them from the schematic.
extends = env:canary-display-dash

