; ============================================================================
; Nightstand Line (docs/hardware/display_nightstand_line.md)
; ============================================================================
;
; A new portrait flavor: ST7789 172x320 + one WS2812 ambient state beacon, on
; two boards. Plus the 7" Dash sibling (dash7). All three share the app; only
; the S3 boards build on this core-2.x graphics stack today (see the C6 note).

[env:canary-display-nightstand-s3]
; The Canary Nightstand on the Waveshare ESP32-S3-LCD-1.47 (USB-A stick):
; ST7789 172x320 portrait + WS2812 beacon, 16 MB flash / 8 MB PSRAM. Same S3
; line + core-2.x graphics stack as the watch/dash, so it builds here in CI.
extends = canary_display_base
board = esp32-s3-devkitc-1
; The -lcd147 S3 carries 8 MB QUAD PSRAM (not the dash's octal). The portrait
; UI renders from an internal static buffer regardless (lvgl_port.cpp), so
; PSRAM mode is not load-bearing; qio_qspi matches the quad part. VERIFY on
; the bench.
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; Shared common/ TUs: the LDF cannot discover bare .cpp files behind a -I
; include path, so compile the color + look engine directly — the same
; build_src_filter pattern canary-sense.ini uses for boot_banner.cpp and
; canary-vision.ini uses for the identity signer.
;
; This is the ONLY flavor that needs them: CONFIG_NIGHTSTAND below is what
; compiles the ambient_led / portrait_ui code that calls into them, so the
; watch and dash images stay byte-identical.
;
; Do not try to solve this by making common/color an LDF-discoverable
; library instead. That was tried twice — first with a library.json manifest,
; then by dropping its `headers` key to match common/boot exactly — and
; canary-display-nightstand-s3 still failed to link `wash_stops` both times.
; The sources here include it as "color/look_engine.h", resolved through the
; -I above rather than through the library, which is precisely the case the
; LDF does not follow.
build_src_filter =
    +<*>
    +<../../../common/color/color_engine.cpp>
    +<../../../common/color/look_engine.cpp>

build_flags =
    ${common_esp32s3.build_flags}
    -I${PROJECT_DIR}/../../boards/waveshare-esp32s3-lcd147/pins
    -I${PROJECT_DIR}/../../configs/canary-display/nightstand
    -I${PROJECT_DIR}/../../common
    -DCONFIG_CANARY_DISPLAY
    -I${PROJECT_DIR}/secrets
    -DCONFIG_NIGHTSTAND
    -DLV_CONF_INCLUDE_SIMPLE
    -I${PROJECT_DIR}/include
    '-DSECURACV_OTA_PRODUCT="securacv-canary-display-nightstand-s3"'
    '-DSECURACV_OTA_MANIFEST_URL="https://github.com/kmay89/securaCV/releases/latest/download/manifest-canary-display-nightstand-s3.json"'

; The shared look engine (firmware/common/color) is compiled DIRECTLY, not via
; the LDF — the same build_src_filter pattern canary-sense and canary-sentinel
; use for their common/ modules, and for the same underlying reason.
;
; This project inherits `lib_ldf_mode = deep+` from common.ini, and deep+
; EVALUATES preprocessor conditionals when it scans for libraries. Both callers
; reach the engine from inside a flavor/feature guard — portrait_ui.cpp behind
; `#ifdef CD_FLAVOR_NIGHTSTAND`, ambient_led.cpp behind `FEATURE_AMBIENT_LED &&
; HAS_RGBLED` — and those symbols are not defined during the LDF's scan. So the
; LDF concludes the includes are inactive, never discovers common/color, and
; never compiles its sources. The headers still resolve through the
; `-I .../common` above, so it compiles clean and fails only at LINK:
;
;   undefined reference to canary::color::wash_stops(...)
;
; A library.json on common/color does NOT fix this — the manifest is only
; consulted for a library the LDF has already decided to look at. That is why
; common/boot works with one and this does not: boot_banner.h is included
; UNCONDITIONALLY from main.cpp, so the LDF always sees it.
;
; Listing the translation units here is deterministic and flavor-scoped: no
; other display env references the engine, so no other image grows. Do not also
; add a library.json to common/color — that risks compiling these TUs twice and
; failing the link with duplicate symbols (see the same warning in
; canary-sense.ini).
build_src_filter =
    +<*>
    +<../../../common/color/color_engine.cpp>
    +<../../../common/color/look_engine.cpp>

[env:canary-display-dash7]
; The Canary Dash 7 on the Waveshare ESP32-S3-Touch-LCD-7: electrically the
; 4.3" Dash at 7" (same 800x480 RGB + GT911 5-point + CH422G), so it reuses
; the dash flavor/HAL/UI wholesale — only the board pins and OTA product
; differ. Inherits the dash's board/flash/PSRAM geometry.
extends = env:canary-display-dash

build_flags =
    ${common_esp32s3.build_flags}
    -I${PROJECT_DIR}/../../boards/waveshare-esp32s3-lcd7/pins
    -I${PROJECT_DIR}/../../configs/canary-display/dash7
    -I${PROJECT_DIR}/../../common
    -DCONFIG_CANARY_DISPLAY
    -I${PROJECT_DIR}/secrets
    -DCONFIG_DASH
    -DLV_CONF_INCLUDE_SIMPLE
    -I${PROJECT_DIR}/include
    '-DSECURACV_OTA_PRODUCT="securacv-canary-display-dash7"'
    '-DSECURACV_OTA_MANIFEST_URL="https://github.com/kmay89/securaCV/releases/latest/download/manifest-canary-display-dash7.json"'

; ── canary-display-nightstand-c6 (STAGED — not in the CI build matrix) ──────
; The pin-header nightstand board is the Waveshare ESP32-C6-LCD-1.47. The C6
; needs arduino-esp32 3.x (the pioarduino fork, as canary-sense/canary-wap
; pin), but this project's graphics stack is pinned to "GFX Library for
; Arduino"@1.4.9 — the LAST core-2.x-compatible release (1.5.0+ needs core
; 3.x). So the C6 nightstand cannot build against canary_display_base as-is;
; it needs a core-3.x display base (GFX@^1.5.0 + an LVGL/NimBLE audit for the
; 3.x APIs). That reconciliation is its own slice — tracked in
; display_nightstand_line.md §7. The firmware (HAL/UI/beacon) is already
; C6-ready (single internal buffer, RMT LED); only the build toolchain waits.
