[env:canary-display-dash-rtc]
; The Canary Dash on the 4.3B with the PCF8563 trusted-time layer compiled in
; (FEATURE_RTC). A compile-verification env: it proves the gated runtime + the
; pure RTC core build against the real toolchain while the default dash /
; playground / emulator builds stay byte-identical (the driver TU is empty
; without the flag). Runtime-probing by design — it does not require HAS_RTC (both
; 4.3B headers declare it 0 pending a bench check), it asks 0x51 on the shared
; I2C bus and uses the RTC only if it ACKs with a reliable time, else SNTP.
; Bench-pending — confirm the RTC silicon + address on a real board (capability
; map §6). 4.3B pins.
extends = env:canary-display-dash

