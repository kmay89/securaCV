; ============================================================================
; Canary Display Build Environments  (Watch Station puck + Dash 4.3" panel)
; ============================================================================
;
; Two hardware flavors of the same app ("a Canary that shows instead of
; senses" — see docs/hardware/display_research.md):
;
;   canary-display-watch  XIAO ESP32-S3 + Seeed Round Display for XIAO
;                         (1.28" 240x240 GC9A01 SPI + CST816S touch)
;   canary-display-dash   Waveshare ESP32-S3-Touch-LCD-4.3
;                         (800x480 parallel RGB565 + GT911 touch + CH422G)
;   canary-display-watch-debug   watch + verbose ESP-IDF logging
;
; Both are ESP32-S3 on the standard espressif32@6.9.0 platform (arduino core
; 2.0.x) — same S3 line as canary-vision-xiao-s3, so the net/OTA stack is
; shared verbatim. Graphics are moononournation's Arduino_GFX, which drives
; both the GC9A01 SPI panel and the S3's RGB LCD peripheral from one API;
; the HAL keeps it contained so the UI never touches panel specifics.
;
; Distinct OTA products per flavor: a watch image must never install on a
; dash (different panel wiring entirely) — the engine's product check
; enforces it, same scheme as canary-vision's per-board products.
; ============================================================================

[canary_display_base]
extends = common_esp32s3

lib_deps =
    ${common.lib_deps}
    ; MQTT subscribe/publish
    knolleary/PubSubClient@^2.8
    ; Ed25519 — witness chain verify (TOFU) + the signed pull-OTA engine
    rweather/Crypto@^0.4.0
    ; Panel + primitives for both flavors (GC9A01 SPI and S3 RGB LCD).
    ; EXACT pin, no caret: 1.5.0+ requires arduino-esp32 core 3.x (its bus
    ; drivers include esp32-hal-periman.h, which core 2.0.x doesn't ship),
    ; and these envs ride the S3 line's espressif32@6.9.0 / core 2.0.x.
    ; 1.4.9 is the last core-2.x-compatible release. Bump in lockstep with
    ; a platform move to core 3.x, not before — CI catches the mismatch as
    ; "esp32-hal-periman.h: No such file or directory".
    moononournation/GFX Library for Arduino@1.4.9
    ; UI toolkit: anti-aliased fonts/arcs, eased animation, dirty-region
    ; rendering (which is also what makes the dash flicker-free — LVGL only
    ; repaints what changed). v8 line pinned: v9 is a full API break.
    lvgl/lvgl@^8.4.0
    ; Off-grid Chirp listener (FEATURE_CHIRP_SCAN): NimBLE — same stack the
    ; Canaries chirp with, ~60% less RAM than bluedroid. 1.x pinned: 2.x is
    ; a full API break (setScanCallbacks et al).
    h2zero/NimBLE-Arduino@^1.4.1

; Discover shared PIO libraries in common/ (boot_banner, ota, identity).
lib_extra_dirs =
    ../../common

[env:canary-display-watch]
extends = canary_display_base
board = seeed_xiao_esp32s3
; 8 MB flash: same A/B table canary-wap and canary-vision-xiao-s3 use
; (app0/app1 @ 0x330000 each) — flavors.json guards the slot size.
board_build.partitions = default_8MB.csv

build_flags =
    ${common_esp32s3.build_flags}
    -I${PROJECT_DIR}/../../boards/xiao-esp32s3-round/pins
    -I${PROJECT_DIR}/../../configs/canary-display/watch
    -I${PROJECT_DIR}/../../common
    -DCONFIG_CANARY_DISPLAY
    -I${PROJECT_DIR}/secrets
    -DCONFIG_WATCH
    ; LVGL reads the project's include/lv_conf.h (build_flags are global, so
    ; the library's own TUs see these too — the standard PIO recipe).
    -DLV_CONF_INCLUDE_SIMPLE
    -I${PROJECT_DIR}/include
    '-DSECURACV_OTA_PRODUCT="securacv-canary-display-watch"'
    '-DSECURACV_OTA_MANIFEST_URL="https://github.com/kmay89/securaCV/releases/latest/download/manifest-canary-display-watch.json"'

[env:canary-display-dash]
extends = canary_display_base
; No Waveshare-specific board def ships with the platform; the devkit board
; profile matches the module (ESP32-S3, USB-OTG CDC) with the flash/PSRAM
; geometry overridden to the board's 16 MB flash + 8 MB octal PSRAM.
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    ${common_esp32s3.build_flags}
    -I${PROJECT_DIR}/../../boards/waveshare-esp32s3-lcd43/pins
    -I${PROJECT_DIR}/../../configs/canary-display/dash
    -I${PROJECT_DIR}/../../common
    -DCONFIG_CANARY_DISPLAY
    -I${PROJECT_DIR}/secrets
    -DCONFIG_DASH
    -DLV_CONF_INCLUDE_SIMPLE
    -I${PROJECT_DIR}/include
    '-DSECURACV_OTA_PRODUCT="securacv-canary-display-dash"'
    '-DSECURACV_OTA_MANIFEST_URL="https://github.com/kmay89/securaCV/releases/latest/download/manifest-canary-display-dash.json"'

[env:canary-display-playground]
; Dev playground (docs/hardware/dev_playground_43b.md): the dash flavor on
; the Waveshare 4.3B — the industrial-IO SKU whose isolated DI/DO, I2C
; sensor header, RS485 and CAN terminals are the ONLY external wiring
; surface (no raw GPIO is broken out, so a miswired bench peripheral can't
; touch the S3). FEATURE_PLAYGROUND=1 boots the guided peripheral bench
; mode instead of the fleet face: no WiFi, no MQTT, no OTA — glass +
; terminal block + serial only.
extends = env:canary-display-dash

build_flags =
    ${common_esp32s3.build_flags}
    -I${PROJECT_DIR}/../../boards/waveshare-esp32s3-lcd43b/pins
    -I${PROJECT_DIR}/../../configs/canary-display/dash
    -I${PROJECT_DIR}/../../common
    -DCONFIG_CANARY_DISPLAY
    -I${PROJECT_DIR}/secrets
    -DCONFIG_DASH
    -DFEATURE_PLAYGROUND=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I${PROJECT_DIR}/include
    '-DSECURACV_OTA_PRODUCT="securacv-canary-display-dash"'
    '-DSECURACV_OTA_MANIFEST_URL="https://github.com/kmay89/securaCV/releases/latest/download/manifest-canary-display-dash.json"'

[env:canary-display-dash-b]
; The Canary Dash on the Waveshare 4.3B (industrial-IO SKU), built as a normal
; FLEET witness that ALSO carries the on-glass dev mode: Settings -> "dev mode"
; latches an NVS flag and reboots into the SAME network-silent peripheral bench
; the playground env ships (a long-press exits back to the fleet). So one
; binary is both the fleet face and a bench/test device. Unlike the playground
; env it does NOT set FEATURE_PLAYGROUND, so it boots the fleet face by default;
; FEATURE_DEVMODE only compiles the bench in and wires up the Settings doorway.
; 4.3B pins (HAS_ISOLATED_IO) — feature_sanity enforces the board contract.
extends = env:canary-display-dash

build_flags =
    ${common_esp32s3.build_flags}
    -I${PROJECT_DIR}/../../boards/waveshare-esp32s3-lcd43b/pins
    -I${PROJECT_DIR}/../../configs/canary-display/dash
    -I${PROJECT_DIR}/../../common
    -DCONFIG_CANARY_DISPLAY
    -I${PROJECT_DIR}/secrets
    -DCONFIG_DASH
    -DFEATURE_DEVMODE=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I${PROJECT_DIR}/include
    '-DSECURACV_OTA_PRODUCT="securacv-canary-display-dash"'
    '-DSECURACV_OTA_MANIFEST_URL="https://github.com/kmay89/securaCV/releases/latest/download/manifest-canary-display-dash.json"'

[env:canary-display-dash-rs485]
; The Canary Dash on the 4.3B with the RS485 / Modbus RTU master transport
; compiled in (FEATURE_RS485). A compile-verification env: it proves the gated
; driver + pure Modbus core build against the real toolchain while the default
; dash / playground / emulator builds stay byte-identical (the driver TU is
; empty without the flag). RS485 shares GPIO43/44 with the CH343 USB-UART
; console, so this build keeps logging on native USB CDC. Bench-pending — TX/RX
; orientation and bus timing are VERIFY-tagged in pins.h. 4.3B pins only.
extends = env:canary-display-dash

build_flags =
    ${common_esp32s3.build_flags}
    -I${PROJECT_DIR}/../../boards/waveshare-esp32s3-lcd43b/pins
    -I${PROJECT_DIR}/../../configs/canary-display/dash
    -I${PROJECT_DIR}/../../common
    -DCONFIG_CANARY_DISPLAY
    -I${PROJECT_DIR}/secrets
    -DCONFIG_DASH
    -DFEATURE_RS485=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I${PROJECT_DIR}/include
    '-DSECURACV_OTA_PRODUCT="securacv-canary-display-dash"'
    '-DSECURACV_OTA_MANIFEST_URL="https://github.com/kmay89/securaCV/releases/latest/download/manifest-canary-display-dash.json"'

[env:canary-display-dash-can]
; The Canary Dash on the 4.3B with the CAN / TWAI transport compiled in
; (FEATURE_CAN). A compile-verification env: it proves the gated driver + pure
; CAN frame core build against the real toolchain (including <driver/twai.h>)
; while the default dash / playground / emulator builds stay byte-identical (the
; driver TU is empty without the flag). The CAN transceiver is dedicated and
; coexists with native USB. Bench-pending — TX/RX orientation, bit timing, and
; the 120R terminator jumper are VERIFY-tagged in pins.h. 4.3B pins only.
extends = env:canary-display-dash

build_flags =
    ${common_esp32s3.build_flags}
    -I${PROJECT_DIR}/../../boards/waveshare-esp32s3-lcd43b/pins
    -I${PROJECT_DIR}/../../configs/canary-display/dash
    -I${PROJECT_DIR}/../../common
    -DCONFIG_CANARY_DISPLAY
    -I${PROJECT_DIR}/secrets
    -DCONFIG_DASH
    -DFEATURE_CAN=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I${PROJECT_DIR}/include
    '-DSECURACV_OTA_PRODUCT="securacv-canary-display-dash"'
    '-DSECURACV_OTA_MANIFEST_URL="https://github.com/kmay89/securaCV/releases/latest/download/manifest-canary-display-dash.json"'

[env:canary-display-dash-vault]
; The Canary Dash on the 4.3B with the evidence vault compiled in
; (FEATURE_TIME_MACHINE_PERSIST). A compile-verification env: it proves the
; LittleFS + ArduinoJson persistence body in src/fleet/journal_store.cpp builds
; against the real toolchain, while the default dash / playground / emulator
; builds stay byte-identical (the TU is inert no-op stubs without the flag; the
; emulator additionally excludes it via !defined(__EMSCRIPTEN__), so flipping
; the flag never perturbs the wasm dist). LittleFS ships with the arduino-esp32
; framework and lands on the stock default_16MB.csv spiffs data partition the
; dash already uses; ArduinoJson is already a dash lib_dep (mqtt_mgr). The dash
; never signs, so the vault stores already-signed chain heads, it never mints
; provenance. Bench-pending — a power-cycle reload + flash-wear soak on real
; hardware is the last gate before the default flag flips on (bench runbook §F7).
extends = env:canary-display-dash

build_flags =
    ${common_esp32s3.build_flags}
    -I${PROJECT_DIR}/../../boards/waveshare-esp32s3-lcd43b/pins
    -I${PROJECT_DIR}/../../configs/canary-display/dash
    -I${PROJECT_DIR}/../../common
    -DCONFIG_CANARY_DISPLAY
    -I${PROJECT_DIR}/secrets
    -DCONFIG_DASH
    -DFEATURE_TIME_MACHINE_PERSIST=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I${PROJECT_DIR}/include
    '-DSECURACV_OTA_PRODUCT="securacv-canary-display-dash"'
    '-DSECURACV_OTA_MANIFEST_URL="https://github.com/kmay89/securaCV/releases/latest/download/manifest-canary-display-dash.json"'

[env:canary-display-dash-rtc]
; The Canary Dash on the 4.3B with the PCF8563 trusted-time layer compiled in
; (FEATURE_RTC). A compile-verification env: it proves the gated runtime + the
; pure RTC core build against the real toolchain while the default dash /
; playground / emulator builds stay byte-identical (the driver TU is empty
; without the flag). Runtime-probing by design — it does not require HAS_RTC (both
; 4.3B headers declare it 0 pending a bench check), it asks 0x51 on the shared
; I2C bus and uses the RTC only if it ACKs with a reliable time, else SNTP.
; Bench-pending — confirm the RTC silicon + address on a real board (capability
; map §6). 4.3B pins.
extends = env:canary-display-dash

build_flags =
    ${common_esp32s3.build_flags}
    -I${PROJECT_DIR}/../../boards/waveshare-esp32s3-lcd43b/pins
    -I${PROJECT_DIR}/../../configs/canary-display/dash
    -I${PROJECT_DIR}/../../common
    -DCONFIG_CANARY_DISPLAY
    -I${PROJECT_DIR}/secrets
    -DCONFIG_DASH
    -DFEATURE_RTC=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I${PROJECT_DIR}/include
    '-DSECURACV_OTA_PRODUCT="securacv-canary-display-dash"'
    '-DSECURACV_OTA_MANIFEST_URL="https://github.com/kmay89/securaCV/releases/latest/download/manifest-canary-display-dash.json"'

[env:canary-display-dash-espnow]
; The Canary Dash with the ESP-NOW peer-presence listener compiled in
; (FEATURE_ESPNOW). A compile-verification env: it proves the gated runtime +
; the pure decode core build against the real toolchain (including <esp_now.h>)
; while the default dash / playground / emulator builds stay byte-identical (the
; TU is empty without the flag). Receive-only — the dash observes peer beacons
; off the raw channel when the AP is down; it never transmits or signs (no
; signing identity). Reuses the fleet-link beacon wire contract, so it needs no
; new peers or keys. Bench-pending — channel coexistence with WiFi STA and the
; paired WAP-side ESP-NOW broadcast are the follow-ups (capability map §7).
extends = env:canary-display-dash

build_flags =
    ${common_esp32s3.build_flags}
    -I${PROJECT_DIR}/../../boards/waveshare-esp32s3-lcd43b/pins
    -I${PROJECT_DIR}/../../configs/canary-display/dash
    -I${PROJECT_DIR}/../../common
    -DCONFIG_CANARY_DISPLAY
    -I${PROJECT_DIR}/secrets
    -DCONFIG_DASH
    -DFEATURE_ESPNOW=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I${PROJECT_DIR}/include
    '-DSECURACV_OTA_PRODUCT="securacv-canary-display-dash"'
    '-DSECURACV_OTA_MANIFEST_URL="https://github.com/kmay89/securaCV/releases/latest/download/manifest-canary-display-dash.json"'

[env:canary-display-watch-debug]
extends = env:canary-display-watch

build_flags =
    ${env:canary-display-watch.build_flags}
    -DCORE_DEBUG_LEVEL=4
