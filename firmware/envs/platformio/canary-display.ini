[env:canary-display-dash-sd]
; The Canary Dash on the 4.3B with the microSD deep archive compiled in
; (FEATURE_SD_STORAGE). A compile-verification env: it proves the SDMMC 1-bit
; archive body in src/fleet/sd_archive.cpp (and its journal_instance wiring +
; the CH422G DAT3-release HAL hook) builds against the real toolchain, while
; the default dash / playground / emulator builds stay byte-identical (the TU
; is inert no-op stubs without the flag; the emulator additionally excludes it
; via !defined(__EMSCRIPTEN__)). SD_MMC ships with the arduino-esp32 framework;
; ArduinoJson is already a dash lib_dep. NOTE the flag only reaches the TU
; because the flavor config #ifndef-guards it — a bare #define there would
; silently override this -D back to 0 (the bug that had dash-vault verifying
; stubs). Bench-pending — a real card mount + append + hot-remove pass on 4.3
; hardware is the last gate before the default flag flips on.
extends = env:canary-display-dash

