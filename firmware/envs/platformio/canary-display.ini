; while the default dash / playground / emulator builds stay byte-identical (the
; TU is empty without the flag). Receive-only — the dash observes peer beacons
; off the raw channel when the AP is down; it never transmits or signs (no
; signing identity). Reuses the fleet-link beacon wire contract, so it needs no
; new peers or keys. Bench-pending — channel coexistence with WiFi STA and the
; paired WAP-side ESP-NOW broadcast are the follow-ups (capability map §7).
extends = env:canary-display-dash

