[env:canary-display-dash-modes]
; The Canary Dash on the 4.3B with the FULL mode system compiled in
; (docs/hardware/display_modes.md): the bench doorway (FEATURE_DEVMODE), the
; scripted-fleet demo (FEATURE_DEMO_MODE), on-glass diagnostics
; (FEATURE_DEBUG_MODE), and the touch-QA arcade (FEATURE_ARCADE). A
; compile-verification env: it proves every gated mode TU, the mode-glue
; dispatch, and the Settings modes doorway build together against the real
; toolchain, while the default dash / playground / emulator builds stay
; byte-identical (every mode TU is empty without its flag). The pure cores
; (mode_registry / demo_script / arcade_logic) are host-tested in CI.
; Bench-pending — each gear needs one on-hardware pass before any default
; flag flips (the spec's Waves ledger tracks this). 4.3B pins.
extends = env:canary-display-dash

build_flags =
    ${common_esp32s3.build_flags}
    -I${PROJECT_DIR}/../../boards/waveshare-esp32s3-lcd43b/pins
