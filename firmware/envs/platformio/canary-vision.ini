; ============================================================================
; Canary Vision Build Environments
; ============================================================================

[env:canary-vision-default]
; Standard Vision AI presence detection
extends = common_esp32c3
board = esp32-c3-devkitm-1
; Pin the OTA-capable A/B table explicitly (app0/app1 @ 0x140000). The
; signed pull-OTA engine needs a second app slot; relying on the board
; package's default left this to chance (flavors.json asserts the slot
; size, but nothing pinned the table itself).
board_build.partitions = default.csv

; Include paths for board and config
; Shared common/ TUs: the LDF can't discover bare .cpp files behind -I
; include paths, so compile the identity signer directly — the same
; build_src_filter pattern canary-sense.ini uses.
build_src_filter =
    +<*>
    +<../../../common/identity/device_signature.cpp>
    +<../../../common/network/setup_portal.cpp>

build_flags =
    ${common_esp32c3.build_flags}
    -I${PROJECT_DIR}/../../boards/esp32-c3/pins
    -I${PROJECT_DIR}/../../configs/canary-vision/default
    -I${PROJECT_DIR}/../../common
    ; Canonical fleet-link presence beacon wire format (firmware/common/fleet_link).
    ; Makes <fleet_beacon.h> resolvable for the advertise-only BLE presence
    ; beacon (src/net/fleet_beacon_adv.cpp). Header-only; harmless when
    ; FEATURE_FLEET_BEACON=0 (its only include site is behind that gate).
    -I${PROJECT_DIR}/../../common/fleet_link
    -DCONFIG_CANARY_VISION
    -I${PROJECT_DIR}/secrets
    -DCONFIG_DEFAULT

; Library dependencies
lib_deps =
    ${common.lib_deps}
    ; MQTT client
    knolleary/PubSubClient@^2.8
    ; Ed25519 verify for the signed pull-OTA engine (firmware/common/ota)
    rweather/Crypto@^0.4.0
    ; Grove Vision AI V2 library
    https://github.com/Seeed-Studio/Seeed_Arduino_SSCMA/archive/refs/tags/v1.0.3.zip
    ; NimBLE for the advertise-only fleet-link presence beacon. This project is
    ; on arduino-esp32 core 2.x, which requires the NimBLE-Arduino 1.4.x line
    ; (2.x needs core 3.x — see canary-sense/canary-wap). Linked in but
    ; dead-stripped when FEATURE_FLEET_BEACON=0 (no symbols referenced).
    h2zero/NimBLE-Arduino@~1.4.3

; Discover shared PIO libraries in common/ (boot_banner, etc).
; PIO's LDF only links libraries whose headers are actually #included.
lib_extra_dirs =
    ../../common

[env:canary-vision-debug]
; Debug build with verbose logging
extends = env:canary-vision-default

build_flags =
    ${common_esp32c3.build_flags}
    -I${PROJECT_DIR}/../../boards/esp32-c3/pins
    -I${PROJECT_DIR}/../../configs/canary-vision/default
    -I${PROJECT_DIR}/../../common
    ; Canonical fleet-link presence beacon wire format (firmware/common/fleet_link).
    ; Makes <fleet_beacon.h> resolvable for the advertise-only BLE presence
    ; beacon (src/net/fleet_beacon_adv.cpp). Header-only; harmless when
    ; FEATURE_FLEET_BEACON=0 (its only include site is behind that gate).
    -I${PROJECT_DIR}/../../common/fleet_link
    -DCONFIG_CANARY_VISION
    -I${PROJECT_DIR}/secrets
    -DCONFIG_DEFAULT
    -DCORE_DEBUG_LEVEL=4

[env:canary-vision-xiao-c3]
; XIAO ESP32-C3 host — stacks onto the Grove Vision AI V2 XIAO socket
; (I2C on GPIO6/7) or connects via Grove cable. Same app, different pins.
; Distinct OTA product/manifest: this board must never install the
; DevKit image (different I2C pins) — the product check enforces it.
extends = common_esp32c3
board = seeed_xiao_esp32c3
board_build.partitions = default.csv

; Shared common/ TUs: the LDF can't discover bare .cpp files behind -I
; include paths, so compile the identity signer directly — the same
; build_src_filter pattern canary-sense.ini uses.
build_src_filter =
    +<*>
    +<../../../common/identity/device_signature.cpp>
    +<../../../common/network/setup_portal.cpp>

build_flags =
    ${common_esp32c3.build_flags}
    -I${PROJECT_DIR}/../../boards/xiao-esp32c3/pins
    -I${PROJECT_DIR}/../../configs/canary-vision/default
    -I${PROJECT_DIR}/../../common
    ; Canonical fleet-link presence beacon wire format (firmware/common/fleet_link).
    ; Makes <fleet_beacon.h> resolvable for the advertise-only BLE presence
    ; beacon (src/net/fleet_beacon_adv.cpp). Header-only; harmless when
    ; FEATURE_FLEET_BEACON=0 (its only include site is behind that gate).
    -I${PROJECT_DIR}/../../common/fleet_link
    -DCONFIG_CANARY_VISION
    -I${PROJECT_DIR}/secrets
    -DCONFIG_DEFAULT
    '-DSECURACV_OTA_PRODUCT="securacv-canary-vision-xiao-c3"'
    '-DSECURACV_OTA_MANIFEST_URL="https://github.com/kmay89/securaCV/releases/latest/download/manifest-canary-vision-xiao-c3.json"'

lib_deps =
    ${env:canary-vision-default.lib_deps}

lib_extra_dirs =
    ../../common

[env:canary-vision-c3-super-mini]
; ESP32-C3 Super Mini host — the most-owned sub-$3 board in the hobby
; (white-label, dozens of storefront names). Grove cable to the Vision AI
; module on the same GPIO4/5 map as the generic DevKitM-1 entry; the one
; behavioral difference is the onboard LED (plain active-low on GPIO8 vs
; the DevKit's WS2812), which is why it gets its own pin map and OTA
; product rather than reusing the DevKit image.
; No Super Mini board profile exists in the platform; the DevKitM-1
; profile matches the module (ESP32-C3, 4 MB flash) and flashes it fine.
extends = common_esp32c3
board = esp32-c3-devkitm-1
board_build.partitions = default.csv

; Shared common/ TUs: the LDF can't discover bare .cpp files behind -I
; include paths, so compile the identity signer directly — the same
; build_src_filter pattern canary-sense.ini uses.
build_src_filter =
    +<*>
    +<../../../common/identity/device_signature.cpp>
    +<../../../common/network/setup_portal.cpp>

build_flags =
    ${common_esp32c3.build_flags}
    -I${PROJECT_DIR}/../../boards/esp32c3-super-mini/pins
    -I${PROJECT_DIR}/../../configs/canary-vision/default
    -I${PROJECT_DIR}/../../common
    ; Canonical fleet-link presence beacon wire format (firmware/common/fleet_link).
    ; Makes <fleet_beacon.h> resolvable for the advertise-only BLE presence
    ; beacon (src/net/fleet_beacon_adv.cpp). Header-only; harmless when
    ; FEATURE_FLEET_BEACON=0 (its only include site is behind that gate).
    -I${PROJECT_DIR}/../../common/fleet_link
    -DCONFIG_CANARY_VISION
    -I${PROJECT_DIR}/secrets
    -DCONFIG_DEFAULT
    '-DSECURACV_OTA_PRODUCT="securacv-canary-vision-c3-super-mini"'
    '-DSECURACV_OTA_MANIFEST_URL="https://github.com/kmay89/securaCV/releases/latest/download/manifest-canary-vision-c3-super-mini.json"'

lib_deps =
    ${env:canary-vision-default.lib_deps}

lib_extra_dirs =
    ../../common

[env:canary-vision-xiao-s3]
; XIAO ESP32-S3 (plain, non-Sense) host — the "Grove Vision AI V2 Kit"
; pairing. Stacks onto the module's XIAO socket (I2C on GPIO5/6) or
; connects via Grove cable.
; Distinct OTA product/manifest: this board must never install the
; C3 images (different MCU) — the product check enforces it.
extends = common_esp32s3
board = seeed_xiao_esp32s3
; 8 MB flash: same table canary-wap uses (app0/app1 @ 0x330000 each).
board_build.partitions = default_8MB.csv

; Shared common/ TUs: the LDF can't discover bare .cpp files behind -I
; include paths, so compile the identity signer directly — the same
; build_src_filter pattern canary-sense.ini uses.
build_src_filter =
    +<*>
    +<../../../common/identity/device_signature.cpp>
    +<../../../common/network/setup_portal.cpp>

build_flags =
    ${common_esp32s3.build_flags}
    -I${PROJECT_DIR}/../../boards/xiao-esp32s3/pins
    -I${PROJECT_DIR}/../../configs/canary-vision/default
    -I${PROJECT_DIR}/../../common
    ; Canonical fleet-link presence beacon wire format (firmware/common/fleet_link).
    ; Makes <fleet_beacon.h> resolvable for the advertise-only BLE presence
    ; beacon (src/net/fleet_beacon_adv.cpp). Header-only; harmless when
    ; FEATURE_FLEET_BEACON=0 (its only include site is behind that gate).
    -I${PROJECT_DIR}/../../common/fleet_link
    -DCONFIG_CANARY_VISION
    -I${PROJECT_DIR}/secrets
    -DCONFIG_DEFAULT
    '-DSECURACV_OTA_PRODUCT="securacv-canary-vision-xiao-s3"'
    '-DSECURACV_OTA_MANIFEST_URL="https://github.com/kmay89/securaCV/releases/latest/download/manifest-canary-vision-xiao-s3.json"'

lib_deps =
    ${env:canary-vision-default.lib_deps}

lib_extra_dirs =
    ../../common
