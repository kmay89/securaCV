; ============================================================================
; Canary Vision Build Environments
; ============================================================================

[env:canary-vision-default]
; Standard Vision AI presence detection
extends = common_esp32c3
board = esp32-c3-devkitm-1

; Include paths for board and config
build_flags =
    ${common_esp32c3.build_flags}
    -I${PROJECT_DIR}/../../boards/esp32-c3/pins
    -I${PROJECT_DIR}/../../configs/canary-vision/default
    -I${PROJECT_DIR}/../../common
    -DCONFIG_CANARY_VISION
    -DCONFIG_DEFAULT

; Library dependencies
lib_deps =
    ${common.lib_deps}
    ; MQTT client
    knolleary/PubSubClient@^2.8
    ; Ed25519 verify for the signed pull-OTA engine (firmware/common/ota)
    rweather/Crypto@^0.4.0
    ; Grove Vision AI V2 library
    https://github.com/Seeed-Studio/Seeed_Arduino_SSCMA/archive/refs/tags/v1.0.3.zip

; Discover shared PIO libraries in common/ (boot_banner, etc).
; PIO's LDF only links libraries whose headers are actually #included.
lib_extra_dirs =
    ../../common

[env:canary-vision-debug]
; Debug build with verbose logging
extends = env:canary-vision-default

build_flags =
    ${common_esp32c3.build_flags}
    -I${PROJECT_DIR}/../../boards/esp32-c3/pins
    -I${PROJECT_DIR}/../../configs/canary-vision/default
    -I${PROJECT_DIR}/../../common
    -DCONFIG_CANARY_VISION
    -DCONFIG_DEFAULT
    -DCORE_DEBUG_LEVEL=4

[env:canary-vision-xiao-c3]
; XIAO ESP32-C3 host — stacks onto the Grove Vision AI V2 XIAO socket
; (I2C on GPIO6/7) or connects via Grove cable. Same app, different pins.
extends = common_esp32c3
board = seeed_xiao_esp32c3

build_flags =
    ${common_esp32c3.build_flags}
    -I${PROJECT_DIR}/../../boards/xiao-esp32c3/pins
    -I${PROJECT_DIR}/../../configs/canary-vision/default
    -I${PROJECT_DIR}/../../common
    -DCONFIG_CANARY_VISION
    -DCONFIG_DEFAULT

lib_deps =
    ${common.lib_deps}
    knolleary/PubSubClient@^2.8
    rweather/Crypto@^0.4.0
    https://github.com/Seeed-Studio/Seeed_Arduino_SSCMA/archive/refs/tags/v1.0.3.zip

lib_extra_dirs =
    ../../common

[env:canary-vision-xiao-s3]
; XIAO ESP32-S3 (plain, non-Sense) host — the "Grove Vision AI V2 Kit"
; pairing. Stacks onto the module's XIAO socket (I2C on GPIO5/6) or
; connects via Grove cable.
extends = common_esp32s3
board = seeed_xiao_esp32s3

build_flags =
    ${common_esp32s3.build_flags}
    -I${PROJECT_DIR}/../../boards/xiao-esp32s3/pins
    -I${PROJECT_DIR}/../../configs/canary-vision/default
    -I${PROJECT_DIR}/../../common
    -DCONFIG_CANARY_VISION
    -DCONFIG_DEFAULT

lib_deps =
    ${common.lib_deps}
    knolleary/PubSubClient@^2.8
    rweather/Crypto@^0.4.0
    https://github.com/Seeed-Studio/Seeed_Arduino_SSCMA/archive/refs/tags/v1.0.3.zip

lib_extra_dirs =
    ../../common
