; ═══════════════════════════════════════════════════════════════
; SecuraCV Canary — Secure PlatformIO Environment
; ═══════════════════════════════════════════════════════════════
;
; This file defines the 'secure' build environment for production
; firmware. It wraps the sdkconfig.defaults.secure configuration.
;
; IMPORTANT: This environment is for Phase 2 (production) builds.
; For development, continue using the 'dev' environment in the
; main platformio.ini file.
;
; Usage:
;   firmware/canary/platformio.ini lists this file in its extra_configs,
;   after ../envs/platformio/platforms.ini, so from firmware/canary:
;       pio run -e secure          (or -e secure_ha)
;   It resolves only as an extra config of that project: `platform =` below
;   interpolates platforms.ini's [platform_s3c3] section (the exact
;   espressif32@6.9.0 the canary tree and the S3/C3 line build on; until
;   2026-09-22 this env floated on `^6.5.0`, the newest 6.x at build time,
;   never recorded — firmware/PLATFORMS.md), and build_flags extends the
;   canary [env] flags. firmware.yml's canary leg compiles both envs on every
;   PR (compile-only: nothing ships from them, they are not in flavors.json
;   and no release workflow builds them).
;
; The Arduino WAP test files are NOT affected by this configuration.
; This is an ADDITIONAL environment, not a replacement.
;
; ═══════════════════════════════════════════════════════════════

; ─── SECURE: Production build with security features ─────────
;
; This environment:
; - Names sdkconfig.defaults.secure (BT disabled, NVS encryption) — inert
;   under framework = arduino, see "KNOWN INERT" below
; - Compiles with size optimization
; - Minimal debug output
; - Prepares for Secure Boot (not enabled until Phase 2 eFuse burn)
;
; To enable full Secure Boot:
; 1. Uncomment sections in sdkconfig.defaults.secure
; 2. Generate keys with: ./generate_keys.sh
; 3. Build with: pio run -e secure
; 4. Provision with: ./provision_canary.sh --phase 2
;
; build_flags below EXTENDS ${env.build_flags} (F42). Until then it replaced
; the canary [env] flags, so the env lacked -I${PROJECT_DIR}/include,
; -I${PROJECT_DIR}/../common and the csi / fleet_link / ota include paths and
; could not compile; with no CI leg, nothing said so. What this image has NOT
; had is a bench pass. docs/audit/hardware_verification_checklist.md K1
; builds the opt-in key policy from [env:release] plus
; -DSECURACV_REQUIRE_FLASH_ENCRYPTION=1 (the same source with one constant
; changed); this env's own fused-board pass (K1/K2) is U1's.
;
[env:secure]
platform = ${platform_s3c3.platform}
board = seeed_xiao_esp32s3
framework = arduino
board_build.partitions = ../provisioning/partitions_secure.csv
board_build.arduino.memory_type = qio_opi

; Use secure sdkconfig
;
; KNOWN INERT under `framework = arduino` (above): the Arduino core ships a
; precompiled libesp32 + bootloader with its own sdkconfig, so this
; -DSDKCONFIG_DEFAULTS never reaches a build here — CONFIG_NVS_ENCRYPTION /
; CONFIG_SECURE_FLASH_ENC_ENABLED in sdkconfig.defaults.secure take effect
; only for an ESP-IDF-framework project (canary-ota is one; the PIO canary
; tree becomes one with the arduino-as-IDF-component migration, roadmap
; item 9). Recorded here so nobody reads the line as a promise; not fixed by
; this file. So this image has flash encryption at most, never NVS
; encryption — and flash encryption does not cover NVS, where the identity
; key lives. partitions_secure.csv no longer flags nvs `encrypted` (F42): with
; flash encryption on, the IDF 4.4 this core ships refuses to open an NVS
; partition so flagged (nvs_partition_lookup.cpp -> ESP_ERR_NVS_WRONG_ENCRYPTION),
; so on a fused board the image could not open NVS at all. ESP-IDF protects
; NVS with NVS encryption (keys in nvs_keys), never with the flag.
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS=../provisioning/sdkconfig.defaults.secure

; Core libraries (always included)
lib_deps =
    rweather/Crypto @ ^0.4.0
    bblanchon/ArduinoJson @ ^7.0.0

; Production build flags
build_type = release
build_flags =
    ; The canary [env] flags: board (PSRAM, USB CDC), the XIAO SD / GPS pins,
    ; and every include path the witness, crypto, csi, fleet_link and ota
    ; sources need. Replacing them instead of extending them is what kept
    ; this env from compiling until F42.
    ${env.build_flags}
    ; Production flags
    -Os                          ; Size optimization
    -DCORE_DEBUG_LEVEL=1         ; Errors only
    -DSECURACV_BUILD_SECURE=1
    -DSECURACV_BUILD_RELEASE=1
    ; This is the Tier 3/4 image (docs/design/hardware_root_of_trust.md §8 #3):
    ; it refuses to store OR load an identity key unless the key's NVS is
    ; actually encrypted (flash encryption AND NVS encryption — flash
    ; encryption alone does not cover NVS), so provisioning fails closed
    ; instead of running with a plaintext key. Under framework = arduino there
    ; is no NVS encryption, so it refuses on every board: the promise cannot be
    ; kept by this toolchain (roadmap item 9) and the image does not pretend.
    ; Never set in the canary dev/release/full envs — the Tier-0 default is
    ; allowed there and reported as `key_at_rest`.
    ; Decision: firmware/common/identity/key_at_rest.h (host-tested).
    -DSECURACV_REQUIRE_FLASH_ENCRYPTION=1
    ; All features enabled for production
    -DFEATURE_SD_STORAGE=1
    -DFEATURE_WIFI_AP=1
    -DFEATURE_HTTP_SERVER=1
    -DFEATURE_CAMERA_PEEK=1
    -DFEATURE_TAMPER_GPIO=0
    -DFEATURE_WATCHDOG=1
    -DFEATURE_STATE_LOG=1
    -DFEATURE_OTA_UPDATE=1
    -DFEATURE_MESH_NETWORK=0
    -DFEATURE_BLUETOOTH=0        ; DISABLED FOR SECURITY
    ; No debug output
    -DDEBUG_NMEA=0
    -DDEBUG_CBOR=0
    -DDEBUG_CHAIN=0
    -DDEBUG_VERIFY=0
    -DDEBUG_HTTP=0

monitor_speed = 115200

; ─── SECURE + HA: Production with Home Assistant MQTT ─────────
[env:secure_ha]
extends = env:secure
build_flags =
    ${env:secure.build_flags}
    -DFEATURE_HA_MQTT=1
    -DFEATURE_HA_DISCOVERY=1
lib_deps =
    ${env:secure.lib_deps}
    knolleary/PubSubClient @ ^2.8
