# The Witness Wall — native tvOS, generated reproducibly by XcodeGen.
#
# The Xcode project is NOT committed, exactly as `ios/project.yml` documents:
# it is regenerated from this spec on every build, so it can never rot or
# drift. Edit THIS file, never a .pbxproj.
#
# Versioning follows the DESKTOP-app precedent (same as iOS): this app versions
# independently, ships on its own `tvos-v*` tag, and stays OUT of
# scripts/lint_version_sync.sh's four-file set. `scripts/release-tvos.sh` reads
# MARKETING_VERSION from here and refuses to build if the tag disagrees, so the
# tag and the binary can never claim different versions.

name: WitnessWall
options:
  bundleIdPrefix: com.securacv
  deploymentTarget:
    tvOS: "17.0"        # Floor at 17 so the SwiftUI APIs the Wall leans on
                        # (Observable, .focusable modifiers) are frozen, not fresh.
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.2.3"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "$(APPLE_DEVELOPMENT_TEAM)"   # from env / CI, never committed
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete   # The Wall is a display over async I/O;
                                         # data races here would show stale
                                         # "verified" state, so be strict now.
    TVOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "3"          # Apple TV

    # Build identity for the About/Health panel — "never a guess, never stale",
    # the same contract as the desktop build.rs stamp and ios/scripts/stamp_build.sh.
    # CI overrides these on the xcodebuild command line with the real git rev.
    SECURACV_BUILD_REV: "dev"
    SECURACV_FW_TRAIN: "0.x"

    # The Rust witness core. scripts/build-witness-core.sh stages the static
    # library per platform into tvos/build/lib/<PLATFORM_NAME>/, so the SAME
    # settings link the device build (appletvos) and the simulator build
    # (appletvsimulator) — PR CI builds the simulator slice with no signing.
    LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../build/lib/$(PLATFORM_NAME)"
    # The C header is imported through Support/module.modulemap rather than a
    # bridging header, so the app target and the test target import it the same
    # way (a bridging header is app-target-only).
    SWIFT_INCLUDE_PATHS: "$(inherited) $(SRCROOT)/Support"

targets:
  WitnessWall:
    type: application
    platform: tvOS
    sources:
      - path: Sources/WitnessWall
      # App Store privacy manifest (required-reason API: UserDefaults). Listed
      # as a source so XcodeGen copies it into the bundle; the Top Shelf
      # extension lists the same file. scripts/lint_apple_plists.py fails the
      # build if a target that reads UserDefaults drops it.
      - path: Support/PrivacyInfo.xcprivacy
      # Apple TV will not accept an archive without an app icon and top-shelf
      # art. The catalog is GENERATED and committed by
      # scripts/make_app_icon.py (tvOS icons are layered image stacks — ~20
      # files); tvos.yml runs check_app_icon.py — a STRUCTURAL check of sizes
      # and Contents.json, not a byte-diff — so after editing make_app_icon.py
      # you regenerate by hand and commit the result.
      - path: Support/Assets.xcassets
      # Shared with the iPhone app, compiled rather than copied, so the away
      # path cannot grow two dialects. WakePayload is the wake vocabulary
      # (one class word, nothing else); CloudContainer is the ONE way to
      # reach CloudKit without the uncatchable trap an unentitled process
      # takes in CKContainer.default(). Both are Foundation-only.
      - path: ../../ios/Shared/WakePayload.swift
      - path: ../../ios/Sources/SecuraCV/Cloud/CloudContainer.swift
      # THE DEVICE VOCABULARY — the same rule, applied to the thing this app
      # spends its whole life doing: showing devices.
      #
      # The Wall used to describe devices in its own words, and drifted exactly
      # as you would expect from a target nobody touches for weeks: it printed
      # the raw wire string ("canary-nightstand7") where the phone printed a
      # product name, drew a colored dot where the phone drew the device, and
      # read `chain: "unknown"` as a verification FAILURE — painting every
      # display in the fleet orange for a chain it never claimed to have.
      #
      # Each of those is a copy of a decision that already existed, made worse.
      # So the decisions are compiled here rather than re-made: how a device
      # type decodes, what a product is called, and what it looks like.
      #
      # EVERY FILE BELOW CARRIES THE `SecuraCV-Parity` MARKER, and
      # scripts/lint_apple_parity.py fails the build when a marked file is not
      # listed here — so a new one added for the phone cannot silently skip
      # the Wall. Add the marker to share; leave it off to keep it iPhone-only.
      - path: ../../ios/Shared/Theme.swift
      - path: ../../ios/Shared/FleetEnums.swift
      - path: ../../ios/Shared/FleetFigures.swift
      - path: ../../ios/Shared/FleetFigureBridge.swift
      - path: ../../ios/Shared/DeviceNaming.swift
      # The 3D half of the same vocabulary: the mm massing behind each figure
      # and the projector that turns it. On the phone the turntable is
      # drag-to-spin; on the Wall it turns by itself (a television has no
      # drag) — one projector, one massing, two hands.
      - path: ../../ios/Shared/FleetSolids.swift
      - path: ../../ios/Shared/FleetIsoProjector.swift
    dependencies:
      # XcodeGen embeds an extension dependency via an "Embed App Extensions"
      # phase — the Top Shelf provider ships INSIDE the app, and the existing
      # WitnessWall scheme builds it, so CI compiles it on every PR.
      - target: WitnessWallTopShelf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.securacv.witnesswall
        INFOPLIST_FILE: Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/WitnessWall.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        OTHER_LDFLAGS: "$(inherited) -lsecuracv_witness_core"

  # ── The Top Shelf — the Wall's one-line glance above the app icon ───────
  # Apple TV renders the shelf from a separate extension PROCESS, so the
  # provider is deliberately tiny: it reads the summary the app last cached
  # (ShelfCache) and shows NOTHING when that answer is old — an empty shelf
  # is honest; a stale "all online" is not. Two rules keep it that way:
  #   * It compiles ONE shared file, not the app's sources — the NSE
  #     single-file precedent (ios/project.yml). ShelfCache.swift is pure
  #     Foundation for exactly this reason: the provider links neither the
  #     Rust core nor CloudKit (an unentitled process constructing a
  #     CKContainer traps uncatchably — this one is entitled to the app
  #     group and nothing else, see Support/TopShelf.entitlements).
  #   * It declares NO MARKETING_VERSION of its own — the release tag guard
  #     reads the FIRST one in this file (same rule as the watch target in
  #     ios/project.yml). Never add one.
  WitnessWallTopShelf:
    type: tv-app-extension        # XcodeGen's com.apple.product-type.tv-app-extension
    platform: tvOS
    sources:
      - path: Sources/WitnessWallTopShelf
      - path: Sources/WitnessWall/ShelfCache.swift
      - path: Support/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.securacv.witnesswall.topshelf
        INFOPLIST_FILE: Support/TopShelf-Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/TopShelf.entitlements

  WitnessWallTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - path: Tests/WitnessWallTests
    dependencies:
      - target: WitnessWall          # tests use `@testable import WitnessWall`
    settings:
      base:
        # The test bundle links the core too: the FFI wrapper is the piece most
        # worth testing, and it is worthless to test against a mock of itself.
        OTHER_LDFLAGS: "$(inherited) -lsecuracv_witness_core"

schemes:
  WitnessWall:
    build:
      targets:
        WitnessWall: all
    test:
      targets:
        - WitnessWallTests
      gatherCoverageData: true
