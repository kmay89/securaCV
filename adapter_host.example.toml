# Adapter Host configuration — copy to adapter_host.toml and customize.
#
# Run with:
#   DEVICE_KEY_SEED=$(openssl rand -hex 32) \
#     cargo run --bin adapter_host \
#     --features adapter-frigate,adapter-mqtt-sensor,adapter-webhook,adapter-webhook-tls,adapter-ble-presence,adapter-meshtastic,adapter-can-bus,adapter-sandbox \
#     -- --config adapter_host.toml
#
# The adapter host runs many vendor-neutral sensor adapters behind one daemon. Every claim flows
# through the same privacy-enforcing kernel choke point, so adding sensors never weakens any
# invariant. See spec/sensor_adapter_contract_v0.md and spec/witness_mesh_os_v0.md.

# Sealed event log database path.
db_path = "witness.db"

# Ruleset identifier (change when your detection rules change significantly).
ruleset_id = "ruleset:adapter_host_v1"

# Time-bucket size in seconds. Must be >= 300 (5 min); the kernel re-coarsens to 10 min.
bucket_size_secs = 600

# How often (seconds) the host drains adapters and seals their claims.
poll_interval_secs = 1

# Coarse confidence floor; claims below this are dropped before reaching the kernel.
min_confidence = 0.5

# Optional read-only stats/health endpoint (operational counts only, never event content):
#   GET /          per-adapter counters as JSON
#   GET /metrics   Prometheus text exposition format (scrape into Grafana/Alertmanager)
#   GET /healthz   liveness ("ok")
# The SecuraCV Home Assistant integration can surface this automatically as a diagnostic sensor —
# set the same URL as "Adapter Host stats URL" during setup.
# 8801, not 8799: the witness_api Event API already defaults to 127.0.0.1:8799
# (config.example.toml), and the adapter host often runs on the same machine —
# binding the stats endpoint there too would collide. (8800 is taken as well:
# the webhook adapter below listens on it.)
# stats_addr = "127.0.0.1:8801"

# Send SIGHUP (`kill -HUP <pid>`) to reload this file without restarting: host `min_confidence`
# and each adapter's route/room/filter *attributes* (claim kind, zone, confidence, thresholds) are
# applied live, as are webhook request-path routes. Changing an mqtt_sensor's subscribed MQTT
# *topic* (or adding/removing adapters, listen addresses, auth, or TLS) still requires a restart.

# ---------------------------------------------------------------------------
# Adapter: Frigate NVR
# Reuses Frigate's free, open-source object detection; strips identity and seals coarse claims.
# ---------------------------------------------------------------------------
[[adapter]]
type = "frigate"
mqtt_broker_addr = "127.0.0.1:1883"   # Frigate's MQTT broker (loopback by default)
topic = "frigate/events"
# cameras = ["front_door", "driveway"] # optional allowlist; omit to process all
# labels = ["person", "car"]           # optional; omit for the built-in default set
# min_confidence = 0.5
# mqtt_username = ""
# mqtt_password = ""

# ---------------------------------------------------------------------------
# Adapter: generic MQTT sensors
# Bring any cheap sensor that can publish MQTT (PIR, contact switch, acoustic module,
# webhook->MQTT bridge, BLE gateway). No code required — just routes.
# ---------------------------------------------------------------------------
[[adapter]]
type = "mqtt_sensor"
mqtt_broker_addr = "127.0.0.1:1883"
# mqtt_username = ""
# mqtt_password = ""

# Each route maps an MQTT topic to a coarse claim kind in a logical zone.
# kind must be one of:
#   large_object_boundary_crossing, small_object_boundary_crossing,
#   acoustic_impulse_in_zone, presence_in_restricted_zone,
#   vehicle_presence_after_hours, contact_state_change, object_removed_from_zone,
#   tamper_detected, vehicle_arrival_departure
# Optional per-route gates: min_confidence (float), require_truthy_state (bool),
# numeric_min (float — payload must carry a numeric reading >= this; replaces the
# truthy gate for counters/numeric sensor states; the reading is never logged),
# state_equals (string — the state must equal this exactly; replaces the
# truthy/numeric gates, for enum-valued fields where "truthy" means nothing),
# state_field (string — read the gating state from this JSON field instead of
# "state"; fails closed when absent, for topics that multiplex several
# readings in one payload). Several routes may share one topic; the first
# whose gates pass wins.
# Optional provenance: attestation = "adapter" (default) or "ha-bridged" for
# routes fed by an HA mqtt_statestream bridge — stamped into the sealed event
# and rendered as a provenance chip on the timeline.
[[adapter.route]]
topic = "sensors/garage/acoustic"
kind = "acoustic_impulse_in_zone"
zone = "garage"
min_confidence = 0.0

[[adapter.route]]
topic = "sensors/lobby/pir"
kind = "presence_in_restricted_zone"
zone = "lobby"

[[adapter.route]]
topic = "sensors/server_room/door"
kind = "contact_state_change"
zone = "server_room"
require_truthy_state = true   # only emit on ON/open/true payloads

# Canary firmware tamper alerts (enclosure opened, camera covered/blinded,
# thermal-attack temp drift). The firmware publishes
#   {"state":"on","confidence":0.93,"kind":"enclosure_tamper"}
# on securacv/<device_id>/tamper; this seals it into the witness log as a
# TamperDetected event. One route per device (exact topic match).
[[adapter.route]]
topic = "securacv/canary-1/tamper"
kind = "tamper_detected"
zone = "canary_1"
require_truthy_state = true
min_confidence = 0.5

# Canary WAP acoustic detector (FEATURE_ACOUSTIC_EVENTS): the alarm on the
# ceiling sounds, the Canary hears the legally mandated cadence, and these
# routes seal "an alarm was heard" as a witness event. The firmware publishes
#   {"acoustic_event":"smoke_alarm_t3", ..., "t3_detected":5, "t4_detected":2}
# on securacv/<device_id>/sensing — one enum field that means "now", beside
# cumulative counters that stay nonzero forever. Gate on the enum via
# state_field + state_equals; a truthy gate on a counter would re-claim on
# every 60 s heartbeat after the first ever detection.
[[adapter.route]]
topic = "securacv/canary-1/sensing"
kind = "acoustic_impulse_in_zone"
zone = "smoke_alarm_heard"
state_field = "acoustic_event"
state_equals = "smoke_alarm_t3"   # NFPA 72 T3 — smoke

[[adapter.route]]
topic = "securacv/canary-1/sensing"
kind = "acoustic_impulse_in_zone"
zone = "co_alarm_heard"
state_field = "acoustic_event"
state_equals = "co_alarm_t4"      # UL 2034 T4 — carbon monoxide

# Seeed MR60BHA2 mmWave kit running its STOCK ESPHome firmware (Track B in
# docs/canary_sense_mr60bha2_design.md). The stock firmware speaks the ESPHome
# native API, not MQTT, so it needs one of two config-only bridges — full
# walkthrough in docs/integrations/mr60bha2_esphome.md:
#
#  (a) Home Assistant `mqtt_statestream` (kit stays unmodified). HA republishes
#      entity states to <base_topic>/<domain>/<entity_id>/state with the bare
#      state as payload ("on"/"off", "0".."N"):
[[adapter.route]]
topic = "securacv_statestream/binary_sensor/mr60bha2_person_information/state"
kind = "presence_in_restricted_zone"
zone = "bedroom"
require_truthy_state = true   # statestream publishes bare "on"/"off"
attestation = "ha-bridged"    # claim transits HA before ingest; the timeline
                              # renders the extra hop honestly ("adapter" is
                              # the default for all adapter_host routes)

#      Occupant counter variant: `numeric_min` gates on a numeric payload (bare
#      number or numeric `state` field) instead of the truthy gate. The reading
#      is gating-only — it never reaches the sealed log.
# [[adapter.route]]
# topic = "securacv_statestream/sensor/mr60bha2_target_number/state"
# kind = "presence_in_restricted_zone"
# zone = "bedroom"
# numeric_min = 1.0
#
#  (b) ESPHome `mqtt:` overlay (one OTA, device publishes directly; no HA hop).
#      ESPHome publishes <topic_prefix>/binary_sensor/<object_id>/state as
#      "ON"/"OFF":
# [[adapter.route]]
# topic = "mr60bha2/binary_sensor/person_information/state"
# kind = "presence_in_restricted_zone"
# zone = "bedroom"
# require_truthy_state = true
#
# Privacy note: route ONLY the presence/occupancy entities. Vitals entities
# (breath rate, heart rate) are P1 wellbeing signals that stay in Home
# Assistant and must never be routed into the sealed log — see the privacy
# table in docs/canary_sense_mr60bha2_design.md §2.

# ---------------------------------------------------------------------------
# Adapter: HTTP webhook ingress
# The lowest-friction option: NO MQTT broker required. Any device or script that
# can make an HTTP POST becomes a witness source. The request PATH is the route
# key; the body is parsed like the mqtt_sensor payload. For example:
#   curl -X POST http://127.0.0.1:8800/sensors/garage/acoustic -d '{"confidence":0.8}'
# ---------------------------------------------------------------------------
[[adapter]]
type = "webhook"
listen_addr = "127.0.0.1:8800"   # loopback by default
# sandbox = true                 # parse request bodies inside the seccomp sandbox
#
# Authentication — REQUIRED on anything but loopback (the webhook is the one untrusted, network-
# facing ingress). Pick ONE; hmac_secret wins if both are set.
# auth_token = "change-me"       # require: Authorization: Bearer change-me
# hmac_secret = "change-me"      # require: X-Signature: sha256=<HMAC-SHA256(secret, body)>
#                                #   sig=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$SECRET" -hex | sed 's/^.* //')
#                                #   curl -H "X-Signature: sha256=$sig" -d "$BODY" http://host:8800/path
#
# HMAC replay protection (only with hmac_secret). When set, the client must also send X-Timestamp
# (unix seconds, within the window) and a unique X-Nonce, and sign "<timestamp>.<nonce>.<path>.<body>"
# (the path is bound in so a signature can't be replayed against a different route):
#   ts=$(date +%s); nonce=$(openssl rand -hex 8); path=/sensors/garage/acoustic
#   sig=$(printf '%s.%s.%s.%s' "$ts" "$nonce" "$path" "$BODY" | openssl dgst -sha256 -hmac "$SECRET" -hex | sed 's/^.* //')
#   curl -H "X-Timestamp: $ts" -H "X-Nonce: $nonce" -H "X-Signature: sha256=$sig" -d "$BODY" "http://host:8800$path"
# hmac_replay_window_secs = 300
#
# TLS — strongly recommended for any non-loopback listener, so bearer tokens aren't sent in the
# clear. Set both; generate a cert with e.g.
#   openssl req -x509 -newkey rsa:2048 -keyout key.pem -out cert.pem -days 365 -nodes -subj "/CN=host"
# tls_cert = "/etc/securacv/webhook_cert.pem"
# tls_key  = "/etc/securacv/webhook_key.pem"
#
# Mutual TLS — strongest option for machine-to-machine sensors: clients must present a certificate
# chaining to this CA bundle (no shared secret on the wire). Requires tls_cert + tls_key. The CA
# must be a v3 cert with basicConstraints CA:TRUE.
# tls_client_ca = "/etc/securacv/webhook_client_ca.pem"
#
# Rate limiting (per request path, token bucket). Excess requests get 429.
# rate_limit_per_min = 120       # sustained requests/minute per path
# rate_burst = 20                # burst capacity (default: one minute's worth)
# workers = 16                   # connection worker-pool size (default 16)

[[adapter.route]]
topic = "/sensors/garage/acoustic"   # matched against the request path
kind = "acoustic_impulse_in_zone"
zone = "garage"

# Canary Vision Pro (Seeed reCamera Pro, on-device NPU camera). No new
# firmware — configure its flow editor with a classifier -> HTTP request
# node POSTing {"confidence": <score>} to the path below. See
# docs/hardware/canary_vision_pro_recamera.md for the full setup and the
# class -> kind mapping table. Only classifier labels are routed here, NEVER
# a VLM/LLM free-text caption (the payload grammar has no field for one).
[[adapter.route]]
topic = "/sensors/loading_dock/recamera_pro"
kind = "large_object_boundary_crossing"   # e.g. the "person"/"car" classes
zone = "loading_dock"
min_confidence = 0.6

# Sound-classification flow from the same camera (glass break / alarm /
# raised voice class -> a binary "state" payload):
# [[adapter.route]]
# topic = "/sensors/loading_dock/recamera_pro_audio"
# kind = "acoustic_impulse_in_zone"
# zone = "loading_dock"
# require_truthy_state = true

# Canary Vision Lite (Seeed reCamera 2002w, ~$35 RISC-V/SG2002 WiFi camera).
# Same zero-new-firmware pattern as Vision Pro above, one route per unit —
# this is the "put several of these in mundane spots" coverage tier, not a
# flagship chokepoint. See docs/hardware/canary_vision_lite_recamera.md.
[[adapter.route]]
topic = "/sensors/stockroom/recamera_2002w"
kind = "small_object_boundary_crossing"
zone = "stockroom"
min_confidence = 0.6

# ---------------------------------------------------------------------------
# Adapter: BLE presence gateway (ESPresense / room-presence style)
# Turns a popular DIY BLE presence mesh into a witness source. Subscribes to ESPresense's
# per-room distance topics and emits a coarse presence claim for the ROOM when a device is within
# `max_distance` meters. Device id/name are intentionally ignored — no identity is retained.
# ---------------------------------------------------------------------------
[[adapter]]
type = "ble_presence"
mqtt_broker_addr = "127.0.0.1:1883"
topic = "espresense/devices/#"   # room is taken from the last topic segment
# sandbox = true

[[adapter.room]]
room = "lobby"          # matched (case-insensitively) against the last topic segment
zone = "lobby"          # logical zone the presence claim is attributed to
max_distance = 4.0      # meters; present when reported distance <= this

# ---------------------------------------------------------------------------
# Adapter: Meshtastic LoRa mesh (Detection Sensor Module nodes)
# Kilometer-scale, off-grid witness sources: a Meshtastic node with the Detection Sensor
# Module (PIR / contact switch on a GPIO) alerts over LoRa; a gateway node uplinks to this
# broker. Gateway config: MQTT module enabled=true AND json_enabled=true. Use a PRIVATE
# channel with a non-default PSK — the default LongFast key is public, and the mesh is an
# unauthenticated producer either way. Node ids are routing keys only; they never reach the
# sealed log (positions, timestamps, and RSSI/SNR are never retained either).
# See docs/meshtastic_integration.md.
# ---------------------------------------------------------------------------
[[adapter]]
type = "meshtastic"
mqtt_broker_addr = "127.0.0.1:1883"
topic = "msh/+/2/json/+/+"      # JSON-mode uplinks; changing it needs a restart
# mqtt_username = ""
# mqtt_password = ""
# sandbox = true

# Each node maps an originating sensor node (the packet's `from`, NOT the gateway) to a
# coarse claim kind in a logical zone. kind must be one of:
#   presence_in_restricted_zone, contact_state_change, acoustic_impulse_in_zone,
#   vehicle_arrival_departure
[[adapter.node]]
node_id = "!7d3a9f7f"           # !hex, bare hex, or decimal node number
kind = "presence_in_restricted_zone"
zone = "back_gate"
# detection_name = "PIR"        # require the alert text to contain the sensor's configured
#                               # name (also lets detection alerts ride plain text packets)
# min_snr = -15.0               # optional RF quality floor; the value is never logged

# Canary Car Mode: a stock Meshtastic node (NO custom firmware) wired so its Detection Sensor
# Module GPIO reads the vehicle's ignition-switched USB power. `state_broadcast_interval` (set
# on the node, e.g. every 120s) re-affirms "still running" the whole drive; departure is
# deliberately NOT an explicit packet from the node (a documented firmware bug makes the OFF
# transition unreliable — see docs/hardware/canary_car_mode.md §4) — it's inferred from the
# ABSENCE of these heartbeats, same as any other presence source going quiet.
[[adapter.node]]
node_id = "!a1b2c3d4"           # your Car Mode node's id
kind = "vehicle_arrival_departure"
zone = "garage"

# ---------------------------------------------------------------------------
# Adapter: Vehicle CAN bus (Canary Vehicle — passive-only, read-only)
# Turns a vehicle's own CAN bus into a witness source: ignition on/off (or any frame you've
# identified) becomes a coarse `vehicle_arrival_departure` claim. This adapter NEVER transmits a
# CAN frame — read-only by construction, see docs/hardware/canary_vehicle_can.md §3. Requires a
# Linux SocketCAN interface, brought up OUTSIDE this process:
#   sudo ip link set can0 up type can bitrate 500000
#
# CAN frame IDs and byte layouts are manufacturer-proprietary — there is no universal "ignition
# on" frame. Find yours by sniffing your own vehicle's bus, e.g. with candump (can-utils) while
# turning the ignition on and off, and diffing which frame ID/byte changes:
#   candump can0 | grep -v <known-noisy-ids>
# See the full walkthrough in docs/hardware/canary_vehicle_can.md §2.
# ---------------------------------------------------------------------------
[[adapter]]
type = "can_bus"
interface = "can0"

# Each route matches (can_id, byte_offset, mask, equals) to a claim kind in a zone. can_id and
# equals accept decimal or 0x-hex (paste straight from candump's hex dump). Multiple routes MAY
# share a can_id (e.g. ignition-on and ignition-off are two routes on the SAME frame ID,
# distinguished by which byte value each expects) — the first whose byte condition matches wins.
# kind must be one of the vehicle-shaped kinds; today that's just:
#   vehicle_arrival_departure
# (mqtt_sensor/webhook accept the FULL claim-kind vocabulary — this adapter's descriptor
# deliberately allows only this one kind, so a misconfigured route cannot emit anything
# telemetry- or tracking-shaped even by mistake.)
[[adapter.route]]
can_id = "0x3E8"       # replace with YOUR vehicle's ignition-status frame ID
byte_offset = 0
equals = "0x01"         # replace with the byte value that means "ignition on"
kind = "vehicle_arrival_departure"
zone = "garage"
confidence = 0.9

[[adapter.route]]
can_id = "0x3E8"        # same frame ID as above...
byte_offset = 0
equals = "0x00"         # ...different byte value: "ignition off"
kind = "vehicle_arrival_departure"
zone = "garage"
confidence = 0.9

# mask = "0x01"          # optional: isolate a single flag bit instead of the whole byte

# ---------------------------------------------------------------------------
# Optional hardening: set `sandbox = true` on ANY adapter above to run its
# payload parsing inside the kernel's seccomp sandbox (forbidden filesystem/
# network syscalls are denied even if the parser is compromised). Opt-in
# because of the per-poll fork cost; recommended for internet-facing inputs.
#
# Home Assistant diagnostic sensors from the stats endpoint (set `stats_addr` above), add to
# configuration.yaml:
#
#   rest:
#     - resource: "http://ADAPTER_HOST:8801/"
#       scan_interval: 30
#       sensor:
#         - name: "Webhook adapter sealed"
#           value_template: "{{ value_json['webhook_adapter#0'].claims_sealed }}"
#         - name: "Webhook adapter rejected"
#           value_template: "{{ value_json['webhook_adapter#0'].claims_rejected }}"
# ---------------------------------------------------------------------------
