# Adapter Host configuration — copy to adapter_host.toml and customize.
#
# Run with:
#   DEVICE_KEY_SEED=$(openssl rand -hex 32) \
#     cargo run --bin adapter_host \
#     --features adapter-frigate,adapter-mqtt-sensor,adapter-webhook,adapter-webhook-tls,adapter-ble-presence,adapter-sandbox \
#     -- --config adapter_host.toml
#
# The adapter host runs many vendor-neutral sensor adapters behind one daemon. Every claim flows
# through the same privacy-enforcing kernel choke point, so adding sensors never weakens any
# invariant. See spec/sensor_adapter_contract_v0.md and spec/witness_mesh_os_v0.md.

# Sealed event log database path.
db_path = "witness.db"

# Ruleset identifier (change when your detection rules change significantly).
ruleset_id = "ruleset:adapter_host_v1"

# Time-bucket size in seconds. Must be >= 300 (5 min); the kernel re-coarsens to 10 min.
bucket_size_secs = 600

# How often (seconds) the host drains adapters and seals their claims.
poll_interval_secs = 1

# Coarse confidence floor; claims below this are dropped before reaching the kernel.
min_confidence = 0.5

# Optional read-only stats/health endpoint. Serves per-adapter counters as JSON at "/" and a
# liveness check at "/healthz" (operational counts only, never event content). The SecuraCV Home
# Assistant integration can surface this automatically as a diagnostic sensor — set the same URL as
# "Adapter Host stats URL" during setup. (Or scrape it with a built-in `rest` sensor; see the
# snippet at the bottom of this file.)
# stats_addr = "127.0.0.1:8799"

# ---------------------------------------------------------------------------
# Adapter: Frigate NVR
# Reuses Frigate's free, open-source object detection; strips identity and seals coarse claims.
# ---------------------------------------------------------------------------
[[adapter]]
type = "frigate"
mqtt_broker_addr = "127.0.0.1:1883"   # Frigate's MQTT broker (loopback by default)
topic = "frigate/events"
# cameras = ["front_door", "driveway"] # optional allowlist; omit to process all
# labels = ["person", "car"]           # optional; omit for the built-in default set
# min_confidence = 0.5
# mqtt_username = ""
# mqtt_password = ""

# ---------------------------------------------------------------------------
# Adapter: generic MQTT sensors
# Bring any cheap sensor that can publish MQTT (PIR, contact switch, acoustic module,
# webhook->MQTT bridge, BLE gateway). No code required — just routes.
# ---------------------------------------------------------------------------
[[adapter]]
type = "mqtt_sensor"
mqtt_broker_addr = "127.0.0.1:1883"
# mqtt_username = ""
# mqtt_password = ""

# Each route maps an MQTT topic to a coarse claim kind in a logical zone.
# kind must be one of:
#   large_object_boundary_crossing, small_object_boundary_crossing,
#   acoustic_impulse_in_zone, presence_in_restricted_zone,
#   vehicle_presence_after_hours, contact_state_change, object_removed_from_zone
[[adapter.route]]
topic = "sensors/garage/acoustic"
kind = "acoustic_impulse_in_zone"
zone = "garage"
min_confidence = 0.0

[[adapter.route]]
topic = "sensors/lobby/pir"
kind = "presence_in_restricted_zone"
zone = "lobby"

[[adapter.route]]
topic = "sensors/server_room/door"
kind = "contact_state_change"
zone = "server_room"
require_truthy_state = true   # only emit on ON/open/true payloads

# ---------------------------------------------------------------------------
# Adapter: HTTP webhook ingress
# The lowest-friction option: NO MQTT broker required. Any device or script that
# can make an HTTP POST becomes a witness source. The request PATH is the route
# key; the body is parsed like the mqtt_sensor payload. For example:
#   curl -X POST http://127.0.0.1:8800/sensors/garage/acoustic -d '{"confidence":0.8}'
# ---------------------------------------------------------------------------
[[adapter]]
type = "webhook"
listen_addr = "127.0.0.1:8800"   # loopback by default
# sandbox = true                 # parse request bodies inside the seccomp sandbox
#
# Authentication — REQUIRED on anything but loopback (the webhook is the one untrusted, network-
# facing ingress). Pick ONE; hmac_secret wins if both are set.
# auth_token = "change-me"       # require: Authorization: Bearer change-me
# hmac_secret = "change-me"      # require: X-Signature: sha256=<HMAC-SHA256(secret, body)>
#                                #   sig=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$SECRET" -hex | sed 's/^.* //')
#                                #   curl -H "X-Signature: sha256=$sig" -d "$BODY" http://host:8800/path
#
# HMAC replay protection (only with hmac_secret). When set, the client must also send X-Timestamp
# (unix seconds, within the window) and a unique X-Nonce, and sign "<timestamp>.<nonce>.<body>":
#   ts=$(date +%s); nonce=$(openssl rand -hex 8)
#   sig=$(printf '%s.%s.%s' "$ts" "$nonce" "$BODY" | openssl dgst -sha256 -hmac "$SECRET" -hex | sed 's/^.* //')
#   curl -H "X-Timestamp: $ts" -H "X-Nonce: $nonce" -H "X-Signature: sha256=$sig" -d "$BODY" ...
# hmac_replay_window_secs = 300
#
# TLS — strongly recommended for any non-loopback listener, so bearer tokens aren't sent in the
# clear. Set both; generate a cert with e.g.
#   openssl req -x509 -newkey rsa:2048 -keyout key.pem -out cert.pem -days 365 -nodes -subj "/CN=host"
# tls_cert = "/etc/securacv/webhook_cert.pem"
# tls_key  = "/etc/securacv/webhook_key.pem"
#
# Rate limiting (per request path, token bucket). Excess requests get 429.
# rate_limit_per_min = 120       # sustained requests/minute per path
# rate_burst = 20                # burst capacity (default: one minute's worth)
# workers = 16                   # connection worker-pool size (default 16)

[[adapter.route]]
topic = "/sensors/garage/acoustic"   # matched against the request path
kind = "acoustic_impulse_in_zone"
zone = "garage"

# ---------------------------------------------------------------------------
# Adapter: BLE presence gateway (ESPresense / room-presence style)
# Turns a popular DIY BLE presence mesh into a witness source. Subscribes to ESPresense's
# per-room distance topics and emits a coarse presence claim for the ROOM when a device is within
# `max_distance` metres. Device id/name are intentionally ignored — no identity is retained.
# ---------------------------------------------------------------------------
[[adapter]]
type = "ble_presence"
mqtt_broker_addr = "127.0.0.1:1883"
topic = "espresense/devices/#"   # room is taken from the last topic segment
# sandbox = true

[[adapter.room]]
room = "lobby"          # matched (case-insensitively) against the last topic segment
zone = "lobby"          # logical zone the presence claim is attributed to
max_distance = 4.0      # metres; present when reported distance <= this

# ---------------------------------------------------------------------------
# Optional hardening: set `sandbox = true` on ANY adapter above to run its
# payload parsing inside the kernel's seccomp sandbox (forbidden filesystem/
# network syscalls are denied even if the parser is compromised). Opt-in
# because of the per-poll fork cost; recommended for internet-facing inputs.
#
# Home Assistant diagnostic sensors from the stats endpoint (set `stats_addr` above), add to
# configuration.yaml:
#
#   rest:
#     - resource: "http://ADAPTER_HOST:8799/"
#       scan_interval: 30
#       sensor:
#         - name: "Webhook adapter sealed"
#           value_template: "{{ value_json['webhook_adapter#0'].claims_sealed }}"
#         - name: "Webhook adapter rejected"
#           value_template: "{{ value_json['webhook_adapter#0'].claims_rejected }}"
# ---------------------------------------------------------------------------
