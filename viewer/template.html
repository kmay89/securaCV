<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>securaCV — Evidence Viewer</title>
<!--
  Universal offline evidence viewer. Open this file in any modern browser, drag in a
  `securacv-evidence-envelope` JSON bundle, and verify it entirely offline — no install,
  no account, no network. Verification logic is identical to the Rust verifier
  (src/envelope.rs); see spec/evidence_envelope.md.

  This file is GENERATED by viewer/build.mjs (verify_core.js inlined below). Do not edit the
  inlined verifier here; edit viewer/verify_core.js and re-run the build.
-->
<style>
  :root { --bg:#0f1419; --panel:#1a2129; --fg:#e6edf3; --muted:#8b98a5; --line:#2a333d;
          --ok:#2ea043; --warn:#d29922; --bad:#f85149; --accent:#388bfd; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
         background:var(--bg); color:var(--fg); }
  header { padding:20px 24px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:18px; letter-spacing:.3px; }
  header p { margin:4px 0 0; color:var(--muted); font-size:13px; }
  main { max-width:920px; margin:0 auto; padding:24px; }
  #drop { border:2px dashed var(--line); border-radius:12px; padding:48px 24px; text-align:center;
          color:var(--muted); cursor:pointer; transition:.15s; }
  #drop.hover { border-color:var(--accent); color:var(--fg); background:#16202b; }
  #drop input { display:none; }
  .banner { border-radius:10px; padding:16px 18px; margin:18px 0; font-weight:600; display:flex;
            align-items:center; gap:10px; }
  .banner.ok { background:rgba(46,160,67,.15); border:1px solid var(--ok); color:#7ee787; }
  .banner.warn { background:rgba(210,153,34,.13); border:1px solid var(--warn); color:#e3b341; }
  .banner.bad { background:rgba(248,81,73,.13); border:1px solid var(--bad); color:#ff7b72; }
  .dot { width:12px; height:12px; border-radius:50%; flex:0 0 auto; }
  .dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px;
           padding:16px 18px; margin:14px 0; }
  .panel h2 { margin:0 0 12px; font-size:13px; text-transform:uppercase; letter-spacing:.6px;
              color:var(--muted); }
  .kv { display:grid; grid-template-columns:170px 1fr; gap:6px 14px; font-size:14px; }
  .kv div:nth-child(odd){ color:var(--muted); }
  .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; word-break:break-all; font-size:13px; }
  ul.warns { margin:8px 0 0; padding-left:18px; color:var(--warn); font-size:13px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:600; }
  .tag { display:inline-block; padding:1px 7px; border-radius:6px; background:#21303f; color:#9ecbff;
         font-size:12px; }
  .tag.fail { background:#3a2326; color:#ff9a93; }
  .hint { color:var(--muted); font-size:12px; margin-top:6px; }
  footer { color:var(--muted); font-size:12px; text-align:center; padding:24px; }
</style>
</head>
<body>
<header>
  <h1>securaCV · Evidence Viewer</h1>
  <p>Verify a witness evidence bundle offline. Nothing leaves this page.</p>
</header>
<main>
  <div id="drop">
    <strong>Drop an evidence envelope (.json) here</strong>
    <div class="hint">or click to choose a file · everything runs locally in your browser</div>
    <input type="file" id="file" accept="application/json,.json">
  </div>
  <div id="out"></div>
</main>
<footer>securaCV evidence viewer · offline · open-source · no network access</footer>

<script>
/*__VERIFY_CORE__*/
</script>

<script>
'use strict';
const V = globalThis.SecuraCVVerify;
const $ = (id) => document.getElementById(id);
const drop = $('drop'), fileInput = $('file'), out = $('out');

drop.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => { if (e.target.files[0]) readFile(e.target.files[0]); });
['dragenter', 'dragover'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('hover'); }));
['dragleave', 'drop'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('hover'); }));
drop.addEventListener('drop', (e) => { const f = e.dataTransfer.files[0]; if (f) readFile(f); });

function readFile(file) {
  const reader = new FileReader();
  reader.onload = () => verifyAndRender(reader.result);
  reader.readAsText(file);
}

function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function fmtBucket(tb) {
  if (!tb) return '—';
  const start = new Date(tb.start_epoch_s * 1000).toISOString().replace('.000Z', 'Z');
  return `${esc(start)} · ${tb.size_s}s bucket`;
}

async function verifyAndRender(text) {
  let envelope;
  try { envelope = JSON.parse(text); }
  catch (e) { return renderBad('Not valid JSON: ' + e.message); }

  let report;
  try { report = await V.verifyEnvelope(envelope); }
  catch (e) { return renderBad('Verifier error: ' + e.message); }

  const cls = report.status === 'ok' ? 'ok' : report.status === 'valid_with_warnings' ? 'warn' : 'bad';
  const label = report.status === 'ok' ? 'VERIFIED — integrity intact'
    : report.status === 'valid_with_warnings' ? 'VERIFIED with warnings'
    : 'COMPROMISED — verification failed';

  let html = `<div class="banner ${cls}"><span class="dot ${cls}"></span>${label}</div>`;

  if (!report.ok) {
    html += `<div class="panel"><h2>Failure</h2><div class="mono">${esc(report.error || 'unknown')}</div></div>`;
    out.innerHTML = html;
    return;
  }

  const p = envelope.provenance || {};
  html += `<div class="panel"><h2>Bundle fingerprint</h2>
    <div class="mono">${esc(report.whole_envelope_digest || '')}</div>
    <div class="hint">SHA-256 of the canonical envelope — cite this to identify the bundle.</div></div>`;

  html += `<div class="panel"><h2>Provenance</h2><div class="kv">
    <div>Kernel version</div><div>${esc(p.kernel_version)}</div>
    <div>Ruleset</div><div>${esc(p.ruleset_id)}</div>
    <div>Ruleset hash</div><div class="mono">${esc(p.ruleset_hash)}</div>
    <div>Device key (Ed25519)</div><div class="mono">${esc(p.device_public_key)}</div>
    <div>Post-quantum key</div><div>${p.pq_public_key ? 'present (not checked offline)' : 'none'}</div>
  </div></div>`;

  html += `<div class="panel"><h2>Summary</h2><div class="kv">
    <div>Sealed events</div><div>${report.sealed_events}</div>
    <div>Export receipts</div><div>${report.export_receipts}</div>
    <div>Break-glass</div><div>${report.break_glass_granted} granted · ${report.break_glass_denied} denied</div>
    <div>Failure records (gaps)</div><div>${(envelope.gaps && envelope.gaps.failure_count) || 0}</div>
    <div>Disclosure profile</div><div>${esc((envelope.disclosure && envelope.disclosure.profile) || 'full')}</div>
  </div></div>`;

  if (report.warnings && report.warnings.length) {
    html += `<div class="panel"><h2>Warnings</h2><ul class="warns">${report.warnings.map((w) => `<li>${esc(w)}</li>`).join('')}</ul></div>`;
  }

  html += renderTimeline(envelope);
  out.innerHTML = html;
}

// Render the verified events directly from the signed sealed_events ledger (the authoritative
// record), not the coarse artifact projection.
function renderTimeline(envelope) {
  const entries = (envelope.ledgers && envelope.ledgers.sealed_events && envelope.ledgers.sealed_events.entries) || [];
  const rows = [];
  for (const e of entries) {
    let rec;
    try { rec = JSON.parse(e.payload_json); } catch { continue; }
    const isFailure = rec.record_type === 'failure' || rec.failure_type !== undefined;
    const type = rec.event_type || rec.failure_type || (rec.Event && 'event') || 'unknown';
    const tb = rec.time_bucket;
    const zone = rec.zone_id || '—';
    const conf = rec.confidence != null ? rec.confidence.toFixed(2) : '—';
    rows.push(`<tr>
      <td>${fmtBucket(tb)}</td>
      <td><span class="tag ${isFailure ? 'fail' : ''}">${esc(typeof type === 'string' ? type : JSON.stringify(type))}</span></td>
      <td>${esc(zone)}</td>
      <td>${isFailure ? '—' : conf}</td></tr>`);
  }
  if (!rows.length) return `<div class="panel"><h2>Timeline</h2><div class="hint">No sealed events in this bundle.</div></div>`;
  return `<div class="panel"><h2>Timeline (verified sealed events)</h2>
    <table><thead><tr><th>Time bucket</th><th>Event</th><th>Zone</th><th>Confidence</th></tr></thead>
    <tbody>${rows.join('')}</tbody></table>
    <div class="hint">Rendered from the cryptographically verified, signed event ledger.</div></div>`;
}

function renderBad(msg) {
  out.innerHTML = `<div class="banner bad"><span class="dot bad"></span>Could not verify</div>
    <div class="panel"><h2>Error</h2><div class="mono">${esc(msg)}</div></div>`;
}
</script>
</body>
</html>
