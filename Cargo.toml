[package]
name = "witness-kernel"
version = "0.5.0"
edition = "2021"
license = "Apache-2.0"
description = "Privacy Witness Kernel (PWK) - witnessd + tools + break_glass"

[dependencies]
anyhow = "1.0"
rusqlite = { version = "0.31", features = ["bundled-sqlcipher"] }
hkdf = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
sha2 = "0.11"
rand = "0.10"
zeroize = { version = "1.7", features = ["derive"] }
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["derive", "env"] }
regex = "1.10"
log = "0.4"
env_logger = "0.11"
rumqttc = { package = "rumqttc-next", version = "0.33", features = ["use-rustls"] }
hex = "0.4"
ed25519-dalek = "2.1"
pqcrypto-mldsa = { version = "0.1", optional = true }
pqcrypto-traits = { version = "0.3", optional = true }
pqcrypto-mlkem = { version = "0.1", optional = true }
ctrlc = { version = "3.4", features = ["termination"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"], optional = true }
ureq = { version = "3.0", optional = true }
url = { version = "2.5", optional = true }
gstreamer = { version = "0.25", optional = true }
gstreamer-app = { version = "0.25", optional = true }
gstreamer-video = { version = "0.25", optional = true }
ffmpeg-next = { version = "8.1", optional = true }
v4l = { version = "0.14", optional = true }
ouroboros = { version = "0.18", optional = true }
tract-onnx = { version = "0.23", optional = true }
rustls = { version = "0.23", optional = true, features = ["aws_lc_rs"] }
webpki-roots = { version = "1.0", optional = true }
rustls-pki-types = { version = "1.10", optional = true, features = ["std"] }
rustls-pemfile = { version = "2.1", optional = true }
subtle = "2.5"

[dev-dependencies]
trybuild = "1.0.89"
tempfile = "3.10"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
libseccomp = "0.4"
libseccomp-sys = "0.3"

[features]
rtsp-gstreamer = ["gstreamer", "gstreamer-app", "gstreamer-video"]
rtsp-ffmpeg = ["ffmpeg-next"]
ingest-file-ffmpeg = ["ffmpeg-next"]
ingest-esp32 = ["image", "ureq", "url"]
ingest-v4l2 = ["v4l", "ouroboros"]
stub-frame-source = []
backend-tract = ["tract-onnx"]
detect-eval = ["backend-tract", "image"]
adapter-frigate = []
adapter-mqtt-sensor = []
adapter-webhook = ["adapter-mqtt-sensor"]
adapter-webhook-tls = ["adapter-webhook", "rustls", "rustls-pemfile", "rustls-pki-types"]
adapter-ble-presence = []
adapter-meshtastic = []
adapter-sandbox = []
pqc-signatures = ["pqcrypto-mldsa", "pqcrypto-traits"]
pqc-vault = ["pqcrypto-mlkem", "pqcrypto-traits"]
pqc-tls = ["rustls", "webpki-roots", "rustls-pki-types"]

[[bin]]
name = "witnessd"
path = "src/bin/witnessd.rs"

[[bin]]
name = "log_verify"
path = "src/bin/log_verify.rs"


[[bin]]
name = "break_glass"
path = "src/bin/break_glass.rs"

[[bin]]
name = "export_events"
path = "src/bin/export_events.rs"

[[bin]]
name = "demo"
path = "src/bin/demo.rs"

[[bin]]
name = "export_verify"
path = "src/bin/export_verify.rs"

[[bin]]
name = "envelope_verify"
path = "src/bin/envelope_verify.rs"

[[bin]]
name = "frigate_bridge"
path = "src/bin/frigate_bridge.rs"

[[bin]]
name = "event_mqtt_bridge"
path = "src/bin/event_mqtt_bridge.rs"

[[bin]]
name = "witness_api"
path = "src/bin/witness_api.rs"

[[bin]]
name = "break_glass_serve"
path = "src/bin/break_glass_serve.rs"

[[bin]]
name = "grove_vision2_ingest"
path = "src/bin/grove_vision2_ingest.rs"

[[bin]]
name = "adapter_host"
path = "src/bin/adapter_host.rs"
required-features = [
    "adapter-frigate",
    "adapter-mqtt-sensor",
    "adapter-webhook",
    "adapter-webhook-tls",
    "adapter-ble-presence",
    "adapter-meshtastic",
    "adapter-sandbox",
]

[[bin]]
name = "tamper_demo"
path = "src/bin/tamper_demo.rs"

[[bin]]
name = "ingest_run"
path = "src/bin/ingest_run.rs"
required-features = ["ingest-file-ffmpeg"]

[[bin]]
name = "detect_eval"
path = "src/bin/detect_eval.rs"
required-features = ["detect-eval"]
