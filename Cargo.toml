[package]
name = "witness-kernel"
# Kept in lockstep with custom_components/securacv/manifest.json and
# privacy_witness_kernel/config.yaml via scripts/bump_version.sh; CI fails
# on drift (scripts/lint_version_sync.sh).
version = "0.7.0"
edition = "2021"
license = "Apache-2.0"
description = "Privacy Witness Kernel (PWK) - witnessd + tools + break_glass"

[dependencies]
anyhow = "1.0"
rusqlite = { version = "0.31", features = ["bundled-sqlcipher"] }
hkdf = "0.13"
# Memory-hard KDF for the optional `seed-argon2id:v1:` device-seed format
# (a passphrase seed must not be brute-forceable through the fast SHA-256
# legacy derivation). Non-optional and default-features off (only `alloc` is
# needed for the low-level hash_password_into) so witnessd and every verifier
# binary derive an identity byte-identically — no kernel/verifier split.
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
sha2 = "0.11"
rand = "0.10"
zeroize = { version = "1.7", features = ["derive"] }
# zeroize: restores 0.10.x behavior (unconditional then) of scrubbing the
# cipher's internal key copy on drop — off by default in 0.11.
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
clap = { version = "4.5", features = ["derive", "env"] }
regex = "1.10"
log = "0.4"
env_logger = "0.11"
rumqttc = { package = "rumqttc-next", version = "0.33", features = ["use-rustls"] }
hex = "0.4"
ed25519-dalek = { version = "3.0", features = ["pkcs8", "pem"] }
# C2PA Content Credentials export (feature `c2pa-export`): the official CAI
# SDK, built without OpenSSL (rust_native_crypto) and without any HTTP
# backend — signing and verification are fully offline (Principle 2).
c2pa = { version = "0.90", default-features = false, features = ["rust_native_crypto"], optional = true }
# X.509 generation for the device-local C2PA credential chain (CA + leaf).
rcgen = { version = "0.14", optional = true }
pqcrypto-mldsa = { version = "0.1", optional = true }
pqcrypto-traits = { version = "0.3", optional = true }
pqcrypto-mlkem = { version = "0.1", optional = true }
ctrlc = { version = "3.4", features = ["termination"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"], optional = true }
ureq = { version = "3.0", optional = true }
url = { version = "2.5", optional = true }
gstreamer = { version = "0.25", optional = true }
gstreamer-app = { version = "0.25", optional = true }
gstreamer-video = { version = "0.25", optional = true }
ffmpeg-next = { version = "9.0", optional = true }
v4l = { version = "0.14", optional = true }
ouroboros = { version = "0.18", optional = true }
tract-onnx = { version = "0.23", optional = true }
rustls = { version = "0.23", optional = true, features = ["aws_lc_rs"] }
webpki-roots = { version = "1.0", optional = true }
rustls-pki-types = { version = "1.10", optional = true, features = ["std"] }
rustls-pemfile = { version = "2.1", optional = true }
subtle = "2.5"
# HAP (feature `bridge-homekit-server`). Both published HAP server crates
# failed the FR-14 gate — `hap 0.0.10` does not compile on a current
# toolchain, and `hap 0.1.0-pre.15` cannot be resolved at all (it links
# `ifaddrs` twice, via libmdns and get_if_addrs). So the protocol is built on
# the primitives above plus these three: SRP-6a for pair-setup (the crate
# implements Apple's non-padded-g variant explicitly), X25519 for
# pair-verify's ECDH, and a pure-Rust mDNS responder for discovery.
srp = { version = "0.7.0-rc.3", optional = true }
# `static_secrets` exposes the byte-seeded secret type, which is what lets a
# key come from the repo's fallible OS RNG rather than dalek's infallible
# `CryptoRng`; it also carries `was_contributory()`, the low-order-point check.
x25519-dalek = { version = "3.0", optional = true, features = ["static_secrets"] }
mdns-sd = { version = "0.21", optional = true }
# The setup QR. Zero dependencies of its own (Nayuki's reference generator),
# which is why it clears the FR-14 gate without argument.
qrcodegen = { version = "1.8", optional = true }
tempfile = "3.10"

[lints.rust]
# `--cfg fuzzing` is set by cargo-fuzz and by nothing else. It gates the one
# place we widen visibility for a fuzz harness (`vault::format`, so the
# container parser can be driven directly without standing up a break-glass
# token). Declaring it here keeps `clippy -D warnings` green — without this,
# an unexpected-cfg warning is promoted to an error and fails the build.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[dev-dependencies]
trybuild = "1.0.89"
proptest = "1"
# Self-signed certificates for the `api-tls` end-to-end tests. Same crate and
# version already vetted as the optional c2pa-export dependency.
rcgen = "0.14"

# libc is needed on every Unix (statvfs free-space preflight in witnessd);
# seccomp is Linux-only.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
libseccomp = "0.4"
libseccomp-sys = "0.3"

[features]
rtsp-gstreamer = ["gstreamer", "gstreamer-app", "gstreamer-video"]
rtsp-ffmpeg = ["ffmpeg-next"]
ingest-file-ffmpeg = ["ffmpeg-next"]
ingest-esp32 = ["image", "ureq", "url"]
ingest-v4l2 = ["v4l", "ouroboros"]
stub-frame-source = []
backend-tract = ["tract-onnx"]
detect-eval = ["backend-tract", "image"]
adapter-frigate = []
adapter-mqtt-sensor = []
adapter-webhook = ["adapter-mqtt-sensor"]
adapter-webhook-tls = ["adapter-webhook", "rustls", "rustls-pemfile", "rustls-pki-types"]
# In-process TLS for the event API and break-glass servers: with this feature
# a configured cert/key is terminated by rustls inside the accept loop, so
# "provide a cert/key" actually encrypts the socket instead of attesting to an
# external terminator (docs/security/ENTERPRISE_CUSTODY.md section 4).
api-tls = ["rustls", "rustls-pemfile", "rustls-pki-types"]
adapter-ble-presence = []
# Egress bridge: the paced Apple Home projection core
# (docs/design/apple_home_integration.md). Pure Rust, no HAP dependency yet —
# it produces the publications a HAP server would send, on a fixed cadence,
# so the Invariant III properties are testable without a socket.
bridge-homekit = []
# The HAP accessory server (bridge site B): witnessd advertises over mDNS and
# a controller pairs with it directly, no Home Assistant in the path. Kept
# separate from the projection core above so that core stays pure and
# testable without pulling a single crypto or network dependency.
bridge-homekit-server = ["bridge-homekit", "dep:srp", "dep:x25519-dalek", "dep:mdns-sd", "dep:qrcodegen"]
adapter-meshtastic = []
adapter-can-bus = []
adapter-sandbox = []
pqc-signatures = ["pqcrypto-mldsa", "pqcrypto-traits"]
pqc-vault = ["pqcrypto-mlkem", "pqcrypto-traits"]
pqc-tls = ["rustls", "webpki-roots", "rustls-pki-types"]
# RFC 3161 trusted timestamping: enables log_anchor's online `request`
# subcommand (the offline query/import flow needs no feature).
tsa = ["ureq"]
# The hub-side alert relay (docs/design/alert_relay.md): metadata-only pokes
# over ntfy. Zero new crates — ureq (already vetted for tsa/ingest-esp32)
# carries rustls, so network egress stays opt-in at build time.
alert-relay = ["ureq"]
# C2PA Content Credentials sidecar manifests for export bundles
# (docs/design/c2pa_export.md). Fully offline; keys derived from the device
# seed with domain separation; trust anchor is the device-local CA.
c2pa-export = ["dep:c2pa", "dep:rcgen"]

[[bin]]
name = "witnessd"
path = "src/bin/witnessd.rs"

# The Apple Home bridge. Gated on the feature so a default build neither
# compiles the HAP stack nor carries its dependencies.
[[bin]]
name = "hap_bridge"
path = "src/bin/hap_bridge.rs"
required-features = ["bridge-homekit-server"]

# The alert relay. Gated so a default build carries no outbound-HTTP path;
# the poke vocabulary and debounce live in src/relay/ and are unit-tested
# without a broker or a network.
[[bin]]
name = "alert_relay"
path = "src/bin/alert_relay.rs"
required-features = ["alert-relay"]

[[bin]]
name = "log_verify"
path = "src/bin/log_verify.rs"

[[bin]]
name = "log_anchor"
path = "src/bin/log_anchor.rs"


[[bin]]
name = "break_glass"
path = "src/bin/break_glass.rs"

[[bin]]
name = "export_events"
path = "src/bin/export_events.rs"

[[bin]]
name = "demo"
path = "src/bin/demo.rs"

[[bin]]
name = "export_verify"
path = "src/bin/export_verify.rs"

[[bin]]
name = "envelope_verify"
path = "src/bin/envelope_verify.rs"

[[bin]]
name = "frigate_bridge"
path = "src/bin/frigate_bridge.rs"

[[bin]]
name = "event_mqtt_bridge"
path = "src/bin/event_mqtt_bridge.rs"

[[bin]]
name = "witness_api"
path = "src/bin/witness_api.rs"

[[bin]]
name = "break_glass_serve"
path = "src/bin/break_glass_serve.rs"

[[bin]]
name = "grove_vision2_ingest"
path = "src/bin/grove_vision2_ingest.rs"

[[bin]]
name = "adapter_host"
path = "src/bin/adapter_host.rs"
required-features = [
    "adapter-frigate",
    "adapter-mqtt-sensor",
    "adapter-webhook",
    "adapter-webhook-tls",
    "adapter-ble-presence",
    "adapter-meshtastic",
    "adapter-can-bus",
    "adapter-sandbox",
]

[[bin]]
name = "tamper_demo"
path = "src/bin/tamper_demo.rs"

[[bin]]
name = "ingest_run"
path = "src/bin/ingest_run.rs"
required-features = ["ingest-file-ffmpeg"]

[[bin]]
name = "detect_eval"
path = "src/bin/detect_eval.rs"
required-features = ["detect-eval"]

# Flight Rules FR-2/FR-5 (docs/strategy/12): a panic in any thread must take
# the whole process down for the supervisor to restart — never a half-dead
# daemon with a silently missing API thread — and arithmetic overflow must be
# a caught fault, not a silent wrap (Ariane 5's failure class).
[profile.release]
panic = "abort"
overflow-checks = true
lto = "thin"
