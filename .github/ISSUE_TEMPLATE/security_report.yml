name: "Security Report"
description: "Report invariant violations or security regressions."
title: "[Security] "
labels:
  - "security"
body:
  - type: markdown
    attributes:
      value: |
        ## ⛔ Stop if this is exploitable against someone else's device

        **This form is public. Filing here is disclosing.**

        If a stranger could use what you found against a Canary someone is
        relying on — key extraction, an auth bypass, forging a record that
        verifies — close this and report it privately instead:

        - [**Private vulnerability report**](https://github.com/kmay89/securaCV/security/advisories/new) (preferred)
        - **errerlabs@gmail.com**

        The people this system protects are, by definition, people someone is
        actively trying to watch. Response times and safe-harbor terms are in
        [SECURITY.md](https://github.com/kmay89/securaCV/blob/main/SECURITY.md).

        ---

        Otherwise this is the right place. Use it for invariant violations,
        hardening ideas, docs that overstate a guarantee, a lint that should
        exist, or a finding against a device only you own. Provide the minimum
        detail needed to reproduce the issue.
  - type: input
    id: invariant_violated
    attributes:
      label: Invariant violated
      description: Which invariant or enforcement point is violated?
      placeholder: "e.g., spec/invariants.md §3.2 ReprocessGuard"
    validations:
      required: true
  - type: textarea
    id: repro_steps
    attributes:
      label: Reproduction steps
      description: Provide a minimal reproduction (commands, inputs, or test case).
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected_vs_actual
    attributes:
      label: Expected vs actual behavior
      description: What did you expect, and what happened instead?
    validations:
      required: true
