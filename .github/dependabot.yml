# Automated dependency update PRs (HY-06). Replaces the manual advisory
# tracking in SECURITY.md with scheduled, grouped update PRs. The
# .github/workflows/audit.yml job is the companion that flags *known
# vulnerabilities* in the current lockfiles.
version: 2
updates:
  # Rust workspace (Cargo.toml / Cargo.lock at repo root).
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(cargo)"
    groups:
      # GStreamer bindings move in lockstep: gstreamer-app/-video track the core
      # gstreamer crate's API, so a partial bump (e.g. only gstreamer-app) leaves
      # the others on the old version and breaks the build (see #703). No
      # update-types filter, so even 0.x minor (treated as breaking) bumps the
      # whole set together in one PR.
      gstreamer:
        patterns: ["gstreamer", "gstreamer-*"]
      # RustCrypto crates share a `digest`/`crypto-common` trait generation.
      # Bumping one major alone (e.g. sha2 0.11 while hkdf/hmac stay on 0.12)
      # pulls two incompatible `digest` versions into the graph and fails to
      # compile -- Hkdf::<Sha256>::new() no longer resolves (see the split
      # sha2 #717 / hkdf #718 PRs). Group the whole digest+AEAD stack with no
      # update-types filter so a trait-generation bump lands as one coherent,
      # reviewable PR instead of N individually-unmergeable ones.
      rustcrypto:
        patterns:
          - "sha2"
          - "sha3"
          - "hkdf"
          - "hmac"
          - "digest"
          - "crypto-common"
          - "block-buffer"
          - "chacha20poly1305"
          - "aead"
          - "cipher"
          - "universal-hash"
          - "poly1305"
      # rand 0.9/0.10 reshuffled the entry points (thread_rng/OsRng moved or
      # were removed), so a major bump needs source changes and rand_core must
      # move with it. Keep the family together in one PR rather than landing
      # rand and rand_core as separate breakages.
      rand:
        patterns: ["rand", "rand_*"]
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # rusqlite >= 0.32 pulls libsqlite3-sys >= 0.38, whose build script uses
      # the `cfg_select!` macro that is not stable on the current stable Rust
      # toolchain (rustc 1.94). The bump therefore cannot compile in CI (see
      # the abandoned #719). Hold the major until the toolchain catches up;
      # minor/patch updates within 0.31.x still flow through cargo-minor-patch.
      - dependency-name: "rusqlite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "libsqlite3-sys"
        update-types: ["version-update:semver-major"]

  # Shipped desktop / tvOS crates. Each has its OWN Cargo.lock outside the root
  # (no [workspace]), so the root cargo entry above never updates them — and
  # audit.yml now flags advisories in exactly these lockfiles, so Dependabot is
  # the companion that opens the fixing PRs. Minor/patch grouped per crate.
  - package-ecosystem: "cargo"
    directory: "/desktop/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(cargo)"
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "cargo"
    directory: "/desktop-lab/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(cargo)"
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # hub-core is intentionally absent here: it is a zero-dependency, pure-`std`
  # crate whose Cargo.lock is gitignored, so Dependabot has no manifest deps or
  # lockfile to act on (it would only log a "can't find Cargo.lock" error).
  - package-ecosystem: "cargo"
    directory: "/desktop/hub-io"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(cargo)"
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "cargo"
    directory: "/tvos/witness-core"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(cargo)"
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Node fleet UI + device-API (npm workspace rooted at canary-vision/).
  - package-ecosystem: "npm"
    directory: "/canary-vision"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(npm)"
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Shipped desktop Lab UI (desktop-lab/package-lock.json). desktop/ has no
  # committed package-lock.json, so it has no npm entry here (nothing to audit
  # or update); add one if a lockfile is ever committed there.
  - package-ecosystem: "npm"
    directory: "/desktop-lab"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(npm)"
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GitHub Actions used across .github/workflows/ AND inside the two composite
  # actions. `directory: "/"` only covers .github/workflows/*; a composite
  # action's own `uses:` pins are invisible to it — which is how
  # keep-firmware-latest sat on github-script@v8 while every workflow had
  # moved to v9, and how the SHA-pinned arduino/setup-arduino-cli in
  # setup-arduino-esp32 would never have been bumped.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/keep-firmware-latest"
      - "/.github/actions/setup-arduino-esp32"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(actions)"
    groups:
      github-actions:
        patterns: ["*"]

  # Python test tooling (requirements_test.txt, mirrored byte-for-byte in the
  # HACS repo securacv-homeassistant, which already has this entry and has
  # merged bumps the monorepo never saw — so the two copies of the same test
  # suite were running under different pytest/ruff/mypy pins).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(pip)"
    groups:
      pip-test-deps:
        patterns: ["*"]

  # Docker base images (FROM lines in the root and sidecar Dockerfiles). The
  # bases are pinned by digest for reproducibility, so Dependabot is what keeps
  # those digests fresh — it opens a PR to bump the pinned digest whenever the
  # upstream tag moves (e.g. a bookworm security rebuild), instead of the pins
  # silently going stale.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(docker)"

  - package-ecosystem: "docker"
    directory: "/docker/sidecar"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(docker)"
