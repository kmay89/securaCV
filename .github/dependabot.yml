# Automated dependency update PRs (HY-06). Replaces the manual advisory
# tracking in SECURITY.md with scheduled, grouped update PRs. The
# .github/workflows/audit.yml job is the companion that flags *known
# vulnerabilities* in the current lockfiles.
version: 2
updates:
  # Rust workspace (Cargo.toml / Cargo.lock at repo root).
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(cargo)"
    groups:
      # GStreamer bindings move in lockstep: gstreamer-app/-video track the core
      # gstreamer crate's API, so a partial bump (e.g. only gstreamer-app) leaves
      # the others on the old version and breaks the build (see #703). No
      # update-types filter, so even 0.x minor (treated as breaking) bumps the
      # whole set together in one PR.
      gstreamer:
        patterns: ["gstreamer", "gstreamer-*"]
      # RustCrypto crates share a `digest`/`crypto-common` trait generation.
      # Bumping one major alone (e.g. sha2 0.11 while hkdf/hmac stay on 0.12)
      # pulls two incompatible `digest` versions into the graph and fails to
      # compile -- Hkdf::<Sha256>::new() no longer resolves (see the split
      # sha2 #717 / hkdf #718 PRs). Group the whole digest+AEAD stack with no
      # update-types filter so a trait-generation bump lands as one coherent,
      # reviewable PR instead of N individually-unmergeable ones.
      rustcrypto:
        patterns:
          - "sha2"
          - "sha3"
          - "hkdf"
          - "hmac"
          - "digest"
          - "crypto-common"
          - "block-buffer"
          - "chacha20poly1305"
          - "aead"
          - "cipher"
          - "universal-hash"
          - "poly1305"
      # rand 0.9/0.10 reshuffled the entry points (thread_rng/OsRng moved or
      # were removed), so a major bump needs source changes and rand_core must
      # move with it. Keep the family together in one PR rather than landing
      # rand and rand_core as separate breakages.
      rand:
        patterns: ["rand", "rand_*"]
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Node fleet UI + device-API (npm workspace rooted at canary-vision/).
  - package-ecosystem: "npm"
    directory: "/canary-vision"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(npm)"
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GitHub Actions used across .github/workflows/.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(actions)"
    groups:
      github-actions:
        patterns: ["*"]
