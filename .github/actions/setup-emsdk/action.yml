name: Set up the pinned Emscripten SDK (cached)
description: >
  The emulator's WASM build (canary-local/emulator/build.sh) needs emsdk at
  one exact version — the committed dist/ is byte-compared against a rebuild,
  so a different compiler is a red drift check, not a warning. This action
  restores the SDK from the Actions cache (the clone+install costs ~2-3
  minutes on a cold cache), installs it on a miss, and activates it every
  time. canary-local.yml and emulator-dist-refresh.yml used to carry
  identical copies of these three steps; the whole point of the refresh
  workflow is byte-identical output to the CI job, which two copies can only
  promise until one is edited (CI.md R10).

  Later steps still `source <path>/emsdk_env.sh` themselves: activation
  writes config, it does not export into the job's shell.

inputs:
  version:
    description: >
      Emscripten SDK release to install and activate, and the emsdk tag the
      checkout is made at (the emsdk repository tags every release). Pinned:
      the cache key carries it, so a bump is a new cache entry, never a
      stale one. Bump `commit` with it.
    required: false
    default: "6.0.3"
  commit:
    description: >
      The commit the emsdk tag named by `version` points at (`git ls-remote
      --tags https://github.com/emscripten-core/emsdk.git <version>`). The
      checkout is refused when the tag resolves elsewhere, so a moved tag
      cannot swap the SDK's installer under the build.
    required: false
    default: "db04e88298d9916fc51fcd3743045ca3eb695127"
  path:
    description: Where the SDK checkout lives; also the cache path.
    required: false
    default: /tmp/emsdk

outputs:
  path:
    description: The SDK directory (source "<path>/emsdk_env.sh" in later steps).
    value: ${{ inputs.path }}

runs:
  using: composite
  steps:
    # The SDK is pinned, so the cache key never needs to rotate — the
    # clone+install only happens on a cold cache.
    - name: Cache the Emscripten SDK
      id: emsdk-cache
      uses: actions/cache@v6
      with:
        path: ${{ inputs.path }}
        key: emsdk-${{ inputs.version }}-${{ inputs.commit }}-${{ runner.os }}

    - name: Install pinned Emscripten SDK ${{ inputs.version }}
      if: steps.emsdk-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        EMSDK_VERSION: ${{ inputs.version }}
        EMSDK_COMMIT: ${{ inputs.commit }}
        EMSDK_DIR: ${{ inputs.path }}
      run: |
        set -euo pipefail
        # The release tag, not HEAD: the installer that fetches and checks
        # the SDK's binaries is itself pinned, to the tag AND its commit.
        git clone --depth 1 --branch "$EMSDK_VERSION" https://github.com/emscripten-core/emsdk.git "$EMSDK_DIR"
        got="$(git -C "$EMSDK_DIR" rev-parse HEAD)"
        if [ "$got" != "$EMSDK_COMMIT" ]; then
          echo "::error title=emsdk::tag ${EMSDK_VERSION} resolves to ${got}, expected ${EMSDK_COMMIT}; bump the action's commit input deliberately"
          exit 1
        fi
        "$EMSDK_DIR/emsdk" install "$EMSDK_VERSION"

    - name: Activate + verify Emscripten (cached or fresh)
      # activate runs UNCONDITIONALLY: it's seconds of local config writing,
      # and running it on warm-cache restores too means the build can never
      # depend on which activation state the cache happened to capture.
      shell: bash
      env:
        EMSDK_VERSION: ${{ inputs.version }}
        EMSDK_DIR: ${{ inputs.path }}
      run: |
        set -euo pipefail
        "$EMSDK_DIR/emsdk" activate "$EMSDK_VERSION"
        # emsdk_env.sh is generated by the SDK, not in the tree.
        # shellcheck source=/dev/null
        source "$EMSDK_DIR/emsdk_env.sh"
        emcc --version | head -1
