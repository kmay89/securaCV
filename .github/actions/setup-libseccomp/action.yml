name: Install libseccomp-dev
description: >
  The kernel links libseccomp on Linux — witnessd's syscall filter
  (src/module_runtime/sandbox.rs) — so without the headers every cargo
  target compiles cleanly and then dies at link with
  `unable to find library -lseccomp`. Found by building the fuzz suite for
  the first time; nine jobs then carried their own copy of the same apt-get
  line. This is the one copy (CI.md R10). Jobs that install libseccomp-dev
  in the same apt-get call as other packages (ffmpeg, mosquitto, GStreamer)
  keep their combined line — one apt transaction beats two.
  apt retries a dropped fetch and gives up on a stalled one: a hung
  `apt-get` on 2026-10-07 used the "Optional feature build gate" job's whole
  30 minutes and left main's Rust run canceled. Each caller also sets
  `timeout-minutes: 5` on the step, so a hang that gets past these fails in
  minutes, named, instead of eating the job's budget.

runs:
  using: composite
  steps:
    - name: apt-get install libseccomp-dev
      shell: bash
      run: |
        set -euo pipefail
        # DEBIAN_FRONTEND goes on the command line through `env`: sudo resets
        # the environment, so a step-level `env:` would never reach apt.
        apt=(sudo env DEBIAN_FRONTEND=noninteractive apt-get
             -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
        "${apt[@]}" update
        "${apt[@]}" install -y libseccomp-dev
