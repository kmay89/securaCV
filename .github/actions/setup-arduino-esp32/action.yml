name: Set up Arduino CLI + ESP32 core (cached)
description: >
  One shared setup path for every Arduino-CLI build job. Installs
  arduino-cli, restores the ESP32 Boards-Manager core from the Actions
  cache (the toolchain is a >1 GB download that used to be re-fetched by
  every job and matrix leg), then installs the requested libraries.
  A profile build (`arduino-cli compile --profile`) installs its own core
  under ~/.arduino15/internal/, which this cache leaves out on purpose:
  firmware.yml's display leg caches that under the profile's own key.
  Change how Arduino builds are provisioned HERE, once — not in six
  workflows.

# The cache is two steps, restore before the install and save right after it,
# never one actions/cache step. A combined step saves in the job's post phase,
# with whatever ~/.arduino15 holds when the job ENDS. The release jobs call
# this action three times (3.3.8, 2.0.17, 3.3.10, each exclusive), so on a
# cold cache all three keys were saved holding the last call's 3.3.10 install,
# and a later single-core job that restored "core-3.3.8" got 3.3.10 under that
# name (RELEASE_LESSONS 2026-11-04 (b)). Now each key is saved straight after
# its own install, only on a miss, and only while ~/.arduino15 holds exactly one
# esp32:esp32 platform, the one this call asked for. An exclusive call clears
# the esp32 packager's tree BEFORE its restore, never after it: the restore
# layers this key's entry over what the previous call left, and `arduino-cli
# core uninstall esp32:esp32` after it removes only the NEWEST version (the
# CLI refuses a version on uninstall and picks the greatest installed one), so
# on a warm row it threw away the core just restored whenever that was the
# newest on the tree — the first release row (3.3.8, alone) and the third
# (3.3.10 over 2.0.17) — and downloaded it again, and the third row also ended
# with two platforms and warned about a mixed tree on every run. The key
# carries a schema tag (v2) so no entry saved the old way is ever restored.
# Edits here run firmware.yml, ram_audit.yml and csi_module_disable_matrix.yml
# (each lists this directory in its path filter); the three-core release case
# shows only in a release run. .github/scripts/test_setup_arduino_esp32.py
# runs these steps' own scripts against a modeled cache and a stand-in
# arduino-cli.

inputs:
  core-version:
    description: >
      esp32:esp32 core version to install (e.g. "3.3.10"). Empty means
      "latest": the cache key then carries the ISO week, so a cached
      "latest" can never go stale for more than a week and the first run
      of each week refreshes it.
    required: false
    default: ""
  exclusive-core:
    description: >
      When "true", clear every esp32:esp32 install (platforms and tools)
      before this call's restore, so the restore lands on a clean tree and
      the install leaves exactly this row's core, and fail if the requested
      version is not the one installed afterwards. Needed whenever ONE job
      installs more than one core version (the canary-display rows: SPI
      panels on core 2.0.17,
      RGB panels on core 3.3.10) — otherwise both versions sit in
      ~/.arduino15 and an unversioned FQBN takes the newest, compiling a
      row against the other line's libraries. Costs a re-download when it
      actually has to switch; correctness beats the cache in a release.
    required: false
    default: "false"
  libraries:
    description: >
      Newline-separated arduino-cli library specs, with optional pins
      ("ArduinoJson" or "lvgl@8.4.0"). Libraries are small and installed
      fresh each run on purpose — keeping them OUT of the cache key lets
      every latest-core job share one toolchain cache entry.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Arduino CLI
      uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0
      with:
        # Pinned to the 1.x line: "latest" crossing a major would change
        # CLI flags under every firmware job at once.
        version: 1.x

    - name: Compute toolchain cache key
      id: key
      shell: bash
      env:
        CORE_VERSION: ${{ inputs.core-version }}
      run: |
        set -euo pipefail
        # v2: entries saved before the restore/save split hold whatever the
        # job installed LAST, under every key it touched; the tag keeps all of
        # them from being restored.
        if [ -n "$CORE_VERSION" ]; then
          echo "key=arduino-esp32-v2-${{ runner.os }}-core-$CORE_VERSION" >> "$GITHUB_OUTPUT"
        else
          # %G/%V = ISO year/week: rotates the "latest" cache weekly.
          echo "key=arduino-esp32-v2-${{ runner.os }}-core-latest-$(date -u +%GW%V)" >> "$GITHUB_OUTPUT"
        fi

    - name: Clear every other core first (exclusive)
      # Before the restore, so a hit is exactly this call's core and a miss
      # downloads it once. (After the restore, `arduino-cli core uninstall
      # esp32:esp32` would remove only the newest version — on a warm row
      # the one just restored — and the CLI refuses a version on uninstall;
      # see the header.) The packager tree holds its platforms and tools;
      # libraries live under ~/Arduino and are installed fresh below.
      if: inputs.exclusive-core == 'true'
      shell: bash
      run: rm -rf "$HOME/.arduino15/packages/esp32"

    - name: Restore the ESP32 core + toolchain
      id: restore
      uses: actions/cache/restore@v6
      with:
        # staging/ holds the downloaded archives — dead weight once the
        # tools are extracted, and it roughly doubles the cache entry.
        # internal/ is where `arduino-cli compile --profile` installs a
        # profile's own pinned core and libraries: the profile's, not this
        # key's core. The save step below names the same three lines.
        path: |
          ~/.arduino15
          !~/.arduino15/staging
          !~/.arduino15/internal
        key: ${{ steps.key.outputs.key }}

    - name: Configure Arduino CLI + install the ESP32 core
      id: install
      shell: bash
      env:
        CORE_VERSION: ${{ inputs.core-version }}
        EXCLUSIVE: ${{ inputs.exclusive-core }}
        KEY: ${{ steps.key.outputs.key }}
      run: |
        set -euo pipefail
        arduino-cli config init --overwrite
        arduino-cli config add board_manager.additional_urls \
          https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
        arduino-cli core update-index
        # An exclusive row's tree was cleared before the restore (the step
        # above): a job that calls this action more than once layers several
        # ~/.arduino15 cache restores into one directory, `core install` is a
        # no-op when the version is already there, and two platform versions
        # side by side make an unversioned FQBN resolve to the NEWEST one
        # (.github/RELEASE_LESSONS.md 2026-07-29 (k)). Nothing is uninstalled
        # here: after the restore that would remove the core just restored.
        # No-op seconds on a warm cache; the full download only on a cold
        # one (new week, new pinned version, cache eviction, or an exclusive
        # row whose key missed).
        arduino-cli core install "esp32:esp32${CORE_VERSION:+@$CORE_VERSION}"
        arduino-cli core list
        # Prove the row got the core it asked for. This assertion belongs in
        # SETUP, where failing loudly is correct — the display compiles
        # downstream are deliberately non-blocking, so a wrong core there
        # would only ever surface as a ::warning:: and a missing product.
        if [ "$EXCLUSIVE" = "true" ] && [ -n "$CORE_VERSION" ]; then
          if ! arduino-cli core list | grep -qE "^esp32:esp32[[:space:]]+${CORE_VERSION//./\\.}([[:space:]]|\$)"; then
            echo "::error::esp32:esp32 ${CORE_VERSION} is not the installed version after an exclusive install — a build here would compile against the wrong core (the library rows split along the core boundary)."
            exit 1
          fi
        fi
        # May this call save ~/.arduino15 under its key? Only when the tree
        # holds exactly one esp32:esp32 platform, the requested one (any one,
        # for "latest"). The one way to a mixed tree is a second call in one
        # job that is NOT exclusive: it installs beside the first call's
        # core, and saving that would store another core's install under
        # this key (an exclusive call cleared the packager tree, platforms
        # and tools, before its restore). Not saving costs the next run a
        # download; a mixed entry would cost it the wrong core.
        installed=()
        shopt -s nullglob
        for d in "$HOME"/.arduino15/packages/esp32/hardware/esp32/*/; do
          d="${d%/}"; installed+=("${d##*/}")
        done
        shopt -u nullglob
        if [ "${#installed[@]}" -eq 1 ] && { [ -z "$CORE_VERSION" ] || [ "${installed[0]}" = "$CORE_VERSION" ]; }; then
          echo "save=true" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::not saving the cache key ${KEY}: ~/.arduino15 holds esp32:esp32 [${installed[*]:-none}], not ${CORE_VERSION:-one latest core} alone — an earlier call in this job installed another core and this call was not exclusive, so it installed beside it; a key stores only its own core's install (pass exclusive-core: \"true\" when one job installs two cores)."
          echo "save=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Save the ESP32 core + toolchain (this call's install, on a miss)
      # Right after the install, not at job end: a later call in the same job
      # (or a later step: a profile build, a library install) cannot change
      # what this key stores. A hit is never re-saved (the entry exists and
      # entries are immutable).
      if: steps.restore.outputs.cache-hit != 'true' && steps.install.outputs.save == 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          ~/.arduino15
          !~/.arduino15/staging
          !~/.arduino15/internal
        key: ${{ steps.key.outputs.key }}

    - name: Install libraries
      if: inputs.libraries != ''
      shell: bash
      env:
        LIBRARIES: ${{ inputs.libraries }}
      run: |
        set -euo pipefail
        while IFS= read -r lib; do
          [ -n "$lib" ] || continue
          arduino-cli lib install "$lib"
        done <<< "$LIBRARIES"
