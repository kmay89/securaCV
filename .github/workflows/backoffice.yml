name: Backoffice

# The business backend (backoffice/): one Node process, one SQLite file, no
# dependencies. The suite needs no network and no credential — fakes stand in
# for SMTP, IMAP, Stripe, GitHub and the probe targets — so a red run is a
# real defect. Doc 20, principle 3: every system ships with its gate.
on:
  push:
    branches: [main]
    paths: ["backoffice/**", ".github/workflows/backoffice.yml"]
  pull_request:
    paths: ["backoffice/**", ".github/workflows/backoffice.yml"]

permissions:
  contents: read

# A test workflow (CI.md R3): PR runs collapse per branch, every main commit
# keeps its own group so a burst of merges can never evict a queued main run.
concurrency:
  group: backoffice-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: node --test (no network, no credentials)
    # the image the suite was written against (CI.md R11); moving is its own change
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run: { working-directory: backoffice }
    steps:
      - uses: actions/checkout@v4
      # the major every other node job runs (CI.md, Node)
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - name: No dependencies, by construction
        run: test "$(node -e 'console.log(Object.keys(require("./package.json").dependencies||{}).length)')" = 0
      - run: npm test
      - name: The CLI boots, sets up an operator and reports a snapshot
        env: { BACKOFFICE_DATA_DIR: /tmp/bo-ci, STORE_JSON: tests/fixtures/store.json }
        run: |
          node --disable-warning=ExperimentalWarning bin/backoffice.mjs setup --password 'ci-only-password-1' | grep -q otpauth
          node --disable-warning=ExperimentalWarning bin/backoffice.mjs snapshot | grep -q '"orders"'
