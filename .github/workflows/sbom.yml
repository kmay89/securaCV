name: SBOM Generation

# The SBOMs only change when a dependency manifest does, so the triggers are
# scoped to those files (plus manual dispatch for an on-demand snapshot). The
# `release: published` trigger is separate: it regenerates the SBOMs against the
# tagged tree and attaches them to the release as downloadable assets, so every
# published version ships its bill of materials instead of it living only in a
# 90-day CI artifact (#924, doc-12 A4 / FR-14).
on:
  push:
    branches: [ "main" ]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'canary-vision/**/package.json'
      - 'canary-vision/package-lock.json'
      - '.github/workflows/sbom.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'canary-vision/**/package.json'
      - 'canary-vision/package-lock.json'
      - '.github/workflows/sbom.yml'
  release:
    types: [ published ]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generate-sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7

    # ---- Rust SBOM ----
    - name: Install cargo-cyclonedx
      run: cargo install cargo-cyclonedx --locked

    - name: Generate Rust SBOM (CycloneDX)
      # cargo-cyclonedx writes <package>.cdx.json next to Cargo.toml; it does
      # not print the BOM on stdout (the previous `>` redirect shipped an
      # empty sbom-rust.cdx.json). The jq gate below would now catch that.
      run: |
        cargo cyclonedx --format json
        mv witness-kernel.cdx.json sbom-rust.cdx.json

    # ---- Node.js SBOM ----
    - uses: actions/setup-node@v7
      with:
        node-version: '20'

    - name: Install Node.js dependencies
      run: cd canary-vision && npm ci

    - name: Install cdxgen
      run: npm install -g @cyclonedx/cdxgen

    - name: Generate Node.js SBOM (CycloneDX)
      run: cdxgen -t node -o sbom-node.cdx.json canary-vision/

    # ---- Firmware (C/C++) SBOM ----
    - name: Generate Firmware SBOM (CycloneDX)
      run: |
        # Unquoted delimiter on purpose: the $(date ...) timestamp below must
        # expand. The document contains no other shell-special characters.
        cat > sbom-firmware.cdx.json << FWEOF
        {
          "bomFormat": "CycloneDX",
          "specVersion": "1.5",
          "serialNumber": "urn:uuid:firmware-sbom",
          "version": 1,
          "metadata": {
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "component": {
              "type": "firmware",
              "name": "securacv-canary-firmware",
              "version": "1.0.0",
              "description": "SecuraCV Canary ESP32-S3 firmware"
            },
            "tools": [
              {
                "name": "manual-sbom-generator",
                "version": "1.0.0"
              }
            ]
          },
          "components": [
            {
              "type": "framework",
              "name": "esp-idf",
              "version": "5.1",
              "description": "Espressif IoT Development Framework",
              "purl": "pkg:github/espressif/esp-idf@v5.1",
              "licenses": [{ "license": { "id": "Apache-2.0" } }]
            },
            {
              "type": "library",
              "name": "freertos",
              "version": "10.5.1",
              "description": "FreeRTOS real-time operating system kernel (ESP-IDF bundled)",
              "purl": "pkg:github/FreeRTOS/FreeRTOS-Kernel@V10.5.1",
              "licenses": [{ "license": { "id": "MIT" } }]
            },
            {
              "type": "library",
              "name": "mbedtls",
              "version": "3.4.1",
              "description": "Mbed TLS cryptographic library (ESP-IDF bundled)",
              "purl": "pkg:github/Mbed-TLS/mbedtls@v3.4.1",
              "licenses": [{ "license": { "id": "Apache-2.0" } }]
            },
            {
              "type": "library",
              "name": "cJSON",
              "version": "1.7.17",
              "description": "Ultralightweight JSON parser (ESP-IDF component)",
              "purl": "pkg:github/DaveGamble/cJSON@v1.7.17",
              "licenses": [{ "license": { "id": "MIT" } }]
            },
            {
              "type": "library",
              "name": "lwip",
              "version": "2.1.3",
              "description": "Lightweight TCP/IP stack (ESP-IDF bundled)",
              "purl": "pkg:github/lwip-tcpip/lwip@STABLE-2_1_3_RELEASE",
              "licenses": [{ "license": { "id": "BSD-3-Clause" } }]
            },
            {
              "type": "library",
              "name": "esp-tls",
              "version": "5.1",
              "description": "ESP-IDF TLS abstraction layer",
              "purl": "pkg:github/espressif/esp-idf@v5.1#components/esp-tls"
            },
            {
              "type": "library",
              "name": "nvs_flash",
              "version": "5.1",
              "description": "ESP-IDF Non-Volatile Storage library",
              "purl": "pkg:github/espressif/esp-idf@v5.1#components/nvs_flash"
            },
            {
              "type": "library",
              "name": "esp_https_ota",
              "version": "5.1",
              "description": "ESP-IDF HTTPS OTA update component",
              "purl": "pkg:github/espressif/esp-idf@v5.1#components/esp_https_ota"
            }
          ]
        }
        FWEOF

    # Fail loudly if any SBOM is empty or malformed instead of silently
    # uploading a broken artifact.
    - name: Validate SBOMs are well-formed CycloneDX
      run: |
        for f in sbom-rust.cdx.json sbom-node.cdx.json sbom-firmware.cdx.json; do
          jq -e '.bomFormat == "CycloneDX"' "$f" > /dev/null \
            || { echo "::error::$f is missing or not a CycloneDX document"; exit 1; }
        done

    # ---- Upload artifacts ----
    # Always keep the 90-day CI artifact (branch/PR visibility). On a release,
    # the attach-to-release job below promotes these same files to permanent
    # release assets.
    - name: Upload SBOM artifacts
      uses: actions/upload-artifact@v7
      with:
        name: sbom-artifacts
        path: |
          sbom-rust.cdx.json
          sbom-node.cdx.json
          sbom-firmware.cdx.json
        retention-days: 90

  # Promote the generated SBOMs to permanent release assets. Split into its own
  # job so the write scope (contents: write, needed to upload release assets) is
  # never granted to the generation job that installs and runs third-party
  # tooling (cargo-cyclonedx, cdxgen) — least privilege for the supply-chain
  # workflow. Runs only for the release event; downloads the artifact the
  # generate-sbom job just produced rather than regenerating.
  attach-to-release:
    needs: generate-sbom
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download generated SBOMs
      uses: actions/download-artifact@v8
      with:
        name: sbom-artifacts
        path: sbom

    - name: Attach SBOMs to the release
      env:
        GH_TOKEN: ${{ github.token }}
      # --clobber so a re-run (or a re-published release) overwrites the
      # existing assets instead of failing on the duplicate name.
      run: |
        gh release upload "${{ github.event.release.tag_name }}" \
          sbom/sbom-rust.cdx.json \
          sbom/sbom-node.cdx.json \
          sbom/sbom-firmware.cdx.json \
          --clobber --repo "${{ github.repository }}"
