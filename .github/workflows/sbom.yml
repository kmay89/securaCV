name: SBOM Generation

# The SBOMs only change when a dependency manifest does, so the triggers are
# scoped to those files (plus manual dispatch for an on-demand snapshot). For
# the firmware that manifest is the COMMITTED sbom/sbom-firmware.cdx.json:
# lint.yml byte-gates it against every build input on every PR, so any input
# that moves (a platform pin, a lib_deps line, a library manifest, an Arduino
# core pin in a workflow or a sketch.yaml profile, the firmware version)
# reaches main only together with a regenerated file, and that file is what
# triggers this run. Attaching is separate: the SBOMs are regenerated against
# the tagged tree and attached to the release as downloadable assets, so every
# published version ships its bill of materials instead of it living only in a
# 90-day CI artifact (#924, doc-12 A4 / FR-14).
#
# THREE WAYS IN, ONE ATTACH. `release: published` fires only for a release a
# HUMAN publishes: GitHub sends no workflow event for one created with the
# GITHUB_TOKEN (its recursion guard), and every release CI cuts is created that
# way — so by 2026-10-09 only 3 of 64 published releases carried their SBOMs
# (app-v0.1.0, flasher-v0.1.4, app-v0.2.2: publishes that sent the event),
# while the README said every release did. The release workflows therefore
# CALL this one (`workflow_call` with the tag, after their publish job — the
# shape lab-publish.yml uses for the updater pointer): firmware-release.yml,
# desktop-flasher-release.yml, lab-publish.yml and the kernel's release.yml
# (test_release_plan.py holds each to it). `workflow_dispatch` with a tag
# backfills a release that predates the call (blank tag: a snapshot, no
# attach) — but only a tag whose OWN tree carries what generate-sbom runs
# (.github/actions/setup-platformio and scripts/gen_firmware_sbom.py with
# --validate, on main since 2026-09-20). The SBOM must describe the tagged
# tree, so it is never built from a newer one: an older tag fails in
# generate-sbom and nothing is attached. Every release that went out without
# SBOMs predates that (the newest: fw-v2.4.15, flasher-v0.11.9, app-v0.2.4),
# so the next release on each train is the first to carry them.
#
# THE DESKTOP APPS' OWN DOCUMENTS. Until 2026-11-04 a Flasher or Lab release
# carried only the three above (the kernel's crates, canary-vision's npm
# packages, the firmware), none of which names a crate or npm package the app
# ships (sweep CI20). Now each app gets two more: sbom-<app>-rust.cdx.json
# (cargo-cyclonedx --target all in <dir>/src-tauri: the app's crate graph for
# every target it is built for, its path-linked crates included — the
# lockfile, not this Linux runner's own resolution) and
# sbom-<app>-node.cdx.json (cdxgen on <dir>/ after
# `npm ci`: the npm tree its lockfile installs, which today is the Tauri CLI
# that builds it). `app` picks them: flasher (desktop/) or lab (desktop-lab/).
# The two app publishers pass theirs; a tag with an app's prefix (a human
# publish's release event, a backfill dispatch) implies it; a run with no tag
# (a PR, a main push, a snapshot) builds both, so a PR proves both steps; any
# other tag builds neither. DESKTOP_APPS below is the one table of names,
# directories and prefixes, and test_release_plan.py holds it to
# .github/release-targets.yml.
on:
  push:
    branches: [ "main" ]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'canary-vision/**/package.json'
      - 'canary-vision/package-lock.json'
      - 'sbom/**'
      - 'scripts/gen_firmware_sbom.py'
      - '.github/workflows/sbom.yml'
      # The desktop apps' documents read each app's npm manifest and lockfile
      # and its crate graph (src-tauri plus the path-linked crates).
      - 'desktop/package.json'
      - 'desktop/package-lock.json'
      - 'desktop-lab/package.json'
      - 'desktop-lab/package-lock.json'
      - 'desktop/**/Cargo.toml'
      - 'desktop/**/Cargo.lock'
      - 'desktop-lab/**/Cargo.toml'
      - 'desktop-lab/**/Cargo.lock'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'canary-vision/**/package.json'
      - 'canary-vision/package-lock.json'
      - 'sbom/**'
      - 'scripts/gen_firmware_sbom.py'
      - '.github/workflows/sbom.yml'
      # The desktop apps' documents read each app's npm manifest and lockfile
      # and its crate graph (src-tauri plus the path-linked crates).
      - 'desktop/package.json'
      - 'desktop/package-lock.json'
      - 'desktop-lab/package.json'
      - 'desktop-lab/package-lock.json'
      - 'desktop/**/Cargo.toml'
      - 'desktop/**/Cargo.lock'
      - 'desktop-lab/**/Cargo.toml'
      - 'desktop-lab/**/Cargo.lock'
  release:
    types: [ published ]
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build the SBOMs from and attach them to"
        type: string
        required: true
      app:
        description: "The desktop app this release ships, flasher or lab, whose own two documents join the three; blank = the app the tag's prefix names, if any"
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build the SBOMs from and attach them to; its tree must carry gen_firmware_sbom.py --validate (2026-09-20 on). Blank = snapshot of this ref, no attach"
        type: string
        required: false
        default: ""
      app:
        description: "flasher or lab: that desktop app's own documents too. Blank = the app the tag's prefix names (none for other tags); with no tag, both"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # PRs collapse per branch; each main commit gets its own group, so a burst
  # of merges can never evict the main run queued behind another (CI.md R3).
  # A tagged run adds its tag: two releases cut from one commit (the firmware
  # and a Flasher, say) attach in parallel instead of evicting each other.
  group: sbom-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}${{ inputs.tag && format('-{0}', inputs.tag) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generate-sbom:
    runs-on: ubuntu-24.04  # pinned ahead of the 26.04 image move; revisit before 24.04 retires
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      # Every document the gate below passed, for attach-to-release.
      files: ${{ steps.gate.outputs.files }}
    env:
      # The desktop apps: <app>:<directory>:<release tag prefix>. One table,
      # read by every step below; test_release_plan.py holds each row to
      # .github/release-targets.yml (the target's name, a watch entry, its
      # tag_prefix).
      DESKTOP_APPS: "flasher:desktop:flasher-v lab:desktop-lab:app-v"
      # The two tools that write the Rust and Node documents, each pinned to
      # an exact release: the newest that was at least two weeks old when it
      # was set. The install lines and the binary's cache key read these, so
      # a bump is an edit here plus the tool's row in sbom/README.md;
      # scripts/tests/test_gen_firmware_sbom.py holds every install line, the
      # key and that row to them.
      CARGO_CYCLONEDX_VERSION: "0.5.9"
      CDXGEN_VERSION: "12.9.0"

    steps:
    - uses: actions/checkout@v7
      with:
        # A tagged run (called by a release workflow, or dispatched to
        # backfill) builds the bill of materials from the TAGGED tree, not
        # from whatever the calling branch has moved on to. Untagged, the
        # empty ref is checkout's own default: the event's exact commit.
        ref: ${{ inputs.tag || '' }}

    # Python + PlatformIO, right after checkout (CI.md R9): the firmware SBOM
    # generator runs on this interpreter, and `pio project config` is the
    # oracle its ini resolver is proven against below. No cache: nothing here
    # compiles, so nothing is downloaded into ~/.platformio.
    - name: Set up Python + PlatformIO (resolver oracle)
      uses: ./.github/actions/setup-platformio
    - name: Install the generator's YAML reader and schema validator
      # The Arduino-CLI core pins the SBOM lists live in workflow YAML and in
      # the sketch.yaml profiles. cyclonedx-python-lib is the strict
      # CycloneDX 1.5 validator the validate step below runs on the artifact
      # — the same exact pin lint.yml runs on the committed copy. The
      # json-validation extra is what brings the format checkers (an IRI
      # with a space passes without it), and a bump is a reviewed change to
      # what "valid" means, so it never floats.
      run: python3 -m pip install --quiet pyyaml 'cyclonedx-python-lib[json-validation]==11.12.0'

    - name: Which desktop apps this run describes
      id: apps
      env:
        APP: ${{ inputs.app }}
        TAG: ${{ inputs.tag || github.event.release.tag_name }}
      run: |
        set -euo pipefail
        dir_of() { local row; for row in $DESKTOP_APPS; do [ "${row%%:*}" = "$1" ] && { row="${row#*:}"; echo "${row%%:*}"; return; }; done; }
        tag_app=""
        for row in $DESKTOP_APPS; do
          prefix="${row##*:}"
          case "$TAG" in "$prefix"*) tag_app="${row%%:*}" ;; esac
        done
        if [ -n "$APP" ]; then
          if [ -z "$(dir_of "$APP")" ]; then
            names=""; for row in $DESKTOP_APPS; do names="$names ${row%%:*}"; done
            echo "::error::app '$APP' is not one of:${names}"
            exit 1
          fi
          # An app's documents describe its own tree; attached to another
          # train's release they would be a false record.
          if [ -n "$TAG" ] && [ "$tag_app" != "$APP" ]; then
            echo "::error::app '$APP' was asked for, but the tag '$TAG' belongs to: ${tag_app:-no desktop app}"
            exit 1
          fi
          apps="$APP"
        elif [ -n "$TAG" ]; then
          apps="$tag_app"
        else
          apps=""
          for row in $DESKTOP_APPS; do apps="$apps ${row%%:*}"; done
        fi
        list=""
        for a in $apps; do list="$list $a:$(dir_of "$a")"; done
        list="${list# }"
        echo "list=${list}" >> "$GITHUB_OUTPUT"
        echo "desktop apps described by this run: ${list:-none}"

    # ---- Rust SBOM ----
    # Compiling cargo-cyclonedx from source cost ~5-10 min of every run, so
    # the built binary is cached under the version it was built at. A pinned
    # version cannot go stale, so the key needs no weekly rotation: one build
    # per bump, and the CARGO_CYCLONEDX_VERSION edit is what moves the key.
    # `--version` with a bare x.y.z installs exactly that release, and
    # --locked builds it from the lockfile the crate was published with.
    - name: Cache the cargo-cyclonedx binary
      id: tool
      uses: actions/cache@v6
      with:
        path: ~/.cargo/bin/cargo-cyclonedx
        key: cargo-cyclonedx-${{ runner.os }}-${{ env.CARGO_CYCLONEDX_VERSION }}
    - name: Install cargo-cyclonedx
      if: steps.tool.outputs.cache-hit != 'true'
      run: cargo install cargo-cyclonedx --version "$CARGO_CYCLONEDX_VERSION" --locked

    - name: Generate Rust SBOM (CycloneDX)
      # cargo-cyclonedx writes <package>.cdx.json next to Cargo.toml; it does
      # not print the BOM on stdout (the previous `>` redirect shipped an
      # empty sbom-rust.cdx.json). The jq gate below would now catch that.
      run: |
        cargo cyclonedx --format json
        mv witness-kernel.cdx.json sbom-rust.cdx.json

    - name: Generate each desktop app's Rust SBOM (CycloneDX)
      if: steps.apps.outputs.list != ''
      # Each app is its own Cargo workspace (src-tauri), so cargo-cyclonedx
      # runs there and writes <package>.cdx.json beside its Cargo.toml. It
      # resolves through `cargo metadata`, which rewrites a Cargo.lock that
      # no longer matches its Cargo.toml: the diff check refuses a document
      # that would describe a resolution the release did not build.
      # `--target all`: without it cargo-cyclonedx resolves for the HOST
      # target, and this job runs on Linux — the Flasher's document built
      # that way held 450 of its lockfile's 604 crates and none of the
      # macOS-only ones the universal .dmg links (security-framework,
      # core-foundation, objc2, the keyring backend Cargo.toml adds on
      # macOS). With it the document is every target's dependencies, which
      # is the lockfile (604 and 560 components when built on 2026-11-04).
      env:
        APPS: ${{ steps.apps.outputs.list }}
      run: |
        set -euo pipefail
        for row in $APPS; do
          app="${row%%:*}"; dir="${row#*:}"
          (cd "$dir/src-tauri" && cargo cyclonedx --format json --target all)
          git diff --exit-code -- "$dir/src-tauri/Cargo.lock" \
            || { echo "::error::$dir/src-tauri/Cargo.lock is stale against its Cargo.toml; the SBOM would not describe what the release built"; exit 1; }
          crate="$(cargo metadata --no-deps --format-version 1 --manifest-path "$dir/src-tauri/Cargo.toml" \
            | jq -r --arg m "$PWD/$dir/src-tauri/Cargo.toml" '.packages[] | select(.manifest_path == $m) | .name')"
          mv "$dir/src-tauri/$crate.cdx.json" "sbom-$app-rust.cdx.json"
          echo "$crate" > "sbom-$app-rust.crate"
        done

    # ---- Node.js SBOM ----
    - uses: actions/setup-node@v7
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: |
          canary-vision/package-lock.json
          desktop/package-lock.json
          desktop-lab/package-lock.json

    - name: Install Node.js dependencies
      run: cd canary-vision && npm ci

    - name: Install cdxgen
      # The pin fixes cdxgen's own version (and its direct dependencies, which
      # its package.json names exactly), not its whole tree: cdxgen publishes
      # no npm-shrinkwrap.json, and a global install has no lockfile of ours,
      # so the ranges inside those dependencies resolve at install time.
      run: npm install -g "@cyclonedx/cdxgen@$CDXGEN_VERSION"

    - name: Generate Node.js SBOM (CycloneDX)
      run: cdxgen -t node -o sbom-node.cdx.json canary-vision/

    - name: Generate each desktop app's Node.js SBOM (CycloneDX)
      if: steps.apps.outputs.list != ''
      # `npm ci` from the committed lockfile, the install the release runs.
      # --ignore-scripts: a bill of materials needs the tree, not anything a
      # package's install script would build.
      env:
        APPS: ${{ steps.apps.outputs.list }}
      run: |
        set -euo pipefail
        for row in $APPS; do
          app="${row%%:*}"; dir="${row#*:}"
          (cd "$dir" && npm ci --ignore-scripts)
          cdxgen -t node -o "sbom-$app-node.cdx.json" "$dir/"
        done

    # ---- Firmware (C/C++) SBOM ----
    # Derived, not typed. This step used to write the document from a heredoc
    # naming Arduino-ESP32 2.0.17 / ESP-IDF 4.4.7 with a hand-picked list of
    # IDF components — while the shipped canary-display and canary-wap images
    # had moved to the pioarduino core 3.3.8 / ESP-IDF 5.5.4 and nothing in
    # the template knew. scripts/gen_firmware_sbom.py now reads flavors.json,
    # the resolved PlatformIO config of every build env, platforms.ini, the
    # first-party library manifests, the workflows' Arduino core pins and
    # the sketch.yaml profiles — and refuses a tree where those two Arduino
    # axes disagree (sbom/README.md says what is derived and what is still
    # declared).
    #
    # Three passes: prove the ini resolver against PlatformIO's own reading of
    # every env; prove the committed copy matches this tree (on a release
    # event that is the tagged tree — a stale SBOM must fail the attach, not
    # ship); then write the artifact copy, which is the committed document
    # plus a generation timestamp (the one non-deterministic field, and only
    # ever in the artifact).
    - name: Generate Firmware SBOM (CycloneDX, derived from the build inputs)
      run: |
        set -euo pipefail
        python3 scripts/gen_firmware_sbom.py --verify-with-pio --check
        python3 scripts/gen_firmware_sbom.py --out sbom-firmware.cdx.json --timestamp now

    # Fail loudly if any SBOM is empty or malformed instead of silently
    # uploading a broken artifact.
    - name: Validate SBOMs are well-formed CycloneDX
      id: gate
      env:
        APPS: ${{ steps.apps.outputs.list }}
      run: |
        set -euo pipefail
        files="sbom-rust.cdx.json sbom-node.cdx.json sbom-firmware.cdx.json"
        for f in $files; do
          jq -e '.bomFormat == "CycloneDX"' "$f" > /dev/null \
            || { echo "::error::$f is missing or not a CycloneDX document"; exit 1; }
        done
        # Each desktop app's two documents must describe THAT app: its own
        # crate or npm package as the subject, a non-empty component list,
        # and the framework it is built with in it (the tauri crate; the
        # @tauri-apps/cli package its lockfile installs). An empty document,
        # or the kernel's under an app's name, fails here.
        for row in $APPS; do
          app="${row%%:*}"; dir="${row#*:}"
          crate="$(cat "sbom-$app-rust.crate")"
          pkg="$(jq -r .name "$dir/package.json")"
          jq -e --arg subject "$crate" '.bomFormat == "CycloneDX" and (.components | length) > 0
                 and .metadata.component.name == $subject
                 and any(.components[]; .name == "tauri")' \
            "sbom-$app-rust.cdx.json" > /dev/null \
            || { echo "::error::sbom-$app-rust.cdx.json is missing, empty, or not $crate's crate graph"; exit 1; }
          jq -e --arg subject "$pkg" '.bomFormat == "CycloneDX" and (.components | length) > 0
                 and .metadata.component.name == $subject
                 and any(.components[]; .group == "@tauri-apps" and .name == "cli")' \
            "sbom-$app-node.cdx.json" > /dev/null \
            || { echo "::error::sbom-$app-node.cdx.json is missing, empty, or not $pkg's npm tree"; exit 1; }
          files="$files sbom-$app-rust.cdx.json sbom-$app-node.cdx.json"
        done
        echo "files=$files" >> "$GITHUB_OUTPUT"
        # The firmware document is ours end to end, so hold it to more than
        # the format tag. First the CycloneDX 1.5 JSON schema in strict mode,
        # on THIS file — the timestamped bytes that upload, not a re-render —
        # through the validator lint.yml runs on the committed copy; the
        # generator asserts the file's specVersion itself, because the 1.5
        # schema types that field as a free string. The Rust and Node
        # documents are not held to it: cargo-cyclonedx and cdxgen choose
        # their own specVersion.
        python3 scripts/gen_firmware_sbom.py --validate sbom-firmware.cdx.json
        # Then what a schema cannot say: a non-empty component list and a
        # closed dependency graph (a dependsOn naming a bom-ref that is not
        # there is schema-valid) — with the spec version restated in jq, a
        # second reading a reader without the Python validator can repeat.
        jq -e '.specVersion == "1.5" and (.components | length) > 0
               and ([.dependencies[].dependsOn[]] - ([.components[]."bom-ref"] + [.metadata.component."bom-ref"]) | length) == 0' \
          sbom-firmware.cdx.json > /dev/null \
          || { echo "::error::sbom-firmware.cdx.json is not the document gen_firmware_sbom.py promises"; exit 1; }

    # ---- Upload artifacts ----
    # Always keep the 90-day CI artifact (branch/PR visibility). On a release,
    # the attach-to-release job below promotes these same files to permanent
    # release assets.
    - name: Upload SBOM artifacts
      uses: actions/upload-artifact@v7
      with:
        name: sbom-artifacts
        path: |
          sbom-rust.cdx.json
          sbom-node.cdx.json
          sbom-firmware.cdx.json
          sbom-flasher-rust.cdx.json
          sbom-flasher-node.cdx.json
          sbom-lab-rust.cdx.json
          sbom-lab-node.cdx.json
        retention-days: 90

  # Promote the generated SBOMs to permanent release assets. Split into its own
  # job so the write scope (contents: write, needed to upload release assets) is
  # never granted to the generation job that installs and runs third-party
  # tooling (cargo-cyclonedx, cdxgen) — least privilege for the supply-chain
  # workflow. Runs for a release event or a tagged run (a release workflow's
  # call, or a backfill dispatch); downloads the artifact the generate-sbom job
  # just produced rather than regenerating.
  attach-to-release:
    needs: generate-sbom
    if: github.event_name == 'release' || inputs.tag
    runs-on: ubuntu-24.04  # pinned ahead of the 26.04 image move; revisit before 24.04 retires
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
    - name: Download generated SBOMs
      uses: actions/download-artifact@v8
      with:
        name: sbom-artifacts
        path: sbom

    - name: Attach SBOMs to the release
      env:
        GH_TOKEN: ${{ github.token }}
        # A release tag can legally contain `$`, backticks, `(`, `;` — so it goes
        # through the environment and is referenced as "$TAG", never interpolated
        # into the script body where the shell would evaluate it. This is the
        # repo's own anti-injection rule (idea-intake.yml); every other run block
        # follows it.
        TAG: ${{ inputs.tag || github.event.release.tag_name }}
        REPO: ${{ github.repository }}
        # Exactly the documents generate-sbom's gate passed: the three, plus
        # the app's two on a Flasher or Lab release.
        FILES: ${{ needs.generate-sbom.outputs.files }}
      # --clobber so a re-run (or a re-published release) overwrites the
      # existing assets instead of failing on the duplicate name.
      run: |
        set -euo pipefail
        paths=()
        for f in $FILES; do
          [ -f "sbom/$f" ] || { echo "::error::$f passed the gate but is not in the artifact"; exit 1; }
          paths+=("sbom/$f")
        done
        [ "${#paths[@]}" -ge 3 ] || { echo "::error::generate-sbom passed fewer than the three documents: '$FILES'"; exit 1; }
        gh release upload "$TAG" "${paths[@]}" --clobber --repo "$REPO"
