name: SBOM Generation

# The SBOMs only change when a dependency manifest does, so the triggers are
# scoped to those files (plus manual dispatch for an on-demand snapshot). The
# `release: published` trigger is separate: it regenerates the SBOMs against the
# tagged tree and attaches them to the release as downloadable assets, so every
# published version ships its bill of materials instead of it living only in a
# 90-day CI artifact (#924, doc-12 A4 / FR-14).
on:
  push:
    branches: [ "main" ]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'canary-vision/**/package.json'
      - 'canary-vision/package-lock.json'
      - '.github/workflows/sbom.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'canary-vision/**/package.json'
      - 'canary-vision/package-lock.json'
      - '.github/workflows/sbom.yml'
  release:
    types: [ published ]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # PRs collapse per branch; each main commit gets its own group, so a burst
  # of merges can never evict the main run queued behind another (CI.md R3).
  group: sbom-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generate-sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7

    # ---- Rust SBOM ----
    # Compiling cargo-cyclonedx from source cost ~5-10 min of every run.
    # Cache the built binary under a weekly key: at most one build per
    # week, and "latest" can never go stale longer than that.
    - name: Weekly tool-cache stamp
      id: week
      run: echo "stamp=$(date -u +%GW%V)" >> "$GITHUB_OUTPUT"
    - name: Cache the cargo-cyclonedx binary
      id: tool
      uses: actions/cache@v6
      with:
        path: ~/.cargo/bin/cargo-cyclonedx
        key: cargo-cyclonedx-${{ runner.os }}-${{ steps.week.outputs.stamp }}
    - name: Install cargo-cyclonedx
      if: steps.tool.outputs.cache-hit != 'true'
      run: cargo install cargo-cyclonedx --locked

    - name: Generate Rust SBOM (CycloneDX)
      # cargo-cyclonedx writes <package>.cdx.json next to Cargo.toml; it does
      # not print the BOM on stdout (the previous `>` redirect shipped an
      # empty sbom-rust.cdx.json). The jq gate below would now catch that.
      run: |
        cargo cyclonedx --format json
        mv witness-kernel.cdx.json sbom-rust.cdx.json

    # ---- Node.js SBOM ----
    - uses: actions/setup-node@v7
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: canary-vision/package-lock.json

    - name: Install Node.js dependencies
      run: cd canary-vision && npm ci

    - name: Install cdxgen
      run: npm install -g @cyclonedx/cdxgen

    - name: Generate Node.js SBOM (CycloneDX)
      run: cdxgen -t node -o sbom-node.cdx.json canary-vision/

    # ---- Firmware (C/C++) SBOM ----
    - name: Generate Firmware SBOM (CycloneDX)
      run: |
        set -euo pipefail
        # Derive the firmware version from source rather than hardcoding it — a
        # stale literal (this shipped as "1.0.0") is a false compliance record on
        # every release. FIRMWARE_VERSION is the single source of truth.
        FW_VERSION=$(grep -oE '#define[[:space:]]+FIRMWARE_VERSION[[:space:]]+"[^"]+"' \
          firmware/canary/include/canary_config.h | grep -oE '"[^"]+"' | tr -d '"')
        [ -n "$FW_VERSION" ] || { echo "::error::could not read FIRMWARE_VERSION from firmware/canary/include/canary_config.h"; exit 1; }
        echo "firmware version: $FW_VERSION"
        # The dev/release images build framework=arduino on the OFFICIAL
        # espressif32 platform, which packages Arduino-ESP32 core 2.0.17 /
        # ESP-IDF 4.4.7 (firmware/canary/platformio.ini) — NOT bare esp-idf 5.1.
        # Unquoted delimiter on purpose: $(date ...) and ${FW_VERSION} below must
        # expand. Both values are shell-safe (a timestamp and a semver from a
        # trusted in-repo header), so there is nothing to inject.
        cat > sbom-firmware.cdx.json << FWEOF
        {
          "bomFormat": "CycloneDX",
          "specVersion": "1.5",
          "serialNumber": "urn:uuid:firmware-sbom",
          "version": 1,
          "metadata": {
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "component": {
              "type": "firmware",
              "name": "securacv-canary-firmware",
              "version": "${FW_VERSION}",
              "description": "SecuraCV Canary ESP32-S3 firmware (dev/release image: Arduino-ESP32 core on the official espressif32 platform)"
            },
            "tools": [
              {
                "name": "manual-sbom-generator",
                "version": "1.0.0"
              }
            ]
          },
          "components": [
            {
              "type": "framework",
              "name": "arduino-esp32",
              "version": "2.0.17",
              "description": "Arduino-ESP32 core (framework=arduino on the official espressif32 platform); bundles ESP-IDF 4.4.7",
              "purl": "pkg:github/espressif/arduino-esp32@2.0.17",
              "licenses": [{ "license": { "id": "LGPL-2.1-or-later" } }]
            },
            {
              "type": "framework",
              "name": "esp-idf",
              "version": "4.4.7",
              "description": "Espressif IoT Development Framework (bundled by the Arduino-ESP32 core)",
              "purl": "pkg:github/espressif/esp-idf@v4.4.7",
              "licenses": [{ "license": { "id": "Apache-2.0" } }]
            },
            {
              "type": "library",
              "name": "freertos",
              "version": "10.4.3",
              "description": "FreeRTOS real-time operating system kernel (bundled with ESP-IDF 4.4.7)",
              "purl": "pkg:github/FreeRTOS/FreeRTOS-Kernel@V10.4.3",
              "licenses": [{ "license": { "id": "MIT" } }]
            },
            {
              "type": "library",
              "name": "mbedtls",
              "version": "2.28.3",
              "description": "Mbed TLS cryptographic library (bundled with ESP-IDF 4.4.7, 2.28 LTS line)",
              "purl": "pkg:github/Mbed-TLS/mbedtls@mbedtls-2.28.3",
              "licenses": [{ "license": { "id": "Apache-2.0" } }]
            },
            {
              "type": "library",
              "name": "cJSON",
              "version": "1.7.15",
              "description": "Ultralightweight JSON parser (bundled with ESP-IDF 4.4.7)",
              "purl": "pkg:github/DaveGamble/cJSON@v1.7.15",
              "licenses": [{ "license": { "id": "MIT" } }]
            },
            {
              "type": "library",
              "name": "lwip",
              "version": "2.1.2",
              "description": "Lightweight TCP/IP stack (bundled with ESP-IDF 4.4.7)",
              "purl": "pkg:github/lwip-tcpip/lwip@STABLE-2_1_2_RELEASE",
              "licenses": [{ "license": { "id": "BSD-3-Clause" } }]
            },
            {
              "type": "library",
              "name": "esp-tls",
              "version": "4.4.7",
              "description": "ESP-IDF TLS abstraction layer",
              "purl": "pkg:github/espressif/esp-idf@v4.4.7#components/esp-tls"
            },
            {
              "type": "library",
              "name": "nvs_flash",
              "version": "4.4.7",
              "description": "ESP-IDF Non-Volatile Storage library",
              "purl": "pkg:github/espressif/esp-idf@v4.4.7#components/nvs_flash"
            },
            {
              "type": "library",
              "name": "esp_https_ota",
              "version": "4.4.7",
              "description": "ESP-IDF HTTPS OTA update component",
              "purl": "pkg:github/espressif/esp-idf@v4.4.7#components/esp_https_ota"
            }
          ]
        }
        FWEOF

    # Fail loudly if any SBOM is empty or malformed instead of silently
    # uploading a broken artifact.
    - name: Validate SBOMs are well-formed CycloneDX
      run: |
        for f in sbom-rust.cdx.json sbom-node.cdx.json sbom-firmware.cdx.json; do
          jq -e '.bomFormat == "CycloneDX"' "$f" > /dev/null \
            || { echo "::error::$f is missing or not a CycloneDX document"; exit 1; }
        done

    # ---- Upload artifacts ----
    # Always keep the 90-day CI artifact (branch/PR visibility). On a release,
    # the attach-to-release job below promotes these same files to permanent
    # release assets.
    - name: Upload SBOM artifacts
      uses: actions/upload-artifact@v7
      with:
        name: sbom-artifacts
        path: |
          sbom-rust.cdx.json
          sbom-node.cdx.json
          sbom-firmware.cdx.json
        retention-days: 90

  # Promote the generated SBOMs to permanent release assets. Split into its own
  # job so the write scope (contents: write, needed to upload release assets) is
  # never granted to the generation job that installs and runs third-party
  # tooling (cargo-cyclonedx, cdxgen) — least privilege for the supply-chain
  # workflow. Runs only for the release event; downloads the artifact the
  # generate-sbom job just produced rather than regenerating.
  attach-to-release:
    needs: generate-sbom
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
    - name: Download generated SBOMs
      uses: actions/download-artifact@v8
      with:
        name: sbom-artifacts
        path: sbom

    - name: Attach SBOMs to the release
      env:
        GH_TOKEN: ${{ github.token }}
        # A release tag can legally contain `$`, backticks, `(`, `;` — so it goes
        # through the environment and is referenced as "$TAG", never interpolated
        # into the script body where the shell would evaluate it. This is the
        # repo's own anti-injection rule (idea-intake.yml); every other run block
        # follows it.
        TAG: ${{ github.event.release.tag_name }}
        REPO: ${{ github.repository }}
      # --clobber so a re-run (or a re-published release) overwrites the
      # existing assets instead of failing on the duplicate name.
      run: |
        gh release upload "$TAG" \
          sbom/sbom-rust.cdx.json \
          sbom/sbom-node.cdx.json \
          sbom/sbom-firmware.cdx.json \
          --clobber --repo "$REPO"
