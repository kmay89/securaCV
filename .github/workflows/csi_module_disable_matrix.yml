name: CSI Module Disable Matrix

# Closes the plan's verification promise: "Disabling any single module
# via build flag still produces a working firmware." Each matrix slot
# builds canary-wap with one CSI module disabled via a -DCSI_DISABLE_MODULE_*
# preprocessor flag. The corresponding csi_module_register() call in
# csi_integration.cpp's register_v1_modules() is wrapped in a matching
# #ifndef guard, so the slot's build links cleanly even though that
# module is absent. Any drift — for example, a future module that other
# modules implicitly depend on — fails the slot, surfacing the implicit
# coupling before it ships.

on:
  push:
    branches: [main]
    paths:
      - 'firmware/projects/canary-wap/**'
      - 'firmware/common/csi/**'
      - '.github/workflows/csi_module_disable_matrix.yml'
  pull_request:
    branches: [main]
    paths:
      - 'firmware/projects/canary-wap/**'
      - 'firmware/common/csi/**'
      - '.github/workflows/csi_module_disable_matrix.yml'

concurrency:
  # PRs collapse per branch; each main commit gets its own group, so a burst
  # of merges can never evict the main run queued behind another (CI.md R3).
  group: csi-module-disable-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  # Cancel superseded PR runs only; pushes to main keep full signal
  # (same conditional-cancel pattern as rust.yml).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Minimal token scope. The matrix only checks out the repo and runs
# Arduino CLI builds — it never writes back to GitHub, comments on PRs,
# or pushes packages. CodeQL flagged the missing block as a default-
# permissions hazard; this is the recommended fix.
permissions:
  contents: read

jobs:
  build-with-module-disabled:
    name: Build with ${{ matrix.module }} disabled
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: core_presence
            flag: CSI_DISABLE_MODULE_CORE_PRESENCE
          - module: core_breathing
            flag: CSI_DISABLE_MODULE_CORE_BREATHING
          - module: core_activity_ribbon
            flag: CSI_DISABLE_MODULE_CORE_ACTIVITY_RIBBON
          - module: meta_daily_summary
            flag: CSI_DISABLE_MODULE_META_DAILY_SUMMARY
          - module: anomaly_baseline
            flag: CSI_DISABLE_MODULE_ANOMALY_BASELINE
    steps:
      - uses: actions/checkout@v7

      - name: Install Arduino CLI + ESP32 core (cached)
        # All five matrix legs share ONE toolchain cache entry with the
        # main firmware.yml Arduino jobs — this used to be five separate
        # >1 GB toolchain downloads per run.
        uses: ./.github/actions/setup-arduino-esp32
        with:
          libraries: |
            Crypto
            ArduinoJson

      - name: Compile with ${{ matrix.module }} disabled
        run: |
          # Same invocation as the main Arduino CLI Build job, plus the
          # -D flag that drops one csi_module_register() call. Build
          # success means the remaining modules don't depend on the
          # disabled one's registration.
          # PSRAM=opi + explicit -DBOARD_HAS_PSRAM: FULL/S3 requires PSRAM
          # (build_config.h #errors without it), and overriding
          # build.extra_flags drops the board expansion that carries the
          # define. Mirrors the main Arduino CLI Build job.
          arduino-cli compile \
            --fqbn esp32:esp32:XIAO_ESP32S3:PSRAM=opi \
            --libraries firmware/common \
            --build-property "build.extra_flags=-DVALIDATION_BUILD=1 -D${{ matrix.flag }}=1 -DBOARD_HAS_PSRAM" \
            firmware/projects/canary-wap/arduino/canary_wap/canary_wap.ino
