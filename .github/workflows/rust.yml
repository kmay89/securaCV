name: Rust

# Path-scoped to what the cargo jobs actually consume, so docs/firmware/HA
# changes don't spin up six Rust builds. If a job below grows a new input
# (fixtures, scripts, configs the tests read), add it here too.
on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'config.example.toml'
      - 'adapter_host.example.toml'
      - 'integrations/ha_frigate_mqtt/**'
      - 'docs/witness-kernel.html'
      - 'tools/gen_kernel_status.py'
      - '.github/workflows/rust.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'config.example.toml'
      - 'adapter_host.example.toml'
      - 'integrations/ha_frigate_mqtt/**'
      - 'docs/witness-kernel.html'
      - 'tools/gen_kernel_status.py'
      - '.github/workflows/rust.yml'

env:
  CARGO_TERM_COLOR: always

# Supersede stale runs: a new push to a PR branch cancels the in-flight run
# for the previous head, so review-fix pushes don't queue duplicate full
# builds. Pushes to main are never canceled (full signal per main commit).
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# These jobs only read the repo; no write scopes needed.
permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
    - uses: actions/checkout@v7
    # Cache cargo registry + target dir, keyed per job. Cuts re-runs (e.g.
    # after a review-fix push) from full rebuilds to incremental ones.
    - uses: Swatinem/rust-cache@v2
    - name: Install libseccomp
      run: sudo apt-get update && sudo apt-get install -y libseccomp-dev
    - name: Rustfmt
      run: cargo fmt --check
    - name: Clippy
      run: cargo clippy --all-targets -- -D warnings
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Build with no default features
      run: cargo check --no-default-features
    - name: Build with PQC features
      # clippy -D warnings (not bare check): this is the only job compiling the
      # pqc-tls combination, so a plain check left its warnings unenforceable.
      run: cargo clippy --all-targets --features pqc-signatures,pqc-vault,pqc-tls -- -D warnings
    - name: Test with PQC features
      run: cargo test --features pqc-signatures,pqc-vault
    # c2pa-export tests actually execute here (not just compile-gate): the
    # sidecar sign/verify round-trip and tamper rejection are security
    # behavior, same rationale as the adapter job.
    - name: Test with C2PA export feature
      run: cargo test --features c2pa-export

  conformance:
    name: Chain conformance (fixture DB round-trip through log_verify)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    - uses: Swatinem/rust-cache@v2
    - name: Install libseccomp
      run: sudo apt-get update && sudo apt-get install -y libseccomp-dev
    # scripts/ci/conformance.sh existed but no workflow ran it — the one
    # end-to-end gate that generates a sealed-log fixture DB and drives the
    # shipping verifier binary over it (plus the compile-fail suite that
    # pins the privacy invariants at the type level). An orphaned
    # conformance gate protects nothing.
    - name: Conformance fixture -> log_verify
      run: bash scripts/ci/conformance.sh

  adapters:
    name: Adapters (behavioral tests, all features)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    - uses: Swatinem/rust-cache@v2
    - name: Install libseccomp
      run: sudo apt-get update && sudo apt-get install -y libseccomp-dev
    # The adapter surface is the kernel's primary untrusted-input boundary
    # (docs/strategy/12, finding A1). Every adapter feature is off by default,
    # so without this job their tests — including the security-critical
    # adapter_cannot_bypass_enforcer suite and the parser fuzz-lite — compile
    # under the clippy-only optional-features job but never execute.
    - name: Test with all adapter features
      run: cargo test --verbose --features adapter-frigate,adapter-mqtt-sensor,adapter-webhook,adapter-webhook-tls,adapter-ble-presence,adapter-meshtastic,adapter-can-bus,adapter-sandbox

  ingest-ffmpeg:
    name: Ingest (ffmpeg file decode)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    # Cache cargo registry + target dir, keyed per job. Cuts re-runs (e.g.
    # after a review-fix push) from full rebuilds to incremental ones.
    - uses: Swatinem/rust-cache@v2
    - name: Install ffmpeg + libav dev libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libseccomp-dev \
          libavutil-dev libavformat-dev libavcodec-dev libavfilter-dev \
          libavdevice-dev libswscale-dev libswresample-dev
    - name: Clippy (ingest-file-ffmpeg)
      run: cargo clippy --features ingest-file-ffmpeg --bin ingest_run -- -D warnings
    - name: Build ingest_run
      run: cargo build --features ingest-file-ffmpeg --bin ingest_run
    - name: Test file ingestion (decodes the committed mp4 fixture)
      run: cargo test --features ingest-file-ffmpeg --bin ingest_run

  ingest-rtsp:
    name: Ingest (rtsp end-to-end)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Pinned MediaMTX (RTSP server) used to serve the fixture over RTSP.
      MEDIAMTX_VERSION: v1.9.3
    steps:
    - uses: actions/checkout@v7
    # Cache cargo registry + target dir, keyed per job. Cuts re-runs (e.g.
    # after a review-fix push) from full rebuilds to incremental ones.
    - uses: Swatinem/rust-cache@v2
    - name: Install ffmpeg + libav dev libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libseccomp-dev \
          libavutil-dev libavformat-dev libavcodec-dev libavfilter-dev \
          libavdevice-dev libswscale-dev libswresample-dev
    - name: Install MediaMTX (RTSP server)
      run: |
        set -euo pipefail
        url="https://github.com/bluenviron/mediamtx/releases/download/${MEDIAMTX_VERSION}/mediamtx_${MEDIAMTX_VERSION}_linux_amd64.tar.gz"
        curl -fsSL --retry 3 -o /tmp/mediamtx.tgz "$url"
        tar -xzf /tmp/mediamtx.tgz -C /tmp mediamtx
        /tmp/mediamtx --version
        echo "MEDIAMTX_BIN=/tmp/mediamtx" >> "$GITHUB_ENV"
    - name: Clippy (rtsp-ffmpeg)
      run: cargo clippy --features rtsp-ffmpeg --test rtsp_e2e -- -D warnings
    - name: Build rtsp-ffmpeg
      run: cargo build --features rtsp-ffmpeg --tests
    - name: Test RTSP ingestion end-to-end (serves the fixture over RTSP)
      # SECURACV_RTSP_E2E=1 makes a missing server a hard failure, so this gate
      # can never pass vacuously.
      run: SECURACV_RTSP_E2E=1 cargo test --features rtsp-ffmpeg --test rtsp_e2e -- --nocapture

  frigate-mqtt-e2e:
    name: Frigate MQTT (live broker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    # Cache cargo registry + target dir, keyed per job. Cuts re-runs (e.g.
    # after a review-fix push) from full rebuilds to incremental ones.
    - uses: Swatinem/rust-cache@v2
    - name: Install mosquitto broker + clients
      run: |
        sudo apt-get update
        sudo apt-get install -y mosquitto mosquitto-clients libseccomp-dev
        # We run our own anonymous broker on loopback; stop the packaged service
        # so it can't hold port 1883.
        sudo systemctl stop mosquitto 2>/dev/null || true
    - name: Build frigate_bridge
      run: cargo build --bin frigate_bridge
    - name: Live-broker smoke (real binary ingests a frigate/events message)
      run: BRIDGE_BIN=./target/debug/frigate_bridge integrations/ha_frigate_mqtt/ci_smoke.sh

  optional-features:
    name: Optional feature build gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Compile-gates the pure-Rust optional features that have no dedicated job, so a
    # dependency bump that isn't migrated in-source (e.g. ureq for ingest-esp32, tract
    # for backend-tract) fails CI instead of silently breaking an off-by-default feature.
    # Uses --all-targets so feature-gated code in *every* target is covered (e.g. the
    # ingest-esp32 / backend-tract blocks in the witnessd and demo binaries and the
    # adapter integration tests), not just one bin/lib. ingest-v4l2 is included here
    # because the v4l crate builds and links without any system library.
    steps:
    - uses: actions/checkout@v7
    # Cache cargo registry + target dir, keyed per job. Cuts re-runs (e.g.
    # after a review-fix push) from full rebuilds to incremental ones.
    - uses: Swatinem/rust-cache@v2
    - name: Install libseccomp
      run: sudo apt-get update && sudo apt-get install -y libseccomp-dev
    - name: Clippy (ingest-esp32)
      run: cargo clippy --all-targets --features ingest-esp32 -- -D warnings
    - name: Clippy (adapters)
      run: cargo clippy --all-targets --features adapter-frigate,adapter-mqtt-sensor,adapter-webhook,adapter-webhook-tls,adapter-ble-presence,adapter-meshtastic,adapter-can-bus,adapter-sandbox -- -D warnings
    - name: Clippy (backend-tract)
      run: cargo clippy --all-targets --features backend-tract -- -D warnings
    - name: Clippy (ingest-v4l2)
      run: cargo clippy --all-targets --features ingest-v4l2 -- -D warnings
    - name: Clippy (c2pa-export)
      run: cargo clippy --all-targets --features c2pa-export -- -D warnings
    - name: Clippy (bridge-homekit)
      run: cargo clippy --all-targets --features bridge-homekit -- -D warnings
    # The bridge surface is the kernel's egress boundary, and its tests assert
    # the Invariant III properties the projection exists to hold (publication
    # happens on a metronome, and its rate does not vary with event rate). Same
    # reasoning as the adapters job above: a clippy-only gate would compile
    # those tests and never run them, so the properties would rot silently.
    - name: Test (bridge-homekit)
      # Quoted: the trailing `::` in the test filter would otherwise read as
      # a YAML mapping value and make this workflow unparseable.
      run: "cargo test --verbose --features bridge-homekit bridge::"
    - name: Clippy (bridge-homekit-server)
      run: cargo clippy --all-targets --features bridge-homekit-server -- -D warnings
    # The server lane carries the pairing crypto and the encrypted session, so
    # its tests are the ones that would rot most quietly: a transcript bug
    # still compiles. The end-to-end test drives the accessory with an
    # independently written controller, which is what makes it worth running
    # rather than merely building.
    - name: Test (bridge-homekit-server)
      run: "cargo test --verbose --features bridge-homekit-server bridge::"
    - name: Clippy (alert-relay)
      run: cargo clippy --all-targets --features alert-relay -- -D warnings
    - name: Test (alert-relay)
      run: "cargo test --verbose --features alert-relay relay::"

  ingest-gstreamer:
    name: Ingest (gstreamer rtsp)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Compile-gate for the rtsp-gstreamer feature, which needs the GStreamer dev
    # libraries and so cannot live in the optional-features job above.
    steps:
    - uses: actions/checkout@v7
    # Cache cargo registry + target dir, keyed per job. Cuts re-runs (e.g.
    # after a review-fix push) from full rebuilds to incremental ones.
    - uses: Swatinem/rust-cache@v2
    - name: Install GStreamer + libseccomp dev libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y libseccomp-dev \
          libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
    - name: Clippy (rtsp-gstreamer)
      run: cargo clippy --all-targets --features rtsp-gstreamer -- -D warnings

  status-grid:
    name: witness-kernel status grid matches the code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
    # The public "Implementation status" grid in docs/witness-kernel.html is a
    # computed artifact: tools/gen_kernel_status.py inspects the source and
    # stamps each tile done/wip/planned. Re-run it and fail if the committed
    # HTML no longer matches the code — so the "verify by inspecting the code"
    # promise can't silently rot.
    - name: Status grid drift (stamped from the code)
      run: |
        python3 tools/gen_kernel_status.py
        if ! git diff --exit-code -- docs/witness-kernel.html; then
          echo "::error::docs/witness-kernel.html status grid is out of date — run 'python3 tools/gen_kernel_status.py' and commit (the kernel's implementation status changed)"
          exit 1
        fi
