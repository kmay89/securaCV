name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

# These jobs only read the repo; no write scopes needed.
permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install libseccomp
      run: sudo apt-get update && sudo apt-get install -y libseccomp-dev
    - name: Rustfmt
      run: cargo fmt --check
    - name: Clippy
      run: cargo clippy --all-targets -- -D warnings
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Build with no default features
      run: cargo check --no-default-features
    - name: Build with PQC features
      run: cargo check --features pqc-signatures,pqc-vault,pqc-tls
    - name: Test with PQC features
      run: cargo test --features pqc-signatures,pqc-vault

  ingest-ffmpeg:
    name: Ingest (ffmpeg file decode)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install ffmpeg + libav dev libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libseccomp-dev \
          libavutil-dev libavformat-dev libavcodec-dev libavfilter-dev \
          libavdevice-dev libswscale-dev libswresample-dev
    - name: Clippy (ingest-file-ffmpeg)
      run: cargo clippy --features ingest-file-ffmpeg --bin ingest_run -- -D warnings
    - name: Build ingest_run
      run: cargo build --features ingest-file-ffmpeg --bin ingest_run
    - name: Test file ingestion (decodes the committed mp4 fixture)
      run: cargo test --features ingest-file-ffmpeg --bin ingest_run

  ingest-rtsp:
    name: Ingest (rtsp end-to-end)
    runs-on: ubuntu-latest
    env:
      # Pinned MediaMTX (RTSP server) used to serve the fixture over RTSP.
      MEDIAMTX_VERSION: v1.9.3
    steps:
    - uses: actions/checkout@v4
    - name: Install ffmpeg + libav dev libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libseccomp-dev \
          libavutil-dev libavformat-dev libavcodec-dev libavfilter-dev \
          libavdevice-dev libswscale-dev libswresample-dev
    - name: Install MediaMTX (RTSP server)
      run: |
        set -euo pipefail
        url="https://github.com/bluenviron/mediamtx/releases/download/${MEDIAMTX_VERSION}/mediamtx_${MEDIAMTX_VERSION}_linux_amd64.tar.gz"
        curl -fsSL --retry 3 -o /tmp/mediamtx.tgz "$url"
        tar -xzf /tmp/mediamtx.tgz -C /tmp mediamtx
        /tmp/mediamtx --version
        echo "MEDIAMTX_BIN=/tmp/mediamtx" >> "$GITHUB_ENV"
    - name: Clippy (rtsp-ffmpeg)
      run: cargo clippy --features rtsp-ffmpeg --test rtsp_e2e -- -D warnings
    - name: Build rtsp-ffmpeg
      run: cargo build --features rtsp-ffmpeg --tests
    - name: Test RTSP ingestion end-to-end (serves the fixture over RTSP)
      # SECURACV_RTSP_E2E=1 makes a missing server a hard failure, so this gate
      # can never pass vacuously.
      run: SECURACV_RTSP_E2E=1 cargo test --features rtsp-ffmpeg --test rtsp_e2e -- --nocapture

  frigate-mqtt-e2e:
    name: Frigate MQTT (live broker)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install mosquitto broker + clients
      run: |
        sudo apt-get update
        sudo apt-get install -y mosquitto mosquitto-clients libseccomp-dev
        # We run our own anonymous broker on loopback; stop the packaged service
        # so it can't hold port 1883.
        sudo systemctl stop mosquitto 2>/dev/null || true
    - name: Build frigate_bridge
      run: cargo build --bin frigate_bridge
    - name: Live-broker smoke (real binary ingests a frigate/events message)
      run: BRIDGE_BIN=./target/debug/frigate_bridge integrations/ha_frigate_mqtt/ci_smoke.sh

  optional-features:
    name: Optional feature build gate
    runs-on: ubuntu-latest
    # Compile-gates the pure-Rust optional features that have no dedicated job, so a
    # dependency bump that isn't migrated in-source (e.g. ureq for ingest-esp32, tract
    # for backend-tract) fails CI instead of silently breaking an off-by-default feature.
    # Uses --all-targets so feature-gated code in *every* target is covered (e.g. the
    # ingest-esp32 / backend-tract blocks in the witnessd and demo binaries and the
    # adapter integration tests), not just one bin/lib.
    steps:
    - uses: actions/checkout@v4
    - name: Install libseccomp
      run: sudo apt-get update && sudo apt-get install -y libseccomp-dev
    - name: Clippy (ingest-esp32)
      run: cargo clippy --all-targets --features ingest-esp32 -- -D warnings
    - name: Clippy (adapters)
      run: cargo clippy --all-targets --features adapter-frigate,adapter-mqtt-sensor,adapter-webhook,adapter-webhook-tls,adapter-ble-presence,adapter-sandbox -- -D warnings
    - name: Clippy (backend-tract)
      run: cargo clippy --all-targets --features backend-tract -- -D warnings
