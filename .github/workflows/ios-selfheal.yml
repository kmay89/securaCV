# Nightly iOS self-heal — "each night, does what it needs to do."
#
# The iOS analogue of desktop-hub-core.yml's rationale: the full app only builds
# on a release tag, so this nightly job regenerates the Xcode project from
# project.yml and rebuilds + tests it against the CURRENT firmware contracts, so
# it can never rot silently between releases. It needs no signing (simulator
# build), so it runs whenever iOS is enabled — but stays a green no-op until then
# so it never nags.
#
# The SecuraCV scheme also builds the embedded watchOS app + its complications
# (heal.sh proves they land inside SecuraCV.app), so the wrist targets get the
# same ungated PR compile as the phone — the gate stays on the upload, never
# on the build (RELEASE_LESSONS Principle 9).
#
# House style honored (.github/CI.md): explicit permissions, timeout-minutes,
# a concurrency group, a staggered non-:00 nightly cron, and the same
# `ENABLE_IOS_BUILD` gate as the other iOS jobs.
name: iOS self-heal (nightly)

on:
  workflow_dispatch:
  # Also the app's PR compiler: iOS changes are authored in dev containers
  # with no Swift toolchain, so this build is the first time they compile.
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-selfheal.yml"
  schedule:
    # 08:41 UTC nightly — off the :00 fleet stampede, distinct from bom-pricing.
    - cron: "41 8 * * *"

permissions:
  contents: read

concurrency:
  group: ios-selfheal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  selfheal:
    # macos-26 to match ios-release.yml: the release must build with the
    # iOS 26 SDK (ITMS-90725), so the first compiler must compile with it too.
    runs-on: macos-26
    timeout-minutes: 40
    # The ENABLE_IOS_BUILD gate applies only to the scheduled nightly (so it
    # never nags before iOS is enabled). PRs always build: this is an unsigned
    # simulator build needing no Apple credentials, and for iOS changes
    # authored in Swift-less dev containers it is the first compiler — a
    # gated green no-op would defeat the protection.
    env:
      RUN_BUILD: ${{ vars.ENABLE_IOS_BUILD == 'true' || github.event_name == 'pull_request' }}
    steps:
      - name: Gate notice
        if: env.RUN_BUILD != 'true'
        run: |
          echo "::notice title=iOS self-heal skipped::Set repository variable ENABLE_IOS_BUILD=true to enable the nightly iOS build/test (PRs touching ios/** always build). Exiting green."

      - uses: actions/checkout@v7
        if: env.RUN_BUILD == 'true'

      # Store assets fail at `altool --validate-app`, minutes into a gated
      # publish nobody can run yet — so PR CI asserts them structurally here
      # (the tvOS lesson, RELEASE_LESSONS 2026-07-24). Covers the iPhone AND
      # the embedded watch app's catalogs; stdlib-only, no Pillow.
      - name: App icon catalogs are complete and correctly sized
        if: env.RUN_BUILD == 'true'
        run: python3 ios/scripts/check_app_icon.py

      - name: Select Xcode
        if: env.RUN_BUILD == 'true'
        # Runner images name Xcode with full versions (Xcode_26.6.app…), so a
        # bare Xcode_26.app never matches; pick the newest 26.x (the SDK App
        # Store Connect requires — ITMS-90725), fall back to the image
        # default, and always print what we got.
        run: |
          latest="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' 2>/dev/null | sort -V | tail -1)"
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version

      - name: Regenerate, build & test (no signing)
        if: env.RUN_BUILD == 'true'
        working-directory: ios
        run: bash scripts/heal.sh build

      - name: Summary
        if: env.RUN_BUILD == 'true'
        run: echo "::notice title=iOS self-heal::App regenerated from project.yml and rebuilt + tested against current contracts. It did not rot."
