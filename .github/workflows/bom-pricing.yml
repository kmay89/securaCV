name: BOM Pricing

# The supply chain runs itself: every night this fetches live distributor
# data (Digi-Key Product Information V4 + Mouser Search) for every orderable
# MPN in docs/hardware/bom_*.csv, refreshes docs/hardware/pricing.json, and
# regenerates the Build-it catalog that rides on it. A human is only pulled
# in when something needs a decision — out-of-stock, price jump, lifecycle
# change — raised as a deduplicated GitHub issue.
#
# No secrets configured? The fetch no-ops politely and the committed
# snapshot stands. Setup: docs/hardware/bom_pipeline.md §Credentials.

on:
  schedule:
    - cron: "13 9 * * *" # nightly; distributors have refreshed by then
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  # the snapshot lands as a PR now (see the commit step), not a push to main
  pull-requests: write

concurrency:
  group: bom-pricing
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    # ~60 MPNs at polite pacing is a 2-5 minute run; 15 is the circuit breaker
    timeout-minutes: 15
    steps:
      # FRESHNESS_PAT (optional; the same secret homeassistant-freshness.yml
      # uses): a push made with the default GITHUB_TOKEN triggers no
      # workflows, so without it the snapshot PR shows no checks of its own.
      # The gate step below runs the same checks here either way.
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.FRESHNESS_PAT || github.token }}

      - name: Fetch distributor snapshot
        env:
          DIGIKEY_CLIENT_ID: ${{ secrets.DIGIKEY_CLIENT_ID }}
          DIGIKEY_CLIENT_SECRET: ${{ secrets.DIGIKEY_CLIENT_SECRET }}
          MOUSER_API_KEY: ${{ secrets.MOUSER_API_KEY }}
        run: python3 scripts/bom_pricing.py --exceptions-out bom_exceptions.json

      # EVERY generator that reads the snapshot, not just the first one that
      # did. gen_board_design.py stamps the board cost model with the pricing
      # data's own timestamp (pricing_as_of), so a refreshed snapshot leaves
      # that file stale by construction — and `gen_board_design.py --check` is
      # a gate in lint.yml. Missing it here meant the nightly job pushed a
      # commit that turned main red, and every PR opened afterwards inherited
      # a failure it had nothing to do with. A job that regenerates SOME of
      # what it invalidates is worse than one that regenerates none, because
      # the gap only shows up on somebody else's branch.
      - name: Regenerate everything that rides the snapshot
        run: |
          python3 canary-local/tools/gen_enclosures.py
          python3 scripts/gen_board_design.py

      # The snapshot used to be pushed straight to main with the default
      # GITHUB_TOKEN, and a push made with that token triggers NO workflows
      # (GitHub's recursion guard) — so nothing ever verified the commit it
      # landed. It now lands as a PR (below), and the gates that consume the
      # regenerated files still run HERE first: the same checks lint.yml and
      # canary-local.yml run on any PR. A red gate leaves the snapshot
      # unproposed and the run red, which is the honest outcome.
      - name: Gate the regenerated files before they are proposed
        run: |
          set -euo pipefail
          python3 scripts/gen_board_design.py --check
          python3 scripts/lint_bom.py
          python3 scripts/lint_board_design.py
          node --test canary-local/tests/build_it.test.js canary-local/tests/catalog.test.js canary-local/tests/workshop.test.js

      - name: Propose the refreshed snapshot as a PR
        env:
          GH_TOKEN: ${{ secrets.FRESHNESS_PAT || github.token }}
        run: |
          if git diff --quiet -- docs/hardware/pricing.json canary-local/devices boards; then
            echo "snapshot unchanged — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="bot/bom-pricing"
          git checkout -B "$BRANCH"
          git add docs/hardware/pricing.json canary-local/devices boards
          git commit -m "bom: nightly supply-chain snapshot"
          git push -f origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "BOM: nightly supply-chain snapshot" \
              --body "Nightly distributor snapshot (Digi-Key + Mouser) and everything that rides on it — pricing.json, the Build-it catalog, the board design cost model. Gated by gen_board_design.py --check, lint_bom.py, lint_board_design.py and the catalog tests before this PR was opened. Force-pushed to the same branch each night while it stays open." \
            || {
              # Same fallback as homeassistant-freshness.yml: when the repo
              # forbids Actions from opening PRs, deliver the branch as one
              # deduplicated issue with the compare link instead of failing.
              TITLE_PREFIX="BOM: nightly supply-chain snapshot"
              TITLE="${TITLE_PREFIX} (needs a PR)"
              OPEN=$(gh issue list --state open --search "\"${TITLE_PREFIX}\" in:title" --json number --jq '.[].number' | head -1)
              LINK="https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"
              if [ -n "$OPEN" ]; then
                gh issue comment "$OPEN" --body "Refreshed again on $(date -u +%Y-%m-%d): branch \`${BRANCH}\` was force-pushed with tonight's snapshot — [open the PR](${LINK})."
              else
                gh issue create --title "$TITLE" --body "The nightly supply-chain snapshot is pushed on branch [\`${BRANCH}\`](https://github.com/${GITHUB_REPOSITORY}/tree/${BRANCH}) and passed its gates, but this repo does not let Actions open pull requests, so a human has to: [open the PR](${LINK}). Enable *Allow GitHub Actions to create and approve pull requests* or add a \`FRESHNESS_PAT\` secret to make this automatic. Raised by \`bom-pricing.yml\`; reused while open."
              fi
              echo "::warning::PR creation refused; delivered the snapshot branch through an issue instead."
            }
          fi

      - name: Raise supply-chain exceptions as issues (deduplicated)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess

          p = pathlib.Path("bom_exceptions.json")
          exceptions = json.loads(p.read_text()) if p.exists() else []
          for e in exceptions:
              title = f"supply-chain [{e['kind']}]: {e['mpn']}"
              probe = subprocess.run(
                  ["gh", "issue", "list", "--state", "open",
                   "--search", f'"{title}" in:title', "--json", "number"],
                  capture_output=True, text=True)
              if probe.returncode == 0 and json.loads(probe.stdout or "[]"):
                  print(f"open issue exists, skipping: {title}")
                  continue
              body = (
                  f"{e['detail']}\n\n"
                  "Raised automatically by the nightly BOM Pricing workflow.\n\n"
                  "- Snapshot: `docs/hardware/pricing.json`\n"
                  "- Design intent: `docs/hardware/bom_*.csv`\n"
                  "- Playbook: `docs/hardware/bom_pipeline.md` (Exceptions)\n")
              subprocess.run(
                  ["gh", "issue", "create", "--title", title, "--body", body],
                  check=False)
          print(f"{len(exceptions)} exception(s) processed")
          PY
