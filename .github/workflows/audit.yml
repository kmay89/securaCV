name: Dependency Audit

# Flags KNOWN vulnerabilities in the committed lockfiles (HY-06), automating
# what SECURITY.md tracked by hand. Dependabot (.github/dependabot.yml) is the
# companion that opens update PRs. Runs weekly, on demand, and on PRs that
# touch a lockfile — so normal PRs aren't gated on a newly-disclosed CVE.
on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - 'canary-vision/package.json'
      - 'canary-vision/device-api/package.json'
      - 'canary-vision/package-lock.json'
      # Shipped desktop Flasher / Lab + the hub-io crate and the tvOS core —
      # each has its own Cargo.lock (the root Cargo.toml declares no
      # [workspace], so the root audit never sees them). These are self-updating
      # apps, so a known advisory in one must gate the same as the kernel's.
      # NOTE: hub-core is deliberately NOT listed. It is a zero-dependency,
      # pure-`std` crate and its Cargo.lock is gitignored (desktop/.gitignore),
      # so there is nothing to audit and no committed lockfile to load — adding
      # it back makes `cargo audit -f` fail with "Couldn't load … Cargo.lock".
      - 'desktop/src-tauri/Cargo.lock'
      - 'desktop-lab/src-tauri/Cargo.lock'
      - 'desktop/hub-io/Cargo.lock'
      - 'tvos/witness-core/Cargo.lock'
      - 'desktop-lab/package.json'
      - 'desktop-lab/package-lock.json'
      - 'desktop/package.json'
      - 'desktop/package-lock.json'
      - '.github/workflows/audit.yml'
      # The ignore list must re-run the gate it suppresses. Without this,
      # a PR that only edits .cargo/audit.toml skips this workflow, and a
      # broadened ignore merges unvalidated — hiding a real advisory until
      # the next Monday run.
      - '.cargo/audit.toml'

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cargo-audit:
    name: cargo audit (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Compiling cargo-audit from source cost ~5 min of every run. Cache
      # the built binary under a weekly key: at most one build per week,
      # and "latest" can never go stale longer than that. The advisory DB
      # itself is fetched fresh at run time either way.
      - name: Weekly tool-cache stamp
        id: week
        run: echo "stamp=$(date -u +%GW%V)" >> "$GITHUB_OUTPUT"
      - name: Cache the cargo-audit binary
        id: tool
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ steps.week.outputs.stamp }}
      - name: Install cargo-audit
        if: steps.tool.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked
      # Ignores live in .cargo/audit.toml, one entry per advisory, each
      # requiring a written reachability analysis in SECURITY.md ("Known
      # dependency advisories"). Never add an ignore to silence a red gate —
      # add it only when there is no reachable fix and the vulnerable path
      # provably isn't ours, and delete it the moment a fix lands.
      - name: Audit Cargo.lock against the RustSec advisory DB
        run: cargo audit

      # The desktop Flasher/Lab, the hub-io crate, and the tvOS core each carry
      # their OWN Cargo.lock outside the root (no [workspace]), so the root audit
      # above never touches them. They ship in signed, self-updating apps — audit
      # them against the same advisory DB and fail on any advisory.
      # `-f <lock>` audits that exact lockfile; the shared .cargo/audit.toml
      # ignore list still applies (run from the repo root).
      # hub-core is intentionally excluded: it is a zero-dependency, pure-`std`
      # crate whose Cargo.lock is gitignored, so there is nothing to audit and
      # `cargo audit -f desktop/hub-core/Cargo.lock` would fail to load the file.
      - name: Audit shipped desktop / tvOS lockfiles
        run: |
          set -e
          for lock in \
            desktop/src-tauri/Cargo.lock \
            desktop-lab/src-tauri/Cargo.lock \
            desktop/hub-io/Cargo.lock \
            tvos/witness-core/Cargo.lock; do
            echo "::group::cargo audit -f $lock"
            cargo audit -f "$lock"
            echo "::endgroup::"
          done

  cargo-deny:
    name: cargo deny (licenses / bans / sources)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Same weekly binary cache as cargo-audit above.
      - name: Weekly tool-cache stamp
        id: week
        run: echo "stamp=$(date -u +%GW%V)" >> "$GITHUB_OUTPUT"
      - name: Cache the cargo-deny binary
        id: tool
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ runner.os }}-${{ steps.week.outputs.stamp }}
      - name: Install cargo-deny
        if: steps.tool.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --locked
      - name: Check licenses, duplicate versions, and source provenance
        # Advisories are gated by the cargo-audit job above (RustSec DB);
        # cargo-deny owns license policy, duplicate detection, and source
        # provenance per deny.toml (doc-12 A4 / FR-14).
        run: cargo deny check bans licenses sources

  npm-audit:
    name: npm audit (${{ matrix.dir }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # canary-vision (fleet UI / device-api), the shipped desktop Lab
        # (desktop-lab) and the shipped desktop Flasher (desktop) each have
        # their own package-lock.json. The two desktop lockfiles pin only
        # @tauri-apps/cli, the tool that builds the bundle — an advisory in it
        # sits on the release path, so it gates like the rest.
        dir: [canary-vision, desktop-lab, desktop]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # npm's quick-audit endpoint (used when node_modules is absent) is
      # retired and now 400s; installing first makes npm audit use the bulk
      # advisory endpoint against the real tree.
      - name: Install deps for the audit tree
        working-directory: ${{ matrix.dir }}
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit npm deps (fail on high/critical)
        working-directory: ${{ matrix.dir }}
        run: npm audit --audit-level=high
