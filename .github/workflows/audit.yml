name: Dependency Audit

# Flags KNOWN vulnerabilities in the committed lockfiles (HY-06), automating
# what SECURITY.md tracked by hand. Dependabot (.github/dependabot.yml) is the
# companion that opens update PRs. Runs weekly, on demand, and on PRs that
# touch a lockfile — so normal PRs aren't gated on a newly-disclosed CVE.
on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - 'canary-vision/package.json'
      - 'canary-vision/device-api/package.json'
      - 'canary-vision/package-lock.json'
      - '.github/workflows/audit.yml'

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cargo-audit:
    name: cargo audit (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit Cargo.lock against the RustSec advisory DB
        run: cargo audit

  cargo-deny:
    name: cargo deny (licenses / bans / sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Check licenses, duplicate versions, and source provenance
        # Advisories are gated by the cargo-audit job above (RustSec DB);
        # cargo-deny owns license policy, duplicate detection, and source
        # provenance per deny.toml (doc-12 A4 / FR-14).
        run: cargo deny check bans licenses sources

  npm-audit:
    name: npm audit (canary-vision)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Audit npm deps (fail on high/critical)
        working-directory: canary-vision
        run: npm audit --audit-level=high
