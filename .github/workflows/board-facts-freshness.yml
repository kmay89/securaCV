# Vendor board-facts freshness — the anti-rot loop for the Waveshare dash
# boards we build on (docs/hardware/waveshare_board_reference.md).
#
# Weekly (and on demand), this re-pulls the vendor wiki pin maps / silicon /
# parameters into canary-local/devices/board_facts.json via
# gen_board_facts.py --refresh-upstream, and opens a PR when any fact moved.
# The snapshot is FACTS (GPIO numbers, part numbers) transcribed from the
# canonical vendor pages — not their prose — so ours stays exact without
# going stale.
#
# Self-healing, same posture as homeassistant-freshness.yml:
#   · the refresher moves a board's facts forward ONLY on a clean fetch+parse;
#     a 403 / dead feed / reshaped page keeps the last good snapshot verbatim
#     (→ "no diff, no PR", and an unchanged fetch keeps the entry — date
#     included — verbatim, so no weekly date-only PRs). `verified_utc` moves only
#     on a real read, and the reference page shows that date's age — a broken
#     loop tells on itself.
#   · changes land as a PR, so the drift-lock (board_facts.test.mjs, which
#     also proves our pins.h still matches the refreshed facts) re-verifies
#     before anything can merge.

name: board facts freshness

on:
  schedule:
    - cron: "50 5 * * 1" # Mondays 05:50 UTC (after homeassistant-freshness)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # issues: the fallback when the repo forbids Actions from opening PRs
  # (see the PR step) — that setting does not gate issue creation.
  issues: write

# Two refreshes racing would fight over the bot branch push — queue, never
# cancel mid-PR-ceremony.
concurrency:
  group: board-facts-freshness
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # FRESHNESS_PAT (optional): pushes/PRs by the default GITHUB_TOKEN don't
      # trigger other workflows (GitHub's recursion guard), so without it the
      # freshness PR won't get canary-local.yml's checks. The drift-lock below
      # runs HERE either way — the PR is validated before it exists.
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.FRESHNESS_PAT || github.token }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Refresh the vendor board-facts snapshot
        run: python3 canary-local/tools/gen_board_facts.py --refresh-upstream
      - name: Drift-lock before proposing anything (facts shape + pins.h match)
        run: node --test canary-local/tests/board_facts.test.mjs
      - name: Open a PR if the vendor facts moved
        env:
          GH_TOKEN: ${{ secrets.FRESHNESS_PAT || github.token }}
        run: |
          SNAP=canary-local/devices/board_facts.json
          if [ -z "$(git status --porcelain -- "$SNAP")" ]; then
            echo "vendor facts unchanged — nothing to do"
            exit 0
          fi
          BRANCH="bot/board-facts-freshness"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add "$SNAP"
          git commit -m "chore(board-facts): vendor snapshot refresh (Waveshare dash boards)"
          git push -f origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Board facts: Waveshare vendor snapshot moved" \
              --body "Weekly freshness run: a Waveshare wiki page changed a fact we track (a pin, a part, a parameter), so \`board_facts.json\` re-lined itself. Refreshed by \`gen_board_facts.py --refresh-upstream\` and validated by \`board_facts.test.mjs\` (which also re-checks that our firmware \`pins.h\` still matches) before this PR was opened. Review the diff to decide whether our pin maps should follow." \
            || {
              # The default GITHUB_TOKEN can PUSH the branch but this repo's
              # Actions settings refuse to let it open a pull request
              # ("GitHub Actions is not permitted to create or approve pull
              # requests"). Before this fallback, every scheduled run that
              # had something to propose failed right here — the refreshed
              # branch was pushed, the run went red, and the only record was
              # a log nobody reads. Issues are NOT gated by that setting, so
              # the snapshot is delivered as one deduplicated issue carrying
              # the compare link (the same pattern bom-pricing.yml uses for
              # supply-chain exceptions), and the run exits green with a
              # warning annotation. Set FRESHNESS_PAT or flip the setting to
              # get PRs again; this branch keeps working either way.
              TITLE_PREFIX="Board facts: Waveshare vendor snapshot moved"
              TITLE="${TITLE_PREFIX} (needs a PR)"
              OPEN=$(gh issue list --state open --search "\"${TITLE_PREFIX}\" in:title" --json number --jq '.[].number' | head -1)
              if [ -n "$OPEN" ]; then
                gh issue comment "$OPEN" --body "Refreshed again on $(date -u +%Y-%m-%d): branch \`${BRANCH}\` was force-pushed with the latest snapshot — [open the PR](https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1)."
                echo "::warning::PR creation refused; updated open issue #$OPEN with the compare link instead."
              else
                gh issue create --title "$TITLE" --body "Weekly freshness run: a Waveshare wiki page changed a fact we track, so \`board_facts.json\` re-lined itself. The refreshed snapshot is pushed on branch [\`${BRANCH}\`](https://github.com/${GITHUB_REPOSITORY}/tree/${BRANCH}) and already passed \`board_facts.test.mjs\`, but this repo does not let Actions open pull requests, so a human has to: [open the PR](https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1) and decide whether our pin maps should follow. To make this automatic, enable *Allow GitHub Actions to create and approve pull requests* (Settings → Actions → General) or add a \`FRESHNESS_PAT\` secret. Raised by \`board-facts-freshness.yml\`; this issue is reused while it stays open."
                echo "::warning::PR creation refused; opened an issue with the compare link instead. Enable 'Allow GitHub Actions to create and approve pull requests' or add FRESHNESS_PAT to get PRs."
              fi
            }
          fi
