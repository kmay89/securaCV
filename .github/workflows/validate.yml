name: HACS Validation

# Validates the HACS/hassfest contract for the HA integration. Path-scoped
# to the integration surface; the weekly schedule still catches upstream
# requirement changes (new hassfest rules) with no repo change at all.
on:
  push:
    branches: [main]
    paths:
      - 'custom_components/**'
      - 'hacs.json'
      - 'repository.yaml'
      - '.github/workflows/validate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'custom_components/**'
      - 'hacs.json'
      - 'repository.yaml'
      - '.github/workflows/validate.yml'
  schedule:
    - cron: "0 0 * * 1"   # Mondays 00:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PRs collapse per branch; each main commit gets its own group, so a burst
  # of merges can never evict the main run queued behind another (CI.md R3).
  group: hacs-validate-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
          # The brands check passes on custom_components/securacv/brand/icon.png
          # (the validator looks for it in the tree before consulting
          # brands.home-assistant.io) — the same folder the HACS mirror has
          # validated with since 2026-08 and Home Assistant 2026.3+ serves.
          # release.yml still ignores the check; drop it there once this has
          # been seen green on main.

  validate-hassfest:
    name: Hassfest Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb # master @ 2026-05-28
