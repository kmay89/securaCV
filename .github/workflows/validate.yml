name: HACS Validation

# Validates the HACS/hassfest contract for the HA integration. Path-scoped
# to the integration surface; the weekly schedule still catches upstream
# requirement changes (new hassfest rules) with no repo change at all.
on:
  push:
    branches: [main]
    paths:
      - 'custom_components/**'
      - 'hacs.json'
      - 'repository.yaml'
      - '.github/workflows/validate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'custom_components/**'
      - 'hacs.json'
      - 'repository.yaml'
      - '.github/workflows/validate.yml'
  schedule:
    - cron: "0 0 * * 1"   # Mondays 00:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hacs-validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
          ignore: brands

  validate-hassfest:
    name: Hassfest Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: home-assistant/actions/hassfest@e91ad1948e57189485b9c1ad608af0c303946f89 # master @ 2026-05-28
