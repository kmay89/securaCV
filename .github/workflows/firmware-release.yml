name: Firmware Release

# Builds, signs, and publishes Canary firmware on fw-v* tags.
#
#   git tag fw-v2.2.0 && git push origin fw-v2.2.0
#
# Produces a GitHub Release carrying, for each supported variant
# (canary, canary-wap, canary-vision incl. xiao-c3/xiao-s3, canary-sense
# incl. wellbeing, canary-display watch/dash/dash-modes — 10 products; the
# display three are best-effort, see the display steps below):
#   - the firmware binary           (<variant>-<ver>.bin)
#   - a signed per-variant manifest (manifest-<variant>.json)
#   - a variant index               (manifest-index.json)
#   - sha256 checksums              (sha256sums.txt)
#
# Devices fetch manifest-<variant>.json from the stable
# releases/latest/download/ URL, verify the Ed25519 signature over
# (size_LE32 || sha256) against the public key compiled into
# firmware/common/ota/src/ota_release_key.h, and install via the
# pull-OTA engine (firmware/common/ota/).
#
# Required repository secret:
#   OTA_SIGNING_KEY_PEM — the Ed25519 release private key (PEM, PKCS8),
#   generated offline with:
#     python firmware/scripts/ota_release.py keygen --private-key releaser.pem
#   Its PUBLIC half must match ota_release_key.h — this workflow fails
#   loudly if they drift, because devices would reject every artifact.

on:
  # Path A — the git-tag ceremony (unchanged): push a fw-v* tag and this cuts
  # the release for exactly that tag/commit.
  push:
    tags:
      - 'fw-v*'
  # Path B — one-click from the Actions tab (or the whole-pipeline launcher).
  # Same build, same signing, same guards; it just creates the tag for you
  # from the version you pick, so the tag and the commit can never disagree.
  # The channel is a safety cross-check against the version's grammar
  # (release = a clean triple; dev = a -dev.N / -rc.N suffix) — see
  # docs/RELEASE_PROCESS.md.
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel: release (stable, latest moves) or dev (prerelease, dev channel only)"
        type: choice
        options:
          - release
          - dev
        default: release
      version:
        description: "Version to cut, e.g. 2.3.0 (release) or 2.3.0-dev.1 (dev). Blank = read the triple from source (release only). Must match the bumped FIRMWARE_VERSION / CANARY_FW_VERSION in every variant."
        type: string
        default: ""
      allow_dropped_products:
        description: "Comma-separated flasher product ids allowed to be ABSENT from this release (the sign-off for a knowingly broken build). Blank = every product that shipped last release must ship again, or the completeness gate fails before publishing."
        type: string
        default: ""

permissions:
  contents: write
  id-token: write      # OIDC identity used to sign the build-provenance attestation
  attestations: write  # upload the signed provenance to this repo's attestation store
  actions: write       # chain-dispatch vision-model-release.yml after publishing

# One release build per tag; NEVER cancel a run mid-publish (half-uploaded
# release assets) — concurrent runs queue instead.
concurrency:
  group: firmware-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-sign-release:
    name: Build, sign, and publish firmware
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - name: Derive version, tag, and channel
        id: ver
        env:
          # workflow_dispatch inputs (empty on a tag push)
          IN_CHANNEL: ${{ inputs.channel }}
          IN_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # One-click path: derive VERSION + TAG from the inputs. The source
            # triple (canary's FIRMWARE_VERSION) is the fallback for a release.
            SRC_TRIPLE="$(grep -E '#define[[:space:]]+FIRMWARE_VERSION' firmware/canary/include/canary_config.h | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
            VERSION="${IN_VERSION#fw-v}"     # tolerate a pasted fw-v* tag
            if [ -z "$VERSION" ]; then
              if [ "$IN_CHANNEL" = "dev" ]; then
                echo "::error::dev channel needs an explicit -dev.N / -rc.N version (e.g. ${SRC_TRIPLE}-dev.1) — the binary must carry that exact string. Bump the version headers and enter it here."
                exit 1
              fi
              VERSION="$SRC_TRIPLE"
            fi
            # Safety cross-check: the picked channel must match the version's
            # grammar, so a typo can't publish a dev build as stable (or vice
            # versa) — the two would then disagree about releases/latest.
            case "$VERSION" in
              *-dev.*|*.dev.*|*-rc.*|*.rc.*) VER_KIND=dev ;;
              *)                             VER_KIND=release ;;
            esac
            if [ "$VER_KIND" != "$IN_CHANNEL" ]; then
              echo "::error::channel '${IN_CHANNEL}' disagrees with version '${VERSION}' (that version looks like '${VER_KIND}'). A dev build needs a -dev.N / -rc.N suffix; a release must have none."
              exit 1
            fi
            TAG="fw-v${VERSION}"
            # Refuse to clobber an already-published tag — bump the version.
            if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "::error::tag ${TAG} already exists. Bump FIRMWARE_VERSION / CANARY_FW_VERSION in every variant (and the CHANGELOG) to the next version first."
              exit 1
            fi
            echo "Firmware ${IN_CHANNEL}-channel release ${VERSION} (one-click) → will create tag ${TAG} at ${GITHUB_SHA}"
          else
            # Tag-push path (unchanged): the tag is the control surface.
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#fw-v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Channel gating happens HERE, not in any client: a dev/rc version is a
          # GitHub prerelease, so releases/latest — the URL every default device
          # polls — never moves for it. Release-channel devices are structurally
          # unable to see dev builds (docs/RELEASE_PROCESS.md).
          case "$VERSION" in
            *-dev.*|*.dev.*|*-rc.*|*.rc.*)
              echo "prerelease=true"  >> "$GITHUB_OUTPUT"
              echo "channel=dev"      >> "$GITHUB_OUTPUT"
              echo "Firmware DEV-CHANNEL release: $VERSION" ;;
            *)
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
              echo "channel=release"  >> "$GITHUB_OUTPUT"
              echo "Firmware release version: $VERSION" ;;
          esac

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install build + signing tools
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio cryptography
          # esptool 4.11 (official espressif32 7.x platform) imports
          # intelhex without declaring it — same workaround as firmware.yml.
          pip install intelhex
          # esptool for the browser-flasher factory images (make_factory.py).
          # Pinned <5 so the `merge_bin` subcommand name stays stable.
          pip install "esptool>=4,<5"

      - name: Verify the signing key matches the committed public key
        # Fail BEFORE building: artifacts signed with a drifted key would
        # be rejected by every device in the field.
        env:
          OTA_SIGNING_KEY_PEM: ${{ secrets.OTA_SIGNING_KEY_PEM }}
        run: |
          set -euo pipefail
          if [ -z "$OTA_SIGNING_KEY_PEM" ]; then
            echo "::error::OTA_SIGNING_KEY_PEM secret is not set. Generate a key with 'ota_release.py keygen' and add it as a repository secret."
            exit 1
          fi
          printf '%s' "$OTA_SIGNING_KEY_PEM" > /tmp/releaser.pem
          chmod 600 /tmp/releaser.pem
          python firmware/scripts/ota_release.py pubkey-header \
            --private-key /tmp/releaser.pem --out /tmp/expected_key.h
          # Compare only the key bytes (the comment block carries a key id
          # that legitimately differs from the committed header's prose).
          extract_key_bytes() {
            sed -n '/SECURACV_OTA_RELEASE_PUBKEY\[32\]/,/};/p' "$1" | grep -o '0x[0-9a-fA-F][0-9a-fA-F]' | tr '[:upper:]' '[:lower:]'
          }
          extract_key_bytes /tmp/expected_key.h > /tmp/expected_bytes
          extract_key_bytes firmware/common/ota/src/ota_release_key.h > /tmp/committed_bytes
          if cmp -s /tmp/expected_bytes /tmp/committed_bytes; then
            echo "Signing key matches the committed release public key."
          # Key rotation window (docs/firmware_ota.md): the TRANSITION release
          # embeds the NEW public key in ota_release_key.h but must still be
          # SIGNED with the OLD key so fielded devices accept it. Committing
          # ota_release_key_previous.h (the OLD public key) opens that window;
          # delete the file after the fleet converges to close it. Without the
          # file the guard is strict single-key, exactly as before.
          elif [ -f firmware/common/ota/src/ota_release_key_previous.h ]; then
            extract_key_bytes firmware/common/ota/src/ota_release_key_previous.h > /tmp/previous_bytes
            if cmp -s /tmp/expected_bytes /tmp/previous_bytes; then
              echo "::warning::KEY ROTATION IN PROGRESS: signing with the PREVIOUS release key (ota_release_key_previous.h). Fielded devices accept this release and learn the new key from it. Delete ota_release_key_previous.h and switch OTA_SIGNING_KEY_PEM to the new key once the fleet has converged."
            else
              echo "::error::The OTA_SIGNING_KEY_PEM secret matches neither ota_release_key.h nor ota_release_key_previous.h. Devices would reject everything this workflow signs."
              exit 1
            fi
          else
            echo "::error::The OTA_SIGNING_KEY_PEM secret's public key does not match firmware/common/ota/src/ota_release_key.h. Devices would reject everything this workflow signs. (If you are rotating keys, commit the old public key as ota_release_key_previous.h — see docs/firmware_ota.md.)"
            diff /tmp/expected_bytes /tmp/committed_bytes || true
            exit 1
          fi

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-canary-release-${{ hashFiles('firmware/canary/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-canary-release-
            ${{ runner.os }}-pio-canary-

      - name: Build canary (release)
        working-directory: firmware/canary
        run: pio run -e release

      - name: Build canary (release + Home Assistant MQTT)
        working-directory: firmware/canary
        run: pio run -e release_ha

      - name: Build canary reach-port board envs (PlatformIO, non-blocking)
        working-directory: firmware/canary
        # The Phase 0 reach ports (docs/strategy/30) — boards people already
        # own: the AI-Thinker ESP32-CAM, the WROOM-32 DevKit family, and the
        # Freenove S3 camera kit. Same envs firmware.yml compiles on every
        # push; built here so the BROWSER FLASHER has factory images to
        # install (build_flash_manifest.py picks them out of .pio/build).
        #
        # Deliberately NOT signed into per-product OTA manifests below: these
        # boards are compile-tested, nobody has booted one, and a self-update
        # channel asserts more than we know. USB install is a deliberate act
        # by someone who read the "never booted" label the flasher shows;
        # OTA is silent. They graduate together, on a Hardware Test Report.
        #
        # Non-blocking, like the display envs: a failed env drops that board
        # from the flasher instead of sinking the signed release around it.
        run: |
          for E in esp32cam esp32-wroom freenove-s3; do
            if pio run -e "$E"; then
              echo "✓ $E"
            else
              echo "::warning::reach-port env $E failed to build — it will be absent from this release's flasher catalog"
            fi
          done

      - name: Build canary-vision (release)
        working-directory: firmware/projects/canary-vision
        run: |
          # Generic release build: placeholder secrets ON PURPOSE. A unit's
          # real identity + credentials live in NVS (canary/runtime_config),
          # seeded by the user's first USB flash with their own secrets.h —
          # the OTA-installed generic image inherits them. The placeholder
          # values below MUST match include/secrets.ci.h so runtime_config
          # treats them as placeholders and defers to NVS.
          mkdir -p secrets
          cat > secrets/secrets.h << 'HEADER'
          #pragma once
          // Generic OTA release build. Real credentials live in device NVS.
          #define WIFI_SSID "ci-placeholder"
          #define WIFI_PASS "ci-placeholder"
          #define MQTT_HOST "127.0.0.1"
          #define MQTT_PORT 1883
          #define MQTT_USER nullptr
          #define MQTT_PASS nullptr
          HEADER
          pio run -e canary-vision-default -e canary-vision-xiao-c3 -e canary-vision-xiao-s3
          # The C3 Super Mini reach port — flasher-only, same rationale as the
          # canary reach ports above (no OTA manifest until it is benched), and
          # non-blocking so it can never sink the signed release.
          if pio run -e canary-vision-c3-super-mini; then
            echo "✓ canary-vision-c3-super-mini"
          else
            echo "::warning::canary-vision-c3-super-mini failed to build — absent from this release's flasher catalog"
          fi

      - name: Build canary-sense (release)
        working-directory: firmware/projects/canary-sense
        # canary-sense rides the pioarduino core-3.x platform, but this job
        # builds canary/canary-vision on the official espressif32 platform
        # first — and the two ship a package literally named
        # `framework-arduinoespressif32` at incompatible versions (2.0.x vs
        # 3.3.8). Sharing ~/.platformio, pioarduino sees the official copy
        # already "installed", skips its own, and fails with
        # FRAMEWORK_DIR=None before any compile. A warm cache masked this
        # until the cache was evicted (fw-v2.3.0, 2026-07-27). Isolate the
        # core dir, exactly as the nightstand-c6 env below and firmware.yml's
        # isolated_core_envs already do.
        run: |
          # Generic release build: placeholder secrets ON PURPOSE — same
          # NVS-backed runtime-config scheme as canary-vision above.
          mkdir -p secrets
          cat > secrets/secrets.h << 'HEADER'
          #pragma once
          // Generic OTA release build. Real credentials live in device NVS.
          #define WIFI_SSID "ci-placeholder"
          #define WIFI_PASS "ci-placeholder"
          #define MQTT_HOST "127.0.0.1"
          #define MQTT_PORT 1883
          #define MQTT_USER nullptr
          #define MQTT_PASS nullptr
          HEADER
          PLATFORMIO_CORE_DIR="$GITHUB_WORKSPACE/.pio-core-canary-sense" \
            pio run -e canary-sense-default -e canary-sense-wellbeing

      - name: Install Arduino CLI + ESP32 core (cached)
        uses: ./.github/actions/setup-arduino-esp32
        with:
          libraries: |
            Crypto
            ArduinoJson
            NimBLE-Arduino

      - name: Build canary-wap (arduino-cli)
        run: |
          # PSRAM=opi is REQUIRED (build_config.h #errors on FULL/S3
          # without it). The bare FQBN's default is PSRAM=Disabled — release
          # binaries built that way heap-starve in the field (BLE refused,
          # SD writes failing, dashboard timing out). No extra_flags override
          # here, so the board menu's -DBOARD_HAS_PSRAM flows normally.
          arduino-cli compile \
            --fqbn esp32:esp32:XIAO_ESP32S3:PSRAM=opi,CDCOnBoot=cdc \
            --libraries firmware/common \
            --output-dir /tmp/wap-build \
            firmware/projects/canary-wap/arduino/canary_wap/canary_wap.ino

      - name: Install ESP32 core 2.0.17 + display libraries (core-2 row, cached)
        # The watch releases from the core-2.0.17 row — the PlatformIO-matched
        # pairing firmware.yml proves on every push (GFX 1.4.9 / LVGL 8.4 /
        # NimBLE 1.4.3). SPI panel: no RGB-scanout mechanism, so the
        # bench-validated core-2 row is the right one. Runs AFTER the wap
        # build on purpose: it switches the installed esp32:esp32 platform,
        # and wap builds on the latest core.
        uses: ./.github/actions/setup-arduino-esp32
        with:
          core-version: "2.0.17"
          # Exclusive: the wap row above installed the LATEST core into the
          # same ~/.arduino15. Without this, both versions sit there, the
          # unversioned FQBN below takes the newest, and the watch compiles
          # against core 3 with the core-2 library row — which is exactly
          # how fw-v2.4.1 shipped without a watch image.
          exclusive-core: "true"
          libraries: |
            GFX Library for Arduino@1.4.9
            lvgl@8.4.0
            PubSubClient
            Crypto
            ArduinoJson
            NimBLE-Arduino@1.4.3

      - name: Build canary-display watch (arduino-cli, core-2 fqbn + staged lv_conf.h)
        # Exactly the path firmware.yml's core-2 "Stage + compile" leg proves
        # on every push: explicit --fqbn, LVGL's config staged at the
        # libraries-dir root (libraries/lvgl/src/../../lv_conf.h is how LVGL
        # finds it). See the dash/modes step below for why NOT profile mode.
        run: |
          cd firmware/projects/canary-display/arduino/canary_display
          rm -f flavor_local.h
          LIBDIR="$(arduino-cli config get directories.user)/libraries"
          mkdir -p "${LIBDIR}"
          cp lv_conf.h "${LIBDIR}/lv_conf.h"
          if ! arduino-cli compile \
              --fqbn 'esp32:esp32:XIAO_ESP32S3:PSRAM=opi,CDCOnBoot=cdc,USBMode=hwcdc' \
              --output-dir /tmp/display-watch-build canary_display.ino; then
            echo "::warning::canary-display 'watch' build failed — absent from the browser flasher this release"
          fi

      - name: Install ESP32 core 3.3.10 + display libraries (core-3 row, cached)
        # The RGB-panel boards (dash + modes, the Waveshare 4.3B) MUST ship
        # the core-3 pairing: only GFX 1.6.x's Arduino_ESP32RGBPanel takes
        # bounce buffers, and without them the panel visibly
        # flickers/jitters/shifts sideways the moment WiFi comes up — the
        # radio and the RGB scanout contend for PSRAM bandwidth and the
        # peripheral underruns (display_dash.cpp, seen on the 4.3B bench).
        # The core-2 pairing has no bounce-buffer parameter and stays
        # bench-only for these boards. The dash-family PlatformIO envs
        # (dash7 included) ride the same core-3 pairing via the pioarduino
        # platform — see canary-display.ini's [env:canary-display-dash].
        uses: ./.github/actions/setup-arduino-esp32
        with:
          core-version: "3.3.10"
          # Exclusive for the same reason as the core-2 row above — this one
          # happens to have worked (3.3.x was already the newest installed),
          # which is precisely why the defect stayed invisible on this side.
          exclusive-core: "true"
          libraries: |
            GFX Library for Arduino@1.6.6
            lvgl@9.5.0
            PubSubClient
            Crypto
            ArduinoJson
            NimBLE-Arduino@2.5.0

      - name: Build canary-display dash + modes (arduino-cli, core-3 fqbn + staged lv_conf.h)
        # Same mechanism as the watch step, on the core-3 row firmware.yml's
        # "Stage + compile" leg proves on every push: explicit --fqbn with
        # LVGL's config staged at the libraries-dir root. Core 3 is
        # load-bearing here, not a preference — it's what compiles the RGB
        # panel's bounce buffers in (see the setup step above); a core-2
        # dash build ships the WiFi-flicker defect.
        #
        # NOT profile mode (`arduino-cli compile --profile`), which this step
        # used from its first day and which never produced a single release
        # binary: profiles install libraries into an isolated internal dir
        # where no lv_conf.h can be staged (watch/dash died on "fatal error:
        # ../../lv_conf.h: No such file or directory"), and the modes
        # profile's vendor-board pin doesn't resolve in profile mode at all
        # ("Invalid FQBN"). Every failure was a ::warning:: — non-blocking by
        # design — so fw-v2.2.0 through fw-v2.4.0 shipped without watch,
        # dash, and dash-modes and nothing went red. Lesson:
        # .github/RELEASE_LESSONS.md 2026-07-28 (i).
        #
        # The FQBN is the dash-core3 profile's own value (the profiles remain
        # the documented bench path for IDE/CLI users). Board inference picks
        # the dash flavor from the generic esp32s3 board.
        #
        # `modes` is the exception, and it bites: it builds on the dash board
        # — the same physical 4.3B the PlatformIO canary-display-dash-modes
        # env targets — but the gear flags (FEATURE_DEVMODE / DEMO_MODE /
        # DEBUG_MODE / ARCADE) live in the git-ignored flavor_local.h, and
        # CD_GEARS_COMPILED_IDENTITY — which is what makes the image identify
        # as dash-modes instead of plain dash — is derived from them
        # (config.h). Compile without staging and you get a GEARLESS DASH
        # binary labeled dash-modes: flashing it strips the modes build, and
        # OTA-ing it onto a real modes unit cross-grades that unit down.
        # `setup.sh flavor` writes only that one gitignored file, and the
        # assemble step's product-string check proves the identity before any
        # manifest is signed.
        #
        # Non-blocking on purpose: a display build hiccup only drops those
        # products from the browser flasher (build_flash_manifest warns
        # per-variant) — it must never sink the signed OTA release around it.
        run: |
          cd firmware/projects/canary-display/arduino/canary_display
          LIBDIR="$(arduino-cli config get directories.user)/libraries"
          mkdir -p "${LIBDIR}"
          cp lv_conf.h "${LIBDIR}/lv_conf.h"
          # CDCOnBoot=cdc, NOT default: with `default` the core maps `Serial` to
          # UART0 (the GPIO pins), so a released S3 image prints to a header
          # nobody has wired and the app's serial monitor sits silent — which is
          # exactly what "the monitor doesn't work for some firmwares" was. The
          # PlatformIO bench builds these same boards with
          # -DARDUINO_USB_CDC_ON_BOOT=1 (envs/platformio/common.ini), so
          # `default` here meant release and bench disagreed about where the
          # console goes. Same release-vs-bench drift that kept the display
          # firmware out of five releases; see RELEASE_LESSONS (i).
          # C3/C6 are the opposite case and must NOT get this — they provide
          # Serial on USB-Serial/JTAG and the flag prevents it (common.ini -U).
          DASH_FQBN='esp32:esp32:esp32s3:PSRAM=opi,FlashSize=16M,PartitionScheme=huge_app,CDCOnBoot=cdc,USBMode=hwcdc'
          for P in dash modes; do
            if [ "$P" = modes ]; then
              ../../setup.sh flavor modes
            else
              # No override: board inference picks dash. Explicit so the
              # loop is order-independent and a re-run can't inherit a
              # stale staging.
              rm -f flavor_local.h
            fi
            if ! arduino-cli compile --fqbn "$DASH_FQBN" \
                --output-dir "/tmp/display-${P}-build" canary_display.ino; then
              echo "::warning::canary-display '${P}' build failed — absent from the browser flasher this release"
            fi
          done
          rm -f flavor_local.h

      - name: Build canary-display board envs (PlatformIO, non-blocking)
        working-directory: firmware/projects/canary-display
        # The Nightstand Line boards (dash7 / nightstand-s3 / nightstand-c6)
        # release from their PlatformIO envs — the same envs firmware.yml
        # compiles on every push — because each board's pins and flash
        # geometry live in the env, not in a sketch profile: there is no
        # flavor_local.h staging to get wrong (the trap the `modes` profile
        # comment above documents), and SECURACV_OTA_PRODUCT is compiled in
        # per env so the product-string guard below stays meaningful.
        #
        # Non-blocking, like the profile builds above: a failed env drops
        # those products from this release instead of sinking the signed OTA
        # release around it.
        #
        # The pioarduino core-3.x envs (dash7 for its RGB bounce buffers,
        # the C6 for its chip) cannot share a core dir with the
        # espressif32@6.9.0 envs — each pioarduino build gets its own
        # PLATFORMIO_CORE_DIR, exactly as firmware.yml isolates them (the
        # two platforms ship framework-arduinoespressif32 at incompatible
        # versions and corrupt each other's core dir).
        run: |
          # Generic release build: placeholder secrets ON PURPOSE — same
          # NVS-backed runtime-config scheme as canary-vision above.
          mkdir -p secrets
          cat > secrets/secrets.h << 'HEADER'
          #pragma once
          // Generic OTA release build. Real credentials live in device NVS.
          #define WIFI_SSID "ci-placeholder"
          #define WIFI_PASS "ci-placeholder"
          #define MQTT_HOST "127.0.0.1"
          #define MQTT_PORT 1883
          #define MQTT_USER nullptr
          #define MQTT_PASS nullptr
          HEADER
          # PlatformIO wipes the whole .pio/build workspace when the project
          # checksum changes — and the C6 run's PLATFORMIO_CORE_DIR below
          # changes exactly that. fw-v2.3.0 shipped without dash7 and
          # nightstand-s3 this way: both compiled SUCCESS, then the C6 build
          # cleaned the workspace and the packaging step found no binaries
          # ("produced no binary", non-blocking, gone). Stage each env's
          # outputs the moment it builds, and restore them after the C6 run
          # so the packaging steps read the same .pio/build paths as always.
          STAGE=/tmp/pio-display-staged
          mkdir -p "$STAGE"
          # dash7 rides the pioarduino core-3 platform (canary-display.ini —
          # the RGB bounce-buffer pairing) and cannot share a core dir with
          # the espressif32 envs, exactly like the C6. It builds FIRST: its
          # CORE_DIR switch changes the project checksum and wipes
          # .pio/build, so it must never run after an env whose outputs
          # aren't staged yet.
          if PLATFORMIO_CORE_DIR="$GITHUB_WORKSPACE/.pio-core-display-pio3" \
              pio run -e canary-display-dash7; then
            rm -rf "${STAGE:?}/canary-display-dash7"
            cp -R ".pio/build/canary-display-dash7" "$STAGE/canary-display-dash7"
          else
            echo "::warning::canary-display-dash7 build failed — its product is absent from this release"
          fi
          # The bedside sibling on the SAME 7" glass rides the SAME core-3
          # platform, so it must build inside this core dir too — right after
          # dash7 and before the espressif32 envs below reclaim the default
          # core dir.
          if PLATFORMIO_CORE_DIR="$GITHUB_WORKSPACE/.pio-core-display-pio3" \
              pio run -e canary-display-nightstand7; then
            rm -rf "${STAGE:?}/canary-display-nightstand7"
            cp -R ".pio/build/canary-display-nightstand7" "$STAGE/canary-display-nightstand7"
          else
            echo "::warning::canary-display-nightstand7 build failed — its product is absent from this release"
          fi
          for E in canary-display-nightstand-s3 canary-display-touch169 canary-display-amoled241 canary-display-nightlight-c3; do
            if pio run -e "$E"; then
              rm -rf "${STAGE:?}/$E"
              cp -R ".pio/build/$E" "$STAGE/$E"
            else
              echo "::warning::${E} build failed — its product is absent from this release"
            fi
          done
          if ! PLATFORMIO_CORE_DIR="$GITHUB_WORKSPACE/.pio-core-canary-display-nightstand-c6" \
              pio run -e canary-display-nightstand-c6; then
            echo "::warning::canary-display-nightstand-c6 build failed — its product is absent from this release"
          fi
          mkdir -p .pio/build
          cp -R "$STAGE"/. .pio/build/

      - name: Assemble, sign, and verify release artifacts
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/release
          DL="https://github.com/${REPO}/releases/download/${TAG}"
          RELURL="https://github.com/${REPO}/releases/tag/${TAG}"

          # Release notes for the manifests: the CHANGELOG section for this
          # version when present, otherwise a generic line.
          # awk -v passes VERSION as DATA, not spliced into the program text —
          # a tag with awk/shell metacharacters can't alter the program (repo
          # anti-injection rule). `\\[`/`\\]` are literal brackets in the regex.
          NOTES=$(awk -v ver="$VERSION" '$0 ~ ("^## \\[" ver "\\]") {found=1; next} /^## \[/ {if (found) exit} found {print}' CHANGELOG.md | head -c 400 || true)
          if [ -z "$NOTES" ]; then
            NOTES="SecuraCV Canary firmware ${VERSION}."
          fi

          # canary (release_ha is the recommended image: full sensing + HA MQTT)
          cp firmware/canary/.pio/build/release_ha/firmware.bin "/tmp/release/canary-${VERSION}.bin"
          # Slot-budget check on the EXACT bytes being published, not the PR
          # build's (a tag is not a branch; fw-v2.4.6 shipped an image PR CI
          # never measured). Deliberately fatal for the flagship: an aborted
          # release beats stranding every fielded canary — the per-variant
          # loops below degrade to a skip instead.
          python firmware/scripts/check_slot_budget.py --env release_ha "/tmp/release/canary-${VERSION}.bin"
          python firmware/scripts/ota_release.py manifest \
            --private-key /tmp/releaser.pem \
            --product securacv-canary \
            --version "${VERSION}" \
            --url "${DL}/canary-${VERSION}.bin" \
            --release-notes "$NOTES" \
            --release-url "$RELURL" \
            --out /tmp/release/manifest-canary.json \
            "/tmp/release/canary-${VERSION}.bin"

          # canary-wap (the WAP sketch reports versions with a -wap suffix).
          # Budget keyed by the env PR CI builds (canary-wap-default) — the
          # arduino-cli sketch build here is the same product in the same
          # default_8MB slots, and the check measures the staged bytes.
          cp /tmp/wap-build/canary_wap.ino.bin "/tmp/release/canary-wap-${VERSION}.bin"
          python firmware/scripts/check_slot_budget.py --env canary-wap-default "/tmp/release/canary-wap-${VERSION}.bin"
          python firmware/scripts/ota_release.py manifest \
            --private-key /tmp/releaser.pem \
            --product securacv-canary-wap \
            --version "${VERSION}-wap" \
            --url "${DL}/canary-wap-${VERSION}.bin" \
            --release-notes "$NOTES" \
            --release-url "$RELURL" \
            --out /tmp/release/manifest-canary-wap.json \
            "/tmp/release/canary-wap-${VERSION}.bin"

          # canary-vision (generic builds — identity/credentials come from NVS).
          # One OTA product per host board: the engine's product check makes
          # a manifest for one board un-installable on another (the boards
          # differ in I2C pins or MCU entirely).
          for B in default xiao-c3 xiao-s3; do
            if [ "$B" = default ]; then SUFFIX=""; else SUFFIX="-$B"; fi
            cp "firmware/projects/canary-vision/.pio/build/canary-vision-${B}/firmware.bin" \
              "/tmp/release/canary-vision${SUFFIX}-${VERSION}.bin"
            if ! python firmware/scripts/check_slot_budget.py --env "canary-vision-${B}" \
                "/tmp/release/canary-vision${SUFFIX}-${VERSION}.bin"; then
              echo "::warning::canary-vision${SUFFIX} exceeds its OTA slot budget — left out of this release rather than offering fielded boards an image their slots cannot hold"
              rm -f "/tmp/release/canary-vision${SUFFIX}-${VERSION}.bin"
              continue
            fi
            python firmware/scripts/ota_release.py manifest \
              --private-key /tmp/releaser.pem \
              --product "securacv-canary-vision${SUFFIX}" \
              --version "${VERSION}" \
              --url "${DL}/canary-vision${SUFFIX}-${VERSION}.bin" \
              --release-notes "$NOTES" \
              --release-url "$RELURL" \
              --out "/tmp/release/manifest-canary-vision${SUFFIX}.json" \
              "/tmp/release/canary-vision${SUFFIX}-${VERSION}.bin"
          done

          # canary-sense (generic builds — identity/credentials come from NVS).
          # One OTA product per flavor: the presence-only and wellbeing images
          # must never cross-install (different privacy surface) — the
          # engine's product check enforces it.
          for F in default wellbeing; do
            if [ "$F" = default ]; then SUFFIX=""; else SUFFIX="-$F"; fi
            cp "firmware/projects/canary-sense/.pio/build/canary-sense-${F}/firmware.bin" \
              "/tmp/release/canary-sense${SUFFIX}-${VERSION}.bin"
            if ! python firmware/scripts/check_slot_budget.py --env "canary-sense-${F}" \
                "/tmp/release/canary-sense${SUFFIX}-${VERSION}.bin"; then
              echo "::warning::canary-sense${SUFFIX} exceeds its OTA slot budget — left out of this release rather than offering fielded boards an image their slots cannot hold"
              rm -f "/tmp/release/canary-sense${SUFFIX}-${VERSION}.bin"
              continue
            fi
            python firmware/scripts/ota_release.py manifest \
              --private-key /tmp/releaser.pem \
              --product "securacv-canary-sense${SUFFIX}" \
              --version "${VERSION}" \
              --url "${DL}/canary-sense${SUFFIX}-${VERSION}.bin" \
              --release-notes "$NOTES" \
              --release-url "$RELURL" \
              --out "/tmp/release/manifest-canary-sense${SUFFIX}.json" \
              "/tmp/release/canary-sense${SUFFIX}-${VERSION}.bin"
          done

          # canary-display (watch / dash / dash-modes) — the flavors CI builds
          # above. Without these, every display board polls a manifest URL that
          # no release carries (config.h SECURACV_OTA_MANIFEST_URL): USB-flashable
          # but structurally unable to self-update.
          #
          # Non-blocking, for the same reason the display BUILD step is: a flavor
          # that didn't compile is left OUT of the release rather than sinking the
          # signed OTA release around it. A flavor whose binary doesn't carry THIS
          # version is also left out — publishing that manifest would have devices
          # install the image, boot reporting the old version, witness it as a
          # rollback, and be offered the same update forever.
          #
          # The other flavors in config.h (watch-modes, nightstand, bare
          # canary-display) have no sketch.yaml profile, so they have no published
          # channel yet — declared, not accidental: check_ota_channels.py holds
          # that list and fails if a NEW flavor appears with neither.
          # Stage the PlatformIO board-env display builds (the Nightstand
          # Line: dash7 / nightstand-s3 / nightstand-c6) into the same
          # /tmp/display-<name>-build layout the profile builds use, so ONE
          # loop below applies the version-string and product-string guards
          # to every display flavor identically. A missing .pio build (its
          # env failed above) simply stages nothing and the loop's existing
          # "produced no binary" warning covers it.
          for E in dash7 nightstand7 nightstand-s3 nightstand-c6 touch169 amoled241 nightlight-c3; do
            SRC="firmware/projects/canary-display/.pio/build/canary-display-${E}/firmware.bin"
            if [ -s "$SRC" ]; then
              mkdir -p "/tmp/display-${E}-build"
              cp "$SRC" "/tmp/display-${E}-build/canary_display.ino.bin"
            fi
          done

          DISPLAY_INDEX=""
          for D in "watch:watch" "dash:dash" "dash-modes:modes" "dash7:dash7" "nightstand7:nightstand7" "nightstand-s3:nightstand-s3" "nightstand-c6:nightstand-c6" "touch169:touch169" "amoled241:amoled241" "nightlight-c3:nightlight-c3"; do
            NAME="${D%%:*}"; DIR="${D##*:}"
            SRC="/tmp/display-${DIR}-build/canary_display.ino.bin"
            OUT="/tmp/release/canary-display-${NAME}-${VERSION}.bin"
            if [ ! -s "$SRC" ]; then
              echo "::warning::canary-display ${NAME} produced no binary — absent from this OTA release (it cannot self-update until the next release carries it)"
              continue
            fi
            cp "$SRC" "$OUT"
            if ! strings "$OUT" | grep -qFx "${VERSION}"; then
              echo "::warning::canary-display ${NAME} binary does not carry the version string '${VERSION}' — skipping its OTA manifest (bump CANARY_FW_VERSION in firmware/projects/canary-display/arduino/canary_display/version.h)"
              rm -f "$OUT"
              continue
            fi
            # The binary must AGREE that it is this product. SECURACV_OTA_PRODUCT
            # is compiled in, and for `modes` it is derived from the gear flags —
            # so a modes build that didn't get flavor_local.h staged reports
            # "securacv-canary-display-dash" and this catches it. Publishing a
            # manifest whose product the image doesn't claim is how you
            # cross-grade a modes unit down to gearless dash: the engine's
            # product check passes (it trusts the manifest), the gears vanish,
            # and the device polls as plain dash forever after.
            if ! strings "$OUT" | grep -qFx "securacv-canary-display-${NAME}"; then
              echo "::warning::canary-display ${NAME} binary does not identify as 'securacv-canary-display-${NAME}' — skipping its OTA manifest rather than publishing a mislabeled image (a modes build needs 'setup.sh flavor modes' staged before compiling)"
              rm -f "$OUT"
              continue
            fi
            # The image must FIT the slot the fielded boards would install it
            # into — measured on these exact bytes, budgets from flavors.json
            # size_guards (the nightlight-c3 ceiling is deliberately the OLD
            # 0x1E0000 table; see canary-display.ini before raising it).
            if ! python firmware/scripts/check_slot_budget.py --env "canary-display-${NAME}" "$OUT"; then
              echo "::warning::canary-display ${NAME} exceeds its OTA slot budget — skipping its OTA manifest rather than offering fielded boards an image their slots cannot hold"
              rm -f "$OUT"
              continue
            fi
            python firmware/scripts/ota_release.py manifest \
              --private-key /tmp/releaser.pem \
              --product "securacv-canary-display-${NAME}" \
              --version "${VERSION}" \
              --url "${DL}/canary-display-${NAME}-${VERSION}.bin" \
              --release-notes "$NOTES" \
              --release-url "$RELURL" \
              --out "/tmp/release/manifest-canary-display-${NAME}.json" \
              "$OUT"
            python firmware/scripts/ota_release.py verify \
              --pubkey firmware/common/ota/src/ota_release_key.h \
              --manifest "/tmp/release/manifest-canary-display-${NAME}.json" \
              "$OUT"
            DISPLAY_INDEX="${DISPLAY_INDEX} securacv-canary-display-${NAME}=${DL}/manifest-canary-display-${NAME}.json"
            echo "canary-display ${NAME}: signed and verified for OTA."
          done

          # Variant index (tooling + future variants). $DISPLAY_INDEX is
          # deliberately unquoted — it word-splits into one arg per display
          # flavor that actually built, and is empty when none did.
          # shellcheck disable=SC2086
          python firmware/scripts/ota_release.py index \
            "securacv-canary=${DL}/manifest-canary.json" \
            "securacv-canary-wap=${DL}/manifest-canary-wap.json" \
            "securacv-canary-vision=${DL}/manifest-canary-vision.json" \
            "securacv-canary-vision-xiao-c3=${DL}/manifest-canary-vision-xiao-c3.json" \
            "securacv-canary-vision-xiao-s3=${DL}/manifest-canary-vision-xiao-s3.json" \
            "securacv-canary-sense=${DL}/manifest-canary-sense.json" \
            "securacv-canary-sense-wellbeing=${DL}/manifest-canary-sense-wellbeing.json" \
            ${DISPLAY_INDEX} \
            --out /tmp/release/manifest-index.json

          # Verify every signature against the COMMITTED public key before
          # publishing — exactly what devices in the field will do.
          python firmware/scripts/ota_release.py verify \
            --pubkey firmware/common/ota/src/ota_release_key.h \
            --manifest /tmp/release/manifest-canary.json \
            "/tmp/release/canary-${VERSION}.bin"
          python firmware/scripts/ota_release.py verify \
            --pubkey firmware/common/ota/src/ota_release_key.h \
            --manifest /tmp/release/manifest-canary-wap.json \
            "/tmp/release/canary-wap-${VERSION}.bin"
          for B in "" "-xiao-c3" "-xiao-s3"; do
            python firmware/scripts/ota_release.py verify \
              --pubkey firmware/common/ota/src/ota_release_key.h \
              --manifest "/tmp/release/manifest-canary-vision${B}.json" \
              "/tmp/release/canary-vision${B}-${VERSION}.bin"
          done
          for B in "" "-wellbeing"; do
            python firmware/scripts/ota_release.py verify \
              --pubkey firmware/common/ota/src/ota_release_key.h \
              --manifest "/tmp/release/manifest-canary-sense${B}.json" \
              "/tmp/release/canary-sense${B}-${VERSION}.bin"
          done

          # Guard against a forgotten version bump: the compiled-in
          # FIRMWARE_VERSION literal must match the manifest version, or
          # devices would install this image, boot with the old version
          # string, witness it as a rollback, and keep being offered the
          # same update forever.
          if ! strings "/tmp/release/canary-${VERSION}.bin" | grep -qFx "${VERSION}"; then
            echo "::error::canary binary does not contain the version string '${VERSION}'. Bump FIRMWARE_VERSION in firmware/canary/include/canary_config.h before tagging."
            exit 1
          fi
          if ! strings "/tmp/release/canary-wap-${VERSION}.bin" | grep -qFx "${VERSION}-wap"; then
            echo "::error::canary-wap binary does not contain the version string '${VERSION}-wap'. Bump FIRMWARE_VERSION in canary_wap.ino before tagging."
            exit 1
          fi
          for B in "" "-xiao-c3" "-xiao-s3"; do
            if ! strings "/tmp/release/canary-vision${B}-${VERSION}.bin" | grep -qFx "${VERSION}"; then
              echo "::error::canary-vision${B} binary does not contain the version string '${VERSION}'. Bump CANARY_FW_VERSION in firmware/projects/canary-vision/include/canary/version.h before tagging."
              exit 1
            fi
          done
          for B in "" "-wellbeing"; do
            if ! strings "/tmp/release/canary-sense${B}-${VERSION}.bin" | grep -qFx "${VERSION}"; then
              echo "::error::canary-sense${B} binary does not contain the version string '${VERSION}'. Bump CANARY_FW_VERSION in firmware/projects/canary-sense/include/canary/version.h before tagging."
              exit 1
            fi
          done

          (cd /tmp/release && sha256sum ./*.bin ./*.json > sha256sums.txt)
          ls -la /tmp/release

      - name: Extract release notes from CHANGELOG
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # awk -v passes VERSION as data (anti-injection); see the NOTES step.
          awk -v ver="$VERSION" '$0 ~ ("^## \\[" ver "\\]") {found=1; next} /^## \[/ {if (found) exit} found {print}' CHANGELOG.md > /tmp/release_notes.md || true
          if [ ! -s /tmp/release_notes.md ]; then
            {
              echo "SecuraCV Canary firmware ${VERSION}."
              echo ""
              echo "Devices with the signed pull-OTA engine pick this release up"
              echo "automatically within 24 hours, or immediately via the Install"
              echo "button in Home Assistant / the device dashboard."
            } > /tmp/release_notes.md
          fi

      - name: Build browser-flasher factory images + manifest
        # Additive and non-blocking: the browser flasher (canary-local/flash.html)
        # writes a *blank* board over USB, so it needs a single image containing
        # the bootloader + partition table + app (the OTA channel ships app-only
        # binaries). build_flash_manifest.py merges them (reading each variant's
        # own partition table, so layouts can't drift) and writes a
        # manifest-flash.json the page fetches. A per-variant hiccup only drops
        # that product from the flasher — it never fails the signed OTA release
        # above. The same script backs the manual flasher-release.yml workflow,
        # so the two paths can't diverge.
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          NOTES="$(head -c 400 /tmp/release_notes.md 2>/dev/null || true)"
          python3 firmware/scripts/build_flash_manifest.py \
            --version "$VERSION" \
            --repo "${{ github.repository }}" \
            --tag "${{ steps.ver.outputs.tag }}" \
            --out-dir /tmp/release \
            --notes "$NOTES" \
            --signing-key /tmp/releaser.pem
          # sha256sums.txt was written by the assemble step BEFORE these assets
          # existed; regenerate it so the advertised checksum set covers the
          # factory images and manifest-flash.json too (nothing published here
          # is left out of the integrity file).
          (cd /tmp/release && sha256sum ./*.bin ./*.json > sha256sums.txt)
          ls -la /tmp/release/*-factory.bin /tmp/release/manifest-flash.json || true

      - name: No product silently drops out of the flasher between releases
        # The build matrix above is deliberately non-blocking — one SKU's
        # compile failure must not sink the signed release. This is the other
        # half of that bargain: before anything publishes, the fresh
        # manifest-flash.json is diffed against the PREVIOUS release's, and a
        # product that used to ship but is now missing fails the run unless it
        # was named in the allow_dropped_products input (the explicit "ship
        # without it" sign-off). Dev-channel prereleases report but never
        # block. First release (no previous manifest) skips cleanly.
        #
        # The tag-push path has no inputs and a re-run keeps them empty, so
        # the sign-off there is the ALLOW_DROPPED_PRODUCTS repository
        # variable (Settings → Secrets and variables → Actions → Variables):
        # set it, re-run the failed job, then clear it — a standing value
        # would silently wave the next accidental drop through too.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALLOW_DROPPED: ${{ inputs.allow_dropped_products || vars.ALLOW_DROPPED_PRODUCTS || '' }}
          THIS_TAG: ${{ steps.ver.outputs.tag }}
          CHANNEL: ${{ steps.ver.outputs.channel }}
        run: |
          set -euo pipefail
          # Newest published stable fw-v* release that is not the one being cut.
          PREV_TAG="$(gh release list --limit 100 \
              --json tagName,isPrerelease,isDraft \
              -q '.[] | select(.isPrerelease | not) | select(.isDraft | not) | .tagName' \
            | grep '^fw-v' | grep -vx "$THIS_TAG" | head -1 || true)"
          if [ -z "$PREV_TAG" ]; then
            echo "No previous stable fw-v* release found — completeness gate skipped (first release)."
            exit 0
          fi
          if ! gh release download "$PREV_TAG" --pattern manifest-flash.json \
              --output /tmp/prev-manifest-flash.json; then
            echo "::warning::previous release $PREV_TAG carries no manifest-flash.json — completeness gate skipped"
            exit 0
          fi
          EXTRA=""
          [ "$CHANNEL" = "dev" ] && EXTRA="--advisory"
          python3 firmware/scripts/check_manifest_completeness.py \
            --current /tmp/release/manifest-flash.json \
            --previous /tmp/prev-manifest-flash.json \
            --allow-dropped "$ALLOW_DROPPED" \
            $EXTRA

      - name: Attest build provenance (SLSA) for the published artifacts
        # Sign an in-toto provenance statement binding every published .bin /
        # manifest / checksum to THIS workflow run + commit via GitHub's OIDC
        # identity, and log it to the Sigstore Rekor public transparency log.
        # This complements — doesn't replace — the two integrity checks already
        # here: the Ed25519 OTA signature devices verify, and sha256sums.txt.
        # What it adds is a public, tamper-evident record of *who built what,
        # from which commit, in which workflow* — verifiable by anyone with
        #   gh attestation verify <file> --repo ${{ github.repository }}
        # See docs/supply_chain_transparency.md.
        id: attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            /tmp/release/*.bin
            /tmp/release/*.json
            /tmp/release/sha256sums.txt

      - name: Stage the provenance bundle for offline verification
        # Ship the Sigstore bundle as a release asset too, so an air-gapped user
        # can verify provenance with no network (--bundle instead of --repo):
        #   gh attestation verify <file> \
        #     --bundle provenance-firmware-${{ steps.ver.outputs.version }}.sigstore.jsonl
        run: cp "${{ steps.attest.outputs.bundle-path }}" "/tmp/release/provenance-firmware-${{ steps.ver.outputs.version }}.sigstore.jsonl"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          # On a tag push this is the pushed tag; on the one-click path it
          # creates this tag. target_commitish pins the created tag to the
          # exact commit we checked out and BUILT (github.sha) — without it the
          # create-release API defaults the new tag to the repo's default
          # branch, so a dispatch from another ref (or main advancing during
          # the ~90-min build) could point the tag/source archive at a
          # different commit than the binaries + attestation. Ignored by the
          # API when the tag already exists, so the tag-push path is unchanged.
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "Canary Firmware ${{ steps.ver.outputs.version }}${{ steps.ver.outputs.prerelease == 'true' && ' (dev channel)' || '' }}"
          prerelease: ${{ steps.ver.outputs.prerelease }}
          body_path: /tmp/release_notes.md
          files: |
            /tmp/release/canary-${{ steps.ver.outputs.version }}.bin
            /tmp/release/manifest-flash.json
            /tmp/release/*-factory.bin
            /tmp/release/canary-wap-${{ steps.ver.outputs.version }}.bin
            /tmp/release/canary-vision-${{ steps.ver.outputs.version }}.bin
            /tmp/release/canary-vision-xiao-c3-${{ steps.ver.outputs.version }}.bin
            /tmp/release/canary-vision-xiao-s3-${{ steps.ver.outputs.version }}.bin
            /tmp/release/canary-sense-${{ steps.ver.outputs.version }}.bin
            /tmp/release/canary-sense-wellbeing-${{ steps.ver.outputs.version }}.bin
            /tmp/release/canary-display-*-${{ steps.ver.outputs.version }}.bin
            /tmp/release/manifest-canary-display-*.json
            /tmp/release/manifest-canary.json
            /tmp/release/manifest-canary-wap.json
            /tmp/release/manifest-canary-vision.json
            /tmp/release/manifest-canary-vision-xiao-c3.json
            /tmp/release/manifest-canary-vision-xiao-s3.json
            /tmp/release/manifest-canary-sense.json
            /tmp/release/manifest-canary-sense-wellbeing.json
            /tmp/release/manifest-index.json
            /tmp/release/sha256sums.txt
            /tmp/release/provenance-firmware-${{ steps.ver.outputs.version }}.sigstore.jsonl

      # A fresh stable fw-v* release takes releases/latest the moment it
      # publishes — correctly, it IS firmware — but it is born WITHOUT the
      # mirrored Flasher updater manifest keep-firmware-latest maintains there
      # for desktop Flashers ≤ 0.3.0 (they poll
      # releases/latest/download/latest.json; the action's header tells the
      # whole story). Being CI-created, this release fires no `release:` event
      # for release-latest-guard.yml to see (GitHub's recursion guard), so
      # call the action directly — and do it HERE, immediately after publish:
      # the vision-model chain below polls for up to 20 minutes and can even
      # ride into the job timeout, and every minute the manifest is missing is
      # a minute the stranded updaters 404 against the release that just took
      # `latest`.
      - name: Keep releases/latest healthy (firmware + stranded-Flasher manifest)
        uses: ./.github/actions/keep-firmware-latest
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          context: ${{ steps.ver.outputs.tag }} publish

      # vision-model-release.yml's `release: [published]` trigger looks like it
      # covers this release — it doesn't. GitHub suppresses workflow events for
      # anything created with the workflow's own GITHUB_TOKEN (the recursion
      # guard), so a CI-published release never fires it: fw-v2.3.0 shipped
      # without manifest-vision-model.json this way, and the Vision module
      # flasher 404'd on every install while the "anti-rot" trigger sat idle —
      # it had only ever fired for the early human-published releases. Chain
      # the dispatch explicitly instead; the event trigger stays for the
      # human-publish path, and the workflow's per-tag concurrency group
      # de-dupes if both ever fire.
      - name: Attach the pinned Vision model asset (chained dispatch, verified)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run vision-model-release.yml \
            --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" \
            -f tag="$TAG"
          # `gh workflow run` is fire-and-forget; a green firmware run with a
          # 404ing model manifest is the exact failure this chain exists to
          # prevent. So wait for the asset to actually land on the release
          # before calling the release done. The model build is a few minutes
          # (30-min timeout on its side); poll well past that before going red.
          for _ in $(seq 1 60); do
            if gh release view "$TAG" --json assets \
                 -q '.assets[].name' | grep -qx "manifest-vision-model.json"; then
              echo "manifest-vision-model.json attached to $TAG"
              exit 0
            fi
            sleep 20
          done
          echo "::error::vision model asset never landed on $TAG — the chained vision-model-release.yml run failed or stalled. The firmware is published but the Vision module flasher will 404 until it is attached; re-run via Actions → Vision Model Asset with tag=$TAG."
          exit 1

      # The dev channel's stable address. Only the MANIFESTS are mirrored —
      # each manifest's binary URL points at the real fw-v*-dev.* tag's
      # assets, so nothing is duplicated and old dev binaries stay where
      # they were published. Devices opt in by pointing manifest_url at
      # releases/download/fw-dev-latest/manifest-<product>.json.
      - name: Mirror channel manifests to the rolling dev release
        if: steps.ver.outputs.prerelease == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: fw-dev-latest
          name: Canary Firmware — dev channel (rolling)
          prerelease: true
          body: |
            Rolling pointer for the **dev update channel** — always the most
            recent `fw-v*-dev.*` / `fw-v*-rc.*` prerelease's manifests.
            Devices on the release channel never see this: their manifest
            URL rides `releases/latest`, which GitHub never points at
            prereleases. Currently: **${{ steps.ver.outputs.version }}**.
            See docs/RELEASE_PROCESS.md.
          files: |
            /tmp/release/manifest-flash.json
            /tmp/release/manifest-canary.json
            /tmp/release/manifest-canary-wap.json
            /tmp/release/manifest-canary-vision.json
            /tmp/release/manifest-canary-vision-xiao-c3.json
            /tmp/release/manifest-canary-vision-xiao-s3.json
            /tmp/release/manifest-canary-sense.json
            /tmp/release/manifest-canary-sense-wellbeing.json
            /tmp/release/manifest-canary-display-*.json
            /tmp/release/manifest-index.json
            /tmp/release/sha256sums.txt
