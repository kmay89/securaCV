name: Workflow Lint

# The CI config is code too — two gates keep it honest:
#
#   · actionlint — syntax, expressions, impossible `if:`s, and shellcheck
#     on every run: block, so a broken workflow fails the PR that
#     introduces it instead of silently mis-running later.
#   · CI policy — .github/scripts/ci_policy_check.py enforces the general
#     rules in .github/CI.md (permissions, timeouts, concurrency, pinned
#     actions, path filters) on every workflow, current and FUTURE. New
#     workflows can't regress the conventions; exemptions live in
#     .github/ci-policy.yml where review can see them.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/scripts/**'
      - '.github/ci-policy.yml'
      - '.github/release-targets.yml'
      - '.github/CI.md'
      - '.github/actionlint.yaml'
      - '.github/actionlint.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/scripts/**'
      - '.github/ci-policy.yml'
      - '.github/release-targets.yml'
      - '.github/CI.md'
      - '.github/actionlint.yaml'
      - '.github/actionlint.yml'

permissions:
  contents: read

concurrency:
  # PRs collapse per branch; each main commit gets its own group, so a burst
  # of merges can never evict the main run queued behind another (CI.md R3).
  group: workflows-lint-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Pinned image; bundles shellcheck + pyflakes for run: block linting.
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  ci-policy:
    name: CI policy (.github/CI.md)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: pyproject.toml
      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml
      - name: Enforce the CI ground rules on every workflow
        run: python3 .github/scripts/ci_policy_check.py

      # The "Update everything" button decides what ships. That decision is
      # code (.github/scripts/release_plan.py), so it is tested like code — and
      # the suite also checks the CATALOG against this repo: every workflow it
      # names exists, every version file it points at is readable, and the
      # site's watch list still matches what pages.yml actually deploys. That
      # is what stops the button rotting into a wrong answer.
      - name: Unit-test the release-plan engine (and its catalog)
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
