name: Enclosure CAD

# Render the parametric OpenSCAD enclosures and verify the meshes whenever the
# CAD sources change, so a PR can't silently break the geometry. Catches what
# bit v0.6: configs that stop rendering, CGAL/manifold warnings, and STLs that
# export as multiple shells.

on:
  push:
    branches: [ "main" ]
    paths:
      - "docs/hardware/enclosure/**"
      - ".github/workflows/enclosure.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "docs/hardware/enclosure/**"
      - ".github/workflows/enclosure.yml"

permissions:
  contents: read

# A new push to a PR branch supersedes the in-flight render; main is never
# canceled (full signal per main commit).
concurrency:
  # PRs collapse per branch; each main commit gets its own group, so a burst
  # of merges can never evict the main run queued behind another (CI.md R3).
  group: enclosure-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  render:
    name: Render + mesh check
    runs-on: ubuntu-latest
    # Renders + mesh checks only. The seated-fit suite used to live here and
    # was the long pole by far; it now has its own job (see `fit` below), so
    # this one reports in minutes instead of waiting on it.
    timeout-minutes: 40
    defaults:
      run:
        working-directory: docs/hardware/enclosure
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: pyproject.toml

      - name: Web-builder manifest is in sync with the sources
        run: python3 gen_builder_manifest.py --check

      # The 7" case debosses its own revision. gen_stamp.py refuses to
      # regenerate when the geometry moved and STAMP_REV did not, so a stale
      # stamp cannot reach a print: either the committed file is out of date
      # (caught here) or the revision was never bumped (caught by the
      # generator, locally and here).
      - name: Build stamp matches the geometry it claims
        run: python3 gen_stamp.py --check

      # The shipped bird artwork is generated from canary_mark_lib.scad, so
      # the mark cannot be redrawn in the CAD and left stale in the SVG that
      # goes out for engraving and laser work. Pure Python arithmetic — no
      # OpenSCAD — so the bytes do not move with the renderer's version.
      - name: House-mark artwork matches the mark it is drawn from
        run: python3 gen_mark_svg.py --check

      - name: Install OpenSCAD + admesh
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openscad admesh

      # The measured assembled envelopes the fleet-figure ledger reads for
      # multi-part devices (gen_figures.mjs cannot run OpenSCAD, so the
      # measurement is committed here where the toolchain lives). Re-measures
      # each device's fit-checked assembled union and fails if an STL moved
      # out from under the committed numbers.
      - name: Assembled envelopes match the committed parts
        run: python3 gen_assembled_dims.py --check

      # The design-language gate: every canonical Customizer default (corner
      # radius, edge stages, walls, feature vocabulary, tolerances) either
      # equals the house value canary_core_lib states, or explains itself
      # with a `deviates:` comment on its own line — and a case may not
      # redefine a module the libraries own. "A departure has to type its
      # own number AND say why", as a build failure instead of a sentence.
      - name: Design language — canonical defaults conform or explain themselves
        run: python3 ../../../scripts/lint_design_lang.py

      - name: Render all presets and parts
        run: |
          ./render.sh --no-png 2>&1 | tee render.log
          # OpenSCAD exits 0 on geometry warnings — treat them as failures.
          # (Benign CGAL cache statistics lines are not matched by these patterns.)
          ! grep -E 'ERROR|WARNING|Object isn.t a valid 2-manifold' render.log

      # Every released case, assembled and intersected. The mesh checks below
      # cannot see this class of defect at all: the pan-head pad that shipped
      # in all four cases overhung its post into the shell wall, holding each
      # front 1.0 mm proud so the lip never entered the cavity and the screws
      # clamped nothing — and every one of those parts was a watertight,
      # single-part, warning-free mesh. Only putting the halves together finds
      # it, which is what the 7" case has had a gate for and these did not.
      #
      # A PASSING check exits NON-ZERO (OpenSCAD returns non-zero whenever it
      # has nothing to export, which for an empty-expected gate IS success), so
      # this never joins the run and the test with &&, never judges by exit
      # status, and demands the empty MARKER rather than inferring a pass from
      # an absent file — a run killed by a timeout leaves the same nothing
      # behind as a clean pass.
      - name: Released cases actually close (assembled fit check)
        run: |
          status=0
          chk() {
            label=$1; shift
            rm -f /tmp/fc.stl
            out=$(openscad --export-format binstl -o /tmp/fc.stl "$@" \
                  canary_case_fitcheck.scad 2>&1) || true
            if printf '%s' "$out" | grep -qE 'ERROR|WARNING'; then
              echo "::error::$label — dirty render, nothing was verified"; status=1
            elif [ -f /tmp/fc.stl ]; then
              echo "::error::$label — the case does not close: the two halves intersect"
              admesh /tmp/fc.stl 2>/dev/null | grep -E 'Number of parts|Volume' || true
              status=1
            elif printf '%s' "$out" | grep -q 'Current top level object is empty'; then
              echo "ok: $label closes"
            else
              echo "::error::$label — no file and no empty marker; did it evaluate at all?"; status=1
            fi
          }
          chk sense          -D 'check="sense"'
          chk vision_indoor  -D 'check="vision_indoor"'  -D 'host="xiao"'   -D 'preset="vision_indoor"'
          chk vision_weather -D 'check="vision_weather"' -D 'host="xiao"'   -D 'preset="vision_weather"'
          chk vision_devkit  -D 'check="vision_devkit"'  -D 'host="devkit"' -D 'preset="vision_indoor"'
          chk doorbell       -D 'check="doorbell"'
          chk wap_battery    -D 'check="wap_battery"'  -D 'preset="battery_full"'
          chk wap_compact    -D 'check="wap_compact"'  -D 'preset="compact_plain"'
          chk wap_weather    -D 'check="wap_weather"'  -D 'preset="battery_weather"'
          # the pan head is one Customizer click away and puts the pad back in
          # the wall on a case whose default head is flat — so it is gated too
          chk wap_pan        -D 'check="wap_pan"'      -D 'preset="battery_full"' -D 'screw_head="pan"'
          exit $status

      - name: Verify STLs are watertight, with the expected number of parts
        run: |
          status=0
          # Almost everything here is ONE solid, and a second part means a
          # floating hook or a stray inlay. The exceptions are parts that are
          # genuinely a SET, and each states its count rather than opting out
          # of the check — a count is a regression guard, an exemption is not.
          #
          #   dev_s3_147_band.stl — the hallway stick's white light band: one
          #   continuous strip per long wall, so exactly 2. It was 8 when the
          #   ties across the seam were webs through the outer skin, which
          #   chopped the strip into 2.3 mm dashes; moving them to hidden
          #   inboard ribs made each side whole. If this ever reads 8 again,
          #   that regression is back.
          #   dev_c3_147_band.stl — the C3 pocket case's white light band:
          #   ONE continuous RING now, all four walls and all four corners,
          #   so the default count of 1 still applies. It was 3 strips with
          #   black corner bends until the first print showed the pipe going
          #   dark where it turns, and a U after that; if it ever reads 3
          #   again the corners have gone black, and that regression is back.
          #   dev_c3_147_*bezel.stl — TWO, and that is the design. The C3's
          #   light ring runs the full depth of the wall for the whole
          #   perimeter, which severs the face plate from the walls above it.
          #   Nothing yellow joins them; the BAND joins them, fused across
          #   ~290 mm2 at each face in the co-print, which is why band_ring
          #   forces band_clear = 0 and why this part is multi-material only.
          #   The count is still a guard and it works in BOTH directions: 1
          #   would mean the ring had broken back into a U and the USB end
          #   had gone dark, 3 would mean something else came loose.
          #   dev_c3_147_usba_*bezel.stl — TWO for the same reason, and the
          #   port axis does not change it: the ring still severs the face
          #   plate from the walls. What IS new there is the band, which stays
          #   at the default 1 — and that is the whole claim of the usb_a
          #   build's light ring. A series-A plug sits low enough to land on
          #   the band, so the ring dives UNDER the opening rather than
          #   stopping at it; 2 on dev_c3_147_usba_band.stl would mean the
          #   notch ate through and the plug wall went dark.
          expect_parts() {
            case "$1" in
              dev_s3_147_band.stl)      echo 2 ;;
              dev_s3_147_hdr_band.stl)  echo 2 ;;
              dev_c3_147_bezel.stl)     echo 2 ;;
              dev_c3_147_bare_bezel.stl) echo 2 ;;
              dev_c3_147_hdr_bezel.stl) echo 2 ;;
              dev_c3_147_usba_bezel.stl) echo 2 ;;
              dev_c3_147_usba_hdr_bezel.stl) echo 2 ;;
              *)                        echo 1 ;;
            esac
          }
          for f in *.stl; do
            want=$(expect_parts "$f")
            out=$(admesh "$f")
            parts=$(echo "$out" | sed -n 's/.*Number of parts *: *\([0-9]*\).*/\1/p')
            bad=$(echo "$out"   | sed -n 's/^Total disconnected facets *: *\([0-9]*\).*/\1/p')
            echo "$f: parts=$parts (want $want) disconnected=$bad"
            if [ "$parts" != "$want" ] || [ "$bad" != "0" ]; then
              echo "::error file=docs/hardware/enclosure/$f::bad mesh (parts=$parts, want $want, disconnected=$bad)"
              status=1
            fi
          done
          exit $status

      # Print 4 (kmay89) found this in the slicer, not here: both display
      # bezels carried a knob called `lid_edge`, commented "face edge
      # chamfer", whose cut had no taper in it — so it drew a square RABBET,
      # 0.80 mm deep, around the whole first-layer perimeter of a part that
      # prints face-down. An overhang, on the visible face, and it cost the
      # C3's face plate a fifth of its bed contact. A real foot chamfer is
      # fine and several cases have one; the script tells them apart by how
      # the footprint grows (continuously = taper, a jump = ledge).
      #
      # The parts are NAMED, not globbed, and the script's header says why:
      # a flat foot is a decision about the face-down bezels — where the
      # first layers ARE the finished front surface — and not a law the rest
      # of the catalog agreed to. Globbing would have meant either redrawing
      # other cases' deliberate flanges and roundovers or carrying a list of
      # exemptions, and an exempted gate is a gate that stops meaning
      # anything. Add a part here when you decide the rule binds it.
      - name: The face-down bezels have no modeled foot relief
        run: |
          python3 check_foot_relief.py \
            dev_c3_147_bezel.stl dev_c3_147_bare_bezel.stl dev_c3_147_hdr_bezel.stl \
            dev_c6_147_bezel.stl dev_c6_147_hdr_bezel.stl

      - name: Invalid configs must fail their assertions
        run: |
          set -e
          must_fail() {
            if openscad --export-format binstl -o /tmp/x.stl "$@" canary_wap_enclosure.scad 2>/dev/null; then
              echo "::error::expected assertion failure for: $*"; exit 1
            fi
          }
          must_fail -D 'part="gasket"'                          # gasket without opt_seal
          must_fail -D 'lid_edge=5' -D 'part="lid"'             # chamfer thicker than the lid
          must_fail -D 'wall_t=0' -D 'part="base"'              # zero wall
          echo "all guarded configs failed as expected"

  fit:
    name: fit ${{ matrix.group }}
    runs-on: ubuntu-latest
    # A MATRIX, not a bigger number — and the history is why.
    #
    # These are full-assembly CGAL intersections, 21 of them, on a 2-core
    # runner. As one serial step the suite has now blown three budgets: 30 min
    # (died at 30:15 "with the geometry all green"), then 75 as part of the
    # combined job, then 90 with a job all to itself — canceled at 89m45s.
    # Each time the fix was a larger timeout and each time it bought a few
    # months. The gates are INDEPENDENT, so the sum was never the number that
    # had to fit; it only looked that way because they ran in a row.
    #
    # Grouped rather than one job per gate. One-per-gate would give the
    # shortest wall clock, but each job pays ~30 s for checkout and apt, and
    # 21 runners to save a few minutes over 7 is a poor trade. Groups are cut
    # so no single one carries more than about three heavy assembly gates —
    # the dock poses are the expensive ones, which is why landscape and
    # portrait are separate.
    #
    # fail-fast: false on purpose. These check different things, and one
    # broken gate must not hide the state of the other twenty — that is the
    # same argument as splitting the mesh checks out of this job.
    #
    # NOTHING was dropped to fit the clock. All 21 gates run, the inverted
    # ones keep their empty/solid semantics, and the self-test that proves a
    # broken render is rejected still runs as its own group.
    # PER-GROUP BUDGETS, sized from measurement rather than one number for
    # everything — and RE-MEASURED, because the geometry grew out from under
    # the last set. Gate-step minutes from two consecutive green runs on main,
    # 2026-08-03 (A = dffa31e9 12:56 UTC, B = e51bc8bf 21:30 UTC):
    #
    #   group            A       B     old budget   B / old
    #   tpu-selftest    0.0     0.0        10          0%
    #   tpu             0.3     0.4        10          4%
    #   bezel           1.2     6.2        10         62%
    #   dock           10.1     7.0        25         28%
    #   dock-p         10.8    15.1        25         61%
    #   frame          12.1    16.7        25         67%
    #   ports          16.3    21.4        35         61%
    #   battery-none   24.4    32.3        50         65%
    #   battery-3000   36.0    50.9        75         68%
    #   battery-10000  37.2    50.0        75         67%
    #
    # THE GEOMETRY GOT HEAVIER, and the budgets did not follow. The only change
    # to the 7" sources between A and B was #1423 (first-fit pass): it turned
    # the side exit back on at the +x wall, cut the button plug's leash channel
    # and anchor into the top wall's skin, grew the BOOT/RESET pips into
    # towers, and re-drew the vent egg as a tangent-arc ovoid. Those land in
    # the tray and frame walls — exactly the solids these gates intersect. The
    # bezel group, which intersects the assembled bezel against back(), went
    # 1.2 -> 6.2 minutes: 5x, on a budget written when it was a 1.7-minute job.
    #
    # It then timed out for real on the #1426 merge run: killed at 10m13s with
    # openscad still running. Note how that surfaces — GitHub reports a job
    # that hit timeout-minutes as a cancellation, not a failure, so the check
    # reads as though a human hit a button. It was the clock.
    #
    # The old note already worked out why 45 was unsafe at 84% consumed: the
    # SAME render step took 14m43s on one runner and 20m11s on another, +37%.
    # Apply that to the B column and 60-68% consumed is 82-93% on a slow
    # runner — every one of these was one unlucky draw from red.
    #
    # Budgets below are ~2x the B column, which is the rule that was always
    # written down here; only the measurements were stale. Small groups keep
    # SMALL budgets on purpose — a 10-minute ceiling on a 25-second group
    # catches a hang in minutes, where one generous number for all of them
    # would hide it for an hour. That is the point of per-group timeouts, not
    # just headroom.
    #
    # If a group starts consuming most of its budget again, re-measure and
    # re-cut rather than doubling: a gate that got slower is telling you the
    # part got heavier, and that is worth knowing before the timeout is.
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { group: tpu-selftest,  minutes: 10 }
          - { group: tpu,           minutes: 10 }
          - { group: bezel,         minutes: 15 }
          - { group: dock,          minutes: 25 }
          - { group: dock-p,        minutes: 35 }
          - { group: frame,         minutes: 35 }
          - { group: ports,         minutes: 45 }
          - { group: battery-none,  minutes: 65 }
          - { group: battery-3000,  minutes: 105 }
          - { group: battery-10000, minutes: 105 }
    defaults:
      run:
        working-directory: docs/hardware/enclosure
    steps:
      - uses: actions/checkout@v7

      - name: Install OpenSCAD
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openscad

      - name: 7in dashboard parts must actually assemble
        run: |
          # A valid mesh is not a valid case. v0.1 of the 7" case exported three
          # watertight, single-part STLs whose bezel lip floated 5 mm clear of
          # the glass — the depth was counted in both halves of the stack-up.
          # These checks render the parts in their ASSEMBLED positions:
          # collisions must be empty, and the lip's bearing patch must not be.
          set -e
          # Reading the result needs care. OpenSCAD exits 1 BOTH for a
          # legitimately empty intersection AND for a source that failed to
          # evaluate, and prints "Current top level object is empty." either
          # way — so neither the exit status nor that marker alone proves the
          # check ran. A silently broken .scad would otherwise report every
          # collision check as passing while testing nothing.
          # The discriminator is ERROR/WARNING in the diagnostics, so demand
          # the full expected outcome: no diagnostics, plus the exact artifact
          # (a file, or the empty marker) the check is supposed to produce.
          fit() { # fit <check> <empty|solid>
            rm -f /tmp/fit.stl
            out=$(openscad --export-format binstl -o /tmp/fit.stl \
                  -D "check=\"$1\"" canary_s3_lcd7_fitcheck.scad 2>&1) || true
            if printf '%s' "$out" | grep -qE 'ERROR|WARNING'; then
              echo "::error::7in fit check '$1': render failed, so nothing was verified"
              printf '%s\n' "$out"; return 1
            fi
            if [ "$2" = empty ]; then
              if [ -f /tmp/fit.stl ]; then
                echo "::error::7in fit check '$1': parts intersect (must be empty)"; return 1
              fi
              if ! printf '%s' "$out" | grep -q 'Current top level object is empty'; then
                echo "::error::7in fit check '$1': no output and no empty marker — did it evaluate?"
                printf '%s\n' "$out"; return 1
              fi
              echo "fit check '$1': empty, as required"
            else
              if [ ! -f /tmp/fit.stl ]; then
                echo "::error::7in fit check '$1': $3"
                printf '%s\n' "$out"; return 1
              fi
              echo "fit check '$1': contact geometry present, as required"
            fi
            return 0
          }
          # BOTH helpers live here, above the case. bfit() used to sit inside
          # the battery branch, and restructuring that branch deleted it while
          # leaving its call sites — the job died with 'bfit: command not
          # found'. `bash -n` had passed, because it checks syntax and not
          # whether a command exists, so the local check could not see the
          # failure it was aimed at.
          bfit() { # bfit <battery> <part> <empty|solid> [msg]
            rm -f /tmp/fit.stl
            out=$(openscad --export-format binstl -o /tmp/fit.stl \
                  -D "battery=\"$1\"" -D "part=\"$2\"" canary_s3_lcd7.scad 2>&1) || true
            if printf '%s' "$out" | grep -qE 'ERROR|WARNING'; then
              echo "::error::7in battery gate '$1/$2': render failed, so nothing was verified"
              printf '%s\n' "$out"; return 1
            fi
            if [ "$3" = empty ]; then
              if [ -f /tmp/fit.stl ]; then
                echo "::error::7in battery gate '$1/$2': parts intersect (must be empty)"; return 1
              fi
              printf '%s' "$out" | grep -q 'Current top level object is empty' || {
                echo "::error::7in battery gate '$1/$2': no output and no empty marker — did it evaluate?"
                printf '%s\n' "$out"; return 1; }
              echo "battery gate '$1/$2': empty, as required"
            else
              if [ ! -f /tmp/fit.stl ]; then
                echo "::error::7in battery gate '$1/$2': $4"; return 1
              fi
              echo "battery gate '$1/$2': contact geometry present, as required"
            fi
            return 0
          }
          # Cheap insurance against exactly that: a missing helper is a broken
          # gate, and a broken gate must announce itself rather than be
          # discovered by the first group that happens to call it.
          for h in fit bfit; do
            command -v "$h" >/dev/null 2>&1 || {
              echo "::error::gate helper $h() is not defined — the harness is broken, not the geometry"
              exit 1; }
          done
          case "${{ matrix.group }}" in
            bezel)
          fit tray  empty || exit 1   # bezel vs rear tray — must not collide
          fit glass empty || exit 1   # bezel vs the panel — must not crush it
          fit lip    solid "nothing bears on the glass — the bezel retains nothing" || exit 1
          fit locate solid "the pocket does not stop the slab sliding — is it sized to the tray cavity instead of the glass?" || exit 1
              ;;
            frame)
          fit frame_glass empty || exit 1   # one-piece frame vs the panel — cavity, ledge and windows must clear it
          fit frame_ledge solid "the adhesive ledge is missing from under the panel border — did the ledge/boss datum drift?" || exit 1
          fit frame_adh_rail empty || exit 1   # adhesive rails: the smooth zones really are uncut plate
              ;;
            dock)
          fit stand empty || exit 1   # frame seated in the desk dock — must not collide (also proves key/slot alignment)
          fit seat  solid "the dock's pads never touch the seated frame — nothing carries the case" || exit 1
              ;;
            dock-p)
          fit stand_p  empty || exit 1   # PORTRAIT dock pose, turned one way — keys/ribs must miss solid wall
          fit stand_p2 empty || exit 1   # ...and turned the other way (the side windows are asymmetric)
          fit seat_p solid "portrait: the well ribs never touch the case — nothing carries it" || exit 1
              ;;
            ports)
          fit frame_usb_head empty || exit 1   # head-sized prism through the port — must pass clean
          fit frame_btn_window empty || exit 1 # BOOT/RESET window really open through the wall
          fit frame_sd_window empty || exit 1  # SD opening really open through the plate
          fit sd_tether_hole empty || exit 1   # tether anchor hole really open through the plate
          fit sd_tether_barb solid "the SD cover's barb misses its anchor hole — strap length, hole position or install transform drifted" || exit 1
              ;;
            tpu)
          fit frame_usb_seal solid "the grommet no longer fills the USB port — waist or installed transform drifted" || exit 1
          fit frame_btn_plug solid "the BOOT/RESET plug misses its window — waist or installed transform drifted" || exit 1
          fit btn_plug_glass empty || exit 1   # the plug (pips, lip included) must never touch the panel
          fit frame_sd_seal solid "the SD cover misses its opening/recess — waist or installed transform drifted" || exit 1
              ;;
            tpu-selftest)
              # And prove the gate can still fail: an unknown check must be
          # rejected as a broken render, not silently pass as "empty".
          if fit definitely-not-a-check empty >/dev/null 2>&1; then
            echo "::error::fit gate is inert — a broken render passed as empty"; exit 1
          fi
          echo "fit gate self-test: a failed render is correctly rejected"
              ;;
            battery-*)
              # ONE GROUP PER VARIANT. As a single group these 21 bfit calls
              # blew a 45-minute budget: each renders the FULL source with a
              # -D override, where every other group probes the much lighter
              # fitcheck file. The first grouping mis-predicted that — it was
              # cut assuming the dock POSES were the expensive gates, and the
              # measured run said otherwise: dock-p 10m46s, ports 14m55s,
              # battery >45m. Split on the measurement, not the same hunch.
              b="${{ matrix.group }}"; b="${b#battery-}"
              if [ "$b" != none ]; then   # no pack, no pack gates
                  bfit "$b" bat_probe_fit  empty || exit 1   # cavity, curb and rails must clear the pack
                  bfit "$b" bat_probe_seat solid "the rails never touch the pack — nothing carries it" || exit 1
                  bfit "$b" bat_probe_grip solid "the fingers never reach the pack — nothing retains it" || exit 1
              fi
                bfit "$b" back_flush empty || exit 1
                bfit "$b" dock_probe_fit  empty || exit 1   # seated case must not collide
                bfit "$b" dock_probe_seat solid "the dock's pads never touch the seated case — nothing carries it" || exit 1
                bfit "$b" dock_probe_p    empty || exit 1   # portrait, turned one way
                bfit "$b" dock_probe_p2   empty || exit 1   # ...and the other
              ;;
            *) echo "::error::unknown gate group ${{ matrix.group }}"; exit 1 ;;
          esac
