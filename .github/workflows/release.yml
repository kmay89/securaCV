name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

# One release pipeline per tag; never cancel mid-publish — concurrent tag
# pushes queue instead.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      # Restores the default-branch cargo cache — tag builds start warm.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install system dependencies
        run: sudo apt-get install -y libseccomp-dev
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Test
        run: cargo test

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install system dependencies
        run: sudo apt-get install -y libseccomp-dev
      - name: Build release
        run: cargo build --release
      - name: Package binaries
        run: |
          mkdir -p dist
          for bin in witnessd log_verify break_glass export_events export_verify \
                     frigate_bridge event_mqtt_bridge witness_api grove_vision2_ingest demo; do
            if [ -f "target/release/$bin" ]; then
              cp "target/release/$bin" "dist/"
            fi
          done
          tar -czf "securacv-${{ matrix.arch }}.tar.gz" -C dist .
      - uses: actions/upload-artifact@v7
        with:
          name: securacv-${{ matrix.arch }}
          path: securacv-${{ matrix.arch }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Extract changelog
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk "/^## \[${VERSION}\]/{found=1;next} /^## \[/{if(found)exit} found{print}" CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Release ${VERSION}" > release_notes.md
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          body_path: release_notes.md
          files: artifacts/**/*.tar.gz

  validate-hacs:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: HACS Validation
        # Pinned to the same SHA as validate.yml — @main is a mutable ref
        # that can change under a release run.
        uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
          ignore: brands
