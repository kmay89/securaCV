name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

# One release pipeline per tag; never cancel mid-publish — concurrent tag
# pushes queue instead.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      # Restores the default-branch cargo cache — tag builds start warm.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install system dependencies
        run: sudo apt-get install -y libseccomp-dev
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Test
        run: cargo test

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install system dependencies
        run: sudo apt-get install -y libseccomp-dev
      - name: Build release
        run: cargo build --release
      - name: Package binaries
        run: |
          mkdir -p dist
          for bin in witnessd log_verify break_glass export_events export_verify \
                     frigate_bridge event_mqtt_bridge witness_api grove_vision2_ingest demo; do
            if [ -f "target/release/$bin" ]; then
              cp "target/release/$bin" "dist/"
            fi
          done
          tar -czf "securacv-${{ matrix.arch }}.tar.gz" -C dist .
      - uses: actions/upload-artifact@v7
        with:
          name: securacv-${{ matrix.arch }}
          path: securacv-${{ matrix.arch }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # contents: write to publish the release; id-token + attestations to sign
    # and store the build-provenance attestation (mirrors firmware-release.yml).
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Extract changelog
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk "/^## \[${VERSION}\]/{found=1;next} /^## \[/{if(found)exit} found{print}" CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Release ${VERSION}" > release_notes.md
          fi
      # The trust-critical verifier binaries (log_verify, export_verify, …) ship
      # here with no integrity artifact of their own — unlike the firmware
      # release, which publishes sha256sums.txt and a provenance attestation.
      # Mirror both: a checksum file users can diff, and a signed, public record
      # (Sigstore/Rekor) of who built these tarballs from which commit. Verify:
      #   gh attestation verify <tarball> --repo ${{ github.repository }}
      - name: Generate SHA-256 checksums
        run: |
          set -euo pipefail
          # download-artifact places each tarball under artifacts/<name>/, but
          # the release publishes them as FLAT assets by basename — so the
          # checksum lines must carry basenames, or a user who downloads the
          # assets into one directory can never run `sha256sum -c`. Basenames
          # are unique per-arch; fail loudly if that ever stops being true
          # rather than emitting an ambiguous checksum file.
          find artifacts -type f -name '*.tar.gz' -printf '%f\n' | sort | uniq -d | grep . \
            && { echo "::error::duplicate tarball basenames across artifacts"; exit 1; } || true
          find artifacts -type f -name '*.tar.gz' | sort | while read -r f; do
            ( cd "$(dirname "$f")" && sha256sum "$(basename "$f")" )
          done > sha256sums.txt
          cat sha256sums.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            artifacts/**/*.tar.gz
            sha256sums.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          body_path: release_notes.md
          files: |
            artifacts/**/*.tar.gz
            sha256sums.txt

  validate-hacs:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: HACS Validation
        # Pinned to the same SHA as validate.yml — @main is a mutable ref
        # that can change under a release run.
        uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
          ignore: brands
