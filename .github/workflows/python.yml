name: HA Integration (Python)

# Lint, type-check, and test the Home Assistant integration. The
# custom_components/securacv pytest suite previously ran in no workflow
# (see the note in pwk-wizard-tests.yml); this wires it in (HY-04/05).
on:
  push:
    branches: [main]
    paths:
      - 'custom_components/**'
      - 'conftest.py'
      - 'pyproject.toml'
      - 'requirements_test.txt'
      - '.github/workflows/python.yml'
      # Firmware sources a test reads (test_wap_tamper_health.py builds the
      # WAP's MQTT health from them; test_fingerprint_case.py holds its
      # WAP-spelled fixture to the encoder canary_wap.ino spells its MQTT
      # fp and health key with, mqtt_identity.h), so a firmware-only edit
      # that stops carrying a tamper level, or changes how the WAP spells
      # its fingerprint, still runs the test that catches it.
      - 'firmware/projects/canary-wap/arduino/canary_wap/csi_mqtt.cpp'
      - 'firmware/projects/canary-wap/arduino/canary_wap/canary_wap.ino'
      - 'firmware/projects/canary-wap/arduino/canary_wap/mqtt_identity.h'
      # test_key_source_copy.py holds the options-flow copy to the flavor
      # registry, to the boot key line the two witness.cpp files print and
      # to the `Device ID` boot line the two main.cpp files print.
      - 'firmware/flavors.json'
      - 'firmware/projects/canary-sense/src/witness.cpp'
      - 'firmware/projects/canary-sentinel/src/witness.cpp'
      - 'firmware/projects/canary-sense/src/main.cpp'
      - 'firmware/projects/canary-sentinel/src/main.cpp'
  pull_request:
    branches: [main]
    paths:
      - 'custom_components/**'
      - 'conftest.py'
      - 'pyproject.toml'
      - 'requirements_test.txt'
      - '.github/workflows/python.yml'
      # Firmware sources a test reads (test_wap_tamper_health.py builds the
      # WAP's MQTT health from them; test_fingerprint_case.py holds its
      # WAP-spelled fixture to the encoder canary_wap.ino spells its MQTT
      # fp and health key with, mqtt_identity.h), so a firmware-only edit
      # that stops carrying a tamper level, or changes how the WAP spells
      # its fingerprint, still runs the test that catches it.
      - 'firmware/projects/canary-wap/arduino/canary_wap/csi_mqtt.cpp'
      - 'firmware/projects/canary-wap/arduino/canary_wap/canary_wap.ino'
      - 'firmware/projects/canary-wap/arduino/canary_wap/mqtt_identity.h'
      # test_key_source_copy.py holds the options-flow copy to the flavor
      # registry, to the boot key line the two witness.cpp files print and
      # to the `Device ID` boot line the two main.cpp files print.
      - 'firmware/flavors.json'
      - 'firmware/projects/canary-sense/src/witness.cpp'
      - 'firmware/projects/canary-sentinel/src/witness.cpp'
      - 'firmware/projects/canary-sense/src/main.cpp'
      - 'firmware/projects/canary-sentinel/src/main.cpp'

permissions:
  contents: read

concurrency:
  # PRs collapse per branch; each main commit gets its own group, so a burst
  # of merges can never evict the main run queued behind another (CI.md R3).
  group: python-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-type-test:
    name: ruff + mypy + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        # Holds the Home Assistant integration's suite (pytest, and mypy,
        # whose python_version is 3.11 anyway) to requires-python's floor, on
        # purpose: a python-version-file job gets the newest release inside
        # pyproject.toml's range, so without this pin the integration would
        # never run on 3.11. It proves the floor for the integration only;
        # the tooling's own tests run on the newest release. Move it when the
        # floor moves.
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install pinned dev/test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: Ruff (lint)
        # The integration AND the repo tooling: canary-local/tools (the Lab's
        # generators) and scripts/ (the lint gates) run on every PR but were
        # never linted themselves — 82 findings at first run, all fixed.
        run: ruff check custom_components/securacv canary-local/tools scripts

      - name: Mypy (type-check)
        run: mypy

      - name: Pytest (integration suite)
        run: pytest custom_components/securacv/tests/ -q
