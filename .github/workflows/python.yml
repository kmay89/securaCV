name: HA Integration (Python)

# Lint, type-check, and test the Home Assistant integration. The
# custom_components/securacv pytest suite previously ran in no workflow
# (see the note in pwk-wizard-tests.yml); this wires it in (HY-04/05).
on:
  push:
    branches: [main]
    paths:
      - 'custom_components/**'
      - 'conftest.py'
      - 'pyproject.toml'
      - 'requirements_test.txt'
      - 'requirements_test_ha.txt'
      - 'tests/ha/**'
      - '.github/workflows/python.yml'
      # The real-Home-Assistant lane (tests/ha) reads these outside its own
      # trees: the sealed-log vector its chain walk is held to, every
      # blueprint it renders through the core's blueprint helpers, and the
      # HACS floor it checks against the manifest.
      - 'tests/fixtures/envelope/sealed_log_document_vector.json'
      - 'docs/blueprints/*.yaml'
      - 'hacs.json'
      # Firmware sources a test reads (test_wap_tamper_health.py builds the
      # WAP's MQTT health from them; test_fingerprint_case.py holds its
      # WAP-spelled fixture to the encoder canary_wap.ino spells its MQTT
      # fp and health key with, mqtt_identity.h), so a firmware-only edit
      # that stops carrying a tamper level, or changes how the WAP spells
      # its fingerprint, still runs the test that catches it.
      - 'firmware/projects/canary-wap/arduino/canary_wap/csi_mqtt.cpp'
      - 'firmware/projects/canary-wap/arduino/canary_wap/canary_wap.ino'
      - 'firmware/projects/canary-wap/arduino/canary_wap/mqtt_identity.h'
      # test_chirp_active.py holds the Chirp Active sensor's word table to
      # the words chirp_channel::state_name() returns, the body to
      # publish_chirp_state() (csi_mqtt.cpp) and the argument to its one
      # caller (canary_wap.ino), so a new Chirp state runs it too.
      - 'firmware/projects/canary-wap/arduino/canary_wap/chirp_channel.cpp'
      # test_key_source_copy.py holds the options-flow copy to the flavor
      # registry, to the boot key line the two witness.cpp files print and
      # to the `Device ID` boot line the two main.cpp files print.
      - 'firmware/flavors.json'
      - 'firmware/projects/canary-sense/src/witness.cpp'
      - 'firmware/projects/canary-sentinel/src/witness.cpp'
      - 'firmware/projects/canary-sense/src/main.cpp'
      - 'firmware/projects/canary-sentinel/src/main.cpp'
      # test_canary_health_trust.py holds the canary's health publish
      # (main.cpp) to its MQTT buffer (securacv_mqtt.h, the topic size in
      # securacv_mqtt.cpp), its egress counters to the canary-wap's Stats and
      # the planner's, and its offline-queue keys to the queue's Stats;
      # test_egress_health.py holds Home Assistant's counter names (const.py)
      # to the same structs, to main.cpp's health objects and to the
      # canary-wap's egress topic body (csi_event_egress.h, csi_mqtt.cpp).
      - 'firmware/canary/src/main.cpp'
      - 'firmware/canary/src/csi_event_egress.h'
      - 'firmware/canary/src/csi_event_egress.cpp'
      - 'firmware/canary/lib/securacv_mqtt/src/securacv_mqtt.h'
      - 'firmware/canary/lib/securacv_mqtt/src/securacv_mqtt.cpp'
      - 'firmware/projects/canary-wap/arduino/canary_wap/csi_event_egress.h'
      - 'firmware/common/csi/src/csi_event_backfill.h'
      - 'firmware/common/mqtt/mqtt_offline_queue.h'
      # test_replay_one_id_space.py reads the id space's bounds from the
      # allocator's floor policy; test_canary_events.py and test_signature.py
      # hold their goldens to the host tests that pin the firmware's bytes.
      - 'firmware/common/csi/src/csi_event_id_floor.h'
      - 'firmware/tests_host/test_csi_event_wire.cpp'
      - 'firmware/tests_host/test_device_signature_common.cpp'
      # test_device_registry_versions.py holds its per-family status and
      # health fixtures to each family's producer (the canary's main.cpp and
      # the canary-wap's csi_mqtt.cpp are listed above), the product-name
      # table's keys to the device types the firmware configs publish, with
      # the displays' fleet model for the one legacy type, and its names to
      # the Apple apps' table.
      - 'firmware/configs/*/*/config.h'
      - 'firmware/projects/canary-sense/src/net/mqtt_mgr.cpp'
      - 'firmware/projects/canary-vision/src/net/mqtt_mgr.cpp'
      - 'firmware/projects/canary-sentinel/src/net/mqtt_mgr.cpp'
      - 'firmware/projects/canary-display/src/net/mqtt_mgr.cpp'
      - 'firmware/projects/canary-display/include/canary/fleet/fleet_model.h'
      - 'ios/Shared/DeviceNaming.swift'
      # More of the stub suite's inputs at the repository root (measured with
      # scripts/check_path_filter_reads.py): test_homekit_projection.py holds
      # its signal map to the dictionary, test_voice.py the intents to the
      # voice sentences, test_ha_contract_fixtures.py the integration to the
      # contract vectors the Rust side pins, test_kernel_verify.py its chain
      # hash to the offline viewer's verify core, and test_evidence.py its
      # evidence pack to the viewer's zip reader.
      - 'spec/witness_dictionary.json'
      - 'docs/voice_sentences_en.yaml'
      - 'tests/fixtures/ha_contract/*.json'
      - 'viewer/verify_core.js'
      - 'viewer/zip_core.js'
      # test_wap_mqtt_contract.py builds the canary-wap's MQTT harness
      # (tests_host/test_wap_mqtt_bodies.cpp: the real csi_mqtt.cpp over
      # stubs/mqtt) and replays what it records into the integration, so an
      # edit to anything that compile reads runs it. The test holds this list
      # to every rule of the harness's dependency file (the includes of both
      # compiled sources, the harness and csi_mqtt.cpp); csi_mqtt.cpp,
      # canary_wap.ino, mqtt_identity.h and csi_event_egress.h are listed above.
      - 'firmware/projects/canary-wap/tests_host/test_wap_mqtt_bodies.cpp'
      - 'firmware/projects/canary-wap/tests_host/Makefile'
      - 'firmware/projects/canary-wap/tests_host/arduino_globals.h'
      - 'firmware/projects/canary-wap/tests_host/json_strict.h'
      - 'firmware/projects/canary-wap/tests_host/stubs/mqtt/**'
      - 'firmware/projects/canary-wap/arduino/canary_wap/api_auth.h'
      - 'firmware/projects/canary-wap/arduino/canary_wap/auth_backoff.h'
      - 'firmware/projects/canary-wap/arduino/canary_wap/auth_logic.h'
      - 'firmware/projects/canary-wap/arduino/canary_wap/build_config.h'
      - 'firmware/projects/canary-wap/arduino/canary_wap/csi_event.h'
      - 'firmware/projects/canary-wap/arduino/canary_wap/csi_event_backfill.h'
      - 'firmware/projects/canary-wap/arduino/canary_wap/csi_event_id_floor.h'
      - 'firmware/projects/canary-wap/arduino/canary_wap/csi_event_log_line.h'
      - 'firmware/projects/canary-wap/arduino/canary_wap/csi_event_wire.h'
      - 'firmware/projects/canary-wap/arduino/canary_wap/csi_integration.h'
      - 'firmware/projects/canary-wap/arduino/canary_wap/csi_module.h'
      - 'firmware/projects/canary-wap/arduino/canary_wap/csi_module_settings_nvs.h'
      - 'firmware/projects/canary-wap/arduino/canary_wap/csi_mqtt.h'
      - 'firmware/projects/canary-wap/arduino/canary_wap/csi_types.h'
      - 'firmware/projects/canary-wap/arduino/canary_wap/device_signature.cpp'
      - 'firmware/projects/canary-wap/arduino/canary_wap/device_signature.h'
      - 'firmware/projects/canary-wap/arduino/canary_wap/http_body_reader.h'
      - 'firmware/projects/canary-wap/arduino/canary_wap/mqtt_transport_logic.h'
      - 'firmware/projects/canary-wap/arduino/canary_wap/tz_rule.h'
      - 'firmware/projects/canary-wap/arduino/canary_wap/wap_json_writer.h'
  pull_request:
    branches: [main]
    paths:
      - 'custom_components/**'
