name: HA Integration (Python)

# Lint, type-check, and test the Home Assistant integration. The
# custom_components/securacv pytest suite previously ran in no workflow
# (see the note in pwk-wizard-tests.yml); this wires it in (HY-04/05).
on:
  push:
    branches: [main]
    paths:
      - 'custom_components/**'
      - 'conftest.py'
      - 'pyproject.toml'
      - 'requirements_test.txt'
      - '.github/workflows/python.yml'
  pull_request:
    branches: [main]
    paths:
      - 'custom_components/**'
      - 'conftest.py'
      - 'pyproject.toml'
      - 'requirements_test.txt'
      - '.github/workflows/python.yml'

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-type-test:
    name: ruff + mypy + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install pinned dev/test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: Ruff (lint)
        # The integration AND the repo tooling: canary-local/tools (the Lab's
        # generators) and scripts/ (the lint gates) run on every PR but were
        # never linted themselves — 82 findings at first run, all fixed.
        run: ruff check custom_components/securacv canary-local/tools scripts

      - name: Mypy (type-check)
        run: mypy

      - name: Pytest (integration suite)
        run: pytest custom_components/securacv/tests/ -q
