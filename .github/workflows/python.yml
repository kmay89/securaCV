permissions:
  contents: read

concurrency:
  # PRs collapse per branch; each main commit gets its own group, so a burst
  # of merges can never evict the main run queued behind another (CI.md R3).
  group: python-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-type-test:
    name: ruff + mypy + pytest
    runs-on: ubuntu-24.04  # pinned ahead of the 26.04 image move; revisit before 24.04 retires
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        # Holds the Home Assistant integration's suite (pytest, and mypy,
        # whose python_version is 3.11 anyway) to requires-python's floor, on
        # purpose: a python-version-file job gets the newest release inside
        # pyproject.toml's range, so without this pin the integration would
        # never run on 3.11. It proves the floor for the integration only;
        # the tooling's own tests run on the newest release. Move it when the
        # floor moves.
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install pinned dev/test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: Ruff (lint)
        # The integration only. The repo's tooling (canary-local/tools,
        # scripts/, tools/, …) is linted by lint.yml's `ruff` job, which is
        # unfiltered: this workflow's path filter never saw a scripts-only
        # PR, so a violation there merged green and turned red on the next
        # unrelated Home Assistant PR. Same pin, same pyproject.toml config.
        run: ruff check custom_components/securacv

      - name: Mypy (type-check)
        run: mypy

      - name: Pytest (integration suite)
        # test_wap_mqtt_contract.py builds the canary-wap's MQTT harness with
        # make and g++ (both on the image, with OpenSSL's headers); required
        # here, so a missing toolchain fails instead of skipping.
        env:
          SECURACV_WAP_HARNESS: require
        run: pytest custom_components/securacv/tests/ -q

  ha-lane:
    # The integration on a REAL Home Assistant core, two cells: the floor
    # hacs.json declares and the current release (spec D12). The stub lane
    # above proves the package imports and its logic on 3.11; this lane is
    # what the user runs — the plugin's `hass`, `mqtt_mock`, `hass_client`
    # and `aioclient_mock` fixtures, the registries, the HTTP views, the
    # repairs API and the blueprint helpers.
    name: real Home Assistant (${{ matrix.cell }})
    runs-on: ubuntu-24.04  # pinned ahead of the 26.04 image move; revisit before 24.04 retires
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - cell: floor
            # Home Assistant 2026.5.0, the floor in hacs.json: the plugin
            # release that pins it (its requirements name the core version).
            plugin: pytest-homeassistant-custom-component==0.13.329
          - cell: current
            # requirements_test_ha.txt pins the current release; nothing to override.
            plugin: ''
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        # Pinned above requires-python's ceiling on purpose: Home Assistant
        # 2026.5 and later, and the pytest plugin that wraps it, run on 3.14
        # only (their requires-python is >=3.14), so this lane uses the
        # interpreter the core itself needs rather than the tooling floor.
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install the real Home Assistant test lane
        # The floor cell swaps the plugin line for the floor pin; the plugin
        # pins its own core, pytest and friends, so one line moves the cell.
        run: |
          python -m pip install --upgrade pip
          if [ -n "${{ matrix.plugin }}" ]; then
            grep -v '^pytest-homeassistant-custom-component==' requirements_test_ha.txt > /tmp/requirements_test_ha_floor.txt
            pip install -r /tmp/requirements_test_ha_floor.txt "${{ matrix.plugin }}"
          else
            pip install -r requirements_test_ha.txt
          fi
          python -c "import homeassistant.const as c; print('Home Assistant', c.__version__)"

      - name: Pytest (real Home Assistant)
        # Its own ini and a conftest cutoff: neither the repo-root stub
        # conftest nor the integration's stub-lane conftest is collected.
        run: pytest -c tests/ha/pytest.ini --confcutdir=tests/ha tests/ha -q

      - name: Mypy (the integration against the installed core, 3.14)
        # tests/ha/mypy.ini: no ignore_missing_imports — every homeassistant.*
        # import resolves and type-checks. Once per lane, on the current cell.
        if: matrix.cell == 'current'
        run: mypy --config-file tests/ha/mypy.ini --python-version 3.14
