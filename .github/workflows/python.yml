name: HA Integration (Python)

# Lint, type-check, and test the Home Assistant integration. The
# custom_components/securacv pytest suite previously ran in no workflow
# (see the note in pwk-wizard-tests.yml); this wires it in (HY-04/05).
on:
  push:
    branches: [main]
    paths:
      - 'custom_components/**'
      - 'conftest.py'
      - 'pyproject.toml'
      - 'requirements_test.txt'
      - '.github/workflows/python.yml'
  pull_request:
    branches: [main]
    paths:
      - 'custom_components/**'
      - 'conftest.py'
      - 'pyproject.toml'
      - 'requirements_test.txt'
      - '.github/workflows/python.yml'

permissions:
  contents: read

jobs:
  lint-type-test:
    name: ruff + mypy + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned dev/test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: Ruff (lint)
        run: ruff check custom_components/securacv

      - name: Mypy (type-check)
        run: mypy

      - name: Pytest (integration suite)
        run: pytest custom_components/securacv/tests/ -q
