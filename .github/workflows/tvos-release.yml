# SecuraCV on Apple TV — the Witness Wall (native tvOS). The PROD half.
#
# Same control surface as every other SecuraCV release: a git tag is the only
# button. Push `tvos-v*` and CI builds the native SwiftUI app, links the shared
# Rust witness core (aarch64-apple-tvos), signs, and uploads the build to
# App Store Connect / TestFlight. No manual artifact steps — "if you did
# something by hand, that's the bug" (docs/RELEASE_PROCESS.md).
#
# The DEV half is tvos.yml: it builds and unit-tests the app on the tvOS
# simulator and runs the core's kernel-agreement vectors on every PR, with no
# signing and no Apple account. So the app is verified continuously even while
# this workflow is still a no-op.
#
# Three ways to run, in increasing order of consequence (Principle 3 — prove
# the bundle before you publish):
#   1. workflow_dispatch, publish unchecked  → build + sign + export, upload
#      NOTHING, keep the .ipa as an artifact. This is the smoke test.
#   2. workflow_dispatch, publish checked    → a real TestFlight upload.
#   3. push a `tvos-v*` tag                  → a real TestFlight upload, with
#      the tag's version checked against the app's MARKETING_VERSION first.
#
# Like the iOS pipeline, this NO-OPS cleanly until tvOS is enabled (repo
# variable ENABLE_TVOS_BUILD=true) with Apple signing set up — so a curious
# "Run workflow" click, or an early `tvos-v*` tag, succeeds with a helpful
# message instead of hard-failing. Full setup: tvos/README.md.
name: tvOS release (Witness Wall)
run-name: >-
  Witness Wall — ${{ github.event_name == 'push' && 'TAG publish' || (inputs.publish && 'PUBLISH' || 'build only') }} — @${{ github.actor }}

on:
  push:
    tags:
      - "tvos-v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload to App Store Connect (unchecked = build + sign + export only, the smoke test)"
        type: boolean
        default: false
      export_method:
        description: "Xcode export method (must be app-store-connect to publish)"
        type: choice
        options: [debugging, release-testing, app-store-connect]
        default: app-store-connect

# One release build per ref. A `tvos-v*` tag build must never be canceled
# mid-upload (a half-delivered TestFlight build), so only the cheap manual
# smoke-test dispatch auto-cancels — and only when it is NOT publishing.
concurrency:
  group: tvos-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}

# `contents: write` so a publishing dispatch can create its `tvos-v*` tag. That
# tag is not decoration: `.github/scripts/release_plan.py` derives "has this
# shipped?" from tags, so an untagged TestFlight upload would be invisible to
# the Update-everything button and get re-dispatched on every press.
permissions:
  contents: write

jobs:
  tvos:
    name: Build, sign, and upload the Witness Wall
    # macos-26: App Store Connect requires the platform-26 SDK for uploads
    # (ITMS-90725, RELEASE_LESSONS 2026-07-28 (h)); the image default Xcode
    # there is 26.x.
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Gate — tvOS builds enabled?
        if: vars.ENABLE_TVOS_BUILD != 'true'
        run: |
          echo "::notice::tvOS builds are not enabled yet — skipping."
          echo "The app itself is still verified on every PR by tvos.yml (simulator"
          echo "build + unit tests + the core's kernel-agreement vectors) — only the"
          echo "signed upload is gated, because only that needs an Apple account."
          echo
          echo "Set the repo variable ENABLE_TVOS_BUILD=true and the Apple signing"
          echo "secrets (see tvos/README.md), then push a tvos-v* tag or re-run."

      - uses: actions/checkout@v7
        if: vars.ENABLE_TVOS_BUILD == 'true'
        with:
          # Tags, so the plan step can refuse to re-publish a version that has
          # already shipped, and so the publish step can create the new tag.
          fetch-depth: 0

      # ── What this run is allowed to do ──────────────────────────────────
      # Resolved once, in one place, so every later step reads the same answer.
      # A tag push always publishes; a dispatch publishes only if asked.
      - name: Resolve the release plan
        id: plan
        if: vars.ENABLE_TVOS_BUILD == 'true'
        env:
          EVENT: ${{ github.event_name }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_EXPORT: ${{ inputs.export_method }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            publish=true
            export_method=app-store-connect
            # tvos-v1.4.0 → 1.4.0, checked against MARKETING_VERSION by
            # release-tvos.sh so the tag and the binary cannot disagree.
            version="${REF_NAME#tvos-v}"
          else
            publish="${INPUT_PUBLISH:-false}"
            export_method="${INPUT_EXPORT:-app-store-connect}"
            # A publishing DISPATCH has no tag to read a version from, so take
            # it from the app itself and tag afterwards. Without this the
            # upload would be invisible to release_plan.py (which derives
            # "shipped" from tags) and get re-dispatched on every press.
            version=""
            if [ "$publish" = "true" ]; then
              version="$(sed -n 's/^ *MARKETING_VERSION: *"\{0,1\}\([0-9][0-9.]*\)"\{0,1\} *$/\1/p' tvos/WitnessWall/project.yml | head -1)"
              if [ -z "$version" ]; then
                echo "::error::could not read MARKETING_VERSION from tvos/WitnessWall/project.yml."
                exit 1
              fi
              # Refuse to re-publish a version that already shipped — the same
              # guard firmware-release.yml applies to an existing tag.
              if git rev-parse -q --verify "refs/tags/tvos-v$version" >/dev/null; then
                echo "::error::tvos-v$version is already tagged, so that version has already shipped."
                echo "Bump MARKETING_VERSION in tvos/WitnessWall/project.yml before publishing again."
                exit 1
              fi
            fi
          fi
          {
            echo "publish=$publish"
            echo "export_method=$export_method"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          echo "publish=$publish, export_method=$export_method, expected version='${version:-(none)}'"

      # The app is a thin SwiftUI shell over the SAME chain math that verifies
      # the sealed log everywhere else — compiled for Apple TV. tvOS is a
      # tier-3 Rust target, so the core is built with the std source
      # (nightly + -Z build-std).
      - name: Set up Rust (+ tvOS core target)
        if: vars.ENABLE_TVOS_BUILD == 'true'
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Cache Rust build
        if: vars.ENABLE_TVOS_BUILD == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tvos/witness-core -> target
          key: tvos-release

      # Re-run the kernel-agreement vectors on the release path too. tvos.yml
      # already gates PRs, but a release must not depend on a PR having run —
      # this is the last chance to catch a TV that would verify a different
      # chain than the source of truth, and it costs seconds.
      - name: Prove the core still agrees with the kernel
        if: vars.ENABLE_TVOS_BUILD == 'true'
        working-directory: tvos/witness-core
        run: cargo test --test vectors

      - name: Build the witness core (aarch64-apple-tvos)
        if: vars.ENABLE_TVOS_BUILD == 'true'
        working-directory: tvos
        env:
          TVOS_SLICES: device
        run: bash scripts/build-witness-core.sh

      - name: Install XcodeGen
        if: vars.ENABLE_TVOS_BUILD == 'true'
        run: brew install xcodegen

      # App Store Connect API-key signing needs the .p8 as a real file on disk;
      # a secret is a string, so materialize it here and point xcodebuild at it.
      - name: Write App Store Connect API key
        id: asc_key
        if: vars.ENABLE_TVOS_BUILD == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          if [ -z "$APPLE_API_KEY_BASE64" ]; then
            echo "::error::ENABLE_TVOS_BUILD is true but the APPLE_API_KEY_BASE64 secret is empty."
            echo "Store the base64-encoded App Store Connect .p8 key as APPLE_API_KEY_BASE64 (see tvos/README.md)."
            exit 1
          fi
          keydir="$RUNNER_TEMP/private_keys"
          mkdir -p "$keydir"
          keyfile="$keydir/AuthKey_${APPLE_API_KEY}.p8"
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$keyfile"
          chmod 600 "$keyfile"
          if [ ! -s "$keyfile" ]; then
            echo "::error::APPLE_API_KEY_BASE64 did not decode to a key — check that the secret is base64 of the .p8 file."
            exit 1
          fi
          echo "path=$keyfile" >> "$GITHUB_OUTPUT"

      # Same persistent-identity import as ios-release.yml — per-run
      # cloud-created certificates orphan themselves on ephemeral runners
      # (RELEASE_LESSONS 2026-07-28 (e)). The APPLE_CERTIFICATE .p12 is the
      # repo-wide combined bundle (Developer ID Application for macOS +
      # Apple Development + Apple Distribution); skipped when unset.
      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        if: vars.ENABLE_TVOS_BUILD == 'true' && env.APPLE_CERTIFICATE != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/securacv-ci.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          echo "imported signing identities:"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build, export, and (if publishing) upload
        if: vars.ENABLE_TVOS_BUILD == 'true'
        working-directory: tvos
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM || secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ steps.asc_key.outputs.path }}
          EXPORT_METHOD: ${{ steps.plan.outputs.export_method }}
          PUBLISH: ${{ steps.plan.outputs.publish }}
          EXPECTED_VERSION: ${{ steps.plan.outputs.version }}
          # `<run>.<attempt>` — see release-tvos.sh for why neither half alone
          # is enough (run_number does not move on "Re-run jobs"; run_attempt
          # resets on every fresh dispatch).
          BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
        run: bash scripts/release-tvos.sh

      # Tag AFTER the upload succeeded, never before: the tag is this repo's
      # record that a version shipped, so it must not exist for a build that
      # didn't. (A tag-triggered run already has its tag — this is only for the
      # dispatch path, e.g. the Update-everything button.)
      - name: Tag the published version
        if: >-
          vars.ENABLE_TVOS_BUILD == 'true'
          && github.event_name == 'workflow_dispatch'
          && steps.plan.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "tvos-v$VERSION" -m "Witness Wall $VERSION (uploaded to App Store Connect)"
          git push origin "tvos-v$VERSION"
          echo "::notice::Tagged tvos-v$VERSION — the Update-everything button now sees this version as shipped."

      # A publish means a new TestFlight build is already on its way to every
      # Apple TV via phased release — no artifact to hand-carry. A build-only
      # run keeps the .ipa so a human can sideload it to a dev device.
      - name: Upload .ipa (build-only runs)
        if: vars.ENABLE_TVOS_BUILD == 'true' && steps.plan.outputs.publish != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: securacv-witness-wall-tvos
          path: tvos/build/export/*.ipa
          if-no-files-found: error   # the script already proved it exists; a
                                     # miss here means the path drifted
          retention-days: 14

      - name: Summary
        if: vars.ENABLE_TVOS_BUILD == 'true'
        env:
          PUBLISHED: ${{ steps.plan.outputs.publish }}
          METHOD: ${{ steps.plan.outputs.export_method }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          {
            echo "## Witness Wall (tvOS)"
            echo
            if [ "$PUBLISHED" = "true" ]; then
              echo "🚀 **Uploaded to App Store Connect**${VERSION:+ (\`$VERSION\`)} — Apple's phased release carries it to every Apple TV."
            else
              echo "🧪 **Build-only smoke run** (\`$METHOD\`) — signed and exported, nothing uploaded. The \`.ipa\` is attached to this run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
