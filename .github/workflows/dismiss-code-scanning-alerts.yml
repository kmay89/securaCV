# Temporary maintenance workflow: dismisses code scanning alerts that manual
# triage confirmed are false positives (CodeQL modelling limitations) or an
# accepted risk. Each dismissal records a reason and justification so the
# decision is auditable in the Security tab. Removed before merge.
name: Dismiss triaged code scanning alerts

on:
  push:
    branches: [ "claude/code-scanning-vulnerabilities-vmh7ap" ]
    paths:
      - '.github/workflows/dismiss-code-scanning-alerts.yml'
  workflow_dispatch:

permissions:
  security-events: write
  contents: read

jobs:
  dismiss:
    runs-on: ubuntu-latest
    steps:
      - name: Dismiss triaged alerts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # number|reason|comment
          # reason is one of: "false positive", "won't fix", "used in tests"
          dismiss() {
            local number="$1" reason="$2" comment="$3"
            echo "::group::Dismissing alert #${number} (${reason})"
            code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X PATCH \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/code-scanning/alerts/${number}" \
              -d "$(jq -n --arg r "$reason" --arg c "$comment" \
                    '{state:"dismissed", dismissed_reason:$r, dismissed_comment:$c}')")
            echo "HTTP ${code}"
            jq -c '{number, state, dismissed_reason, dismissed_comment}' /tmp/resp.json || cat /tmp/resp.json
            echo "::endgroup::"
            [ "$code" = "200" ]
          }

          dismiss 59 "false positive" \
            "src/vault/crypto.rs seal_v1: the [0u8;12] buffer is immediately overwritten by SysRng.try_fill_bytes, so the nonce is random per message. CodeQL's Rust dataflow does not model the &mut buffer fill as killing the zero literal."
          dismiss 58 "false positive" \
            "src/vault/crypto.rs wrap_dek: the [0u8;12] buffer is overwritten by SysRng.try_fill_bytes before use; the wrap nonce is random per DEK. CodeQL does not model the &mut fill."
          dismiss 26 "false positive" \
            "src/vault/format.rs: the [0u8;12] buffer is overwritten by copy_from_slice from the deserialized envelope nonce read back for decryption. It is not a static nonce."
          dismiss 25 "false positive" \
            "src/vault/format.rs: this [2u8;12] value is a unit-test fixture in envelope_round_trip_works, not a production nonce."
          dismiss 55 "false positive" \
            "canary-vision/device-api/routes/witness.js: the route is covered by the global per-IP rateLimit() middleware (server.js) plus a dedicated expensiveRouteLimiter on the crypto routes. CodeQL only recognizes known third-party rate-limit libraries, not this in-house limiter."
          dismiss 41 "false positive" \
            "canary-vision/device-api/server.js: all routes are behind the global rateLimit() middleware mounted before the auth middleware and route handlers. CodeQL does not recognize the in-house limiter."
          dismiss 17 "won't fix" \
            "canary-vision/spa/app.js: the device API uses bearer-token auth via the Authorization header, so the SPA must hold the token in JS-reachable storage. sessionStorage is used deliberately (cleared on tab close, backed by session-expiry timers) on a local-network device UI. Accepted risk."
