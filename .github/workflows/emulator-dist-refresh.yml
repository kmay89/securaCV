# Rebuild the committed emulator dist/ from the dispatched ref — in CI,
# where the pinned Emscripten SDK is installable — and push the byte-exact
# result back to that same branch.
#
# Why this button exists: canary-local/emulator/dist/*.js are generated AND
# committed, and canary-local.yml's drift gate rebuilds them and fails on
# any byte difference. The fixer ("run build.sh all and commit") requires
# emsdk 6.0.3 exactly — a toolchain many working environments (network-
# restricted sandboxes, laptops without emsdk) cannot install. This
# workflow is the same fixer run where the toolchain lives, following the
# homeassistant-freshness bot's commit/push pattern.
#
# It only ever pushes to the branch it was dispatched on, and only when the
# rebuild actually changed dist/. Note GitHub's recursion guard: a push
# made with the default GITHUB_TOKEN does not retrigger workflows, so the
# refreshed head may need one ordinary push (or re-run) to collect checks.

name: Rebuild emulator dist (pinned emsdk)

on:
  workflow_dispatch:

permissions:
  contents: write

# Two rebuilds racing on one branch would fight over the push — queue them.
concurrency:
  group: emulator-dist-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Same pinned SDK + caches as canary-local.yml's wasm job — the whole
      # point is byte-identical output to that job's rebuild.
      - name: Cache the Emscripten SDK
        id: emsdk-cache
        uses: actions/cache@v6
        with:
          path: /tmp/emsdk
          key: emsdk-6.0.3-${{ runner.os }}
      - name: Install pinned Emscripten SDK 6.0.3
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git /tmp/emsdk
          /tmp/emsdk/emsdk install 6.0.3
      - name: Activate + verify Emscripten
        run: |
          /tmp/emsdk/emsdk activate 6.0.3
          source /tmp/emsdk/emsdk_env.sh
          emcc --version | head -1
      - name: Cache third-party sources
        uses: actions/cache@v6
        with:
          path: canary-local/emulator/third_party
          key: canary-local-tp-${{ hashFiles('canary-local/emulator/build.sh') }}

      - name: Rebuild dist from this tree
        run: |
          source /tmp/emsdk/emsdk_env.sh
          cd canary-local/emulator
          ./build.sh all

      - name: Commit + push the refreshed dist (only if it changed)
        run: |
          # The commit the dist was BUILT from — captured before we commit or
          # rebase, so the staleness guard below can tell whether the branch has
          # moved its compile inputs out from under this rebuild.
          BUILD_BASE=$(git rev-parse HEAD)
          # status --porcelain, not diff: a NEW flavor's first build creates
          # untracked dist files that git diff cannot see.
          if [ -z "$(git status --porcelain -- canary-local/emulator/dist)" ]; then
            echo "dist/ already matches a rebuild from this tree — nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canary-local/emulator/dist
          git commit -m "chore(canary-local): rebuild emulator dist from this tree (pinned emsdk 6.0.3)"
          # Rebase before pushing, and retry. This build takes minutes (emsdk
          # install + compile), and a single ordinary push to the branch in
          # that window used to make the push a non-fast-forward and throw the
          # whole rebuild away with "fetch first" — which is easy to read as
          # "the emulator failed to build" when it built fine. dist/ is
          # generated output that no human edits, so a rebase can only ever
          # replay our own regenerated bytes on top of whatever arrived.
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "push rejected (attempt ${attempt}) — rebasing onto the branch and retrying"
            git fetch origin "${GITHUB_REF_NAME}"
            # If the arriving commits TEXTUALLY conflict, these bytes are already
            # stale; say so rather than pushing a rebuild of an older tree over a
            # newer one. Re-dispatch is the fix.
            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              echo "::error::dist rebuild conflicts with new commits on ${GITHUB_REF_NAME} — re-run this workflow on the updated branch."
              exit 1
            fi
            # A clean rebase is NOT proof the rebuild is current: a firmware /
            # emulator-input commit that only edits sources the dist is COMPILED
            # from never conflicts with our dist-only commit, so the rebase
            # succeeds and we would push bytes built from the older tree (the
            # drift gate then fails on a file nobody touched — the exact failure
            # this workflow exists to prevent). Compare the compile inputs
            # between the build base and the branch head; if any changed, the
            # rebuild is stale — fail and ask for a re-dispatch, don't push.
            stale=$(git diff --name-only "$BUILD_BASE" "origin/${GITHUB_REF_NAME}" -- \
              firmware canary-local/emulator ':(exclude)canary-local/emulator/dist')
            if [ -n "$stale" ]; then
              echo "::error::firmware / emulator inputs changed on ${GITHUB_REF_NAME} since this dist was built (base ${BUILD_BASE}); the rebuilt bytes are stale. Re-run this workflow on the updated branch."
              printf '%s\n' "$stale" | sed 's/^/  changed input: /'
              exit 1
            fi
            sleep $((attempt * 5))
          done
          echo "::error::could not push the rebuilt dist after 3 attempts."
          exit 1
