name: Repo Lints

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# These checks only read the repo.
permissions:
  contents: read

# Cheap grep-based lints that cross-check firmware headers, spec tables, and
# flag declarations repo-wide — kept unfiltered on purpose, but stale PR runs
# are still canceled when a new head arrives.
concurrency:
  group: repo-lints-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scripts:
    name: scripts/lint_*.sh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Conformance + hygiene lints that previously had no CI gate.
      - name: CAP-mapping conformance
        run: bash scripts/lint_cap_mapping.sh
      - name: Non-impersonation contract
        run: bash scripts/lint_no_impersonation.sh
      - name: Feature-flag hygiene
        run: bash scripts/lint_feature_flags.sh
      - name: Version lockstep (kernel / integration / add-on)
        run: bash scripts/lint_version_sync.sh
      - name: Firmware version lockstep (six version strings, one train)
        # lint_version_sync.sh above never looked at firmware. The train is
        # typed in six headers/sketches; drift used to surface only at release
        # time, and for the display only as a warning that silently skipped
        # its OTA manifest.
        run: bash scripts/lint_fw_version_sync.sh
      - name: Desktop apps state ONE version (tauri.conf = package.json = Cargo.toml)
        # Each Tauri app carries its version in three files. tauri.conf.json
        # names the release TAG; Cargo.toml is what the running app shows the
        # USER in its footer. They drifted — the Flasher shipped as 0.2.2 with a
        # footer reading v0.1.0 — so a bug report named a version that was never
        # released. All three, both apps, checked on every PR.
        run: python3 desktop/scripts/check_app_versions.py
      - name: Desktop apps say WHAT the version changes (RELEASE_NOTES.md)
        # The newest section of each app's RELEASE_NOTES.md must match its
        # tauri.conf.json version. The release workflows publish that section as
        # the release body and as the updater manifest's notes — the text the
        # in-app "update ready" UI shows — so a bump without notes would ship an
        # update that can't say what it changes.
        run: python3 desktop/scripts/release_notes.py check
      - name: OTA release key state (reported, never gating)
        # Prints whether the release signing public key is embedded or still all
        # zeros (OTA hard-disabled). Informational on purpose: a repo without the
        # key is a legitimate state — a SILENT one was the problem, since it
        # makes every product read "unavailable" in the flasher with no clue why.
        run: python3 firmware/scripts/ota_key_state.py
      - name: USB console agreement (release FQBNs vs the bench)
        # An S3 built without CDC-on-boot prints `Serial` to UART0: it builds,
        # flashes, runs — and the app's serial monitor is silent, with no
        # visible cause. Three release FQBNs had drifted from the PlatformIO
        # bench when this lint was added.
        run: python3 scripts/lint_usb_console.py
      - name: Wi-Fi join policy (no reboot loops on a dead link)
        # A board that reboots because its boot-time Wi-Fi join timed out
        # re-runs the identical join forever: it never finishes booting, so the
        # setup wizard that could fix the password never appears. That shipped,
        # and it looked like a dead board. THREE firmwares had copy-pasted the
        # retry logic and drifted; a fourth copy was in the wasm emulator. The
        # rule now lives once in common/network/wifi_join_policy.h, and this
        # lint is what stops a fifth copy appearing.
        run: python3 scripts/lint_wifi_join_policy.py
      - name: scripts/tests suites (lints, board cost model, BOM pricing)
        # `discover` runs EVERY test_*.py in scripts/tests exactly once, so the
        # board cost model (test_board_design.py) and BOM pricing contract
        # (test_bom_pricing.py) run here too — they used to also have their own
        # steps, which just ran the same suites a second time. What each guards:
        #  • Wi-Fi lint — an untested brace-depth heuristic is a guard that reads
        #    as covered while catching nothing; three defects were found before
        #    it worked (a proximity window that missed its own bug class, an
        #    innermost-block check that rejected correct code, `\bever_online\b`
        #    not matching `s_ever_online`). Each is pinned.
        #  • Board cost model — cost_model.json emits a GO/STOP word a human
        #    reads before spending NRE; the tests pin which quote applies at the
        #    basis volume and that a qty-1 price yields UNRESOLVED, not GO.
        #  • BOM pricing — a distributor miss must demote, never republish stale
        #    data as live; every exception kind fires only when its condition holds.
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Witness Dictionary sync (Rust / Python / JS / firmware)
        run: python3 scripts/lint_dictionary_sync.py
      - name: Vehicle DBC signal math (golden vectors)
        run: python3 scripts/dbc_signal_resolve.py selftest
      - name: Vehicle profiles match their vendored DBC excerpts
        run: python3 scripts/dbc_signal_resolve.py check-profiles
      - name: Away-access checker (the guide's verifier)
        # tools/away_access_check.py is what turns docs/away_access.md from
        # advice into a verdict: it tells an owner whether their hub is
        # actually reachable from the internet. A security check that reads as
        # covered while catching nothing is worse than no check, so every
        # parser (three `ss` dialects, both /proc tables, two router SOAP
        # shapes) and every branch of the verdict is pinned — including the
        # promise that the tool never fetches a non-private URL.
        run: python3 tools/test_away_access_check.py
      - name: Docs index — no stragglers, no dead links
        run: python3 scripts/lint_docs_index.py
      - name: Apple Home docs match the vocabulary they describe
        # The quickstart tells a user exactly what their Canaries will publish
        # into their home — which signals, which are OFF by default, how
        # coarse the metronome is. Those are privacy promises, and a stale one
        # is not merely out of date: it is a false statement to the person
        # deciding whether to publish their home into Apple's ecosystem. So
        # the tables are generated from spec/witness_dictionary.json and this
        # byte-diffs them. Flip a default in the dictionary without
        # regenerating and the build stops here.
        run: python3 scripts/gen_apple_home_docs.py --check
      - name: US spellings (AGENTS.md rule 3b)
        # The script's regex is the ONE enumerated list of banned forms in the
        # repo; rule 3b points at it rather than naming them, because a rule
        # that spells British words out gets rewritten by the next spelling
        # sweep into a rule forbidding the correct spellings. That happened to
        # four separate copies of this rule across two repos in one day.
        # It also self-tests that its ban pattern never starts matching correct
        # English (characteristic, realistic, colored, …).
        run: python3 scripts/lint_spelling.py
      - name: CloudKit container — named, never defaulted, fully deployed
        # CKContainer.default() reads an entitlement and raises an ObjC
        # CKException when there isn't one. Swift can't catch that, so an
        # unsigned build (CI builds exactly that) aborts on launch — which is
        # how every iOS test failed for reasons that had nothing to do with
        # iCloud. The gate bans the call and cross-checks the one hardcoded
        # container identifier against both entitlements files, because a
        # name that drifts silently swaps one broken iCloud for another.
        # It also checks that every CKRecord type the app uses is listed in
        # ios/scripts/cloudkit_schema.sh: production never auto-creates a
        # record type, so one nobody deployed makes every read and write
        # against it fail — silently, because both call sites swallow errors
        # on purpose. PairedDevice was missing from that table for its whole
        # life. See docs/design/cloudkit_backend.md.
        run: python3 scripts/lint_cloudkit_container.py
      - name: Apple surfaces show a device the same way
        # The Witness Wall gets a few hours of attention every several weeks,
        # and it drifted the way an infrequently-visited target does: not by
        # breaking, but by re-deciding things the iPhone had already decided.
        # It printed the raw wire string ("canary-nightstand7") on a
        # television, drew a colored dot where the phone drew the device, and
        # read chain:"unknown" as a verification FAILURE — painting every
        # display in the fleet orange for a chain they never claimed to have.
        # The files that make those decisions are now COMPILED by both targets
        # rather than re-implemented, and this gate is what keeps it that way:
        # a shared file carrying the SecuraCV-Parity marker must appear in
        # every device-rendering target's sources. Adding one for the phone
        # therefore forces a decision instead of a silent divergence.
        run: python3 scripts/lint_apple_parity.py
      - name: Apple Info.plists and privacy manifests (ATS local networking, PrivacyInfo.xcprivacy)
        # Two things App Store Connect / iOS enforce that no compiler does:
        # ATS blocks cleartext to .local hosts unless NSAllowsLocalNetworking is
        # declared (the tvOS plist had it, the iPhone's did not — every
        # http://<canary>.local call was rejected on device), and every bundle
        # that touches UserDefaults must ship a PrivacyInfo.xcprivacy or the
        # upload is rejected by email after CI is green.
        run: python3 scripts/lint_apple_plists.py
      - name: App icon catalogs are complete (stdlib PNG header check)
        # Runs on the macOS job too, but that one is gated behind
        # ENABLE_IOS_BUILD; this is the every-PR Linux copy.
        run: python3 ios/scripts/check_app_icon.py
      - name: Agent entrypoints match AGENTS.md
        # Every AI tool reads a different filename (GEMINI.md, QWEN.md,
        # copilot-instructions.md, .cursor/rules, .clinerules, .windsurfrules).
        # They're generated from the one brief in AGENTS.md, because a stale copy
        # is worse than no copy — the agent trusts it and confidently breaks a
        # rule (says "flock", widens the raw-frame accessor) that AGENTS.md
        # forbids.
        run: python3 scripts/gen_agent_entrypoints.py --check
      - name: Build matrix matches platformio.ini + config.h
        run: python3 scripts/lint_build_matrix.py
      - name: Device manifests join the seven device schemas
        # devices/<slug>/device.json is the one place that says THIS env,
        # THIS pins header, THIS emulator flavor, THIS figure, THIS case and
        # THIS flasher product are the same Canary. flavors.json, build_matrix,
        # boards.json, build.sh + dist, figures.json, enclosures.json and
        # flash.json each stay the source of their own fact; this proves the
        # manifests agree with all of them, that every build env and flasher
        # product is claimed by exactly one device, and that the confidence
        # ladder is read from figures.json rather than typed. Nothing consumes
        # the manifests yet (roadmap §4 wave 1), so this is the only gate that
        # can catch a stale join.
        run: python3 scripts/lint_device_manifests.py
      - name: Display env names in workflows exist in flavors.json
        # The release workflows (firmware-release.yml, flasher-release.yml)
        # build the Canary Display board envs from lists typed into each by
        # hand, with no gate against flavors.json — and the two disagreed:
        # the AMOLED shipped from the tag ceremony and was missing from every
        # dev publish. flavors.json now carries `release_envs` (the set both
        # must build) and this checks every literal canary-display-<env> a
        # workflow names against it, so a typo or a retired env cannot hide,
        # and that release_envs is a subset of what CI builds with a flasher
        # product for each. Deriving the release steps themselves from
        # `flavor_envs.py --release --with-core` is the follow-up
        # (docs/IMPROVEMENT_ROADMAP.md item 23).
        run: python3 firmware/scripts/flavor_envs.py --check-workflows
      - name: common/ library manifests are LDF-consistent
        run: python3 scripts/lint_common_lib_manifests.py
      - name: BOM CSVs — schema-clean and wired into the generator
        run: python3 scripts/lint_bom.py
      - name: Board designs — pin map matches firmware, netlist coheres
        # A carrier board's entire cost case is that the firmware does NOT
        # change. If a GPIO moves in a board's pins.h and not in board.json,
        # the carrier has quietly stopped being drop-in — and nothing would
        # notice until a populated board came back from the fab.
        run: python3 scripts/lint_board_design.py
      - name: Board cost models are regenerated
        # cost_model.json/connections.csv are generated from board.json +
        # pricing.json. Committed so the model is reviewable in a diff and
        # works offline; byte-checked so nobody can hand-edit a saving in.
        run: python3 scripts/gen_board_design.py --check
      - name: Hub voice wizard is regenerated
        # tools/hub_voice_setup.sh embeds docs/voice_sentences_en.yaml
        # verbatim (via scripts/gen_hub_voice_setup.py), so the wizard can
        # never install a different sentence grammar than the docs promise.
        run: python3 scripts/gen_hub_voice_setup.py --check
      - name: Help-QR bit matrix is regenerated (7" dock deboss)
        # docs/hardware/enclosure/canary_s3_lcd7_qr.scad is the QR the 7" desk
        # dock debosses into its base — generated by gen_qr.py and committed,
        # but until now with no --check and no workflow running it, so a
        # content change could leave a printed code pointing at the old path.
        # qrcode is pinned: the mask pattern the library picks is part of the
        # bytes, so "same content" is only byte-identical per library version.
        run: |
          python3 -m pip install --quiet qrcode==8.2
          python3 docs/hardware/enclosure/gen_qr.py --check
      - name: verify_pipeline.sh false-pass regression tests
        run: bash integrations/ha_frigate_mqtt/tests/test_verify_pipeline.sh
