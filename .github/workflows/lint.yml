name: Repo Lints

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# These checks only read the repo.
permissions:
  contents: read

# Cheap grep-based lints that cross-check firmware headers, spec tables, and
# flag declarations repo-wide — kept unfiltered on purpose, but stale PR runs
# are still cancelled when a new head arrives.
concurrency:
  group: repo-lints-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scripts:
    name: scripts/lint_*.sh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Conformance + hygiene lints that previously had no CI gate.
      - name: CAP-mapping conformance
        run: bash scripts/lint_cap_mapping.sh
      - name: Non-impersonation contract
        run: bash scripts/lint_no_impersonation.sh
      - name: Feature-flag hygiene
        run: bash scripts/lint_feature_flags.sh
      - name: Version lockstep (kernel / integration / add-on)
        run: bash scripts/lint_version_sync.sh
      - name: Witness Dictionary sync (Rust / Python / JS / firmware)
        run: python3 scripts/lint_dictionary_sync.py
      - name: Vehicle DBC signal math (golden vectors)
        run: python3 scripts/dbc_signal_resolve.py selftest
      - name: Vehicle profiles match their vendored DBC excerpts
        run: python3 scripts/dbc_signal_resolve.py check-profiles
      - name: Docs index — no stragglers, no dead links
        run: python3 scripts/lint_docs_index.py
      - name: Build matrix matches platformio.ini + config.h
        run: python3 scripts/lint_build_matrix.py
      - name: BOM CSVs — schema-clean and wired into the generator
        run: python3 scripts/lint_bom.py
      - name: BOM pricing engine — contract tests
        run: python3 scripts/tests/test_bom_pricing.py
      - name: verify_pipeline.sh false-pass regression tests
        run: bash integrations/ha_frigate_mqtt/tests/test_verify_pipeline.sh
