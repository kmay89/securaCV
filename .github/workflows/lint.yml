name: Repo Lints

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# These checks only read the repo.
permissions:
  contents: read

# Cheap grep-based lints that cross-check firmware headers, spec tables, and
# flag declarations repo-wide — kept unfiltered on purpose, but stale PR runs
# are still cancelled when a new head arrives.
concurrency:
  group: repo-lints-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scripts:
    name: scripts/lint_*.sh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Conformance + hygiene lints that previously had no CI gate.
      - name: CAP-mapping conformance
        run: bash scripts/lint_cap_mapping.sh
      - name: Non-impersonation contract
        run: bash scripts/lint_no_impersonation.sh
      - name: Feature-flag hygiene
        run: bash scripts/lint_feature_flags.sh
      - name: Version lockstep (kernel / integration / add-on)
        run: bash scripts/lint_version_sync.sh
      - name: Desktop apps state ONE version (tauri.conf = package.json = Cargo.toml)
        # Each Tauri app carries its version in three files. tauri.conf.json
        # names the release TAG; Cargo.toml is what the running app shows the
        # USER in its footer. They drifted — the Flasher shipped as 0.2.2 with a
        # footer reading v0.1.0 — so a bug report named a version that was never
        # released. All three, both apps, checked on every PR.
        run: python3 desktop/scripts/check_app_versions.py
      - name: Desktop apps say WHAT the version changes (RELEASE_NOTES.md)
        # The newest section of each app's RELEASE_NOTES.md must match its
        # tauri.conf.json version. The release workflows publish that section as
        # the release body and as the updater manifest's notes — the text the
        # in-app "update ready" UI shows — so a bump without notes would ship an
        # update that can't say what it changes.
        run: python3 desktop/scripts/release_notes.py check
      - name: OTA release key state (reported, never gating)
        # Prints whether the release signing public key is embedded or still all
        # zeros (OTA hard-disabled). Informational on purpose: a repo without the
        # key is a legitimate state — a SILENT one was the problem, since it
        # makes every product read "unavailable" in the flasher with no clue why.
        run: python3 firmware/scripts/ota_key_state.py
      - name: USB console agreement (release FQBNs vs the bench)
        # An S3 built without CDC-on-boot prints `Serial` to UART0: it builds,
        # flashes, runs — and the app's serial monitor is silent, with no
        # visible cause. Three release FQBNs had drifted from the PlatformIO
        # bench when this lint was added.
        run: python3 scripts/lint_usb_console.py
      - name: Wi-Fi join policy (no reboot loops on a dead link)
        # A board that reboots because its boot-time Wi-Fi join timed out
        # re-runs the identical join forever: it never finishes booting, so the
        # setup wizard that could fix the password never appears. That shipped,
        # and it looked like a dead board. THREE firmwares had copy-pasted the
        # retry logic and drifted; a fourth copy was in the wasm emulator. The
        # rule now lives once in common/network/wifi_join_policy.h, and this
        # lint is what stops a fifth copy appearing.
        run: python3 scripts/lint_wifi_join_policy.py
      - name: Tests for the lints themselves
        # The Wi-Fi lint decides whether a reboot is gated by walking C++ brace
        # depth with regexes — a heuristic, and an untested heuristic is a guard
        # that reads as covered while catching nothing. THREE defects were found
        # in that one lint before it worked: a proximity window that missed its
        # own bug class, an innermost-block check that rejected correct code,
        # and `\bever_online\b` failing to match `s_ever_online` because `_` is
        # a word character. Each is pinned as a test.
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Witness Dictionary sync (Rust / Python / JS / firmware)
        run: python3 scripts/lint_dictionary_sync.py
      - name: Vehicle DBC signal math (golden vectors)
        run: python3 scripts/dbc_signal_resolve.py selftest
      - name: Vehicle profiles match their vendored DBC excerpts
        run: python3 scripts/dbc_signal_resolve.py check-profiles
      - name: Docs index — no stragglers, no dead links
        run: python3 scripts/lint_docs_index.py
      - name: Agent entrypoints match AGENTS.md
        # Every AI tool reads a different filename (GEMINI.md, QWEN.md,
        # copilot-instructions.md, .cursor/rules, .clinerules, .windsurfrules).
        # They're generated from the one brief in AGENTS.md, because a stale copy
        # is worse than no copy — the agent trusts it and confidently breaks a
        # rule (says "flock", widens the raw-frame accessor) that AGENTS.md
        # forbids.
        run: python3 scripts/gen_agent_entrypoints.py --check
      - name: Build matrix matches platformio.ini + config.h
        run: python3 scripts/lint_build_matrix.py
      - name: common/ library manifests are LDF-consistent
        run: python3 scripts/lint_common_lib_manifests.py
      - name: BOM CSVs — schema-clean and wired into the generator
        run: python3 scripts/lint_bom.py
      - name: BOM pricing engine — contract tests
        run: python3 scripts/tests/test_bom_pricing.py
      - name: verify_pipeline.sh false-pass regression tests
        run: bash integrations/ha_frigate_mqtt/tests/test_verify_pipeline.sh
