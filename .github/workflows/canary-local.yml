# canary.local page CI — the emulator is the firmware, so this workflow
# proves three things on every change to either side of that boundary:
#   1. the display firmware still compiles to WebAssembly (both flavors)
#   2. the freshly-built firmware actually boots in a browser (probe:
#      framebuffer flushes, boot banner, MQTT round-trip, TOFU pinning)
#   3. the page's DOM-free logic tests pass, and committed dist/
#      artifacts stay consistent with the registry's firmware train
name: canary.local

on:
  push:
    branches: [main]
    paths:
      - "canary-local/**"
      - "firmware/projects/canary-wap/**"
      - "firmware/projects/canary-sense/**"
      - "docs/getting_started_canary.md"
      - "docs/canary_sense_mr60bha2_design.md"
      - "src/vault/**"
      - "src/break_glass/**"
      - "src/crypto/signatures.rs"
      - "spec/invariants.md"
      - "docs/sealed_snapshot_vault.md"
      - "docs/frigate_integration.md"
      - "README.md"
      - "firmware/projects/canary-display/**"
      - "firmware/configs/**"
      - "firmware/boards/xiao-esp32s3-round/**"
      - "firmware/boards/xiao-esp32c6-mr60/**"
      - "firmware/boards/waveshare-esp32s3-lcd43/**"
      - "firmware/common/**"
      - "firmware/flavors.json"
      - "firmware/envs/**"
      - "canary-local/tools/gen_flash.py"
      - "docs/hardware/enclosure/**"
      - "docs/hardware/bom_*.csv"
      - "docs/homeassistant_setup.md"
      - "custom_components/securacv/manifest.json"
      - "hacs.json"
      - "sbom/README.md"
      - ".github/workflows/canary-local.yml"
  pull_request:
    paths:
      - "canary-local/**"
      - "firmware/projects/canary-wap/**"
      - "firmware/projects/canary-sense/**"
      - "docs/getting_started_canary.md"
      - "docs/canary_sense_mr60bha2_design.md"
      - "src/vault/**"
      - "src/break_glass/**"
      - "src/crypto/signatures.rs"
      - "spec/invariants.md"
      - "docs/sealed_snapshot_vault.md"
      - "docs/frigate_integration.md"
      - "README.md"
      - "firmware/projects/canary-display/**"
      - "firmware/configs/**"
      - "firmware/boards/xiao-esp32s3-round/**"
      - "firmware/boards/xiao-esp32c6-mr60/**"
      - "firmware/boards/waveshare-esp32s3-lcd43/**"
      - "firmware/common/**"
      - "firmware/flavors.json"
      - "firmware/envs/**"
      - "canary-local/tools/gen_flash.py"
      - "docs/hardware/enclosure/**"
      - "docs/hardware/bom_*.csv"
      - "docs/homeassistant_setup.md"
      - "custom_components/securacv/manifest.json"
      - "hacs.json"
      - "sbom/README.md"
      - ".github/workflows/canary-local.yml"

permissions:
  contents: read

jobs:
  logic-tests:
    name: page logic tests (committed artifacts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Node tests (shipped source, repo convention)
        run: |
          node --test canary-local/tests/canary_local.test.js
          node --test canary-local/tests/chooser.test.js
          node --test canary-local/tests/house.test.js
          node --test canary-local/tests/workshop.test.js
          node --test canary-local/tests/boards.test.js
          node --test canary-local/tests/assembly.test.js
          node --test canary-local/tests/boardroom.test.js
          node --test canary-local/tests/homeassistant.test.js
          node --test canary-local/tests/wap.test.js
          node --test canary-local/tests/vision.test.js
          node --test canary-local/tests/sense.test.js
          node --test canary-local/tests/vault.test.js
          node --test canary-local/tests/bench.test.js
          node --test canary-local/tests/start.test.js
          node --test canary-local/tests/flash.test.js
      - name: Enclosure catalog drift (JSON only — preview meshes vary by openscad build)
        run: |
          python3 canary-local/tools/gen_enclosures.py
          if ! git diff --exit-code -- canary-local/devices/enclosures.json canary-local/devices/build.json canary-local/devices/workshop.json; then
            echo "::error::generated catalog stale — run canary-local/tools/gen_enclosures.py and commit"
            exit 1
          fi
      - name: Hub data drift (deterministic run — upstream snapshot preserved verbatim)
        run: |
          python3 canary-local/tools/gen_homeassistant.py
          if ! git diff --exit-code -- canary-local/devices/homeassistant.json; then
            echo "::error::generated hub data stale — run canary-local/tools/gen_homeassistant.py and commit"
            exit 1
          fi
      - name: Get Started data drift (rides the Hub snapshot + README install strings)
        run: |
          python3 canary-local/tools/gen_start.py
          if ! git diff --exit-code -- canary-local/devices/start.json; then
            echo "::error::generated guide data stale — run canary-local/tools/gen_start.py and commit"
            exit 1
          fi
      - name: WAP data drift (parsed from the canary-wap firmware + docs)
        run: |
          python3 canary-local/tools/gen_wap.py
          if ! git diff --exit-code -- canary-local/devices/wap.json; then
            echo "::error::generated WAP data stale — run canary-local/tools/gen_wap.py and commit (the firmware moved)"
            exit 1
          fi
      - name: Vision data drift (parsed from the canary-vision firmware + docs)
        run: |
          python3 canary-local/tools/gen_vision.py
          if ! git diff --exit-code -- canary-local/devices/vision.json; then
            echo "::error::generated Vision data stale — run canary-local/tools/gen_vision.py and commit (the firmware moved)"
            exit 1
          fi
      - name: Sense data drift (parsed from the canary-sense firmware + design doc)
        run: |
          python3 canary-local/tools/gen_sense.py
          if ! git diff --exit-code -- canary-local/devices/sense.json; then
            echo "::error::generated Sense data stale — run canary-local/tools/gen_sense.py and commit (the firmware moved)"
            exit 1
          fi
      - name: Vault data drift (parsed from src/vault, src/break_glass + specs)
        run: |
          python3 canary-local/tools/gen_vault.py
          if ! git diff --exit-code -- canary-local/devices/vault.json; then
            echo "::error::generated Vault data stale — run canary-local/tools/gen_vault.py and commit (the code moved)"
            exit 1
          fi

      - name: Flash catalog drift (chip guard derived from the firmware tree)
        run: |
          python3 canary-local/tools/gen_flash.py
          if ! git diff --exit-code -- canary-local/devices/flash.json; then
            echo "::error::generated flash catalog stale — a board's chip changed. Run canary-local/tools/gen_flash.py and commit."
            exit 1
          fi

      - name: Flasher release build-map covers every product
        # The release factory-image builder (firmware/scripts/build_flash_manifest.py)
        # must know how to build every product the flasher offers, or a new
        # board would silently vanish from the in-browser flasher.
        run: |
          python3 - <<'PY'
          import json, sys
          sys.path.insert(0, "firmware/scripts")
          import build_flash_manifest as bfm
          catalog = json.load(open("canary-local/devices/flash.json"))
          missing = [p["id"] for p in catalog["products"] if p["id"] not in bfm.BUILD]
          if missing:
              print("::error::build_flash_manifest.py BUILD map is missing:", ", ".join(missing),
                    "— add build locations for it (or drop it from gen_flash.py).")
              sys.exit(1)
          print(f"BUILD map covers all {len(catalog['products'])} flasher products.")
          PY

  wasm-build-and-boot:
    name: firmware → wasm → boots in a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: SHA-256 shim vectors (FIPS 180-4)
        run: |
          gcc -I canary-local/emulator/shim \
            canary-local/emulator/test/sha256_vectors.c \
            canary-local/emulator/src/emu_sha256.c -o /tmp/shacheck
          /tmp/shacheck
      - name: Install emscripten
        run: |
          sudo apt-get update
          sudo apt-get install -y emscripten
          emcc --version | head -1
      - name: Cache third-party sources
        uses: actions/cache@v4
        with:
          path: canary-local/emulator/third_party
          key: canary-local-tp-${{ hashFiles('canary-local/emulator/build.sh') }}
      - name: Install Playwright Chromium
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
      - name: Boot probe — COMMITTED artifacts (what a bare checkout serves)
        run: node canary-local/tests/boot_probe.mjs
      - name: Workshop probe — the configurator drives the real catalog
        run: node canary-local/tests/workshop_probe.mjs
      - name: Board Room probe — pin flags + wiring on the committed meshes
        run: node canary-local/tests/boardroom_probe.mjs
      - name: Bench probe — the physical test bench drives the live firmware
        run: node canary-local/tests/bench_probe.mjs
      - name: Render probe — studio shaders compile and every device shades on a real GPU
        run: node canary-local/tests/render_probe.mjs
      - name: WAP probe — first-boot, captive portal, serial + MQTT
        run: node canary-local/tests/wap_probe.mjs
      - name: Vision probe — two ports, model load + preview, boot, MQTT, aim
        run: node canary-local/tests/vision_probe.mjs
      - name: Sense probe — radar lab, serial, MQTT + flavor-gated entities
        run: node canary-local/tests/sense_probe.mjs
      - name: Vault probe — seal walkthrough + real Ed25519 break-glass quorum
        run: node canary-local/tests/vault_probe.mjs
      - name: Build both flavors from THIS tree
        run: |
          cd canary-local/emulator
          ./build.sh all
      - name: Dist drift check (committed artifacts match this tree's sources)
        run: |
          # meta.json embeds the checkout sha, which legitimately differs on
          # a PR merge ref — the drift gate is the code bundles themselves.
          if ! git diff --stat --exit-code -- 'canary-local/emulator/dist/*.js'; then
            echo "── first differing bytes per artifact (diagnosis) ──"
            for f in canary-local/emulator/dist/*.js; do
              git show "HEAD:$f" > /tmp/committed.js || continue
              off=$(cmp /tmp/committed.js "$f" | awk '{print $5}' | tr -d ',')
              [ -n "$off" ] || continue
              start=$(( off > 80 ? off - 80 : 1 ))
              echo "· $f @ byte $off"
              echo "  committed: $(tail -c +$start /tmp/committed.js | head -c 160 | tr -d '\n')"
              echo "  rebuilt:   $(tail -c +$start "$f" | head -c 160 | tr -d '\n')"
            done
            echo "::error::emulator dist/ artifacts do not match a rebuild from this tree — run canary-local/emulator/build.sh all and commit the result"
            exit 1
          fi
      - name: Boot probe — rebuilt artifacts
        run: node canary-local/tests/boot_probe.mjs
      - name: Artifact stamps
        run: cat canary-local/emulator/dist/*.meta.json
