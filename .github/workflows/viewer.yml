name: Evidence Viewer

# Scoped to the JS surfaces these jobs actually test: the offline viewer,
# the canary-vision workspace, the HA timeline card, and the canary-wap
# self-test UI logic.
on:
  push:
    branches: [ "main" ]
    paths:
      - 'viewer/**'
      - 'canary-vision/**'
      - 'custom_components/securacv/www/**'
      - 'firmware/projects/canary-wap/arduino/canary_wap/**'
      # build.mjs bakes these fixtures into the committed single-file viewer,
      # so a fixture-only edit must also trip the drift gate.
      - 'tests/fixtures/envelope/**'
      - 'tests/fixtures/export_bundle/**'
      # The timeline parity fixture is asserted by the JS tests here and by
      # the Swift tests on the Apple runners — an edit to it alone must still
      # be checked, or the two implementations can drift through the fixture.
      - 'viewer/fixtures/timeline/**'
      # recovery_kit.test.js holds the iPhone's "No recovery kit?" advice
      # (PairView) to the WAP's dashboard, and its "Open its page" link to
      # the address DeviceAPI builds, so an edit to either alone runs it.
      - 'ios/Sources/SecuraCV/Views/PairView.swift'
      - 'ios/Sources/SecuraCV/Transport/DeviceAPI.swift'
      # the viewer job's suites read the witness dictionary (timeline_core,
      # the HA timeline card and gen_timeline_parity.mjs) and run the
      # break-glass console's test against its page, so an edit to any of
      # them alone runs the job (the recorded-reads gate below found them)
      - 'spec/witness_dictionary.json'
      - 'src/break_glass/breakglass.html'
      - 'src/break_glass/breakglass.test.js'
      # the recorded-reads gate on viewer and selftest-ui: its recorder and
      # its checker
      - 'scripts/path_filter_reads/**'
      - 'scripts/check_path_filter_reads.py'
      - '.github/workflows/viewer.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'viewer/**'
      - 'canary-vision/**'
      - 'custom_components/securacv/www/**'
      - 'firmware/projects/canary-wap/arduino/canary_wap/**'
      # build.mjs bakes these fixtures into the committed single-file viewer,
      # so a fixture-only edit must also trip the drift gate.
      - 'tests/fixtures/envelope/**'
      - 'tests/fixtures/export_bundle/**'
      # The timeline parity fixture is asserted by the JS tests here and by
      # the Swift tests on the Apple runners — an edit to it alone must still
      # be checked, or the two implementations can drift through the fixture.
      - 'viewer/fixtures/timeline/**'
      # recovery_kit.test.js holds the iPhone's "No recovery kit?" advice
      # (PairView) to the WAP's dashboard, and its "Open its page" link to
      # the address DeviceAPI builds, so an edit to either alone runs it.
      - 'ios/Sources/SecuraCV/Views/PairView.swift'
      - 'ios/Sources/SecuraCV/Transport/DeviceAPI.swift'
      # the viewer job's suites read the witness dictionary (timeline_core,
      # the HA timeline card and gen_timeline_parity.mjs) and run the
      # break-glass console's test against its page, so an edit to any of
      # them alone runs the job (the recorded-reads gate below found them)
      - 'spec/witness_dictionary.json'
      - 'src/break_glass/breakglass.html'
      - 'src/break_glass/breakglass.test.js'
      # the recorded-reads gate on viewer and selftest-ui: its recorder and
      # its checker
      - 'scripts/path_filter_reads/**'
      - 'scripts/check_path_filter_reads.py'
      - '.github/workflows/viewer.yml'

permissions:
  contents: read

concurrency:
  # PRs collapse per branch; each main commit gets its own group, so a burst
  # of merges can never evict the main run queued behind another (CI.md R3).
  group: viewer-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  viewer:
    runs-on: ubuntu-24.04  # pinned ahead of the 26.04 image move; revisit before 24.04 retires
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version-file: pyproject.toml
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
    # The recorded-reads gate (scripts/check_path_filter_reads.py), as
    # selftest-ui below runs it: each step records the repo paths its
    # processes read, and the last step fails on a read outside this
    # workflow's pull_request paths. These steps read the witness
    # dictionary and the break-glass page, which the filter left out until
    # the gate was armed here; a PR editing only those ran nothing.
    - name: Cross-language verifier parity tests
      env:
        PATH_FILTER_READS_DIR: ${{ runner.temp }}/path-filter-reads-viewer
        NODE_OPTIONS: --require ${{ github.workspace }}/scripts/path_filter_reads/record.cjs
        PYTHONPATH: ${{ github.workspace }}/scripts/path_filter_reads
      run: node --test viewer/verify_core.test.js
    - name: Timeline scrub-view model tests
      env:
        PATH_FILTER_READS_DIR: ${{ runner.temp }}/path-filter-reads-viewer
        NODE_OPTIONS: --require ${{ github.workspace }}/scripts/path_filter_reads/record.cjs
        PYTHONPATH: ${{ github.workspace }}/scripts/path_filter_reads
      run: node --test viewer/timeline_core.test.js
    - name: Timeline cross-language parity fixture is up to date
      env:
        PATH_FILTER_READS_DIR: ${{ runner.temp }}/path-filter-reads-viewer
        NODE_OPTIONS: --require ${{ github.workspace }}/scripts/path_filter_reads/record.cjs
        PYTHONPATH: ${{ github.workspace }}/scripts/path_filter_reads
      run: node viewer/tools/gen_timeline_parity.mjs --check
    - name: Offline viewer is up to date (no drift from its inlined sources)
      env:
        PATH_FILTER_READS_DIR: ${{ runner.temp }}/path-filter-reads-viewer
        NODE_OPTIONS: --require ${{ github.workspace }}/scripts/path_filter_reads/record.cjs
        PYTHONPATH: ${{ github.workspace }}/scripts/path_filter_reads
      run: node viewer/build.mjs --check
    - name: HA timeline card helper tests
      env:
        PATH_FILTER_READS_DIR: ${{ runner.temp }}/path-filter-reads-viewer
        NODE_OPTIONS: --require ${{ github.workspace }}/scripts/path_filter_reads/record.cjs
        PYTHONPATH: ${{ github.workspace }}/scripts/path_filter_reads
      run: node --test custom_components/securacv/www/securacv-timeline-card.test.js
    - name: HA aim card helper tests
      env:
        PATH_FILTER_READS_DIR: ${{ runner.temp }}/path-filter-reads-viewer
        NODE_OPTIONS: --require ${{ github.workspace }}/scripts/path_filter_reads/record.cjs
        PYTHONPATH: ${{ github.workspace }}/scripts/path_filter_reads
      run: node --test custom_components/securacv/www/securacv-aim-card.test.js
    - name: Break-glass console polling tests
      env:
        PATH_FILTER_READS_DIR: ${{ runner.temp }}/path-filter-reads-viewer
        NODE_OPTIONS: --require ${{ github.workspace }}/scripts/path_filter_reads/record.cjs
        PYTHONPATH: ${{ github.workspace }}/scripts/path_filter_reads
      run: node --test src/break_glass/breakglass.test.js
    - name: Every file the viewer job's steps read is inside this workflow's path filter
      # Reads the recordings the seven steps above left (nothing is run
      # again). A miss names the test, the file, the line that read it and
      # the line to add to BOTH path lists (R6). PyYAML reads this file.
      run: |
        python3 -m pip install --quiet pyyaml
        python3 scripts/check_path_filter_reads.py \
          --workflow .github/workflows/viewer.yml --job viewer \
          --reads "$RUNNER_TEMP/path-filter-reads-viewer"

  canary-bridge:
    runs-on: ubuntu-24.04  # pinned ahead of the 26.04 image move; revisit before 24.04 retires
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: canary-vision/package-lock.json
    - name: Install canary-vision deps
      working-directory: canary-vision
      # npm ci against the committed lockfile (what setup-node caches on);
      # `npm install` resolved fresh every run and could drift from the lock.
      run: npm ci --workspaces --no-audit --no-fund
    # ALL three suites, by glob. The previous four hand-listed files left 26
    # of the 30 test files — including every one of the eleven security
    # suites (auth, cors, host-validation, private-network-access, no-scan,
    # no-fleet-sync, rate-limit, camera-peek, security-headers, token-expiry,
    # webhook-url) — running in no workflow at all. A glob cannot forget a
    # new file the way a list does; run-all.sh is the same set for a laptop.
    - name: Security suites (auth, CORS, PNA, host validation, rate limit, headers, token expiry, webhook URL)
      working-directory: canary-vision
      run: node --test tests/security/*.test.js
    - name: Device API suites (info, config, logs, peers, provision, reboot, update, webhook, envelope bridge, witness chain)
      working-directory: canary-vision
      run: node --test tests/api/*.test.js
    - name: SPA suites (verified timeline)
      working-directory: canary-vision
      run: node --test tests/spa/*.test.js

  selftest-ui:
    runs-on: ubuntu-24.04  # pinned ahead of the 26.04 image move; revisit before 24.04 retires
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version-file: pyproject.toml
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
    # The path-filter gate (sweep CI2, as canary-local.yml's logic-tests
    # job runs it): each suite step below records the repo paths its
    # processes read (scripts/check_path_filter_reads.py says how), and the
    # last step fails on a read outside this workflow's pull_request paths.
    # A suite here that reads a file outside the sketch (recovery_kit.test.js
    # reads the iPhone's PairView and DeviceAPI) would otherwise go unrun by a
    # PR that edits only that file, and the red would land on the next
    # sketch PR. A suite step added without this env block is named by the
    # gate as a suite it never heard from.
    - name: Pre-flight self-test UI logic (probe×status hint matrix)
      env:
        PATH_FILTER_READS_DIR: ${{ runner.temp }}/path-filter-reads
        NODE_OPTIONS: --require ${{ github.workspace }}/scripts/path_filter_reads/record.cjs
        PYTHONPATH: ${{ github.workspace }}/scripts/path_filter_reads
      run: node --test firmware/projects/canary-wap/arduino/canary_wap/selftest_ui.test.js
    - name: Onboarding wizard logic tests
      env:
        PATH_FILTER_READS_DIR: ${{ runner.temp }}/path-filter-reads
        NODE_OPTIONS: --require ${{ github.workspace }}/scripts/path_filter_reads/record.cjs
        PYTHONPATH: ${{ github.workspace }}/scripts/path_filter_reads
      run: node --test firmware/projects/canary-wap/arduino/canary_wap/wizard_logic.test.js
    - name: Admin dashboard logic tests (peek URL, retry policy, BLE endpoint)
      env:
        PATH_FILTER_READS_DIR: ${{ runner.temp }}/path-filter-reads
        NODE_OPTIONS: --require ${{ github.workspace }}/scripts/path_filter_reads/record.cjs
        PYTHONPATH: ${{ github.workspace }}/scripts/path_filter_reads
      run: node --test firmware/projects/canary-wap/arduino/canary_wap/web_ui_logic.test.js
    - name: Recovery kit offer (dashboard BOOT-tap sign-in, wizard close-out)
      env:
        PATH_FILTER_READS_DIR: ${{ runner.temp }}/path-filter-reads
        NODE_OPTIONS: --require ${{ github.workspace }}/scripts/path_filter_reads/record.cjs
        PYTHONPATH: ${{ github.workspace }}/scripts/path_filter_reads
      run: node --test firmware/projects/canary-wap/arduino/canary_wap/recovery_kit.test.js
    - name: Dashboard gates (Camera and Community views only where the build serves them, Export saves its answer)
      env:
        PATH_FILTER_READS_DIR: ${{ runner.temp }}/path-filter-reads
        NODE_OPTIONS: --require ${{ github.workspace }}/scripts/path_filter_reads/record.cjs
        PYTHONPATH: ${{ github.workspace }}/scripts/path_filter_reads
      run: node --test firmware/projects/canary-wap/arduino/canary_wap/dashboard_gates.test.js
    - name: Every file the self-test UI suites read is inside this workflow's path filter
      # Reads the recordings the five suite steps above left (the suites
      # are not run again). A miss names the test, the file, the line that
      # read it and the line to add to BOTH path lists (R6). PyYAML reads
      # this file.
      run: |
        python3 -m pip install --quiet pyyaml
        python3 scripts/check_path_filter_reads.py \
          --workflow .github/workflows/viewer.yml --job selftest-ui \
          --reads "$RUNNER_TEMP/path-filter-reads"

  canary-vision-lint:
    name: ESLint (canary-vision)
    runs-on: ubuntu-24.04  # pinned ahead of the 26.04 image move; revisit before 24.04 retires
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: canary-vision/package-lock.json
    - name: Install canary-vision deps
      working-directory: canary-vision
      run: npm ci
    - name: ESLint (device-api + spa + tests)
      working-directory: canary-vision
      run: npm run lint
