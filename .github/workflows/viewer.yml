name: Evidence Viewer

# Scoped to the JS surfaces these jobs actually test: the offline viewer,
# the canary-vision workspace, the HA timeline card, and the canary-wap
# self-test UI logic.
on:
  push:
    branches: [ "main" ]
    paths:
      - 'viewer/**'
      - 'canary-vision/**'
      - 'custom_components/securacv/www/**'
      - 'firmware/projects/canary-wap/arduino/canary_wap/**'
      # build.mjs bakes these fixtures into the committed single-file viewer,
      # so a fixture-only edit must also trip the drift gate.
      - 'tests/fixtures/envelope/**'
      - 'tests/fixtures/export_bundle/**'
      # The timeline parity fixture is asserted by the JS tests here and by
      # the Swift tests on the Apple runners — an edit to it alone must still
      # be checked, or the two implementations can drift through the fixture.
      - 'viewer/fixtures/timeline/**'
      - '.github/workflows/viewer.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'viewer/**'
      - 'canary-vision/**'
      - 'custom_components/securacv/www/**'
      - 'firmware/projects/canary-wap/arduino/canary_wap/**'
      # build.mjs bakes these fixtures into the committed single-file viewer,
      # so a fixture-only edit must also trip the drift gate.
      - 'tests/fixtures/envelope/**'
      - 'tests/fixtures/export_bundle/**'
      # The timeline parity fixture is asserted by the JS tests here and by
      # the Swift tests on the Apple runners — an edit to it alone must still
      # be checked, or the two implementations can drift through the fixture.
      - 'viewer/fixtures/timeline/**'
      - '.github/workflows/viewer.yml'

permissions:
  contents: read

concurrency:
  group: viewer-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
    - name: Cross-language verifier parity tests
      run: node --test viewer/verify_core.test.js
    - name: Timeline scrub-view model tests
      run: node --test viewer/timeline_core.test.js
    - name: Timeline cross-language parity fixture is up to date
      run: node viewer/tools/gen_timeline_parity.mjs --check
    - name: Offline viewer is up to date (no drift from its inlined sources)
      run: node viewer/build.mjs --check
    - name: HA timeline card helper tests
      run: node --test custom_components/securacv/www/securacv-timeline-card.test.js
    - name: HA aim card helper tests
      run: node --test custom_components/securacv/www/securacv-aim-card.test.js
    - name: Break-glass console polling tests
      run: node --test src/break_glass/breakglass.test.js

  canary-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: canary-vision/package-lock.json
    - name: Install canary-vision deps
      working-directory: canary-vision
      # npm ci against the committed lockfile (what setup-node caches on);
      # `npm install` resolved fresh every run and could drift from the lock.
      run: npm ci --workspaces --no-audit --no-fund
    # ALL three suites, by glob. The previous four hand-listed files left 26
    # of the 30 test files — including every one of the eleven security
    # suites (auth, cors, host-validation, private-network-access, no-scan,
    # no-fleet-sync, rate-limit, camera-peek, security-headers, token-expiry,
    # webhook-url) — running in no workflow at all. A glob cannot forget a
    # new file the way a list does; run-all.sh is the same set for a laptop.
    - name: Security suites (auth, CORS, PNA, host validation, rate limit, headers, token expiry, webhook URL)
      working-directory: canary-vision
      run: node --test tests/security/*.test.js
    - name: Device API suites (info, config, logs, peers, provision, reboot, update, webhook, envelope bridge, witness chain)
      working-directory: canary-vision
      run: node --test tests/api/*.test.js
    - name: SPA suites (verified timeline)
      working-directory: canary-vision
      run: node --test tests/spa/*.test.js

  selftest-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
    - name: Pre-flight self-test UI logic (probe×status hint matrix)
      run: node --test firmware/projects/canary-wap/arduino/canary_wap/selftest_ui.test.js
    - name: Onboarding wizard logic tests
      run: node --test firmware/projects/canary-wap/arduino/canary_wap/wizard_logic.test.js
    - name: Admin dashboard logic tests (peek URL, retry policy, BLE endpoint)
      run: node --test firmware/projects/canary-wap/arduino/canary_wap/web_ui_logic.test.js

  canary-vision-lint:
    name: ESLint (canary-vision)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: canary-vision/package-lock.json
    - name: Install canary-vision deps
      working-directory: canary-vision
      run: npm ci
    - name: ESLint (device-api + spa + tests)
      working-directory: canary-vision
      run: npm run lint
