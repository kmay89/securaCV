name: Evidence Viewer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  viewer:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Cross-language verifier parity tests
      run: node --test viewer/verify_core.test.js
    - name: Offline viewer is up to date (no drift from verify_core.js)
      run: node viewer/build.mjs --check
    - name: HA timeline card helper tests
      run: node --test custom_components/securacv/www/securacv-timeline-card.test.js

  canary-bridge:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install canary-vision deps
      working-directory: canary-vision
      run: npm install --workspaces
    - name: Envelope-bridge tests (build + shared-verifier reuse)
      working-directory: canary-vision
      run: node --test tests/api/envelope-bridge.test.js
    - name: SPA verified-timeline tests (in-app envelope rendering)
      working-directory: canary-vision
      run: node --test tests/spa/verified-timeline.test.js

  selftest-ui:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Pre-flight self-test UI logic (probe×status hint matrix)
      run: node --test firmware/projects/canary-wap/arduino/canary_wap/selftest_ui.test.js
