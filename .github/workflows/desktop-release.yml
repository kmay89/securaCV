# Desktop app release — builds the SecuraCV Lab (Tauri) for macOS + Linux
# and publishes the installers to a GitHub Release.
#
# Trigger: push a tag like `app-v0.1.0`. (Bump `version` in
# desktop-lab/package.json AND desktop-lab/src-tauri/tauri.conf.json first.)
# Also runnable manually (workflow_dispatch) for a test build.
name: Desktop app release

on:
  push:
    tags:
      - "app-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest      # universal .dmg + .app (Apple Silicon + Intel)
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04      # .AppImage + .deb
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop-lab/src-tauri -> target

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tauri CLI
        working-directory: desktop-lab
        run: npm install

      - name: Build & publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional Apple codesign/notarize secrets (used automatically if set):
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: desktop-lab
          tagName: app-v__VERSION__
          releaseName: "SecuraCV Lab v__VERSION__"
          releaseBody: |
            The **SecuraCV Lab**, as a native app — local-first, nothing phones home.

            - **macOS**: download the `.dmg` (universal — Apple Silicon & Intel).
            - **Linux**: `.AppImage` (runs anywhere) or `.deb` (Debian/Ubuntu).

            First launch on macOS: unsigned builds may need right-click → Open.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
