# Desktop app release — builds the SecuraCV Lab (Tauri) for macOS + Linux
# and publishes the installers to a GitHub Release.
#
# Trigger: push a tag like `app-v0.1.0`. (Bump `version` in
# desktop-lab/package.json AND desktop-lab/src-tauri/tauri.conf.json first.)
# Also runnable manually (workflow_dispatch) — leave `publish` unchecked for a
# throwaway build-only smoke test, or check it to cut a draft release.
#
# On `releases/latest`: this workflow needs no keep-firmware-latest step (unlike
# desktop-flasher-release.yml) because it only ever creates a DRAFT, and a draft
# is never GitHub's "latest". Publishing that draft could take `latest` — the
# URL every Canary polls for OTA — so both publish paths defend it: a human
# publish fires a `release:` event and release-latest-guard.yml re-points it,
# and lab-publish.yml publishes with `--latest=false` and calls the same action
# directly, because CI-published releases fire no event.
#
# Self-update: the Lab polls the rolling `lab-latest` prerelease pointer (its
# own — NEVER `releases/latest`, and never the Flasher's). This workflow builds
# the signed updater artifacts and hardens the draft's latest.json; the pointer
# advances only once the draft is PUBLISHED, via
# desktop-lab-updater-pointer.yml — triggered by the `release: published` event
# for a human publish, and called directly by lab-publish.yml for a CI one. A
# draft's assets have no public URLs, so the resolve-every-URL guard also lives
# there, after publish.
#
# So this workflow's output is deliberately unfinished. Finish it with
# Actions → "Publish the Lab (draft → live)", or click Publish in the UI.
name: Desktop app release

on:
  push:
    tags:
      - "app-v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a draft GitHub Release (unchecked = build-only smoke test)"
        type: boolean
        default: true

# One release build per ref at a time. A tag build must never be canceled
# mid-flight (half-uploaded release assets), so we only auto-cancel the
# cheap manual smoke-test runs.
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest      # universal .dmg + .app (Apple Silicon + Intel)
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04      # .AppImage + .deb
            args: ""
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    env:
      RUST_BACKTRACE: "1"
      # Updater-manifest signing (same repo key as the Flasher, so both apps
      # embed one pubkey). The "Ensure updater signing key" step overrides
      # these via $GITHUB_ENV when it has to mint an ephemeral key.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: desktop-lab/src-tauri -> target
          key: ${{ matrix.platform }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop-lab/package-lock.json

      - name: Install Tauri CLI
        working-directory: desktop-lab
        run: npm ci

      - name: All three version files agree
        # On the RELEASE path, not just in lint: a pushed `app-v*` tag, or a
        # dispatch from a branch lint hasn't run on, would otherwise publish a
        # bundle whose tag (tauri.conf.json), npm version, and user-visible
        # version (Cargo.toml → the app's own footer) disagree. The Flasher
        # gained this check first; a guard on one app target and not the other is
        # exactly the half-fix RELEASE_LESSONS keeps warning about.
        run: python3 desktop/scripts/check_app_versions.py

      - name: The version says what it changes (RELEASE_NOTES.md)
        # The newest section of desktop-lab/RELEASE_NOTES.md becomes the draft
        # release's body and the updater manifest's notes — the text the Lab's
        # own "update ready" dialog shows. A bump without notes fails here,
        # before a runner minute is spent building.
        run: python3 desktop/scripts/release_notes.py check

      # If the repo has a persistent updater signing key, use it (self-update
      # works across releases). If not, mint an ephemeral one so the build
      # still succeeds — and patch the app's embedded public key to match, so
      # that build is internally consistent. Same step as the Flasher's.
      - name: Ensure updater signing key
        working-directory: desktop-lab
        shell: bash
        env:
          SECRET_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PUBLISH_RUN: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          set -euo pipefail
          if [ -n "${SECRET_KEY:-}" ]; then
            echo "Using repository signing key."
          else
            # An ephemeral key is fine for a build-only smoke run. It is NOT
            # fine for a publish: the updater manifest and the rolling
            # *-latest pointer would advance with .sig files no installed
            # Lab can verify (its embedded pubkey is the repository key), so
            # every existing install would see "update ready" and fail to
            # apply it — self-update bricked fleet-wide until the next real
            # publish. firmware-release.yml already refuses to publish without
            # its OTA key; this is the same posture for the apps.
            if [ "${PUBLISH_RUN:-}" = "true" ]; then
              echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set, and this run PUBLISHES. Refusing to publish an update the installed base cannot verify. Add the repository signing secret (desktop/README.md, 'real self-update signing') or run build-only."
              exit 1
            fi
            echo "::warning::No TAURI_SIGNING_PRIVATE_KEY secret set — minting an EPHEMERAL key so this build-only run succeeds. Cross-release self-update needs a persistent key; see desktop/INSTALL.md."
            npx --yes @tauri-apps/cli signer generate -w "$RUNNER_TEMP/lab.key" --password ""
            # $(cat) strips the trailing newline; a heredoc fails when the file
            # lacks a final newline (the delimiter glues onto the key).
            echo "TAURI_SIGNING_PRIVATE_KEY=$(cat "$RUNNER_TEMP/lab.key")" >> "$GITHUB_ENV"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=" >> "$GITHUB_ENV"
            python3 -c 'import json,sys; p="src-tauri/tauri.conf.json"; c=json.load(open(p)); c["plugins"]["updater"]["pubkey"]=sys.argv[1].strip(); json.dump(c,open(p,"w"),indent=2); print("patched embedded pubkey for ephemeral build")' "$(cat "$RUNNER_TEMP/lab.key.pub")"
          fi

      # Codesigning/notarization is OPT-IN via the `ENABLE_MACOS_SIGNING`
      # repository variable (Settings → Secrets and variables → Actions →
      # Variables). It is split into two steps on purpose: tauri's macOS
      # bundler treats APPLE_CERTIFICATE as "sign me" whenever the env var is
      # *defined at all* — even as an empty string — and then fails importing
      # it. So the default (unsigned) build must define NO APPLE_* env keys.
      # Turn signing on by setting the variable to `true` once real certs +
      # the APPLE_* secrets are in place.
      - name: Build & publish (unsigned)
        if: vars.ENABLE_MACOS_SIGNING != 'true'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # TAURI_SIGNING_PRIVATE_KEY / _PASSWORD come from job-level env
          # (repo secret, or the ephemeral key written to $GITHUB_ENV above).
        with:
          projectPath: desktop-lab
          # Publish on a tag push, or on a manual run when `publish` is checked.
          # A build-only smoke test (publish unchecked) still compiles both
          # bundles and uploads them as workflow artifacts below.
          tagName: ${{ (github.event_name == 'push' || inputs.publish) && 'app-v__VERSION__' || '' }}
          releaseName: "SecuraCV Lab v__VERSION__"
          releaseBody: |
            The **SecuraCV Lab**, as a native app — local-first; it talks only to your own devices, and the one thing it fetches on its own is its signed update manifest.

            - **macOS**: download the `.dmg` (universal — Apple Silicon & Intel).
            - **Linux**: `.AppImage` (runs anywhere) or `.deb` (Debian/Ubuntu).

            ### macOS: first launch (one time)

            These builds are **unsigned**, so macOS quarantines them. On recent
            macOS, right-click → Open no longer works — clear the quarantine flag
            instead. Drag the app to Applications, then in **Terminal** run:

            ```sh
            xattr -dr com.apple.quarantine "/Applications/SecuraCV Lab.app"
            ```

            Then launch it normally. Full steps (and the Terminal-free path on
            older macOS): [`desktop-lab/INSTALL.md`](https://github.com/kmay89/securaCV/blob/main/desktop-lab/INSTALL.md).
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Verify the macOS signing certificate matches the identity
        # Fail in seconds, with the reason, instead of ~10 minutes into a
        # bundle with tauri's terse "certificate ... does not match provided
        # identity". This exact mismatch shipped nothing three times running:
        # the iPhone pipeline reused APPLE_CERTIFICATE for an Apple
        # Distribution/Development .p12, which is NOT what a notarized
        # outside-the-App-Store DMG signs with (Developer ID Application).
        # Hence the separate APPLE_DESKTOP_* namespace — see
        # .github/RELEASE_LESSONS.md 2026-07-29 (m) and desktop/SIGNING.md.
        if: matrix.platform == 'macos-latest' && vars.ENABLE_MACOS_SIGNING == 'true'
        env:
          CERT_B64: ${{ secrets.APPLE_DESKTOP_CERTIFICATE }}
          CERT_PW: ${{ secrets.APPLE_DESKTOP_CERTIFICATE_PASSWORD }}
          WANT: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          if [ -z "${CERT_B64:-}" ]; then
            echo "::error::ENABLE_MACOS_SIGNING is on but APPLE_DESKTOP_CERTIFICATE is empty. The desktop apps sign with their OWN secret now (APPLE_DESKTOP_CERTIFICATE / _PASSWORD, a Developer ID Application .p12) so the iPhone pipeline's APPLE_CERTIFICATE can never overwrite it. Setup: desktop/SIGNING.md."
            exit 1
          fi
          printf '%s' "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/desktop-cert.p12"
          # Every certificate in the .p12, by common name. -legacy covers the
          # RC2-encrypted .p12s Keychain Access still exports.
          if ! openssl pkcs12 -in "$RUNNER_TEMP/desktop-cert.p12" -passin env:CERT_PW -nokeys -legacy \
                 > "$RUNNER_TEMP/certs.pem" 2>/dev/null; then
            openssl pkcs12 -in "$RUNNER_TEMP/desktop-cert.p12" -passin env:CERT_PW -nokeys \
                 > "$RUNNER_TEMP/certs.pem" 2>/dev/null || {
              echo "::error::Could not open the .p12 — APPLE_DESKTOP_CERTIFICATE_PASSWORD is probably wrong, or the base64 isn't a whole .p12 file (use: base64 -i cert.p12)."
              rm -f "$RUNNER_TEMP/desktop-cert.p12"; exit 1; }
          fi
          # Walk the certificates one at a time. NOT csplit: this job runs on
          # macOS, whose BSD csplit has no -z/-b (GNU-only) — it would fail,
          # produce no files, leave CNS empty, and reject every certificate
          # including the right one. awk + a counter is POSIX and behaves the
          # same on both platforms.
          TOTAL=$(grep -c 'BEGIN CERTIFICATE' "$RUNNER_TEMP/certs.pem" || true)
          : > "$RUNNER_TEMP/cns.txt"
          i=1
          while [ "$i" -le "${TOTAL:-0}" ]; do
            awk -v want="$i" '/-----BEGIN CERTIFICATE-----/{c++} c==want' \
              "$RUNNER_TEMP/certs.pem" > "$RUNNER_TEMP/one.pem"
            openssl x509 -in "$RUNNER_TEMP/one.pem" -noout -subject -nameopt multiline 2>/dev/null \
              | awk '/^ *commonName/{sub(/^ *commonName *= */, ""); print}' >> "$RUNNER_TEMP/cns.txt"
            i=$((i + 1))
          done
          rm -f "$RUNNER_TEMP/one.pem"
          CNS=$(awk 'NF' "$RUNNER_TEMP/cns.txt" | sort -u)
          echo "Certificates inside APPLE_DESKTOP_CERTIFICATE:"
          printf '%s\n' "$CNS" | awk '{print "  - " $0}'
          echo "APPLE_SIGNING_IDENTITY asks for: $WANT"
          # Tauri validates against the LAST certificate it finds in the .p12,
          # so ANY extra identity in there aborts the bundle with "does not
          # match provided identity" — even when the right one is present.
          # `security export -t identities` exports EVERY identity in the
          # keychain (including iOS certs that `find-identity -v -p codesigning`
          # doesn't list), which is exactly how that happens. Catch it here, in
          # seconds, instead of ~8 minutes into a build.
          EXTRA=$(printf '%s\n' "$CNS" | grep -vxF "$WANT" || true)
          if [ -n "$EXTRA" ] && printf '%s\n' "$CNS" | grep -qxF "$WANT"; then
            echo "::error::The .p12 holds identities besides the one being used. Tauri checks the LAST certificate it finds and will abort. Re-export ONLY '$WANT' (Keychain Access: expand that certificate, select the certificate row alone, right-click → Export) and update APPLE_DESKTOP_CERTIFICATE. Extra identities found:"
            printf '%s\n' "$EXTRA" | awk '{print "  - " $0}'
            exit 1
          fi
          if ! printf '%s\n' "$CNS" | grep -qxF "$WANT"; then
            echo "::error::The .p12 does not contain the identity named by APPLE_SIGNING_IDENTITY. Signing would fail after a long build. Export the 'Developer ID Application: ...' identity (NOT Apple Distribution, NOT Apple Development) and set APPLE_DESKTOP_CERTIFICATE + APPLE_SIGNING_IDENTITY to the same one — desktop/SIGNING.md."
            exit 1
          fi
          if ! printf '%s' "$WANT" | grep -q '^Developer ID Application:'; then
            echo "::warning::APPLE_SIGNING_IDENTITY is not a 'Developer ID Application' identity. A DMG downloaded outside the App Store needs that one to notarize and open cleanly."
          fi
          echo "Match confirmed."
          # A Developer ID certificate that lapses fails the signing step with a
          # message about the identity, not the date — so judge it here, in
          # seconds. TWO distinct cases, and conflating them was the first
          # version of this check: already expired is FATAL, because signing
          # cannot succeed and spending ~8 minutes to discover that proves
          # nothing; expiring soon only warns, because a release on the last
          # valid day must still ship. The `.p12` is asserted above to hold only
          # the wanted identity, so the first certificate is that one.
          END_DATE="$(openssl x509 -in "$RUNNER_TEMP/certs.pem" -noout -enddate | cut -d= -f2)"
          if ! openssl x509 -in "$RUNNER_TEMP/certs.pem" -checkend 0 >/dev/null 2>&1; then
            echo "::error::The macOS signing certificate EXPIRED on $END_DATE, so signing cannot succeed. Create a new Developer ID Application certificate at developer.apple.com, install it, then re-run desktop/scripts/set-desktop-signing-secrets.sh."
            exit 1
          fi
          if openssl x509 -in "$RUNNER_TEMP/certs.pem" -checkend 2592000 >/dev/null 2>&1; then
            echo "Certificate valid until $END_DATE."
          else
            echo "::warning::The macOS signing certificate expires within 30 days ($END_DATE). Renew it at developer.apple.com, install it, then re-run desktop/scripts/set-desktop-signing-secrets.sh."
          fi

          # ── normalize the .p12 so `security import` will take it ───────────
          # openssl and macOS disagree about PKCS#12. OpenSSL 3 writes AES-256
          # with a SHA-256 MAC; macOS's Security framework only understands the
          # legacy SHA-1 MAC and rejects the rest as
          #   SecKeychainItemImport: MAC verification failed during PKCS12
          #   import (wrong password?)
          # The password is NOT wrong — that message is a lie, and it cost a
          # full 7.5-minute build to read. Every openssl check above passes on
          # such a file, so re-encrypt with SHA-1/3DES here instead of asking
          # each operator to have the right openssl. See RELEASE_LESSONS (p).
          if ! openssl pkcs12 -in "$RUNNER_TEMP/desktop-cert.p12" -passin env:CERT_PW \
                 -nodes -legacy -out "$RUNNER_TEMP/cert-all.pem" 2>/dev/null; then
            openssl pkcs12 -in "$RUNNER_TEMP/desktop-cert.p12" -passin env:CERT_PW \
                 -nodes -out "$RUNNER_TEMP/cert-all.pem" 2>/dev/null \
              || { echo "::error::Could not read the .p12 to normalize it."; exit 1; }
          fi
          openssl pkcs12 -export -in "$RUNNER_TEMP/cert-all.pem" -passout env:CERT_PW \
            -name "$WANT" -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1 \
            -out "$RUNNER_TEMP/desktop-cert-macos.p12" \
            || { echo "::error::Could not re-encrypt the .p12 for macOS."; exit 1; }
          rm -f "$RUNNER_TEMP/cert-all.pem" "$RUNNER_TEMP/desktop-cert.p12"

          # Prove it with the SAME command tauri runs. Every check above is an
          # openssl check, and openssl was perfectly happy with the file macOS
          # refused — so the only check that means anything here is this one.
          PROBE="$RUNNER_TEMP/probe.keychain"
          security create-keychain -p probe "$PROBE" >/dev/null
          if ! security import "$RUNNER_TEMP/desktop-cert-macos.p12" -k "$PROBE" \
                 -P "$CERT_PW" -T /usr/bin/codesign >/dev/null 2>&1; then
            security delete-keychain "$PROBE" >/dev/null 2>&1 || true
            echo "::error::macOS still refuses to import the signing certificate after normalizing it. Re-run desktop/scripts/set-desktop-signing-secrets.sh on the Mac holding the key, and paste its output."
            exit 1
          fi
          security delete-keychain "$PROBE" >/dev/null 2>&1 || true

          B64="$(base64 -i "$RUNNER_TEMP/desktop-cert-macos.p12" | tr -d '\n')"
          rm -f "$RUNNER_TEMP/desktop-cert-macos.p12"
          echo "::add-mask::$B64"
          echo "APPLE_CERT_P12_B64=$B64" >> "$GITHUB_ENV"
          echo "Imported into a throwaway keychain — signing can proceed."

      - name: Build & publish (signed macOS)
        if: vars.ENABLE_MACOS_SIGNING == 'true'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The preflight re-encrypts the .p12 with the SHA-1 MAC macOS requires
          # and proves it imports; APPLE_CERT_P12_B64 is that normalized file.
          # Falls back to the raw secret on Linux, where the preflight is skipped
          # and every Apple variable here is inert anyway.
          APPLE_CERTIFICATE: ${{ env.APPLE_CERT_P12_B64 || secrets.APPLE_DESKTOP_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DESKTOP_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || secrets.APPLE_DEVELOPMENT_TEAM }}
        with:
          projectPath: desktop-lab
          tagName: ${{ (github.event_name == 'push' || inputs.publish) && 'app-v__VERSION__' || '' }}
          releaseName: "SecuraCV Lab v__VERSION__"
          releaseBody: |
            The **SecuraCV Lab**, as a native app — local-first; it talks only to your own devices, and the one thing it fetches on its own is its signed update manifest.

            - **macOS**: download the `.dmg` (universal — Apple Silicon & Intel).
            - **Linux**: `.AppImage` (runs anywhere) or `.deb` (Debian/Ubuntu).
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }}

      # Always attach the built installers to the workflow run itself, so a
      # build-only smoke test (or a failed publish) still yields testable
      # artifacts without touching the Releases page.
      - name: Upload installers as workflow artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: securacv-lab-${{ matrix.platform }}
          path: |
            desktop-lab/src-tauri/target/**/release/bundle/dmg/*.dmg
            desktop-lab/src-tauri/target/**/release/bundle/macos/*.app
            desktop-lab/src-tauri/target/**/release/bundle/appimage/*.AppImage
            desktop-lab/src-tauri/target/**/release/bundle/deb/*.deb
          if-no-files-found: ignore
          retention-days: 14

  # ── one authoritative writer for the DRAFT's updater manifest ───────────────
  # Same single-writer shape as the Flasher's finalize job: the matrix jobs
  # each write latest.json with asset-id URLs that die on any re-upload, so
  # this runs ONCE after both builds and rewrites it durable — stable
  # name-based URLs, signatures read from the .sig assets the draft actually
  # carries, and this version's own RELEASE_NOTES.md section as the `notes`
  # the in-app dialog shows. What it deliberately does NOT do: the
  # resolve-every-URL guard and the lab-latest pointer advance. A draft's
  # assets have no public URLs yet, so both wait for the human publish —
  # desktop-lab-updater-pointer.yml picks up the `release: published` event.
  finalize:
    name: Finalize draft updater manifest (stable URLs + notes)
    needs: build
    if: github.ref_type == 'tag' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Resolve tag + version
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            ver=$(python3 -c "import json;print(json.load(open('desktop-lab/src-tauri/tauri.conf.json'))['version'])")
            tag="app-v${ver}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#app-v}" >> "$GITHUB_OUTPUT"

      - name: Rewrite latest.json with stable URLs, fresh signatures, and notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.plan.outputs.tag }}
          VER: ${{ steps.plan.outputs.version }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          # gh resolves DRAFT releases by tag name (with repo write auth).
          gh release view "$TAG" >/dev/null
          work="$(mktemp -d)"
          gh release download "$TAG" -p latest.json -D "$work" --clobber
          for f in \
            "SecuraCV.Lab_${VER}_amd64.AppImage.sig" \
            "SecuraCV.Lab_${VER}_amd64.deb.sig" \
            "SecuraCV.Lab_${VER}_universal.app.tar.gz.sig"; do
            gh release download "$TAG" -p "$f" -D "$work" --clobber
          done
          python3 desktop/scripts/release_notes.py extract lab "$VER" > "$work/notes.md"
          python3 desktop/scripts/harden_updater_manifest.py \
            --product SecuraCV.Lab --notes-file "$work/notes.md" \
            "$work/latest.json" "$OWNER" "$REPO" "$TAG" "$VER" "$work"
          ok=0
          for i in 1 2 3 4 5; do
            if gh release upload "$TAG" "$work/latest.json" --clobber; then ok=1; break; fi
            echo "latest.json upload failed (attempt $i) — retrying in $((i*6))s"; sleep $((i*6))
          done
          [ "$ok" -eq 1 ] || { echo "::error::could not upload latest.json after retries"; exit 1; }

      - name: Draft body says what this version changes
        # The human publishing this draft should read the user-facing notes
        # first, and everyone downloading it after. Deterministic, so a re-run
        # converges instead of appending.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.plan.outputs.tag }}
          VER: ${{ steps.plan.outputs.version }}
          # Same condition the macOS job signs on. A signed build must NOT carry
          # quarantine-stripping instructions: telling someone to run
          # `xattr -dr com.apple.quarantine` on an app that opens fine teaches
          # them to disarm Gatekeeper by reflex, which is worse than the
          # inconvenience it was meant to solve.
          SIGNED: ${{ vars.ENABLE_MACOS_SIGNING }}
        run: |
          set -euo pipefail
          body="$(mktemp)"
          {
            echo "## What's changing in ${VER}"
            echo
            python3 desktop/scripts/release_notes.py extract lab "$VER"
            echo
            echo "---"
            echo
            echo "The **SecuraCV Lab**, as a native app — local-first; it talks only to your own devices, and the one thing it fetches on its own is its signed update manifest."
            echo
            echo "- **macOS**: download the \`.dmg\` (universal — Apple Silicon & Intel)."
            echo "- **Linux**: \`.AppImage\` (runs anywhere) or \`.deb\` (Debian/Ubuntu)."
            echo
            if [ "${SIGNED:-}" = "true" ]; then
              echo "**Signed and notarized by Apple** — drag it to Applications and open it."
              echo "No Terminal, no quarantine warning."
              echo
            else
              echo "### macOS: first launch (one time)"
              echo
              echo "This build is unsigned, so macOS quarantines it. Drag the app to"
              echo "Applications, then in **Terminal** run:"
              echo
              echo '```sh'
              echo 'xattr -dr com.apple.quarantine "/Applications/SecuraCV Lab.app"'
              echo '```'
              echo
              echo "Full steps: [\`desktop-lab/INSTALL.md\`](https://github.com/kmay89/securaCV/blob/main/desktop-lab/INSTALL.md)."
              echo
            fi
            echo "Installed Labs pick this version up on their own once it's published —"
            echo "the app checks at launch and every few hours, shows these notes, and"
            echo "installs only after you say yes."
          } > "$body"
          gh release edit "$TAG" --draft --notes-file "$body"
