# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "CodeQL Advanced"

# Docs-only changes skip the (expensive, 5-language) analysis; the weekly
# scheduled run still scans everything regardless of paths.
on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'brands/**'
      - 'LICENSE'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'brands/**'
      - 'LICENSE'
  schedule:
    - cron: '24 4 * * 1'

concurrency:
  # PRs collapse per branch; each main commit gets its own group, so a burst
  # of merges can never evict the main run queued behind another (CI.md R3).
  group: codeql-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which of the five languages does this PR actually touch? A scripts-only or
  # docs-plus-YAML PR used to pay for all five legs — the Rust leg alone is
  # ~17 minutes, on a PR whose every other check finished in six — because
  # the trigger's paths-ignore can only say "not docs", not "which language".
  # On a push to main and on the weekly schedule every leg still runs, so the
  # branch's full set of analyses stays current and a PR's skipped leg costs
  # at most an informational "configurations present on main were not found"
  # note on its check. If the compare cannot be read, or the PR changed more
  # files than the API lists, every leg runs: the gate fails open, never
  # closed.
  changes:
    name: Languages the diff touches
    runs-on: ubuntu-24.04  # pinned ahead of the 26.04 image move; revisit before 24.04 retires
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      languages: ${{ steps.pick.outputs.languages }}
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - name: Pick the languages
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Emits two outputs: `languages`, a JSON list, and `matrix`, the
          # strategy the analyze job expands (one leg per language, build-mode
          # none), so a language the diff does not touch has no job at all.
          emit() {
            langs=$(printf '%s\n' "$1" | tr ' ' '\n' | grep . | sort -u)
            {
              echo "languages=$(printf '%s\n' "$langs" | grep . | jq -R . | jq -sc .)"
              echo "matrix=$(printf '%s\n' "$langs" | grep . | jq -R '{language: ., "build-mode": "none"}' | jq -sc '{include: .}')"
            } >> "$GITHUB_OUTPUT"
            echo "legs: $langs"
          }
          all="actions c-cpp javascript-typescript python rust"
          if [ "$EVENT" != "pull_request" ]; then
            emit "$all"; echo "(not a PR: every leg)"; exit 0
          fi
          # The compare API lists at most 3000 changed files; past that, or on
          # any error, run everything rather than guess.
          if ! files=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/compare/${BASE}...${HEAD}" --jq '.files[].filename'); then
            emit "$all"; echo "(compare failed: every leg)"; exit 0
          fi
          if [ "$(printf '%s\n' "$files" | grep -c .)" -ge 3000 ]; then
            emit "$all"; echo "(too many files to be sure: every leg)"; exit 0
          fi
          langs=""
          while IFS= read -r f; do
            case "$f" in
              .github/workflows/codeql.yml) langs="actions c-cpp javascript-typescript python rust" ;;
              .github/workflows/*|.github/actions/*) langs="$langs actions" ;;
              *.rs|Cargo.toml|Cargo.lock|*/Cargo.toml|*/Cargo.lock) langs="$langs rust" ;;
              *.c|*.cc|*.cpp|*.cxx|*.h|*.hpp|*.hh|*.ino) langs="$langs c-cpp" ;;
              *.js|*.mjs|*.cjs|*.ts|*.tsx|*.html) langs="$langs javascript-typescript" ;;
              *.py) langs="$langs python" ;;
            esac
          done <<< "$files"
          emit "$langs"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: changes
    # A job-level if cannot see the matrix, so the matrix itself is the gate:
    # the changes job hands over only the touched languages, and an empty
    # list skips the job outright.
    if: needs.changes.outputs.languages != '[]'
    # Runner size impacts CodeQL analysis time. To learn more, please see:
    #   - https://gh.io/recommended-hardware-resources-for-running-codeql
    #   - https://gh.io/supported-runners-and-hardware-resources
    #   - https://gh.io/using-larger-runners (GitHub.com only)
    # Consider using larger runners or machines with greater resources for possible analysis time improvements.
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-24.04' }}  # pinned ahead of the 26.04 image move; revisit before 24.04 retires
    timeout-minutes: 90
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      # The five legs — actions, c-cpp, javascript-typescript, python, rust,
      # each build-mode none — are listed in the changes job above and arrive
      # here as {include: [{language, build-mode}, …]}.
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
        # CodeQL supports the following values keywords for 'language': 'actions', 'c-cpp', 'csharp', 'go', 'java-kotlin', 'javascript-typescript', 'python', 'ruby', 'rust', 'swift'
        # Use `c-cpp` to analyze code written in C, C++ or both
        # Use 'java-kotlin' to analyze code written in Java, Kotlin or both
        # Use 'javascript-typescript' to analyze code written in JavaScript, TypeScript or both
        # To learn more about changing the languages that are analyzed or customizing the build mode for your analysis,
        # see https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/customizing-your-advanced-setup-for-code-scanning.
        # If you are analyzing a compiled language, you can modify the 'build-mode' for that language to customize how
        # your codebase is analyzed, see https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/codeql-code-scanning-for-compiled-languages
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    # Add any setup steps before running the `github/codeql-action/init` action.
    # This includes steps like installing compilers or runtimes (`actions/setup-node`
    # or others). This is typically only required for manual builds.
    # - name: Setup runtime (example)
    #   uses: actions/setup-example@v1

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4.39.1
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.

        # For more details on CodeQL's query packs, refer to: https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
        # queries: security-extended,security-and-quality

    # If the analyze step fails for one of the languages you are analyzing with
    # "We were unable to automatically build your code", modify the matrix above
    # to set the build mode to "manual" for that language. Then modify this step
    # to build your code.
    # ℹ️ Command-line programs to run using the OS shell.
    # 📚 See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsrun
    - name: Run manual build steps
      if: matrix.build-mode == 'manual'
      shell: bash
      run: |
        echo 'If you are using a "manual" build mode for one or more of the' \
          'languages you are analyzing, replace this with the commands to build' \
          'your code, for example:'
        echo '  make bootstrap'
        echo '  make release'
        exit 1

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4.39.1
      with:
        category: "/language:${{matrix.language}}"
