name: CodeQL

# Static analysis across the project's primary languages. Re-introduced
# in PR #447 after PR #384 inadvertently clobbered the jobs block
# (leaving the workflow as just an `on:` stanza, which GitHub treats
# as malformed and reports as a permanent failure on every PR).
#
# Scope decisions:
#   - Python: full analysis of the HA integration under
#     custom_components/securacv/.
#   - C/C++: header-aware analysis of firmware/. We use build-mode:
#     none because the real firmware build needs ESP-IDF / arduino-cli,
#     which doesn't fit a CodeQL runner. The dedicated Firmware Build
#     workflow already proves the code compiles; CodeQL here is for
#     security/quality findings.
#   - JS/TS: covers the dashboard HTML/JS assets that ship in
#     firmware/projects/canary-wap/arduino/canary_wap/ and any tooling
#     under tools/.
#   - Actions: catches workflow-security issues — would have flagged
#     the very breakage this file is fixing.
#
# Rust analysis lives in the dedicated `rust.yml` workflow (clippy +
# tests) — CodeQL Rust support is still preview and needs a full
# cargo build, which would duplicate effort here without much
# additional security value.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'

# Minimal token scope — analysis writes to GitHub's security events
# surface but doesn't push code, comment on PRs, or publish packages.
permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: c-cpp
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-and-quality is broader than the default
          # security-extended pack and surfaces things like the
          # "secret in plain text" / "broken auth check" patterns
          # we explicitly care about in the firmware + HA integration.
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
