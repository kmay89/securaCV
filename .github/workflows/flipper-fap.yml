name: Flipper Zero FAP Build

on:
  push:
    branches: [main]
    paths:
      - 'tools/flipper/**'
      - '.github/workflows/flipper-fap.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/flipper/**'
      - '.github/workflows/flipper-fap.yml'
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: flipper-fap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-fap:
    name: Build FAP (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - firmware: official
            tag: "1.4.3"
            label: Official 1.4.3

    steps:
      - uses: actions/checkout@v4
        with:
          path: app

      - name: Clone Flipper firmware (${{ matrix.tag }})
        uses: actions/checkout@v4
        with:
          repository: flipperdevices/flipperzero-firmware
          ref: ${{ matrix.tag }}
          path: firmware
          fetch-depth: 1

      - name: Initialize submodules
        working-directory: firmware
        run: git submodule update --init --depth 1 2>&1 | tail -20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Link app into firmware
        run: |
          mkdir -p firmware/applications_user
          ln -s "$GITHUB_WORKSPACE/app/tools/flipper/securacv_scanner" firmware/applications_user/securacv_scanner
          ls -la firmware/applications_user/securacv_scanner/

      - name: Build FAP
        id: build
        working-directory: firmware
        continue-on-error: true
        run: |
          ./fbt fap_securacv_scanner COMPACT=1 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          exit ${PIPESTATUS[0]}

      - name: Post build log on failure
        if: steps.build.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try {
              log = fs.readFileSync('build.log', 'utf8');
            } catch(e) {
              log = 'Could not read build.log';
            }
            const last500 = log.split('\n').slice(-500).join('\n');
            const body = `### FAP Build Failed (${{ matrix.label }})\n\n<details><summary>Build log (last 500 lines)</summary>\n\n\`\`\`\n${last500}\n\`\`\`\n\n</details>`;
            const truncated = body.length > 65000 ? body.slice(0, 65000) + '\n```\n(truncated)' : body;
            if (context.payload.pull_request) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: truncated,
              });
            }

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Collect artifact
        if: steps.build.outcome == 'success'
        run: |
          mkdir -p dist
          find firmware/build -name "securacv_scanner.fap" -exec cp {} "dist/securacv_scanner-${{ matrix.firmware }}.fap" \;
          ls -la dist/

      - name: Upload artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: securacv_scanner-${{ matrix.firmware }}
          path: dist/*.fap
          if-no-files-found: error

  release-faps:
    name: Attach FAPs to Release
    needs: build-fap
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: faps
          merge-multiple: true

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: faps/*.fap
