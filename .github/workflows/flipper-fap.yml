name: Flipper Zero FAP Build

on:
  push:
    branches: [main]
    paths:
      - 'tools/flipper/**'
      - '.github/workflows/flipper-fap.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/flipper/**'
      - '.github/workflows/flipper-fap.yml'
  release:
    types: [published]

concurrency:
  group: flipper-fap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-fap:
    name: Build FAP (${{ matrix.firmware }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - firmware: official
            sdk: release
            label: Official
          - firmware: official-dev
            sdk: dev
            label: Official (Dev)
          - firmware: unleashed
            sdk: https://github.com/DarkFlippers/unleashed-firmware
            label: Unleashed
          - firmware: momentum
            sdk: https://github.com/Next-Flip/Momentum-Firmware
            label: Momentum

    defaults:
      run:
        working-directory: tools/flipper/securacv_scanner

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ufbt
        run: pip install ufbt

      - name: Set up SDK (${{ matrix.label }})
        run: |
          if [[ "${{ matrix.sdk }}" == "release" ]]; then
            ufbt update --channel=release
          elif [[ "${{ matrix.sdk }}" == "dev" ]]; then
            ufbt update --channel=dev
          else
            ufbt update --index-url="${{ matrix.sdk }}/releases/latest/download/ufbt-index.json"
          fi

      - name: Build FAP
        run: ufbt

      - name: Get SDK info
        id: sdk_info
        run: |
          SDK_VER=$(ufbt status | grep -oP 'SDK version: \K.*' || echo "unknown")
          echo "sdk_version=$SDK_VER" >> $GITHUB_OUTPUT

      - name: Rename artifact
        run: |
          mkdir -p dist
          cp dist/*.fap "dist/securacv_scanner-${{ matrix.firmware }}.fap" 2>/dev/null || \
          cp build/*.fap "dist/securacv_scanner-${{ matrix.firmware }}.fap" 2>/dev/null || \
          find . -name "*.fap" -exec cp {} "dist/securacv_scanner-${{ matrix.firmware }}.fap" \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: securacv_scanner-${{ matrix.firmware }}
          path: tools/flipper/securacv_scanner/dist/*.fap
          if-no-files-found: error

  release-faps:
    name: Attach FAPs to Release
    needs: build-fap
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: faps
          merge-multiple: true

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: faps/*.fap
