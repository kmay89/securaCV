name: Flipper Zero FAP Build

on:
  push:
    branches: [main]
    paths:
      - 'tools/flipper/**'
      - '.github/workflows/flipper-fap.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/flipper/**'
      - '.github/workflows/flipper-fap.yml'
  release:
    types: [published]

concurrency:
  group: flipper-fap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-fap:
    name: Build FAP (${{ matrix.firmware }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - firmware: official
            channel: release
            label: Official
          - firmware: official-dev
            channel: dev
            label: Official (Dev)

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ufbt
        run: pip install ufbt

      - name: Set up SDK (${{ matrix.label }})
        run: ufbt update --channel=${{ matrix.channel }}

      - name: Build FAP
        working-directory: tools/flipper/securacv_scanner
        id: build
        continue-on-error: true
        run: ufbt 2>&1 | tee build.log

      - name: Show build output
        if: steps.build.outcome == 'failure'
        working-directory: tools/flipper/securacv_scanner
        run: |
          echo "::warning::FAP build failed — this app uses internal BLE observer APIs that may not be available in the public FAP SDK"
          tail -50 build.log

      - name: Collect artifact
        if: steps.build.outcome == 'success'
        run: |
          mkdir -p tools/flipper/dist
          find tools/flipper/securacv_scanner -name "*.fap" -exec cp {} "tools/flipper/dist/securacv_scanner-${{ matrix.firmware }}.fap" \;

      - name: Upload artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: securacv_scanner-${{ matrix.firmware }}
          path: tools/flipper/dist/*.fap
          if-no-files-found: error

  release-faps:
    name: Attach FAPs to Release
    needs: build-fap
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: faps
          merge-multiple: true

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: faps/*.fap
