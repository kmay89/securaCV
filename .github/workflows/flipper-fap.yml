name: Flipper Zero FAP Build

on:
  push:
    branches: [main]
    paths:
      - 'tools/flipper/**'
      - '.github/workflows/flipper-fap.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/flipper/**'
      - '.github/workflows/flipper-fap.yml'
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: flipper-fap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-fap:
    name: Build FAP (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - firmware: official
            tag: "1.4.3"
            label: Official 1.4.3
          - firmware: official-dev
            tag: "dev"
            label: Official (Dev)

    steps:
      - uses: actions/checkout@v4
        with:
          path: app

      - name: Clone Flipper firmware (${{ matrix.tag }})
        uses: actions/checkout@v4
        with:
          repository: flipperdevices/flipperzero-firmware
          ref: ${{ matrix.tag }}
          path: firmware
          fetch-depth: 1

      - name: Initialize submodules
        working-directory: firmware
        run: git submodule update --init --depth 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Link app into firmware
        run: |
          mkdir -p firmware/applications_user
          ln -s "$GITHUB_WORKSPACE/app/tools/flipper/securacv_scanner" firmware/applications_user/securacv_scanner
          echo "=== App directory ==="
          ls -la firmware/applications_user/securacv_scanner/
          echo "=== application.fam ==="
          cat firmware/applications_user/securacv_scanner/application.fam

      - name: Build FAP
        working-directory: firmware
        run: |
          echo "=== Starting build ==="
          ./fbt fap_securacv_scanner COMPACT=1 2>&1
          echo "=== Build complete ==="

      - name: Collect artifact
        run: |
          mkdir -p dist
          find firmware/build -name "securacv_scanner.fap" -exec cp {} "dist/securacv_scanner-${{ matrix.firmware }}.fap" \;
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: securacv_scanner-${{ matrix.firmware }}
          path: dist/*.fap
          if-no-files-found: error

  release-faps:
    name: Attach FAPs to Release
    needs: build-fap
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: faps
          merge-multiple: true

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: faps/*.fap
