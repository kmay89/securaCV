# The Hub's freshness loop — the "self-updating, self-healing" half of
# canary-local/homeassistant.html's anti-rot design.
#
# Weekly (and on demand), this refreshes the page's upstream snapshot —
# the current Home Assistant OS + Core versions from
# version.home-assistant.io — via gen_homeassistant.py --refresh-upstream,
# and opens a PR when anything moved. Everything else on the page already
# regenerates from in-repo sources and is drift-gated by canary-local.yml;
# upstream versions are the one fact that ages on its own, so it gets its
# own clock.
#
# Self-healing posture, end to end:
#   · the generator survives a dead/misshapen feed by keeping the previous
#     snapshot verbatim (values only move forward on a verified read), so
#     a flaky week degrades to "no diff, no PR" — never a broken page
#   · the page itself computes and displays the snapshot's age, and turns
#     the line amber past 120 days with a pointer at THIS workflow — if
#     the loop breaks, the page tells on it
#   · changes land as a PR, so the canary-local.yml gates (tests + drift)
#     re-verify the refreshed data before it can ship

name: homeassistant freshness

on:
  schedule:
    - cron: "30 5 * * 1" # Mondays 05:30 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh upstream snapshot
        run: python3 canary-local/tools/gen_homeassistant.py --refresh-upstream
      - name: Verify against the honesty gate before proposing anything
        run: node --test canary-local/tests/homeassistant.test.js
      - name: Open a PR if upstream moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- canary-local/devices/homeassistant.json; then
            echo "upstream unchanged — nothing to do"
            exit 0
          fi
          BRANCH="bot/homeassistant-freshness"
          HAOS=$(python3 -c "import json;print(json.load(open('canary-local/devices/homeassistant.json'))['upstream']['haos_version'])")
          HA=$(python3 -c "import json;print(json.load(open('canary-local/devices/homeassistant.json'))['upstream']['ha_version'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add canary-local/devices/homeassistant.json
          git commit -m "chore(canary-local): Hub upstream snapshot → HA OS ${HAOS} / Core ${HA}"
          git push -f origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "The Hub: upstream snapshot → HA OS ${HAOS} / Core ${HA}" \
              --body "Weekly freshness run: version.home-assistant.io moved, so the Hub page's terminal scripts and version strip re-line themselves from this snapshot. Generated by \`gen_homeassistant.py --refresh-upstream\`; validated by \`tests/homeassistant.test.js\` before this PR was opened."
          fi
