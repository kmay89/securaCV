# The Hub's freshness loop — the "self-updating, self-healing" half of
# canary-local/homeassistant.html's anti-rot design.
#
# Weekly (and on demand), this refreshes the page's upstream snapshot —
# the current Home Assistant OS + Core versions from
# version.home-assistant.io — via gen_homeassistant.py --refresh-upstream,
# re-runs the hub-image pin ceremony (pin_hub_image.py) for whatever HAOS
# version the snapshot now names, and opens a PR when anything moved.
# Everything else on the page already regenerates from in-repo sources and
# is drift-gated by canary-local.yml; upstream versions and the pins that
# vouch for their images are the facts that age on their own, so they
# share one clock. A separate pin-alarm job re-verifies the committed pins
# and fails loudly on link rot or a moved hash.
#
# Self-healing posture, end to end:
#   · the generator survives a dead/misshapen feed by keeping the previous
#     snapshot verbatim (values only move forward on a verified read), so
#     a flaky week degrades to "no diff, no PR" — never a broken page
#   · the page itself computes and displays the snapshot's age, and turns
#     the line amber past 120 days with a pointer at THIS workflow — if
#     the loop breaks, the page tells on it
#   · changes land as a PR, so the canary-local.yml gates (tests + drift)
#     re-verify the refreshed data before it can ship

name: homeassistant freshness

on:
  schedule:
    - cron: "30 5 * * 1" # Mondays 05:30 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # issues: the fallback when the repo forbids Actions from opening PRs
  # (see the PR step) — that setting does not gate issue creation.
  issues: write

# Two refresh runs racing would fight over the bot/homeassistant-freshness
# branch push — queue them, never cancel mid-PR-ceremony.
concurrency:
  group: homeassistant-freshness
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # FRESHNESS_PAT (optional repo secret: fine-grained PAT, contents +
      # pull-requests write): pushes/PRs made with the default GITHUB_TOKEN
      # do not trigger other workflows (GitHub's recursion guard), so
      # without it the freshness PR won't get canary-local.yml's checks.
      # The honesty gate below runs HERE either way — the PR is validated
      # before it exists — but set the secret if branch protection requires
      # the checks to report on the PR itself.
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.FRESHNESS_PAT || github.token }}
      - name: Refresh upstream snapshot
        env:
          # for the generator's GitHub-releases fallback (the primary
          # version feed's CDN 403s anonymous/default user agents)
          GH_TOKEN: ${{ github.token }}
        run: python3 canary-local/tools/gen_homeassistant.py --refresh-upstream
      # The hub-image pin ceremony rides the same clock: re-pin (or, on a
      # HAOS bump the ceremony can't double-source yet, honestly un-pin) the
      # base-OS image hashes right after the snapshot moves. Same
      # self-healing posture as the refresh — a flaky week degrades to "no
      # diff", never to a wrong pin; a hash that MOVES under a pinned
      # version fails this run loudly instead (see pin_hub_image.py).
      - name: Re-run the hub image pin ceremony
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 canary-local/tools/pin_hub_image.py
      - name: Verify against the honesty gate before proposing anything
        run: node --test canary-local/tests/homeassistant.test.js
      - name: Open a PR if upstream moved
        env:
          GH_TOKEN: ${{ secrets.FRESHNESS_PAT || github.token }}
        run: |
          # status --porcelain, not diff --quiet: the first ceremony CREATES
          # hub_image_pins.json, and an untracked file is invisible to diff.
          FRESHNESS_PATHS=(canary-local/devices/homeassistant.json canary-local/devices/hub_image.json canary-local/devices/hub_image_pins.json)
          if [ -z "$(git status --porcelain -- "${FRESHNESS_PATHS[@]}")" ]; then
            echo "upstream unchanged — nothing to do"
            exit 0
          fi
          BRANCH="bot/homeassistant-freshness"
          HAOS=$(python3 -c "import json;print(json.load(open('canary-local/devices/homeassistant.json'))['upstream']['haos_version'])")
          HA=$(python3 -c "import json;print(json.load(open('canary-local/devices/homeassistant.json'))['upstream']['ha_version'])")
          PIN=$(python3 -c "import json;print('pinned' if json.load(open('canary-local/devices/hub_image.json'))['base_os']['pinned'] else 'unpinned')")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          # Stage only what exists: on an unpinned refresh (a HAOS bump the
          # ceremony couldn't double-source yet) hub_image_pins.json may not
          # exist, and git add on a missing pathspec is a hard error that
          # would break exactly the self-healing path.
          for p in "${FRESHNESS_PATHS[@]}"; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          git commit -m "chore(canary-local): Hub upstream snapshot → HA OS ${HAOS} / Core ${HA} (hub image ${PIN})"
          git push -f origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "The Hub: upstream snapshot → HA OS ${HAOS} / Core ${HA} (hub image ${PIN})" \
              --body "Weekly freshness run: version.home-assistant.io moved, so the Hub page's terminal scripts and version strip re-line themselves from this snapshot, and the hub-image pin ceremony re-ran for the new base OS (currently **${PIN}**). Generated by \`gen_homeassistant.py --refresh-upstream\` + \`pin_hub_image.py\`; validated by \`tests/homeassistant.test.js\` before this PR was opened." \
            || {
              # The default GITHUB_TOKEN can PUSH the branch but this repo's
              # Actions settings refuse to let it open a pull request
              # ("GitHub Actions is not permitted to create or approve pull
              # requests"). Before this fallback, every scheduled run that
              # had something to propose failed right here — the refreshed
              # branch was pushed, the run went red, and the only record was
              # a log nobody reads. Issues are NOT gated by that setting, so
              # the snapshot is delivered as one deduplicated issue carrying
              # the compare link (the same pattern bom-pricing.yml uses for
              # supply-chain exceptions), and the run exits green with a
              # warning annotation. Set FRESHNESS_PAT or flip the setting to
              # get PRs again; this branch keeps working either way.
              TITLE_PREFIX="The Hub: upstream snapshot"
              TITLE="${TITLE_PREFIX} → HA OS ${HAOS} / Core ${HA} (needs a PR)"
              OPEN=$(gh issue list --state open --search "\"${TITLE_PREFIX}\" in:title" --json number --jq '.[].number' | head -1)
              if [ -n "$OPEN" ]; then
                gh issue comment "$OPEN" --body "Refreshed again on $(date -u +%Y-%m-%d): branch \`${BRANCH}\` was force-pushed with the latest snapshot — [open the PR](https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1)."
                echo "::warning::PR creation refused; updated open issue #$OPEN with the compare link instead."
              else
                gh issue create --title "$TITLE" --body "Weekly freshness run: version.home-assistant.io moved to **HA OS ${HAOS} / Core ${HA}** (hub image **${PIN}**). The refreshed snapshot is pushed on branch [\`${BRANCH}\`](https://github.com/${GITHUB_REPOSITORY}/tree/${BRANCH}) and already passed \`tests/homeassistant.test.js\`, but this repo does not let Actions open pull requests, so a human has to: [open the PR](https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1). To make this automatic, enable *Allow GitHub Actions to create and approve pull requests* (Settings → Actions → General) or add a \`FRESHNESS_PAT\` secret. Raised by \`homeassistant-freshness.yml\`; this issue is reused while it stays open."
                echo "::warning::PR creation refused; opened an issue with the compare link instead. Enable 'Allow GitHub Actions to create and approve pull requests' or add FRESHNESS_PAT to get PRs."
              fi
            }
          fi

  # The alarm half of the pin ceremony, independent of the refresh so a
  # transient snapshot problem can't mask it (and vice versa). Re-fetches
  # both checksum channels for the COMMITTED pins and fails the workflow
  # on link rot (the image or its .sha256 went away) or a hash that moved
  # under a pinned version (upstream re-release or tampering). Either way
  # the failure is the feature: the pipeline tells on itself weekly
  # instead of a user's flash discovering the rot months later.
  pin-alarm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Re-verify the committed hub image pins on both channels
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 canary-local/tools/pin_hub_image.py --verify
