name: Firmware Build

on:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'
  pull_request:
    branches: [main]
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Flavor manifest
  #
  # firmware/flavors.json is the single source of truth for every
  # PlatformIO-built firmware flavor. Adding a future flavor means
  # adding one manifest entry (plus its envs/ ini + configs/ dir per
  # firmware/ARCHITECTURE.md) — no new CI jobs. Each entry drives one
  # matrix leg of `build-platformio` and one of `pio-check` below.
  #
  # Manifest fields:
  #   name               — display name + cache-key component
  #   dir                — project dir holding platformio.ini
  #   build_envs         — envs compiled by the build job, in order
  #   check_env          — env analyzed by the pio-check job
  #   pip_extras         — extra pip packages (e.g. canary needs
  #                        intelhex: esptool 4.11.0 bundled by the
  #                        official espressif32 7.x platform imports it
  #                        without declaring it, so bootloader.bin
  #                        generation dies on a clean runner without it)
  #   isolated_core_envs — envs that get their own PLATFORMIO_CORE_DIR.
  #                        Needed when one project mixes the official
  #                        espressif32 platform with the pioarduino fork:
  #                        both ship a package literally named
  #                        `framework-arduinoespressif32` at incompatible
  #                        versions (2.0.17 vs 3.3.8). Sharing
  #                        ~/.platformio, pioarduino sees 2.0.17 already
  #                        "installed", skips its own 3.3.8, and its build
  #                        script fails with FRAMEWORK_DIR=None before any
  #                        compile. (canary's `full` env hits this; a
  #                        project that is pioarduino-only, like
  #                        canary-wap, runs alone in its leg and needs no
  #                        isolation.)
  #   pre_step           — named setup hook; "secrets_header" writes a
  #                        CI-only secrets/secrets.h (build verification,
  #                        not deployment)
  #   size_guard         — fail if `bin` exceeds `slot_bytes` (an image
  #                        bigger than its OTA A/B slot can never be
  #                        installed over the air)
  # ──────────────────────────────────────────────────────────────────
  flavors:
    name: Load flavor manifest
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.load.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: load
        run: echo "matrix=$(jq -c . firmware/flavors.json)" >> "$GITHUB_OUTPUT"

  build-platformio:
    name: PlatformIO Build (${{ matrix.flavor.name }})
    needs: flavors
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJSON(needs.flavors.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ matrix.flavor.dir }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
          key: ${{ runner.os }}-pio-${{ matrix.flavor.name }}-${{ hashFiles(format('{0}/platformio.ini', matrix.flavor.dir), 'firmware/envs/platformio/*.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-${{ matrix.flavor.name }}-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio ${{ matrix.flavor.pip_extras }}

      - name: Generate CI secrets header (build-only, not from committed file)
        if: matrix.flavor.pre_step == 'secrets_header'
        run: |
          mkdir -p secrets
          cat > secrets/secrets.h << 'HEADER'
          #pragma once
          // Auto-generated for CI build verification only. Not for deployment.
          #define WIFI_SSID "ci"
          #define WIFI_PASS "ci"
          #define MQTT_HOST "127.0.0.1"
          #define MQTT_PORT 1883
          #define MQTT_USER "ci"
          #define MQTT_PASS "ci"
          HEADER

      - name: Build all environments (+ OTA-slot size guard)
        # The size guard runs IMMEDIATELY after the env that produces the
        # guarded binary, inside the loop — not as a separate step. A later
        # env build can recreate .pio/build and drop sibling envs' artifacts
        # (observed when canary's `full` env, on the pioarduino platform with
        # an isolated core dir, followed `release`: release/firmware.bin was
        # gone by the end of the job).
        env:
          PLATFORMIO_BUILD_FLAGS: -DVALIDATION_BUILD=1
          FLAVOR_JSON: ${{ toJSON(matrix.flavor) }}
        run: |
          set -euo pipefail
          SG_BIN=$(jq -r '.size_guard.bin // empty' <<< "$FLAVOR_JSON")
          size_guard() {
            local SLOT SLOT_NAME SIZE
            SLOT=$(jq -r '.size_guard.slot_bytes' <<< "$FLAVOR_JSON")
            SLOT_NAME=$(jq -r '.size_guard.slot_name // "OTA slot"' <<< "$FLAVOR_JSON")
            SIZE=$(stat -c%s "$SG_BIN" 2>/dev/null || echo 0)
            if [ "$SIZE" -eq 0 ]; then
              echo "::error::$SG_BIN not found — size guard cannot run."
              exit 1
            fi
            if [ "$SIZE" -gt "$SLOT" ]; then
              echo "::error::Firmware binary ($SIZE bytes) exceeds the $SLOT_NAME ($SLOT bytes). It could never be installed over the air — trim features or grow the slots."
              exit 1
            fi
            echo "Firmware size: $SIZE / $SLOT bytes ($((SIZE * 100 / SLOT))% of $SLOT_NAME)"
          }
          for e in $(jq -r '.build_envs[]' <<< "$FLAVOR_JSON"); do
            if jq -e --arg e "$e" '(.isolated_core_envs // []) | index($e)' <<< "$FLAVOR_JSON" > /dev/null; then
              echo "── pio run -e $e (isolated PLATFORMIO_CORE_DIR) ──"
              PLATFORMIO_CORE_DIR="$GITHUB_WORKSPACE/.pio-core-$e" pio run -e "$e"
            else
              echo "── pio run -e $e ──"
              pio run -e "$e"
            fi
            case "$SG_BIN" in
              .pio/build/$e/*) size_guard ;;
            esac
          done

  pio-check:
    name: Static Analysis (${{ matrix.flavor.name }})
    needs: flavors
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJSON(needs.flavors.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ matrix.flavor.dir }}
    # cppcheck has been configured via check_tool/check_flags in the
    # PlatformIO inis (firmware/envs/platformio/common.ini) since the
    # envs were created, but nothing ever ran it. This job closes that
    # gap per flavor. `pio check` exits 0 on findings unless
    # --fail-on-defect is given; medium catches cppcheck warning-severity
    # defects (real bug classes: format-string mismatches, uninitialized
    # members, side effects in assert) without drowning in style nits.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
          key: ${{ runner.os }}-pio-${{ matrix.flavor.name }}-${{ hashFiles(format('{0}/platformio.ini', matrix.flavor.dir), 'firmware/envs/platformio/*.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-${{ matrix.flavor.name }}-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio ${{ matrix.flavor.pip_extras }}

      - name: Generate CI secrets header (build-only, not from committed file)
        if: matrix.flavor.pre_step == 'secrets_header'
        run: |
          mkdir -p secrets
          cat > secrets/secrets.h << 'HEADER'
          #pragma once
          // Auto-generated for CI build verification only. Not for deployment.
          #define WIFI_SSID "ci"
          #define WIFI_PASS "ci"
          #define MQTT_HOST "127.0.0.1"
          #define MQTT_PORT 1883
          #define MQTT_USER "ci"
          #define MQTT_PASS "ci"
          HEADER

      - name: Run pio check
        run: |
          pio check -e ${{ matrix.flavor.check_env }} --fail-on-defect=medium --fail-on-defect=high --skip-packages

  build-arduino-cli:
    name: Arduino CLI Build (Canary WAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Configure Arduino CLI
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install libraries
        run: |
          arduino-cli lib install "Crypto"
          arduino-cli lib install "ArduinoJson"
          # NimBLE-Arduino (2.x) is REQUIRED for the FULL profile's BLE stack.
          # Without it the sketch's ble_config.h guard now errors instead of
          # silently shipping "BLE unavailable in this build" — installing it
          # here means BLE is actually compile-tested in CI.
          arduino-cli lib install "NimBLE-Arduino"

      - name: Compile firmware
        run: |
          # --libraries makes arduino-cli treat each subdir of firmware/common/
          # as a library root, so #include <csi_types.h> resolves to
          # firmware/common/csi/csi_types.h via library.properties.
          # NimBLE is installed above, so the FULL profile compiles the real
          # BLE stack (FEATURE_BLE=1) rather than the no-radio stub.
          arduino-cli compile \
            --fqbn esp32:esp32:XIAO_ESP32S3 \
            --libraries firmware/common \
            --build-property "build.extra_flags=-DVALIDATION_BUILD=1" \
            --output-dir /tmp/wap-build \
            firmware/projects/canary-wap/arduino/canary_wap/canary_wap.ino

      - name: Check binary size against the OTA slot
        run: |
          # The XIAO_ESP32S3 board default (default_8MB.csv) gives app0/app1
          # 0x330000 (3,342,336 bytes) each. An image larger than that can
          # never be installed over the air (pull OTA or BLE OTA).
          SLOT=3342336
          SIZE=$(stat -c%s /tmp/wap-build/canary_wap.ino.bin 2>/dev/null || echo 0)
          if [ "$SIZE" -eq 0 ]; then
            echo "::error::canary_wap.ino.bin not found in /tmp/wap-build"
            ls -la /tmp/wap-build || true
            exit 1
          fi
          if [ "$SIZE" -gt "$SLOT" ]; then
            echo "::error::canary-wap binary ($SIZE bytes) exceeds the 0x330000 OTA slot ($SLOT bytes). It could never be installed over the air."
            exit 1
          fi
          echo "canary-wap size: $SIZE / $SLOT bytes ($((SIZE * 100 / SLOT))% of OTA slot)"

      - name: Compile firmware (Beacon channel gate)
        run: |
          # FEATURE_BEACON_CHANNEL is OFF by default, which previously meant
          # beacon_channel.cpp (and every #if FEATURE_BEACON_CHANNEL block in
          # the sketch) was never compile-verified in CI. This second pass
          # forces the flag ON so the Beacon scaffold — including its
          # append-only SD audit-log path (AGENTS.md Beacon invariant 9) —
          # can't silently rot.
          arduino-cli compile \
            --fqbn esp32:esp32:XIAO_ESP32S3 \
            --libraries firmware/common \
            --build-property "build.extra_flags=-DVALIDATION_BUILD=1 -DFEATURE_BEACON_CHANNEL=1" \
            firmware/projects/canary-wap/arduino/canary_wap/canary_wap.ino

  csi-sketch-sync:
    name: CSI Sketch Copy Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify CSI library copies in canary-wap sketch dir match canonical source
        # The Arduino IDE only sees files inside the sketch folder and globally
        # installed libraries — so the CSI library is committed twice: once at
        # firmware/common/csi/src/ (canonical) and once next to the sketch so
        # GitHub zip downloads compile out of the box. This guard catches
        # drift in either direction.
        run: |
          chmod +x firmware/scripts/check_csi_sync.sh
          firmware/scripts/check_csi_sync.sh

      - name: Verify power-logic copy in canary-wap sketch dir matches canonical source
        # Same committed-copy pattern: the battery decision logic lives
        # at firmware/common/power/power_logic.h (canonical, host-tested)
        # and is copied next to the sketch for Arduino IDE builds.
        run: |
          chmod +x firmware/scripts/check_power_sync.sh
          firmware/scripts/check_power_sync.sh

      - name: Verify boot banner copies in canary-wap sketch dir match canonical source
        # Same committed-copy pattern as the CSI library: the boot banner lives
        # at firmware/common/boot/ (canonical) and is copied next to the sketch
        # so GitHub zip downloads compile out of the box without setup.sh. The
        # arduino-cli CI build above passes --libraries firmware/common, which
        # masks a missing sketch-local copy, so this guard catches the drift.
        run: |
          chmod +x firmware/scripts/check_boot_sync.sh
          firmware/scripts/check_boot_sync.sh

      - name: Verify OTA engine copies in canary-wap sketch dir match canonical source
        # The signed pull-OTA engine is canonical at firmware/common/ota/src/
        # and committed next to the sketch. ota_release_key.h is in the sync
        # set on purpose: the release public key must be identical across the
        # canary (PIO) build, the WAP pull-OTA engine, and the WAP's BLE OTA
        # path — one release signature serves every update channel.
        run: |
          chmod +x firmware/scripts/check_ota_sync.sh
          firmware/scripts/check_ota_sync.sh

      - name: Verify acoustic module copy in canary-wap sketch dir matches canonical source
        # securacv_audio is canonical at firmware/canary/lib/securacv_audio/src/
        # and vendored next to the sketch. Unlike the other copies it carries
        # four documented adaptations (log-enum vocabulary, build_config
        # feature gate), so the script normalizes both sides before diffing —
        # any change beyond those adaptations must land in BOTH copies.
        run: |
          chmod +x firmware/scripts/check_audio_sync.sh
          firmware/scripts/check_audio_sync.sh

  regression-check:
    name: Regression Guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run regression checks
        run: |
          chmod +x firmware/scripts/regression_check.sh
          firmware/scripts/regression_check.sh

      - name: Verify LESSONS_LEARNED.md exists
        run: |
          if [ ! -f "firmware/LESSONS_LEARNED.md" ]; then
            echo "::error::firmware/LESSONS_LEARNED.md is missing!"
            exit 1
          fi
          LINES=$(wc -l < firmware/LESSONS_LEARNED.md)
          if [ "$LINES" -lt 10 ]; then
            echo "::error::LESSONS_LEARNED.md seems empty ($LINES lines)"
            exit 1
          fi
          echo "LESSONS_LEARNED.md: $LINES lines ✓"

  archive-guard:
    name: Archive Edit Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject edits under firmware/projects/_archive/
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          # Determine the base ref to diff against.
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            git fetch origin "${GITHUB_BASE_REF}" --depth=1
            BASE="origin/${GITHUB_BASE_REF}"
          else
            # Push event: compare against the previous commit on this ref.
            BASE="${GITHUB_SHA}^"
          fi

          CHANGED=$(git diff --name-only "$BASE"..."${GITHUB_SHA}" -- 'firmware/projects/_archive/' || true)
          if [ -z "$CHANGED" ]; then
            echo "No changes under firmware/projects/_archive/ — guard passes."
            exit 0
          fi

          echo "Detected changes under firmware/projects/_archive/:"
          echo "$CHANGED"

          # Permit only if an explicit opt-in marker is present in the PR
          # title/body or in at least one commit message in the range.
          MARKER='[archive-edit]'
          if echo "${PR_TITLE:-}" | grep -qF "$MARKER" \
             || echo "${PR_BODY:-}" | grep -qF "$MARKER" \
             || git log --format=%B "$BASE"..."${GITHUB_SHA}" | grep -qF "$MARKER"; then
            echo "Found '$MARKER' marker — archive edit allowed."
            exit 0
          fi

          echo "::error::Edits under firmware/projects/_archive/ are frozen."
          echo "::error::Add '[archive-edit]' to the PR title, body, or a commit message if this is an intentional backport."
          exit 1

  csi-invariants:
    name: CSI Privacy Invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build host invariants test
        # The fuzzer compiles standalone against the CSI library's portable
        # core (no ESP32 deps) and asserts the privacy contracts
        # documented in csi_event_invariants_test.cpp:
        #   1. Disallowed fields are zeroed at the chokepoint
        #   2. P1 events are blocked under a P0 ceiling
        #   3. P2 events never reach the witness chain
        #   4. Time fields are coarsened to the 10-min bucket
        #   5. Strings are ASCII-sanitized
        #   6. The bundler collapses 100 same-state emits to <= 2 commits
        #   7. The per-module hourly ceiling caps bursts
        #   8. The witness-chain payload includes kv= / rs= / zn= (spec §2)
        #   9. ble.events (spec §10) — MAC-precision fields stripped
        #  10. Quiet Hours hold non-anomaly events; one summary at close
        #  11. Anomaly events bypass the Quiet Hours gate
        #  12. core.multilink_fusion strips unauthorized fields (PR 3 + PR 6)
        #  13. ble.scout strips unauthorized fields (PR 5 + PR 6)
        #
        # If a future PR (or LLM coder) breaks any of these, this job
        # fails before the firmware build even starts.
        run: |
          set -euo pipefail
          # PR 6: link the real manifests for core.multilink_fusion (in
          # firmware/common/csi) and ble.scout (in the canary lib) so the
          # invariants test pins the actual allow-lists, not a synthetic
          # stand-in. mesh_crypto.cpp is brought in because ble_scan.cpp
          # uses sha256_domain; its CSI_TEST_HOST_BUILD path provides a
          # vendored SHA-256 so no Arduino/mbedtls dep is needed here.
          g++ -std=c++17 -DCSI_TEST_HOST_BUILD \
              -Wall -Wextra -Wno-unused-parameter \
              firmware/common/csi/csi_event_invariants_test.cpp \
              firmware/common/csi/src/csi_event.cpp \
              firmware/common/csi/src/csi_module.cpp \
              firmware/common/csi/src/csi_bundler.cpp \
              firmware/common/csi/src/csi_witness_payload.cpp \
              firmware/common/csi/src/ble_events_module.cpp \
              firmware/common/csi/src/meta_quiet_hours.cpp \
              firmware/common/csi/src/core_multilink_fusion.cpp \
              firmware/canary/lib/securacv_ble_scan/src/ble_scan.cpp \
              firmware/canary/lib/securacv_ble_scan/src/ble_scout.cpp \
              firmware/canary/lib/securacv_ble_scan/src/ble_scout_state.cpp \
              firmware/canary/lib/securacv_ble_scan/src/ble_scout_key.cpp \
              firmware/canary/lib/securacv_mesh/src/mesh_crypto.cpp \
              -I firmware/common/csi/src \
              -I firmware/canary/lib/securacv_ble_scan/src \
              -I firmware/canary/lib/securacv_mesh/src \
              -o /tmp/csi_invariants

      - name: Run host invariants test
        run: /tmp/csi_invariants

      - name: Build host witness round-trip test
        # Closes the plan's verification promise: "Every Event row
        # round-trips through log_verify with a valid signature and an
        # intact hash chain." The host build can't drive the device's
        # private key, but it CAN exercise the chokepoint contract:
        # every committed event reaches csi_event_commit_witness exactly
        # once, IDs are unique across the chain, and each record's
        # prev_hash points at the previous record's hash.
        run: |
          set -euo pipefail
          g++ -std=c++17 -DCSI_TEST_HOST_BUILD \
              -Wall -Wextra -Wno-unused-parameter \
              firmware/common/csi/csi_witness_roundtrip_test.cpp \
              firmware/common/csi/src/csi_event.cpp \
              firmware/common/csi/src/csi_module.cpp \
              firmware/common/csi/src/csi_bundler.cpp \
              -I firmware/common/csi/src \
              -o /tmp/csi_roundtrip

      - name: Run host witness round-trip test
        run: /tmp/csi_roundtrip

  # ──────────────────────────────────────────────────────────────────
  # Mesh + Scout host test suites
  #
  # Each securacv_mesh and securacv_ble_scan TU has a host-build test
  # that compiles standalone (no Arduino / mbedtls / NimBLE dep — every
  # device-only call is gated by CSI_TEST_HOST_BUILD with a vendored
  # fallback). Run them all on every PR so a future contributor can't
  # silently break wire-format encoding, pairing state machine, signed-
  # envelope verification, BLE Scout state-machine timing, or the
  # arrived/departed broadcast hook contract.
  #
  # New tests added to either lib should be appended to this list.
  # ──────────────────────────────────────────────────────────────────
  mesh-scout-host-tests:
    name: Mesh + Scout Host Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build + run all mesh + ble_scan host tests
        # Each test links the minimum source set it needs. ble_scout.cpp
        # pulls in csi_event/module/bundler (its emit_arrived flows
        # through the chokepoint), so suites that don't exercise the
        # Scout integration deliberately exclude it from their link
        # set — keeps each test's link surface honest. Every suite
        # ends with an "ALL ... PASSED" marker; the grep makes a
        # silent-pass failure mode visible.
        run: |
          set -euo pipefail
          mkdir -p /tmp/host_tests

          MESH_SRC=firmware/canary/lib/securacv_mesh/src
          BLE_SRC=firmware/canary/lib/securacv_ble_scan/src
          COMMON_SRC=firmware/common/csi/src
          CXXFLAGS=(-std=c++17 -DCSI_TEST_HOST_BUILD -Wall -Wextra -Wno-unused-parameter)

          run_test() {
            local name=$1; shift
            g++ "${CXXFLAGS[@]}" "$@" -o "/tmp/host_tests/test_$name"
            "/tmp/host_tests/test_$name" | tee "/tmp/host_tests/test_$name.log"
            grep -q "ALL .* PASSED" "/tmp/host_tests/test_$name.log"
          }

          # securacv_mesh suites — 7 of them now (mesh_state added with
          # opera_secret NVS persistence). Each test links against
          # every mesh src TU so internal symbols resolve.
          for t in mesh_crypto mesh_envelope mesh_pairing mesh_session \
                   mesh_transport mesh_beacon mesh_state mesh_channel_hop \
                   mesh_hub_election; do
            run_test $t \
              firmware/canary/lib/securacv_mesh/test_${t}.cpp \
              $MESH_SRC/*.cpp \
              -I $MESH_SRC
          done

          # ble_scan + ble_scout_state — pure-logic, only link
          # ble_scan.cpp / ble_scout_state.cpp from the lib, plus
          # mesh_crypto.cpp for sha256_domain.
          run_test ble_scan \
            firmware/canary/lib/securacv_ble_scan/test_ble_scan.cpp \
            $BLE_SRC/ble_scan.cpp \
            $MESH_SRC/mesh_crypto.cpp \
            -I $BLE_SRC -I $MESH_SRC

          run_test ble_scout_state \
            firmware/canary/lib/securacv_ble_scan/test_ble_scout_state.cpp \
            $BLE_SRC/ble_scout_state.cpp \
            $BLE_SRC/ble_scan.cpp \
            $MESH_SRC/mesh_crypto.cpp \
            -I $BLE_SRC -I $MESH_SRC

          # ble_scout_broadcast exercises the chokepoint path inside
          # emit_arrived/departed, so it pulls in csi_event + module
          # + bundler + witness_payload from common/csi/src.
          run_test ble_scout_broadcast \
            firmware/canary/lib/securacv_ble_scan/test_ble_scout_broadcast.cpp \
            $BLE_SRC/ble_scan.cpp \
            $BLE_SRC/ble_scout.cpp \
            $BLE_SRC/ble_scout_state.cpp \
            $BLE_SRC/ble_scout_key.cpp \
            $MESH_SRC/mesh_crypto.cpp \
            $COMMON_SRC/csi_event.cpp \
            $COMMON_SRC/csi_module.cpp \
            $COMMON_SRC/csi_bundler.cpp \
            $COMMON_SRC/csi_witness_payload.cpp \
            -I $BLE_SRC -I $MESH_SRC -I $COMMON_SRC

          # thermal_wd — standalone: the module compiles against
          # thermal_wd_host_stubs.h under CSI_TEST_HOST_BUILD and the
          # test provides the clock, sensor, NVS map, and log capture.
          # Pins the hysteresis ladder, episode-once advisories,
          # ms-accurate time accounting, and the NVS wear cadence.
          run_test thermal_wd \
            firmware/canary/lib/securacv_thermal_watchdog/test_thermal_wd.cpp \
            firmware/canary/lib/securacv_thermal_watchdog/src/securacv_thermal_watchdog.cpp \
            -I firmware/canary/lib/securacv_thermal_watchdog/src

      - name: Build + run pull-OTA engine logic host test
        # The OTA engine's pure-logic subset (semantic version compare,
        # anti-rollback update decision, URL transport policy, the
        # Ed25519 signed-message layout shared with ble_ota.cpp and
        # ota_release.py, hex parsing, and the plain-language UI string
        # coverage) compiles standalone under -DSECURACV_OTA_HOST_BUILD.
        run: |
          set -euo pipefail
          g++ -std=c++17 -DSECURACV_OTA_HOST_BUILD \
              -Wall -Wextra \
              firmware/common/ota/test_ota_logic.cpp \
              firmware/common/ota/src/securacv_ota.cpp \
              -I firmware/common/ota/src \
              -o /tmp/ota_logic
          /tmp/ota_logic | tee /tmp/ota_logic.log
          grep -q "ALL .* PASSED" /tmp/ota_logic.log

      - name: Build + run battery power-logic host test
        # The battery decision logic (SoC curve, charge-state
        # classification, cycle-fade health, runtime estimate) is pure
        # and shared by both firmware trees via power_logic.h. This
        # suite pins the false-state fixes from PR #762 — above all
        # that charging detection outranks the low/critical SoC bands,
        # so a depleted battery on USB can never deep-sleep a device
        # that is plugged in and charging.
        run: |
          set -euo pipefail
          g++ -std=c++17 -DCSI_TEST_HOST_BUILD \
              -Wall -Wextra \
              firmware/common/power/test_power_logic.cpp \
              -I firmware/common/power \
              -o /tmp/power_logic
          /tmp/power_logic | tee /tmp/power_logic.log
          grep -q "ALL .* PASSED" /tmp/power_logic.log

      - name: Run OTA release tool tests (signing + manifest round-trip)
        # ota_release.py is the single source of truth for the release
        # format (manifest schema v1 + Ed25519 signature over
        # size_LE32||sha256). These tests pin the wire format the
        # firmware-release workflow and both device engines rely on.
        run: |
          python3 -m pip install --quiet pytest cryptography
          python3 -m pytest firmware/scripts/test_ota_release.py -q

      - name: Build + run canary-wap project host tests
        # The canary-wap project keeps its own host-test Makefile (mesh
        # coexistence, chirp/beacon invariants, device signature, and the
        # captive-portal DNS response builder). Its `run` target builds and
        # runs every suite; each test exits non-zero on failure, so make's
        # exit code gates the job. Needs libcrypto for the beacon tamper
        # suite — preinstalled on ubuntu-latest.
        run: make -C firmware/projects/canary-wap/tests_host

      - name: Build + run mmWave MR60 host tests
        # canary-sense radar decoder + presence/vitals FSMs, built twice
        # (presence-only and -DCANARY_SENSE_VITALS=1) with -Werror; the
        # suite exits non-zero on any failure.
        run: make -C firmware/tests_host

  microcopy-lint:
    name: Dashboard Microcopy Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run microcopy lint trio
        # Three sub-checks gate every PR that touches the dashboard:
        #
        #   (1) Plain-words audit — banned technical jargon (CSI, RSSI,
        #       NVS, threshold, preset, ...) must not appear in the COPY
        #       object or the HTML body of the headline dashboard.
        #
        #   (2) Tooltip coverage — every data-tip="key" attribute resolves
        #       to a defined entry in COPY.tooltips. Catches keys that
        #       get renamed without updating the bank (silent empty
        #       tooltips for the user — usability bug, not a crash, so
        #       easy to ship without this guard).
        #
        #   (3) Reading-grade FKGL — aggregate Flesch-Kincaid across the
        #       COPY corpus stays at or below 7th grade. The plan's
        #       target is 6th; one grade of slack absorbs noisy short
        #       strings.
        run: |
          chmod +x firmware/scripts/microcopy_lint.sh
          firmware/scripts/microcopy_lint.sh
