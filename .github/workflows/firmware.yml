name: Firmware Build

on:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'
      # The release workflow is a checked INPUT here, not just a neighbor:
      # "Regression Guards" runs check_ota_channels.py, which reads the
      # manifests firmware-release.yml publishes and fails when firmware polls
      # one that nothing signs. Without this path, a PR that only edits the
      # publishing side skips the very guard that covers it.
      - '.github/workflows/firmware-release.yml'
  pull_request:
    branches: [main]
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'
      # The release workflow is a checked INPUT here, not just a neighbor:
      # "Regression Guards" runs check_ota_channels.py, which reads the
      # manifests firmware-release.yml publishes and fails when firmware polls
      # one that nothing signs. Without this path, a PR that only edits the
      # publishing side skips the very guard that covers it.
      - '.github/workflows/firmware-release.yml'

# A new push to a PR branch supersedes its in-flight run; main is never
# canceled.
#
# This used to cancel on every ref, main included, and that quietly destroyed
# the signal this workflow exists to produce. The build takes ~30 minutes and
# merges arrive in bursts — three landed within about a minute on 2026-07-24 —
# so each merge killed the previous run before it could report. Four of the
# five main builds that day ended `canceled`, including both halves of a
# link-error fix; the one that did finish reported the failure, but by then
# the broken commit was already on main and the next merge canceled the
# correction's build too.
#
# A canceled build is not a neutral outcome. It is indistinguishable at a
# glance from one that has not finished, so main can sit broken while looking
# merely busy. Queueing costs runner minutes; canceling costs the ability to
# know whether main compiles. This matches what nearly every other workflow
# here already does, and what the website's site-checks.yml does.
concurrency:
  # PRs collapse per branch: a new push makes the old build irrelevant, so
  # canceling it is free. Pushes to a BRANCH (main) get a group per COMMIT,
  # which looks redundant next to `cancel-in-progress: false` and is not.
  #
  # `cancel-in-progress: false` only promises not to cancel the RUNNING run.
  # GitHub keeps at most one PENDING run per group, so with a shared group and
  # commits landing faster than the build takes, each new commit evicts the
  # one waiting behind it. The display build takes ~50 minutes — long enough
  # that this happened for real: the run verifying a fix to a red main
  # (fw 2.4.3 era) was canceled by the next two merges, so the fix sat
  # unverified and the repair looked stalled. A merged commit whose build
  # never ran is the failure this exists to prevent, and it is silent —
  # "canceled" reads like housekeeping, not like a gap in coverage.
  #
  # Per-commit groups cost concurrent runners on a busy day; an unverified
  # main costs a bad release. Revisit if runner minutes become the binding
  # constraint — sharding the 18-env display job would shorten the window
  # that makes this bite at all.
  group: firmware-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Flavor manifest
  #
  # firmware/flavors.json is the single source of truth for every
  # PlatformIO-built firmware flavor. Adding a future flavor means
  # adding one manifest entry (plus its envs/ ini + configs/ dir per
  # firmware/ARCHITECTURE.md) — no new CI jobs. Each entry drives one
  # matrix leg of `build-platformio` and one of `pio-check` below.
  #
  # Manifest fields:
  #   name               — display name + cache-key component
  #   dir                — project dir holding platformio.ini
  #   build_envs         — envs compiled by the build job, in order
  #   check_env          — env analyzed by the pio-check job
  #   pip_extras         — extra pip packages (e.g. canary needs
  #                        intelhex: esptool 4.11.0 bundled by the
  #                        official espressif32 7.x platform imports it
  #                        without declaring it, so bootloader.bin
  #                        generation dies on a clean runner without it)
  #   core_dir_groups    — map of env → group label; every env with the same
  #                        label shares ONE PLATFORMIO_CORE_DIR
  #                        (.pio-core-<label>), separate from the default.
  #                        Same isolation reason as isolated_core_envs, but
  #                        one toolchain download for a whole same-platform
  #                        family (the 12 pioarduino dash envs) instead of
  #                        one per env. Checked before isolated_core_envs.
  #   isolated_core_envs — envs that get their own PLATFORMIO_CORE_DIR.
  #                        Needed when one project mixes the official
  #                        espressif32 platform with the pioarduino fork:
  #                        both ship a package literally named
  #                        `framework-arduinoespressif32` at incompatible
  #                        versions (2.0.17 vs 3.3.8). Sharing
  #                        ~/.platformio, pioarduino sees 2.0.17 already
  #                        "installed", skips its own 3.3.8, and its build
  #                        script fails with FRAMEWORK_DIR=None before any
  #                        compile. (canary's `full` env hits this; a
  #                        project that is pioarduino-only, like
  #                        canary-wap, runs alone in its leg and needs no
  #                        isolation.)
  #   pre_step           — named setup hook; "secrets_header" writes a
  #                        CI-only secrets/secrets.h (build verification,
  #                        not deployment)
  #   size_guards        — list of {bin, slot_bytes, slot_name}: fail if
  #                        `bin` exceeds `slot_bytes` (an image bigger
  #                        than its OTA A/B slot can never be installed
  #                        over the air). A LIST because one flavor can
  #                        span boards with different slot budgets — the
  #                        v2.4.6 C6 nightstand shipped 5 KB over its
  #                        slot precisely because only the S3 watch bin
  #                        was guarded. Each entry runs right after the
  #                        env whose .pio/build/<env>/ dir it names.
  # ──────────────────────────────────────────────────────────────────
  flavors:
    name: Load flavor manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.load.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: load
        run: echo "matrix=$(jq -c . firmware/flavors.json)" >> "$GITHUB_OUTPUT"

  build-platformio:
    name: PlatformIO Build (${{ matrix.flavor.name }})
    needs: flavors
    runs-on: ubuntu-latest
    # 90, not 45. Measured on main: canary-display takes 43-44 minutes against
    # the old 45-minute limit — about 60 seconds of headroom, i.e. one slow
    # runner away from a red X that reads like a broken build but is really a
    # stopwatch. Every other flavor finishes in 2-5 minutes.
    #
    # The asymmetry is not a slow toolchain, it is arithmetic: canary-display
    # builds 18 environments in this one job (dash and its nine feature
    # variants, dash7, nightstand7, watch, watch-modes, two nightstands,
    # touch169, playground); canary-wap and canary-sense build 2,
    # canary-vision 3. The 18th (nightstand7) shares dash7's core-3 platform,
    # so it costs a compile, not another toolchain download.
    #
    # The RIGHT fix is to shard those 18 across parallel jobs — it would cut
    # wall-clock enormously AND tell you WHICH environment broke instead of
    # "display failed". That changes job names, which can break required-status
    # checks configured on main, so it is deliberately left as a separate,
    # reviewable change rather than smuggled in here. Raising the ceiling stops
    # the bleeding today.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJSON(needs.flavors.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ matrix.flavor.dir }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
          key: ${{ runner.os }}-pio-${{ matrix.flavor.name }}-${{ hashFiles(format('{0}/platformio.ini', matrix.flavor.dir), 'firmware/envs/platformio/*.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-${{ matrix.flavor.name }}-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio ${{ matrix.flavor.pip_extras }}

      - name: Generate CI secrets header (build-only, not from committed file)
        if: matrix.flavor.pre_step == 'secrets_header'
        run: |
          mkdir -p secrets
          cat > secrets/secrets.h << 'HEADER'
          #pragma once
          // Auto-generated for CI build verification only. Not for deployment.
          #define WIFI_SSID "ci"
          #define WIFI_PASS "ci"
          #define MQTT_HOST "127.0.0.1"
          #define MQTT_PORT 1883
          #define MQTT_USER "ci"
          #define MQTT_PASS "ci"
          HEADER

      - name: Build all environments (+ OTA-slot size guard)
        # The size guard runs IMMEDIATELY after the env that produces the
        # guarded binary, inside the loop — not as a separate step. A later
        # env build can recreate .pio/build and drop sibling envs' artifacts
        # (observed when canary's `full` env, on the pioarduino platform with
        # an isolated core dir, followed `release`: release/firmware.bin was
        # gone by the end of the job).
        env:
          PLATFORMIO_BUILD_FLAGS: -DVALIDATION_BUILD=1
          FLAVOR_JSON: ${{ toJSON(matrix.flavor) }}
        run: |
          set -euo pipefail
          # size_guards is a LIST (one flavor can guard several bins with
          # different slot budgets); each entry fires right after the env
          # that produces its bin, before a later env can clobber .pio/build.
          size_guard() {
            local GUARD="$1" BIN SLOT SLOT_NAME SIZE
            BIN=$(jq -r '.bin' <<< "$GUARD")
            SLOT=$(jq -r '.slot_bytes' <<< "$GUARD")
            SLOT_NAME=$(jq -r '.slot_name // "OTA slot"' <<< "$GUARD")
            SIZE=$(stat -c%s "$BIN" 2>/dev/null || echo 0)
            if [ "$SIZE" -eq 0 ]; then
              echo "::error::$BIN not found — size guard cannot run."
              exit 1
            fi
            if [ "$SIZE" -gt "$SLOT" ]; then
              echo "::error::Firmware binary $BIN ($SIZE bytes) exceeds the $SLOT_NAME ($SLOT bytes). It could never be installed over the air — trim features or grow the slots."
              exit 1
            fi
            echo "Firmware size: $SIZE / $SLOT bytes ($((SIZE * 100 / SLOT))% of $SLOT_NAME)"
          }
          for e in $(jq -r '.build_envs[]' <<< "$FLAVOR_JSON"); do
            GROUP=$(jq -r --arg e "$e" '(.core_dir_groups // {})[$e] // empty' <<< "$FLAVOR_JSON")
            if [ -n "$GROUP" ]; then
              echo "── pio run -e $e (shared PLATFORMIO_CORE_DIR group: $GROUP) ──"
              PLATFORMIO_CORE_DIR="$GITHUB_WORKSPACE/.pio-core-$GROUP" pio run -e "$e"
            elif jq -e --arg e "$e" '(.isolated_core_envs // []) | index($e)' <<< "$FLAVOR_JSON" > /dev/null; then
              echo "── pio run -e $e (isolated PLATFORMIO_CORE_DIR) ──"
              PLATFORMIO_CORE_DIR="$GITHUB_WORKSPACE/.pio-core-$e" pio run -e "$e"
            else
              echo "── pio run -e $e ──"
              pio run -e "$e"
            fi
            while IFS= read -r GUARD; do
              [ -n "$GUARD" ] || continue
              case "$(jq -r '.bin' <<< "$GUARD")" in
                .pio/build/$e/*) size_guard "$GUARD" ;;
              esac
            done < <(jq -c '.size_guards // [] | .[]' <<< "$FLAVOR_JSON")
          done

  pio-check:
    name: Static Analysis (${{ matrix.flavor.name }})
    needs: flavors
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJSON(needs.flavors.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ matrix.flavor.dir }}
    # cppcheck has been configured via check_tool/check_flags in the
    # PlatformIO inis (firmware/envs/platformio/common.ini) since the
    # envs were created, but nothing ever ran it. This job closes that
    # gap per flavor. `pio check` exits 0 on findings unless
    # --fail-on-defect is given; medium catches cppcheck warning-severity
    # defects (real bug classes: format-string mismatches, uninitialized
    # members, side effects in assert) without drowning in style nits.
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
          key: ${{ runner.os }}-pio-${{ matrix.flavor.name }}-${{ hashFiles(format('{0}/platformio.ini', matrix.flavor.dir), 'firmware/envs/platformio/*.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-${{ matrix.flavor.name }}-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio ${{ matrix.flavor.pip_extras }}

      - name: Generate CI secrets header (build-only, not from committed file)
        if: matrix.flavor.pre_step == 'secrets_header'
        run: |
          mkdir -p secrets
          cat > secrets/secrets.h << 'HEADER'
          #pragma once
          // Auto-generated for CI build verification only. Not for deployment.
          #define WIFI_SSID "ci"
          #define WIFI_PASS "ci"
          #define MQTT_HOST "127.0.0.1"
          #define MQTT_PORT 1883
          #define MQTT_USER "ci"
          #define MQTT_PASS "ci"
          HEADER

      - name: Run pio check
        run: |
          pio check -e ${{ matrix.flavor.check_env }} --fail-on-defect=medium --fail-on-defect=high --skip-packages

  build-arduino-cli:
    name: Arduino CLI Build (Canary WAP)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Install Arduino CLI + ESP32 core (cached)
        # NimBLE-Arduino (2.x) is REQUIRED for the FULL profile's BLE stack.
        # Without it the sketch's ble_config.h guard now errors instead of
        # silently shipping "BLE unavailable in this build" — installing it
        # here means BLE is actually compile-tested in CI.
        uses: ./.github/actions/setup-arduino-esp32
        with:
          libraries: |
            Crypto
            ArduinoJson
            NimBLE-Arduino

      - name: Compile firmware
        run: |
          # --libraries makes arduino-cli treat each subdir of firmware/common/
          # as a library root, so #include <csi_types.h> resolves to
          # firmware/common/csi/csi_types.h via library.properties.
          # NimBLE is installed above, so the FULL profile compiles the real
          # BLE stack (FEATURE_BLE=1) rather than the no-radio stub.
          # PSRAM=opi is REQUIRED: the bare board FQBN defaults to
          # PSRAM=Disabled, which is the misconfiguration that heap-starved
          # field devices (BLE refused, SD writes failing, dashboard timing
          # out) — build_config.h now #errors on FULL+S3 without PSRAM, and
          # CI must validate the configuration devices actually run.
          # NOTE: overriding build.extra_flags REPLACES the board's default
          # expansion, which is what carries {build.defines} — i.e. the
          # -DBOARD_HAS_PSRAM that PSRAM=opi sets. Re-add it explicitly or
          # the PSRAM guard in build_config.h (correctly) fails the build.
          arduino-cli compile \
            --fqbn esp32:esp32:XIAO_ESP32S3:PSRAM=opi \
            --libraries firmware/common \
            --build-property "build.extra_flags=-DVALIDATION_BUILD=1 -DBOARD_HAS_PSRAM" \
            --output-dir /tmp/wap-build \
            firmware/projects/canary-wap/arduino/canary_wap/canary_wap.ino

      - name: Check binary size against the OTA slot
        run: |
          # The XIAO_ESP32S3 board default (default_8MB.csv) gives app0/app1
          # 0x330000 (3,342,336 bytes) each. An image larger than that can
          # never be installed over the air (pull OTA or BLE OTA).
          SLOT=3342336
          SIZE=$(stat -c%s /tmp/wap-build/canary_wap.ino.bin 2>/dev/null || echo 0)
          if [ "$SIZE" -eq 0 ]; then
            echo "::error::canary_wap.ino.bin not found in /tmp/wap-build"
            ls -la /tmp/wap-build || true
            exit 1
          fi
          if [ "$SIZE" -gt "$SLOT" ]; then
            echo "::error::canary-wap binary ($SIZE bytes) exceeds the 0x330000 OTA slot ($SLOT bytes). It could never be installed over the air."
            exit 1
          fi
          echo "canary-wap size: $SIZE / $SLOT bytes ($((SIZE * 100 / SLOT))% of OTA slot)"

      - name: Compile firmware (Beacon channel gate)
        run: |
          # FEATURE_BEACON_CHANNEL is OFF by default, which previously meant
          # beacon_channel.cpp (and every #if FEATURE_BEACON_CHANNEL block in
          # the sketch) was never compile-verified in CI. This second pass
          # forces the flag ON so the Beacon scaffold — including its
          # append-only SD audit-log path (AGENTS.md Beacon invariant 9) —
          # can't silently rot.
          arduino-cli compile \
            --fqbn esp32:esp32:XIAO_ESP32S3:PSRAM=opi \
            --libraries firmware/common \
            --build-property "build.extra_flags=-DVALIDATION_BUILD=1 -DFEATURE_BEACON_CHANNEL=1 -DBOARD_HAS_PSRAM" \
            firmware/projects/canary-wap/arduino/canary_wap/canary_wap.ino

  build-arduino-cli-display:
    name: Arduino CLI Build (Canary Display ${{ matrix.flavor.name }}, core ${{ matrix.core.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        flavor:
          - name: watch
            # XIAO_ESP32S3 defaults to 8 MB flash + its own partition table;
            # PSRAM=opi is the only override needed (matching the canary-wap
            # Arduino CI). An explicit PartitionScheme= value the board menu
            # doesn't define fails FQBN validation.
            fqbn: "esp32:esp32:XIAO_ESP32S3:PSRAM=opi"
          - name: dash
            # huge_app (3 MB app) is a built-in scheme valid on the generic
            # esp32s3 board and comfortably fits the LVGL firmware — the CI
            # compile gate only needs a valid, fitting layout; production uses
            # the custom 16 MB A/B table (default_16MB.csv) in the PIO tree.
            fqbn: "esp32:esp32:esp32s3:PSRAM=opi,FlashSize=16M,PartitionScheme=huge_app"
        # The sketch is dual-core (hal/core_compat.h + the NimBLE gate in
        # chirp_scan.cpp), but GFX and NimBLE split their majors along the
        # core boundary — each core line carries its own library pins. This
        # matrix mirrors the watch/dash vs watch-core3/dash-core3 profiles
        # in sketch.yaml; keep the two in lockstep.
        core:
          - name: "2.0.17"
            # Matches the PlatformIO env (espressif32@6.9.0) — the
            # bench-validated release path (LVGL 8.4 pairing).
            version: "2.0.17"
            gfx: "1.4.9"
            nimble: "1.4.3"
            lvgl: "8.4.0"
          - name: "3.x"
            # The Boards Manager default line — everything-latest pairing:
            # GFX 1.6.x / NimBLE 2.x / LVGL 9.x (the source is dual-major
            # for all three splits; see lvgl_port.cpp + core_compat.h).
            version: "3.3.10"
            gfx: "1.6.6"
            nimble: "2.5.0"
            lvgl: "9.5.0"
    steps:
      - uses: actions/checkout@v7

      - name: Install Arduino CLI + ESP32 core ${{ matrix.core.version }} (cached, libs pinned per core line)
        uses: ./.github/actions/setup-arduino-esp32
        with:
          core-version: ${{ matrix.core.version }}
          libraries: |
            GFX Library for Arduino@${{ matrix.core.gfx }}
            lvgl@${{ matrix.core.lvgl }}
            PubSubClient
            Crypto
            ArduinoJson
            NimBLE-Arduino@${{ matrix.core.nimble }}

      - name: Profile build (arduino-cli --profile, core-3 row)
        # sketch.yaml profiles are what the CLI docs point users at, but
        # nothing compiled through them until this leg — the IDE ignores
        # profiles entirely (arduino-ide#2573), so the README's cli path
        # must stay proven here. Profiles auto-install their own pinned
        # core + libraries into an isolated dir; lv_conf.h resolution is
        # exactly what this leg exercises.
        if: matrix.core.name == '3.x'
        run: |
          cd firmware/projects/canary-display/arduino/canary_display
          arduino-cli compile --profile ${{ matrix.flavor.name }}-core3 \
            --output-dir /tmp/display-profile-build canary_display.ino

      - name: Zip-download build (watch, zero setup)
        # A raw GitHub zip / fresh checkout must compile with NO setup step:
        # the committed flavor dispatchers (pins.h/flavor_config.h ->
        # flavor_select.h) default to watch, and missing secrets fall back to
        # secrets.ci.h -> the onboarding wizard. This leg is the regression
        # test for that promise — it compiles the sketch exactly as
        # downloaded, before setup.sh ever runs.
        if: matrix.flavor.name == 'watch'
        run: |
          LIBDIR="$(arduino-cli config get directories.user)/libraries"
          mkdir -p "${LIBDIR}"
          cp firmware/projects/canary-display/arduino/canary_display/lv_conf.h "${LIBDIR}/lv_conf.h"
          arduino-cli compile \
            --fqbn ${{ matrix.flavor.fqbn }} \
            --output-dir /tmp/display-zip-build \
            firmware/projects/canary-display/arduino/canary_display/canary_display.ino

      - name: Stage + compile ${{ matrix.flavor.name }}
        run: |
          cd firmware/projects/canary-display
          ./setup.sh arduino ${{ matrix.flavor.name }}
          # LVGL resolves lv_conf.h relative to the libraries dir root
          # (libraries/lvgl/src/../../lv_conf.h). Stage the sketch's copy there
          # so the library compiles against the project's config.
          LIBDIR="$(arduino-cli config get directories.user)/libraries"
          cp arduino/canary_display/lv_conf.h "${LIBDIR}/lv_conf.h"
          arduino-cli compile \
            --fqbn ${{ matrix.flavor.fqbn }} \
            --output-dir /tmp/display-build \
            arduino/canary_display/canary_display.ino

  csi-sketch-sync:
    name: CSI Sketch Copy Sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Verify CSI library copies in canary-wap sketch dir match canonical source
        # The Arduino IDE only sees files inside the sketch folder and globally
        # installed libraries — so the CSI library is committed twice: once at
        # firmware/common/csi/src/ (canonical) and once next to the sketch so
        # GitHub zip downloads compile out of the box. This guard catches
        # drift in either direction.
        run: |
          chmod +x firmware/scripts/check_csi_sync.sh
          firmware/scripts/check_csi_sync.sh

      - name: Verify power-logic copy in canary-wap sketch dir matches canonical source
        # Same committed-copy pattern: the battery decision logic lives
        # at firmware/common/power/power_logic.h (canonical, host-tested)
        # and is copied next to the sketch for Arduino IDE builds.
        run: |
          chmod +x firmware/scripts/check_power_sync.sh
          firmware/scripts/check_power_sync.sh

      - name: Verify boot banner copies in canary-wap sketch dir match canonical source
        # Same committed-copy pattern as the CSI library: the boot banner lives
        # at firmware/common/boot/ (canonical) and is copied next to the sketch
        # so GitHub zip downloads compile out of the box without setup.sh. The
        # arduino-cli CI build above passes --libraries firmware/common, which
        # masks a missing sketch-local copy, so this guard catches the drift.
        run: |
          chmod +x firmware/scripts/check_boot_sync.sh
          firmware/scripts/check_boot_sync.sh

      - name: Verify fleet-link beacon header copies match the canonical wire format
        # The fleet-link presence beacon (fleet_beacon.h) is a byte-exact BLE
        # contract shared across firmwares: canonical at
        # firmware/common/fleet_link/ (included directly by the canary PIO build
        # via -I, and host-tested there) and committed byte-identical next to the
        # canary-wap Arduino sketch. If the copies diverge, a canary and a
        # canary-display silently stop understanding each other's beacon with no
        # compile error — this guard catches the drift in either direction.
        run: |
          chmod +x firmware/scripts/check_fleet_beacon_sync.sh
          firmware/scripts/check_fleet_beacon_sync.sh

      - name: Verify fleet self-report header copies match the canonical /api/fleet wire shape
        # fleet_selfreport.h is the ONE place the coarse /api/fleet presence JSON
        # shape lives (the DISCOVERY.md contract the Witness Wall emulator + the
        # Flasher's post-flash LAN discovery read). Canonical at
        # firmware/common/fleet_selfreport/ (included directly by the PIO builds
        # via -I, and host-tested there) and committed byte-identical next to the
        # canary-wap Arduino sketch. If the copies diverge, boards answer
        # /api/fleet with different shapes and the wall/Flasher misparse them,
        # with no compile error — this guard catches the drift either direction.
        run: |
          chmod +x firmware/scripts/check_fleet_selfreport_sync.sh
          firmware/scripts/check_fleet_selfreport_sync.sh

      - name: Verify OTA engine copies in the canary-wap + canary-display sketch dirs match canonical source
        # The signed pull-OTA engine is canonical at firmware/common/ota/src/
        # and committed byte-identical next to BOTH Arduino sketches (canary-wap
        # and canary-display) — it is the most security-critical firmware
        # module, so a fix must never silently miss a tree. ota_release_key.h is
        # in the sync set on purpose: the release public key must be identical
        # across the canary (PIO) build, the WAP + display pull-OTA engines, and
        # the WAP's BLE OTA path — one release signature serves every update
        # channel.
        run: |
          chmod +x firmware/scripts/check_ota_sync.sh
          firmware/scripts/check_ota_sync.sh

      - name: Verify acoustic module copy in canary-wap sketch dir matches canonical source
        # securacv_audio is canonical at firmware/canary/lib/securacv_audio/src/
        # and vendored next to the sketch. Unlike the other copies it carries
        # four documented adaptations (log-enum vocabulary, build_config
        # feature gate), so the script normalizes both sides before diffing —
        # any change beyond those adaptations must land in BOTH copies.
        run: |
          chmod +x firmware/scripts/check_audio_sync.sh
          firmware/scripts/check_audio_sync.sh

      - name: Verify the Canary Display Arduino sketch is in sync with the PlatformIO tree
        # The display Arduino sketch is GENERATED from the canonical PlatformIO
        # tree (src/ + include/) by setup.sh, not hand-copied — this guard
        # regenerates it and fails if the committed sketch drifted (someone
        # edited src/ without running `./setup.sh regen`).
        run: |
          chmod +x firmware/scripts/check_display_arduino_sync.sh
          firmware/scripts/check_display_arduino_sync.sh

  regression-check:
    name: Regression Guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Run regression checks
        run: |
          chmod +x firmware/scripts/regression_check.sh
          firmware/scripts/regression_check.sh

      - name: Run feature-sanity header tests
        # firmware/common/core/feature_sanity.h is the Marlin-SanityCheck-
        # style FEATURE_* vs HAS_* cross-check. This host suite asserts each
        # #error fires (and doesn't fire) for representative flag combos and
        # compiles every Vision host board's pins.h against the vision
        # default feature set.
        run: bash firmware/scripts/test_feature_sanity.sh

      - name: Check board registry
        # firmware/boards/boards.json is the single source of truth for
        # supported hardware (the board-level flavors.json). This guard
        # keeps the registry, the board directories, the pin headers, the
        # build environments, and the boards README consistent — and
        # enforces the "pins are data" rule (pins.h = #define only) plus
        # tier_evidence for any board claiming hardware validation.
        # Contract: firmware/PORTING.md.
        run: python3 firmware/scripts/check_board_registry.py

      - name: Check pin budget (the board fullness gauge)
        # firmware/boards/PIN_BUDGET.md is generated from the data-only
        # pins/pins.h files + boards.json and committed (same philosophy as
        # the website's generated .glb models): edit a pin map, regenerate
        # in the same change. This fails when the committed gauge no longer
        # matches the pin maps. Fixer:
        #   python3 firmware/scripts/pin_budget.py --write
        run: python3 firmware/scripts/pin_budget.py --check

      - name: Check shared common/ sources are actually compiled
        # A .cpp under firmware/common/ that no manifest, build_src_filter, or
        # staged Arduino copy picks up is silently dropped from every image —
        # and only surfaces as an undefined reference at LINK time, in one
        # board's build job. The -I../../common include path resolves the
        # headers either way, which is what makes it so easy to miss in review.
        # This is a seconds-long check for a failure that otherwise costs a
        # full firmware matrix run. Contract: the script's module docstring.
        run: python3 firmware/scripts/check_common_build_reachability.py

      - name: Check OTA channels (polled manifests are published ones)
        # Every SECURACV_OTA_MANIFEST_URL compiled into the firmware must be a
        # manifest firmware-release.yml actually signs — or be declared as
        # having no channel yet, with a reason. The Canary Displays shipped
        # polling a manifest no release ever published: flashable over USB,
        # structurally unable to self-update, and silent about it (a device
        # just fetches a 404 forever). Static and offline, so it fails on the
        # PR that adds the flavor instead of a release nobody inspects.
        run: python3 firmware/scripts/check_ota_channels.py

      - name: Verify LESSONS_LEARNED.md exists
        run: |
          if [ ! -f "firmware/LESSONS_LEARNED.md" ]; then
            echo "::error::firmware/LESSONS_LEARNED.md is missing!"
            exit 1
          fi
          LINES=$(wc -l < firmware/LESSONS_LEARNED.md)
          if [ "$LINES" -lt 10 ]; then
            echo "::error::LESSONS_LEARNED.md seems empty ($LINES lines)"
            exit 1
          fi
          echo "LESSONS_LEARNED.md: $LINES lines ✓"

  archive-guard:
    name: Archive Edit Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reject edits under firmware/projects/_archive/
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          # Determine the base ref to diff against.
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            git fetch origin "${GITHUB_BASE_REF}" --depth=1
            BASE="origin/${GITHUB_BASE_REF}"
          else
            # Push event: compare against the previous commit on this ref.
            BASE="${GITHUB_SHA}^"
          fi

          CHANGED=$(git diff --name-only "$BASE"..."${GITHUB_SHA}" -- 'firmware/projects/_archive/' || true)
          if [ -z "$CHANGED" ]; then
            echo "No changes under firmware/projects/_archive/ — guard passes."
            exit 0
          fi

          echo "Detected changes under firmware/projects/_archive/:"
          echo "$CHANGED"

          # Permit only if an explicit opt-in marker is present in the PR
          # title/body or in at least one commit message in the range.
          MARKER='[archive-edit]'
          if echo "${PR_TITLE:-}" | grep -qF "$MARKER" \
             || echo "${PR_BODY:-}" | grep -qF "$MARKER" \
             || git log --format=%B "$BASE"..."${GITHUB_SHA}" | grep -qF "$MARKER"; then
            echo "Found '$MARKER' marker — archive edit allowed."
            exit 0
          fi

          echo "::error::Edits under firmware/projects/_archive/ are frozen."
          echo "::error::Add '[archive-edit]' to the PR title, body, or a commit message if this is an intentional backport."
          exit 1

  csi-invariants:
    name: CSI Privacy Invariants
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build host invariants test
        # The fuzzer compiles standalone against the CSI library's portable
        # core (no ESP32 deps) and asserts the privacy contracts
        # documented in csi_event_invariants_test.cpp:
        #   1. Disallowed fields are zeroed at the chokepoint
        #   2. P1 events are blocked under a P0 ceiling
        #   3. P2 events never reach the witness chain
        #   4. Time fields are coarsened to the 10-min bucket
        #   5. Strings are ASCII-sanitized
        #   6. The bundler collapses 100 same-state emits to <= 2 commits
        #   7. The per-module hourly ceiling caps bursts
        #   8. The witness-chain payload includes kv= / rs= / zn= (spec §2)
        #   9. ble.events (spec §10) — MAC-precision fields stripped
        #  10. Quiet Hours hold non-anomaly events; one summary at close
        #  11. Anomaly events bypass the Quiet Hours gate
        #  12. core.multilink_fusion strips unauthorized fields (PR 3 + PR 6)
        #  13. ble.scout strips unauthorized fields (PR 5 + PR 6)
        #
        # If a future PR (or LLM coder) breaks any of these, this job
        # fails before the firmware build even starts.
        run: |
          set -euo pipefail
          # PR 6: link the real manifests for core.multilink_fusion (in
          # firmware/common/csi) and ble.scout (in the canary lib) so the
          # invariants test pins the actual allow-lists, not a synthetic
          # stand-in. mesh_crypto.cpp is brought in because ble_scan.cpp
          # uses sha256_domain; its CSI_TEST_HOST_BUILD path provides a
          # vendored SHA-256 so no Arduino/mbedtls dep is needed here.
          g++ -std=c++17 -DCSI_TEST_HOST_BUILD \
              -Wall -Wextra -Wno-unused-parameter \
              firmware/common/csi/csi_event_invariants_test.cpp \
              firmware/common/csi/src/csi_event.cpp \
              firmware/common/csi/src/csi_module.cpp \
              firmware/common/csi/src/csi_bundler.cpp \
              firmware/common/csi/src/csi_witness_payload.cpp \
              firmware/common/csi/src/ble_events_module.cpp \
              firmware/common/csi/src/meta_quiet_hours.cpp \
              firmware/common/csi/src/core_multilink_fusion.cpp \
              firmware/canary/lib/securacv_ble_scan/src/ble_scan.cpp \
              firmware/canary/lib/securacv_ble_scan/src/ble_scout.cpp \
              firmware/canary/lib/securacv_ble_scan/src/ble_scout_state.cpp \
              firmware/canary/lib/securacv_ble_scan/src/ble_scout_key.cpp \
              firmware/canary/lib/securacv_mesh/src/mesh_crypto.cpp \
              -I firmware/common/csi/src \
              -I firmware/canary/lib/securacv_ble_scan/src \
              -I firmware/canary/lib/securacv_mesh/src \
              -o /tmp/csi_invariants

      - name: Run host invariants test
        run: /tmp/csi_invariants

      - name: Build host witness round-trip test
        # Closes the plan's verification promise: "Every Event row
        # round-trips through log_verify with a valid signature and an
        # intact hash chain." The host build can't drive the device's
        # private key, but it CAN exercise the chokepoint contract:
        # every committed event reaches csi_event_commit_witness exactly
        # once, IDs are unique across the chain, and each record's
        # prev_hash points at the previous record's hash.
        run: |
          set -euo pipefail
          g++ -std=c++17 -DCSI_TEST_HOST_BUILD \
              -Wall -Wextra -Wno-unused-parameter \
              firmware/common/csi/csi_witness_roundtrip_test.cpp \
              firmware/common/csi/src/csi_event.cpp \
              firmware/common/csi/src/csi_module.cpp \
              firmware/common/csi/src/csi_bundler.cpp \
              -I firmware/common/csi/src \
              -o /tmp/csi_roundtrip

      - name: Run host witness round-trip test
        run: /tmp/csi_roundtrip

  # ──────────────────────────────────────────────────────────────────
  # Mesh + Scout host test suites
  #
  # Each securacv_mesh and securacv_ble_scan TU has a host-build test
  # that compiles standalone (no Arduino / mbedtls / NimBLE dep — every
  # device-only call is gated by CSI_TEST_HOST_BUILD with a vendored
  # fallback). Run them all on every PR so a future contributor can't
  # silently break wire-format encoding, pairing state machine, signed-
  # envelope verification, BLE Scout state-machine timing, or the
  # arrived/departed broadcast hook contract.
  #
  # New tests added to either lib should be appended to this list.
  # ──────────────────────────────────────────────────────────────────
  mesh-scout-host-tests:
    name: Mesh + Scout Host Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Build + run all mesh + ble_scan host tests
        # Each test links the minimum source set it needs. ble_scout.cpp
        # pulls in csi_event/module/bundler (its emit_arrived flows
        # through the chokepoint), so suites that don't exercise the
        # Scout integration deliberately exclude it from their link
        # set — keeps each test's link surface honest. Every suite
        # ends with an "ALL ... PASSED" marker; the grep makes a
        # silent-pass failure mode visible.
        run: |
          set -euo pipefail
          mkdir -p /tmp/host_tests

          MESH_SRC=firmware/canary/lib/securacv_mesh/src
          BLE_SRC=firmware/canary/lib/securacv_ble_scan/src
          COMMON_SRC=firmware/common/csi/src
          CXXFLAGS=(-std=c++17 -DCSI_TEST_HOST_BUILD -Wall -Wextra -Wno-unused-parameter)

          run_test() {
            local name=$1; shift
            g++ "${CXXFLAGS[@]}" "$@" -o "/tmp/host_tests/test_$name"
            "/tmp/host_tests/test_$name" | tee "/tmp/host_tests/test_$name.log"
            grep -q "ALL .* PASSED" "/tmp/host_tests/test_$name.log"
          }

          # securacv_mesh suites — 7 of them now (mesh_state added with
          # opera_secret NVS persistence). Each test links against
          # every mesh src TU so internal symbols resolve.
          for t in mesh_crypto mesh_envelope mesh_pairing mesh_session \
                   mesh_transport mesh_beacon mesh_state mesh_channel_hop \
                   mesh_hub_election; do
            run_test $t \
              firmware/canary/lib/securacv_mesh/test_${t}.cpp \
              $MESH_SRC/*.cpp \
              -I $MESH_SRC
          done

          # ble_scan + ble_scout_state — pure-logic, only link
          # ble_scan.cpp / ble_scout_state.cpp from the lib, plus
          # mesh_crypto.cpp for sha256_domain.
          run_test ble_scan \
            firmware/canary/lib/securacv_ble_scan/test_ble_scan.cpp \
            $BLE_SRC/ble_scan.cpp \
            $MESH_SRC/mesh_crypto.cpp \
            -I $BLE_SRC -I $MESH_SRC

          run_test ble_scout_state \
            firmware/canary/lib/securacv_ble_scan/test_ble_scout_state.cpp \
            $BLE_SRC/ble_scout_state.cpp \
            $BLE_SRC/ble_scan.cpp \
            $MESH_SRC/mesh_crypto.cpp \
            -I $BLE_SRC -I $MESH_SRC

          # ble_scout_broadcast exercises the chokepoint path inside
          # emit_arrived/departed, so it pulls in csi_event + module
          # + bundler + witness_payload from common/csi/src.
          run_test ble_scout_broadcast \
            firmware/canary/lib/securacv_ble_scan/test_ble_scout_broadcast.cpp \
            $BLE_SRC/ble_scan.cpp \
            $BLE_SRC/ble_scout.cpp \
            $BLE_SRC/ble_scout_state.cpp \
            $BLE_SRC/ble_scout_key.cpp \
            $MESH_SRC/mesh_crypto.cpp \
            $COMMON_SRC/csi_event.cpp \
            $COMMON_SRC/csi_module.cpp \
            $COMMON_SRC/csi_bundler.cpp \
            $COMMON_SRC/csi_witness_payload.cpp \
            -I $BLE_SRC -I $MESH_SRC -I $COMMON_SRC

          # thermal_wd — standalone: the module compiles against
          # thermal_wd_host_stubs.h under CSI_TEST_HOST_BUILD and the
          # test provides the clock, sensor, NVS map, and log capture.
          # Pins the hysteresis ladder, episode-once advisories,
          # ms-accurate time accounting, and the NVS wear cadence.
          run_test thermal_wd \
            firmware/canary/lib/securacv_thermal_watchdog/test_thermal_wd.cpp \
            firmware/canary/lib/securacv_thermal_watchdog/src/securacv_thermal_watchdog.cpp \
            -I firmware/canary/lib/securacv_thermal_watchdog/src

      - name: Build + run canary-display Modbus RTU host test
        # The RS485/Modbus master's framing + CRC-16/MODBUS live in the pure
        # core (canary/io/modbus_rtu.h) so every byte on the 4.3B A/B terminal
        # is host-verified without a board. Anchored on the cataloged
        # CRC-16/MODBUS check value 0x4B37 plus build/parse roundtrips,
        # exception decoding, and CRC/addr/func/capacity rejection cases.
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror \
              -I firmware/projects/canary-display/include \
              firmware/projects/canary-display/tests_host/test_modbus_rtu.cpp \
              -o /tmp/modbus_rtu
          /tmp/modbus_rtu | tee /tmp/modbus_rtu.log
          grep -q "ALL .* PASSED" /tmp/modbus_rtu.log

      - name: Build + run canary-display CAN frame host test
        # The CAN 2.0 frame model — id-width/DLC validity, SocketCAN-style
        # acceptance filtering, and the ASCII log formatter — lives in the pure
        # core (canary/io/can_frame.h) so it is host-verified without a board.
        # The TWAI transport itself is compile-checked by the
        # canary-display-dash-can PlatformIO env.
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror \
              -I firmware/projects/canary-display/include \
              firmware/projects/canary-display/tests_host/test_can_frame.cpp \
              -o /tmp/can_frame
          /tmp/can_frame | tee /tmp/can_frame.log
          grep -q "ALL .* PASSED" /tmp/can_frame.log

      - name: Build + run canary-display field-I/O logic host test
        # The isolated DI/DO promotion's two testable decisions — input
        # debounce (reject contact bounce / bus glitches) and the bounded siren
        # controller (drive only while a real unacked alert stands, capped so it
        # can't blare forever) — live in the pure core (canary/io/field_io_logic.h)
        # and are verified without a board. The runtime that reads the CH422G and
        # reports UNSIGNED local contact events is compile-checked by the
        # canary-display-dash-b env (HAS_ISOLATED_IO).
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror \
              -I firmware/projects/canary-display/include \
              firmware/projects/canary-display/tests_host/test_field_io.cpp \
              -o /tmp/field_io
          /tmp/field_io | tee /tmp/field_io.log
          grep -q "ALL .* PASSED" /tmp/field_io.log

      - name: Build + run canary-display PCF8563/PCF85063A RTC host test
        # Trusted time: the RTC register/calendar core (canary/io/rtc_pcf.h) —
        # BCD packing, the civil<->days epoch math, and the voltage-low validity
        # gate that refuses an unreliable clock — is verified without a board
        # (cross-checked against libc timegm). The runtime that probes 0x51 on
        # the shared I2C bus and seeds/mirrors the clock is compile-checked by the
        # canary-display-dash-rtc env (FEATURE_RTC). The second TU pins the
        # PCF85063A register base (0x04, not the PCF8563 0x02) that the
        # touch169 build relies on.
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror \
              -I firmware/projects/canary-display/include \
              firmware/projects/canary-display/tests_host/test_rtc_pcf.cpp \
              -o /tmp/rtc_pcf
          /tmp/rtc_pcf | tee /tmp/rtc_pcf.log
          grep -q "ALL .* PASSED" /tmp/rtc_pcf.log
          g++ -std=c++17 -Wall -Wextra -Werror \
              -I firmware/projects/canary-display/include \
              firmware/projects/canary-display/tests_host/test_rtc_pcf85063.cpp \
              -o /tmp/rtc_pcf85063
          /tmp/rtc_pcf85063 | tee /tmp/rtc_pcf85063.log
          grep -q "ALL .* PASSED" /tmp/rtc_pcf85063.log

      - name: Build + run canary-display ESP-NOW peer-decode host test
        # Router-independent peer presence: the decode that turns a raw ESP-NOW
        # payload into a fleet-link beacon (fp4 + status) reuses the shared,
        # host-tested beacon wire contract (canary/net/beacon_parse.h), so an
        # ESP-NOW frame and a BLE advert from one canary resolve to one witness,
        # and foreign traffic / noise is rejected before the fleet. The esp_now
        # transport is compile-checked by the canary-display-dash-espnow env.
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror \
              -I firmware/projects/canary-display/include \
              firmware/projects/canary-display/tests_host/test_espnow_peer.cpp \
              -o /tmp/espnow_peer
          /tmp/espnow_peer | tee /tmp/espnow_peer.log
          grep -q "ALL .* PASSED" /tmp/espnow_peer.log

      - name: Build + run canary-display pair demo host test
        # The First Light pair demo's pure core (canary/pair/pair_demo.h):
        # adopt-first-heard + the lock (the card can never silently switch
        # cameras), the detection-edge rule mirrored from the sender's beacon
        # payload (both ends of the wire agree on what "now" means), the
        # fleet-aligned staleness read, the 5 s HoldGate open gesture, and
        # the boxed-pair auto-open rule (unprovisioned + router-free band
        # ONLY — a working bedside clock never swaps its face). The LVGL/NVS
        # shell is compile-checked by the canary-display-nightlight-c3 env.
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror \
              -I firmware/projects/canary-display/include \
              firmware/projects/canary-display/tests_host/test_pair_demo.cpp \
              -o /tmp/pair_demo
          /tmp/pair_demo | tee /tmp/pair_demo.log
          grep -q "ALL .* PASSED" /tmp/pair_demo.log

      - name: Build + run canary-display mode registry host test
        # The glass's gears (docs/hardware/display_modes.md): boot-gear
        # resolution from the NVS token + the legacy devmode-bool migration,
        # the build-capability gate, and the policy invariants — fail-safe to
        # Fleet on anything unknown/uncarried, OTA only under the product
        # face, and every non-fleet gear exit-by-long-press + bannered. Pure
        # core (canary/mode/mode_registry.h); the runtime latch/branch glue
        # stays a thin shell around these tables.
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror \
              -I firmware/projects/canary-display/include \
              firmware/projects/canary-display/tests_host/test_mode_registry.cpp \
              -o /tmp/mode_registry
          /tmp/mode_registry | tee /tmp/mode_registry.log
          grep -q "ALL .* PASSED" /tmp/mode_registry.log

      - name: Build + run canary-display demo script host test
        # Demo mode's storyline (canary/mode/demo_script.h) is drift-locked to
        # the REAL event vocabulary: this links src/fleet/fleet_model.cpp and
        # pins every scripted beat's intended severity to classify_event(), so
        # a vocabulary change can't quietly defang the demo's alarm beat. Also
        # pins the timeline shape (ordered, in-loop, resolves to quiet) and
        # the wrap-safe fires-once-per-lap stepping.
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror \
              -I firmware/projects/canary-display/include \
              firmware/projects/canary-display/tests_host/test_demo_script.cpp \
              firmware/projects/canary-display/src/fleet/fleet_model.cpp \
              -o /tmp/demo_script
          /tmp/demo_script | tee /tmp/demo_script.log
          grep -q "ALL .* PASSED" /tmp/demo_script.log

      - name: Build + run canary-display arcade logic host test
        # Arcade mode's factory claim — one round exercises EVERY touch zone
        # and the score screen is the QA report — is pinned in the pure core
        # (canary/mode/arcade_logic.h): the seeded shuffle visits every zone
        # exactly once and replays from its printed seed, targets never leave
        # their zone cell, and the verdict fails on a dead zone, a slow zone,
        # or a stray tap. The LVGL runtime (FEATURE_ARCADE) draws and forwards
        # taps; it decides nothing.
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror \
              -I firmware/projects/canary-display/include \
              firmware/projects/canary-display/tests_host/test_arcade_logic.cpp \
              -o /tmp/arcade_logic
          /tmp/arcade_logic | tee /tmp/arcade_logic.log
          grep -q "ALL .* PASSED" /tmp/arcade_logic.log

      - name: Build + run canary-display mic logic host test
        # The mic-bearing dash's two promises (display_mic_variant.md),
        # pinned without a board: the GATE (off by default; unset pins
        # hard-block listening; the amber indicator IS the driver-running
        # bit — no second flag exists to lie; disarm is a Stop the runtime
        # maps to i2s_driver_uninstall) and the EARS (only the regulated
        # smoke-T3 / CO-T4 grammars raise events, each needing two cycles;
        # doorbells, speech-shaped noise, and stale streaks never do). The
        # I2S runtime is compile-checked by canary-display-dash-mic.
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror \
              -I firmware/projects/canary-display/include \
              firmware/projects/canary-display/tests_host/test_mic_logic.cpp \
              -o /tmp/mic_logic
          /tmp/mic_logic | tee /tmp/mic_logic.log
          grep -q "ALL .* PASSED" /tmp/mic_logic.log

      - name: Build + run canary-display voice score host test
        # The Canary Voice acoustic core (voice_score.h): the pure score +
        # audio math behind the sound engine, pinned without a piezo — the
        # palette resolves for every signature, the pleasant voices stay in
        # the pentatonic scale while the Tier-1 alarm keeps its frozen IEC
        # pitches, the rise/fall contours carry the semantics (sunrise/boot
        # rise, all-clear falls, mute-on/off mirror), every envelope
        # de-clicks its edges, glissando/warble stay bounded, and the volume
        # model is monotone, night-silences the gentle categories, and keeps
        # the Tier-1 alert audible at every volume including Off.
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror \
              -I firmware/projects/canary-display/include \
              firmware/projects/canary-display/tests_host/test_voice_score.cpp \
              -o /tmp/voice_score
          /tmp/voice_score | tee /tmp/voice_score.log
          grep -q "ALL .* PASSED" /tmp/voice_score.log

      - name: Build + run canary-display voice clearance host test
        # Acoustic clearance (docs/hardware/display_sound_clearance.md): no
        # signature reproduces a regulated life-safety cadence — ISO 8201
        # Temporal-Three (fire) or Temporal-Four (CO) — so a status chirp can
        # never be confused with a real alarm; plus the originality invariants
        # (pleasant voices stay in the public-domain pentatonic; the alarm uses
        # only its two IEC frequencies). The detectors self-verify against the
        # real cadences so the guard can't rot into a rubber stamp.
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror \
              -I firmware/projects/canary-display/include \
              firmware/projects/canary-display/tests_host/test_voice_clearance.cpp \
              -o /tmp/voice_clearance
          /tmp/voice_clearance | tee /tmp/voice_clearance.log
          grep -q "ALL .* PASSED" /tmp/voice_clearance.log

      - name: Build + run Canary Link core host test
        # The generic authenticated-datagram layer under the Tin Can's strings
        # (firmware/common/link/) — deliberately NOT kid-specific, because
        # "many nodes, one radio, no broker, no cloud" is a general problem.
        # This step exists to pin the mistakes that are cheap to make and
        # catastrophic to ship: a nonce that repeats across the two directions
        # of a session (fatal under both ChaCha20-Poly1305 and AES-GCM), a send
        # counter that rewinds after an unclean reboot, a revocation that
        # quietly un-revokes, and a relay that treats the mutable hops/ttl
        # bytes — which sit OUTSIDE the AEAD by design — as if they were
        # evidence. No board, no radio, no crypto library needed.
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror \
              -I firmware/common/link \
              firmware/projects/canary-tincan/tests_host/test_link_core.cpp \
              -o /tmp/link_core
          /tmp/link_core | tee /tmp/link_core.log
          grep -q "ALL .* PASSED" /tmp/link_core.log

      - name: Build + run Tin Can payload cores host test
        # The kid-facing layer (docs/design/canary_tincan_kids_watch.md): the
        # knock codec (a tapped rhythm must survive the wire and land on the
        # far wrist as the same rhythm), the string model's sender-side knock
        # cooldown and terminal cut, the Ring's delivery honesty (there is no
        # "Sent" state, and a NotDelivered always carries a reason a parent can
        # act on), the tie ceremony's parent-window stranger gate, the stamp
        # table's append-only wire contract, warmer/colder — which asserts a
        # fingerprint can hold ONLY household Canary fp4s, never an AP
        # identifier — and the step duel's daily reset.
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror \
              -I firmware/projects/canary-tincan/include \
              firmware/projects/canary-tincan/tests_host/test_tincan_cores.cpp \
              -o /tmp/tincan_cores
          /tmp/tincan_cores | tee /tmp/tincan_cores.log
          grep -q "ALL .* PASSED" /tmp/tincan_cores.log

      - name: Build + run Canary Companion cores host test
        # The Night Watch bedside clock and the Pocket Canary
        # (docs/design/canary_companion.md). Every check here is named after a
        # mistake rather than after a function, because each of these is a
        # one-line change to make and a very hard thing to notice afterwards:
        # a pet that can die or that scores absence against a child; an "ask"
        # that quietly becomes a notification; a night screen that goes dark
        # for trouble as readily as for wellness (a dark screen is a CLAIM OF
        # WELLNESS, so trouble and an unsure clock must both break blackout);
        # a wake-on-raise that fires when a sleeper rolls over; a voice that
        # claims it buzzed on a board with no motor fitted; and a settings
        # mis-tap that wipes a device. No board, no panel, no I2C needed.
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror \
              -I firmware/projects/canary-companion/include \
              firmware/projects/canary-companion/tests_host/test_companion_cores.cpp \
              -o /tmp/companion_cores
          /tmp/companion_cores | tee /tmp/companion_cores.log
          grep -q "ALL .* PASSED" /tmp/companion_cores.log

      - name: Tin Can sketch copy sync
        # The Arduino bring-up sketch carries a staged copy of knock_codec.h,
        # because the Arduino IDE compiles what is in the sketch folder and
        # nothing above it. A staged copy that drifts is worse than no copy:
        # the bench tool would be testing a rhythm codec the product no longer
        # uses, and the divergence would surface as "it felt wrong on the
        # wrist" rather than as a compile error. Same guard, same reason, as
        # the CSI sketch copies.
        run: |
          set -euo pipefail
          diff -u firmware/projects/canary-tincan/include/canary/tincan/knock_codec.h \
                  firmware/projects/canary-tincan/arduino/tincan_bringup/knock_codec.h \
            || { echo "::error::tincan_bringup/knock_codec.h has drifted from the canonical header. Re-copy it."; exit 1; }
          echo "Tin Can sketch copy is in sync."

      - name: Build + run canary-wap provisioning-logic host test
        # The first-run wizard's pure decisions (setup-window keep-alive,
        # scan-cache freshness, AP-only join suppression, AP teardown
        # grace) live in provisioning_logic.h so the phone-visible
        # provisioning behavior is pinned on the host.
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror \
              -I firmware/projects/canary-wap/arduino/canary_wap \
              firmware/projects/canary-wap/tests_host/test_provisioning_logic.cpp \
              -o /tmp/provisioning_logic
          /tmp/provisioning_logic | tee /tmp/provisioning_logic.log
          grep -q "ALL .* PASSED" /tmp/provisioning_logic.log

      - name: Build + run canary-wap self-test-logic host test
        # The pre-flight health check's verdicts (Bluetooth SKIP vs FAIL vs
        # ABSENT across boot window / safe mode / DEV builds, Wi-Fi link-down
        # vs radio-off) live in selftest_logic.h so the "almost everything
        # failing" false-negatives can't come back.
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror \
              -I firmware/projects/canary-wap/arduino/canary_wap \
              firmware/projects/canary-wap/tests_host/test_selftest_logic.cpp \
              -o /tmp/selftest_logic
          /tmp/selftest_logic | tee /tmp/selftest_logic.log
          grep -q "ALL .* PASSED" /tmp/selftest_logic.log

      - name: Build + run acoustic-pipeline (microphone) host test
        # Compiles the REAL vendored securacv_audio.cpp against stub
        # Arduino/ESP-IDF headers and drives synthetic alarm cadences
        # through a scripted i2s_read — the full pipeline: DC-removed RMS,
        # envelope hysteresis, the stage-1 tone gate, the T3/T4/knock/
        # doorbell/glass matchers, self-test mode (relaxed thresholds,
        # peak_rms, the window-edge event-leak guard), the deferred hard
        # mute, and the flat-signal (dead mic) watchdog. The vendored copy
        # is kept identical to firmware/canary's canonical lib by
        # check_audio_sync.sh, so this run covers both firmwares.
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror \
              -I firmware/projects/canary-wap/tests_host/stubs/audio \
              -I firmware/projects/canary-wap/arduino/canary_wap \
              firmware/projects/canary-wap/tests_host/test_audio_cadence.cpp \
              firmware/projects/canary-wap/arduino/canary_wap/securacv_audio.cpp \
              -o /tmp/audio_cadence
          /tmp/audio_cadence | tee /tmp/audio_cadence.log
          grep -q "test_audio_cadence: all tests passed" /tmp/audio_cadence.log

      - name: Build + run canary-wap config-logic host test
        # The Device-tab runtime config clamps. Most important: the event-time
        # coarsening bucket can only be widened past its compile-time floor,
        # never narrowed (Invariant III), and the log threshold can never rise
        # above WARNING (ERROR/CRITICAL always stored).
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror \
              -I firmware/projects/canary-wap/arduino/canary_wap \
              firmware/projects/canary-wap/tests_host/test_config_logic.cpp \
              -o /tmp/config_logic
          /tmp/config_logic | tee /tmp/config_logic.log
          grep -q "ALL .* PASSED" /tmp/config_logic.log

      - name: Build + run canary-wap auth-logic host test
        # Which failed-auth shapes feed the brute-force lockout. A
        # credential-less request must NOT count — counting it let one
        # open dashboard tab 429-lock the operator's correct token.
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror \
              -I firmware/projects/canary-wap/arduino/canary_wap \
              firmware/projects/canary-wap/tests_host/test_auth_logic.cpp \
              -o /tmp/auth_logic
          /tmp/auth_logic | tee /tmp/auth_logic.log
          grep -q "ALL .* PASSED" /tmp/auth_logic.log

      - name: Build + run canary-wap Bluetooth-defaults host test
        # The BLE pairing channel ships ENABLED by default (was disabled,
        # which read as a dead Bluetooth panel). This pins that the radio
        # is on out of the box AND that PIN confirmation stays required, so
        # "on by default" never regresses into "pairs silently".
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror \
              -I firmware/projects/canary-wap/arduino/canary_wap \
              firmware/projects/canary-wap/tests_host/test_bt_defaults.cpp \
              -o /tmp/bt_defaults
          /tmp/bt_defaults | tee /tmp/bt_defaults.log
          grep -q "ALL .* PASSED" /tmp/bt_defaults.log

      - name: Build + run canary-wap SD-mount logic host test
        # The decisions around the SD mount worker: the loop's periodic SD
        # check never attempts a mount in SAFE MODE (the old unconditional
        # remount re-ran a blocking SD.begin from loop() and crash-looped
        # safe mode via the 8s task watchdog), never piles onto an
        # in-flight attempt, and the caller's bounded wait is wrap-safe.
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror \
              -I firmware/projects/canary-wap/arduino/canary_wap \
              firmware/projects/canary-wap/tests_host/test_sd_mount_logic.cpp \
              -o /tmp/sd_mount_logic
          /tmp/sd_mount_logic | tee /tmp/sd_mount_logic.log
          grep -q "ALL .* PASSED" /tmp/sd_mount_logic.log

      - name: Build + run canary-wap peek-stream logic host test
        # The camera preview's reported numbers: stream uptime freezes at the
        # recorded end instead of collapsing to 0 (which zeroed the derived
        # throughput — "0 kbps" for a stream that just ran), avg kbps comes
        # from real byte totals with no divide-by-zero, and the MJPEG worker's
        # frame pacing clamps to a >=20ms floor (the yield that keeps the
        # WDT-subscribed IDLE tasks fed under the priority-3 stream task).
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror \
              -I firmware/projects/canary-wap/arduino/canary_wap \
              firmware/projects/canary-wap/tests_host/test_peek_stream_logic.cpp \
              -o /tmp/peek_stream_logic
          /tmp/peek_stream_logic | tee /tmp/peek_stream_logic.log
          grep -q "ALL .* PASSED" /tmp/peek_stream_logic.log

      - name: Build + run canary-wap vault logic host test
        # Sealed-snapshot vault decisions + on-disk format (vault_logic.h):
        # the fail-closed capture decision table (no key / no SD / no camera /
        # QR busy / worker busy / cooldown, incl. millis wrap), the byte-exact
        # 64-byte .svlt header against a golden hex fixture shared verbatim
        # with tools/test_unseal_snapshot.py, and the ring filename parser
        # that doubles as the download/delete traversal gate.
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror \
              -I firmware/projects/canary-wap/arduino/canary_wap \
              firmware/projects/canary-wap/tests_host/test_vault_logic.cpp \
              -o /tmp/vault_logic
          /tmp/vault_logic | tee /tmp/vault_logic.log
          grep -q "ALL .* PASSED" /tmp/vault_logic.log

      - name: Run sealed-snapshot unseal tool tests (crypto round-trip)
        # The python half of the vault (tools/unseal_snapshot.py): X25519 +
        # HKDF-SHA256 + ChaCha20-Poly1305 seal->unseal round-trip, wrong-key
        # and tampered-ciphertext/tag/header(AAD) negatives, and the same
        # golden header fixture as test_vault_logic.cpp so the byte layout
        # is pinned across both languages.
        run: |
          python3 -m pip install --quiet cryptography
          python3 tools/test_unseal_snapshot.py

      - name: Build + run canary-wap witness store logic host test
        # The /WITNESS/records.jsonl durable tier (witness_store.h): the
        # byte-exact NDJSON line against a golden fixture, tail recovery
        # (newest complete line wins; torn power-cut lines skipped; junk
        # lines can't shadow good ones), malformed-field and seq-overflow
        # rejection, the SD-wins reconciliation decision, and the
        # seq-binding tamper check (OpenSSL recompute of the chain hash —
        # libcrypto is preinstalled on ubuntu-latest).
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror -Wno-deprecated-declarations \
              -I firmware/projects/canary-wap/arduino/canary_wap \
              firmware/projects/canary-wap/tests_host/test_witness_store_logic.cpp \
              -lcrypto -o /tmp/witness_store_logic
          /tmp/witness_store_logic | tee /tmp/witness_store_logic.log
          grep -q "ALL .* PASSED" /tmp/witness_store_logic.log

      - name: Build + run canary-wap beacon audit recovery host test
        # The beacon-audit chain-head SD recovery guard
        # (beacon_audit_recover.h): only adopt the newest COMPLETE line's head
        # when the tail chain-links (each entry's prev == the previous entry's
        # head, or genesis for a first record). Torn power-cut tails, corrupt
        # or field-less lines, and unverifiable single fragments are refused so
        # a stale-NVS boot cannot silently redirect the append-only chain.
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror \
              -I firmware/projects/canary-wap/arduino/canary_wap \
              firmware/projects/canary-wap/tests_host/test_beacon_audit_recover.cpp \
              -o /tmp/beacon_audit_recover
          /tmp/beacon_audit_recover | tee /tmp/beacon_audit_recover.log
          grep -q "ALL .* PASSED" /tmp/beacon_audit_recover.log

      - name: Build + run canary-wap camera gate logic host test
        # Camera power management decisions (camera_gate_logic.h): the
        # peek-surface gate precedence (broken camera > thermal > battery
        # policy, each with honest user-facing copy) and the idle-standby
        # decision (never while streaming/QR/sealing; immediate on policy
        # deny; wrap-safe idle timer otherwise).
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror \
              -I firmware/projects/canary-wap/arduino/canary_wap \
              firmware/projects/canary-wap/tests_host/test_camera_gate_logic.cpp \
              -o /tmp/camera_gate_logic
          /tmp/camera_gate_logic | tee /tmp/camera_gate_logic.log
          grep -q "ALL .* PASSED" /tmp/camera_gate_logic.log

      - name: Build + run canary-wap health store logic host test
        # The /HEALTH per-boot jsonl format (health_store_logic.h): JSON
        # escaping of peer-influenced strings (quote/backslash/control
        # bytes, atomic truncation), the byte-exact line format, and the
        # boot filename scheme.
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror \
              -I firmware/projects/canary-wap/arduino/canary_wap \
              firmware/projects/canary-wap/tests_host/test_health_store_logic.cpp \
              -o /tmp/health_store_logic
          /tmp/health_store_logic | tee /tmp/health_store_logic.log
          grep -q "ALL .* PASSED" /tmp/health_store_logic.log

      - name: Build + run canary-wap power gate logic host test
        # Round-two power-policy gates (power_gate_logic.h): advisory
        # feature run/skip (CSI drain) and routine MQTT heartbeat cadence
        # stretch by power mode (life-safety and event publishes bypass;
        # overflow saturates rather than wraps).
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror \
              -I firmware/projects/canary-wap/arduino/canary_wap \
              firmware/projects/canary-wap/tests_host/test_power_gate_logic.cpp \
              -o /tmp/power_gate_logic
          /tmp/power_gate_logic | tee /tmp/power_gate_logic.log
          grep -q "ALL .* PASSED" /tmp/power_gate_logic.log

      - name: Run witness log verifier tests (offline chain + signatures)
        # tools/verify_witness_log.py — the off-device half of the
        # /WITNESS/records.jsonl durable tier: real Ed25519-signed chains
        # verify end-to-end; edited fields, wrong keys, re-signed lines,
        # and reordering all fail loudly; card-absent gaps and torn
        # power-cut tails are tolerated and reported.
        run: |
          python3 -m pip install --quiet cryptography
          python3 tools/test_verify_witness_log.py

      - name: Build + run canary-wap catch-all logic host test
        # Who owns the shared canary.local catch-all when several Canaries
        # share a LAN: the fingerprint-staggered claim window, the
        # detect-own-echo probe classification, and the IP tie-break whose
        # antisymmetry guarantees exactly one device keeps a double-claim
        # (both keeping = session-cookie-killing hostname flapping; both
        # withdrawing = canary.local goes dark).
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror \
              -I firmware/projects/canary-wap/arduino/canary_wap \
              firmware/projects/canary-wap/tests_host/test_catchall_logic.cpp \
              -o /tmp/catchall_logic
          /tmp/catchall_logic | tee /tmp/catchall_logic.log
          grep -q "ALL .* PASSED" /tmp/catchall_logic.log

      - name: Build + run pull-OTA engine logic host test
        # The OTA engine's pure-logic subset (semantic version compare,
        # anti-rollback update decision, URL transport policy, the
        # Ed25519 signed-message layout shared with ble_ota.cpp and
        # ota_release.py, hex parsing, and the plain-language UI string
        # coverage) compiles standalone under -DSECURACV_OTA_HOST_BUILD.
        run: |
          set -euo pipefail
          g++ -std=c++17 -DSECURACV_OTA_HOST_BUILD \
              -Wall -Wextra \
              firmware/common/ota/test_ota_logic.cpp \
              firmware/common/ota/src/securacv_ota.cpp \
              -I firmware/common/ota/src \
              -o /tmp/ota_logic
          /tmp/ota_logic | tee /tmp/ota_logic.log
          grep -q "ALL .* PASSED" /tmp/ota_logic.log

      - name: Build + run battery power-logic host test
        # The battery decision logic (SoC curve, charge-state
        # classification, cycle-fade health, runtime estimate) is pure
        # and shared by both firmware trees via power_logic.h. This
        # suite pins the false-state fixes from PR #762 — above all
        # that charging detection outranks the low/critical SoC bands,
        # so a depleted battery on USB can never deep-sleep a device
        # that is plugged in and charging.
        run: |
          set -euo pipefail
          g++ -std=c++17 -DCSI_TEST_HOST_BUILD \
              -Wall -Wextra \
              firmware/common/power/test_power_logic.cpp \
              -I firmware/common/power \
              -o /tmp/power_logic
          /tmp/power_logic | tee /tmp/power_logic.log
          grep -q "ALL .* PASSED" /tmp/power_logic.log

      - name: Run OTA release tool tests (signing + manifest round-trip)
        # ota_release.py is the single source of truth for the release
        # format (manifest schema v1 + Ed25519 signature over
        # size_LE32||sha256). These tests pin the wire format the
        # firmware-release workflow and both device engines rely on.
        run: |
          python3 -m pip install --quiet pytest cryptography
          python3 -m pytest firmware/scripts/test_ota_release.py -q

      - name: Check canary-wap route security (every route gated or allowlisted)
        # Static fail-closed guard: every HTTP route the sketch registers
        # must carry a credential gate (Bearer/session/pair-token/BOOT
        # gate) unless it is on the documented public allowlist. Catches a
        # new — or resurrected — endpoint slipping onto the unauthenticated
        # surface (three /api/ble routes once shipped ungated, hidden only
        # by the handler-table overflow).
        run: |
          python3 firmware/projects/canary-wap/tests_host/check_route_security.py

      - name: Check canary-wap handler-table budget (no silent route drops)
        # esp_http_server drops registrations past max_uri_handlers and the
        # sketch ignores the error, so an under-sized budget 404s whole API
        # families. This emulates the preprocessor for every shipped build
        # config and asserts total_handlers covers the registrations with
        # margin — the guard that keeps the settings panel's routes alive.
        run: |
          python3 firmware/projects/canary-wap/tests_host/check_route_budget.py

      - name: Build + run canary-wap project host tests
        # The canary-wap project keeps its own host-test Makefile (mesh
        # coexistence, chirp/beacon invariants, device signature, and the
        # captive-portal DNS response builder). Its `run` target builds and
        # runs every suite; each test exits non-zero on failure, so make's
        # exit code gates the job. Needs libcrypto for the beacon tamper
        # suite — preinstalled on ubuntu-latest.
        run: make -C firmware/projects/canary-wap/tests_host

      - name: Build + run firmware/common host tests
        # firmware/tests_host covers the shared common/ modules: the
        # canary-sense radar decoder + presence/vitals FSMs (built twice:
        # presence-only and -DCANARY_SENSE_VITALS=1), the device_signature
        # canonical-message builders, and the canonical witness-chain
        # construction (witness_chain.h byte layout + goldens shared with
        # tools/verify_witness_log.py). All with -Werror; each suite exits
        # non-zero on any failure.
        run: make -C firmware/tests_host

  microcopy-lint:
    name: Dashboard Microcopy Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run microcopy lint trio
        # Three sub-checks gate every PR that touches the dashboard:
        #
        #   (1) Plain-words audit — banned technical jargon (CSI, RSSI,
        #       NVS, threshold, preset, ...) must not appear in the COPY
        #       object or the HTML body of the headline dashboard.
        #
        #   (2) Tooltip coverage — every data-tip="key" attribute resolves
        #       to a defined entry in COPY.tooltips. Catches keys that
        #       get renamed without updating the bank (silent empty
        #       tooltips for the user — usability bug, not a crash, so
        #       easy to ship without this guard).
        #
        #   (3) Reading-grade FKGL — aggregate Flesch-Kincaid across the
        #       COPY corpus stays at or below 7th grade. The plan's
        #       target is 6th; one grade of slack absorbs noisy short
        #       strings.
        run: |
          chmod +x firmware/scripts/microcopy_lint.sh
          firmware/scripts/microcopy_lint.sh

  # ──────────────────────────────────────────────────────────────────
  # Fleet-link host tests (direct BLE presence beacon / GATT pull)
  #
  # The pure wire-format + fleet-model logic behind the broker-free
  # "fleet link" compiles standalone (no NimBLE/Arduino): fleet_beacon.h
  # on the WAP builds the exact 11-byte manufacturer blob the display's
  # beacon_parse.h decodes, and FleetModel::on_beacon ingests it. These
  # round-trip both sides so a future edit can't silently break the
  # contract. Mirrors the mesh-scout-host-tests job.
  # ──────────────────────────────────────────────────────────────────
  fleet-link-host-tests:
    name: Fleet-Link Host Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build + run canonical fleet-beacon builder host test
        # Round-trips the builder/parser from the CANONICAL header
        # (firmware/common/fleet_link/fleet_beacon.h) — the single source of
        # truth the canary PIO build includes directly. check_fleet_beacon_sync.sh
        # keeps the canary-wap copy byte-identical, so this run covers both.
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror \
              -I firmware/common/fleet_link \
              firmware/common/fleet_link/test_fleet_beacon.cpp \
              -o /tmp/canonical_fleet_beacon
          /tmp/canonical_fleet_beacon | tee /tmp/canonical_fleet_beacon.log
          grep -q "ALL PASS" /tmp/canonical_fleet_beacon.log

      - name: Build + run canonical fleet-beacon LAN-multicast transport test
        # The third band the beacon travels on (firmware/common/fleet_link/
        # fleet_beacon_udp.h): group/port/TTL contract plus the receive-side
        # accept predicate. Asserts that a datagram body and a BLE advert are
        # the SAME bytes parsed the SAME way — the property that lets three
        # transports share one witness with no per-band dialect — and that TTL
        # stays 1, which is a privacy promise rather than a tuning knob.
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror \
              -I firmware/common/fleet_link \
              firmware/common/fleet_link/test_fleet_beacon_udp.cpp \
              -o /tmp/canonical_fleet_beacon_udp
          /tmp/canonical_fleet_beacon_udp | tee /tmp/canonical_fleet_beacon_udp.log
          grep -q "All fleet_beacon_udp checks passed" /tmp/canonical_fleet_beacon_udp.log

      - name: Build + run canonical fleet-roster host test
        # The device-side roster (firmware/common/fleet_link/fleet_roster.h) — a
        # Canary's own view of the OTHER Canaries it hears. Single-source header,
        # included via -I by the canary / vision / sense firmwares; this exercises
        # note()/upsert/evict/expire/count/find from its one source of truth.
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror \
              -I firmware/common/fleet_link \
              firmware/common/fleet_link/test_fleet_roster.cpp \
              -o /tmp/canonical_fleet_roster
          /tmp/canonical_fleet_roster | tee /tmp/canonical_fleet_roster.log
          grep -q "ALL PASS" /tmp/canonical_fleet_roster.log

      - name: Build + run WAP fleet-beacon builder host test
        run: |
          set -euo pipefail
          make -C firmware/projects/canary-wap/tests_host test_fleet_beacon
          firmware/projects/canary-wap/tests_host/test_fleet_beacon

      - name: Build + run display beacon-parse + fleet-model host tests
        run: |
          set -euo pipefail
          make -C firmware/projects/canary-display/tests_host
