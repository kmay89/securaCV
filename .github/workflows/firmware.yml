name: Firmware Build

on:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'
  pull_request:
    branches: [main]
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-platformio:
    name: PlatformIO Build (Canary)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/canary

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
          key: ${{ runner.os }}-pio-canary-${{ hashFiles('firmware/canary/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-canary-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Build firmware (dev)
        run: |
          pio run -e dev
        env:
          PLATFORMIO_BUILD_FLAGS: -DVALIDATION_BUILD=1

      - name: Build firmware (release)
        run: |
          pio run -e release
        env:
          PLATFORMIO_BUILD_FLAGS: -DVALIDATION_BUILD=1

      - name: Check binary size
        run: |
          # Report binary size for tracking
          pio run -e release --target size || true
          # Fail if binary exceeds 3MB (leaves room for OTA partition)
          SIZE=$(stat -c%s .pio/build/release/firmware.bin 2>/dev/null || echo 0)
          if [ "$SIZE" -gt 3145728 ]; then
            echo "::error::Firmware binary exceeds 3MB ($SIZE bytes). Check partition table."
            exit 1
          fi
          echo "Firmware size: $SIZE bytes"

  build-arduino-cli:
    name: Arduino CLI Build (Canary WAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Configure Arduino CLI
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install libraries
        run: |
          arduino-cli lib install "Crypto"
          arduino-cli lib install "ArduinoJson"
          # NimBLE-Arduino (2.x) is REQUIRED for the FULL profile's BLE stack.
          # Without it the sketch's ble_config.h guard now errors instead of
          # silently shipping "BLE unavailable in this build" — installing it
          # here means BLE is actually compile-tested in CI.
          arduino-cli lib install "NimBLE-Arduino"

      - name: Compile firmware
        run: |
          # --libraries makes arduino-cli treat each subdir of firmware/common/
          # as a library root, so #include <csi_types.h> resolves to
          # firmware/common/csi/csi_types.h via library.properties.
          # NimBLE is installed above, so the FULL profile compiles the real
          # BLE stack (FEATURE_BLE=1) rather than the no-radio stub.
          arduino-cli compile \
            --fqbn esp32:esp32:XIAO_ESP32S3 \
            --libraries firmware/common \
            --build-property "build.extra_flags=-DVALIDATION_BUILD=1" \
            firmware/projects/canary-wap/arduino/canary_wap/canary_wap.ino

  csi-sketch-sync:
    name: CSI Sketch Copy Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify CSI library copies in canary-wap sketch dir match canonical source
        # The Arduino IDE only sees files inside the sketch folder and globally
        # installed libraries — so the CSI library is committed twice: once at
        # firmware/common/csi/src/ (canonical) and once next to the sketch so
        # GitHub zip downloads compile out of the box. This guard catches
        # drift in either direction.
        run: |
          chmod +x firmware/scripts/check_csi_sync.sh
          firmware/scripts/check_csi_sync.sh

      - name: Verify boot banner copies in canary-wap sketch dir match canonical source
        # Same committed-copy pattern as the CSI library: the boot banner lives
        # at firmware/common/boot/ (canonical) and is copied next to the sketch
        # so GitHub zip downloads compile out of the box without setup.sh. The
        # arduino-cli CI build above passes --libraries firmware/common, which
        # masks a missing sketch-local copy, so this guard catches the drift.
        run: |
          chmod +x firmware/scripts/check_boot_sync.sh
          firmware/scripts/check_boot_sync.sh

  regression-check:
    name: Regression Guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run regression checks
        run: |
          chmod +x firmware/scripts/regression_check.sh
          firmware/scripts/regression_check.sh

      - name: Verify LESSONS_LEARNED.md exists
        run: |
          if [ ! -f "firmware/LESSONS_LEARNED.md" ]; then
            echo "::error::firmware/LESSONS_LEARNED.md is missing!"
            exit 1
          fi
          LINES=$(wc -l < firmware/LESSONS_LEARNED.md)
          if [ "$LINES" -lt 10 ]; then
            echo "::error::LESSONS_LEARNED.md seems empty ($LINES lines)"
            exit 1
          fi
          echo "LESSONS_LEARNED.md: $LINES lines ✓"

  archive-guard:
    name: Archive Edit Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject edits under firmware/projects/_archive/
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          # Determine the base ref to diff against.
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            git fetch origin "${GITHUB_BASE_REF}" --depth=1
            BASE="origin/${GITHUB_BASE_REF}"
          else
            # Push event: compare against the previous commit on this ref.
            BASE="${GITHUB_SHA}^"
          fi

          CHANGED=$(git diff --name-only "$BASE"..."${GITHUB_SHA}" -- 'firmware/projects/_archive/' || true)
          if [ -z "$CHANGED" ]; then
            echo "No changes under firmware/projects/_archive/ — guard passes."
            exit 0
          fi

          echo "Detected changes under firmware/projects/_archive/:"
          echo "$CHANGED"

          # Permit only if an explicit opt-in marker is present in the PR
          # title/body or in at least one commit message in the range.
          MARKER='[archive-edit]'
          if echo "${PR_TITLE:-}" | grep -qF "$MARKER" \
             || echo "${PR_BODY:-}" | grep -qF "$MARKER" \
             || git log --format=%B "$BASE"..."${GITHUB_SHA}" | grep -qF "$MARKER"; then
            echo "Found '$MARKER' marker — archive edit allowed."
            exit 0
          fi

          echo "::error::Edits under firmware/projects/_archive/ are frozen."
          echo "::error::Add '[archive-edit]' to the PR title, body, or a commit message if this is an intentional backport."
          exit 1

  csi-invariants:
    name: CSI Privacy Invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build host invariants test
        # The fuzzer compiles standalone against the CSI library's portable
        # core (no ESP32 deps) and asserts the privacy contracts
        # documented in csi_event_invariants_test.cpp:
        #   1. Disallowed fields are zeroed at the chokepoint
        #   2. P1 events are blocked under a P0 ceiling
        #   3. P2 events never reach the witness chain
        #   4. Time fields are coarsened to the 10-min bucket
        #   5. Strings are ASCII-sanitized
        #   6. The bundler collapses 100 same-state emits to <= 2 commits
        #   7. The per-module hourly ceiling caps bursts
        #   8. The witness-chain payload includes kv= / rs= / zn= (spec §2)
        #   9. ble.events (spec §10) — MAC-precision fields stripped
        #  10. Quiet Hours hold non-anomaly events; one summary at close
        #  11. Anomaly events bypass the Quiet Hours gate
        #  12. core.multilink_fusion strips unauthorized fields (PR 3 + PR 6)
        #  13. ble.scout strips unauthorized fields (PR 5 + PR 6)
        #
        # If a future PR (or LLM coder) breaks any of these, this job
        # fails before the firmware build even starts.
        run: |
          set -euo pipefail
          # PR 6: link the real manifests for core.multilink_fusion (in
          # firmware/common/csi) and ble.scout (in the canary lib) so the
          # invariants test pins the actual allow-lists, not a synthetic
          # stand-in. mesh_crypto.cpp is brought in because ble_scan.cpp
          # uses sha256_domain; its CSI_TEST_HOST_BUILD path provides a
          # vendored SHA-256 so no Arduino/mbedtls dep is needed here.
          g++ -std=c++17 -DCSI_TEST_HOST_BUILD \
              -Wall -Wextra -Wno-unused-parameter \
              firmware/common/csi/csi_event_invariants_test.cpp \
              firmware/common/csi/src/csi_event.cpp \
              firmware/common/csi/src/csi_module.cpp \
              firmware/common/csi/src/csi_bundler.cpp \
              firmware/common/csi/src/csi_witness_payload.cpp \
              firmware/common/csi/src/ble_events_module.cpp \
              firmware/common/csi/src/meta_quiet_hours.cpp \
              firmware/common/csi/src/core_multilink_fusion.cpp \
              firmware/canary/lib/securacv_ble_scan/src/ble_scan.cpp \
              firmware/canary/lib/securacv_ble_scan/src/ble_scout.cpp \
              firmware/canary/lib/securacv_ble_scan/src/ble_scout_state.cpp \
              firmware/canary/lib/securacv_ble_scan/src/ble_scout_key.cpp \
              firmware/canary/lib/securacv_mesh/src/mesh_crypto.cpp \
              -I firmware/common/csi/src \
              -I firmware/canary/lib/securacv_ble_scan/src \
              -I firmware/canary/lib/securacv_mesh/src \
              -o /tmp/csi_invariants

      - name: Run host invariants test
        run: /tmp/csi_invariants

      - name: Build host witness round-trip test
        # Closes the plan's verification promise: "Every Event row
        # round-trips through log_verify with a valid signature and an
        # intact hash chain." The host build can't drive the device's
        # private key, but it CAN exercise the chokepoint contract:
        # every committed event reaches csi_event_commit_witness exactly
        # once, IDs are unique across the chain, and each record's
        # prev_hash points at the previous record's hash.
        run: |
          set -euo pipefail
          g++ -std=c++17 -DCSI_TEST_HOST_BUILD \
              -Wall -Wextra -Wno-unused-parameter \
              firmware/common/csi/csi_witness_roundtrip_test.cpp \
              firmware/common/csi/src/csi_event.cpp \
              firmware/common/csi/src/csi_module.cpp \
              firmware/common/csi/src/csi_bundler.cpp \
              -I firmware/common/csi/src \
              -o /tmp/csi_roundtrip

      - name: Run host witness round-trip test
        run: /tmp/csi_roundtrip

  # ──────────────────────────────────────────────────────────────────
  # Mesh + Scout host test suites
  #
  # Each securacv_mesh and securacv_ble_scan TU has a host-build test
  # that compiles standalone (no Arduino / mbedtls / NimBLE dep — every
  # device-only call is gated by CSI_TEST_HOST_BUILD with a vendored
  # fallback). Run them all on every PR so a future contributor can't
  # silently break wire-format encoding, pairing state machine, signed-
  # envelope verification, BLE Scout state-machine timing, or the
  # arrived/departed broadcast hook contract.
  #
  # New tests added to either lib should be appended to this list.
  # ──────────────────────────────────────────────────────────────────
  mesh-scout-host-tests:
    name: Mesh + Scout Host Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build + run all mesh + ble_scan host tests
        # Each test links the minimum source set it needs. ble_scout.cpp
        # pulls in csi_event/module/bundler (its emit_arrived flows
        # through the chokepoint), so suites that don't exercise the
        # Scout integration deliberately exclude it from their link
        # set — keeps each test's link surface honest. Every suite
        # ends with an "ALL ... PASSED" marker; the grep makes a
        # silent-pass failure mode visible.
        run: |
          set -euo pipefail
          mkdir -p /tmp/host_tests

          MESH_SRC=firmware/canary/lib/securacv_mesh/src
          BLE_SRC=firmware/canary/lib/securacv_ble_scan/src
          COMMON_SRC=firmware/common/csi/src
          CXXFLAGS="-std=c++17 -DCSI_TEST_HOST_BUILD -Wall -Wextra -Wno-unused-parameter"

          run_test() {
            local name=$1; shift
            g++ $CXXFLAGS "$@" -o /tmp/host_tests/test_$name
            /tmp/host_tests/test_$name | tee /tmp/host_tests/test_$name.log
            grep -q "ALL .* PASSED" /tmp/host_tests/test_$name.log
          }

          # securacv_mesh suites — 7 of them now (mesh_state added with
          # opera_secret NVS persistence). Each test links against
          # every mesh src TU so internal symbols resolve.
          for t in mesh_crypto mesh_envelope mesh_pairing mesh_session \
                   mesh_transport mesh_beacon mesh_state mesh_channel_hop \
                   mesh_hub_election; do
            run_test $t \
              firmware/canary/lib/securacv_mesh/test_${t}.cpp \
              $MESH_SRC/*.cpp \
              -I $MESH_SRC
          done

          # ble_scan + ble_scout_state — pure-logic, only link
          # ble_scan.cpp / ble_scout_state.cpp from the lib, plus
          # mesh_crypto.cpp for sha256_domain.
          run_test ble_scan \
            firmware/canary/lib/securacv_ble_scan/test_ble_scan.cpp \
            $BLE_SRC/ble_scan.cpp \
            $MESH_SRC/mesh_crypto.cpp \
            -I $BLE_SRC -I $MESH_SRC

          run_test ble_scout_state \
            firmware/canary/lib/securacv_ble_scan/test_ble_scout_state.cpp \
            $BLE_SRC/ble_scout_state.cpp \
            $BLE_SRC/ble_scan.cpp \
            $MESH_SRC/mesh_crypto.cpp \
            -I $BLE_SRC -I $MESH_SRC

          # ble_scout_broadcast exercises the chokepoint path inside
          # emit_arrived/departed, so it pulls in csi_event + module
          # + bundler + witness_payload from common/csi/src.
          run_test ble_scout_broadcast \
            firmware/canary/lib/securacv_ble_scan/test_ble_scout_broadcast.cpp \
            $BLE_SRC/ble_scan.cpp \
            $BLE_SRC/ble_scout.cpp \
            $BLE_SRC/ble_scout_state.cpp \
            $BLE_SRC/ble_scout_key.cpp \
            $MESH_SRC/mesh_crypto.cpp \
            $COMMON_SRC/csi_event.cpp \
            $COMMON_SRC/csi_module.cpp \
            $COMMON_SRC/csi_bundler.cpp \
            $COMMON_SRC/csi_witness_payload.cpp \
            -I $BLE_SRC -I $MESH_SRC -I $COMMON_SRC

  microcopy-lint:
    name: Dashboard Microcopy Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run microcopy lint trio
        # Three sub-checks gate every PR that touches the dashboard:
        #
        #   (1) Plain-words audit — banned technical jargon (CSI, RSSI,
        #       NVS, threshold, preset, ...) must not appear in the COPY
        #       object or the HTML body of the headline dashboard.
        #
        #   (2) Tooltip coverage — every data-tip="key" attribute resolves
        #       to a defined entry in COPY.tooltips. Catches keys that
        #       get renamed without updating the bank (silent empty
        #       tooltips for the user — usability bug, not a crash, so
        #       easy to ship without this guard).
        #
        #   (3) Reading-grade FKGL — aggregate Flesch-Kincaid across the
        #       COPY corpus stays at or below 7th grade. The plan's
        #       target is 6th; one grade of slack absorbs noisy short
        #       strings.
        run: |
          chmod +x firmware/scripts/microcopy_lint.sh
          firmware/scripts/microcopy_lint.sh
