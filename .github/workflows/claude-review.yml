name: Canary Reviewer

# An advisory Claude review on every PR. It reads the same house rules a human
# contributor must — CLAUDE.md, AGENTS.md, CONTRIBUTING.md, spec/invariants.md —
# and leaves ONE review comment. It never approves, requests changes, or merges:
# deterministic gates (rust.yml, lint.yml, features-dashboard-guard.yml, the
# fact-tests) decide correctness. Claude only surfaces judgment calls a regex
# can't — a missing invariant-impact statement, a smuggled tracking feature,
# voice drift ("flock", overclaimed "Verified"), an unjustified dependency.
#
# INTENDED STATE: ON for every same-repo PR. It needs the repo secret
# ANTHROPIC_API_KEY (Settings -> Secrets and variables -> Actions). Without it
# the job still runs, prints a warning, and exits green with the review step
# skipped, so a green check here does NOT mean a review happened: open the run
# and look for the "Canary Reviewer" step. As of 2026-09-22 the secret is not
# set, so no run has produced a review (run #1480 is a recent skip). Fork PRs
# never see secrets and always skip; Dependabot PRs see only Dependabot
# secrets, so add the key there too if bot PRs should be reviewed.
# Deterministic gates decide correctness either way.

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Read the code; write review comments. Nothing else.
permissions:
  contents: read
  pull-requests: write

# Supersede stale reviews when a new commit arrives on the same PR. This
# workflow only ever runs on pull_request, so the house condition (CI.md R3)
# is always true here — spelled the same way everywhere so a grep for a bare
# `cancel-in-progress: true` finds only the exemptions.
concurrency:
  group: canary-reviewer-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  review:
    name: Advisory Claude review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Fork PRs cannot see ANTHROPIC_API_KEY; don't fail them, just skip.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Advisory-only: if the key isn't configured yet, skip green instead of
      # failing the PR, but say so loudly (a warning annotation plus a job
      # summary) so a green check is never mistaken for a review. Add
      # ANTHROPIC_API_KEY in repo Settings → Secrets to turn the reviewer on.
      - name: Check for API key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANTHROPIC_API_KEY not set — skipping the advisory Canary Reviewer. Add it in Settings → Secrets to enable it."
            echo "### Canary Reviewer skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "ANTHROPIC_API_KEY is not set for this repository, so the advisory review did not run. Add it under Settings -> Secrets and variables -> Actions to turn it on." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Canary Reviewer
        if: steps.key.outputs.present == 'true'
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are the Canary Reviewer for SecuraCV. Review THIS pull request.

            Read the house rules first — they are the single source of truth,
            do not invent your own:
              - CLAUDE.md            (voice & naming; "fleet" never "flock")
              - AGENTS.md            (privacy invariants, dependency policy)
              - CONTRIBUTING.md      (what we accept / close without discussion)
              - spec/invariants.md   (invariants are law)

            You are ADVISORY ONLY. Do not approve, do not request changes, do
            not merge. Leave exactly one concise review comment. Deterministic
            CI already checks formatting, tests, and drift — don't repeat it.

            Flag only what needs a human's judgment:
              1. Non-trivial PR missing an invariant-impact / threat-model /
                 enforcement-point statement (CONTRIBUTING requires all three).
              2. Anything in the "closed without discussion" list — identity,
                 biometric, or tracking features; optional privacy flags; longer
                 retention; cross-bucket correlation; weakened isolation.
              3. Voice drift: "flock" anywhere but flock(2); "Verified" claimed
                 without an Ed25519 signature check against a pinned key.
              4. A new or changed dependency without justification per AGENTS.md.

            If the PR is clean, say so in one line. Be specific and kind. Never
            block; the maintainers decide.
