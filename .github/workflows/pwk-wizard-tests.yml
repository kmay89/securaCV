name: PWK Wizard Tests

# Scoped to the SecuraCV app (privacy_witness_kernel/) only. Runs the
# wizard server's unit tests (proxies, SSRF guards, the Frigate-aware
# preflight, the camera slug, the watchdog probe), the integration-carry
# tests (option G), the store-presentation checks (config.yaml,
# translations, apparmor.txt, Dockerfile, the s6 service tree, the carried
# integration's version), the wizard page's setup-flow and pairing-screen
# tests (node:test, no browser), shellcheck over the entry scripts and the
# s6 services, the run_lib unit tests and the kernel-config render check
# (which also covers the Docker sidecar's copy of the same heredoc), all on
# the app's jq 1.6 rather than the runner's 1.7 (sweep HA32). The
# custom_components/securacv tests are run separately by python.yml
# (ruff + mypy + pytest). Triggers on changes under privacy_witness_kernel/**
# and on the integration manifest (the carried version must equal the app's),
# so it stays off the firmware build path.

on:
  push:
    branches: [main]
    paths:
      - 'privacy_witness_kernel/**'
      - 'custom_components/securacv/manifest.json'
      - 'docs/blueprints/*.yaml'
      - '.github/workflows/pwk-wizard-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'privacy_witness_kernel/**'
      - 'custom_components/securacv/manifest.json'
      - 'docs/blueprints/*.yaml'
      - '.github/workflows/pwk-wizard-tests.yml'

# Read-only token: this workflow only checks out the repo and runs tests.
permissions:
  contents: read

concurrency:
  # PRs collapse per branch; each main commit gets its own group, so a burst
  # of merges can never evict the main run queued behind another (CI.md R3).
  group: pwk-wizard-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  # Cancel superseded PR runs only; pushes to main keep full signal
  # (same conditional-cancel pattern as rust.yml).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  wizard-tests:
    name: Wizard Proxy Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        # The app runs the panel (serve_wizard.py, integration_carry.py) on
        # the image's `apk add python3`, not on pyproject.toml's range. The
        # runtime base is ghcr.io/home-assistant/<arch>-base:3.18 (Alpine
        # 3.18), whose python3 is 3.11 (aports 3.18-stable). Test on what
        # ships; move this pin when the base tag moves in the Dockerfile.
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install pytest (and PyYAML for the store-presentation checks)
        # PyYAML is a TEST dependency only: the app itself parses the two YAML
        # files it reads (Frigate's config, a blueprint) with a stdlib scanner,
        # because the image has no PyYAML.
        run: pip install pytest pyyaml

      - name: Put the app's jq (1.6) first on PATH
        # The app runs discover_cameras.sh, run.sh and run_lib.sh on the
        # image's jq: Alpine 3.18's jq 1.6 (aports 3.18-stable builds the
        # unpatched 1.6 release source), while ubuntu-latest ships 1.7. So the
        # rest of this job runs on the jq-1.6 release binary, fetched by URL
        # and pinned by sha256 (the same digest from the jqlang and the older
        # stedolan release URL), and the pytest step's PWK_REQUIRE_JQ makes
        # the parity cases fail if they ever run on another jq (sweep HA32).
        # Move both when the base tag moves in the Dockerfile.
        env:
          JQ16_URL: https://github.com/jqlang/jq/releases/download/jq-1.6/jq-linux64
          JQ16_SHA256: af986793a515d500ab2d35f8d2aecd656e764504b789b66d7e1a0b727a124c44
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/jq-1.6"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/jq" "$JQ16_URL"
          echo "$JQ16_SHA256  $dir/jq" | sha256sum -c -
          chmod +x "$dir/jq"
          test "$("$dir/jq" --version)" = "jq-1.6"
          echo "$dir" >> "$GITHUB_PATH"

      - name: Run wizard, integration-carry and store-presentation tests
        env:
          CI: "true"
          # The version the parity cases must run on: the step above's jq.
          PWK_REQUIRE_JQ: jq-1.6
        run: pytest privacy_witness_kernel/tests/ -v

      # The carried integration's version must equal the app's: the image
      # refuses to build otherwise (Dockerfile carry stage) and
      # scripts/lint_version_sync.sh checks all four copies repo-wide; this
      # is the same fact where the app's tests run.
      - name: Carried integration version equals the app version
        run: |
          app=$(sed -n 's/^version: "\(.*\)"[[:space:]]*$/\1/p' privacy_witness_kernel/config.yaml | head -n1)
          carried=$(python3 -c 'import json,sys; print(json.load(open("custom_components/securacv/manifest.json"))["version"])')
          echo "app=${app} carried=${carried}"
          test -n "$app" && test "$app" = "$carried"

      - name: Set up Node
        # For the page tests below (node:test, no npm, no browser).
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # The setup wizard's decisions (wizard/index.html, the setup-flow
      # section), lifted out of the page and driven as pure functions: the
      # Frigate-aware path, the my-HA links, what the save sends (no device
      # key on a re-run), and the done screen's one action and copy.
      - name: Run the wizard page's setup-flow tests
        run: node --test privacy_witness_kernel/tests/test_wizard_setup_flow.test.js

      # The "Add another Canary" screens of wizard/index.html, lifted out of
      # the page and driven against a scripted proxy (F163): a pairing the
      # Canaries report paired, failed or replaced is said to be exactly
      # that, and a Canary that reports no pairing number is read the old way.
      - name: Run the wizard page's pairing tests
        run: node --test privacy_witness_kernel/tests/test_wizard_mesh_pairing.test.js

      - name: Shellcheck app scripts and s6 services
        # discover_cameras.sh is POSIX sh (#!/bin/sh, Alpine's busybox ash),
        # so it is checked as sh; its jq transform is held to the wizard's
        # Python reference by the pytest step above. The s6 run/finish
        # scripts are bash (with-contenv bashio).
        run: |
          shellcheck --shell=bash --exclude=SC1091 \
            privacy_witness_kernel/run.sh \
            privacy_witness_kernel/run_lib.sh \
            privacy_witness_kernel/tests/test_run_lib.sh \
            privacy_witness_kernel/tests/test_config_render.sh \
            privacy_witness_kernel/rootfs/etc/services.d/*/run \
            privacy_witness_kernel/rootfs/etc/services.d/*/finish
          shellcheck --shell=sh privacy_witness_kernel/discover_cameras.sh

      - name: Run run_lib tests
        run: bash privacy_witness_kernel/tests/test_run_lib.sh

      # Lifts the kernel config heredocs out of run.sh (and the sidecar's
      # entrypoint), renders them with bash and parses them with jq against
      # the key sets src/config.rs accepts — deny_unknown_fields makes a
      # typo there a boot crash that nothing else in this job would see.
      - name: Render and parse the kernel config blocks
        run: bash privacy_witness_kernel/tests/test_config_render.sh
