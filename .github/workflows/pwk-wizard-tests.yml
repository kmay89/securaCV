name: PWK Wizard Tests

# Scoped to the Privacy Witness Kernel add-on only. Runs the pairing-
# wizard proxy unit tests (PR-8), the wizard page's pairing-screen tests
# (F163) and dashboard id tests (HA16), shellcheck over the entry scripts, the run_lib unit tests and the
# kernel-config render check (which also covers the Docker sidecar's copy
# of the same heredoc). The
# custom_components/securacv tests are run separately by python.yml
# (ruff + mypy + pytest). Triggers only on changes under
# privacy_witness_kernel/** so it stays off the firmware build path.

on:
  push:
    branches: [main]
    paths:
      - 'privacy_witness_kernel/**'
      - '.github/workflows/pwk-wizard-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'privacy_witness_kernel/**'
      - '.github/workflows/pwk-wizard-tests.yml'

# Read-only token: this workflow only checks out the repo and runs tests.
permissions:
  contents: read

concurrency:
  # PRs collapse per branch; each main commit gets its own group, so a burst
  # of merges can never evict the main run queued behind another (CI.md R3).
  group: pwk-wizard-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  # Cancel superseded PR runs only; pushes to main keep full signal
  # (same conditional-cancel pattern as rust.yml).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  wizard-tests:
    name: Wizard Proxy Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        # The add-on runs this proxy (run.sh starts serve_wizard.py) on the
        # image's `apk add python3`, not on pyproject.toml's range. BUILD_FROM
        # is ghcr.io/hassio-addons/base:14.1.3, which that base builds from
        # alpine:3.18.3 (its base/build.yaml at v14.1.3), and Alpine 3.18's
        # python3 is 3.11 (aports 3.18-stable). Test on what ships; move this
        # pin when BUILD_FROM moves.
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install pytest
        run: pip install pytest

      - name: Run wizard tests
        run: pytest privacy_witness_kernel/tests/ -v

      - name: Set up Node
        # For the page test below (node:test, no npm, no browser).
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # The "Add another Canary" screens of wizard/index.html, lifted out of
      # the page and driven against a scripted proxy (F163): a pairing the
      # Canaries report paired, failed or replaced is said to be exactly
      # that, and a Canary that reports no pairing number is read the old way.
      - name: Run the wizard page's pairing tests
        run: node --test privacy_witness_kernel/tests/test_wizard_mesh_pairing.test.js

      # The Lovelace dashboard the status screen generates names each zone's
      # entities by the ids the kernel's MQTT bridge asks Home Assistant for
      # (HA16): the digest's "zone:" key prefix dropped, slugged as the
      # bridge slugs it. The test also reads the bridge's own Rust zone cases
      # from src/bin/event_mqtt_bridge.rs.
      - name: Run the wizard page's dashboard id tests
        run: node --test privacy_witness_kernel/tests/test_wizard_dashboard_ids.test.js

      - name: Shellcheck add-on scripts
        run: |
          shellcheck --shell=bash --exclude=SC1091 \
            privacy_witness_kernel/run.sh \
            privacy_witness_kernel/run_lib.sh \
            privacy_witness_kernel/tests/test_run_lib.sh \
            privacy_witness_kernel/tests/test_config_render.sh

      - name: Run run_lib tests
        run: bash privacy_witness_kernel/tests/test_run_lib.sh

      # Lifts the kernel config heredocs out of run.sh (and the sidecar's
      # entrypoint), renders them with bash and parses them with jq against
      # the key sets src/config.rs accepts — deny_unknown_fields makes a
      # typo there a boot crash that nothing else in this job would see.
      - name: Render and parse the kernel config blocks
        run: bash privacy_witness_kernel/tests/test_config_render.sh
