name: Secret Scanning

# Deliberately unfiltered: a secret can land in any file type, so every PR
# and every main push gets scanned.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: secrets-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: Detect committed secrets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@v3.95.5
        with:
          extra_args: --only-verified

      - name: Check for common secret patterns
        run: |
          FAIL=0

          # Check for private keys
          if grep -rn "BEGIN.*PRIVATE KEY" --include='*.rs' --include='*.js' --include='*.py' --include='*.h' --include='*.c' --include='*.toml' --include='*.yml' --include='*.yaml' . 2>/dev/null | grep -v '.example' | grep -v 'test' | grep -v '.git/'; then
            echo "::error::Potential private key found in source files"
            FAIL=1
          fi

          # Check for AWS keys
          if grep -rn 'AKIA[0-9A-Z]\{16\}' . --include='*.rs' --include='*.js' --include='*.py' --include='*.toml' 2>/dev/null | grep -v '.git/'; then
            echo "::error::Potential AWS access key found"
            FAIL=1
          fi

          # Check for high-entropy hex strings that look like tokens (64+ hex chars)
          if grep -rn '[0-9a-f]\{64,\}' --include='*.rs' --include='*.js' --include='*.py' --include='*.h' . 2>/dev/null | grep -v '.git/' | grep -v 'Cargo.lock' | grep -v 'package-lock.json' | grep -v 'test' | grep -v 'spec' | grep -v 'fixture'; then
            echo "::warning::Potential hardcoded token or key found (high-entropy hex string)"
          fi

          exit $FAIL
