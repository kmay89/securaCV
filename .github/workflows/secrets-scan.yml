name: Secret Scanning

# Deliberately unfiltered: a secret can land in any file type, so every PR
# and every main push gets scanned.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  # PRs collapse per branch; each main commit gets its own group, so a burst
  # of merges can never evict the main run queued behind another (CI.md R3).
  group: secrets-scan-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: Detect committed secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
        with:
          # verified + unknown: --only-verified drops every credential it
          # cannot validate live against a provider, which is every kind this
          # project has (OTA/Ed25519 release keys, minisign updater keys, MQTT
          # passwords, Wi-Fi PSKs). Unknown results still fail the step, so
          # the emulator dist's base64 wasm is excluded as a known source of
          # look-alike tokens (see the shape greps below).
          extra_args: --results=verified,unknown --exclude-paths=.github/trufflehog-exclude.txt

      - name: Check for common secret patterns
        run: |
          FAIL=0

          # Check for private keys. Exclusions are anchored to PATH COMPONENTS,
          # not bare substrings: the old `grep -v 'test'` dropped every path
          # containing the letters "test" — including anything under a
          # `latest`-named path — so a committed PEM in e.g. src/latest_*.rs
          # passed green. A private key has no business in a test file either, so
          # the 'test' filter is gone entirely here; only .example samples, the
          # .git dir, and the generated wasm dist/ are skipped.
          # No --include allowlist: the old one (.rs .js .py .h .c .toml .yml)
          # skipped .ino/.cpp (most of the firmware), .swift, .mjs, .json, .sh,
          # .md, .ini and .txt — a PEM in canary_wap.ino or a website generator
          # passed green. Binary files are skipped with -I; the excludes are
          # what keeps the noise down, not the file type.
          # The header must START the line (optionally indented or quoted, as
          # a key pasted into a string constant would be). Prose that mentions
          # the header mid-sentence — RELEASE_PROCESS.md, the key-ceremony
          # scripts' usage text, an awk pattern — is not a key, and the first
          # run of the widened grep failed on exactly those three.
          if grep -rnIE "^[[:space:]]*[\"'\`]?-----BEGIN[A-Z ]*PRIVATE KEY-----" . --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=target --exclude-dir=dist 2>/dev/null | grep -vE '\.example($|:)' | grep -v 'canary-local/emulator/dist/' | grep -vE '(^|/)secrets-scan\.yml:'; then
            echo "::error::Potential private key found in source files"
            FAIL=1
          fi

          # The secrets THIS project actually mints are not PEMs: a minisign
          # (Tauri updater) private key and an OTA release signing key. Both
          # have fixed headers; TruffleHog's --only-verified can never
          # "verify" them against a provider, so the grep is the only net.
          if grep -rnI "untrusted comment: .*minisign .*secret key\|untrusted comment: rsign .*secret key" . --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=target --exclude-dir=dist 2>/dev/null | grep -vE '\.example($|:)' | grep -vE '(^|/)secrets-scan\.yml:'; then
            echo "::error::Potential minisign/Tauri updater PRIVATE key found"
            FAIL=1
          fi

          # Check for AWS keys
          # canary-local/emulator/dist/ holds generated wasm bundles (base64
          # in minified JS): random runs match token shapes by chance
          # (a rebuilt bundle literally contained AKIA + 16 base64 chars).
          # TruffleHog above still scans them; only these shape-greps skip.
          if grep -rn 'AKIA[0-9A-Z]\{16\}' . --include='*.rs' --include='*.js' --include='*.py' --include='*.toml' 2>/dev/null | grep -v '.git/' | grep -v 'canary-local/emulator/dist/'; then
            echo "::error::Potential AWS access key found"
            FAIL=1
          fi

          # Check for high-entropy hex strings that look like tokens (64+ hex
          # chars). Test/spec/fixture exclusions are anchored to path COMPONENTS
          # (`(^|/)tests?/` etc.) so a bare-substring match can't blanket-skip an
          # unrelated path — e.g. `latest` contains "test", and `spec` matches
          # `respec`/`inspect`. Lockfiles and the generated wasm dist/ carry
          # legitimate long hex and stay excluded by name.
          if grep -rn '[0-9a-f]\{64,\}' --include='*.rs' --include='*.js' --include='*.py' --include='*.h' . 2>/dev/null | grep -vE '(^|/)\.git/' | grep -v 'Cargo.lock' | grep -v 'package-lock.json' | grep -vE '(^|/)tests?/' | grep -vE '(^|/)spec/' | grep -vE '(^|/)fixtures?/' | grep -v 'canary-local/emulator/dist/'; then
            echo "::warning::Potential hardcoded token or key found (high-entropy hex string)"
          fi

          # Signing-key CONTAINERS are binary, so none of the content greps
          # above can see inside a PKCS#12 or a keystore — and the release
          # docs (desktop/SIGNING.md, ios/DEMO.md) have maintainers export one
          # into the working directory. Catch them by name, whatever they hold.
          if git ls-files | grep -iE '\.(p12|pfx|keystore|jks|mobileprovision)$|(^|/)AuthKey_[A-Z0-9]+\.p8$'; then
            echo "::error::Committed signing-key container (.p12/.pfx/.keystore/.jks/.mobileprovision/AuthKey_*.p8)"
            FAIL=1
          fi

          exit $FAIL
