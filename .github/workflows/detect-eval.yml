name: Detect Eval

# Scoped to the eval harness inputs: the crate, the eval datasets, and the
# committed test ONNX fixture. Docs/firmware/HA changes don't re-run it.
on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'eval/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - '.github/workflows/detect-eval.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'eval/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - '.github/workflows/detect-eval.yml'

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: detect-eval-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only; the only output is an uploaded report artifact.
permissions:
  contents: read

jobs:
  perception-eval:
    name: Perception eval harness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install libseccomp
        run: sudo apt-get update && sudo apt-get install -y libseccomp-dev

      - name: Clippy (detect-eval)
        run: cargo clippy --features detect-eval --bin detect_eval --lib -- -D warnings

      - name: Metric unit tests (no feature)
        run: "cargo test --lib eval::"

      # Hermetic known-answer gate: runs the real eval runner against the deterministic
      # test ONNX. This is the numeric correctness check for the harness.
      - name: Known-answer integration test
        run: cargo test --features detect-eval --test detect_eval_integration -- --nocapture

      # End-to-end plumbing smoke + artifact. Uses the deterministic test model (no network,
      # no large model download). The toy model is NOT expected to score on the synthetic
      # frames — this step proves the binary runs end to end and emits a valid report. Real
      # measurement is an operator step with fetch_detection_model.sh (see eval/README.md).
      - name: Run harness on sample dataset
        run: |
          cargo run --features detect-eval --bin detect_eval -- \
            --model tests/fixtures/test_detector.onnx \
            --format postnms \
            --dataset eval/datasets/sample \
            --width 4 --height 4 \
            --json detect_eval_report.json

      - name: Upload eval report
        uses: actions/upload-artifact@v7
        with:
          name: detect-eval-report
          path: detect_eval_report.json
