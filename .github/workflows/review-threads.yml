name: Review Threads

# Surfaces "does this PR still have unresolved review threads?" as a visible,
# ADVISORY signal — a warning, never a merge blocker.
#
# Why advisory: a thread is often *addressed* (the fix pushed, a reply posted)
# a beat before — or without — anyone clicking the "Resolve" button. Hard-
# failing on that bookkeeping gap flashed the whole PR red for work that was
# actually done, and left PRs stuck not-green. So this check now lists the
# unresolved threads as warnings + a run summary and exits GREEN. For a HARD
# block, enable GitHub's native, correctly-timed gate:
#   Settings → Branches → main → "Require conversation resolution before merging"
# That rule blocks the merge button itself and clears the instant a thread is
# resolved — something a workflow can't observe (see the timing note below).
#
# Timing — "grade the response, not the pre-response state":
#   · The gate re-evaluates on a reply, a review, and a push — i.e. AFTER the
#     author acts on a thread, not on the reviewer's comment alone.
#   · Thread RESOLUTION emits no event Actions can hear (pull_request_review_
#     thread is a GitHub-App-only webhook, not a workflow trigger — actionlint
#     rejects it). A reply fires one beat BEFORE the human clicks resolve, so a
#     run triggered by that reply holds its verdict through a short grace window,
#     re-polling until the resolve lands, before it reports.
#   · Because the verdict is only a warning, an early evaluation can never
#     wrongly block a merge — it just annotates, and the next reply/push refreshes
#     it. Resolving WITHOUT a reply or push simply clears on the next run (or use
#     "Re-run"); it no longer strands the PR red in the meantime.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read

# One run per PR; only the latest state of the threads matters.
concurrency:
  group: review-threads-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unresolved-threads:
    name: All review comments addressed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Report unresolved review threads (advisory)
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            const query = `
              query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    reviewThreads(first: 100, after: $cursor) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        isResolved
                        isOutdated
                        path
                        comments(first: 1) {
                          nodes { author { login } body url }
                        }
                      }
                    }
                  }
                }
              }`;

            async function fetchUnresolved() {
              const unresolved = [];
              let cursor = null;
              do {
                const res = await github.graphql(query, { owner, repo, number, cursor });
                const threads = res.repository.pullRequest.reviewThreads;
                unresolved.push(...threads.nodes.filter(t => !t.isResolved));
                cursor = threads.pageInfo.hasNextPage ? threads.pageInfo.endCursor : null;
              } while (cursor);
              return unresolved;
            }

            let unresolved = await fetchUnresolved();

            // Reply-then-resolve grace: a reply/review event fires one beat
            // BEFORE the human clicks "resolve", and resolution itself emits no
            // event Actions can hear. So a run triggered by the reply would read
            // the stale in-between state. Hold the verdict and re-poll through a
            // short window until the resolve lands — this is what makes the check
            // reflect the state AFTER the response, not before. Push events skip
            // it (their state is already final; a fix-push re-runs this anyway).
            const graced = ['pull_request_review', 'pull_request_review_comment'];
            if (unresolved.length > 0 && graced.includes(context.eventName)) {
              for (let i = 0; i < 6 && unresolved.length > 0; i++) {
                core.info(`${unresolved.length} unresolved; grace poll ${i + 1}/6 in 20 s...`);
                await new Promise(r => setTimeout(r, 20000));
                unresolved = await fetchUnresolved();
              }
            }

            if (unresolved.length === 0) {
              core.info('All review threads are resolved.');
              return;
            }

            // ADVISORY: surface the unresolved threads, but keep the check GREEN.
            // This never blocks a merge — the fix-then-resolve gap is a
            // bookkeeping state, not a defect. Enable branch protection's
            // "Require conversation resolution before merging" if you want a hard
            // gate (GitHub clears it the instant a thread resolves).
            core.summary.addHeading(`${unresolved.length} unresolved review thread(s) — advisory`);
            const rows = [[
              { data: 'File', header: true },
              { data: 'From', header: true },
              { data: 'Comment', header: true },
            ]];
            // Table cells land in the step summary as raw HTML, and a review
            // comment is anyone's text — escape before it can close the anchor.
            const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
              .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            for (const t of unresolved) {
              const c = t.comments.nodes[0] ?? {};
              const author = c.author?.login ?? 'unknown';
              const preview = (c.body ?? '').split('\n')[0].slice(0, 120);
              const where = (t.path ?? '(PR-level)') + (t.isOutdated ? ' (outdated)' : '');
              core.warning(`unresolved review thread — ${where} — @${author}: ${preview} ${c.url ?? ''}`);
              const cell = c.url ? `<a href="${esc(c.url)}">${esc(preview)}</a>` : esc(preview);
              rows.push([esc(where), `@${esc(author)}`, cell]);
            }
            core.summary.addTable(rows);
            core.summary.addRaw(
              '\n\n_Advisory only — this check stays green._ Resolve each thread ' +
              '(reply, then click **Resolve**), or turn on branch protection\'s ' +
              '"Require conversation resolution before merging" for a hard gate.\n');
            await core.summary.write();
            core.notice(
              `${unresolved.length} review thread(s) still unresolved — advisory, ` +
              'not blocking merge. Resolve them (or enable branch protection\'s ' +
              'conversation-resolution rule for a hard gate).');
            // No core.setFailed: the job exits GREEN by design.
