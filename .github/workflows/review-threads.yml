name: Review Threads

# Makes "every review comment gets addressed" an explicit, visible check
# instead of a convention. The check fails while the PR has unresolved
# review threads and lists them (file, author, first line) in the job log
# and run summary.
#
# Re-evaluation triggers cover every way the answer can change: a review
# submitted/dismissed, a reply landing, a new push — and, crucially, a
# thread being RESOLVED or unresolved (pull_request_review_thread; an
# earlier revision believed Actions didn't expose it and told people to
# re-run the check by hand — that was the whole reason this gate sat
# permanently red). Resolving a thread now flips the check green on its
# own within seconds, no reply or manual re-run required.
#
# The reply-then-resolve race is also absorbed: a human replies first and
# clicks resolve a beat later, so a run triggered by the reply would see
# stale state and flash red. On reply/review triggers the run holds the
# verdict through a short grace window, re-polling; the resolve event
# then cancels it (concurrency below) and the fresh run reports truth.
#
# This mirrors GitHub's native "Require conversation resolution before
# merging" branch-protection rule; enable that rule too if you want GitHub
# itself to hard-block the merge button (Settings → Branches → main).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  pull_request_review_thread:
    types: [resolved, unresolved]

permissions:
  contents: read
  pull-requests: read

# One run per PR; only the latest state of the threads matters.
concurrency:
  group: review-threads-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unresolved-threads:
    name: All review comments addressed
    runs-on: ubuntu-latest
    steps:
      - name: Check for unresolved review threads
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            const query = `
              query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    reviewThreads(first: 100, after: $cursor) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        isResolved
                        isOutdated
                        path
                        comments(first: 1) {
                          nodes { author { login } body url }
                        }
                      }
                    }
                  }
                }
              }`;

            async function fetchUnresolved() {
              const unresolved = [];
              let cursor = null;
              do {
                const res = await github.graphql(query, { owner, repo, number, cursor });
                const threads = res.repository.pullRequest.reviewThreads;
                unresolved.push(...threads.nodes.filter(t => !t.isResolved));
                cursor = threads.pageInfo.hasNextPage ? threads.pageInfo.endCursor : null;
              } while (cursor);
              return unresolved;
            }

            let unresolved = await fetchUnresolved();

            // Reply-then-resolve grace: a reply/review event fires one beat
            // BEFORE the human clicks "resolve", so failing instantly would
            // flash red on threads that are being addressed right now. Hold
            // the verdict and re-poll briefly; if the resolve lands, its own
            // event cancels this run (concurrency) and reports fresh truth
            // anyway, so this loop is purely to avoid the false-red flash.
            // Push/thread events skip it — their state is already final.
            const graced = ['pull_request_review', 'pull_request_review_comment'];
            if (unresolved.length > 0 && graced.includes(context.eventName)) {
              for (let i = 0; i < 4 && unresolved.length > 0; i++) {
                core.info(`${unresolved.length} unresolved; grace poll ${i + 1}/4 in 20 s...`);
                await new Promise(r => setTimeout(r, 20000));
                unresolved = await fetchUnresolved();
              }
            }

            if (unresolved.length === 0) {
              core.info('All review threads are resolved.');
              return;
            }

            core.summary.addHeading(`${unresolved.length} unresolved review thread(s)`);
            const rows = [[
              { data: 'File', header: true },
              { data: 'From', header: true },
              { data: 'Comment', header: true },
            ]];
            for (const t of unresolved) {
              const c = t.comments.nodes[0] ?? {};
              const author = c.author?.login ?? 'unknown';
              const preview = (c.body ?? '').split('\n')[0].slice(0, 120);
              const where = (t.path ?? '(PR-level)') + (t.isOutdated ? ' (outdated)' : '');
              core.error(`unresolved thread — ${where} — @${author}: ${preview} ${c.url ?? ''}`);
              rows.push([where, `@${author}`, c.url ? `<a href="${c.url}">${preview}</a>` : preview]);
            }
            core.summary.addTable(rows);
            await core.summary.write();
            core.setFailed(
              `${unresolved.length} review thread(s) still unresolved. ` +
              'Reply in each thread and mark it resolved — resolving (or replying) ' +
              're-runs this check automatically.'
            );
