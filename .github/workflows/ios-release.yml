# iOS release — build a signed .ipa of the native SecuraCV companion.
#
# Mirrors desktop-mobile-release.yml exactly where it matters: manual dispatch
# ONLY (never blocks PR/CI), double-gated behind the ENABLE_IOS_BUILD repo
# variable (green no-op until set), and signs with an App Store Connect API key
# materialized from a base64 secret to a real .p8 on the runner ("a secret is a
# string, so the key must be a file"). Reuses the SAME Apple secret names as the
# desktop mobile pipeline so there is one signing story for the whole repo.
#
# House style honored (.github/CI.md): explicit permissions, timeout-minutes,
# and a concurrency group that never cancels a publishing run mid-flight.
name: iOS release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload to App Store Connect and tag the version (unchecked = build + export only)"
        type: boolean
        default: false
      export_method:
        description: "Signing destination (must be app-store-connect to publish)"
        type: choice
        options: [debugging, release-testing, app-store-connect]
        default: debugging
      critical_alerts:
        description: "Sign with the Apple-granted Critical Alerts entitlement (leave OFF until Apple approves the request — signing fails otherwise; the app falls back to time-sensitive alerts)"
        type: boolean
        default: false

# `contents: write` so a publishing run can create its `ios-v*` tag. Before
# this, the workflow only ever produced a build ARTIFACT — so the
# Update-everything button would report iOS as released while users got
# nothing, and, with no tag to see, would re-dispatch it on every press.
permissions:
  contents: write

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # macos-26: App Store Connect refuses binaries built with an SDK older
    # than iOS 26 (ITMS-90725, RELEASE_LESSONS 2026-07-28 (h)) — and the
    # rejection arrives by EMAIL after upload, with CI already green.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Gate notice
        if: vars.ENABLE_IOS_BUILD != 'true'
        run: |
          echo "::notice title=iOS release skipped::Set ENABLE_IOS_BUILD=true and the APPLE_* signing secrets to enable. Exiting green."

      - uses: actions/checkout@v7
        if: vars.ENABLE_IOS_BUILD == 'true'
        with:
          fetch-depth: 0   # tags, to refuse re-publishing a shipped version

      # Resolved once so every later step reads the same answer.
      - name: Resolve the release plan
        id: plan
        if: vars.ENABLE_IOS_BUILD == 'true'
        env:
          PUBLISH: ${{ inputs.publish }}
          EXPORT_METHOD: ${{ inputs.export_method }}
        run: |
          set -euo pipefail
          publish="${PUBLISH:-false}"
          version=""
          if [ "$publish" = "true" ]; then
            if [ "$EXPORT_METHOD" != "app-store-connect" ]; then
              echo "::error::publish needs export_method=app-store-connect (got '$EXPORT_METHOD')."
              exit 1
            fi
            version="$(sed -n 's/^ *MARKETING_VERSION: *"\{0,1\}\([0-9][0-9.]*\)"\{0,1\} *$/\1/p' ios/project.yml | head -1)"
            if [ -z "$version" ]; then
              echo "::error::could not read MARKETING_VERSION from ios/project.yml."
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/ios-v$version" >/dev/null; then
              echo "::error::ios-v$version is already tagged, so that version has already shipped."
              echo "Bump MARKETING_VERSION in ios/project.yml before publishing again."
              exit 1
            fi
          fi
          {
            echo "publish=$publish"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          echo "publish=$publish, version='${version:-(none)}'"

      - name: Select Xcode
        if: vars.ENABLE_IOS_BUILD == 'true'
        # Runner images name Xcode with full versions (Xcode_26.6.app…), so a
        # bare Xcode_26.app never matches (RELEASE_LESSONS 2026-07-28); pick
        # the newest 26.x, fall back to the image default, print what we got.
        # 26.x minimum: App Store Connect rejects anything built with an older
        # SDK (ITMS-90725, RELEASE_LESSONS 2026-07-28 (h)).
        run: |
          latest="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' 2>/dev/null | sort -V | tail -1)"
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version

      - name: Materialize App Store Connect API key
        if: vars.ENABLE_IOS_BUILD == 'true'
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          # A secret is a string; the .p8 must exist as a file for signing.
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey_${APPLE_API_KEY}.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_${APPLE_API_KEY}.p8" >> "$GITHUB_ENV"

      # Ephemeral runners cannot keep the private key of a per-run
      # cloud-created certificate, so the NEXT run finds the account's cert
      # with no local key and dies with "Revoke certificate: … private key is
      # not installed" (RELEASE_LESSONS 2026-07-28 (e)). A persistent identity
      # imported from the APPLE_CERTIFICATE secret (the same secret names the
      # desktop mobile pipeline documents in desktop-lab/MOBILE.md) makes
      # signing deterministic. Skipped when the secret is unset — signing then
      # falls back to per-run cloud certificates, which works only until the
      # first orphaned cert accumulates.
      - name: Import signing certificate
        # secrets.* is not readable in a step `if` (actionlint: context not
        # allowed) — route it through the step's own env instead.
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        if: vars.ENABLE_IOS_BUILD == 'true' && env.APPLE_CERTIFICATE != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/securacv-ci.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          echo "imported signing identities:"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Regenerate project
        if: vars.ENABLE_IOS_BUILD == 'true'
        working-directory: ios
        run: |
          eval "$(bash scripts/stamp_build.sh)"
          brew install xcodegen
          xcodegen generate

      - name: Archive
        if: vars.ENABLE_IOS_BUILD == 'true'
        working-directory: ios
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM || secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          CRITICAL_ALERTS: ${{ inputs.critical_alerts }}
          # `<run>.<attempt>`, because neither half is enough on its own:
          # run_number does NOT change when an operator uses "Re-run jobs", and
          # run_attempt resets to 1 on every fresh dispatch. Together they only
          # ever increase — 42.1 → 42.2 (a re-run) → 43.1 (a new dispatch) —
          # and a dotted CFBundleVersion is compared component by component.
          BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
          MARKETING_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          # NOTE: automatic signing archives with a DEVELOPMENT profile, and
          # Apple won't mint one for a team with ZERO registered devices —
          # the archive dies with "Your team has no devices". Register any
          # one device once (RELEASE_LESSONS 2026-07-28 (d)); overriding
          # CODE_SIGN_IDENTITY here instead hard-fails with "conflicting
          # provisioning settings".
          # Critical Alerts is granted per-app by Apple; until then, signing a
          # build that requests it fails for every team. The standard set
          # (Support/SecuraCV.dev.entitlements) drops only that one key — the
          # app already falls back to time-sensitive alerts. The override goes
          # through SECURACV_APP_ENTITLEMENTS (see project.yml) so the
          # widget/NSE targets keep their own entitlements.
          ENTITLEMENTS="Support/SecuraCV.entitlements"
          if [ "${CRITICAL_ALERTS:-false}" != "true" ]; then
            ENTITLEMENTS="Support/SecuraCV.dev.entitlements"
            echo "::notice title=Critical Alerts off::Signing without the Apple-granted Critical Alerts entitlement (flip the critical_alerts input once Apple approves it)."
          fi
          # THE BUILD NUMBER, WHICH project.yml CANNOT SUPPLY.
          #
          # `CURRENT_PROJECT_VERSION: "1"` is committed, so without this every
          # upload carried build 1 and App Store Connect — which identifies a
          # build by (marketing version, build number) — could only ever accept
          # ONE upload per version. There is no "build 2 of 0.5.2": the ordinary
          # TestFlight move of respinning the same version with a small fix was
          # impossible, and every retry, including one after a transient upload
          # failure, cost a marketing version bump.
          #
          # `<run_number>.<run_attempt>` rather than a commit count: the number
          # has to count ATTEMPTS, not content, because the respin case is
          # "same commit, upload again". A commit count emits the same value
          # twice and is rejected identically — it looks like a fix and isn't.
          #
          # And run_number alone is not enough either: GitHub's "Re-run jobs"
          # reuses the run, so run_number stays put and only run_attempt moves.
          # That is precisely the retry an operator reaches for when an upload
          # was accepted but a later step failed.
          #
          # Passed on the command line so it reaches EVERY target in the scheme
          # — the watch app and the widget extension must carry the same build
          # number as the host app or App Store validation rejects the bundle.
          echo "::notice title=Build number::${MARKETING_VERSION:-build-only} ($BUILD_NUMBER) — from workflow run #$BUILD_NUMBER"
          xcodebuild \
            -project SecuraCV.xcodeproj \
            -scheme SecuraCV \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SecuraCV.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_DEVELOPMENT_TEAM" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            SECURACV_APP_ENTITLEMENTS="$ENTITLEMENTS" \
            SECURACV_BUILD_REV="${SECURACV_BUILD_REV:-dev}" \
            SECURACV_FW_TRAIN="${SECURACV_FW_TRAIN:-0.x}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APPLE_API_KEY_PATH" \
            -authenticationKeyID "$APPLE_API_KEY" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER" \
            archive

      - name: Export .ipa
        if: vars.ENABLE_IOS_BUILD == 'true'
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM || secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          EXPORT_METHOD: ${{ inputs.export_method }}
        run: |
          # Build ExportOptions.plist with PlistBuddy — no fragile heredoc.
          PLIST="$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Clear dict" "$PLIST" 2>/dev/null || printf '%s' '{}' > "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :method string $EXPORT_METHOD" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_DEVELOPMENT_TEAM" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :signingStyle string automatic" "$PLIST"
          # Pin the export to the persistent identity the keychain already
          # holds. Without this, automatic-style export asks Apple for a
          # CLOUD-MANAGED distribution certificate, which needs an Admin-role
          # API key — an App Manager key dies with "Cloud signing permission
          # error" even though a valid local cert is installed. `debugging`
          # is a development-method export, so it pins the development cert.
          if [ "$EXPORT_METHOD" = "debugging" ]; then
            /usr/libexec/PlistBuddy -c "Add :signingCertificate string Apple Development" "$PLIST"
          else
            /usr/libexec/PlistBuddy -c "Add :signingCertificate string Apple Distribution" "$PLIST"
          fi

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SecuraCV.xcarchive" \
            -exportOptionsPlist "$PLIST" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APPLE_API_KEY_PATH" \
            -authenticationKeyID "$APPLE_API_KEY" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER"

      # Prove the .ipa exists rather than letting a later glob fail obscurely
      # (RELEASE_LESSONS Principle 4).
      - name: Locate the exported .ipa
        id: ipa
        if: vars.ENABLE_IOS_BUILD == 'true'
        run: |
          set -euo pipefail
          ipa="$(find "$RUNNER_TEMP/export" -name '*.ipa' -type f | head -1)"
          if [ -z "$ipa" ] || [ ! -s "$ipa" ]; then
            echo "::error::the export step produced no .ipa in $RUNNER_TEMP/export."
            find "$RUNNER_TEMP/export" -maxdepth 2 -print || true
            exit 1
          fi
          echo "path=$ipa" >> "$GITHUB_OUTPUT"
          echo "exported: $ipa ($(wc -c < "$ipa" | tr -d ' ') bytes)"

      # The watch app ships INSIDE this .ipa (Embed Watch Content). A broken
      # embed would publish an iPhone-only app under the same version with
      # nothing red anywhere — so prove the payload where it's bundled
      # (RELEASE_LESSONS Principle 4), before validate/upload spend minutes.
      - name: Prove the watch app is inside the .ipa
        if: vars.ENABLE_IOS_BUILD == 'true'
        env:
          IPA: ${{ steps.ipa.outputs.path }}
        run: |
          set -euo pipefail
          listing="$(unzip -l "$IPA")"
          for needle in \
            "Payload/SecuraCV.app/Watch/SecuraCVWatch.app/" \
            "Payload/SecuraCV.app/Watch/SecuraCVWatch.app/PlugIns/SecuraCVWatchWidgets.appex/"; do
            if ! grep -qF "$needle" <<<"$listing"; then
              echo "::error::$needle is missing from the exported .ipa — the watch app did not embed."
              exit 1
            fi
          done
          echo "watch app + complications present in the .ipa"

      # The actual publish. Shared with the Apple TV target so the validate +
      # retry policy can't drift between them.
      - name: Upload to App Store Connect
        if: vars.ENABLE_IOS_BUILD == 'true' && steps.plan.outputs.publish == 'true'
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: bash .github/scripts/asc_publish.sh "${{ steps.ipa.outputs.path }}" ios

      # Tag only after the upload succeeded — the tag is this repo's record
      # that a version shipped, so it must not exist for a build that didn't.
      - name: Tag the published version
        if: vars.ENABLE_IOS_BUILD == 'true' && steps.plan.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "ios-v$VERSION" -m "SecuraCV companion $VERSION (uploaded to App Store Connect)"
          git push origin "ios-v$VERSION"
          echo "::notice::Tagged ios-v$VERSION — the Update-everything button now sees this version as shipped."

      - name: Upload .ipa
        if: vars.ENABLE_IOS_BUILD == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: SecuraCV-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: warn
