name: Docker sidecar

# Build, test, and publish the standalone Frigate sidecar image
# (docker/sidecar/). The e2e job runs the REAL image against a live
# mosquitto container and asserts the quickstart's promises: only
# FRIGATE_MQTT_HOST is set, the device key is auto-generated, the API
# answers on the published port by default, Frigate's own message shapes
# (0.13 → 0.17, events and reviews, every identity field a sentinel) land
# in the sealed log with no identity anywhere, log_verify passes
# in-container, the kernel-signed announce is retained and carries no
# host/code/token/seed, the pairing ceremony holds its posture (constant
# 401, five-guess burn, single use, revocation), state reads add no
# receipts, `doctor` passes on a fresh install, and a clean stop clears the
# announce.
#
# - On pull requests: lint + fixture validation + compose validation +
#   build + e2e, no push.
# - On push to main / version tags: additionally push to GHCR as
#   ghcr.io/<owner>/securacv-sidecar.

on:
  pull_request:
    paths:
      - "docker/sidecar/**"
      - "integrations/ha_frigate_mqtt/docker-compose.yml"
      - "integrations/ha_frigate_mqtt/up.sh"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/docker-sidecar.yml"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "docker/sidecar/**"
      - "integrations/ha_frigate_mqtt/docker-compose.yml"
      - "integrations/ha_frigate_mqtt/up.sh"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/docker-sidecar.yml"

permissions:
  contents: read
  packages: write

# Cancel superseded PR runs only. Main/tag runs publish to GHCR; canceling
# one mid-push could leave :latest and :<version> pointing at different
# builds, so those queue instead.
concurrency:
  group: docker-sidecar-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint scripts, fixtures and compose files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Shellcheck sidecar scripts
        run: |
          shellcheck --shell=bash \
            docker/sidecar/entrypoint.sh \
            docker/sidecar/ci_e2e.sh \
            docker/sidecar/verify_published_image.sh \
            integrations/ha_frigate_mqtt/up.sh

      # The sidecar writes the kernel's config from a heredoc that the kernel
      # parses with deny_unknown_fields; this renders and parses it (and
      # checks the fleet-peers wiring between witness_api and the bridge)
      # without building the image. The test lives with the add-on, which
      # has the same two seams, and covers both scripts in one run.
      - name: Render and parse the sidecar's kernel config
        run: bash privacy_witness_kernel/tests/test_config_render.sh

      # The replay fixtures are the e2e's identity-leak oracle: each must be
      # JSON, and each must carry at least one sentinel, or a fixture that
      # lost its sentinels would make the sweep pass vacuously.
      - name: Validate the Frigate replay fixtures
        run: |
          set -euo pipefail
          for f in docker/sidecar/fixtures/frigate/*.json; do
            jq -e . "$f" > /dev/null
            n=$(jq -r '.. | strings | select(startswith("SENTINEL_"))' "$f" | wc -l)
            [ "$n" -gt 0 ] || { echo "$f carries no SENTINEL_ string" >&2; exit 1; }
            echo "$f: $n sentinel strings"
          done

      - name: Validate compose files
        env:
          # Required-variable placeholder: the integrations compose marks the
          # broker password as mandatory (:?), which `config` also enforces.
          SECURACV_MQTT_PASSWORD: ci-validate-only
        run: |
          docker compose -f docker/sidecar/quickstart.compose.yml config -q
          docker compose -f docker/sidecar/quickstart-with-broker.compose.yml config -q
          docker compose -f integrations/ha_frigate_mqtt/docker-compose.yml config -q
          # The quickstarts publish the API port from the first start (the
          # Home Assistant pairing path) and say what that opens.
          for f in docker/sidecar/quickstart.compose.yml docker/sidecar/quickstart-with-broker.compose.yml; do
            docker compose -f "$f" config | grep -q 'published: "8799"' || { echo "$f does not publish 8799" >&2; exit 1; }
            grep -q 'POST /api/pair' "$f" || { echo "$f does not explain what the published port opens" >&2; exit 1; }
            grep -q 'docker exec securacv pair' "$f" || { echo "$f does not name the pairing command" >&2; exit 1; }
          done

  e2e:
    name: Build and e2e test
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Run sidecar e2e
        # Every step must run on the merged tree: a step the script would
        # skip on a partial tree (no pairing endpoint, no tolerant parser)
        # is a failure here.
        env:
          CI_E2E_REQUIRE_ALL: "1"
        run: docker/sidecar/ci_e2e.sh securacv-sidecar:ci

  publish:
    name: Publish to GHCR
    needs: e2e
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Resolve image name and version
        id: meta
        run: |
          version=$(grep -E '^version:' privacy_witness_kernel/config.yaml | head -1 | sed -E 's/version:[[:space:]]*//; s/"//g' | tr -d "'")
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${owner}/securacv-sidecar" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/sidecar/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          cache-from: type=gha,scope=sidecar
          cache-to: type=gha,scope=sidecar,mode=max
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest

  verify-public:
    # After publishing, confirm the package is anonymously pullable and the
    # multi-arch index carries every claimed platform — exactly what a fresh
    # user's `docker compose up` sees. A green publish does NOT guarantee
    # this: a newly created GHCR package is private until its visibility is
    # flipped (one-time, owner-only), and a partial push can drop an arch.
    # Mirrors the add-on's `Verify publicly installable` gate.
    name: Verify publicly installable
    needs: publish
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Verify published image is publicly pullable
        run: docker/sidecar/verify_published_image.sh
