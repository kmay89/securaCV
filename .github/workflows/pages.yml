# Publish the canary.local pages (device guide + chooser + enclosure lab)
# to GitHub Pages on every main push that touches them.
#
# Where this lives, by design:
#   repo            = source of truth (works from a checkout, offline)
#   GitHub Pages    = the free live URL this workflow maintains
#   securacv.com    = adoption path: point a custom domain at Pages
#                     (Settings → Pages → Custom domain), or copy the
#                     built site folder onto any static host — the pages
#                     are self-contained and fetch nothing external. That
#                     includes the flasher's firmware: the releases it pins
#                     are mirrored into the site below, because a browser
#                     cannot read a github.com release asset at all.
#
# Besides main pushes, the release workflows dispatch this one after they
# publish (firmware-release.yml, flasher-release.yml, vision-model-release.yml):
# a release CI publishes with the GITHUB_TOKEN fires no event, and the push
# deploy that merged a version bump ran before its release existed.
#
# One-time setup: a repo admin must enable Pages once — Settings → Pages
# → Source → "GitHub Actions" (github.com/kmay89/securaCV/settings/pages).
# The Actions token cannot create the site itself (site creation needs
# admin; the API answers "Resource not accessible by integration").
# After that click, the configure-pages step below verifies the site on
# every run — and would self-enable if the token ever gains the right.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "canary-local/**"
      - "docs/hardware/enclosure/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04  # pinned ahead of the 26.04 image move; revisit before 24.04 retires
    # ~80 MB of release assets now ride every deploy (the mirror step below);
    # a healthy run is a few minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: pyproject.toml
      - name: "Pages enabled? (one-time fix: Settings → Pages → Source = GitHub Actions)"
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Regenerate enclosure catalog (drift-checked in canary-local CI)
        run: python3 canary-local/tools/gen_enclosures.py
      - name: Assemble site
        run: |
          mkdir -p _site/docs/hardware
          cp -rL canary-local _site/canary-local  # -L: dereference symlinks (RELEASE_LESSONS principle 1, same as desktop-lab/scripts/stage-frontend.mjs)
          # The page-logic tests (68 files incl. Playwright probes) are not
          # site content; tools/ stays because the Lab pages link their own
          # generators as "source" links.
          rm -rf _site/canary-local/tests
          rm -rf _site/canary-local/emulator/third_party _site/canary-local/emulator/.build
          # The Python generators and shell scripts under tools/ (and the
          # emulator's build.sh) are repo tooling, not site content: no page
          # loads a .py or .sh (the Lab's "source" links are to the .mjs
          # helpers and to GitHub), so publishing them only put the hub
          # host-provision script and two dozen generators on a public URL.
          find _site/canary-local -type f \( -name '*.py' -o -name '*.sh' \) -delete
          cp -rL docs/hardware/enclosure _site/docs/hardware/enclosure
          # front door: / → the guide
          cat > _site/index.html <<'EOF'
          <!DOCTYPE html><meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=canary-local/">
          <title>canary.local</title>
          <a href="canary-local/">canary.local — meet your Canary</a>
          EOF
      # The browser flasher (canary-local/flash.html) cannot fetch a GitHub
      # release: github.com answers /releases/download/ with a redirect that
      # carries no Access-Control-Allow-Origin, and the asset host behind it
      # sends none either, so the browser refuses every manifest and image
      # (.github/RELEASE_LESSONS.md, 2026-10-27). So the releases the page pins
      # are copied into the site and served from its own origin, at
      # canary-local/firmware/<tag>/<file>, the only place flash-core.js reads
      # them: flash.json's manifest_url (an exact fw-v* tag), the Vision model's
      # manifest (we2_module.manifest_url), the dev channel's rolling
      # fw-dev-latest manifest (flash-core.js DEV_FLASH_MANIFEST_URL), and
      # every file each manifest lists. Manifests are copied byte for byte (the
      # page checks the Ed25519 image signatures they carry, as published); each
      # image is held to its manifest's SHA-256 and size here, and a channel is
      # published whole or not at all. A release that does not exist yet (this
      # push deploy runs BEFORE firmware-release.yml cuts the tag a version
      # bump names), or one mid-upload, is skipped with a ::warning:: and the
      # deploy goes on; the page then says this site's copy of that release is
      # not available, which is true until the publishing workflow dispatches
      # this one again. A transport failure
      # that outlasts the retries fails the run, which keeps the last good
      # site and its mirror live. The desktop apps fetch natively and never
      # read this copy.
      - name: Mirror the pinned firmware releases into the site (same origin)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 canary-local/tools/mirror_release.py --site _site/canary-local
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-24.04  # pinned ahead of the 26.04 image move; revisit before 24.04 retires
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
