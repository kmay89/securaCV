# Publish the canary.local pages (device guide + chooser + enclosure lab)
# to GitHub Pages on every main push that touches them.
#
# Where this lives, by design:
#   repo            = source of truth (works from a checkout, offline)
#   GitHub Pages    = the free live URL this workflow maintains
#   securacv.com    = adoption path: point a custom domain at Pages
#                     (Settings → Pages → Custom domain), or copy the
#                     built site folder onto any static host — the pages
#                     are self-contained and fetch nothing external.
#
# One-time setup: a repo admin must enable Pages once — Settings → Pages
# → Source → "GitHub Actions" (github.com/kmay89/securaCV/settings/pages).
# The Actions token cannot create the site itself (site creation needs
# admin; the API answers "Resource not accessible by integration").
# After that click, the configure-pages step below verifies the site on
# every run — and would self-enable if the token ever gains the right.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "canary-local/**"
      - "docs/hardware/enclosure/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: "Pages enabled? (one-time fix: Settings → Pages → Source = GitHub Actions)"
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Regenerate enclosure catalog (drift-checked in canary-local CI)
        run: python3 canary-local/tools/gen_enclosures.py
      - name: Assemble site
        run: |
          mkdir -p _site/docs/hardware
          cp -rL canary-local _site/canary-local  # -L: dereference symlinks (RELEASE_LESSONS principle 1, same as desktop-lab/scripts/stage-frontend.mjs)
          # The page-logic tests (68 files incl. Playwright probes) are not
          # site content; tools/ stays because the Lab pages link their own
          # generators as "source" links.
          rm -rf _site/canary-local/tests
          rm -rf _site/canary-local/emulator/third_party _site/canary-local/emulator/.build
          cp -rL docs/hardware/enclosure _site/docs/hardware/enclosure
          # front door: / → the guide
          cat > _site/index.html <<'EOF'
          <!DOCTYPE html><meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=canary-local/">
          <title>canary.local</title>
          <a href="canary-local/">canary.local — meet your Canary</a>
          EOF
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
