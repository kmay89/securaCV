# Vision Model Asset — the pinned brain for the browser module-flasher.
#
# Builds the Grove Vision AI V2 person-detection model asset +
# manifest-vision-model.json for an fw-v* release and attaches them, exactly
# the way the firmware images are handled: SHA-256 in the manifest AND an
# Ed25519 release signature over uint32_le(size) || sha256(asset), made with
# the same OTA release key the firmware channel pins (flash.json
# release_pubkey). The flasher fails closed: once a real key is pinned, an
# unsigned model manifest is refused (docs/browser_flasher.md § Trust model).
#
# Anti-rot: this fires AUTOMATICALLY on every published release, so the
# flasher's `releases/latest/download/manifest-vision-model.json` never 404s
# for a fresh release — the model rides the firmware train without anyone
# remembering to press a button. workflow_dispatch stays for rebuilds /
# pre-key publishing (attach to an existing tag on demand).
#
# Provenance & license: the source model is Seeed's SSCMA model zoo
# "Person Detection (Swift-YOLO 192)" — MIT licensed, redistributable with
# attribution (https://github.com/Seeed-Studio/sscma-model-zoo). We fetch
# the INT8 TFLite, compile it for the module's Ethos-U55 NPU with Arm's
# ethos-u-vela (the same compiler Seeed's deployment guide uses), and pin
# the result to the release so the flasher can say exactly what it burns.
# If Seeed publishes a ready Vela artifact, it is preferred over compiling.
#
# The burn address is NOT written here — it is read from the committed
# canary-local/devices/flash.json (which gen_flash.py sources from
# assets/we2-core.js, the engine that actually does the burning), so the
# manifest can never promise an address the flasher won't use.

name: Vision Model Asset

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing fw-v* release tag to attach the model asset to (e.g. fw-v2.3.0)"
        required: true
        type: string

permissions:
  contents: write

# One asset build per target tag; never cancel mid-upload. A release event
# and a manual dispatch for the same tag queue instead of racing.
concurrency:
  group: vision-model-${{ inputs.tag || github.event.release.tag_name || github.run_id }}
  cancel-in-progress: false

env:
  ZOO_BASE: https://files.seeedstudio.com/sscma/model_zoo/detection/person
  MODEL_STEM: person_detection_int8
  # sha256 of the source model at $ZOO_BASE/$MODEL_STEM.tflite. The compiled
  # output is signed with the OTA release key and the browser flasher trusts
  # that signature, so the input must be bytes we chose — not whatever the CDN
  # serves on release day. REQUIRED: an empty pin fails the run and prints the
  # hash the CDN served, so a re-pin is done with the bytes in hand.
  #
  # This value is what the zoo served on 2026-09-05 (835,856 bytes; run
  # 33933211659 on this repo printed it) — a first-use pin, since Seeed
  # publishes no digest to check it against. From here on the check is the
  # guarantee: any change to the served bytes fails the release loudly
  # instead of being signed. Recompute deliberately when MODEL_STEM changes,
  # and only after reading why the bytes moved:
  #   curl -fsSL "$ZOO_BASE/$MODEL_STEM.tflite" | sha256sum
  MODEL_INT8_SHA256: "4bb86d233a2e5765e138972c2698cce46c27be0c076c94c81799ffb5f373b108"
  # The compiler on the signing path, pinned so a release is compiled by a
  # vela we chose on purpose. Bump deliberately, together with the model pin.
  VELA_VERSION: "5.2.0"

jobs:
  model-asset:
    name: Build + attach the pinned person-detection model
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve the target tag
        id: tag
        env:
          # workflow_dispatch supplies inputs.tag; a release event supplies
          # the tag name. A non-fw-v* release (should there ever be one) is
          # skipped, not failed, so this trigger never blocks other releases.
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          case "$TAG" in
            fw-v*) ;;
            *)
              if [ "${{ github.event_name }}" = "release" ]; then
                echo "::notice::release '$TAG' is not an fw-v* tag — skipping model asset"
                echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0
              fi
              echo "::error::expected a fw-v* tag, got '$TAG'"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#fw-v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.tag.outputs.skip != '1'

      - uses: actions/setup-python@v7
        if: steps.tag.outputs.skip != '1'
        with:
          python-version: "3.11"

      - name: Read the burn address from the committed catalog (single source)
        id: flashaddr
        if: steps.tag.outputs.skip != '1'
        run: |
          # flash.json ← gen_flash.py ← assets/we2-core.js (the engine that
          # actually writes the flash). One source; the manifest can't disagree.
          ADDR=$(python3 -c "import json;print(json.load(open('canary-local/devices/flash.json'))['we2_module']['model_addr'])")
          case "$ADDR" in 0x*) ;; *) echo "::error::flash.json we2_module.model_addr not a 0x address: '$ADDR'"; exit 1 ;; esac
          echo "flash_addr=$ADDR" >> "$GITHUB_OUTPUT"
          echo "burn address (from flash.json ← we2-core.js): $ADDR"

      - name: Fetch the source model (MIT — Seeed SSCMA model zoo)
        if: steps.tag.outputs.skip != '1'
        run: |
          mkdir -p /tmp/model
          cd /tmp/model
          # Always the SSCMA Swift-YOLO 192 INT8 person model — the one the
          # canary-vision firmware's output decoding expects. (Himax ships a
          # pre-compiled vela person model too, but it's a DIFFERENT network
          # with a different I/O layout, so we never substitute it.)
          curl -fsSL -o model_int8.tflite "$ZOO_BASE/${MODEL_STEM}.tflite"
          ls -la
          # Refuse to carry unverified bytes toward the release key (see
          # MODEL_INT8_SHA256 above). A missing pin is the loud failure, with
          # the served hash in the message, so pinning is done with the bytes
          # in hand rather than by accident of what was up that day.
          actual=$(sha256sum model_int8.tflite | cut -d' ' -f1)
          if [ -z "${MODEL_INT8_SHA256}" ]; then
            echo "::error::MODEL_INT8_SHA256 is not pinned — refusing to sign an unverified download. The CDN served sha256 ${actual}; verify it against Seeed's published model, then pin it in this workflow's env."
            exit 1
          fi
          if [ "${actual}" != "${MODEL_INT8_SHA256}" ]; then
            echo "::error::model_int8.tflite sha256 mismatch (served ${actual}, pinned ${MODEL_INT8_SHA256}) — refusing to sign an unverified download"
            exit 1
          fi
          echo "source model sha256 verified: ${actual}"

      - name: Compile for the Ethos-U55 (ethos-u-vela · Himax config, mandatory)
        if: steps.tag.outputs.skip != '1'
        run: |
          set -euo pipefail
          pip install --quiet "ethos-u-vela==${VELA_VERSION}"
          cd /tmp/model
          # The HX6538's NPU is an Ethos-U55 in its 64-MAC configuration at
          # 400 MHz (Himax: "we only release models that pass himax_vela.ini,
          # Ethos-U55 64 MACS"). The exact memory layout below is Himax's own
          # vela config (My_Sys_Cfg / My_Mem_Mode_Parent), vendored verbatim
          # here so a release never depends on an upstream URL — and never
          # silently falls back to an accelerator-only compile with a
          # different memory placement than the module expects.
          #   source: HimaxWiseEyePlus/ML_FVP_EVALUATION vela/himax_vela.ini
          #           (== Seeed-Studio/ModelAssistant tools/vela_config.ini)
          cat > himax_vela.ini <<'INI'
          ; Himax WiseEye2 (HX6538) Ethos-U55 64-MAC vela config — vendored
          ; verbatim from HimaxWiseEyePlus/ML_FVP_EVALUATION vela/himax_vela.ini
          [System_Config.My_Sys_Cfg]
          core_clock=400e6
          axi0_port=Sram
          axi1_port=OffChipFlash
          Sram_clock_scale=1.0
          Sram_burst_length=32
          Sram_read_latency=16
          Sram_write_latency=16
          Dram_clock_scale=0.75
          Dram_burst_length=128
          Dram_read_latency=500
          Dram_write_latency=250
          OnChipFlash_clock_scale=0.25
          OffChipFlash_clock_scale=0.015625
          OffChipFlash_burst_length=32
          OffChipFlash_read_latency=64
          OffChipFlash_write_latency=64
          [Memory_Mode.My_Mem_Mode_Parent]
          const_mem_area=Axi1
          arena_mem_area=Axi0
          cache_mem_area=Axi0
          INI
          # Mandatory: match SSCMA/Himax's own invocation exactly. No fallback —
          # if this errors, the release fails rather than shipping a model with
          # a memory layout the module wasn't tuned for.
          vela --accelerator-config ethos-u55-64 \
               --config himax_vela.ini \
               --system-config My_Sys_Cfg \
               --memory-mode My_Mem_Mode_Parent \
               --output-dir . model_int8.tflite
          mv model_int8_vela.tflite model_vela.tflite
          # Belt: the compiled artifact must actually carry an Ethos-U command
          # stream and keep the 1x192x192x3 person input — else fail loudly.
          python3 - <<'PY'
          import struct, sys
          b = open("model_vela.tflite", "rb").read()
          if b[4:8] != b"TFL3":
              sys.exit("::error::compiled model is not a TFLite flatbuffer")
          if b"ethos_u_command_stream" not in b and b"ethos-u" not in b:
              sys.exit("::error::compiled model has no Ethos-U command stream — vela did not target the NPU")
          def i32(o): return struct.unpack_from("<i", b, o)[0]
          if not any([i32(o+4*k) for k in range(4)] == [1,192,192,3] for o in range(0, len(b)-16, 4)):
              sys.exit("::error::compiled model input is not 1x192x192x3 — wrong source model")
          print("vela OK — Ethos-U55 64-MAC command stream, 1x192x192x3 input")
          PY
          echo "VELA_SOURCE=himax-config" >> "$GITHUB_ENV"
          ls -la

      - name: Sign the model asset with the OTA release key
        # Same key, same scheme as the firmware images: Ed25519 over
        # uint32_le(size) || sha256(asset) (firmware/scripts/ota_release.py).
        # Without the signature, whoever can swap release assets could
        # re-point the manifest's sha256 at a malicious model — the exact
        # substitution the firmware channel's signature already stops.
        id: sign
        if: steps.tag.outputs.skip != '1'
        env:
          OTA_SIGNING_KEY_PEM: ${{ secrets.OTA_SIGNING_KEY_PEM }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$OTA_SIGNING_KEY_PEM" ]; then
            # Pre-key-ceremony rebuilds still work; the flasher refuses the
            # unsigned manifest as soon as a real release key is pinned, so
            # this cannot silently weaken a provisioned deployment.
            echo "::warning::OTA_SIGNING_KEY_PEM is not set — publishing an UNSIGNED model manifest. A flasher with a real pinned release key will refuse it."
            echo "signature=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$OTA_SIGNING_KEY_PEM" > /tmp/releaser.pem
          chmod 600 /tmp/releaser.pem
          pip install --quiet cryptography
          # Same drift guard as firmware-release.yml: artifacts signed with a
          # key that is not the committed release key would be refused by
          # every flasher in the field.
          python firmware/scripts/ota_release.py pubkey-header \
            --private-key /tmp/releaser.pem --out /tmp/expected_key.h
          extract_key_bytes() {
            sed -n '/SECURACV_OTA_RELEASE_PUBKEY\[32\]/,/};/p' "$1" | grep -o '0x[0-9a-fA-F][0-9a-fA-F]' | tr '[:upper:]' '[:lower:]'
          }
          extract_key_bytes /tmp/expected_key.h > /tmp/expected_bytes
          extract_key_bytes firmware/common/ota/src/ota_release_key.h > /tmp/committed_bytes
          cmp -s /tmp/expected_bytes /tmp/committed_bytes || {
            echo "::error::OTA_SIGNING_KEY_PEM does not match the committed release public key"; exit 1; }
          SIG=$(python firmware/scripts/ota_release.py sign \
            --private-key /tmp/releaser.pem /tmp/model/model_vela.tflite)
          echo "signature=$SIG" >> "$GITHUB_OUTPUT"
          echo "model asset signed (sig ${SIG:0:16}…)"

      - name: Build manifest-vision-model.json + checksums
        if: steps.tag.outputs.skip != '1'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          TAG: ${{ steps.tag.outputs.tag }}
          FLASH_ADDR: ${{ steps.flashaddr.outputs.flash_addr }}
          MODEL_SIGNATURE: ${{ steps.sign.outputs.signature }}
        run: |
          cd /tmp/model
          test -s model_vela.tflite || { echo "::error::no model artifact produced"; exit 1; }
          ASSET="person-detection-we2-v${VERSION}.tflite"
          cp model_vela.tflite "$ASSET"
          SIZE=$(stat -c%s "$ASSET")
          SHA=$(sha256sum "$ASSET" | cut -d' ' -f1)
          python3 - "$ASSET" "$SIZE" "$SHA" << 'PY'
          import json, os, sys
          asset, size, sha = sys.argv[1], int(sys.argv[2]), sys.argv[3]
          tag = os.environ["TAG"]; version = os.environ["VERSION"]
          flash_addr = os.environ["FLASH_ADDR"]  # from flash.json ← we2-core.js
          signature = os.environ.get("MODEL_SIGNATURE", "").strip()
          repo = os.environ.get("GITHUB_REPOSITORY", "kmay89/securaCV")
          model = {
              "name": asset,
              "url": f"https://github.com/{repo}/releases/download/{tag}/{asset}",
              "size": size,
              "sha256": sha,
              "flash_addr": flash_addr,
              "arch": "Swift-YOLO (tiny) 192x192x3 INT8, Vela-compiled for Ethos-U55",
              # How it was compiled, on the record — so the manifest can be
              # audited and the freshness job can insist it stays honest.
              "vela_source": os.environ.get("VELA_SOURCE", "unknown"),
              "vela": {
                  "accelerator": "ethos-u55-64",
                  "system_config": "My_Sys_Cfg",
                  "memory_mode": "My_Mem_Mode_Parent",
                  "config": "Himax himax_vela.ini (vendored in vision-model-release.yml)",
              },
          }
          if signature:
              # Ed25519 release signature over uint32_le(size)||sha256(asset) —
              # same key and scheme as the firmware images; the flasher fails
              # closed on official manifests without it once a real release
              # key is pinned.
              model["signature"] = signature
          json.dump({
              "$doc": "Pinned Grove Vision AI V2 model for the browser module-flasher. "
                      "The flasher verifies sha256 AND the Ed25519 release signature "
                      "before a byte is written.",
              "version": version,
              "tag": tag,
              "model": model,
              "license": "MIT — Seeed SSCMA model zoo (person detection); "
                         "redistributed with attribution, see NOTICE in the repo",
              "source": "https://github.com/Seeed-Studio/sscma-model-zoo",
          }, open("manifest-vision-model.json", "w"), indent=2)
          PY
          sha256sum "$ASSET" manifest-vision-model.json > vision-model-sha256sums.txt
          cat manifest-vision-model.json

      - name: Attach to the release (create if missing, clobber if rebuilt)
        if: steps.tag.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          cd /tmp/model
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "assets"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            person-detection-we2-v*.tflite \
            manifest-vision-model.json \
            vision-model-sha256sums.txt
