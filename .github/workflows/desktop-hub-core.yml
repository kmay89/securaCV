name: Hub Core

# desktop/hub-core holds the footgun-critical DECISIONS behind the Raspberry
# Pi hub disk writer (which disk may be written, is the image trusted, may we
# write), and desktop/hub-io the MECHANISMS those decisions feed (streaming
# download+hash, xz decompress, the read-back-verified raw write, the Wi-Fi
# seed). desktop/flash-engine is the same idea for the ESP32 flash path both
# desktop apps run (the Flasher and the Lab): catalog guards, release
# verification, NVS provisioning, the change map, the verify-provision-write
# pipeline and the boot-receipt monitor, tested here against an in-memory host.
#
# The full desktop app (desktop/src-tauri) only builds on release tags and
# needs the webkit/gtk stack, so nothing in PR CI would catch a break in this
# logic if it lived there. Both crates build and test on a plain runner —
# hub-core as pure `std`, hub-io with its few self-contained deps and tests
# that run against plain files and a loopback HTTP server — so the disk-writer
# path can't rot silently between releases.
on:
  push:
    branches: [ main ]
    paths:
      - 'desktop/hub-core/**'
      - 'desktop/hub-io/**'
      - 'desktop/flash-engine/**'
      # The flash engine's catalog tests pin its derivations against the
      # real catalog (include_str! of this file).
      - 'canary-local/devices/flash.json'
      # The WHOLE crate, so a change to hub.rs / lib.rs / host.rs reaches the
      # compile job below instead of nothing at all.
      - 'desktop/src-tauri/**'
      - '.github/workflows/desktop-hub-core.yml'
      # hub-io embeds these provisioning-bundle files (include_str!) and
      # cross-checks their bytes against the Python manifest's SHA-256 pins, so a
      # change to any of them must re-run this workflow or the check goes stale.
      - 'canary-local/devices/hub_seed.json'
      - 'canary-local/devices/hub_provision_bundle.json'
      - 'canary-local/tools/hub_seed_apply.py'
      - 'canary-local/tools/hub_host_provision.sh'
      - 'canary-local/tools/gen_hub_provision_bundle.py'
      - 'homeassistant/frigate/config.yaml'
  pull_request:
    branches: [ main ]
    paths:
      - 'desktop/hub-core/**'
      - 'desktop/hub-io/**'
      - 'desktop/flash-engine/**'
      # The flash engine's catalog tests pin its derivations against the
      # real catalog (include_str! of this file).
      - 'canary-local/devices/flash.json'
      # The WHOLE crate, so a change to hub.rs / lib.rs / host.rs reaches the
      # compile job below instead of nothing at all.
      - 'desktop/src-tauri/**'
      - '.github/workflows/desktop-hub-core.yml'
      # hub-io embeds these provisioning-bundle files (include_str!) and
      # cross-checks their bytes against the Python manifest's SHA-256 pins, so a
      # change to any of them must re-run this workflow or the check goes stale.
      - 'canary-local/devices/hub_seed.json'
      - 'canary-local/devices/hub_provision_bundle.json'
      - 'canary-local/tools/hub_seed_apply.py'
      - 'canary-local/tools/hub_host_provision.sh'
      - 'canary-local/tools/gen_hub_provision_bundle.py'
      - 'homeassistant/frigate/config.yaml'

# Read-only token: this workflow only checks out and runs cargo — it needs
# nothing else. (CodeQL flags workflows that don't pin GITHUB_TOKEN scope.)
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# A new push to a PR branch cancels the in-flight run; main is never canceled.
concurrency:
  # PRs collapse per branch; each main commit gets its own group, so a burst
  # of merges can never evict the main run queued behind another (CI.md R3).
  group: hub-core-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04  # pinned ahead of the 26.04 image move; revisit before 24.04 retires
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        crate: [hub-core, hub-io, flash-engine]
    defaults:
      run:
        working-directory: desktop/${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v7
      - name: Install libudev (flash-engine's serialport)
        # The flash engine lists and opens serial ports through `serialport`,
        # whose Linux backend links libudev (libudev-sys) at build time — the
        # same package every workflow that builds a desktop app installs.
        if: matrix.crate == 'flash-engine'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - name: Install fmt + clippy
        run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        # Every other cargo job in the repo caches; this one built three
        # crates' dependency graphs cold on every run (flash-engine alone
        # locks 164 packages: reqwest, rustls, serialport). One entry per
        # crate, the same per-matrix key shape as desktop-release.yml.
        # hub-core commits no Cargo.lock, so its key follows its Cargo.toml.
        with:
          workspaces: desktop/${{ matrix.crate }} -> target
          key: ${{ matrix.crate }}
      - name: Format check
        run: cargo fmt --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings
      - name: Docs (warnings are errors)
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: Install FAT tooling for the independent-implementation tests
        # hub-core's `hub_fat` writes the Wi-Fi keyfile into the FAT boot
        # filesystem inside the HAOS image. Its own tests read back what it
        # wrote, which cannot catch a shared misunderstanding: a writer and a
        # reader that agree on a WRONG layout pass every test and still produce
        # a card the Pi can't read.
        #
        # So tests/fat_against_dosfstools.rs hands the result to code that has
        # never seen ours — mkfs.fat creates the volume, fsck.fat audits it
        # (both FAT copies, every cluster chain), mtools reads the file back.
        # Those tests SKIP when the tools are absent, so without this step they
        # would quietly pass while proving nothing. That silent-skip is exactly
        # the failure mode this whole change exists to remove, so it must not be
        # reintroduced in the CI that guards it.
        run: sudo apt-get update && sudo apt-get install -y dosfstools mtools
      - name: Test
        run: cargo test
      - name: Prove the FAT tests really ran
        # A test that skips still counts as passing, so a missing tool would
        # turn this whole check into a green tick over nothing — the same
        # silent-no-op shape as the bug the FAT writer exists to fix.
        # SKIP(tooling) means a tool was absent and is a failure here;
        # SKIP(optional) is the real-image test, which needs a multi-gigabyte
        # HAOS download the runner has no reason to hold, and is expected.
        if: matrix.crate == 'hub-core'
        run: |
          set -euo pipefail
          out="$(cargo test --test fat_against_dosfstools -- --nocapture)"
          echo "$out"
          if grep -q "SKIP(tooling)" <<<"$out"; then
            echo "::error::the FAT round-trip tests skipped — dosfstools/mtools missing, so nothing was verified"
            exit 1
          fi

  # The Windows branches of the hub writer, compiled, linted and tested where
  # they run (sweeps A68, A87). The matrix above is Linux only, so
  # `cfg(windows)` code — hub-core's hub_enumerate_windows.rs, hub-io's
  # staged \\.\PhysicalDriveN writer in write.rs — and the Windows view of
  # every test target were compiled by no workflow: the 2026-10 cleanup found
  # hub-core's own tests did not build off Linux until it fixed an import.
  # This job compiles them, holds them to clippy with warnings as errors (a
  # Windows-only warning, such as an unused `cfg(windows)` import, is
  # invisible to the Linux clippy), and runs `cargo test`, so
  # hub_enumerate_windows.rs's pure judgments run on the OS they judge. It
  # enables nothing: the Windows writer stays staged until A9's VM or hardware
  # pass, `write_backend_available()` still answers false here (a test holds
  # it to that), and nothing here flashes or ships a Windows build. Same
  # toolchain as the matrix above (the runner image's rustup stable, no pin of
  # its own), the same cache shape and the workflow's path filters.
  # hub-core's FAT round-trip tests (tests/fat_against_dosfstools.rs) print
  # SKIP(tooling) and return here: dosfstools and mtools are Linux tools, and
  # the matrix above is the job that proves those tests really ran.
  windows-check:
    name: cargo check, clippy and test on Windows (${{ matrix.crate }})
    runs-on: windows-latest
    # A cold check built hub-io in under a minute on its first run (#1802);
    # clippy and the test build add the rest of the dependency graph's codegen
    # (liblzma and ring through MSVC). The timeout is the circuit breaker, not
    # a race.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        crate: [hub-core, hub-io]
    defaults:
      run:
        working-directory: desktop/${{ matrix.crate }}
    steps:
      - name: Check out with the repository's line endings
        # Git for Windows installs with core.autocrlf=true, which turns text
        # into CRLF on checkout, and nothing in .gitattributes says otherwise.
        # hub-io's provision.rs embeds repo files with include_str! (which,
        # unlike Rust source, keeps their bytes as checked out), and
        # embedded_bytes_match_python_manifest_pins hashes four of them against
        # pins taken over the committed LF bytes: a CRLF checkout would fail it
        # here alone, over bytes no build ships. Set before the checkout, from
        # the runner's temp directory (the default working-directory does not
        # exist until the checkout makes it).
        working-directory: ${{ runner.temp }}
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - name: Install clippy
        # Same as the matrix above: ask for the component rather than trust
        # that the image's toolchain carries it.
        run: rustup component add clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        # One entry per crate, as in the matrix above; rust-cache keys on the
        # job and the runner OS too, so these never share an entry with Linux.
        with:
          workspaces: desktop/${{ matrix.crate }} -> target
          key: ${{ matrix.crate }}
      - name: cargo check --all-targets (Windows branches compile)
        run: cargo check --all-targets
      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  # Self-contained pure modules that live inside the release-only tauri crate
  # (desktop/src-tauri) but depend on nothing but `std`, so `rustc --test` runs
  # their unit tests on a plain runner. (rescue.rs, port_hint.rs, health.rs and
  # broker_receipt.rs — the four-row broker TLS receipt table both flashers
  # print — used to be compiled here the same way; they moved into
  # desktop/flash-engine, whose `cargo test` in the matrix above runs them
  # with the rest of the flash path.)
  # Compile the ACTUAL Tauri crate. Until this existed, PR CI compiled exactly
  # three files out of desktop/src-tauri (below, as pure modules) and nothing
  # else — so a change to hub.rs could be reviewed, merged, and only discovered
  # to be broken by the next release build. That happened: a hub.rs edit reached
  # main with no compile coverage anywhere, local or CI, because the crate needs
  # GTK/WebKit dev libraries. It compiled — but the check was luck, not process.
  # cargo check (not build) keeps it a few minutes: we want the type error, not
  # a binary.
  tauri-crate-check:
    name: cargo check (src-tauri)
    runs-on: ubuntu-24.04  # pinned ahead of the 26.04 image move; revisit before 24.04 retires
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build dependencies
        # Same set the desktop release workflow installs; gdk-sys and friends
        # cannot configure without them.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev \
            libudev-dev \
            pkg-config \
            build-essential
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format check
        # The three crates in the matrix above have always been held to
        # rustfmt and clippy; this one was compiled and tested but never
        # linted, so it drifted (unformatted files, two clippy errors on a
        # current toolchain) with nothing to say so. rustfmt needs no build,
        # so it goes first and fails fast.
        working-directory: desktop/src-tauri
        run: cargo fmt --check
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Stub the bundled sidecars
        # tauri-build refuses to run until every externalBin/resource named in
        # tauri.conf.json exists on disk — it is checking the BUNDLE, which is
        # the release workflow's job (it downloads espflash and builds rpiboot
        # from a pinned checkout, minutes of work). This job only wants the
        # compiler's opinion of the Rust, so give the build script empty files
        # to find. They are never executed, never packaged, and never leave the
        # runner: `cargo check` produces no bundle at all.
        run: |
          set -euo pipefail
          cd desktop/src-tauri
          mkdir -p binaries resources
          triple="$(rustc -vV | awk '/^host:/{print $2}')"
          # Create ONLY what is missing. resources/mass-storage-gadget64 is a
          # real directory committed to the repo, so truncating it is both
          # wrong and an error ("Is a directory") — the first version of this
          # step did exactly that.
          for want in "binaries/espflash-${triple}" "binaries/rpiboot-${triple}" \
                      "resources/mass-storage-gadget64"; do
            if [ -e "$want" ]; then
              echo "have    $want"
            else
              : > "$want"
              chmod +x "$want"
              echo "stubbed $want"
            fi
          done
      - uses: actions/setup-node@v7
        # for the npx below: node from the runner image moves with the image,
        # like its python3; pin the major the other node jobs run.
        with:
          node-version: "22"
      - name: Generate app icons
        # tauri::generate_context!() is a proc macro that OPENS icons/32x32.png
        # at compile time, so a missing icon set is a compile error, not a
        # bundling one. source.png is committed; derive the rest, same command
        # the release workflow uses.
        working-directory: desktop
        run: npx --yes @tauri-apps/cli icon src-tauri/icons/source.png
      - name: cargo check
        working-directory: desktop/src-tauri
        run: cargo check --all-targets
      - name: Clippy (warnings are errors)
        # The matrix crates' rule, on the app crate too. Runs after check so
        # the dependency graph it reuses is already built and cached.
        working-directory: desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        # `check` proves the crate compiles; it never runs an assertion. The
        # modules whose logic decides something — whether a previous launch
        # hung, whether a PID is still our sidecar, whether an image is a
        # factory build — carry unit tests that were compiling and never
        # executing here. `tauri-pure-modules` below runs the one module that
        # stands alone without tauri (sscma.rs), and the flash engine's own
        # job runs the flash path's; this covers the rest, and costs
        # nothing extra: the dependency graph is already built and cached by
        # the check above.
        working-directory: desktop/src-tauri
        run: cargo test

  tauri-pure-modules:
    runs-on: ubuntu-24.04  # pinned ahead of the 26.04 image move; revisit before 24.04 retires
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: sscma.rs unit tests
        run: |
          rustc --edition 2021 --test desktop/src-tauri/src/sscma.rs -o /tmp/sscma_test
          /tmp/sscma_test
