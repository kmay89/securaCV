name: Hub Core

# desktop/hub-core holds the footgun-critical DECISIONS behind the Raspberry
# Pi hub disk writer (which disk may be written, is the image trusted, may we
# write), and desktop/hub-io the MECHANISMS those decisions feed (streaming
# download+hash, xz decompress, the read-back-verified raw write, the Wi-Fi
# seed).
#
# The full desktop app (desktop/src-tauri) only builds on release tags and
# needs the webkit/gtk stack, so nothing in PR CI would catch a break in this
# logic if it lived there. Both crates build and test on a plain runner —
# hub-core as pure `std`, hub-io with its few self-contained deps and tests
# that run against plain files and a loopback HTTP server — so the disk-writer
# path can't rot silently between releases.
on:
  push:
    branches: [ main ]
    paths:
      - 'desktop/hub-core/**'
      - 'desktop/hub-io/**'
      - 'desktop/src-tauri/src/rescue.rs'
      - 'desktop/src-tauri/src/port_hint.rs'
      - 'desktop/src-tauri/src/health.rs'
      # The WHOLE crate, so a change to hub.rs / provisioning.rs / lib.rs
      # reaches the compile job below instead of nothing at all.
      - 'desktop/src-tauri/**'
      - '.github/workflows/desktop-hub-core.yml'
      # hub-io embeds these provisioning-bundle files (include_str!) and
      # cross-checks their bytes against the Python manifest's SHA-256 pins, so a
      # change to any of them must re-run this workflow or the check goes stale.
      - 'canary-local/devices/hub_seed.json'
      - 'canary-local/devices/hub_provision_bundle.json'
      - 'canary-local/tools/hub_seed_apply.py'
      - 'canary-local/tools/hub_host_provision.sh'
      - 'canary-local/tools/gen_hub_provision_bundle.py'
      - 'homeassistant/frigate/config.yaml'
  pull_request:
    branches: [ main ]
    paths:
      - 'desktop/hub-core/**'
      - 'desktop/hub-io/**'
      - 'desktop/src-tauri/src/rescue.rs'
      - 'desktop/src-tauri/src/port_hint.rs'
      - 'desktop/src-tauri/src/health.rs'
      # The WHOLE crate, so a change to hub.rs / provisioning.rs / lib.rs
      # reaches the compile job below instead of nothing at all.
      - 'desktop/src-tauri/**'
      - '.github/workflows/desktop-hub-core.yml'
      # hub-io embeds these provisioning-bundle files (include_str!) and
      # cross-checks their bytes against the Python manifest's SHA-256 pins, so a
      # change to any of them must re-run this workflow or the check goes stale.
      - 'canary-local/devices/hub_seed.json'
      - 'canary-local/devices/hub_provision_bundle.json'
      - 'canary-local/tools/hub_seed_apply.py'
      - 'canary-local/tools/hub_host_provision.sh'
      - 'canary-local/tools/gen_hub_provision_bundle.py'
      - 'homeassistant/frigate/config.yaml'

# Read-only token: this workflow only checks out and runs cargo — it needs
# nothing else. (CodeQL flags workflows that don't pin GITHUB_TOKEN scope.)
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# A new push to a PR branch cancels the in-flight run; main is never canceled.
concurrency:
  group: hub-core-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        crate: [hub-core, hub-io]
    defaults:
      run:
        working-directory: desktop/${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v7
      - name: Install fmt + clippy
        run: rustup component add rustfmt clippy
      - name: Format check
        run: cargo fmt --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings
      - name: Docs (warnings are errors)
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: Install FAT tooling for the independent-implementation tests
        # hub-core's `hub_fat` writes the Wi-Fi keyfile into the FAT boot
        # filesystem inside the HAOS image. Its own tests read back what it
        # wrote, which cannot catch a shared misunderstanding: a writer and a
        # reader that agree on a WRONG layout pass every test and still produce
        # a card the Pi can't read.
        #
        # So tests/fat_against_dosfstools.rs hands the result to code that has
        # never seen ours — mkfs.fat creates the volume, fsck.fat audits it
        # (both FAT copies, every cluster chain), mtools reads the file back.
        # Those tests SKIP when the tools are absent, so without this step they
        # would quietly pass while proving nothing. That silent-skip is exactly
        # the failure mode this whole change exists to remove, so it must not be
        # reintroduced in the CI that guards it.
        run: sudo apt-get update && sudo apt-get install -y dosfstools mtools
      - name: Test
        run: cargo test
      - name: Prove the FAT tests really ran
        # A test that skips still counts as passing, so a missing tool would
        # turn this whole check into a green tick over nothing — the same
        # silent-no-op shape as the bug the FAT writer exists to fix.
        # SKIP(tooling) means a tool was absent and is a failure here;
        # SKIP(optional) is the real-image test, which needs a multi-gigabyte
        # HAOS download the runner has no reason to hold, and is expected.
        if: matrix.crate == 'hub-core'
        run: |
          set -euo pipefail
          out="$(cargo test --test fat_against_dosfstools -- --nocapture)"
          echo "$out"
          if grep -q "SKIP(tooling)" <<<"$out"; then
            echo "::error::the FAT round-trip tests skipped — dosfstools/mtools missing, so nothing was verified"
            exit 1
          fi

  # Self-contained pure modules that live inside the release-only tauri crate
  # (desktop/src-tauri) but depend on nothing but `std`, so `rustc --test` runs
  # their unit tests on a plain runner — the footgun logic (rescue backup/restore
  # validation, espflash arg building) can't rot silently between releases, even
  # though the full app only builds on release tags.
  # Compile the ACTUAL Tauri crate. Until this existed, PR CI compiled exactly
  # three files out of desktop/src-tauri (below, as pure modules) and nothing
  # else — so a change to hub.rs could be reviewed, merged, and only discovered
  # to be broken by the next release build. That happened: a hub.rs edit reached
  # main with no compile coverage anywhere, local or CI, because the crate needs
  # GTK/WebKit dev libraries. It compiled — but the check was luck, not process.
  # cargo check (not build) keeps it a few minutes: we want the type error, not
  # a binary.
  tauri-crate-check:
    name: cargo check (src-tauri)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build dependencies
        # Same set the desktop release workflow installs; gdk-sys and friends
        # cannot configure without them.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev \
            libudev-dev \
            pkg-config \
            build-essential
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Stub the bundled sidecars
        # tauri-build refuses to run until every externalBin/resource named in
        # tauri.conf.json exists on disk — it is checking the BUNDLE, which is
        # the release workflow's job (it downloads espflash and builds rpiboot
        # from a pinned checkout, minutes of work). This job only wants the
        # compiler's opinion of the Rust, so give the build script empty files
        # to find. They are never executed, never packaged, and never leave the
        # runner: `cargo check` produces no bundle at all.
        run: |
          set -euo pipefail
          cd desktop/src-tauri
          mkdir -p binaries resources
          triple="$(rustc -vV | awk '/^host:/{print $2}')"
          # Create ONLY what is missing. resources/mass-storage-gadget64 is a
          # real directory committed to the repo, so truncating it is both
          # wrong and an error ("Is a directory") — the first version of this
          # step did exactly that.
          for want in "binaries/espflash-${triple}" "binaries/rpiboot-${triple}" \
                      "resources/mass-storage-gadget64"; do
            if [ -e "$want" ]; then
              echo "have    $want"
            else
              : > "$want"
              chmod +x "$want"
              echo "stubbed $want"
            fi
          done
      - name: Generate app icons
        # tauri::generate_context!() is a proc macro that OPENS icons/32x32.png
        # at compile time, so a missing icon set is a compile error, not a
        # bundling one. source.png is committed; derive the rest, same command
        # the release workflow uses.
        working-directory: desktop
        run: npx --yes @tauri-apps/cli icon src-tauri/icons/source.png
      - name: cargo check
        working-directory: desktop/src-tauri
        run: cargo check --all-targets
      - name: cargo test
        # `check` proves the crate compiles; it never runs an assertion. The
        # modules whose logic decides something — whether a previous launch
        # hung, whether a PID is still our sidecar, whether an image is a
        # factory build — carry unit tests that were compiling and never
        # executing here. `tauri-pure-modules` below runs the three modules
        # that stand alone without tauri; this covers the rest, and costs
        # nothing extra: the dependency graph is already built and cached by
        # the check above.
        working-directory: desktop/src-tauri
        run: cargo test

  tauri-pure-modules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: rescue.rs unit tests
        run: |
          rustc --edition 2021 --test desktop/src-tauri/src/rescue.rs -o /tmp/rescue_test
          /tmp/rescue_test
      - name: port_hint.rs unit tests
        run: |
          rustc --edition 2021 --test desktop/src-tauri/src/port_hint.rs -o /tmp/port_hint_test
          /tmp/port_hint_test
      - name: health.rs unit tests
        run: |
          rustc --edition 2021 --test desktop/src-tauri/src/health.rs -o /tmp/health_test
          /tmp/health_test
      - name: sscma.rs unit tests
        run: |
          rustc --edition 2021 --test desktop/src-tauri/src/sscma.rs -o /tmp/sscma_test
          /tmp/sscma_test
