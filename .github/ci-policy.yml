# Exemptions from the CI policy rules (.github/CI.md), enforced by
# .github/scripts/ci_policy_check.py in the Workflow Lint check.
#
# Every entry needs a comment saying WHY the rule doesn't fit — an
# exemption without a reason is a policy violation waiting to be copied.

# R2: upper bound for any job's timeout-minutes. Raise deliberately if a
# job genuinely needs more; don't work around it per-job.
timeout_max: 120

# R5: pull_request workflows allowed to run on every PR, unfiltered.
unfiltered_ok:
  - lint.yml           # cheap repo-wide greps; any file can violate them
  - secrets-scan.yml   # a secret can land in any file type
  - review-threads.yml # gates on review-thread state, not file contents
  - claude-review.yml  # advisory review bot must see every PR, any file type

# R6: workflows whose push and pull_request path lists may differ.
paths_parity_ok: []

# R3 (publish half): tag/release-triggered workflows allowed to keep a
# bare `cancel-in-progress: true` despite publishing.
publish_cancel_ok: []

# R8: workflows allowed to pin a third-party action to a tag instead of
# a commit SHA. Should stay empty — a tag is a mutable ref in someone
# else's hands; SHA pins are the rule and Dependabot keeps them fresh.
third_party_tag_ok: []

# R3 (branch half): branch-push workflows allowed to keep a bare
# `cancel-in-progress: true`. Only for workflows that produce no signal worth
# preserving — canceling a *test* on main hides whether main is healthy,
# which is the whole reason the rule exists.
branch_cancel_ok:
  - pages.yml # a deploy, not a test: only the newest content is worth
              # publishing, so superseding an in-flight run loses nothing.
              # Nothing is learned from an older deploy finishing.

# R3 (eviction half): branch-push workflows allowed to share ONE concurrency
# group per ref instead of one per commit. Only for publishers whose runs must
# land in order: a queued publish that gets evicted is superseded by the newer
# one, and :latest / the deployed site / the mirror branch still end on the
# newest commit. A TEST workflow does not belong here — an evicted test run is
# a main commit nobody verified.
main_queue_ok:
  - addon-image.yml           # pushes :<version> + :latest to GHCR; in order, so :latest ends newest
  - container-images.yml      # same, the witnessd image
  - docker-sidecar.yml        # same, the Frigate sidecar image
  - pages.yml                 # a deploy: only the newest content is worth publishing
  - labels.yml                # idempotent label sync; order is irrelevant, parallel runs are noise

# R9: jobs allowed to run Python on the runner image's interpreter without an
# actions/setup-python step. Entries are `<workflow>.yml:<job>`, each with a
# reason; should stay empty.
system_python_ok: []
