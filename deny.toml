# cargo-deny configuration — supply-chain gate for the Rust workspace
# (doc-12 §3.3 A4 / FR-14). For a witness product the credibility of the
# evidence chain rests on knowing what code produced it, so dependency
# licenses, provenance, and duplication are policy, not vibes.
#
# Advisories (known CVEs) are gated separately by `cargo audit` in
# audit.yml, so CI runs `cargo deny check bans licenses sources` here and
# leaves the advisory DB to cargo-audit. Run locally with:
#   cargo deny check bans licenses sources
# The [advisories] section below is for a local `cargo deny check` (all
# checks): it states the policy instead of leaving it to cargo-deny's
# defaults. It ignores exactly what cargo-audit ignores (.cargo/audit.toml),
# and it is stricter in one place, on purpose: an unmaintained crate the
# workspace depends on directly is an error here and a warning in
# cargo-audit, so a local `cargo deny check advisories` stays red on those
# until each is replaced (the triage: docs/security/ENTERPRISE_CUSTODY.md §7).

[graph]
# Check the platforms we actually ship (Linux daemon + tooling).
all-features = true

[advisories]
# Section version 2: every advisory that names a vulnerability is an error
# — there is no severity threshold and no lower level for one; a reviewed
# exception is listed under `ignore` with its reason, never waved through.
# An unmaintained crate is an error when the workspace depends on it
# directly, and not for the transitive long tail cargo-audit only warns
# about; a yanked version warns, as cargo-audit does. The database is the
# one cargo-audit reads.
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
unmaintained = "workspace"
yanked = "warn"
# The same list as .cargo/audit.toml's `[advisories] ignore`, which carries
# each entry's reason (and SECURITY.md its analysis: "Group 3" for this one).
# The two move together; scripts/check_advisory_ignores.py, in audit.yml,
# fails when they differ.
ignore = ["RUSTSEC-2023-0071"]

[licenses]
version = 2
# Permissive/copyleft-compatible licenses only. A copyleft or unknown license
# entering the tree fails the check until it is reviewed and added here.
confidence-threshold = 0.9
# Keep a generous permissive allow-list without failing on entries a given
# feature set happens not to pull in.
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
    # Permissive licenses from the tract ONNX inference stack.
    "WTFPL",
    "CDLA-Permissive-2.0",
    # SQLite's public-domain dedication, on `sqlcipher-src` (the SQLCipher
    # amalgamation `rusqlite`'s `bundled-sqlcipher` builds).
    "blessing",
]

[bans]
# Duplicate crate versions bloat the binary and widen the audit surface.
# Warn (not deny) for now so the report is visible without blocking on the
# long tail of transitive version skew.
multiple-versions = "warn"
wildcards = "allow"

[sources]
# Everything must come from crates.io — no unknown registries or ad-hoc git
# dependencies slipping into the build.
unknown-registry = "deny"
unknown-git = "deny"
# crates.io only. Both forms are listed so the check is robust across
# cargo-deny versions and Cargo's sparse registry (default since Rust 1.68),
# regardless of whether cargo-deny canonicalizes the sparse index to the git
# index URL.
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
    "sparse+https://index.crates.io/",
]
