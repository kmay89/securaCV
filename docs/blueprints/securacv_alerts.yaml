# SecuraCV Alert Blueprint for Home Assistant
#
# Import this blueprint via:
#   Settings > Automations > Blueprints > Import Blueprint
#   URL: https://github.com/kmay89/securaCV/blob/main/docs/blueprints/securacv_alerts.yaml
#
# Creates one automation covering smoke/CO alarm detection, tamper alerts,
# power loss, chain integrity failures, device offline, and GPS loss. Every
# alert is opt-in: pick the sensors you want monitored, leave the rest empty.
#
# Where to find the sensors (entity IDs follow
# `<domain>.securacv_canary_<device_id>_<name>`):
#   - Tamper:        binary_sensor.securacv_canary_<id>_tamper
#                    (or `_tamper_detected` if discovered from firmware)
#   - Smoke heard:   the "Smoke Alarm Heard" binary sensor (mic builds only)
#   - CO heard:      the "CO Alarm Heard" binary sensor (mic builds only)
#   - Power loss:    the per-type "Power Loss" tamper sensor (canary base
#                    builds publish it at boot after an outage/brownout)
#   - Chain valid:   binary_sensor.securacv_canary_<id>_chain_valid
#   - Online:        binary_sensor.securacv_canary_<id>_online
#   - GPS fix:       the "GPS Fix" binary sensor (GPS builds only)

blueprint:
  name: "SecuraCV Canary Alerts"
  description: >-
    Monitor a SecuraCV Canary witness device and send notifications for
    smoke/CO alarms heard by the device, tamper events, power loss, chain
    integrity failures, device offline, and GPS loss. Each alert type is
    enabled by selecting its sensor — leave an input empty to skip that
    alert.
    Privacy by design — only semantic events, never raw video or audio.
  domain: automation
  author: "ERRERlabs"
  homeassistant:
    min_version: "2024.6.0"
  source_url: "https://github.com/kmay89/securaCV/blob/main/docs/blueprints/securacv_alerts.yaml"

  input:
    tamper_entity:
      name: "Tamper sensor (optional)"
      description: >-
        The Canary's tamper binary sensor
        (e.g. binary_sensor.securacv_canary_<id>_tamper). Leave empty to
        skip tamper alerts.
      selector:
        entity:
          domain: binary_sensor
          multiple: false
      default: []

    smoke_entity:
      name: "Smoke-alarm-heard sensor (optional)"
      description: >-
        The "Smoke Alarm Heard" binary sensor — latches on when the mic
        matches an NFPA 72 T3 smoke cadence. Sends a CRITICAL push that
        bypasses silent/do-not-disturb modes. Requires a Canary with the
        microphone enabled (XIAO ESP32-S3 Sense). Leave empty to skip.
      selector:
        entity:
          domain: binary_sensor
          multiple: false
      default: []

    co_entity:
      name: "CO-alarm-heard sensor (optional)"
      description: >-
        The "CO Alarm Heard" binary sensor — latches on when the mic
        matches a UL 2034 T4 carbon-monoxide cadence. Sends a CRITICAL
        push that bypasses silent/do-not-disturb modes. Leave empty to skip.
      selector:
        entity:
          domain: binary_sensor
          multiple: false
      default: []

    chain_entity:
      name: "Chain-valid sensor (optional)"
      description: >-
        The witness-chain integrity binary sensor
        (e.g. binary_sensor.securacv_canary_<id>_chain_valid). Alerts when
        chain verification fails. Leave empty to skip.
      selector:
        entity:
          domain: binary_sensor
          multiple: false
      default: []

    online_entity:
      name: "Online sensor (optional)"
      description: >-
        The device connectivity binary sensor
        (e.g. binary_sensor.securacv_canary_<id>_online). Alerts after the
        device stays offline past the delay below. Leave empty to skip.
      selector:
        entity:
          domain: binary_sensor
          device_class: connectivity
          multiple: false
      default: []

    gps_entity:
      name: "GPS-fix sensor (optional)"
      description: >-
        The GPS fix binary sensor. Alerts when the fix is lost for 2+
        minutes (possible jamming or indoor placement). Leave empty to skip.
      selector:
        entity:
          domain: binary_sensor
          multiple: false
      default: []

    power_entity:
      name: "Power Loss sensor (optional)"
      description: >-
        The per-type "Power Loss" tamper sensor
        (e.g. binary_sensor.securacv_canary_<id>_tamper_power_loss). Turns
        on when the device boots after a restored outage or a brownout —
        the push carries the classifier's own sentence, including the
        honest lower-bound outage duration when one is known. Leave empty
        to skip.
      selector:
        entity:
          domain: binary_sensor
          multiple: false
      default: []

    notify_service:
      name: "Notification Service"
      description: >-
        The notification service to use
        (e.g. notify.mobile_app_your_phone, notify.telegram, notify.pushover)
      selector:
        text:
      default: "notify.mobile_app"

    offline_delay:
      name: "Offline Delay"
      description: "How long to wait before alerting on device offline (avoids WiFi blips)"
      selector:
        duration:
      default:
        minutes: 5

trigger:
  - platform: state
    entity_id: !input tamper_entity
    to: "on"
    id: tamper

  - platform: state
    entity_id: !input smoke_entity
    to: "on"
    id: smoke

  - platform: state
    entity_id: !input co_entity
    to: "on"
    id: co

  - platform: state
    entity_id: !input chain_entity
    to: "off"
    id: chain_fail

  - platform: state
    entity_id: !input online_entity
    to: "off"
    for: !input offline_delay
    id: offline

  - platform: state
    entity_id: !input gps_entity
    to: "off"
    for:
      minutes: 2
    id: gps_lost

  - platform: state
    entity_id: !input power_entity
    to: "on"
    id: power_loss

condition: []

action:
  - choose:
      # Life-safety alerts first. The push payload carries BOTH the iOS
      # critical-push block (push.sound.critical) and the Android
      # high-priority channel + ttl:0 keys; each platform ignores the
      # other's keys. These deliberately bypass mute/do-not-disturb.
      - conditions:
          - condition: trigger
            id: smoke
        sequence:
          - service: !input notify_service
            data:
              title: "🔥 SMOKE ALARM HEARD"
              message: >-
                Canary {{ trigger.entity_id }} heard a smoke alarm sounding
                (NFPA 72 T3 pattern). Check the location now.
              data:
                tag: securacv-smoke
                importance: high
                ttl: 0
                priority: high
                channel: alarm_stream
                push:
                  sound:
                    name: default
                    critical: 1
                    volume: 1.0

      - conditions:
          - condition: trigger
            id: co
        sequence:
          - service: !input notify_service
            data:
              title: "⚠️ CO ALARM HEARD"
              message: >-
                Canary {{ trigger.entity_id }} heard a carbon monoxide alarm
                sounding (UL 2034 T4 pattern). Ventilate and evacuate —
                do not ignore this alert.
              data:
                tag: securacv-co
                importance: high
                ttl: 0
                priority: high
                channel: alarm_stream
                push:
                  sound:
                    name: default
                    critical: 1
                    volume: 1.0

      - conditions:
          - condition: trigger
            id: tamper
        sequence:
          - service: !input notify_service
            data:
              title: "SecuraCV Tamper Alert"
              message: >-
                Canary device {{ trigger.entity_id }} detected tampering.
                Check device immediately.
              data:
                tag: securacv-tamper
                importance: high

      - conditions:
          - condition: trigger
            id: power_loss
        sequence:
          - service: !input notify_service
            data:
              title: "SecuraCV Power Event"
              message: >-
                {{ state_attr(trigger.entity_id, 'detail')
                   or 'The device lost power and is back.' }}
                ({{ trigger.entity_id }})
              data:
                tag: securacv-power
                importance: high

      - conditions:
          - condition: trigger
            id: chain_fail
        sequence:
          - service: !input notify_service
            data:
              title: "SecuraCV Chain Integrity Failure"
              message: >-
                Witness chain on {{ trigger.entity_id }} failed verification.
                Evidence integrity may be compromised.
              data:
                tag: securacv-chain
                importance: high

      - conditions:
          - condition: trigger
            id: offline
        sequence:
          - service: !input notify_service
            data:
              title: "SecuraCV Device Offline"
              message: >-
                Canary {{ trigger.entity_id }} has been unreachable.
              data:
                tag: securacv-offline
                importance: default

      - conditions:
          - condition: trigger
            id: gps_lost
        sequence:
          - service: !input notify_service
            data:
              title: "SecuraCV GPS Fix Lost"
              message: >-
                Canary {{ trigger.entity_id }} lost GPS fix.
                Possible jamming or indoor placement.
              data:
                tag: securacv-gps
                importance: default

mode: parallel
max: 5
