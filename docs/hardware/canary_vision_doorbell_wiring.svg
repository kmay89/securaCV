<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 900" width="960" height="900" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>Canary Vision Doorbell: button and glow ring wiring</title>
  <desc>XIAO D1 reads the button through a 1k resistor with a 100nF filter; XIAO D2 drives a 2N3904 low-side switch for the button's LED ring, which is powered from the XIAO 5V pin. The button's common terminal goes to ground. Below: XIAO D3's PWM audio runs through a two-pole RC filter, a coupling capacitor and a divider into a PAM8302A class-D amplifier powered from 5V, which drives the 36 mm sealed speaker.</desc>
  <rect x="0" y="0" width="960" height="900" fill="#ffffff"/>

  <text x="30" y="40" font-size="20" font-weight="bold" fill="#1d1d1f">Canary Vision Doorbell — button + glow ring</text>
  <text x="30" y="62" fill="#555">All inside the doorbell body. Only the XIAO's 5V, GND, D1, D2 and (v0.8) D3 are used.</text>

  <!-- XIAO -->
  <rect x="40" y="110" width="250" height="440" rx="14" fill="#f4f4f6" stroke="#1d1d1f" stroke-width="2"/>
  <text x="165" y="140" text-anchor="middle" font-weight="bold" fill="#1d1d1f">XIAO ESP32-S3 / -C3</text>
  <text x="165" y="160" text-anchor="middle" fill="#555" font-size="12">stacked on the Grove Vision AI V2</text>
  <text x="165" y="176" text-anchor="middle" fill="#555" font-size="12">D3–D10 are the module's: leave free</text>

  <g>
    <circle cx="290" cy="220" r="6" fill="#d33a2c"/>
    <text x="275" y="224" text-anchor="end" font-weight="bold" fill="#1d1d1f">5V</text>
    <text x="275" y="240" text-anchor="end" fill="#777" font-size="11">USB VBUS</text>

    <circle cx="290" cy="300" r="6" fill="#2b6cb0"/>
    <text x="275" y="304" text-anchor="end" font-weight="bold" fill="#1d1d1f">D1</text>
    <text x="275" y="320" text-anchor="end" fill="#777" font-size="11">button in</text>
    <text x="275" y="334" text-anchor="end" fill="#777" font-size="11">S3 GPIO2 · C3 GPIO3</text>

    <circle cx="290" cy="420" r="6" fill="#c98a00"/>
    <text x="275" y="424" text-anchor="end" font-weight="bold" fill="#1d1d1f">D2</text>
    <text x="275" y="440" text-anchor="end" fill="#777" font-size="11">glow PWM (20 kHz)</text>
    <text x="275" y="454" text-anchor="end" fill="#777" font-size="11">S3 GPIO3 · C3 GPIO4</text>

    <circle cx="290" cy="520" r="6" fill="#1d1d1f"/>
    <text x="275" y="524" text-anchor="end" font-weight="bold" fill="#1d1d1f">GND</text>
  </g>

  <!-- GND rail -->
  <line x1="290" y1="520" x2="910" y2="520" stroke="#1d1d1f" stroke-width="3"/>

  <!-- 5V to LED+ -->
  <polyline points="290,220 720,220 720,250 740,250" fill="none" stroke="#d33a2c" stroke-width="3"/>

  <!-- D1: C2 to GND (with a hop over D2), R5, to NO -->
  <line x1="290" y1="300" x2="420" y2="300" stroke="#2b6cb0" stroke-width="3"/>
  <circle cx="340" cy="300" r="4" fill="#2b6cb0"/>
  <path d="M340,300 L340,412 A8,8 0 0 1 340,428 L340,460" fill="none" stroke="#2b6cb0" stroke-width="3"/>
  <line x1="322" y1="460" x2="358" y2="460" stroke="#1d1d1f" stroke-width="3"/>
  <line x1="322" y1="470" x2="358" y2="470" stroke="#1d1d1f" stroke-width="3"/>
  <line x1="340" y1="470" x2="340" y2="520" stroke="#1d1d1f" stroke-width="3"/>
  <text x="366" y="470" fill="#1d1d1f" font-size="12">C2 100 nF</text>
  <text x="366" y="485" fill="#777" font-size="11">close to the XIAO</text>
  <rect x="420" y="290" width="70" height="20" fill="#ffffff" stroke="#1d1d1f" stroke-width="2"/>
  <text x="455" y="282" text-anchor="middle" fill="#1d1d1f" font-size="12">R5 1 kΩ (ESD)</text>
  <line x1="490" y1="300" x2="740" y2="300" stroke="#2b6cb0" stroke-width="3"/>

  <!-- D2: R3 to Q1 base, R4 base pull-down -->
  <line x1="290" y1="420" x2="470" y2="420" stroke="#c98a00" stroke-width="3"/>
  <rect x="470" y="410" width="70" height="20" fill="#ffffff" stroke="#1d1d1f" stroke-width="2"/>
  <text x="505" y="402" text-anchor="middle" fill="#1d1d1f" font-size="12">R3 1 kΩ</text>
  <line x1="540" y1="420" x2="620" y2="420" stroke="#c98a00" stroke-width="3"/>
  <circle cx="580" cy="420" r="4" fill="#c98a00"/>
  <line x1="580" y1="420" x2="580" y2="445" stroke="#c98a00" stroke-width="3"/>
  <rect x="570" y="445" width="20" height="45" fill="#ffffff" stroke="#1d1d1f" stroke-width="2"/>
  <text x="562" y="473" text-anchor="end" fill="#1d1d1f" font-size="12">R4 10 kΩ</text>
  <line x1="580" y1="490" x2="580" y2="520" stroke="#1d1d1f" stroke-width="3"/>

  <!-- Q1 -->
  <circle cx="652" cy="420" r="32" fill="#ffffff" stroke="#1d1d1f" stroke-width="2"/>
  <line x1="620" y1="420" x2="638" y2="420" stroke="#c98a00" stroke-width="3"/>
  <line x1="638" y1="400" x2="638" y2="440" stroke="#1d1d1f" stroke-width="4"/>
  <line x1="638" y1="410" x2="668" y2="394" stroke="#1d1d1f" stroke-width="2.5"/>
  <line x1="638" y1="430" x2="668" y2="446" stroke="#1d1d1f" stroke-width="2.5"/>
  <polygon points="668,446 656,436 652,445" fill="#1d1d1f"/>
  <text x="626" y="412" fill="#777" font-size="11">B</text>
  <text x="674" y="392" fill="#777" font-size="11">C</text>
  <text x="674" y="460" fill="#777" font-size="11">E</text>
  <text x="694" y="478" fill="#1d1d1f" font-size="12" font-weight="bold">Q1 2N3904</text>
  <text x="694" y="493" fill="#777" font-size="11">flat face toward you: E · B · C</text>
  <polyline points="668,394 668,360 740,360" fill="none" stroke="#7b3fb2" stroke-width="3"/>
  <line x1="668" y1="446" x2="668" y2="520" stroke="#1d1d1f" stroke-width="3"/>

  <!-- Button, rear view -->
  <rect x="740" y="210" width="140" height="190" rx="18" fill="#fffbe6" stroke="#1d1d1f" stroke-width="2"/>
  <circle cx="810" cy="305" r="58" fill="none" stroke="#e8b400" stroke-width="7" opacity="0.75"/>
  <g font-size="12" fill="#1d1d1f">
    <rect x="734" y="244" width="12" height="12" fill="#d33a2c"/>
    <text x="754" y="254">LED +</text>
    <rect x="734" y="294" width="12" height="12" fill="#2b6cb0"/>
    <text x="754" y="304">NO</text>
    <rect x="734" y="354" width="12" height="12" fill="#7b3fb2"/>
    <text x="754" y="364">LED −</text>
    <rect x="874" y="294" width="12" height="12" fill="#1d1d1f"/>
    <text x="866" y="304" text-anchor="end">C</text>
  </g>
  <polyline points="886,300 910,300 910,520" fill="none" stroke="#1d1d1f" stroke-width="3"/>
  <text x="810" y="424" text-anchor="middle" font-weight="bold" fill="#1d1d1f">BTN2 (rear view)</text>
  <text x="810" y="441" text-anchor="middle" fill="#777" font-size="11">12 mm illuminated momentary</text>
  <text x="810" y="455" text-anchor="middle" fill="#777" font-size="11">6 V LED version · IP65+</text>

  <g font-size="12" fill="#1d1d1f">
    <text x="30" y="586" font-weight="bold">Press:</text>
    <text x="80" y="586">NO closes D1 to GND (internal pull-up · 30 ms debounce · edges timestamped by an interrupt).</text>
    <text x="30" y="606" font-weight="bold">Glow:</text>
    <text x="80" y="606">D2 switches Q1, and Q1 sinks the LED's cathode: the LED never hangs off a GPIO.</text>
    <text x="30" y="626" font-weight="bold">Dark:</text>
    <text x="80" y="626">R4 holds the ring off while D2 floats (at boot, and on any Vision whose doorbell is switched off).</text>
  </g>

  <!-- ===== v0.8: the speaker ===== -->
  <line x1="30" y1="648" x2="930" y2="648" stroke="#ddd" stroke-width="1"/>
  <text x="30" y="676" font-size="16" font-weight="bold" fill="#1d1d1f">The speaker (v0.8) — XIAO D3 → filter → PAM8302A → 36 mm sealed driver</text>

  <!-- D3 pad -->
  <circle cx="60" cy="740" r="6" fill="#2a9d8f"/>
  <text x="52" y="724" fill="#1d1d1f" font-weight="bold">D3</text>
  <text x="30" y="770" fill="#777" font-size="11">PWM audio 78 kHz</text>
  <text x="30" y="784" fill="#777" font-size="11">S3 GPIO4 · C3 GPIO5</text>

  <!-- R6, C3, R7, C5 -->
  <line x1="60" y1="740" x2="100" y2="740" stroke="#2a9d8f" stroke-width="3"/>
  <rect x="100" y="730" width="50" height="20" fill="#ffffff" stroke="#1d1d1f" stroke-width="2"/>
  <text x="125" y="722" text-anchor="middle" fill="#1d1d1f" font-size="12">R6 1 kΩ</text>
  <line x1="150" y1="740" x2="210" y2="740" stroke="#2a9d8f" stroke-width="3"/>
  <circle cx="180" cy="740" r="4" fill="#2a9d8f"/>
  <line x1="180" y1="740" x2="180" y2="790" stroke="#2a9d8f" stroke-width="3"/>
  <line x1="164" y1="790" x2="196" y2="790" stroke="#1d1d1f" stroke-width="3"/>
  <line x1="164" y1="800" x2="196" y2="800" stroke="#1d1d1f" stroke-width="3"/>
  <line x1="180" y1="800" x2="180" y2="850" stroke="#1d1d1f" stroke-width="3"/>
  <text x="200" y="800" fill="#1d1d1f" font-size="12">C3 22 nF</text>
  <rect x="210" y="730" width="50" height="20" fill="#ffffff" stroke="#1d1d1f" stroke-width="2"/>
  <text x="235" y="722" text-anchor="middle" fill="#1d1d1f" font-size="12">R7 1 kΩ</text>
  <line x1="260" y1="740" x2="320" y2="740" stroke="#2a9d8f" stroke-width="3"/>
  <circle cx="290" cy="740" r="4" fill="#2a9d8f"/>
  <line x1="290" y1="740" x2="290" y2="790" stroke="#2a9d8f" stroke-width="3"/>
  <line x1="274" y1="790" x2="306" y2="790" stroke="#1d1d1f" stroke-width="3"/>
  <line x1="274" y1="800" x2="306" y2="800" stroke="#1d1d1f" stroke-width="3"/>
  <line x1="290" y1="800" x2="290" y2="850" stroke="#1d1d1f" stroke-width="3"/>
  <text x="310" y="800" fill="#1d1d1f" font-size="12">C5 22 nF</text>

  <!-- C4 coupling, R8/R9 divider -->
  <line x1="326" y1="728" x2="326" y2="752" stroke="#1d1d1f" stroke-width="3"/>
  <line x1="336" y1="728" x2="336" y2="752" stroke="#1d1d1f" stroke-width="3"/>
  <text x="331" y="722" text-anchor="middle" fill="#1d1d1f" font-size="12">C4 1 µF</text>
  <line x1="336" y1="740" x2="400" y2="740" stroke="#2a9d8f" stroke-width="3"/>
  <circle cx="370" cy="740" r="4" fill="#2a9d8f"/>
  <rect x="360" y="755" width="20" height="40" fill="#ffffff" stroke="#1d1d1f" stroke-width="2"/>
  <text x="386" y="780" fill="#1d1d1f" font-size="12">R9 2.2 kΩ</text>
  <line x1="370" y1="795" x2="370" y2="850" stroke="#1d1d1f" stroke-width="3"/>
  <rect x="400" y="730" width="50" height="20" fill="#ffffff" stroke="#1d1d1f" stroke-width="2"/>
  <text x="425" y="722" text-anchor="middle" fill="#1d1d1f" font-size="12">R8 10 kΩ</text>
  <text x="425" y="765" text-anchor="middle" fill="#777" font-size="11">(R8 before R9: ~0.6 V peak)</text>
  <line x1="450" y1="740" x2="520" y2="740" stroke="#2a9d8f" stroke-width="3"/>

  <!-- amplifier -->
  <rect x="520" y="690" width="170" height="130" rx="10" fill="#f4f4f6" stroke="#1d1d1f" stroke-width="2"/>
  <text x="605" y="712" text-anchor="middle" font-weight="bold" fill="#1d1d1f">AMP1 PAM8302A</text>
  <text x="605" y="727" text-anchor="middle" fill="#777" font-size="11">class-D, 2.5 W into 4 Ω</text>
  <text x="528" y="745" fill="#1d1d1f" font-size="12">A+</text>
  <text x="528" y="775" fill="#1d1d1f" font-size="12">A−</text>
  <text x="528" y="805" fill="#1d1d1f" font-size="12">GND</text>
  <text x="640" y="745" fill="#1d1d1f" font-size="12">VIN · SD</text>
  <text x="662" y="790" fill="#1d1d1f" font-size="12">+</text>
  <text x="662" y="812" fill="#1d1d1f" font-size="12">−</text>
  <!-- A- to GND via 1 uF -->
  <line x1="520" y1="770" x2="480" y2="770" stroke="#1d1d1f" stroke-width="3"/>
  <line x1="470" y1="758" x2="470" y2="782" stroke="#1d1d1f" stroke-width="3"/>
  <line x1="460" y1="758" x2="460" y2="782" stroke="#1d1d1f" stroke-width="3"/>
  <line x1="460" y1="770" x2="440" y2="770" stroke="#1d1d1f" stroke-width="3"/>
  <line x1="440" y1="770" x2="440" y2="850" stroke="#1d1d1f" stroke-width="3"/>
  <text x="446" y="800" fill="#1d1d1f" font-size="12">1 µF</text>
  <!-- GND -->
  <line x1="520" y1="800" x2="500" y2="800" stroke="#1d1d1f" stroke-width="3"/>
  <line x1="500" y1="800" x2="500" y2="850" stroke="#1d1d1f" stroke-width="3"/>
  <line x1="60" y1="850" x2="930" y2="850" stroke="#1d1d1f" stroke-width="3"/>
  <text x="900" y="868" fill="#1d1d1f" font-weight="bold" font-size="12">GND</text>
  <!-- 5V -->
  <polyline points="690,740 720,740 720,700 740,700" fill="none" stroke="#d33a2c" stroke-width="3"/>
  <circle cx="740" cy="700" r="6" fill="#d33a2c"/>
  <text x="752" y="704" fill="#1d1d1f" font-weight="bold">XIAO 5V</text>
  <!-- speaker -->
  <line x1="690" y1="786" x2="740" y2="786" stroke="#2a9d8f" stroke-width="3"/>
  <line x1="690" y1="808" x2="740" y2="808" stroke="#2a9d8f" stroke-width="3"/>
  <rect x="740" y="770" width="24" height="54" fill="#ffffff" stroke="#1d1d1f" stroke-width="2"/>
  <polygon points="764,770 820,745 820,849 764,824" fill="#fffbe6" stroke="#1d1d1f" stroke-width="2"/>
  <text x="840" y="790" fill="#1d1d1f" font-weight="bold" font-size="12">SPK1</text>
  <text x="840" y="805" fill="#777" font-size="11">36 mm sealed, 4 Ω, 3 W</text>
  <text x="840" y="819" fill="#777" font-size="11">~90 dB at 1 m with AMP1</text>

  <text x="30" y="890" fill="#1d1d1f" font-size="12"><tspan font-weight="bold">Sound:</tspan> a two-note chime on a sealed ring, a soft tick on a repeat, three reply tones from Home Assistant. Tones only — no microphone, no voice.</text>
</svg>
