# ---------------------------------------------------------------------------

[[vehicle]]
id = "toyota-corolla-2020-newer"
make = "Toyota"
model = "Corolla"
years = "2020-newer"
dbc = "docs/hardware/vehicle_dbc/toyota_2017_pt_excerpt.dbc"
status = "documented-platform-mismatch"
notes = """
⚠️ The only Toyota powertrain excerpt sourced so far is upstream-named "2017_ref" — a reference
template, not confirmed to match the TNGA-platform Corolla (a substantial redesign starting
MY2020). B_P ("boolean Park") is a transmission-range flag on the ECT1S92 message; if it exists
on a 2020+ Corolla's bus at all, the CAN ID/byte/mask may well differ. This is the LEAST confident
profile in this file — bench-sniffing (candump while shifting through P/R/N/D) is the honest next
step before trusting any of it, not an optional nice-to-have like the Honda/VW entries.
"""

[[vehicle.signal]]
name = "transmission_in_park"
message = "ECT1S92"
signal = "B_P"
can_id = "0x3BC"
byte_offset = 1
mask = "0x20"
kind = "vehicle_arrival_departure"
zone = "garage"

# ---------------------------------------------------------------------------

[[vehicle]]
id = "volkswagen-mqb-2015-newer"
make = "Volkswagen"
model = "MQB platform (generic — VW/Audi/SEAT/Škoda, most 2015+ via the J533 gateway)"
years = "2015-newer"
dbc = "docs/hardware/vehicle_dbc/vw_mqb_excerpt.dbc"
status = "documented"
notes = """
Generic MQB platform profile — no specific VW model/year was given, so this targets the shared
gateway messages common across the platform family rather than one model. ZAS_Kl_15 ("Klemme 15")
is the standard VAG term for switched ignition power — the closest thing to a textbook "ignition
on" signal found across any of the three brands researched here, and the strongest single-signal
candidate in this whole file. Tell Claude your exact VW model/year for a tighter, less-generic
profile.
"""

[[vehicle.signal]]
name = "ignition_on"
message = "Klemmen_Status_01"
signal = "ZAS_Kl_15"
can_id = "0x3C0"
byte_offset = 2
mask = "0x02"
kind = "vehicle_arrival_departure"
zone = "garage"
