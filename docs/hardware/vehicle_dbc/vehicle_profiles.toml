# Canary Vehicle — per-vehicle CAN signal profiles.
#
# Every (can_id, byte_offset, mask) below was RESOLVED from the vendored DBC excerpts by
# scripts/dbc_signal_resolve.py, never hand-typed — `check-profiles` re-derives them on every CI
# run and fails if a profile drifts from what its DBC actually says. See
# docs/hardware/canary_vehicle_profiles.md for the full picture, and SOURCES.md for where each
# DBC excerpt came from.
#
# `status` is honest, not aspirational — same discipline as firmware/boards/boards.json's
# compile-tested -> verified tiers:
#   "documented"                — signal exists in a real, sourced DBC; nothing bench-confirmed
#   "documented-platform-mismatch" — signal exists in a DBC that may not match this exact
#                                     vehicle's actual generation/platform; treat with more doubt
#   "bench-confirmed"           — measured against a real vehicle (none yet — this file has none)
#
# Regenerate a resolve line for any signal:
#   python3 scripts/dbc_signal_resolve.py resolve <dbc> <message> <signal>

[[vehicle]]
id = "honda-pilot-2016-2022"
make = "Honda"
model = "Pilot"
years = "2016-2022"
dbc = "docs/hardware/vehicle_dbc/honda_common_excerpt.dbc"
status = "documented"
notes = """
Honda Sensing trim, per openpilot's own CARS.md (comma.ai) — a good cross-check that this
generation's CAN bus is well-trodden territory, though that doc describes ADAS support, not this
project's presence-claim usage. DOORS_STATUS is from the shared Honda body-CAN template
(_honda_common.dbc) used broadly across this era's Honda/Acura lineup — believed to apply, not
confirmed on an actual Pilot yet. A single door bit is a proxy for "someone is getting in or out,"
not a clean arrival/departure split by itself — see the doc's §4 roadmap for pairing it with a
second signal.
"""

[[vehicle.signal]]
name = "driver_door_open"
message = "DOORS_STATUS"
signal = "DOOR_OPEN_FL"
can_id = "0x405"
byte_offset = 4
mask = "0x20"
kind = "vehicle_arrival_departure"
zone = "garage"

# ---------------------------------------------------------------------------

[[vehicle]]
id = "honda-odyssey-2011-2017-gen4"
make = "Honda"
model = "Odyssey (4th gen)"
years = "2011-2017"
dbc = "docs/hardware/vehicle_dbc/honda_common_excerpt.dbc"
status = "documented-platform-mismatch"
notes = """
⚠️ A 2017 Odyssey is 4th-generation (2011-2017) — a DIFFERENT platform generation from the
5th-gen redesign that started at MY2018. Don't assume this profile and the 2018+ profile below
share a bus layout just because both say "Odyssey." The _honda_common.dbc template this excerpt
comes from is dated to Honda's more recent (~2016+) body-CAN convention (EON/BDY naming matches
comma.ai's Honda Bosch/Nidec-era ports); whether a 2017 Gen4 Odyssey's body module actually
matches it is UNCONFIRMED — more likely to need bench correction than the newer Gen5 profile.
Treat every byte/mask here as a starting hypothesis for the bench, not a working config.
"""

[[vehicle.signal]]
name = "driver_door_open"
message = "DOORS_STATUS"
signal = "DOOR_OPEN_FL"
can_id = "0x405"
byte_offset = 4
mask = "0x20"
kind = "vehicle_arrival_departure"
zone = "garage"

