# Standalone workspace root: this crate lives inside the securaCV repo, which
# has its own root Cargo.toml (the witness-kernel). Declaring an empty
# [workspace] here stops Cargo from trying to fold the flasher into that
# package's build.
[workspace]

[package]
name = "securacv-flasher"
version = "0.11.9"
description = "SecuraCV Canary Flasher — the Lab as a native desktop app"
authors = ["Errer Labs"]
license = "Apache-2.0"
repository = "https://github.com/kmay89/securaCV"
edition = "2021"
# Current Tauri v2 transitive dependencies require Rust 1.88 or newer.
rust-version = "1.88"

# The library the binary and (future) tests share.
[lib]
name = "securacv_flasher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The Raspberry Pi hub writer: decisions (hub-core) and mechanisms (hub-io)
# live in their own PR-CI-tested crates; this app only translates and
# orchestrates (src/hub.rs).
hub-core = { path = "../hub-core" }
hub-io = { path = "../hub-io" }
# The ESP32 flash engine — catalog guards, release verification, NVS
# provisioning, the change map, intake, the espflash argv, the flash pipeline
# and the boot-receipt monitor — shared with the Lab (desktop-lab/src-tauri)
# and PR-CI-tested on its own; this app keeps the Tauri commands over it and
# the sidecar spawn (launch_guard::spawn_tracked).
flash-engine = { path = "../flash-engine" }
base64 = "0.23"
ed25519-dalek = "3"
# OS randomness for the whoami challenge nonce. Already in the lock via
# transitive deps, so declaring it directly adds no new tree.
getrandom = "0.4"
sha2 = "0.11"
tempfile = "3"
# Native serial-port enumeration — the whole point of going native: no
# Web Serial, no Chromium. `serialport` talks to the OS directly.
serialport = "4"
# HTTPS download of the signed factory image + live manifest. rustls so we
# don't drag in OpenSSL on any of the three platforms.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tauri-plugin-notification = "2"
libc = "0.2.189"
# The fleet book's LAN discovery: a real browse of `_securacv._tcp` (pure
# Rust, std sockets) — the OS resolver alone can find `.local` HOSTNAMES but
# cannot enumerate a service, and vision/sense announce mDNS-only.
mdns-sd = "0.21"

# The secret drawer behind setup profiles and per-device API tokens: the OS
# credential store, one keyring feature set per platform. On Linux it is the
# freedesktop Secret Service (GNOME Keyring, KDE Wallet's bridge) over D-Bus
# through keyring's synchronous `dbus-secret-service` backend — libdbus-1 is
# ALREADY linked by tao (dbus 0.9 / libdbus-sys in this lock), so this adds
# no -sys crate and no apt package. `crypto-rust` must be KEYRING's feature:
# keyring picks the session type from its own feature flags, and without one
# it opens a Plain session — every secret crossing the session bus in the
# clear. With it the session is DH + AES, in pure Rust (no OpenSSL). Cargo
# writes the lock from the feature's weak `secret-service?/crypto-rust` half
# too, so the lock also lists the async backend's zbus 4 tree; none of it is
# built on any target (`cargo tree -e normal --target all -i zbus@4.4.0`
# prints nothing). A desktop without a Secret Service still gets a build
# that runs: secret_store.rs PROBES the bus once and answers "none" when
# nothing serves it, and the frontend falls back to its local settings,
# saying so out loud. Kept on keyring 3 on purpose: the macOS/Windows
# branches have no CI, and a 4.x migration should be its own PR compiled on
# a Mac.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[features]
# By default Tauri uses a custom protocol on Windows/Linux; nothing to gate
# here yet, but the block keeps parity with the workspace convention.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# A flasher is not a hot loop; optimize for a small, quick-to-download bundle
# ("feels like magic" starts with a fast download).
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
