# Fly.io: the public demo on their free allowance.
#   fly launch --config backoffice/deploy/fly.toml --copy-config --no-deploy   (pick a name + region)
#   fly deploy --config backoffice/deploy/fly.toml --dockerfile backoffice/deploy/Dockerfile
# Then open https://<name>.fly.dev — the login page shows the demo credentials.
app = "securacv-backoffice-demo"
primary_region = "iad"

[build]
  dockerfile = "backoffice/deploy/Dockerfile"

[env]
  BACKOFFICE_DEMO = "1"
  BACKOFFICE_DEMO_RESET_MINUTES = "60"
  BACKOFFICE_HOST = "0.0.0.0"
  BACKOFFICE_PORT = "8787"
  BACKOFFICE_DATA_DIR = "/data"
  COMPANY_NAME = "Errer Labs"
  PRODUCT_NAME = "SecuraCV"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
