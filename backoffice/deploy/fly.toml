# Fly.io: the public demo on their free allowance. Run from backoffice/ (the
# Dockerfile copies package.json, bin/ and src/ relative to it); the build
# happens on Fly's remote builder, so no local Docker is needed.
#   cd backoffice
#   fly apps create <your-app-name>            # names are global on Fly; pick your own
#   fly deploy --config deploy/fly.toml --app <your-app-name>
# Then open https://<your-app-name>.fly.dev — the login page shows the demo credentials.
app = "securacv-backoffice-demo"
primary_region = "iad"

[build]
  # flyctl resolves this relative to THIS file's folder (deploy/); the build
  # context is the directory you run from (backoffice/).
  dockerfile = "Dockerfile"

# One volume, one machine. Without this Fly runs two machines with two
# separate SQLite files: a login on one is unknown to the other, so every
# other page bounces to the login screen. The workflow creates the volume.
[mounts]
  source = "backoffice_demo_data"
  destination = "/data"

[env]
  BACKOFFICE_DEMO = "1"
  BACKOFFICE_DEMO_RESET_MINUTES = "60"
  BACKOFFICE_HOST = "0.0.0.0"
  BACKOFFICE_PORT = "8787"
  BACKOFFICE_DATA_DIR = "/data"
  COMPANY_NAME = "Errer Labs"
  PRODUCT_NAME = "SecuraCV"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
