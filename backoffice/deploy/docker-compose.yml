# From backoffice/:  docker compose -f deploy/docker-compose.yml --env-file .env up -d
# Then once:         docker compose -f deploy/docker-compose.yml exec backoffice node bin/backoffice.mjs setup --password '…'
services:
  backoffice:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    env_file: ../.env
    environment:
      BACKOFFICE_HOST: 0.0.0.0
      BACKOFFICE_DATA_DIR: /data
    volumes:
      - backoffice-data:/data
    ports:
      - "127.0.0.1:8787:8787"   # loopback only; Caddy terminates TLS
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  backoffice-data:
  caddy-data:
  caddy-config:
