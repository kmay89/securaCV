# The real-Home-Assistant lane. Run it with its OWN ini and a conftest cutoff
# so neither the repo-root stub conftest nor the integration's stub-lane
# conftest (custom_components/securacv/tests/conftest.py) is ever collected:
#
#   pytest -c tests/ha/pytest.ini --confcutdir=tests/ha tests/ha
#
# pytest-homeassistant-custom-component registers itself through its
# `pytest11` entry point (no `pytest_plugins` line anywhere), and its `hass`
# fixture needs pytest-asyncio's auto mode. `pythonpath` is relative to this
# file's directory and puts the repository root on sys.path so the loader
# finds `custom_components/securacv`.
[pytest]
asyncio_mode = auto
pythonpath = ../..
testpaths = .
filterwarnings =
    error::DeprecationWarning:custom_components.securacv
