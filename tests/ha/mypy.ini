# mypy for the real-Home-Assistant lane: the integration against the installed
# core, on the interpreter the core runs on. Unlike pyproject.toml's section
# (the stub lane, where Home Assistant is NOT installed and its imports are
# treated as untyped), nothing is ignored here: every homeassistant.* import
# must resolve and type-check, config_flow included.
#
#   mypy --config-file tests/ha/mypy.ini --python-version 3.14
#
# Module names are rooted at `securacv` (custom_components/ is not a package).
[mypy]
python_version = 3.14
files = custom_components/securacv
warn_unused_ignores = True
# Stub-lane tests drive hand-written stubs mypy cannot model; the lane's own
# tests (tests/ha) are not type-checked either, by design.
[mypy-securacv.tests.*]
ignore_errors = True
