# SecuraCV — native iOS companion, generated reproducibly by XcodeGen.
#
# The Xcode project is NOT committed. It is regenerated from this spec
# (`xcodegen generate`) on every build and every night, so it can never rot or
# drift — exactly the "one source of truth / anti-rot" rule the desktop apps
# follow (their Tauri Xcode project is likewise generated from config). Edit
# THIS file, never a .pbxproj.
#
# Version follows the DESKTOP-app precedent, not the kernel line: this app
# versions independently, ships on its own `ios-v*` tag, and stays OUT of
# scripts/lint_version_sync.sh's four-file set (which governs only the
# kernel / HA-integration / add-on product line). Bump it here and nowhere else.

name: SecuraCV

# Local overrides that survive regeneration — mainly your signing team, so a
# regenerated project opened in Xcode's GUI (which has no shell env) still
# signs: git-ignored `local.yml`, merged AFTER this spec by
# `scripts/heal.sh generate` (XcodeGen has no optional include, so this file
# never references it — a bare `xcodegen generate` must always work).
# heal.sh seeds it from $APPLE_DEVELOPMENT_TEAM; see DEMO.md. Shape:
#   settings: { base: { APPLE_DEVELOPMENT_TEAM: "ABCDE12345" } }

options:
  bundleIdPrefix: com.securacv
  deploymentTarget:
    iOS: "17.0"          # Live Activities / Dynamic Island need 16.1+; we floor
                         # at 17 so the load-bearing APIs are frozen, not fresh.
    watchOS: "11.0"      # RFC apple_watch_and_notifications.md §9 #3: floor 11
                         # (Live Activities reach the Smart Stack), enhance on
                         # newer releases rather than requiring them.
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.5.3"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    # The hand-written Support/*.plist files carry only what we author;
    # Xcode generates and MERGES the required identity boilerplate
    # (CFBundleIdentifier/Executable/PackageType) for every target — without
    # this the built .app has no bundle identifier and won't install or test.
    GENERATE_INFOPLIST_FILE: YES
    DEVELOPMENT_TEAM: "$(APPLE_DEVELOPMENT_TEAM)"   # supplied by env / CI, never committed
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal          # tighten to `complete` once building on a Mac
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"                   # iPhone + iPad, one binary, every screen
    # Build identity for the About/Health panel. Defaults here; CI overrides on
    # the xcodebuild command line with the real git rev + firmware train (see
    # scripts/stamp_build.sh and the ios workflows) — no generated file to drift.
    SECURACV_BUILD_REV: "dev"
    SECURACV_FW_TRAIN: "0.x"

targets:
  SecuraCV:
    type: application
    platform: iOS
    sources:
      - path: Sources/SecuraCV
      - path: Shared
      # Generated by scripts/make_app_icon.py and committed (same contract as
      # the tvOS icon) — App Store Connect refuses an .ipa without an icon.
      - path: Assets.xcassets
      # The canary's chirp (scripts/make_chirp.py, generated + committed) —
      # a unit test asserts it made it into the bundle.
      - path: Sounds
    dependencies:
      - target: SecuraCVWidgets
      - target: SecuraCVNotificationService
      # XcodeGen embeds a watchOS application dependency via an
      # "Embed Watch Content" phase — the watch app ships INSIDE this app's
      # .ipa, so it can never version-drift from the phone (RFC §7: a row,
      # not a snowflake; no new release-catalog entry).
      - target: SecuraCVWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.securacv.witness
        INFOPLIST_FILE: Support/Info.plist
        # Indirection so CI can pick the app's entitlements per run (the
        # release workflow's critical_alerts input) without a bare
        # CODE_SIGN_ENTITLEMENTS command-line override, which would hit the
        # widget/NSE targets too and break their signing.
        SECURACV_APP_ENTITLEMENTS: Support/SecuraCV.entitlements
        CODE_SIGN_ENTITLEMENTS: "$(SECURACV_APP_ENTITLEMENTS)"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
      configs:
        Debug:
          # Dev builds sign WITHOUT the Apple-granted Critical Alerts
          # entitlement (automatic signing rejects it for any team not yet
          # granted it), so "press Run on your iPhone" works with a plain
          # developer team. Release defaults to the full set; the release
          # workflow overrides SECURACV_APP_ENTITLEMENTS until the grant.
          SECURACV_APP_ENTITLEMENTS: Support/SecuraCV.dev.entitlements

  SecuraCVWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/SecuraCVWidgets
      - path: Shared                                 # FleetActivityAttributes is shared verbatim
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.securacv.witness.widgets
        INFOPLIST_FILE: Support/Widgets-Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/Widgets.entitlements

  SecuraCVNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/SecuraCVNotificationService
      # ONE shared file, deliberately not the whole Shared/ directory: this
      # extension links neither SwiftUI nor WidgetKit nor the fleet model, and
      # pulling all of Shared in would drag them along. WakePayload.swift is
      # pure Foundation for exactly this reason — it lets the app and the NSE
      # agree on what a wake means without the NSE growing a dependency.
      - path: Shared/WakePayload.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.securacv.witness.nse
        INFOPLIST_FILE: Support/NSE-Info.plist

  # ── SecuraCV on your wrist ─────────────────────────────────────────────
  # A modern single-target watchOS app, companion to (and embedded in) the
  # iPhone app above. Two rules keep it sync-proof:
  #   * It declares NO MARKETING_VERSION of its own — it inherits the base
  #     one. The release tag guard and the release planner both read the
  #     FIRST MARKETING_VERSION in this file, so a target-scoped copy would
  #     silently split the app's version story. Never add one.
  #   * Entitlements are a fixed file (nothing here needs an Apple grant),
  #     so the release workflow's SECURACV_APP_ENTITLEMENTS override touches
  #     only the iPhone app target, exactly as before.
  SecuraCVWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: Sources/SecuraCVWatch
      - path: Shared                                 # the WristSnapshot contract + enums + Theme
      # Generated by scripts/make_app_icon.py and committed (same contract as
      # the iPhone icon) — a watch app without an icon fails App Store
      # validation with the phone app it ships inside.
      - path: WatchAssets.xcassets
    dependencies:
      - target: SecuraCVWatchWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.securacv.witness.watchkitapp
        INFOPLIST_FILE: Support/Watch-Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/Watch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"                  # watch — the project-level "1,2" must not leak in

  SecuraCVWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: Sources/SecuraCVWatchWidgets
      - path: Shared                                 # renders the same WristSnapshot from the watch-local cache
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.securacv.witness.watchkitapp.widgets
        INFOPLIST_FILE: Support/WatchWidgets-Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/WatchWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "4"

  SecuraCVTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/SecuraCVTests
    dependencies:
      - target: SecuraCV                             # tests use `@testable import SecuraCV`

schemes:
  SecuraCV:
    build:
      targets:
        SecuraCV: all
    test:
      targets:
        - SecuraCVTests
      gatherCoverageData: true
