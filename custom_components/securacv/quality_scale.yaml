# Integration Quality Scale self-assessment (the 54 rules, hyphenated ids, in
# the shape script/hassfest/quality_scale.py validates for core integrations).
# hassfest does not grade a custom integration; tests/test_quality_scale.py
# holds this file to the rule set, the value schema, and to the code for the
# rules a test can check (runtime-data, parallel-updates, icon-translations,
# diagnostics, reauthentication-flow, reconfiguration-flow, repair-issues,
# stale-devices). Honest: `todo` where the work is not done, `exempt` with
# the reason where a rule does not apply.
rules:
  # ── Bronze ──────────────────────────────────────────────────────────
  action-setup: done
  appropriate-polling:
    status: done
    comment: >-
      Push-fed by the kernel's retained MQTT topics; the HTTP backstop runs
      every five minutes (coordinator.HEALTH_BACKSTOP_INTERVAL) and adds no
      receipt rows to the kernel's export ledger.
  brands: done
  common-modules:
    status: done
    comment: coordinator.py, entity.py, api.py, data.py.
  config-flow: done
  config-flow-test-coverage:
    status: todo
    comment: >-
      Every step is covered in the stub lane (tests/test_config_flow*.py);
      the real-Home-Assistant lane (pytest-homeassistant-custom-component)
      is W7's job and is what this rule asks for.
  dependency-transparency:
    status: done
    comment: No requirements; cryptography ships with Home Assistant core.
  docs-actions:
    status: todo
    comment: >-
      docs/homeassistant_setup.md documents the three watch actions; W8 adds
      securacv.verify and securacv.export_evidence (services.yaml and
      strings.json already describe both).
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions:
    status: todo
    comment: W8 adds the removal section to docs/homeassistant_setup.md.
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  entity-event-setup:
    status: done
    comment: >-
      Every subscription (MQTT, dispatcher) is made in async_added_to_hass and
      released through async_on_remove — the event and button platforms
      included; tests/test_mqtt_lifecycle.py holds every entity to it.
  entity-unique-id: done
  has-entity-name: done
  runtime-data:
    status: done
    comment: data.SecuraCVRuntimeData on entry.runtime_data; the alias is SecuraCVConfigEntry.
  test-before-configure:
    status: done
    comment: Every kernel path reads GET /api/identity before an entry is created.
  test-before-setup:
    status: done
    comment: >-
      ConfigEntryNotReady when MQTT is unavailable in mqtt/both modes;
      async_config_entry_first_refresh in kernel-only mode; `both` mode is
      deliberately tolerant of a kernel that is down so the Canaries keep
      reporting.
  unique-config-entry:
    status: done
    comment: kernel_<device_id> for every kernel entry, mqtt_<prefix> for MQTT-only.

  # ── Silver ──────────────────────────────────────────────────────────
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters:
    status: todo
    comment: W8 documents the options (evidence_keep, the trust-store menu).
  docs-installation-parameters:
    status: todo
    comment: W8 documents the pairing code, the token file path and the prefixes.
  entity-unavailable:
    status: done
    comment: >-
      Kernel entities follow witness/status OR the HTTP backstop; Canary
      entities follow their own status / availability last-will topics.
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: >-
      The coordinator logs the backstop failing and recovering once each;
      witness/status and Canary offline/online transitions log once each.
  parallel-updates:
    status: done
    comment: >-
      0 on the push-fed platforms (sensor, binary_sensor, event); 1 on button,
      whose presses are actions against one kernel.
  reauthentication-flow:
    status: done
    comment: ConfigEntryAuthFailed on a definitive 401; reauth_confirm re-pairs or re-points the token file.
  test-coverage:
    status: todo
    comment: The real-Home-Assistant lane with coverage is W7's.

  # ── Gold ────────────────────────────────────────────────────────────
  devices: done
  diagnostics:
    status: done
    comment: async_redact_data over a projected result; nothing raw is copied in.
  discovery:
    status: done
    comment: Supervisor discovery (the app) and MQTT (the sidecar's signed announce).
  discovery-update-info:
    status: done
    comment: >-
      A rediscovered app updates the entry's URL, token file and prefix
      through _abort_if_unique_id_configured(updates=..., reload_on_update=True).
  docs-data-update:
    status: todo
    comment: W8 documents push vs the five-minute backstop.
  docs-examples:
    status: todo
    comment: W8 ships the automation examples beside the blueprints.
  docs-known-limitations:
    status: todo
    comment: W8.
  docs-supported-devices:
    status: todo
    comment: W8.
  docs-supported-functions:
    status: todo
    comment: W8.
  docs-troubleshooting:
    status: todo
    comment: W8.
  docs-use-cases:
    status: todo
    comment: W8.
  dynamic-devices:
    status: done
    comment: Canaries are added as they first report on the status topic.
  entity-category:
    status: done
    comment: >-
      Storage, adapter-host, the Frigate link and the kernel key fingerprint
      are EntityCategory.DIAGNOSTIC.
  entity-device-class: done
  entity-disabled-by-default:
    status: todo
    comment: The per-type tamper and transport sensors should ship disabled by default (stage c).
  entity-translations: done
  exception-translations:
    status: done
    comment: Every securacv.* refusal carries a translation key (tests/test_exception_translations.py).
  icon-translations: done
  reconfiguration-flow:
    status: done
    comment: reconfigure moves the URL, credential and prefixes; a different kernel is refused (wrong_kernel).
  repair-issues:
    status: done
    comment: >-
      Only actionable conditions are issues (repairs.py); tofu_mismatch has
      a fix flow; facts are PROBLEM sensors.
  stale-devices:
    status: done
    comment: async_remove_config_entry_device lets a Canary that left the fleet be deleted.

  # ── Platinum ────────────────────────────────────────────────────────
  async-dependency:
    status: done
    comment: No third-party library; the in-package client is async over aiohttp.
  inject-websession:
    status: done
    comment: async_get_clientsession everywhere a request is made.
  strict-typing:
    status: todo
    comment: >-
      mypy runs against real Home Assistant in the 3.14 venv but the package
      is not yet strict (config_flow and tests are ignore_errors in pyproject).
