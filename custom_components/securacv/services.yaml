# The securacv.* actions: the three watch actions, the chain walk and the
# evidence export. Pinning, rotating and unpinning a device key stay
# human-only in the options flow and the Repairs fix flow
# (docs/device_trust.md, "Why pin, rotate and unpin are not actions");
# services never mutate trust. The names and descriptions are repeated in
# strings.json / translations/en.json, which is what Home Assistant renders;
# keep the three in step.

start_watch:
  name: Start a watch
  description: >-
    Starts a bounded, self-expiring watch on something the fleet already
    senses. Adds attention only: it cannot arm, disarm or unseal anything,
    and it never turns on new sensing. Returns the watch, including the id
    that End a watch takes.
  fields:
    subject:
      name: Subject
      description: >-
        What to keep an eye on, the way you would say it. A Canary's name
        binds the watch to that device's witness events; anything else is
        accepted but stays unfed until something in the fleet reports it.
      required: true
      example: "the gate canary"
      selector:
        text:
    duration:
      name: Duration
      description: >-
        How long, in days, weeks, months, seasons or years: "two weeks",
        "10 days", "a month". A duration with none of those units ("48
        hours") is refused, not guessed. 14 days if left out; never longer
        than a year.
      required: false
      example: "two weeks"
      selector:
        text:
    concern:
      name: Concern
      description: >-
        What to tell you about. Left out, it is read off the subject's
        wording ("if it stops reporting"), or it is "if anything changes".
      required: false
      example: unusual
      selector:
        select:
          options:
            - value: stopped
              label: "if it stops"
            - value: unusual
              label: "if anything changes"
            - value: more
              label: "if it goes up"
            - value: less
              label: "if it drops"
            - value: every
              label: "every time"

end_watch:
  name: End a watch
  description: >-
    Ends a watch early and removes it. Name it by its id (from Start a
    watch or List watches) or by its label; a label two watches share is
    refused rather than guessed. The early end is announced like an
    expiry. Returns the watch as it ended.
  fields:
    watch:
      name: Watch
      description: The watch's id, or its label as you said it.
      required: true
      example: "the gate canary"
      selector:
        text:

list_watches:
  name: List watches
  description: >-
    Returns the watches currently running, each with its state, what it is
    bound to and how many days it has left. Response only.

verify:
  name: Verify the witness chain
  description: >-
    Walks the kernel's sealed log now and checks every entry's hash link
    and Ed25519 signature against the key Home Assistant pinned when it
    connected. Only this walk earns an event its "Verified" mark; the
    kernel's own self-check never does. Returns the verdict, how many new
    entries verified and the bucket the walk ran in.
  fields:
    entry_id:
      name: Kernel
      description: >-
        Which SecuraCV entry to verify, when more than one has a witness
        kernel. The only one if left out.
      required: false
      selector:
        config_entry:
          integration: securacv

export_evidence:
  name: Export evidence
  description: >-
    Downloads the kernel's signed evidence bundle for the last N hours and
    writes ONE zip under the configuration directory (securacv/evidence,
    readable by Home Assistant only): the bundle verbatim, the offline
    viewer, a README for the recipient and the witness key. A persistent
    notification carries a download link valid 24 hours; the pack is also
    under Media → SecuraCV evidence. Nothing is added to, removed from or
    re-serialized in the bundle.
  fields:
    window_hours:
      name: Window
      description: How far back, in whole hours (1–720). 24 if left out.
      required: false
      default: 24
      selector:
        number:
          min: 1
          max: 720
          mode: box
          unit_of_measurement: h
    entry_id:
      name: Kernel
      description: >-
        Which SecuraCV entry to export from, when more than one has a
        witness kernel. The only one if left out.
      required: false
      selector:
        config_entry:
          integration: securacv
